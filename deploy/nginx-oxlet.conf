# /etc/nginx/sites-available/oxlet
# แทน __DOMAIN__ ด้วยโดเมนจริง (เช่น oxlet.example.com) ก่อนใช้
# certbot --nginx จะเติม block listen 443 + redirect http->https ให้อัตโนมัติ

server {
    listen 80;
    server_name __DOMAIN__;

    # scan_doc รับรูป base64 ≤8MB (base64 พอง ~33%) + อัปรูปรถ cars/ → เผื่อ 15M
    client_max_body_size 15M;

    location /static/ {
        alias /opt/oxlet/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /opt/oxlet/media/;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django อ่าน header นี้รู้ว่าเป็น https (SECURE_PROXY_SSL_HEADER ใน settings.py)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
