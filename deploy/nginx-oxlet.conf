# /etc/nginx/sites-available/oxlet
# server_name = srv1793506.hstgr.cloud (hostname VPS ของ Hostinger) — แก้ถ้าใช้โดเมนอื่น
# certbot --nginx จะเติม block listen 443 + redirect http->https ให้อัตโนมัติ

server {
    listen 80;
    server_name srv1793506.hstgr.cloud;

    # scan_doc รับรูป base64 ≤8MB (base64 พอง ~33%) → เผื่อ 20M เป็น default
    client_max_body_size 20M;

    location /static/ {
        alias /opt/oxlet/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /opt/oxlet/media/;
        expires 30d;
    }

    # อัปรูป/วิดีโอรถเข้า Google Drive — เผื่อวิดีโอใหญ่ (ตรงกับ GDRIVE_MAX_UPLOAD_MB=200)
    location = /track/api/upload {
        client_max_body_size 220M;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_request_buffering on;   # nginx รับ body ครบก่อนส่ง gunicorn (กัน worker ค้างนาน)
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django อ่าน header นี้รู้ว่าเป็น https (SECURE_PROXY_SSL_HEADER ใน settings.py)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
