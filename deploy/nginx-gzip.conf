# /etc/nginx/conf.d/oxlet-gzip.conf — บีบอัด JSON/CSS/JS ที่ส่งให้เบราว์เซอร์
#
# ★ 11 ต.ค.69 (เจ้าของถาม "โหลดนานเพราะอะไร")
#   nginx.conf ของเครื่องเปิด `gzip on` ไว้แล้ว แต่ `gzip_types` / `gzip_proxied` ถูกคอมเมนต์อยู่
#   → บีบเฉพาะ HTML · JSON จาก Django (ผ่าน proxy) ไม่ถูกบีบเลย
#   หน้า Connect ดึงรายชื่อ ~140 KB ทุก 8 วิ + แชททุก 6 วิ → บนมือถือ 4G ช้าเห็นได้ชัด
#
# ติดตั้ง (root · ครั้งเดียว · ไม่ต้องแก้ไฟล์ของ certbot):
#   cp /opt/oxlet/deploy/nginx-gzip.conf /etc/nginx/conf.d/oxlet-gzip.conf
#   nginx -t && systemctl reload nginx
# ไฟล์นี้อยู่ระดับ http → มีผลกับทุกเว็บบนเครื่อง (รวมเว็บโชว์รูม) · ไม่ใส่รูป/วิดีโอ (บีบแล้วไม่เล็กลง)

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css text/plain text/javascript image/svg+xml;
