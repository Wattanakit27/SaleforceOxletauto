# /etc/nginx/sites-available/n8n — n8n บนเครื่อง SaleForce (ย้ายมาจาก srv1102218 ต.ค.69)
# move.sh prepare แทน __DOMAIN__ ด้วยชื่อจริง แล้วสั่ง certbot --nginx เติม block 443 + redirect ให้เอง
#
# ★ ฟังเฉพาะ IPv4 (listen 80) เหมือน block ของ SaleForce — ถ้าใส่ [::]:80 ที่นี่ที่เดียว certbot จะเติม
#   [::]:443 ให้ block นี้ แล้วผู้ใช้ที่เข้าเว็บ SaleForce ทาง IPv6 อาจได้หน้า n8n แทน
server {
    listen 80;
    server_name __DOMAIN__;

    client_max_body_size 128M;     # = N8N_PAYLOAD_SIZE_MAX (ไฟล์แนบ/รูปที่ webhook รับ)

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        # หน้าแก้ workflow คุยกับเซิร์ฟเวอร์ผ่าน websocket (/rest/push) — ขาด 2 บรรทัดนี้ = หน้าจอค้าง "Connection lost"
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;   # workflow ที่ตอบ webhook ช้า (เรียก AI) ต้องไม่ถูกตัด
        proxy_send_timeout 600s;
    }
}
