<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oxlet Connect · TikTok Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* หน้าสาธิตสำหรับอัดวิดีโอส่ง TikTok (Accounts API Access Application Form ข้อ 8)
   ข้อมูลทั้งหมดเป็นตัวอย่าง ไม่ได้ต่อ API จริง · กด → / ← เพื่อเลื่อนขั้น · กด H ซ่อนแถบคำอธิบาย */
:root{
  --brand:#623e94; --brand-d:#4a2c73; --brand-l:#f0e9f9; --brand-m:#a78bd4;
  --bg:#f4f2f8; --card:#ffffff; --line:#e3ddeb; --text:#1f1a29; --muted:#6c6478;
  --ok:#15803d; --ok-l:#e7f6ec; --warn:#b45309; --warn-l:#fdf3e1; --bad:#b91c1c; --bad-l:#fdeaea;
  --c-line:#06C755; --c-fb:#1877F2; --c-tt:#111111;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;
  color:var(--text);background:var(--bg);display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
select,textarea{font:inherit}

/* แถบคำอธิบายขั้นตอน */
#guide{background:var(--brand-d);color:#fff;display:flex;align-items:center;gap:16px;padding:12px 20px;flex-shrink:0}
#guide.off{display:none}
#guide .lbl{font-weight:700;white-space:nowrap;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:7px;font-size:13px}
#guide .cap{flex:1;font-size:15.5px;line-height:1.45}
#guide .nav{display:flex;gap:8px;align-items:center;white-space:nowrap}
#guide .nav button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:6px 14px;border-radius:7px}
#guide .nav button.pri{background:#fff;color:var(--brand-d);border-color:#fff;font-weight:600}
#guide .nav button:disabled{opacity:.35;cursor:default}
#guide .cnt{font-size:12px;opacity:.75;min-width:44px;text-align:right}

.app{flex:1;display:flex;min-height:0}
aside{width:224px;background:var(--brand);color:#fff;display:flex;flex-direction:column;padding:16px 12px;flex-shrink:0}
aside .logo{display:block;width:180px;margin:2px auto 6px;border-radius:8px}
aside .app-name{text-align:center;font-weight:600;font-size:13px;opacity:.85;margin-bottom:18px}
aside .nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:rgba(255,255,255,.82);margin-bottom:4px}
aside .nv.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
aside .nv svg{width:18px;height:18px;flex-shrink:0}
aside .nv .n{margin-left:auto;background:#fff;color:var(--brand);font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px}
aside .grow{flex:1}
aside .me{background:rgba(0,0,0,.18);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.5}
aside .me b{font-size:13.5px}
aside .proto{margin-top:10px;font-size:11.5px;text-align:center;opacity:.7}

main{flex:1;min-width:0;overflow:auto;padding:22px 26px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}

/* ป้ายช่องทาง */
.ch{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:5px;color:#fff;white-space:nowrap}
.ch.line{background:var(--c-line)} .ch.fb{background:var(--c-fb)} .ch.tiktok{background:var(--c-tt)}
.tag{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:5px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-l);color:var(--ok)} .tag.warn{background:var(--warn-l);color:var(--warn)}
.tag.bad{background:var(--bad-l);color:var(--bad)} .tag.mut{background:#eeeaf3;color:var(--muted)}
.tag.br{background:var(--brand-l);color:var(--brand-d)}

/* กล่องข้อความ */
.inbox{display:grid;grid-template-columns:380px minmax(0,1fr);gap:16px;height:calc(100% - 64px);min-height:540px}
.qwrap{display:flex;flex-direction:column;min-height:0}
.chips{display:flex;gap:6px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.chips span{font-size:12.5px;padding:4px 10px;border-radius:7px;background:#f1edf6;color:var(--muted)}
.chips span.on{background:var(--brand);color:#fff;font-weight:600}
.q{overflow:auto;flex:1}
.row{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .3s}
.row:hover{background:#faf8fd}
.row.sel{background:var(--brand-l);box-shadow:inset 3px 0 0 var(--brand)}
.row.new{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:#e4d6f7}100%{background:transparent}}
.row.dim{opacity:.55}
.av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px}
.row .body{flex:1;min-width:0}
.row .top{display:flex;align-items:center;gap:6px}
.row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tm{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.row .pv{color:var(--muted);font-size:13px;margin:3px 0 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .st{display:flex;gap:6px;flex-wrap:wrap}

.det{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.det .hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.det .hd .nm{font-weight:700;font-size:15.5px}
.det .hd .meta{color:var(--muted);font-size:12.5px}
.det .hd .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.det .sc{flex:1;overflow:auto;padding:16px}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted)}

.video{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:16px}
.thumb{width:76px;height:100px;border-radius:8px;background:linear-gradient(160deg,#3b2a55,#7e5bb5);position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.thumb svg{width:40px;height:40px;opacity:.9}
.thumb .dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;padding:1px 5px;border-radius:4px}
.video .vt{font-weight:600;margin-bottom:3px}
.video .vm{color:var(--muted);font-size:12.5px}

.cm{display:flex;gap:10px;margin-bottom:12px}
.cm .bub{background:#f4f1f8;border-radius:10px;padding:10px 12px;max-width:560px}
.cm .who{font-weight:600;font-size:13px;margin-bottom:2px}
.cm .en{color:var(--muted);font-size:12.5px;font-style:italic;margin-top:4px}
.cm .when{font-size:11.5px;color:var(--muted);margin-top:5px}
.cm.reply{margin-left:48px}
.cm.reply .bub{background:var(--brand-l);border:1px solid #ddd0f0}
.cm.hidden .bub{opacity:.45;text-decoration:line-through}
.posted{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0 48px}

.act{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.act .line1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.act label{font-size:13px;color:var(--muted)}
.act select{border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:#fff;min-width:180px}
.act textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;resize:none;height:76px;background:#fff}
.act .line2{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.act .hint{margin-right:auto;font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 14px;border-radius:7px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.dan{border-color:#f0c9c9;color:var(--bad)}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(98,62,148,.45)}50%{box-shadow:0 0 0 7px rgba(98,62,148,0)}}
.btn.dan.pulse{animation:pulseR 1.4s ease-in-out infinite}
@keyframes pulseR{0%,100%{box-shadow:0 0 0 0 rgba(185,28,28,.4)}50%{box-shadow:0 0 0 7px rgba(185,28,28,0)}}

.log{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px}
.log h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.log div{font-size:12.5px;color:var(--muted);padding:3px 0;display:flex;gap:10px}
.log div b{color:var(--text);font-weight:600;min-width:42px}

/* บัญชี */
.accts{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;max-width:900px}
.acct{padding:18px}
.acct .top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.acct .h{font-weight:700;font-size:15.5px}
.acct .meta{color:var(--muted);font-size:12.5px}
.perm{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.note{max-width:900px;margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--brand-l);color:var(--brand-d);font-size:13px}

/* หน้าต่างก่อนส่งไป TikTok */
#modal{position:fixed;inset:0;background:rgba(25,15,40,.45);display:none;align-items:center;justify-content:center;z-index:50}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:14px;width:min(520px,92vw);padding:24px}
#modal h3{margin:0 0 6px;font-size:18px}
#modal p{margin:0 0 12px;color:var(--muted)}
#modal ul{margin:0 0 14px;padding-left:20px;line-height:1.9}
#modal .ph{border:1px dashed var(--brand-m);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--brand-d);background:#faf7fe;margin-bottom:16px}
#modal .ft{display:flex;justify-content:flex-end;gap:8px}

/* รายงาน */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;margin-bottom:16px}
.kp{padding:16px 18px}
.kp .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.kp .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.kp .grid div{background:#f8f6fb;border-radius:8px;padding:8px 10px}
.kp .grid small{display:block;color:var(--muted);font-size:11.5px}
.kp .grid b{font-size:17px}
.chart{padding:16px 18px;margin-bottom:16px}
.chart h3,.tbl h3{margin:0 0 4px;font-size:15px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tbl{padding:16px 18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #f0ecf4}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}

/* ตั้งค่า */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;max-width:1100px}
.two .card{padding:18px}
.two h3{margin:0 0 10px;font-size:15px}
.chk{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f0ecf4;font-size:13.5px}
.chk:last-child{border-bottom:0}
.chk svg{width:18px;height:18px;color:var(--ok);flex-shrink:0;margin-top:2px}

@media (max-width:1100px){
  aside{width:64px;padding:12px 8px} aside .logo,aside .app-name,aside .me,aside .proto,aside .nv span,aside .nv .n{display:none}
  .inbox{grid-template-columns:300px minmax(0,1fr)}
}
@media (max-width:760px){
  #guide{flex-wrap:wrap} .inbox{grid-template-columns:1fr;height:auto} main{padding:16px}
}
</style>
</head>

  {lbl:'Step 4', view:'inbox', cap:'The reply is posted under the comment on TikTok and logged with who replied and how fast (within 5 minutes).'},
  {lbl:'Step 5', view:'inbox', cap:'Spam comments (here: someone selling fake views) can be hidden from our video.'},
  {lbl:'Step 5', view:'inbox', cap:'The comment is now hidden on TikTok. The action is logged and can be undone.'},
  {lbl:'Step 6', view:'insights', cap:'Account and video insights report how our own organic content performs, including how quickly comments were answered.'},
  {lbl:'Step 7', view:'settings', cap:'Access is limited by role. Comment data is deleted after 60 days, accounts can be disconnected at any time, and nothing is shared with third parties.'},
  {lbl:'Summary', view:'summary', cap:'How each TikTok permission is used in Oxlet Connect.'}
];
let F = 0;
let timerStart = 0;

function st(){
  return {
    connected: F >= 3,
    arrived: F >= 4,
    sel: (F >= 5 && F <= 8) ? 'tt1' : ((F >= 9 && F <= 10) ? 'tt3' : null),
    assigned: F >= 6,
    composing: F === 7,
    replied: F >= 8,
    hidden: F >= 10,
    mint: F === 7 || F === 8
  };
}

/* ---------------- ข้อมูลตัวอย่าง ---------------- */
const REPLY_TH = 'สวัสดีครับ City RS คันนี้ผ่อนเริ่มต้นประมาณ 8,900 บาท/เดือน (ขึ้นกับไฟแนนซ์) ดาวน์ 0 ปรึกษาได้ครับ ทักแชทมาได้เลย เดี๋ยวคำนวณให้ครับ';
const REPLY_EN = 'Hello! Installments for this City RS start at about 8,900 THB/month depending on the lender, and zero-down is possible. Send us a message and we\'ll calculate it for you.';
const Q = [
  {id:'tt1', ch:'tiktok', name:'@carlover_2569', col:'#2b2b2b', acct:'@oxletauto', video:'Honda City 2021 RS · 38,000 km', posted:'7 Oct 2026', views:'42,180 views', dur:'0:42',
   th:'ผ่อนเดือนละเท่าไหร่ครับ ดาวน์ 0 ได้ไหม', en:'How much per month? Can I put zero down?', at:'10:40'},
  {id:'tt2', ch:'tiktok', name:'@jay.bkk', col:'#444', acct:'@guru_jamesoxlet', video:'Toyota Yaris Ativ 2022', posted:'6 Oct 2026', views:'28,940 views', dur:'0:35',
   th:'ยังอยู่ไหมครับ รถอยู่สาขาไหน', en:'Is it still available? Which branch is it at?', at:'10:41'},
  {id:'tt3', ch:'tiktok', name:'@promo_views_99', col:'#6b6b6b', acct:'@oxletauto', video:'Honda City 2021 RS · 38,000 km', posted:'7 Oct 2026', views:'42,180 views', dur:'0:42',
   th:'รับปั๊มวิว ปั๊มไลก์ ราคาถูก ทักเลย 👉 bit.ly/xxxxx', en:'Selling cheap views and likes, with a link (spam)', at:'10:41', spam:true},
  {id:'ln1', ch:'line', name:'Kanya', col:'#06a64b', th:'รถคันนี้ยังอยู่ไหมคะ', en:'Is this car still available?', at:'10:28', owner:'Ploy', done:'Replied 1m 50s'},
  {id:'fb1', ch:'fb', name:'Somchai P.', col:'#1d63c9', th:'ขอตารางผ่อน Civic ปี 20 ครับ', en:'Can I get the installment table for the 2020 Civic?', at:'10:15', owner:'Nok', done:'Replied 3m 05s'}
];
const CHN = {line:'LINE', fb:'Facebook', tiktok:'TikTok'};
function chTag(c){ return `<span class="ch ${c}">${CHN[c]}</span>`; }
function av(q){ const ch = q.name.replace('@','').charAt(0).toUpperCase(); return `<div class="av" style="background:${q.col}">${ch}</div>`; }

/* ---------------- วาด ---------------- */
function render(){
  const f = FRAMES[F], s = st();
  document.getElementById('g-lbl').textContent = f.lbl;
  document.getElementById('g-cap').textContent = f.cap;
  document.getElementById('g-cnt').textContent = (F + 1) + ' / ' + FRAMES.length;
  document.getElementById('g-prev').disabled = F === 0;
  document.getElementById('g-next').disabled = F === FRAMES.length - 1;
  if (F < 4) timerStart = 0;
  if (F >= 4 && !timerStart) timerStart = Date.now();

  const waiting = s.mint ? (s.replied ? 0 : 1) : (s.arrived ? (s.replied ? 1 : 2) : 0);
  const navs = [['inbox','Inbox',IC.inbox,waiting],['accounts','Accounts',IC.link,0],['insights','Insights',IC.chart,0],['settings','Access & data',IC.shield,0]];
  const cur = f.view === 'summary' ? '' : f.view;
  document.getElementById('nav').innerHTML = navs.map(n =>
    `<div class="nv ${cur===n[0]?'on':''}">${n[2]}<span>${n[1]}</span>${n[3]?`<b class="n">${n[3]}</b>`:''}</div>`).join('');
  document.getElementById('me').innerHTML = s.mint
    ? 'Signed in as<br><b>Mint</b> · Sales'
    : 'Signed in as<br><b>Admin</b> · Oxlet Auto';

  const m = document.getElementById('main');
  if (f.view === 'inbox') m.innerHTML = inboxView(s);
  else if (f.view === 'accounts') m.innerHTML = accountsView(s);
  else if (f.view === 'insights') m.innerHTML = insightsView();
  else if (f.view === 'settings') m.innerHTML = settingsView();
  else m.innerHTML = summaryView();

  const md = document.getElementById('modal');
  md.className = f.modal ? 'on' : '';
  md.innerHTML = f.modal ? modalView() : '';
  tick();
}

function rowStatus(q, s){
  if (q.done) return `<span class="tag mut">${q.owner}</span><span class="tag ok">${q.done}</span>`;
  if (q.id === 'tt3') return s.hidden ? '<span class="tag mut">Hidden on TikTok</span>' : '<span class="tag warn">Not answered</span>';
  if (q.id === 'tt1') {
    let out = s.assigned ? '<span class="tag br">Mint</span>' : '<span class="tag mut">Unassigned</span>';
    out += s.replied ? '<span class="tag ok">Replied 2m 14s ✓</span>' : '<span class="tag warn tmr" data-off="0"></span>';
    return out;
  }
  return '<span class="tag mut">Unassigned</span><span class="tag warn tmr" data-off="60"></span>';
}

function inboxView(s){
  // เซลล์เห็นเฉพาะลูกค้าของตัวเอง (กติกาเดียวกับ Connect จริง)
  const items = s.mint ? Q.filter(q => q.id === 'tt1') : (s.arrived ? Q : Q.filter(q => q.ch !== 'tiktok'));
  const cnt = c => items.filter(q => q.ch === c).length;
  const rows = items.map(q => `
    <div class="row ${s.sel===q.id?'sel':''} ${(F===4&&q.ch==='tiktok')?'new':''} ${(q.id==='tt3'&&s.hidden)?'dim':''}" onclick="pick('${q.id}')">
      ${av(q)}
      <div class="body">
        <div class="top"><span class="nm">${q.name}</span>${chTag(q.ch)}<span class="tm">${q.at}</span></div>
        <div class="pv">${q.ch==='tiktok' ? 'Comment on '+q.acct+' · ' : ''}${q.th}</div>
        <div class="st">${rowStatus(q, s)}</div>
      </div>
    </div>`).join('');
  return `
    <h1>Inbox</h1>
    <p class="sub">${s.mint ? 'Mint sees only the customers assigned to her' : 'All customer conversations in one queue'} · target: answer within 5 minutes</p>
    <div class="inbox">
      <div class="card qwrap">
        <div class="chips"><span class="on">All ${items.length}</span><span>LINE ${cnt('line')}</span><span>Facebook ${cnt('fb')}</span><span>TikTok ${cnt('tiktok')}</span></div>
        <div class="q">${rows}</div>
      </div>
      <div class="card det">${s.sel ? detailView(Q.find(q => q.id === s.sel), s) : '<div class="empty">Select a conversation</div>'}</div>
    </div>`;
}

function detailView(q, s){
  const isSpam = q.id === 'tt3';
  const head = `
    <div class="hd">${av(q)}
      <div><div class="nm">${q.name} ${chTag('tiktok')}</div>
      <div class="meta">Public comment on a video from ${q.acct}</div></div>
      <div class="right">${isSpam
        ? (s.hidden ? '<span class="tag mut">Hidden on TikTok</span>' : '<span class="tag warn">Spam?</span>')
        : (s.replied ? '<span class="tag ok">Replied 2m 14s ✓ within 5 min</span>' : '<span class="tag warn tmr" data-off="0"></span>')}</div>
    </div>`;
  const video = `
    <div class="video"><div class="thumb">${IC.car}<span class="dur">${q.dur}</span></div>
      <div><div class="vt">${q.video}</div><div class="vm">${q.acct} · posted ${q.posted} · ${q.views}</div></div></div>`;
  let comments = `
    <div class="cm ${isSpam&&s.hidden?'hidden':''}">${av(q)}<div class="bub"><div class="who">${q.name}</div>${q.th}
      <div class="en">${q.en}</div><div class="when">Today ${q.at}</div></div></div>`;
  if (!isSpam && s.replied) {
    comments += `
      <div class="cm reply"><div class="av" style="background:var(--brand)">O</div><div class="bub"><div class="who">${q.acct} <span style="font-weight:400;color:var(--muted)">(replied by Mint)</span></div>${REPLY_TH}
        <div class="en">${REPLY_EN}</div><div class="when">Today 10:42</div></div></div>
      <div class="posted"><span class="tag ok">Posted on TikTok ✓</span><span class="tag mut">Response time 2m 14s</span></div>`;
  }
  let log = isSpam
    ? `<div><b>10:41</b>Comment received from TikTok</div>${s.hidden?'<div><b>10:43</b>Hidden on TikTok by Admin</div>':''}`
    : `<div><b>10:40</b>Comment received from TikTok · 5-minute timer started</div>
       ${s.assigned?'<div><b>10:41</b>Assigned to Mint by Admin</div>':''}
       ${s.replied?'<div><b>10:42</b>Replied by Mint · 2m 14s · within target</div>':''}`;
  let act;
  if (isSpam) {
    act = `<div class="act"><div class="line2">
      <span class="hint">Hiding removes the comment from public view on our video. It can be unhidden later.</span>
      ${s.hidden ? '<button class="btn" onclick="go(9)">Unhide</button>' : '<button class="btn dan pulse" onclick="go(10)">Hide comment</button>'}
      </div></div>`;
  } else {
    const opts = ['Unassigned','Mint','Ploy','Nok'].map(o => `<option ${((s.assigned&&o==='Mint')||(!s.assigned&&o==='Unassigned'))?'selected':''}>${o}</option>`).join('');
    act = `<div class="act">
      <div class="line1"><label>Assigned to</label>
        <select class="${F===5?'pulse':''}" onchange="if(this.value==='Mint'&&F===5)go(6)">${opts}</select>
        ${s.assigned?'<span class="tag br">Only Mint and admins can see this customer</span>':''}</div>
      <textarea placeholder="Write a public reply to this comment…" ${s.replied?'disabled':''}>${s.composing?REPLY_TH:''}</textarea>
      <div class="line2"><span class="hint">Replies are posted as ${q.acct} and logged with the staff member's name.</span>
        <button class="btn" ${F!==7?'disabled':''}>Save draft</button>
        <button class="btn pri ${F===7?'pulse':''}" ${s.replied||F<6?'disabled':''} onclick="if(F===6)go(7);else if(F===7)go(8)">Reply on TikTok</button>
      </div></div>`;
  }
  return head + `<div class="sc">${video}${comments}<div class="log"><h4>Activity</h4>${log}</div></div>` + act;
}

function accountsView(s){
  const A = [
    {h:'@oxletauto', n:'Oxlet Auto · Business Account', c:'#111'},

function insightsView(){
  const days = ['2 Oct','3 Oct','4 Oct','5 Oct','6 Oct','7 Oct','8 Oct'];
  const a = [21000,24500,19800,31200,28400,33100,28400];
  const b = [8200,9100,10400,11800,9900,12600,12300];
  const W = 1100, H = 230, pad = 36, max = 35000, gw = (W - pad - 10) / days.length, bw = 22;
  let bars = '', grid = '';
  [0,10000,20000,30000].forEach(v => {
    const y = H - 24 - (v / max) * (H - 40);
    grid += `<line x1="${pad}" x2="${W-6}" y1="${y}" y2="${y}" stroke="#ece7f2"/><text x="${pad-6}" y="${y+4}" font-size="11" fill="#8a8296" text-anchor="end">${v/1000}k</text>`;
  });
  days.forEach((d, i) => {
    const x = pad + i * gw + gw / 2;
    const ha = (a[i] / max) * (H - 40), hb = (b[i] / max) * (H - 40);
    bars += `<rect x="${x-bw-1}" y="${H-24-ha}" width="${bw}" height="${ha}" rx="4" fill="#623e94"/>`;
    bars += `<rect x="${x+1}" y="${H-24-hb}" width="${bw}" height="${hb}" rx="4" fill="#b9a1dd"/>`;
    bars += `<text x="${x}" y="${H-6}" font-size="11.5" fill="#6c6478" text-anchor="middle">${d}</text>`;
  });
  const V = [
    ['Honda City 2021 RS · 38,000 km','@oxletauto','7 Oct','42,180','2,310','186','74','96%'],
    ['Toyota Yaris Ativ 2022','@guru_jamesoxlet','6 Oct','28,940','1,420','133','40','91%'],
    ['Honda Civic FE 2023','@oxletauto','5 Oct','25,600','1,280','97','35','94%'],
    ['Isuzu D-Max 2020 · zero down','@oxletauto','4 Oct','19,850','905','121','28','88%'],
    ['Mazda 2 2019','@guru_jamesoxlet','3 Oct','14,300','610','64','17','92%']
  ];
  const kp = (h, n, vals) => `
    <div class="card kp"><div class="top"><div class="av" style="background:#111">${h.charAt(1).toUpperCase()}</div>
      <div><b>${h}</b> ${chTag('tiktok')}<div class="sub" style="margin:0;font-size:12.5px">${n}</div></div></div>
      <div class="grid">${[['Followers',vals[0]],['Video views',vals[1]],['Likes',vals[2]],['Comments',vals[3]],['Shares',vals[4]]]
        .map(x => `<div><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div></div>`;
  return `
    <h1>Insights · TikTok</h1>
    <p class="sub">Our own organic content · last 7 days (2–8 Oct 2026)</p>
    <div class="kpis">
      ${kp('@oxletauto','Oxlet Auto',['48,200','186,400','9,870','1,204','412'])}
      ${kp('@guru_jamesoxlet','Guru James Oxlet',['21,600','74,300','3,950','488','131'])}
    </div>
    <div class="card chart"><h3>Daily video views</h3>
      <div class="legend"><span><i style="background:#623e94"></i>@oxletauto</span><span><i style="background:#b9a1dd"></i>@guru_jamesoxlet</span></div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid}${bars}</svg></div>
    <div class="card tbl"><h3>Top videos</h3>
      <table><thead><tr><th>Video</th><th>Account</th><th>Posted</th><th class="n">Views</th><th class="n">Likes</th><th class="n">Comments</th><th class="n">Shares</th><th class="n">Questions answered ≤ 5 min</th></tr></thead>
      <tbody>${V.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td>${r.slice(3).map(c => `<td class="n">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

  const ok = t => `<div class="chk">${IC.check}<div>${t}</div></div>`;

    <p class="sub">How TikTok data is protected inside Oxlet Connect</p>
    <div class="two">
      <div class="card"><h3>Who can see what</h3>

function summaryView(){
  const R = [
    ['Account profile & statistics','Show which company accounts are connected; followers in Insights','Step 1 · Step 6'],
    ['Video list & video insights','Report views, likes, comments and shares of our own videos','Step 6'],
    ['Read comments','Bring customer questions into the shared Inbox with a 5-minute timer','Step 2 · Step 3'],

      <tbody>${R.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div>
    <div class="note">Used only by Oxlet Auto employees, only on accounts owned by Oxlet Auto. This recording shows a prototype with sample data.</div>`;
}

/* ---------------- นาฬิกานับถอยหลัง 5 นาที ---------------- */
function tick(){
  const el = document.querySelectorAll('.tmr');
  if (!el.length || !timerStart) return;
  el.forEach(e => {
    const off = +e.dataset.off || 0;
    const left = Math.max(0, 300 - Math.floor((Date.now() - timerStart) / 1000) - off);
    const mm = Math.floor(left / 60), ss = String(left % 60).padStart(2, '0');
    e.textContent = left > 0 ? `${mm}:${ss} left to reply` : 'Over 5 min';
    e.className = 'tag tmr ' + (left > 60 ? 'warn' : 'bad');
  });
}
setInterval(tick, 1000);

/* ---------------- ควบคุม ---------------- */
function go(i){ F = Math.max(0, Math.min(FRAMES.length - 1, i)); render(); }
function pick(id){
  if (id === 'tt1' && F === 4) go(5);
  else if (id === 'tt3' && F === 8) go(9);
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(F + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(F - 1); }
  else if (e.key === 'h' || e.key === 'H') document.getElementById('guide').classList.toggle('off');
});
render();
</script>
