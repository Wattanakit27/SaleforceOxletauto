{% load static %}<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect · Oxlet</title>
<link rel="icon" type="image/png" href="{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'dashboard/css/globals.css' %}?v=20260920b">
<script>
  // ธีมเดียวกับแดชบอร์ด (คีย์ oxlet_theme) — ตั้งก่อน paint กันจอกระพริบ
  (function(){
    try {
      var t = localStorage.getItem('oxlet_theme');
      if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e) { document.documentElement.setAttribute('data-theme','light'); }
  })();
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Noto Sans Thai', sans-serif; background: var(--bg2); color: var(--t1);
         font-size: var(--fs-body); overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .ic { width: 16px; height: 16px; flex-shrink: 0; vertical-align: -3px; }

  /* ── หัวหน้า ── */
  html { --th: 50px; }
  html.embed { --th: 44px; }
  .cn-top { height: var(--th); display: flex; align-items: center; gap: 10px; padding: 0 16px;
            background: var(--bg); border-bottom: .5px solid var(--bd2); }
  .cn-back { display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 8px;
             border: .5px solid var(--bd2); background: var(--bg2); color: var(--t2); text-decoration: none; }
  .cn-title { font-size: var(--fs-h); font-weight: 800; display: flex; align-items: center; gap: 7px; }
  .cn-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 7px;
             border: .5px solid var(--bd2); background: var(--bg2); color: var(--t2); white-space: nowrap; }
  .cn-chip b { color: var(--t1); }
  .cn-chip.on { background: var(--green-bg); color: var(--green); border-color: var(--green); }
  .cn-chip.on b { color: var(--green); }
  .cn-sp { flex: 1; }
  html.embed .cn-back { display: none; }

  .cn-banners:empty { display: none; }
  .cn-banner { display: flex; gap: 8px; align-items: flex-start; padding: 8px 16px; border-bottom: .5px solid var(--bd); }
  .cn-banner.err { background: var(--red-bg); color: var(--red); }
  .cn-banner.warn { background: var(--amber-bg); color: var(--amber); }
  .cn-banner code { background: rgba(0,0,0,.06); padding: 1px 6px; border-radius: 5px; font-size: 12px; }
  /* โหมดทดสอบ — แถบบอกตลอดว่ากำลังใช้บัญชีจำลอง (กันลืมว่ากดอะไรไปในนามใคร) */
  .cn-test { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 16px; background: var(--blue-bg);
             color: var(--blue); border-bottom: .5px solid var(--blue); }
  .cn-test b { color: var(--blue-dk); }
  .cn-sim { margin: 0 16px 6px; padding: 5px 8px; border: 1px dashed var(--amber-mid); border-radius: 8px; background: var(--amber-bg);
            display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--amber); }
  .cn-sim input { flex: 1; min-width: 140px; padding: 5px 10px; border-radius: 8px; border: .5px solid var(--bd2); background: var(--bg); }
  .tag.sim { background: var(--amber-bg); color: var(--amber); }

  /* ── 2 ช่อง: รายชื่อ | แชท ── */
  .cn-main { display: grid; grid-template-columns: 350px minmax(0,1fr); height: calc(100% - var(--th) - var(--bh, 0px)); }
  .cn-tool { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 8px; border: .5px solid var(--bd2);
             background: var(--bg2); color: var(--t2); cursor: pointer; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .cn-tool.on { background: var(--blue); color: var(--on-blue); border-color: var(--blue); }
  html:not(.embed) .embed-only { display: none; }
  .cn-list { display: flex; flex-direction: column; min-height: 0; background: var(--bg); border-right: .5px solid var(--bd2); }
  .cn-tabs { display: flex; gap: 4px; padding: 8px 10px 6px; flex-wrap: wrap; }
  .cn-tab { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 8px; border: .5px solid var(--bd2);
            background: var(--bg2); color: var(--t2); cursor: pointer; font-weight: 600; }
  .cn-tab.on { background: var(--blue); color: var(--on-blue); border-color: var(--blue); }
  .cn-tab .n { min-width: 18px; padding: 0 5px; border-radius: 5px; background: var(--bg3); color: var(--t2); font-size: 12px; text-align: center; }
  .cn-tab.on .n { background: rgba(255,255,255,.25); color: var(--on-blue); }
  .cn-tab .n.hot { background: var(--red); color: #fff; }
  .cn-tools { display: flex; gap: 6px; padding: 0 10px 8px; }
  .cn-tools input, .cn-tools select { flex: 1; min-width: 0; padding: 7px 10px; border-radius: 8px; border: .5px solid var(--bd2);
                                      background: var(--bg2); }
  .cn-note { margin: 4px 10px 8px; padding: 10px 12px; border-radius: 8px; background: var(--amber-bg); color: var(--amber); line-height: 1.6; }
  .cn-rows { flex: 1; overflow-y: auto; border-top: .5px solid var(--bd); }
  .cn-row { display: flex; gap: 10px; padding: 11px 12px; border-bottom: .5px solid var(--bd); cursor: pointer; align-items: flex-start; }
  .cn-row:hover { background: var(--bg2); }
  .cn-row.sel { background: var(--blue-bg); }
  .cn-row.late { box-shadow: inset 3px 0 0 var(--red); }
  .cn-av { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
           font-weight: 800; color: #fff; background: var(--blue); position: relative; overflow: hidden; }
  /* รูปโปรไฟล์ LINE วางทับตัวอักษร — โหลดไม่ขึ้น (ลิงก์ตาย) = this.remove() แล้วเห็นตัวอักษรที่รออยู่ข้างหลัง */
  .cn-av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cn-av.lg { width: 76px; height: 76px; font-size: 28px; }
  .cn-rb { flex: 1; min-width: 0; }
  .cn-rh { display: flex; gap: 6px; align-items: baseline; }
  .cn-rn { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .cn-rt { color: var(--t3); font-size: 12px; white-space: nowrap; }
  .cn-rp { color: var(--t2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .cn-rp.out { color: var(--t3); }
  .cn-rm { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 5px; font-size: 12px; font-weight: 700;
         background: var(--bg3); color: var(--t2); white-space: nowrap; }
  .tag.team { color: #fff; }
  .tag.wait { background: var(--amber-bg); color: var(--amber); }
  .tag.late { background: var(--red); color: #fff; }
  .tag.ok { background: var(--green-bg); color: var(--green); }
  .tag.q { background: var(--blue-bg); color: var(--blue); }
  /* ช่องทางที่ลูกค้าทักมา — LINE / Facebook (4 ต.ค.69 · รวมคิวเดียวกัน) */
  .tag.ch-line { background: #06c755; color: #fff; }
  .tag.ch-fb { background: #1877f2; color: #fff; }
  .tag.ch-tt { background: #111; color: #fff; }
  .tag.ch-ot { background: var(--t3); color: #fff; }
  .cn-empty { text-align: center; color: var(--t3); padding: 40px 20px; line-height: 1.7; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px;
         border: .5px solid var(--bd2); background: var(--bg2); color: var(--t1); cursor: pointer; font-weight: 700; white-space: nowrap; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.pri { background: var(--blue); color: var(--on-blue); border-color: var(--blue); }
  .btn.red { background: var(--red-bg); color: var(--red); border-color: var(--red); }
  .btn.sm { padding: 4px 10px; font-size: 12px; }
  a.btn { text-decoration: none; }

  /* ── ช่องขวา ── */
  .cn-pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .cn-ph { padding: 8px 16px; background: var(--bg); border-bottom: .5px solid var(--bd2); }
  .cn-ph-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .cn-ph-who { min-width: 160px; flex: 1; }
  .cn-ph h2 { margin: 0; font-size: var(--fs-sub); font-weight: 800; }
  .cn-sub { color: var(--t3); margin-top: 2px; }
  .cn-acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: flex-end; margin-left: auto; }
  .cn-acts .btn { padding: 6px 11px; }
  .cn-acts select { padding: 7px 10px; border-radius: 8px; border: .5px solid var(--bd2); background: var(--bg2); max-width: 220px; }
  .cn-clock { display: inline-flex; gap: 4px; align-items: center; padding: 1px 8px; border-radius: 6px; font-weight: 700;
              font-size: 12px; white-space: nowrap; vertical-align: 1px; }
  .cn-clock.wait { background: var(--amber-bg); color: var(--amber); }
  .cn-clock.late { background: var(--red-bg); color: var(--red); }
  .cn-hist { margin-top: 8px; color: var(--t2); max-height: 160px; overflow-y: auto; }
  .cn-hist div { padding: 3px 0; border-bottom: .5px dashed var(--bd); }
  .cn-msgs { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .cn-day { align-self: center; color: var(--t3); font-size: 12px; padding: 2px 10px; border-radius: 6px; background: var(--bg3); margin: 8px 0 2px; }
  .bub { max-width: min(560px, 82%); padding: 8px 12px; border-radius: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .bub.in { align-self: flex-start; background: var(--bg); border: .5px solid var(--bd2); border-bottom-left-radius: 4px; }
  .bub.out { align-self: flex-end; background: var(--blue); color: var(--on-blue); border-bottom-right-radius: 4px; }
  .bub .meta { font-size: 11px; opacity: .7; margin-top: 3px; }
  .bub.out .meta { text-align: right; }
  .bub.media { font-style: italic; opacity: .85; }
  .cn-lock { margin: 0 16px; padding: 10px 12px; border-radius: 8px; background: var(--blue-bg); color: var(--blue); line-height: 1.6; }
  .cn-comp { display: flex; gap: 8px; padding: 8px 16px 10px; background: var(--bg); border-top: .5px solid var(--bd2); align-items: flex-end; }
  .cn-comp textarea { flex: 1; resize: none; min-height: 40px; max-height: 160px; padding: 9px 12px; border-radius: 10px;
                      border: .5px solid var(--bd2); background: var(--bg2); line-height: 1.5; }
  .cn-comp-why { padding: 12px 16px; background: var(--bg); border-top: .5px solid var(--bd2); color: var(--t3); }
  .cn-err { color: var(--red); padding: 0 16px 8px; background: var(--bg); }
  .cn-blank { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--t3); padding: 30px; line-height: 1.8; }

  /* ── แชท | โปรไฟล์ลูกค้า ── */
  .cn-chat { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) 300px; }
  .cn-chat.noside { grid-template-columns: minmax(0,1fr); }
  .cn-chat.noside .cn-side { display: none; }
  .cn-cmain { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .cn-side { border-left: .5px solid var(--bd2); background: var(--bg); overflow-y: auto; padding: 16px; }
  .cn-prof-m { display: none; margin-top: 10px; }
  .cn-prof-m > summary { cursor: pointer; color: var(--blue); font-weight: 700; }
  .pf-top { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding-bottom: 12px;
            border-bottom: .5px solid var(--bd); }
  .pf-name { font-size: var(--fs-sub); font-weight: 800; word-break: break-word; }
  .pf-line { color: var(--t3); font-size: 12px; }
  .pf-status { color: var(--t2); font-style: italic; line-height: 1.5; word-break: break-word; }
  .pf-sec { padding: 12px 0; border-bottom: .5px solid var(--bd); }
  .pf-sec:last-child { border-bottom: 0; }
  .pf-h { color: var(--t3); font-size: 12px; font-weight: 700; margin-bottom: 6px; }
  .pf-kv { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .pf-kv span:first-child { color: var(--t3); }
  .pf-kv span:last-child { text-align: right; }
  .pf-ph { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  .pf-ph a.num { font-weight: 800; color: var(--t1); text-decoration: none; letter-spacing: .3px; flex: 1; }
  .pf-need { padding: 7px 9px; border-radius: 8px; background: var(--bg2); margin-bottom: 6px; line-height: 1.5; }
  .pf-need b { display: block; }
  .pf-lock { color: var(--t3); line-height: 1.6; }
  /* ฟอร์มข้อมูลลีด (ช่องเดียวกับชีตลีด) */
  .pf-fld { margin: 7px 0; }
  .pf-lab { display: flex; justify-content: space-between; align-items: center; gap: 6px; color: var(--t3); font-size: 12px; margin-bottom: 3px; }
  .pf-lab > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pf-auto { font-size: 10.5px; padding: 0 5px; border-radius: 5px; background: var(--blue-bg); color: var(--blue); white-space: nowrap; }
  .pf-fld input[type=text], .pf-fld input[type=tel], .pf-fld textarea, .pf-fld select {
    width: 100%; padding: 6px 9px; border-radius: 7px; border: .5px solid var(--bd2); background: var(--bg2); font-size: 13px; }
  .pf-fld select { padding: 5px 6px; color: var(--t1); }
  .pf-fld select.empty { color: var(--t3); }
  .pf-fld textarea { resize: vertical; min-height: 54px; line-height: 1.5; }
  .pf-fld input:disabled, .pf-fld textarea:disabled, .pf-fld select:disabled { opacity: .75; }
  .pf-fld.ok input, .pf-fld.ok textarea, .pf-fld.ok select { border-color: var(--green); }
  .pf-note { font-size: 12px; color: var(--t3); margin: -2px 0 4px; }
  .pf-fld .bad { border-color: var(--red) !important; }
  .pf-g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
  .pf-name-row { display: flex; align-items: center; gap: 4px; justify-content: center; }
  .pf-pen { border: 0; background: none; color: var(--green); cursor: pointer; font-size: 15px; padding: 2px 4px; }
  .pf-name-in { width: 100%; padding: 5px 8px; border-radius: 7px; border: .5px solid var(--blue); background: var(--bg); text-align: center; font-weight: 700; }
  .pf-tags { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 4px; }
  .pf-tag { display: inline-flex; gap: 4px; align-items: center; padding: 2px 8px; border-radius: 6px; background: var(--green-bg);
            color: var(--green); font-size: 12px; font-weight: 700; }
  .pf-tag button { border: 0; background: none; color: inherit; cursor: pointer; padding: 0; font-size: 13px; line-height: 1; }
  .pf-tag-in { width: 110px; padding: 2px 8px; border-radius: 6px; border: .5px dashed var(--green); background: none; color: var(--green);
               font-size: 12px; font-weight: 700; }
  .pf-phs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .pf-phc { border: .5px solid var(--bd2); background: var(--bg); border-radius: 6px; padding: 1px 7px; font-size: 12px; cursor: pointer; color: var(--t2); }
  .pf-slip pre { white-space: pre-wrap; word-break: break-word; background: var(--bg2); border-radius: 8px; padding: 8px 10px;
                 font-size: 12px; line-height: 1.6; margin: 6px 0; font-family: inherit; }
  .pf-src { font-size: 12px; color: var(--blue); background: var(--blue-bg); border-radius: 7px; padding: 5px 8px; margin-bottom: 6px; }
  /* ปุ่มจ่ายเบอร์ (ส่งเข้ากลุ่มจ่ายเบอร์จริง · สวิตช์ปิด = ทดลอง) */
  .pf-assign { border: 1px dashed var(--blue); border-radius: 10px; padding: 10px; margin: 10px 0; background: var(--bg); }
  .pf-assign select { width: 100%; padding: 6px 8px; border-radius: 7px; border: .5px solid var(--bd2); background: var(--bg2); font-size: 13px; }
  .pf-assign label.ck { display: flex; gap: 6px; align-items: center; margin: 5px 0; font-size: 13px; }
  .pf-code { font-size: var(--fs-sub); font-weight: 800; letter-spacing: .4px; color: var(--blue-dk); }
  .pf-done { font-size: 12px; color: var(--green); background: var(--green-bg); border-radius: 7px; padding: 5px 8px; margin: 6px 0; }
  .pf-skip { font-size: 12px; color: var(--t2); background: var(--bg2); border-radius: 7px; padding: 6px 8px; margin: 6px 0;
             display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pf-assign.flash { outline: 2px solid var(--blue); outline-offset: 2px; }
  .tag.code { background: var(--blue-bg); color: var(--blue-dk); }
  .cn-hint { margin: 0 10px 8px; color: var(--t3); font-size: 12px; line-height: 1.5; }
  /* ห้องพัก Lead (กลุ่ม "ADMIN เก็บ Lead") — ลีดที่พักใบร่างไว้ ยังไม่ได้เลข/เซลล์ · บนสุดของแท็บจ่ายเบอร์ */
  .cn-park { border-bottom: .5px solid var(--bd2); background: var(--amber-bg); }
  .cn-park-h { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; padding: 9px 12px 6px; font-weight: 700; color: var(--amber); }
  .cn-park-h small { font-weight: 400; color: var(--t3); }
  .cn-prow { padding: 8px 12px; border-top: .5px solid var(--bd); background: var(--bg); }
  .cn-prow > summary { list-style: none; cursor: pointer; }
  .cn-prow > summary::-webkit-details-marker { display: none; }
  .cn-prow .pv { margin-top: 6px; padding: 6px 8px; border-radius: 7px; background: var(--bg2); font-size: 12px; line-height: 1.6; }
  .cn-park-f { padding: 6px 12px 8px; color: var(--t3); font-size: 12px; }
  /* ห้องพัก Lead: สลับ รอจ่ายเบอร์ / จ่ายแล้ว + แถบสรุปจ่ายให้ใคร */
  .hub-seg { display: inline-flex; gap: 4px; flex-wrap: wrap; margin-left: 4px; font-weight: 600; }
  .hub-sum { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px; }
  .hub-sel { border: .5px solid var(--bd2); background: var(--bg); color: var(--t2); border-radius: 7px; padding: 3px 9px;
             cursor: pointer; font-size: 13px; }
  .hub-sel b { color: var(--blue-dk); }
  .hub-sel.on { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
  .hub-sel.on b { color: var(--on-blue); }
  .hub-to { margin-top: 3px; color: var(--t2); }
  .hub-to b { color: var(--blue-dk); font-size: var(--fs-sub); }
  .cn-sep { padding: 6px 12px; font-size: 12px; font-weight: 700; color: var(--t3); background: var(--bg2); border-bottom: .5px solid var(--bd); }
  /* ห้องพัก Lead เต็มจอ (4 ต.ค.69 · เจ้าของ "ห้องพักลีดเป็นหน้าจอใหญ่ๆ เต็มๆ") — ไม่มีช่องแชทขวา · ลีดเป็นการ์ดหลายคอลัมน์
     กดลีดแชท = แชทเต็มจอแทนบอร์ด (ปุ่ม "← ห้องพัก Lead" กลับ) · class `hub` ใส่ที่ #cn-main ใน applyHub() */
  .hub-only { display: none; }
  .cn-main.hub .hub-only { display: inline; }
  .cn-main.hub { grid-template-columns: minmax(0,1fr); }
  .cn-main.hub .cn-pane { display: none; }
  body.pane .cn-main.hub .cn-pane { display: flex; }
  body.pane .cn-main.hub .cn-list { display: none; }
  .cn-main.hub .cn-mback { display: inline-flex; }
  .cn-main.hub .cn-list { border-right: 0; }
  .cn-main.hub .cn-tools { max-width: 640px; }
  .cn-main.hub .cn-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 10px;
                          padding: 12px; align-content: start; align-items: start; background: var(--bg2); }
  .cn-main.hub .cn-rows > .cn-park, .cn-main.hub .cn-rows > .cn-empty { grid-column: 1 / -1; border: .5px solid var(--bd2); border-radius: 10px; }
  .cn-main.hub .cn-rows > .cn-empty { background: var(--bg); }
  .cn-main.hub .cn-rows > .cn-row, .cn-main.hub .cn-rows > .cn-prow { border: .5px solid var(--bd2); border-radius: 10px; background: var(--bg); padding: 12px; }
  .cn-main.hub .cn-rows > .cn-row:hover, .cn-main.hub .cn-rows > .cn-prow:hover { border-color: var(--blue); }
  .cn-main.hub .cn-rows > .cn-prow[open] { border-color: var(--blue); box-shadow: var(--shadow); }
  @media (max-width: 1180px) {
    .cn-chat { grid-template-columns: minmax(0,1fr); }
    .cn-side { display: none; }
    .cn-prof-m { display: block; }
    .wide-only { display: none !important; }
  }

  /* ── ตั้งค่า / สถิติ ── */
  .cn-page { flex: 1; overflow-y: auto; padding: 16px; }
  .card { background: var(--bg); border: .5px solid var(--bd); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; max-width: 920px; }
  .card h3 { margin: 0 0 4px; font-size: var(--fs-sub); }
  .card .d { color: var(--t3); margin-bottom: 10px; line-height: 1.6; }
  .fld { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .fld label { min-width: 150px; color: var(--t2); }
  .fld input[type=number], .fld input[type=time], .fld select, .fld input[type=text] {
    padding: 7px 10px; border-radius: 8px; border: .5px solid var(--bd2); background: var(--bg2); }
  .ros { display: flex; gap: 5px; flex-wrap: wrap; }
  .ros button { width: 64px; padding: 6px 0; border-radius: 8px; border: .5px solid var(--bd2); background: var(--bg2);
                cursor: pointer; text-align: center; line-height: 1.3; position: relative; }
  .ros button b { display: block; font-size: var(--fs-sub); }
  .ros button.td { outline: 2px solid var(--blue); }
  .ros button .ov { position: absolute; top: 3px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--amber-mid); }
  table.st { border-collapse: collapse; width: 100%; }
  table.st th, table.st td { padding: 8px 10px; border-bottom: .5px solid var(--bd); text-align: right; white-space: nowrap; }
  table.st th:first-child, table.st td:first-child { text-align: left; }
  table.st th { color: var(--t3); font-weight: 600; }

  .spin { width: 22px; height: 22px; border: 3px solid var(--bd2); border-top-color: var(--blue); border-radius: 50%;
          animation: cnspin .8s linear infinite; margin: 0 auto 10px; }
  @keyframes cnspin { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--t1); color: var(--bg);
           padding: 10px 16px; border-radius: 8px; z-index: 50; max-width: calc(100% - 32px); box-shadow: var(--shadow); }

  /* มือถือ: ทีละช่อง — รายชื่อ → แตะ → แชทเต็มจอ (กดกลับ) */
  .cn-mback { display: none; }
  @media (max-width: 860px) {
    .cn-main { grid-template-columns: minmax(0,1fr); }
    .cn-pane { display: none; }
    body.pane .cn-list { display: none; }
    body.pane .cn-pane { display: flex; }
    .cn-mback { display: inline-flex; }
    .cn-top { padding: 0 12px; gap: 8px; }
    .cn-top .hide-sm, .cn-sim .hide-sm { display: none; }
    /* ชื่อคนใช้งาน (มุมขวาบน) หดเป็น "…" ได้ — เดิมดันหน้าล้นจอแนวนอนบนมือถือ (ตอนฝังในแดชบอร์ด) */
    .cn-top #cn-me { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .cn-sim input { min-width: 0; }
    .cn-ph, .cn-msgs, .cn-comp { padding-left: 12px; padding-right: 12px; }
    .fld label { min-width: 0; width: 100%; }
  }
</style>
</head>
<body>
{% if error %}
  <div style="max-width:520px;margin:12vh auto;padding:0 16px">
    <div class="card" style="text-align:center">
      <div style="font-size:var(--fs-h);font-weight:800;margin-bottom:8px">Connect</div>
      <div style="color:var(--t2);line-height:1.7;margin-bottom:14px">{{ error }}</div>
      <a class="btn" href="/dashboard/">กลับหน้าหลัก</a>
      <a class="btn" href="/logout/">ออกจากระบบ</a>
    </div>
  </div>
{% else %}
  <div class="cn-top">
    <a class="cn-back" id="cn-back" href="/dashboard/"><span data-ic="arrow-left"></span><span class="hide-sm" id="cn-back-t">แดชบอร์ด</span></a>
    <div class="cn-title"><span data-ic="message-circle"></span> Connect</div>
    <span class="cn-chip hide-sm" id="cn-duty">เวรวันนี้ …</span>
    <span class="cn-sp"></span>
    <span id="cn-tools-top" style="display:flex;gap:6px"></span>
    <a class="cn-tool embed-only" href="/connect/" target="_blank" title="เปิด Connect เต็มจอในแท็บใหม่">เต็มจอ ↗</a>
    <span class="cn-chip" id="cn-me"></span>
  </div>
  <div class="cn-banners" id="cn-banners"></div>
  <div class="cn-main" id="cn-main">
    <aside class="cn-list">
      <div class="cn-tabs" id="cn-tabs"></div>
      <div class="cn-tools" id="cn-tools">
        <input id="cn-q" type="search" placeholder="ค้นหาชื่อลูกค้า / ข้อความ" autocomplete="off">
        <select id="cn-src" title="ช่องทางที่ลูกค้าทักมา" style="flex:0 0 auto;width:auto">
          <option value="">ทุกช่องทาง</option><option value="line">LINE</option><option value="fb">Facebook</option>
        </select>
        <select id="cn-seller" style="display:none"></select>
      </div>
      <div id="cn-note"></div>
      <div class="cn-rows" id="cn-rows"><div class="cn-empty"><div class="spin"></div>กำลังโหลด…</div></div>
    </aside>
    <section class="cn-pane" id="cn-pane">
      <div class="cn-blank" id="cn-blank">เลือกลูกค้าทางซ้ายเพื่อเปิดแชท</div>
    </section>
  </div>
{% endif %}
{{ boot|json_script:"cn-boot" }}
<script>
(function () {
  const BOOT = JSON.parse((document.getElementById('cn-boot') || {}).textContent || '{}');
  if (!document.getElementById('cn-main')) return;          // หน้าแจ้ง error
  const ME = BOOT.me || {};
  const ADMIN = !!ME.admin;
  if (BOOT.embed) document.documentElement.classList.add('embed');

  // ── ตัวช่วย ──
  const h = s => (s === null || s === undefined) ? '' : String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const ICONS = {
    'message-circle': '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
    'arrow-left': '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
    'send': '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
    'clock': '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    'alert': '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    'user-check': '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/>',
    'users': '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    'inbox': '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
    'chart': '<line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/>',
    'sliders': '<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>',
    'repeat': '<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>',
    'check': '<path d="M20 6 9 17l-5-5"/>',
    'hash': '<line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/>',
    'list': '<line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/>',
  };
  const ic = (n, sz) => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"${sz ? ` style="width:${sz}px;height:${sz}px"` : ''}>${ICONS[n] || ''}</svg>`;
  document.querySelectorAll('[data-ic]').forEach(el => { el.innerHTML = ic(el.dataset.ic, 17); });
  const $ = id => document.getElementById(id);
  const csrf = () => { const m = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/); return m ? decodeURIComponent(m[1]) : ''; };
  const TEAM_C = { A: 'var(--tA)', B: 'var(--tB)', C: 'var(--tC)', ADMIN: 'var(--amber-mid)' };
  // ป้ายช่องทางชุดเดียวทั้งหน้า (รายชื่อ · หัวแชท · ห้องพัก Lead) — `n` = ตัวเลขต่อท้าย (นับในห้องพัก)
  const CH_CLS = { line: ['ch-line', 'LINE'], fb: ['ch-fb', 'Facebook'], facebook: ['ch-fb', 'Facebook'],
                   tiktok: ['ch-tt', 'TikTok'], other: ['ch-ot', 'อื่นๆ'] };
  const chTag = (s, n) => { const x = CH_CLS[s] || CH_CLS.line; return `<span class="tag ${x[0]}">${x[1]}${n != null ? ' ' + n : ''}</span>`; };
  const teamTag = t => t ? `<span class="tag team" style="background:${TEAM_C[t] || 'var(--t3)'}">ทีม ${h(t)}</span>` : '';
  const AV_C = ['#7c3aed', '#0d9488', '#db2777', '#2563eb', '#d97706', '#059669', '#9333ea', '#dc2626'];
  const avColor = name => { let s = 2166136261; for (const ch of String(name || '')) { s ^= ch.codePointAt(0); s = Math.imul(s, 16777619) >>> 0; } return AV_C[s % AV_C.length]; };
  const initial = name => (Array.from(String(name || '?').trim())[0] || '?').toUpperCase();
  // รูปโปรไฟล์ LINE ทับตัวอักษร — ไม่มีรูป/โหลดไม่ขึ้น = เห็นตัวอักษรบนวงกลมสีแทน (ไม่ใช่กล่องว่าง)
  const avHtml = (name, pic, cls) => `<div class="cn-av${cls ? ' ' + cls : ''}" style="background:${avColor(name)}">${h(initial(name))}`
    + (pic ? `<img src="${h(pic)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '') + `</div>`;
  const LANG = { th: 'ไทย', en: 'อังกฤษ', ja: 'ญี่ปุ่น', zh: 'จีน', 'zh-TW': 'จีน', 'zh-Hant': 'จีน', ko: 'เกาหลี', my: 'พม่า', km: 'เขมร', lo: 'ลาว' };
  const fmtPhone = d => d.length === 10 ? d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6) : (d.length === 9 ? d.slice(0, 2) + '-' + d.slice(2, 5) + '-' + d.slice(5) : d);

  function toast(msg, ms) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), ms || 3200);
  }

  async function api(path, body, signal) {
    const opt = { credentials: 'same-origin', headers: {}, signal };
    if (body !== undefined) {
      opt.method = 'POST'; opt.body = JSON.stringify(body);
      opt.headers['Content-Type'] = 'application/json'; opt.headers['X-CSRFToken'] = csrf();
    }
    const r = await fetch(path, opt);
    let d;
    try { d = await r.json(); } catch (e) { d = { ok: false, error: 'เซิร์ฟเวอร์ตอบผิดรูปแบบ (' + r.status + ')' }; }
    if (r.status === 401) { location.href = '/login/?next=' + encodeURIComponent('/connect/'); }
    return d;
  }

  // ── เวลา ──
  let SKEW = 0;                                   // นาฬิกาเซิร์ฟเวอร์ − นาฬิกาเครื่องนี้
  const nowMs = () => Date.now() + SKEW;
  const pad = n => String(n).padStart(2, '0');
  function fmtWhen(iso) {
    if (!iso) return '';
    const d = new Date(iso), n = new Date(nowMs());
    const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    return d.toDateString() === n.toDateString() ? hm : (d.getDate() + '/' + (d.getMonth() + 1) + ' ' + hm);
  }
  // วันที่เต็ม (ไม่ตัดเหลือแค่เวลาแม้เป็นวันนี้) — ใช้กับ "ทักครั้งแรก" ที่ต้องรู้ว่าลูกค้าเก่าแค่ไหน
  const TH_MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  function fmtFull(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.getDate() + ' ' + TH_MON[d.getMonth()] + ' ' + String(d.getFullYear() + 543).slice(-2) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fmtLeft(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    return Math.floor(s / 60) + ':' + pad(s % 60);
  }
  // ป้ายนาฬิกาของรอบรอ — อัปเดตทุกวินาทีจาก data-due (ไม่ต้องยิงเซิร์ฟเวอร์)
  function clockText(dueIso, sinceIso) {
    if (!dueIso) return { cls: '', text: '' };
    const left = Date.parse(dueIso) - nowMs();
    if (left <= 0) return { cls: 'late', text: 'เลยเวลา ' + Math.max(1, Math.round(-left / 60000)) + ' นาที' };
    const sla = (S.duty ? S.duty.slaMin : 5) * 60000;
    if (left > sla + 30000) {                      // ทักนอกเวลาทำการ — ยังไม่เริ่มนับ
      const st = new Date(Date.parse(dueIso) - sla);
      return { cls: 'wait', text: 'เริ่มนับ ' + pad(st.getHours()) + ':' + pad(st.getMinutes()) };
    }
    return { cls: 'wait', text: 'เหลือ ' + fmtLeft(left) };
  }

  // ── สถานะ ──
  const S = {
    view: '', q: '', seller: 0, src: '', rows: [], counts: {}, duty: null, onDuty: false, sellers: [], status: [], note: '',
    openId: BOOT.openId ? (+BOOT.openId || 0) : 0, chat: null, pane: 'chat', loaded: false,
    histOpen: false, side: true,
  };
  try { S.side = localStorage.getItem('cn_side') !== '0'; } catch (e) {}
  const TABS_ADMIN = [
    { v: 'overdue', l: 'เลยเวลา', i: 'alert', c: 'overdue', hot: true },
    { v: 'queue', l: 'รอรับ', i: 'inbox', c: 'queue' },
    // ลูกค้าที่คุยในระบบแล้วแต่ยังไม่มีเลขลีด — งานจ่ายเบอร์ของแอดมิน (connect.to_code)
    { v: 'tocode', l: 'ห้องพัก Lead', i: 'hash', c: 'tocode' },
    { v: 'mine', l: 'ของฉัน', i: 'user-check', c: 'mine', needEmp: true },
    { v: 'owned', l: 'มีเจ้าของ', i: 'users', c: 'owned' },
    { v: 'all', l: 'ทั้งหมด', i: 'list', c: 'all' },
    { v: '_stats', l: 'สถิติ', i: 'chart' },
    { v: '_cfg', l: 'ตั้งค่า', i: 'sliders' },
  ];
  const TABS_SELLER = [
    { v: 'queue', l: 'รอรับ', i: 'inbox', c: 'queue', hot: true },
    { v: 'mine', l: 'ลูกค้าของฉัน', i: 'user-check', c: 'mine', hotKey: 'mineWaiting' },
  ];

  function renderTop() {
    const d = S.duty;
    if (d) {
      $('cn-duty').innerHTML = `เวรวันนี้ <b>ทีม ${h(d.today)}</b> · พรุ่งนี้ทีม ${h(d.tomorrow)}`;
    }
    const me = $('cn-me');
    if (ADMIN) {
      me.className = 'cn-chip';
      me.innerHTML = `<b>${h(ME.name || 'แอดมิน')}</b> · แอดมิน`;
      $('cn-back').href = '/dashboard/';
    } else {
      me.className = 'cn-chip' + (S.onDuty ? ' on' : '');
      me.innerHTML = `<b>${h(ME.name)}</b> · ทีม ${h(ME.team || '-')}${S.onDuty ? ' · วันนี้เวรคุณ' : ''}`;
      $('cn-back').href = (BOOT.test && BOOT.test.as) ? '/dashboard/' : '/me/';
      $('cn-back-t').textContent = (BOOT.test && BOOT.test.as) ? 'แดชบอร์ด' : 'หน้าของฉัน';
    }
    const b = $('cn-banners');
    const T = BOOT.test;
    let testBar = '';
    if (T && T.as) {
      const others = (T.teams || []).filter(t => t !== ME.team);
      testBar = `<div class="cn-test">🧪 <span><b>โหมดทดสอบ</b> — ${h(T.realName || 'แอดมิน')} กำลังใช้หน้าจอแบบ <b>${h(ME.name)}</b> (ทีม ${h(ME.team || '-')} · ${S.onDuty ? 'วันนี้เวร' : 'ไม่ใช่วันเวร'})</span>
        <span class="cn-sp"></span>
        <button class="btn sm" data-test="customer">+ ลูกค้าจำลองทักเข้ามา</button>
        ${others.map(t => `<button class="btn sm" data-test="as" data-team="${h(t)}">สลับเป็นทีม ${h(t)}</button>`).join('')}
        <button class="btn sm pri" data-test="exit">กลับเป็นแอดมิน</button></div>`;
    }
    b.innerHTML = testBar + (S.status || []).map(s => `<div class="cn-banner ${h(s.level)}">${ic('alert')}<div>${h(s.text)}${s.fix ? ` · เปิดด้วยคำสั่ง <code>${h(s.fix)}</code>` : ''}</div></div>`).join('');
    b.querySelectorAll('[data-test]').forEach(x => x.onclick = () => testAct(x.dataset.test, { team: x.dataset.team }));
    document.documentElement.style.setProperty('--bh', b.offsetHeight + 'px');
    // ตัวเลขบนแท็บเบราว์เซอร์ — คนเปิดค้างไว้ข้างหลังจะเห็นว่ามีงาน
    const c = S.counts || {};
    const hot = ADMIN ? (c.overdue || 0) : ((c.queue || 0) + (c.mineWaiting || 0));
    document.title = (hot ? '(' + hot + ') ' : '') + 'Connect · Oxlet';
  }

  function renderTabs() {
    const all = (ADMIN ? TABS_ADMIN : TABS_SELLER).filter(t => !t.needEmp || ME.empId);
    const tabs = all.filter(t => !t.v.startsWith('_'));          // มุมมองรายชื่อ
    const tools = all.filter(t => t.v.startsWith('_'));          // สถิติ/ตั้งค่า → แถบบน (ไม่กินแถวในลิสต์)
    const cur = S.pane === 'stats' ? '_stats' : (S.pane === 'cfg' ? '_cfg' : S.view);
    $('cn-tools-top').innerHTML = tools.map(t =>
      `<button class="cn-tool${cur === t.v ? ' on' : ''}" data-v="${t.v}">${ic(t.i)} <span class="hide-sm">${h(t.l)}</span></button>`).join('');
    $('cn-tools-top').querySelectorAll('.cn-tool').forEach(b => b.onclick = () => pickTab(b.dataset.v));
    $('cn-tabs').innerHTML = tabs.map(t => {
      let n = '';
      if (t.c) {
        // แท็บจ่ายเบอร์ = ลูกค้าแชทที่ยังไม่มีเลข + ลีดในห้องพัก Lead ที่ยังรอเลข
        const v = ((S.counts || {})[t.c] || 0) + (t.c === 'tocode' ? ((S.counts || {}).parked || 0) : 0);
        const hv = t.hotKey ? (S.counts || {})[t.hotKey] || 0 : v;
        n = `<span class="n${t.hot || t.hotKey ? (hv ? ' hot' : '') : ''}">${t.hotKey && hv ? hv + '/' + v : v}</span>`;
      }
      return `<button class="cn-tab${cur === t.v ? ' on' : ''}" data-v="${t.v}">${ic(t.i)} ${h(t.l)} ${n}</button>`;
    }).join('');
    $('cn-tabs').querySelectorAll('.cn-tab').forEach(b => b.onclick = () => pickTab(b.dataset.v));
    // ตัวกรองช่องทาง: ห้องพัก Lead มี TikTok/อื่นๆ ด้วย (ใบร่างจากห้องพัก) · แท็บอื่นมีแต่แชท LINE/Facebook
    const srcSel = $('cn-src'), hubView = ADMIN && S.view === 'tocode', sk = hubView ? 'hub' : 'std';
    if (srcSel.dataset.k !== sk) {
      srcSel.dataset.k = sk;
      const opts = [['', 'ทุกช่องทาง'], ['line', 'LINE'], ['fb', 'Facebook']].concat(hubView ? [['tiktok', 'TikTok'], ['other', 'อื่นๆ']] : []);
      srcSel.innerHTML = opts.map(o => `<option value="${o[0]}">${o[1]}</option>`).join('');
      srcSel.value = S.src;
    }
    const sel = $('cn-seller');
    const showSel = ADMIN && (S.view === 'owned' || S.view === 'all') && S.pane === 'chat';
    sel.style.display = showSel ? '' : 'none';
    if (showSel && sel.dataset.n !== String(S.sellers.length)) {
      sel.dataset.n = String(S.sellers.length);
      sel.innerHTML = '<option value="0">เซลล์ทุกคน</option>' + S.sellers.map(s =>
        `<option value="${s.id}">${h(s.name)} (ทีม ${h(s.team)})</option>`).join('');
      sel.value = String(S.seller || 0);
    }
    applyHub();
  }

  // ห้องพัก Lead = บอร์ดเต็มจอ (แอดมิน · เฉพาะตอนดูรายชื่อ — สถิติ/ตั้งค่ายังเป็น 2 ช่องเหมือนเดิม)
  function applyHub() {
    $('cn-main').classList.toggle('hub', ADMIN && S.view === 'tocode' && S.pane === 'chat');
  }

  function pickTab(v) {
    if (v === '_stats') { S.pane = 'stats'; renderTabs(); openStats(); showPane(); return; }
    if (v === '_cfg') { S.pane = 'cfg'; renderTabs(); openCfg(); showPane(); return; }
    S.view = v; S.pane = 'chat';
    if (v !== 'tocode' && (S.src === 'tiktok' || S.src === 'other')) S.src = '';   // TikTok/อื่นๆ มีแค่ในห้องพัก Lead
    if (ADMIN && v === 'tocode') {
      // เข้าห้องพัก Lead = เห็นบอร์ดก่อนเสมอ (แชทที่ค้างไว้ปิดไป — ไม่งั้นเปิดแท็บมาเจอแชทเต็มจอแทนบอร์ด)
      S.openId = 0; S.chat = null; hidePane();
      try { history.replaceState(null, '', '/connect/' + (BOOT.embed ? '?embed=1' : '')); } catch (e) {}
    }
    applyHub();
    if (!S.openId) renderBlank();
    loadInbox(true);
  }

  function rowHtml(r) {
    const ck = r.awaiting ? clockText(r.due, r.since) : null;
    const tags = [chTag(r.src)];
    if (r.staff) tags.push(`<span class="tag wait" title="บัญชี LINE นี้ผูกกับพนักงานในทะเบียน — ทดสอบ/ส่งต่อลีด">พนักงาน</span>`);
    if (r.owner) tags.push(`<span class="tag">${ic('user-check', 12)} ${h(r.owner)}</span>`);
    else tags.push(`<span class="tag q">ยังไม่มีคนรับ</span>`);
    if (r.code) tags.push(`<span class="tag code" title="เลขลีด">${ic('hash', 12)} ${h(r.code)}</span>`);
    else if (r.buyCode) tags.push(`<span class="tag" title="ลูกค้าอยากขายรถให้เรา — ส่งเข้ากลุ่มเคสHOT ของจัดซื้อแล้ว">ส่งจัดซื้อ ${h(r.buyCode)}</span>`);
    if (r.sim) tags.push(`<span class="tag sim">ลูกค้าจำลอง</span>`);
    (r.tags || []).forEach(t => tags.push(`<span class="tag ok">${h(t)}</span>`));
    if (ADMIN && r.team) tags.push(teamTag(r.team));
    if (ck && ck.text) tags.push(`<span class="tag ${ck.cls}" data-due="${h(r.due)}">${ic('clock', 12)} <span class="ck">${h(ck.text)}</span></span>`);
    const claimBtn = (!ADMIN && !r.owner && S.onDuty) ? `<button class="btn pri sm" data-claim="${r.id}">รับ</button>` : '';
    return `<div class="cn-row${r.id === S.openId ? ' sel' : ''}${r.overdue ? ' late' : ''}" data-id="${r.id}">
      ${avHtml(r.name, r.pic)}
      <div class="cn-rb">
        <div class="cn-rh"><span class="cn-rn">${h(r.name)}</span><span class="cn-rt">${h(fmtWhen(r.lastAt))}</span></div>
        <div class="cn-rp${r.lastDir === 'out' ? ' out' : ''}">${r.lastDir === 'out' ? 'เรา: ' : ''}${h(r.preview || '—')}</div>
        <div class="cn-rm">${tags.join('')}${claimBtn}</div>
      </div>
    </div>`;
  }

  // ── ห้องพัก Lead (กลุ่ม LINE "ADMIN เก็บ Lead") — ลีดภายนอก (TikTok/FB/เบอร์กลาง …) ที่พักใบร่างไว้ (leadpark.py) ──
  //   จ่ายเบอร์ได้จากตรงนี้ (★ 6 ต.ค.69 ส่งใบเข้ากลุ่มจ่ายเบอร์จริง + แท็กเซลล์ · ไม่ลงชีต) · เลขรันชุดเดียวกับลูกค้า LINE OA
  //   หรือแอดมินโพสต์ใบจริง (เลข + @เซลล์) ในห้องจ่ายเบอร์เองก็ได้ — ระบบจับคู่ด้วยเบอร์/ID LINE แล้วเอาออกจากรายการเอง
  const fmtWait = m => m >= 60 ? Math.floor(m / 60) + ' ชม. ' + (m % 60) + ' นาที' : m + ' นาที';
  const srcTag = s => chTag(s in CH_CLS ? s : 'other');
  S.parkOpen = new Set(); S.parkDraft = {};
  const pWho = i => i.account || i.name || i.lineId || i.phone || '(ไม่มีชื่อ)';

  function parkBoxHtml(i, ch) {
    const keys = (ch.bases || []).map(b => b.key);
    const sugBase = keys.includes(i.base) ? i.base : (i.source === 'tiktok' ? 'TLD' : 'NLD');
    const dr = S.parkDraft[i.id] || { base: sugBase, emp: 0, admin: !!i.admin, reject: !!i.reject };
    const bases = (ch.bases || []).map(b => `<option value="${h(b.key)}"${b.key === dr.base ? ' selected' : ''}>${h(b.key)} · ${h(b.type)}</option>`).join('');
    const sellers = S.sellers.map(s => `<option value="${s.id}"${s.id === dr.emp ? ' selected' : ''}>${h(s.name)} · ทีม ${h(s.team)}</option>`).join('');
    return `<div class="pf-assign" data-park="${h(i.id)}">
      <div class="pf-g2">
        <div class="pf-fld"><div class="pf-lab"><span>ตัวหน้า</span></div><select data-x="base">${bases}</select></div>
        <div class="pf-fld"><div class="pf-lab"><span>จ่ายให้เซลล์</span></div><select data-x="emp"><option value="">— เลือก —</option>${sellers}</select></div>
      </div>
      <label class="ck"><input type="checkbox" data-x="admin"${dr.admin ? ' checked' : ''}> A — ลีดของแอดมิน</label>
      <label class="ck"><input type="checkbox" data-x="reject"${dr.reject ? ' checked' : ''}> R — เคสรีเจ็ค</label>
      <div style="color:var(--t3);font-size:12px">เลขที่จะได้: <span class="pf-code" data-x="preview"></span></div>
      ${postNoteHtml(ch.post || { on: false }, 'จดว่าจ่ายให้เซลล์คนไหน')}
      <button class="btn pri" data-pact="assign" style="width:100%">${ch.post && ch.post.on ? 'จ่ายเบอร์ + ส่งเข้ากลุ่ม' : 'จ่ายเบอร์'}</button>
      <button class="btn sm" data-pact="skip" style="width:100%;margin-top:6px" title="ลีดซ้ำ / ไม่ใช่ลีดขาย — เอาออกจากรายการรอเลข">ไม่ต้องจ่ายเบอร์ (ลีดซ้ำ/ไม่ใช่ลีดขาย)</button>
    </div>`;
  }

  // ── ห้องพัก Lead = ศูนย์กระจายลีด "ทุกช่องทาง" (4 ต.ค.69 · เจ้าของ: "ควรทำที่พัก lead จากทุกช่องทาง
  //    เพื่อเป็นศูนย์กระจายให้แอดมินจ่าย") — รวม 2 แหล่งในรายการเดียว เรียงรอนานสุดขึ้นก่อน:
  //    ① ลูกค้าแชท LINE / Facebook ที่คุยในระบบแล้วยังไม่มีเลข → กดเปิดแชท แล้วจ่ายเบอร์ในแผงขวา
  //    ② ใบร่างที่แอดมินพักไว้ในกลุ่ม "ADMIN เก็บ Lead" (TikTok / FB / เบอร์กลาง …) → กดกาง แล้วจ่ายเบอร์ได้เลย
  const SRC_KEY = { line: 'line', fb: 'fb', facebook: 'fb', tiktok: 'tiktok', other: 'other' };
  const SRC_LABEL = { line: 'LINE', fb: 'Facebook', tiktok: 'TikTok', other: 'อื่นๆ' };

  function parkItemHtml(i, P, ch) {
    const mins = Math.max(0, Math.floor((nowMs() - Date.parse(i.at)) / 60000));
    const late = mins >= (P.warnMin || 30);
    const det = [['ID LINE', i.lineId], ['เบอร์โทร', i.phone ? fmtPhone(i.phone) : ''], ['ช่องทาง', i.channel],
                 ['รถ', i.car], ['ไลฟ์', i.live], ['Ads', i.ads], ['เพิ่มเติม', i.more]]
      .filter(x => x[1]).map(x => `${h(x[0])}: <b>${h(x[1])}</b>`).join('<br>');
    return `<details class="cn-prow" data-pk="${h(i.id)}"${S.parkOpen.has(i.id) ? ' open' : ''}><summary>
      <div class="cn-rh"><span class="cn-rn">${h(pWho(i))}</span>${srcTag(i.source)}<span class="tag code">${ic('hash', 12)} ${h(i.prefix)}</span></div>
      <div class="cn-rp">${h([i.car, i.channel].filter(Boolean).join(' · ') || '—')}</div>
      <div class="cn-rm"><span class="tag q">ใบร่างในห้องพัก</span>${i.phone ? `<span class="tag">โทร ${h(fmtPhone(i.phone))}</span>` : ''}
        <span class="tag">พักโดย ${h(i.by || '-')}</span>${i.reposts ? `<span class="tag">โพสต์ซ้ำ ${i.reposts}</span>` : ''}
        <span class="tag ${late ? 'late' : 'wait'}">${ic('clock', 12)} รอเลข ${h(fmtWait(mins))}</span></div>
    </summary>${det ? `<div class="pv">${det}</div>` : ''}${parkBoxHtml(i, ch)}</details>`;
  }

  // ── "จ่ายแล้ว" (4 ต.ค.69 · เจ้าของ: "หลีดบางตัวก็จ่ายไปแล้ว บางตัวก็ยังไม่จ่าย อยากรู้ว่าจ่ายให้ใครบ้าง") ──
  //   รวม 2 แหล่ง: แชท LINE/FB ที่ได้เลขแล้ว (S.assigned · จากปุ่มจ่ายเบอร์ในระบบ หรือใบจ่ายลีดในกลุ่มที่ระบบจับคู่ให้)
  //   + ใบร่างในห้องพักที่ได้เลขแล้ว (P.assigned) · ช่วง: วันนี้ / 7 วัน · กดชื่อเซลล์ในแถบสรุป = กรองเฉพาะคนนั้น
  S.hubTab = 'wait'; S.doneRange = 'today'; S.doneSeller = '';
  const UNKNOWN_SELLER = 'ไม่ทราบ';

  function doneItems(withSeller) {
    const P = S.parked || {};
    const out = (S.assigned || []).map(r => ({ kind: 'chat', id: r.id, name: r.name, src: SRC_KEY[r.src] || 'line', pic: r.pic,
      code: r.code, seller: r.seller || '', by: r.by || '', at: r.at, how: r.how || '', buy: r.kind === 'buy' }));
    (P.assigned || []).forEach(i => {
      // sp = ผลส่งใบเข้ากลุ่มของปุ่มจ่ายเบอร์ในระบบ (6 ต.ค.69) — ส่งสำเร็จแล้วใบนั้นก็จับคู่เป็น "ใบในห้อง" (real) ด้วย
      const real = i.code, sys = i.sys || null, sp = sys && sys.post;
      const failed = !!(sp && !sp.ok && !real && !(sp.sending && !sp.error));
      out.push({ kind: 'park', name: pWho(i), src: SRC_KEY[i.source] || 'other', pic: '',
        code: real || (sys && sys.code) || '',
        seller: real ? (i.sellerNick || i.seller || '') : ((sys && sys.seller) || ''),
        by: real ? (i.assignedBy || '') : ((sys && sys.by) || ''), at: i.doneAt || '',
        how: sp && sp.ok ? 'ระบบ → ส่งเข้ากลุ่มแล้ว' : real ? 'ใบในห้องจ่ายเบอร์'
          : failed ? 'ระบบ (ส่งเข้ากลุ่มไม่สำเร็จ)' : ('ระบบ' + (sys && sys.demo ? ' (ทดลอง)' : '')),
        slip: sys && !real ? i.id : '', repost: failed ? i.id : '', err: failed ? (sp.error || '') : '',
        extra: sys && real && sys.code !== real ? 'เลขทดลอง ' + sys.code : '' });
    });
    const today = new Date(nowMs()).toLocaleDateString('sv-SE');
    const q = (S.q || '').trim().toLowerCase();
    return out.filter(x => x.at && x.code)
      .filter(x => S.doneRange !== 'today' || new Date(x.at).toLocaleDateString('sv-SE') === today)
      .filter(x => !S.src || x.src === S.src)
      .filter(x => !q || [x.name, x.code, x.seller, x.by].some(v => (v || '').toLowerCase().includes(q)))
      .filter(x => !withSeller || !S.doneSeller || (x.seller || UNKNOWN_SELLER) === S.doneSeller)
      .sort((a, b) => Date.parse(b.at) - Date.parse(a.at));
  }

  function doneCardHtml(x) {
    const chat = x.kind === 'chat';
    return `<div class="${chat ? 'cn-row' : 'cn-prow'} hub-done"${chat ? ` data-id="${x.id}" title="เปิดแชท"` : ''}>
      ${chat ? avHtml(x.name, x.pic) : ''}
      <div class="cn-rb">
        <div class="cn-rh"><span class="cn-rn">${h(x.name)}</span><span class="cn-rt">${h(fmtWhen(x.at))}</span></div>
        <div class="hub-to">${x.buy ? 'ส่งจัดซื้อ' : 'จ่ายให้'} <b>${x.seller ? '@' + h(x.seller) : UNKNOWN_SELLER}</b>${
          x.buy ? ' <span style="color:var(--t3);font-size:12px">· ลูกค้าอยากขายรถให้เรา</span>' : ''}</div>
        <div class="cn-rm">${chTag(x.src)}<span class="tag ok">${ic('hash', 12)} ${h(x.code)}</span>
          <span class="tag${x.repost || /ไม่สำเร็จ/.test(x.how || '') ? ' late' : ''}"${x.err ? ` title="${h(x.err)}"` : ''}>${h(x.how)}${x.by ? ' · โดย ' + h(x.by) : ''}</span>${x.extra ? `<span class="tag">${h(x.extra)}</span>` : ''}
          ${x.repost ? `<button class="btn sm pri" data-prepost="${h(x.repost)}" title="${h(x.err || '')}">ส่งเข้ากลุ่มอีกครั้ง</button>` : ''}
          ${x.slip ? `<button class="btn sm" data-slip="${h(x.slip)}">คัดลอกใบจ่ายลีด</button>` : ''}</div>
        ${x.err ? `<div style="color:var(--red);font-size:12px;margin-top:4px">${h(x.err)}</div>` : ''}
      </div></div>`;
  }

  function hubHtml() {
    if (!(ADMIN && S.view === 'tocode')) return '';
    const P = S.parked || {}, ch = P.codeHelp || {};
    const items = [];
    S.rows.forEach(r => items.push({ t: Date.parse(r.since || r.lastAt || '') || 0, src: SRC_KEY[r.src] || 'line', html: rowHtml(r) }));
    (P.waiting || []).filter(i => !S.src || SRC_KEY[i.source] === S.src)
      .forEach(i => items.push({ t: Date.parse(i.at) || 0, src: SRC_KEY[i.source] || 'other', html: parkItemHtml(i, P, ch) }));
    items.sort((x, y) => x.t - y.t);                     // รอนานสุดขึ้นก่อน (ไม่ว่ามาจากช่องทางไหน)
    const doneAll = doneItems(false);
    const rangeL = S.doneRange === 'today' ? 'วันนี้' : '7 วัน';
    const seg = `<span class="hub-seg">
        <button class="cn-tab${S.hubTab === 'wait' ? ' on' : ''}" data-hub="wait">${ic('clock')} รอจ่ายเบอร์ <span class="n">${items.length}</span></button>
        <button class="cn-tab${S.hubTab === 'done' ? ' on' : ''}" data-hub="done">${ic('check')} จ่ายแล้ว${rangeL === 'วันนี้' ? 'วันนี้' : ' 7 วัน'} <span class="n">${doneAll.length}</span></button>
      </span>`;

    if (S.hubTab === 'done') {
      const by = {};
      doneAll.forEach(x => { const k = x.seller || UNKNOWN_SELLER; by[k] = (by[k] || 0) + 1; });
      const sum = Object.entries(by).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'th')).map(([k, n]) =>
        `<button class="hub-sel${S.doneSeller === k ? ' on' : ''}" data-dsel="${h(k)}">${k === UNKNOWN_SELLER ? h(k) : '@' + h(k)} <b>${n}</b></button>`).join('');
      const shown = doneItems(true);
      return `<div class="cn-park">
          <div class="cn-park-h">${ic('inbox')} ห้องพัก Lead ${seg}
            <span class="hub-seg"><button class="btn sm${S.doneRange === 'today' ? ' pri' : ''}" data-hubr="today">วันนี้</button><button class="btn sm${S.doneRange === '7d' ? ' pri' : ''}" data-hubr="7d">7 วัน</button></span></div>
          <div class="cn-park-f" style="padding-top:0">จ่ายให้ใครบ้าง${S.doneSeller ? ` — กรองเฉพาะ <b>${h(S.doneSeller)}</b> (กดชื่อเดิมอีกครั้งเพื่อดูทั้งหมด)` : ' — กดชื่อเพื่อดูเฉพาะคนนั้น'}
            · รวมทั้งที่จ่ายผ่านปุ่มในระบบ · ใบจ่ายเบอร์ในห้องจ่ายเบอร์ · และลูกค้าที่อยากขายรถที่ส่งเข้ากลุ่มเคสHOT ของจัดซื้อ (ระบบจับคู่ใบให้เองด้วยเบอร์/ชื่อ)</div>
          ${sum ? `<div class="hub-sum">${sum}</div>` : ''}
        </div>
        ${shown.map(doneCardHtml).join('') || `<div class="cn-empty">ยังไม่มีลีดที่จ่ายเบอร์${h(rangeL === 'วันนี้' ? 'วันนี้' : 'ใน 7 วัน')}</div>`}`;
    }

    const cnt = {};
    items.forEach(x => { cnt[x.src] = (cnt[x.src] || 0) + 1; });
    const chips = Object.keys(SRC_LABEL).filter(k => cnt[k]).map(k => chTag(k, cnt[k])).join(' ');
    const skipped = (P.skipped || []).map(i => `<div class="cn-prow"><div class="cn-rh"><span class="cn-rn">${h(pWho(i))}</span>${srcTag(i.source)}</div>
      <div class="cn-rm"><span class="tag">ซ่อนโดย ${h((i.skipped && i.skipped.by) || '-')}</span><button class="btn sm" data-unskip="${h(i.id)}">เอากลับมาจ่ายเบอร์</button></div></div>`).join('');
    const room = P.room ? `"${h(P.room)}"` : '"ADMIN เก็บ Lead" (บอทยังไม่ได้ยินห้องนี้)';
    return `<div class="cn-park">
        <div class="cn-park-h">${ic('inbox')} ห้องพัก Lead ${seg} <span style="font-weight:400">${chips}</span></div>
        <div class="cn-park-f" style="padding-top:0">ศูนย์กระจายลีดทุกช่องทาง — แชท LINE / Facebook ที่<b>ให้เบอร์หรือไอดีไลน์แล้ว</b>แต่ยังไม่มีเลข + ใบร่างที่พักไว้ในกลุ่ม ${room}
          · รอนานสุดขึ้นก่อน · แชท: เปิดแล้วจ่ายเบอร์ในแผงขวา · ใบร่าง: กดกางแล้วจ่ายได้เลย
          · แอดมินโพสต์ใบในห้องจ่ายเบอร์ หรือใบเคสรับซื้อ (โค้ด OC-…) ในกลุ่มเคสHOT แล้ว = ระบบจับคู่ให้เองภายในไม่กี่นาที แล้วย้ายไป "จ่ายแล้ว"</div>
      </div>
      ${items.map(x => x.html).join('') || '<div class="cn-empty">ไม่มีลีดรอจ่ายเบอร์ 👍</div>'}
      ${skipped ? `<div class="cn-park" style="border-top:.5px solid var(--bd2)">
        <details class="cn-prow" data-pk="skip"${S.parkOpen.has('skip') ? ' open' : ''}><summary class="cn-park-f" style="padding:0">ซ่อนไว้ (ไม่ต้องจ่ายเบอร์) ${(P.skipped || []).length} ราย ▾</summary>${skipped}</details>
      </div>` : ''}`;
  }

  function parkPreview(box) {
    const ch = (S.parked || {}).codeHelp || {}, q = k => box.querySelector(`[data-x="${k}"]`);
    q('preview').textContent = (q('reject').checked ? 'R' : '') + (q('admin').checked ? 'A' : '') + q('base').value + (ch.month || '') + '-' + (ch.next || '…');
  }

  function bindPark(el) {
    el.querySelectorAll('details[data-pk]').forEach(d => d.addEventListener('toggle', () => {
      if (d.open) S.parkOpen.add(d.dataset.pk); else S.parkOpen.delete(d.dataset.pk);
    }));
    el.querySelectorAll('[data-park]').forEach(box => {
      const id = box.dataset.park, q = k => box.querySelector(`[data-x="${k}"]`);
      box.querySelectorAll('[data-x]').forEach(x => x.addEventListener('change', () => {
        S.parkDraft[id] = { base: q('base').value, emp: +(q('emp').value || 0), admin: q('admin').checked, reject: q('reject').checked };
        parkPreview(box);
      }));
      parkPreview(box);
      box.querySelector('[data-pact=assign]').onclick = async ev => {
        const emp = +(q('emp').value || 0);
        if (!emp) { toast('เลือกเซลล์ที่จะจ่ายเบอร์ให้ก่อน'); return; }
        const P = ((S.parked || {}).codeHelp || {}).post || {};
        if (P.on) {                              // ส่งเข้ากลุ่มจริง = ทั้งห้องเห็น — ถามก่อนทุกครั้ง
          const nm = (S.sellers.find(s => s.id === emp) || {}).name || '';
          const room = q('reject').checked && P.rejectRoom ? P.rejectRoom : P.room;
          if (!confirm(`จ่ายเบอร์ ${q('preview').textContent} ให้ ${nm}\nแล้วส่งใบเข้า "${room || 'กลุ่มจ่ายเบอร์'}" พร้อมแท็ก @${nm} ?`)) return;
        }
        ev.target.disabled = true;
        const r = await api('/connect/api/park_assign', { mid: id, emp, base: q('base').value,
          admin: q('admin').checked, reject: q('reject').checked });
        ev.target.disabled = false;
        toast(r.ok ? r.message : (r.error || 'จ่ายเบอร์ไม่สำเร็จ'), r.post && !r.post.ok ? 9000 : 6000);
        if (r.ok) { delete S.parkDraft[id]; S.parkOpen.delete(id); S.parkOpen.add('done'); loadInbox(false); }
      };
      box.querySelector('[data-pact=skip]').onclick = async ev => {
        ev.target.disabled = true;
        const r = await api('/connect/api/park_assign', { mid: id, skip: true });
        ev.target.disabled = false;
        toast(r.ok ? r.message : (r.error || 'ทำไม่สำเร็จ'));
        if (r.ok) { delete S.parkDraft[id]; S.parkOpen.delete(id); loadInbox(false); }
      };
    });
    el.querySelectorAll('[data-unskip]').forEach(b => b.onclick = async () => {
      const r = await api('/connect/api/park_assign', { mid: b.dataset.unskip, skip: false });
      toast(r.ok ? r.message : (r.error || 'ทำไม่สำเร็จ'));
      if (r.ok) loadInbox(false);
    });
    el.querySelectorAll('[data-prepost]').forEach(b => b.onclick = async ev => {   // ลีดภายนอก: ส่งเข้ากลุ่มอีกครั้ง
      ev.stopPropagation();
      b.disabled = true;
      const r = await api('/connect/api/park_assign', { mid: b.dataset.prepost, resend: true });
      b.disabled = false;
      toast(r.ok ? r.message : (r.error || 'ส่งไม่สำเร็จ'), 6000);
      loadInbox(false);
    });
    el.querySelectorAll('[data-slip]').forEach(b => b.onclick = () => {
      const it = ((S.parked || {}).assigned || []).find(x => x.id === b.dataset.slip);
      const t = it && it.sys ? it.sys.slip : '';
      try { navigator.clipboard.writeText(t); toast('คัดลอกใบจ่ายลีดแล้ว'); } catch (e) { toast('คัดลอกไม่ได้'); }
    });
  }

  function renderList() {
    $('cn-note').innerHTML = S.note ? `<div class="cn-note">${h(S.note)}</div>` : '';
    const el = $('cn-rows');
    const hub = hubHtml();
    if (hub) {
      // รายชื่อถูกวาดใหม่ทุก 8 วิ — กำลังเลือกตัวเลือกในกล่องจ่ายเบอร์อยู่ = ยังไม่วาด (dropdown ที่กางอยู่จะปิดเอง)
      //   ที่เลือกค้างไว้เก็บใน S.parkDraft · ลีดที่กางดูอยู่จำใน S.parkOpen — วาดใหม่แล้วไม่หาย
      const act = document.activeElement;
      if (act && el.contains(act) && /SELECT|INPUT|TEXTAREA/.test(act.tagName)) return;
      const top = el.scrollTop;
      el.innerHTML = hub;
      el.scrollTop = top;
      bindPark(el);
      el.querySelectorAll('.cn-row').forEach(r => r.onclick = () => openChat(+r.dataset.id));
      el.querySelectorAll('[data-hub]').forEach(b => b.onclick = () => { S.hubTab = b.dataset.hub; el.scrollTop = 0; renderList(); });
      el.querySelectorAll('[data-hubr]').forEach(b => b.onclick = () => { S.doneRange = b.dataset.hubr; S.doneSeller = ''; renderList(); });
      el.querySelectorAll('[data-dsel]').forEach(b => b.onclick = () => {
        S.doneSeller = S.doneSeller === b.dataset.dsel ? '' : b.dataset.dsel; renderList(); });
      return;
    }
    if (!S.rows.length) {
      const empty = {
        overdue: 'ไม่มีลูกค้ารอเกินเวลา 👍', queue: 'ไม่มีลูกค้ารอรับตอนนี้', tocode: 'ไม่มีลูกค้ารอจ่ายเบอร์ 👍',
        mine: ADMIN ? 'ยังไม่มีลูกค้าที่คุณดูแล' : 'ยังไม่มีลูกค้าของคุณ — กดรับจากแท็บ "รอรับ" ในวันเวรของทีม',
        owned: 'ยังไม่มีลูกค้าที่มีเจ้าของ', all: 'ยังไม่มีลูกค้าทักเข้ามา',
      }[S.view] || 'ไม่มีรายการ';
      el.innerHTML = S.note ? '' : `<div class="cn-empty">${h(empty)}</div>`;
      return;
    }
    const top = el.scrollTop;
    el.innerHTML = S.rows.map(rowHtml).join('');
    el.scrollTop = top;
    el.querySelectorAll('.cn-row').forEach(r => r.onclick = () => openChat(+r.dataset.id));
    el.querySelectorAll('[data-claim]').forEach(b => b.onclick = (e) => { e.stopPropagation(); claim(+b.dataset.claim); });
  }

  // ── โหลดรายชื่อ (ยกเลิกคำขอเก่าเมื่อมีคำขอใหม่ — บทเรียนเดิม "ตัวกรองค้าง") ──
  let _inAbort = null, _inSeq = 0;
  async function loadInbox(reset) {
    if (_inAbort) _inAbort.abort();
    const ac = new AbortController(); _inAbort = ac;
    const seq = ++_inSeq;
    const qs = new URLSearchParams();
    if (S.view) qs.set('view', S.view);
    if (S.q) qs.set('q', S.q);
    if (S.seller) qs.set('seller', S.seller);
    if (S.src) qs.set('src', S.src);
    if (reset) $('cn-rows').innerHTML = '<div class="cn-empty"><div class="spin"></div>กำลังโหลด…</div>';
    let d;
    try { d = await api('/connect/api/inbox?' + qs.toString(), undefined, ac.signal); }
    catch (e) { if (e.name === 'AbortError') return; d = { ok: false, error: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้' }; }
    if (seq !== _inSeq) return;
    if (!d.ok) { $('cn-rows').innerHTML = `<div class="cn-empty" style="color:var(--red)">${h(d.error || 'โหลดไม่สำเร็จ')}</div>`; return; }
    if (d.now) SKEW = Date.parse(d.now) - Date.now();
    Object.assign(S, { view: d.view, rows: d.rows || [], counts: d.counts || {}, duty: d.duty, onDuty: !!d.onDuty,
                       status: d.status || [], note: d.note || '', sellers: d.sellers || S.sellers, loaded: true,
                       parked: d.parked || null, assigned: d.assigned || [] });
    renderTop(); renderTabs(); renderList();
    if (S.openId && !S.chat && S.pane === 'chat') openChat(S.openId);
  }

  // ── แชท ──
  let _chAbort = null, _chSeq = 0;
  function showPane() { document.body.classList.add('pane'); }
  function hidePane() { document.body.classList.remove('pane'); }
  function renderBlank(msg) {
    $('cn-pane').innerHTML = `<div class="cn-blank">${h(msg || 'เลือกลูกค้าทางซ้ายเพื่อเปิดแชท')}</div>`;
  }

  async function openChat(id, keep) {
    if (!id) return;
    S.pane = 'chat';
    const switching = !S.chat || S.chat.row.id !== id;
    S.openId = id;
    if (switching && !keep) {
      $('cn-pane').innerHTML = `<div class="cn-blank"><div><div class="spin"></div>กำลังเปิดแชท…</div></div>`;
      S.chat = null;
    }
    document.querySelectorAll('.cn-row').forEach(r => r.classList.toggle('sel', +r.dataset.id === id));
    showPane();
    try { history.replaceState(null, '', '/connect/?id=' + id + (BOOT.embed ? '&embed=1' : '')); } catch (e) {}
    if (_chAbort) _chAbort.abort();
    const ac = new AbortController(); _chAbort = ac;
    const seq = ++_chSeq;
    let d;
    try { d = await api('/connect/api/chat?id=' + id, undefined, ac.signal); }
    catch (e) { if (e.name === 'AbortError') return; d = { ok: false, error: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้' }; }
    if (seq !== _chSeq || S.openId !== id) return;
    if (!d.ok) {
      S.chat = null;
      $('cn-pane').innerHTML = `<div class="cn-ph"><button class="btn sm cn-mback" onclick="window.__cnBack()">${ic('arrow-left')} กลับ</button></div><div class="cn-blank" style="color:var(--red)">${h(d.error || 'เปิดแชทไม่ได้')}</div>`;
      return;
    }
    if (d.now) SKEW = Date.parse(d.now) - Date.now();
    const same = S.chat && S.chat.row.id === id;
    S.chat = d;
    if (same) { paintHeader(); paintProfile(); paintMsgs(true); paintComposer(false); }
    else paintChat();
  }

  function paintChat() {
    $('cn-pane').innerHTML = `
      <div class="cn-ph" id="cn-ph"></div>
      <div class="cn-chat">
        <div class="cn-cmain"><div class="cn-msgs" id="cn-msgs"></div><div id="cn-sim-wrap"></div><div id="cn-comp-wrap"></div></div>
        <aside class="cn-side" id="cn-side"></aside>
      </div>`;
    // paintProfile(true) — แผงเพิ่งถูกสร้างใหม่ (ว่าง) · ถ้าไม่บังคับ กดกลับแล้วเปิดลูกค้าคนเดิม แผงขวาจะว่าง
    //   เพราะข้อมูลเหมือนรอบก่อน (ลายเซ็นเดิม) เลยไม่ถูกวาด
    applySide(); paintHeader(true); paintProfile(true); paintMsgs(false); paintSim(); paintComposer(true);
  }

  function paintHeader(force) {
    const d = S.chat, r = d.row;
    // หัวแชทถูกวาดใหม่ทุก 6 วิ — กำลังพิมพ์/เลือกอะไรในหัวแชทอยู่ (ฟอร์มลีดแบบพับบนจอแคบ · ช่องโอน) = ยังไม่วาด
    //   ไม่งั้นช่องที่กำลังพิมพ์หลุดโฟกัส/dropdown ที่กางอยู่ปิดเอง
    const act = document.activeElement;
    if (!force && act && $('cn-ph') && $('cn-ph').contains(act) && /INPUT|TEXTAREA|SELECT/.test(act.tagName)) return;
    // เก็บสิ่งที่ผู้ใช้กำลังทำค้างไว้ (เลือกเซลล์ค้าง / กางประวัติ / ข้อมูลลูกค้าแบบพับ)
    const _prevTo = $('cn-to') ? $('cn-to').value : '';
    const _profOpen = !!document.querySelector('#cn-ph details.cn-prof-m[open]');
    // ★ ข้อมูลลูกค้าแบบพับ (จอแคบ) อยู่ในหัวแชท — เดิมวาดหัวใหม่แล้วแผงนี้ว่างทุก 6 วิ
    //   (paintProfile ไม่วาดซ้ำเมื่อข้อมูลเหมือนเดิม) → ย้ายแผงเดิมกลับเข้าไปทั้งก้อน
    const _profBody = $('cn-prof-m-body');
    const own = r.owner ? `เจ้าของ <b>${h(r.owner)}</b>` : `<b>ยังไม่มีเซลล์รับ</b>`;
    const acts = [];
    // ปุ่มลัดไปกล่อง "จ่ายเบอร์" — กล่องอยู่ในแผงข้อมูลลูกค้า (ด้านขวา/แบบพับ) ซึ่งอาจซ่อนอยู่
    const L = d.lead;
    if (ADMIN && d.codeHelp && L && !L.code && !L.noCode && !L.buy) {
      acts.push(`<button class="btn pri" id="cn-code-btn" title="ออกเลขลีด + จ่ายลูกค้าคนนี้ให้เซลล์">${ic('hash')} จ่ายเบอร์</button>`);
    }
    if (d.canClaim) acts.push(`<button class="btn pri" id="cn-claim">${ic('user-check')} รับลูกค้าคนนี้</button>`);
    if (d.canDismiss) acts.push(`<button class="btn" id="cn-dismiss" title="ลูกค้าส่งมาแค่ขอบคุณ/สติกเกอร์ หรือตอบนอกระบบไปแล้ว — ปิดรอบนี้โดยไม่ต้องตอบ">${ic('check')} ไม่ต้องตอบ</button>`);
    if (d.canAssign) {
      acts.push(`<select id="cn-to"><option value="">โอนให้เซลล์…</option>${S.sellers.filter(s => s.id !== r.ownerId).map(s =>
        `<option value="${s.id}">${h(s.name)} · ทีม ${h(s.team)}</option>`).join('')}</select>`);
      acts.push(`<button class="btn" id="cn-assign">${ic('repeat')} โอน</button>`);
      if (r.owner) acts.push(`<button class="btn red" id="cn-release">ปล่อยคืนคิว</button>`);
    }
    // นาฬิกา = ป้ายเล็กในบรรทัดเดียวกับเจ้าของ (เดิมเป็นแถบเต็มความกว้าง กินที่แชท)
    let clock = '';
    if (r.awaiting) {
      const ck = clockText(r.due, r.since);
      const late = ck.cls === 'late';
      clock = ` · <span class="cn-clock ${ck.cls}" data-due="${h(r.due)}" title="${late ? 'เลยเวลาแล้ว — แอดมินได้รับแจ้ง' : 'ลูกค้ารอคำตอบ'}">${ic(late ? 'alert' : 'clock', 12)} <span class="ck">${h(ck.text)}</span></span>`;
    }
    const nHist = ADMIN ? (d.history || []).length : 0;
    if (nHist) acts.push(`<button class="btn" id="cn-hist-btn" title="ใครรับ/โอน/ตอบลูกค้าคนนี้ เมื่อไหร่">ประวัติ ${nHist}</button>`);
    acts.push(`<button class="btn wide-only${S.side ? ' pri' : ''}" id="cn-side-btn" title="แสดง/ซ่อนข้อมูลลูกค้าด้านขวา (ซ่อน = แชทกว้างขึ้น)">${ic('user-check')} ข้อมูลลูกค้า</button>`);
    const hist = (nHist && S.histOpen) ? `<div class="cn-hist">${d.history.map(x =>
        `<div>${h(fmtWhen(x.at))} · <b>${h(x.label)}</b>${x.emp ? ' · ' + h(x.emp) : ''}${x.by && x.by !== x.emp ? ' (โดย ' + h(x.by) + ')' : ''}${x.waitSec != null ? ' · ลูกค้ารอ ' + Math.round(x.waitSec / 60) + ' นาที' : ''}${x.onTime === false ? ' · เกินเวลา' : ''}${x.note ? ' · ' + h(x.note) : ''}</div>`).join('')}</div>` : '';
    $('cn-ph').innerHTML = `
      <div class="cn-ph-row">
        <button class="btn sm cn-mback" id="cn-mback">${ic('arrow-left')}<span class="hub-only">ห้องพัก Lead</span></button>
        ${avHtml(r.name, r.pic)}
        <div class="cn-ph-who">
          <h2>${h(r.name)}</h2>
          <div class="cn-sub">${chTag(r.src)}${r.staff ? ' <span class="tag wait">พนักงาน</span>' : ''} ${own}${r.team ? ' · ' + teamTag(r.team) : ''} · ${r.msgs} ข้อความ${clock}</div>
        </div>
        <div class="cn-acts">${acts.join('')}</div>
      </div>
      <details class="cn-prof-m"><summary>ข้อมูลลูกค้า</summary><div id="cn-prof-m-body"></div></details>
      ${hist}`;
    $('cn-mback').onclick = window.__cnBack;
    if (_prevTo && $('cn-to')) $('cn-to').value = _prevTo;
    if (_profOpen) { const dt = document.querySelector('#cn-ph details.cn-prof-m'); if (dt) dt.open = true; }
    if (_profBody && _profBody.innerHTML) { const nb = $('cn-prof-m-body'); if (nb) nb.replaceWith(_profBody); }
    const on = (id, fn) => { const b = $(id); if (b) b.onclick = fn; };
    on('cn-code-btn', goAssign);
    on('cn-claim', () => claim(r.id));
    on('cn-dismiss', () => dismiss(r.id));
    on('cn-assign', () => assign(r.id, +($('cn-to').value || 0), false));
    on('cn-release', () => assign(r.id, 0, true));
    on('cn-hist-btn', () => { S.histOpen = !S.histOpen; paintHeader(); });
    on('cn-side-btn', () => {
      S.side = !S.side;
      try { localStorage.setItem('cn_side', S.side ? '1' : '0'); } catch (e) {}
      applySide(); paintHeader();
    });
  }
  // ซ่อน/แสดงคอลัมน์ข้อมูลลูกค้า — จำไว้ในเครื่อง (คนที่อยากได้แชทกว้างไม่ต้องกดซ่อนทุกครั้ง)
  function applySide() {
    const el = document.querySelector('.cn-chat'); if (el) el.classList.toggle('noside', !S.side);
  }
  // ปุ่ม "จ่ายเบอร์" บนหัวแชท → พาไปกล่องจ่ายเบอร์ (เปิดคอลัมน์ข้อมูลลูกค้าที่ซ่อนไว้ / กางแบบพับบนจอแคบ)
  function goAssign() {
    let side = $('cn-side');
    if (side && side.offsetParent === null && !S.side && window.innerWidth > 1180) {
      S.side = true;
      try { localStorage.setItem('cn_side', '1'); } catch (e) {}
      applySide(); paintHeader(true);
    }
    side = $('cn-side');
    let box = (side && side.offsetParent !== null) ? side.querySelector('[data-box=assign]') : null;
    if (!box) {
      const dt = document.querySelector('#cn-ph details.cn-prof-m');
      if (dt) { dt.open = true; box = dt.querySelector('[data-box=assign]'); }
    }
    if (!box) { toast('เปิดกล่องจ่ายเบอร์ไม่ได้ — ลองกดชื่อลูกค้าอีกครั้ง'); return; }
    box.scrollIntoView({ block: 'center', behavior: 'smooth' });
    box.classList.add('flash'); setTimeout(() => box.classList.remove('flash'), 1800);
    const sel = box.querySelector('[data-x=emp]');
    if (sel && !sel.value) sel.focus({ preventScroll: true });
  }

  // ช่องของฟอร์ม — ชื่อ/ลำดับตามชีตลีด (คีย์ต้องตรงกับ LEAD_FIELDS ใน connect.py)
  //   [ช่อง, ป้าย, ชนิด] ชนิด: '' = ข้อความ · tel · area (หลายบรรทัด)
  //   ★ ช่องไหนในชีตเป็น dropdown → เป็นตัวเลือกชุดเดียวกับชีตเอง (`leadOptions.dropdowns` อ่านจากชีตทุกชั่วโมง)
  //     ไม่ต้องกำหนดในลิสต์นี้ — ชีตเพิ่ม dropdown ช่องไหน ฟอร์มเปลี่ยนตามเอง
  const LEAD_UI = [
    { sec: 'ลูกค้า', rows: [[['customer_name', 'ชื่อลูกค้า']], [['phone', 'เบอร์โทร', 'tel'], ['line_id', 'ID LINE']]] },
    { sec: 'ข้อมูลลีด', rows: [
      [['code', 'Code (เลขลีด)'], ['lead_type', 'type']],
      [['channel', 'ช่องทาง'], ['branch', 'สาขา']],
      [['ads', 'ADS']], [['account', 'ชื่อ Account']],
      [['admin_name', 'Admin'], ['live_team', 'ทีมไลฟ์']],
      [['focus', 'FOCUS'], ['call_proof', 'แจ้งหลักฐานการโทร']],
      [['car_text', 'รถลูกค้าถาม']], [['car_model', 'CAR / สูตร']],
      [['fill_note', 'มากรอกชีตกันเถอะ', 'area']],
    ] },
    { sec: 'โปรไฟล์ลูกค้า', rows: [
      [['occupation', 'อาชีพ'], ['income', 'รายได้']],
      [['job_tenure', 'อายุงาน'], ['pay_history', 'ประวัติการผ่อน']],
      [['customer_type', 'ประเภทลูกค้า']],
      [['admin_profile', 'PROFILE ลูกค้า จาก ADMIN', 'area']],
    ] },
  ];
  let _DDF = {};                       // ตัวเลือก dropdown ของแชทที่เปิดอยู่ (ตั้งใน profileHtml)

  function leadField(L, f, label, kind, ed, sfx) {
    const A = L.auto || {}, v = L[f] || '';
    const badge = (A[f] && A[f] !== 'คน') ? `<span class="pf-auto" title="ระบบเติมให้อัตโนมัติจาก${h(A[f])} — แก้ได้">จาก${h(A[f])}</span>` : '';
    const dis = ed ? '' : ' disabled';
    const opts = Array.isArray(_DDF[f]) && _DDF[f].length ? _DDF[f] : null;
    let inp;
    if (opts) {
      // ค่าเดิมที่ไม่อยู่ในตัวเลือกของชีต (กรอกก่อนมี dropdown / มาจากใบจ่ายลีด) — โชว์ไว้ ไม่ทิ้งข้อมูล
      const extra = v && !opts.includes(v) ? `<option value="${h(v)}" selected>${h(v)} (นอกตัวเลือกชีต)</option>` : '';
      inp = `<select data-f="${f}" class="${v ? '' : 'empty'}"${dis}><option value="">— เลือก —</option>${
        opts.map(o => `<option value="${h(o)}"${o === v ? ' selected' : ''}>${h(o)}</option>`).join('')}${extra}</select>`;
    } else if (kind === 'area') inp = `<textarea data-f="${f}" rows="2"${dis}>${h(v)}</textarea>`;
    else inp = `<input type="${kind === 'tel' ? 'tel' : 'text'}" data-f="${f}" value="${h(v)}"${dis} autocomplete="off">`;
    return `<div class="pf-fld"><div class="pf-lab"><span>${h(label)}</span>${badge}</div>${inp}</div>`;
  }

  function profileHtml(d, sfx) {
    const p = d.profile, r = d.row, L = d.lead;
    if (!p) return '';
    const ed = !!d.leadEditable;
    const shownName = (L && L.customer_name) || p.name;
    let x = `<div class="pf-top">${avHtml(shownName, p.pic, 'lg')}
      <div class="pf-name-row"><span class="pf-name">${h(shownName)}</span>${L && ed ? `<button class="pf-pen" data-act="name" title="แก้ชื่อลูกค้า">✎</button>` : ''}</div>
      ${p.lineName && p.lineName !== shownName ? `<div class="pf-line">ชื่อใน ${p.src === 'fb' ? 'Facebook' : 'LINE'}: ${h(p.lineName)}</div>` : ''}
      ${p.src === 'fb' ? `<div class="pf-line">${chTag('fb')} ${h(p.page || '')}</div>${p.inbox ? `<a class="btn sm" href="${h(p.inbox)}" target="_blank" rel="noopener">เปิดใน Facebook ↗</a>` : ''}` : ''}
      ${p.status ? `<div class="pf-status">\u201c${h(p.status)}\u201d</div>` : ''}`;
    if (L) {
      x += `<div class="pf-tags">${(L.tags || []).map(t => `<span class="pf-tag">${h(t)}${ed ? `<button data-tag-del="${h(t)}" title="เอาแท็กออก">×</button>` : ''}</span>`).join('')}
        ${ed ? `<input class="pf-tag-in" data-act="tag" placeholder="+ ใส่แท็ก" list="dl-tag-${sfx}">` : ''}</div>`;
    }
    x += `</div>`;
    x += `<div class="pf-sec">
      <div class="pf-kv"><span>ผู้รับผิดชอบ</span><span>${r.owner ? h(r.owner) + (r.team ? ' · ทีม ' + h(r.team) : '') : 'ยังไม่มีคนรับ'}</span></div>`;
    if (!p.full) {
      return x + `<div class="pf-kv"><span>ทักครั้งแรก</span><span>${h(fmtFull(p.firstSeen)) || '–'}</span></div></div>
        <div class="pf-sec pf-lock">ข้อมูลลีด เบอร์โทร และรถที่ลูกค้าหา เห็นได้หลังกด "รับลูกค้าคนนี้"</div>`;
    }
    // ช่องที่ระบบคำนวณเอง (ไม่ให้แก้ — แก้แล้วจะไม่ตรงกับของจริง)
    x += `<div class="pf-kv"><span>ว/ด/ป · เวลา</span><span>${h(fmtFull(L ? L.leadAt : p.firstSeen)) || '–'}</span></div>
      ${L ? `<div class="pf-kv"><span>วันเวลาที่ติดต่อ</span><span>${h(fmtFull(L.contactAt)) || 'ยังไม่ได้ตอบ'}</span></div>
      <div class="pf-kv"><span>จำนวนอัพเดท</span><span>${L.updates}</span></div>
      <div class="pf-kv"><span>อัพเดทล่าสุด</span><span>${h(fmtFull(L.lastUpdate)) || '–'}</span></div>` : ''}
      <div class="pf-kv"><span>ข้อความทั้งหมด</span><span>${p.msgs}</span></div>
      ${p.language ? `<div class="pf-kv"><span>ภาษา</span><span>${h(LANG[p.language] || p.language)}</span></div>` : ''}
    </div>`;
    if (!L) {
      return x + (d.leadError ? `<div class="pf-sec pf-lock" style="color:var(--red)">${h(d.leadError)}</div>` : '');
    }
    const O = d.leadOptions || {};
    _DDF = O.dropdowns || {};
    const dls = `<datalist id="dl-tag-${sfx}">${(O.tags || []).map(v => `<option value="${h(v)}">`).join('')}</datalist>`;
    const src = O.source || {};
    const ddNote = `<div class="pf-note">ตัวเลือกตาม dropdown ของชีตลีด${src.tab ? ' แท็บ ' + h(src.tab) : ''}${
      src.fallback ? ' (ชุดที่จำไว้ ยังอ่านชีตล่าสุดไม่ได้)' : ''}</div>`;
    if (L.slip) {
      x += `<div class="pf-src">ดึงข้อมูลจากใบจ่ายลีดใน "${h(L.slip.group || 'กลุ่มจ่ายเบอร์')}" (${h(fmtFull(L.slip.at))})</div>`;
    }
    if (!ed) x += `<div class="pf-lock" style="margin:6px 0">ดูได้อย่างเดียว — แก้ได้เฉพาะเจ้าของลูกค้าและแอดมิน</div>`;
    if (L.assignedAt) {
      x += `<div class="pf-done">จ่ายเบอร์ <b>${h(L.code)}</b> แล้ว · ${h(fmtFull(L.assignedAt))}${L.assignedBy ? ' โดย ' + h(L.assignedBy) : ''}${
        L.codeDemo ? ' · ทดลอง (ยังไม่ลงชีต ไม่ได้ส่งเข้ากลุ่ม)' : postStatusHtml(L.post, d.codeHelp ? 'data-act="repost"' : 'disabled')}</div>`;
    } else if (L.noCode && !L.code) {
      // แอดมินกด "ไม่ต้องจ่ายเบอร์" ไว้ (ไม่ใช่ลีดขาย) — ออกจากแท็บจ่ายเบอร์แล้ว · กดเอากลับได้
      x += `<div class="pf-skip"><span>ไม่ต้องจ่ายเบอร์${L.noCode.by ? ' · ' + h(L.noCode.by) : ''}${L.noCode.at ? ' ' + h(fmtFull(L.noCode.at)) : ''}</span>
        ${d.codeHelp ? `<button class="btn sm" data-act="nocode-undo">เอากลับมาจ่ายเบอร์</button>` : ''}</div>`;
    } else if (L.buy && !L.code) {
      // แอดมินส่งเข้ากลุ่มเคสHOT ของจัดซื้อแล้ว (ใบ "โค้ด : OC-…") — ลูกค้าอยากขายรถให้เรา ไม่ใช่ลีดขาย ไม่ต้องจ่ายเบอร์
      const B = L.buy;
      x += `<div class="pf-done">ส่งจัดซื้อแล้ว <b>${h(B.code)}</b>${B.seller ? ' → @' + h(B.seller) : ''}
        · ${h(fmtFull(B.at))}${B.by ? ' โดย ' + h(B.by) : ''}<br><span style="color:var(--t2)">ใน "${h(B.group || 'เคสHOT')}" — ลูกค้าอยากขายรถให้เรา</span></div>`;
    } else if (d.codeHelp && !L.code) {
      x += assignBoxHtml(d, sfx);
    }
    LEAD_UI.forEach(sec => {
      x += `<div class="pf-sec"><div class="pf-h">${h(sec.sec)}</div>${sec.sec === 'ข้อมูลลีด' ? ddNote : ''}`;
      sec.rows.forEach(row => {
        const cells = row.map(([f, lab, kind]) => leadField(L, f, lab, kind, ed, sfx));
        x += row.length > 1 ? `<div class="pf-g2">${cells.join('')}</div>` : cells[0];
        // เบอร์ที่เจอในแชท — กดเพื่อใช้เป็นเบอร์หลัก
        if (row.some(c => c[0] === 'phone')) {
          const other = (p.phones || []).filter(n => n !== L.phone);
          if (other.length && ed) x += `<div class="pf-phs"><span style="color:var(--t3);font-size:12px">ในแชท:</span>${other.map(n =>
            `<button class="pf-phc" data-phone="${h(n)}" title="ใช้เบอร์นี้">${h(fmtPhone(n))}</button>`).join('')}</div>`;
          if (L.phone) x += `<div class="pf-phs"><a class="btn sm" href="tel:${h(L.phone)}">โทร ${h(fmtPhone(L.phone))}</a></div>`;
        }
      });
      x += `</div>`;
    });
    x += `<div class="pf-sec pf-slip"><div class="pf-h">ใบจ่ายลีด (ย่อ)</div>
      <div class="pf-g2">${leadField(L, 'live', 'ไลฟ์', '', ed, sfx)}<div></div></div>
      ${leadField(L, 'more', 'เพิ่มเติม', 'area', ed, sfx)}
      <pre class="pf-slip-text">${h(L.slipText || '')}</pre>
      <button class="btn sm" data-act="copy-slip">คัดลอกใบจ่ายลีด</button></div>`;
    const needs = p.needs || [];
    if (needs.length) {
      x += `<div class="pf-sec"><div class="pf-h">รถที่ลูกค้าหา (จากระบบจับความต้องการ)</div>${needs.map(n =>
        `<div class="pf-need"><b>${h(n.car)}</b>${n.detail ? h(n.detail) + '<br>' : ''}<span style="color:var(--t3)">${h(n.status)}${n.waiting ? ' · รอรถที่ตรงสเปก' : ''}</span></div>`).join('')}</div>`;
    }
    return x + dls;
  }

  // ── ปุ่ม "จ่ายเบอร์" (แอดมิน) — ★ 6 ต.ค.69 ส่งใบเข้ากลุ่มจ่ายเบอร์จริง + แท็กเซลล์ (สวิตช์ปิด = ทดลองเดิม) ──
  //   ตัวหน้าตาม type ในชีต: NLD=Moderate WLD=Hot HLD=Very Hot BLD=BLD TLD=TikTok · A=ลีดแอดมิน · R=รีเจ็ค
  //   บอกล่วงหน้าว่า "กดแล้วส่งเข้าห้องไหน" (ch.post) — ส่งเข้ากลุ่มจริง = มีคนทั้งห้องเห็น ต้องรู้ก่อนกด
  function postNoteHtml(P, what) {
    if (!P) return '';
    if (!P.on) return `<div class="pf-lock" style="font-size:12px;margin:6px 0">${P.sim
      ? 'ลูกค้าจำลอง — ออกเลขทดลอง ไม่ส่งเข้ากลุ่มจริง'
      : `ทดลอง — เก็บในระบบเราเท่านั้น ยังไม่ลงชีต ไม่โพสต์กลุ่ม (เปิดส่งจริงได้ที่ ตั้งค่า) · เลขจริงคำนวณใหม่ตอนกด`}</div>`;
    const room = P.room ? `"${h(P.room)}"` : '<b style="color:var(--red)">ยังไม่พบกลุ่มจ่ายเบอร์ที่บอทตัวส่งอยู่ (ตั้งได้ที่ ตั้งค่า)</b>';
    return `<div class="pf-src" style="font-size:12px;margin:6px 0;line-height:1.5">กดแล้ว: ออกเลข → ${h(what)}
      → ส่งใบเข้า ${room}${P.rejectRoom && P.rejectRoom !== P.room ? ` (เลข R… → "${h(P.rejectRoom)}")` : ''} พร้อมแท็ก @เซลล์
      · ไม่ลงชีต · เลขจริงคำนวณใหม่ตอนกด (กันซ้ำ)</div>${P.fb
      ? `<div class="pf-lock" style="font-size:12px;margin:0 0 6px;color:var(--amber)">${h(P.fbNote)}</div>` : ''}`;
  }
  // ผลส่งใบเข้ากลุ่ม (post_info) — ส่งไม่สำเร็จ = ปุ่ม "ส่งเข้ากลุ่มอีกครั้ง" (การจ่ายในระบบยังอยู่ ไม่ต้องจ่ายใหม่)
  function postStatusHtml(post, btnAttr) {
    if (!post) return '';
    if (post.ok) {
      return `<br><span style="color:var(--green)">ส่งเข้า "${h(post.groupName || 'กลุ่มจ่ายเบอร์')}" แล้ว</span>${
        post.tagged ? ` · แท็ก @${h(post.seller || '')}` : ` · <span style="color:var(--amber)">แท็กไม่ได้ (${h(post.tagWhy || '-')}) — พิมพ์ @${h(post.seller || '')} แทน</span>`}`;
    }
    if (post.sending && !post.error) return `<br><span style="color:var(--t3)">กำลังส่งเข้ากลุ่ม…</span>`;
    return `<br><span style="color:var(--red)">ส่งเข้ากลุ่มไม่สำเร็จ: ${h(post.error || '-')}</span>
      <div style="margin-top:6px"><button class="btn sm pri" ${btnAttr}>ส่งเข้ากลุ่มอีกครั้ง</button></div>`;
  }
  function assignBoxHtml(d, sfx) {
    const ch = d.codeHelp, sg = ch.suggest || {}, r = d.row;
    // ที่แอดมินเลือกค้างไว้ต้องไม่หาย ตอนแผงถูกวาดใหม่ (ข้อความใหม่เข้ามา/ระบบเติมข้อมูลลีด)
    const dr = (S.assignDraft && S.assignDraft.id === r.id) ? S.assignDraft : null;
    const vBase = dr ? dr.base : sg.base, vEmp = dr ? dr.emp : r.ownerId;
    const vAdmin = dr ? dr.admin : sg.admin, vReject = dr ? dr.reject : sg.reject;
    const bases = (ch.bases || []).map(b => `<option value="${h(b.key)}"${b.key === vBase ? ' selected' : ''}>${h(b.key)} · ${h(b.type)}</option>`).join('');
    const sellers = S.sellers.map(s => `<option value="${s.id}"${s.id === vEmp ? ' selected' : ''}>${h(s.name)} · ทีม ${h(s.team)}</option>`).join('');
    const sugCode = (sg.reject ? 'R' : '') + (sg.admin ? 'A' : '') + (sg.base || '');
    const P = ch.post || null, live = !!(P && P.on);
    return `<div class="pf-assign" data-box="assign">
      <div class="pf-h" style="margin-bottom:6px">จ่ายเบอร์ <span class="pf-auto">${live ? 'ส่งเข้ากลุ่มจริง' : 'ทดลอง'}</span></div>
      <div class="pf-g2">
