    return `<div class="pf-assign" data-box="assign">
      <div class="pf-h" style="margin-bottom:6px">จ่ายเบอร์ <span class="pf-auto">${live ? 'ส่งเข้ากลุ่มจริง' : 'ทดลอง'}</span></div>
      ${dupHtml(ch.dup)}${maybeHtml(ch)}${rrHtml(ch.rr)}
      <div class="pf-g2">
        <div class="pf-fld"><div class="pf-lab"><span>ตัวหน้า</span></div><select data-x="base">${bases}</select></div>
        <div class="pf-fld"><div class="pf-lab"><span>จ่ายให้เซลล์</span></div><select data-x="emp"><option value="">— เลือก —</option>${sellers}</select></div>
      </div>
      <label class="ck"><input type="checkbox" data-x="admin"${vAdmin ? ' checked' : ''}> A — ลีดของแอดมิน</label>
      <label class="ck"><input type="checkbox" data-x="reject"${vReject ? ' checked' : ''}> R — เคสรีเจ็ค</label>
      ${pfxHelpHtml(sg, sugCode)}
      <div style="margin:6px 0 2px;color:var(--t3);font-size:12px">เลขที่จะได้:</div>
      <div class="pf-code" data-x="preview"></div>
      ${postNoteHtml(P || { on: false }, P && P.fb ? 'ลูกค้าเป็นของเซลล์ในระบบ (เก็บข้อมูลเท่านั้น)' : 'โอนแชทให้เซลล์ (ตอบลูกค้าผ่าน Connect)')}
      <button class="btn pri" data-act="assign-lead" style="width:100%">${live ? 'จ่ายเบอร์ + ส่งเข้ากลุ่ม' : 'จ่ายเบอร์'}</button>
      <button class="btn sm" data-act="nocode" style="width:100%;margin-top:6px"
        title="ลูกค้าไม่ใช่ลีดขาย (ถามศูนย์บริการ · อยากขายรถให้เรา · ลูกค้าเก่าทักมาขอบคุณ) — เอาออกจากแท็บจ่ายเบอร์">ไม่ต้องจ่ายเบอร์ (ไม่ใช่ลีดขาย)</button>
    </div>`;
  }
  // ── ★ 10 ต.ค.69 ลูกค้าที่มีเลขแล้ว: นาฬิกาโทร + จ่ายใหม่ (เลขเดิม) + ส่งต่อไม้ 2 (R+เลขเดิม+/1 → ห้อง REJECT) ──
  function lfBoxHtml(d) {
    const ch = d.codeHelp || {}, t = ch.task, r = d.row;
    if (!t && !ch.fwd) return '';
    const sellers = S.sellers.filter(s => s.id !== r.ownerId)
      .map(s => `<option value="${s.id}">${h(s.name)} · ทีม ${h(s.team)}</option>`).join('');
    let x = `<div class="lf-box" data-box="lf">`;
    if (t) {
      x += `<div class="pf-h" style="margin-bottom:4px">นาฬิกาโทร ${taskTag(t)}</div>
        <div class="lf-line">${h(t.code)} → @${h(t.seller || '-')}${t.dueAt ? ' · ต้องรายงานผลภายใน ' + h(fmtWhen(t.dueAt)) + ' น.' : ''}
        ${t.lastReport ? `<br>รายงานล่าสุด: <b>${h(t.lastReport)}</b>` : ''}</div>
        ${t.canReassign && /overdue|passed|waiting|unsent/.test(t.kind) ? `<div class="lf-acts">
          <button class="btn sm" data-lf="reassign" data-task="${t.id}">จ่ายใหม่ให้คนถัดไปในคิว (เลขเดิม)</button></div>` : ''}`;
    }
    if (ch.fwd) {
      x += `<div class="pf-h" style="margin:${t ? '10px' : '0'} 0 4px">ส่งต่อไม้ 2</div>
        <div class="lf-line">ออกเลข <b>${h(ch.fwd)}</b> (R + เลขเดิม + /1 แบบที่ทีมใช้) → โอนลูกค้า → ใบเข้าห้องจ่ายเบอร์ REJECT</div>
        ${rrHtml(ch.rr)}
        <select data-x="emp" style="margin-top:4px"><option value="">— เลือกเซลล์ไม้ 2 —</option>${sellers}</select>
        <button class="btn sm pri" data-lf="forward" style="width:100%;margin-top:6px">ส่งต่อไม้ 2</button>`;
    }
    return x + `</div>`;
  }
  // ★ 17 ต.ค.69 ตัวหน้าอัตโนมัติ (checkout/lead_code.py) — บอกว่าทำไมได้ตัวหน้านี้ + ติ๊กเอกสารรายได้เองได้
  const PFX_LABEL = { HLD: 'Very Hot', WLD: 'Hot', LD: 'Moderate', NLD: 'Moderate', BLD: 'BLD', TLD: 'TLD', TALD: 'TLD' };
  function pfxHelpHtml(sg, code) {
    const rs = sg.reasons || [];
    const lab = PFX_LABEL[sg.base] ? ` · ${PFX_LABEL[sg.base]}` : '';
    let x = `<div class="pf-pfx"><div>ระบบแนะนำ <b>${h(code)}</b>${h(lab)} — ${h(sg.why || '')}</div>`;
    if (rs.length > 1) x += `<details><summary>เกณฑ์ที่เข้าทั้งหมด ${rs.length} ข้อ</summary>${rs.map(([k, t]) =>
      `<div class="pf-pfx-r"><b>${h(k)}</b> ${h(t)}</div>`).join('')}</details>`;
    if (sg.auto) x += `<label class="ck" style="margin-top:4px"><input type="checkbox" data-doc${sg.doc ? ' checked' : ''}>
      มีเอกสารยืนยันรายได้ (สลิป/ใบรับรองเงินเดือน/statement)${sg.doc && sg.docAuto ? ' <span class="pf-auto">เห็นจากแชท</span>' : ''}</label>`;
    return x + `</div>`;
  }
  function codePreview(box) {
    const ch = (S.chat || {}).codeHelp; if (!ch || !box) return;
    const q = k => box.querySelector(`[data-x="${k}"]`);
    const pre = (q('reject').checked ? 'R' : '') + (q('admin').checked ? 'A' : '') + q('base').value;
    q('preview').textContent = pre + ch.month + '-' + ch.next;
  }

  // แผงโปรไฟล์ถูกเรียกวาดใหม่ทุก 6 วิ (ตามแชท) — **ห้ามวาดทับตอนกำลังพิมพ์ในฟอร์ม**
  //   และไม่วาดถ้าข้อมูลไม่เปลี่ยน (กันกระพริบ/เลื่อนกลับบนสุด)
  let _profSig = '';
  // ข้อความ (จำนวน + ตัวสุดท้าย) อยู่ในลายเซ็นด้วย — ป้าย "จากแชท 14:02" / ความพร้อม (รูปรถ) / ปุ่มถามต่อ อิงแชท
  const profSig = d => JSON.stringify([d.row.id, d.profile, d.lead, d.leadEditable, d.row.owner, d.row.team,
                                       d.codeHelp && d.codeHelp.task, d.codeHelp && d.codeHelp.dup, d.crm,
                                       d.codeHelp && d.codeHelp.suggest,      // ★ 17 ต.ค.69 ตัวหน้าที่แนะนำเปลี่ยน (ติ๊กเอกสาร/ลูกค้าให้ข้อมูลเพิ่ม) = วาดใหม่
                                       S.lostPick === d.row.id, S.aiDraft[d.row.id] || null, d.canReply, d.replyOn,
                                       (d.messages || []).length, ((d.messages || []).slice(-1)[0] || {}).id || '']);
  function paintProfile(force) {
    const d = S.chat; if (!d) return;
    const sig = profSig(d);
    const act = document.activeElement;
    const typing = act && act.closest && act.closest('#cn-side, #cn-prof-m-body') && /INPUT|TEXTAREA|SELECT/.test(act.tagName);
    if (!force && (sig === _profSig || typing)) return;
    _profSig = sig;
    ['cn-side', 'cn-prof-m-body'].forEach((id, i) => {
      const el = $(id); if (!el) return;
      const top = el.scrollTop;
      el.innerHTML = profileHtml(d, i ? 'm' : 's');
      el.scrollTop = top;
      bindProfile(el);
    });
  }

  function bindProfile(el) {
    bindCrm(el);
    bindKw(el);
    // ★ 17 ต.ค.69 "ข้อมูลเพิ่มเติม" — คนกาง/พับเอง = จำไว้ในเครื่อง (ระบบกางให้ตอนกดจ่ายเบอร์ = ไม่จำ)
    const more = el.querySelector('details.pf-more');
    if (more) more.addEventListener('toggle', () => {
      S.moreOpen = more.open;
      if (_moreAuto) { _moreAuto = false; return; }
      try { localStorage.setItem('cn_more', more.open ? '1' : '0'); } catch (e) {}
    });
    el.querySelectorAll('[data-f]').forEach(inp => {
      inp.addEventListener('change', () => {
        if (inp.tagName === 'SELECT') inp.classList.toggle('empty', !inp.value);
        saveLead(inp.dataset.f, inp.type === 'checkbox' ? (inp.checked ? 'ส่งแล้ว' : '') : inp.value, inp);
      });
      if (inp.tagName === 'INPUT' && inp.type !== 'checkbox') {
        inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); inp.blur(); } });
      }
    });
    el.querySelectorAll('[data-phone]').forEach(b => b.onclick = () => saveLead('phone', b.dataset.phone, null, true));
    el.querySelectorAll('[data-tag-del]').forEach(b => b.onclick = () => {
      const L = S.chat.lead; saveLead('tags', (L.tags || []).filter(t => t !== b.dataset.tagDel), null, true);
    });
    const tg = el.querySelector('[data-act=tag]');
    if (tg) tg.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || e.isComposing) return;
      e.preventDefault();
      const t = tg.value.trim(); if (!t) return;
      const L = S.chat.lead; saveLead('tags', (L.tags || []).concat([t]), null, true);
    });
    const nb = el.querySelector('[data-act=name]');
    if (nb) nb.onclick = () => {
      const row = nb.closest('.pf-name-row');
      const cur = (S.chat.lead && S.chat.lead.customer_name) || S.chat.profile.name;
      row.innerHTML = `<input class="pf-name-in" value="${h(cur)}" placeholder="ชื่อลูกค้า">`;
      const ni = row.querySelector('input'); ni.focus(); ni.select();
      let done = false;
      const fin = (save) => { if (done) return; done = true;
        if (save && ni.value.trim() !== cur) saveLead('customer_name', ni.value.trim(), null, true); else paintProfile(true); };
      ni.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) fin(true); if (e.key === 'Escape') fin(false); });
      ni.addEventListener('blur', () => fin(true));
    };
    const box = el.querySelector('[data-box=assign]');
    if (box) {
      const dk = box.querySelector('[data-doc]');
      if (dk) dk.onchange = async () => {            // ★ 17 ต.ค.69 มีเอกสารยืนยันรายได้ → เกณฑ์ HLD (ตัวหน้าคิดใหม่)
        const id = S.chat.row.id, sg = (S.chat.codeHelp || {}).suggest || {};
        dk.disabled = true;
        const r = await api('/connect/api/assign_lead', { id, doc: dk.checked });
        if (!r.ok) { dk.disabled = false; dk.checked = !dk.checked; toast(r.error || 'บันทึกไม่สำเร็จ'); return; }
        if (S.assignDraft && S.assignDraft.id === id && S.assignDraft.base === sg.base) S.assignDraft = null;   // ยังไม่ได้เลือกตัวหน้าเอง = ตามที่ระบบคิดใหม่
        toast(r.message, 2500);
        openChat(id, true);
      };
      box.querySelectorAll('[data-x]').forEach(x => x.addEventListener('change', () => {
        const q = k => box.querySelector(`[data-x="${k}"]`);
        S.assignDraft = { id: S.chat.row.id, base: q('base').value, emp: +(q('emp').value || 0),
                          admin: q('admin').checked, reject: q('reject').checked };
        codePreview(box);
      }));
      codePreview(box);
      bindPick(box);
      box.querySelector('[data-act=assign-lead]').onclick = async (ev) => {
        const q = k => box.querySelector(`[data-x="${k}"]`);
        const emp = +(q('emp').value || 0);
        if (!emp) { toast('เลือกเซลล์ที่จะจ่ายเบอร์ให้ก่อน'); return; }
        const P = (S.chat.codeHelp || {}).post || {};
        const dp = (S.chat.codeHelp || {}).dup;
        const nm = (S.sellers.find(s => s.id === emp) || {}).name || '';
        if (dp && dp.sellerId && dp.sellerId !== emp
            && !confirm(`เบอร์นี้เคยเป็นลีด ${dp.code || ''} ของ @${dp.seller}\nยังจะจ่ายให้ ${nm} อีกคนใช่ไหม?`)) return;
        if (P.on) {                              // ส่งเข้ากลุ่มจริง = ทั้งห้องเห็น — ถามก่อนทุกครั้ง
          const room = q('reject').checked && P.rejectRoom ? P.rejectRoom : P.room;
          if (!confirm(`จ่ายเบอร์ ${q('preview').textContent} ให้ ${nm}\nแล้วส่งใบเข้า "${room || 'กลุ่มจ่ายเบอร์'}" พร้อมแท็ก @${nm} ?`)) return;
        }
        ev.target.disabled = true;
        const id = S.chat.row.id;
        const r = await api('/connect/api/assign_lead', { id, emp, base: q('base').value,
          admin: q('admin').checked, reject: q('reject').checked });
        ev.target.disabled = false;
        toast(r.ok ? r.message : (r.error || 'จ่ายเบอร์ไม่สำเร็จ'), r.post && !r.post.ok ? 9000 : 6000);
        if (r.ok) { S.assignDraft = null; openChat(id, true); loadInbox(false); }
      };
    }
    const lfb = el.querySelector('[data-box=lf]');
    if (lfb) {
      bindPick(lfb);
      lfb.querySelectorAll('[data-lf=reassign]').forEach(b => b.onclick = async () => {
        if (!confirm('จ่ายเคสนี้ใหม่ให้คนถัดไปในคิวจ่ายวน (เลขเดิม · ใบเดิม แท็กคนใหม่)?')) return;
        const id = S.chat.row.id; b.disabled = true;
        const r = await api('/connect/api/leadflow', { action: 'reassign', task: +b.dataset.task });
        b.disabled = false; toast(r.ok ? r.message : (r.error || 'ไม่สำเร็จ'), 7000);
        openChat(id, true); loadInbox(false);
      });
      const fw = lfb.querySelector('[data-lf=forward]');
      if (fw) fw.onclick = async () => {
        const emp = +(lfb.querySelector('[data-x="emp"]').value || 0);
        if (!emp) { toast('เลือกเซลล์ไม้ 2 ก่อน'); return; }
        const nm = (S.sellers.find(s => s.id === emp) || {}).name || '';
        if (!confirm(`ส่งต่อไม้ 2 เลข ${(S.chat.codeHelp || {}).fwd} ให้ ${nm}\n(โอนลูกค้า + ส่งใบเข้าห้องจ่ายเบอร์ REJECT พร้อมแท็ก)?`)) return;
        const id = S.chat.row.id; fw.disabled = true;
        const r = await api('/connect/api/leadflow', { action: 'forward', id, emp });
        fw.disabled = false; toast(r.ok ? r.message : (r.error || 'ไม่สำเร็จ'), 8000);
        if (r.ok) { openChat(id, true); loadInbox(false); }
      };
    }
    // "ส่งเข้ากลุ่มอีกครั้ง" — รอบแรกส่งไม่สำเร็จ (การจ่ายในระบบยังอยู่ ไม่ออกเลขใหม่)
    el.querySelectorAll('[data-act=repost]').forEach(b => b.onclick = async () => {
      const id = S.chat.row.id;
      b.disabled = true;
      const r = await api('/connect/api/assign_lead', { id, resend: true });
      b.disabled = false;
      toast(r.ok ? r.message : (r.error || 'ส่งไม่สำเร็จ'), 6000);
      openChat(id, true); loadInbox(false);
    });
    // "ไม่ต้องจ่ายเบอร์" / "เอากลับมาจ่ายเบอร์"
    const skipLead = async (ev, on) => {
      const id = S.chat.row.id;
      ev.target.disabled = true;
      const r = await api('/connect/api/assign_lead', { id, skip: on });
      ev.target.disabled = false;
      toast(r.ok ? r.message : (r.error || 'ทำไม่สำเร็จ'), 3500);
      if (r.ok) { S.assignDraft = null; openChat(id, true); loadInbox(false); }
    };
    el.querySelectorAll('[data-act=nocode]').forEach(b => b.onclick = ev => skipLead(ev, true));
    // "รับ lead จากแชทนี้แล้ว" (ส่งเข้าห้องพัก Lead) / "เอาออกจากห้องพัก"
    const parkLead = async (ev, on) => {
      const id = S.chat.row.id;
      ev.target.disabled = true;
      const r = await api('/connect/api/assign_lead', { id, park: on });
      ev.target.disabled = false;
      toast(r.ok ? r.message : (r.error || 'ทำไม่สำเร็จ'), 3500);
      if (r.ok) { openChat(id, true); loadInbox(false); }
    };
    el.querySelectorAll('[data-act=park]').forEach(b => b.onclick = ev => parkLead(ev, true));
    el.querySelectorAll('[data-act=park-undo]').forEach(b => b.onclick = ev => parkLead(ev, false));
    el.querySelectorAll('[data-act=nocode-undo]').forEach(b => b.onclick = ev => skipLead(ev, false));
    // ★ 11 ต.ค.69 ลีดรับซื้อรถ / ลีดขายรถ — แอดมินตั้งเอง (ระบบไม่เดาทับ)
    const dealLead = async (ev, kind) => {
      ev.preventDefault();
      const id = S.chat.row.id;
      ev.target.disabled = true;
      const r = await api('/connect/api/assign_lead', { id, kind });
      ev.target.disabled = false;
      toast(r.ok ? r.message : (r.error || 'ทำไม่สำเร็จ'), 4500);
      if (r.ok) { S.assignDraft = null; openChat(id, true); loadInbox(false); }
    };
    el.querySelectorAll('[data-act=deal-buy]').forEach(b => b.onclick = ev => dealLead(ev, 'buy'));
    el.querySelectorAll('[data-act=deal-sell]').forEach(b => b.onclick = ev => dealLead(ev, 'sell'));
    const cpb = el.querySelector('[data-act=copy-buyslip]');
    if (cpb) cpb.onclick = () => {
      const t = (S.chat.lead || {}).buySlipText || '';
      try { navigator.clipboard.writeText(t); toast('คัดลอกใบเคสรับซื้อแล้ว — เติมเลขโค้ดแล้ววางในกลุ่มเคสHOT'); } catch (e) { toast('คัดลอกไม่ได้'); }
    };
    const cp = el.querySelector('[data-act=copy-slip]');
    if (cp) cp.onclick = () => {
      const t = (S.chat.lead || {}).slipText || '';
      try { navigator.clipboard.writeText(t); toast('คัดลอกใบจ่ายลีดแล้ว — วางในกลุ่มจ่ายเบอร์ได้เลย'); } catch (e) { toast('คัดลอกไม่ได้'); }
    };
  }

  // ── ★ 11 ต.ค.69 หน้ารวมแชท: งานกับลูกค้าคนนี้ (สเปกข้อ 5/6/10) ──
  //   ขั้นของลีด · ความร้อน · สถานะไฟแนนซ์ (ชีตยอดขาย) · รถใหม่ตรง · นัดหมาย · บันทึกการโทร + หลักฐาน · สรุป (AI ร่าง) · ใครเคยดูแล
  //   ที่พิมพ์ค้างไว้เก็บใน S.*Draft[id] — แผงถูกวาดใหม่เมื่อข้อมูลเปลี่ยน ห้ามทำให้ที่พิมพ์หาย
  const pad2 = n => String(n).padStart(2, '0');
  const localDT = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  const fmtBaht = n => n ? '฿' + Number(n).toLocaleString() : '';
  function crmHtml(d, sfx) {
    const K = d.crm, id = d.row.id, ed = !!d.leadEditable, E = K.extra || {};
    let x = `<div class="pf-sec"><div class="pf-h">ขั้นของลีด${E.heat ? ` · <span class="tag ht-${h(E.heat)}">${HEAT_TXT[E.heat]} ${E.heatScore}</span>` : ''}</div>
      <div class="crm-stages">${K.stages.map(s => `<button data-stage="${h(s.key)}" class="${E.stage === s.key ? 'on' : ''}"${ed ? '' : ' disabled'}>${h(s.label)}</button>`).join('')}</div>
      <div class="crm-line">ตอนนี้: <b>${h(E.stageLabel || '')}</b>${E.stage === 'lost' && E.lostReason ? ' · ' + h(E.lostReason) : ''}${
        K.stageBy ? ` · ตั้งโดย ${h(K.stageBy)} ${h(fmtFull(K.stageAt))}${ed ? ` · <a href="#" data-stage="">ให้ระบบคิดเอง</a>` : ''}` : ' · ระบบคิดให้ (จากการรับ/ตอบลูกค้า)'}</div>`;
    if (S.lostPick === id) {
      x += `<div class="crm-form"><select data-x="lost"><option value="">— เหตุผลที่ไม่ซื้อ (ใช้วิเคราะห์) —</option>${K.lostReasons.map(r => `<option>${h(r)}</option>`).join('')}</select>
        <div class="crm-qd"><button class="btn sm red" data-act="lost-save">บันทึก ไม่สนใจ</button><button class="btn sm" data-act="lost-cancel">ยกเลิก</button></div></div>`;
    }
    if ((E.heatWhy || []).length) x += `<div class="pf-note" style="margin-top:6px">ความร้อน ${E.heatScore}/100 — ${h(E.heatWhy.join(' · '))}</div>`;
    const B = K.booking;
    if (B) x += `<div class="pf-done" style="color:var(--t1)">ชีตยอดขาย: <b>${h(B.status || '-')}</b>${B.car ? ' · ' + h(B.car) : ''}${B.date ? ' · จอง ' + h(B.date) : ''}${
      B.signDate ? ' · เซ็น ' + h(B.signDate) : ''}${B.resultDate ? ' · ผล ' + h(B.resultDate) : ''}${B.releaseDate ? ' · ปล่อย ' + h(B.releaseDate) : ''}${B.price ? ' · ' + fmtBaht(B.price) : ''}</div>`;
    // รถพร้อมขายที่ตรง → หัวข้อ "รุ่นรถที่สนใจ" · นัดหมาย → หัวข้อ "นัดดูรถ" (★ 17 ต.ค.69 ย้ายขึ้นบนสุดของแผง)
    x += `</div>`;
    // บันทึกการโทร
    const cd = S.callDraft[id] || {}, cm = S.callMedia[id] || [];
    x += `<div class="pf-sec"><div class="pf-h">บันทึกการโทร</div>
      ${(K.calls || []).slice(0, 6).map(c => `<div class="crm-it"><b>${h(c.resultLabel)}</b> · ${h(fmtFull(c.at))}${c.by ? ' · ' + h(c.by) : ''}${c.note ? `<div>${h(c.note)}</div>` : ''}${
        (c.media || []).length ? `<div class="ph">${c.media.map(m => `<a href="${h(m.url)}" target="_blank" rel="noopener"><img src="${h(m.url)}" alt="หลักฐาน" loading="lazy"></a>`).join('')}</div>` : ''}</div>`).join('')}
      ${!(K.calls || []).length ? '<div class="pf-note">ยังไม่มีบันทึกการโทร</div>' : ''}
      ${ed ? `<div class="crm-form" data-box="call">
        <select data-x="result"><option value="">— ผลการโทร —</option>${K.callResults.map(r => `<option value="${h(r.key)}"${cd.result === r.key ? ' selected' : ''}>${h(r.label)}</option>`).join('')}</select>
        <input type="text" data-x="note" maxlength="500" placeholder="หมายเหตุ เช่น นัดโทรกลับหลัง 5 โมง" value="${h(cd.note || '')}">
        <div class="crm-up">${cm.map(m => `<img src="${h(m.url)}" alt="">`).join('')}</div>
        <label class="btn sm" style="width:100%;margin-bottom:6px">แนบรูปหลักฐานการโทร<input type="file" accept="image/*" multiple data-x="file" hidden></label>
        <button class="btn sm pri" data-act="call-add" style="width:100%">บันทึกการโทร</button></div>` : ''}</div>`;
    // สรุปลูกค้า (AI ร่าง · เซลล์ตรวจก่อนบันทึก)
    const ai = S.aiDraft[id];
    const sumVal = S.sumDraft[id] != null ? S.sumDraft[id] : (K.summary || '');
    x += `<div class="pf-sec"><div class="pf-h">สรุปลูกค้า</div>`;
    if (ai) {
      x += `<div class="crm-ai"><b>AI ร่างให้ — ตรวจก่อนบันทึก</b>${ai.stage ? `<div>ขั้นที่แนะนำ: <b>${h(ai.stageLabel)}</b>${ai.stageReason ? ' — ' + h(ai.stageReason) : ''}</div>` : ''}${
        ai.followAt ? `<div>ควรติดตาม: <b>${h(fmtFull(ai.followAt))}</b>${ai.followNote ? ' — ' + h(ai.followNote) : ''}</div>` : ''}
        <div class="acts">${ai.stage && ed ? `<button class="btn sm" data-act="ai-stage">ใช้ขั้นนี้</button>` : ''}${ai.followAt && ed ? `<button class="btn sm" data-act="ai-follow">สร้างนัดติดตามนี้</button>` : ''}<button class="btn sm" data-act="ai-close">ปิดคำแนะนำ</button></div></div>`;
    }
    if (ed) {
      x += `<div class="crm-form" data-box="sum"><textarea data-x="sum" maxlength="2000" placeholder="ลูกค้าต้องการรถอะไร งบ/ผ่อน/ดาวน์ ข้อกังวล ทำอะไรค้างไว้">${h(sumVal)}</textarea>
        <div class="crm-qd">${K.aiOn ? `<button class="btn sm" data-act="ai">ให้ AI ร่างสรุปจากแชท</button>` : ''}<button class="btn sm pri" data-act="sum-save">บันทึกสรุป</button></div>
        <div class="pf-note">${K.summaryAt ? 'บันทึกล่าสุด ' + h(fmtFull(K.summaryAt)) + (K.summaryBy ? ' โดย ' + h(K.summaryBy) : '') + ' · ' : ''}${K.aiOn ? 'AI แค่ร่าง — ระบบปิดบังเบอร์/ไอดีก่อนส่งให้ AI · ต้องกดบันทึกเอง' : 'ยังไม่ได้ตั้งคีย์ AI — พิมพ์สรุปเองได้'}</div></div>`;
    } else {
      x += K.summary ? `<div class="crm-it" style="white-space:pre-wrap">${h(K.summary)}</div>` : '<div class="pf-note">ยังไม่มีสรุป</div>';
    }
    x += `</div>`;
    // ใครเคยดูแล (ชื่อเก็บเป็นข้อความ — เซลล์ลาออกแล้วก็ยังเห็น)
    if ((K.pastOwners || []).length) {
      x += `<div class="pf-sec"><div class="pf-h">ใครเคยดูแลลูกค้าคนนี้</div>${K.pastOwners.map(o => `<div class="crm-po"><b>@${h(o.name)}</b> ${h(fmtFull(o.from))} → ${o.to ? h(fmtFull(o.to)) + ' · ' + h(o.end) : '<b style="color:var(--green)">ตอนนี้</b>'}<br><span style="color:var(--t3)">${h(o.how)}${o.by ? ' · โดย ' + h(o.by) : ''}</span></div>`).join('')}</div>`;
    }
    return x;
  }

  async function crmAct(action, extra, btn) {
    const id = S.chat && S.chat.row.id; if (!id) return null;
    if (btn) btn.disabled = true;
    const r = await api('/connect/api/crm', Object.assign({ action, id }, extra || {}));
    if (btn) btn.disabled = false;
    if (!r.ok) { toast(r.error || 'ทำไม่สำเร็จ', 5500); return null; }
    if (r.message) toast(r.message, 3500);
    if (S.chat && S.chat.row.id === id) {
      if (r.crm) S.chat.crm = r.crm;
      if (r.row) Object.assign(S.chat.row, r.row);
      paintProfile(true); paintHeader(true);
    }
    loadInbox(false); loadAlerts();
    return r;
  }
  async function crmRelease(id) {
    const why = prompt('คืนลูกค้าคนนี้เข้าคิวรอรับ (กองกลาง)?\nเหตุผล (ไม่บังคับ) เช่น ลูกค้าอยู่ต่างจังหวัด / ไม่ใช่รุ่นที่ถนัด', '');
    if (why === null) return;
    const r = await api('/connect/api/crm', { action: 'release', id, reason: why });
    if (!r.ok) { toast(r.error || 'คืนกองกลางไม่สำเร็จ', 5500); return; }
    toast('คืนกองกลางแล้ว — เซลล์ทีมที่เวรรับต่อได้', 5000);
    S.openId = 0; S.chat = null; hidePane(); renderBlank('คืนลูกค้ากลับกองกลางแล้ว');
    try { history.replaceState(null, '', '/connect/' + (BOOT.embed ? '?embed=1' : '')); } catch (e) {}
    loadInbox(true); loadAlerts();
  }
  async function upProof(file, id) {
    const fd = new FormData(); fd.append('id', id); fd.append('file', file);
    let d;
    try {
      const r = await fetch('/connect/api/upload', { method: 'POST', body: fd, credentials: 'same-origin', headers: { 'X-CSRFToken': csrf() } });
      try { d = await r.json(); } catch (e) { d = { ok: false, error: 'อัปโหลดไม่สำเร็จ (' + r.status + ')' }; }
    } catch (e) { d = { ok: false, error: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้' }; }
    return d;
  }
  function bindCrm(el) {
    const id = S.chat && S.chat.row.id; if (!id) return;
    el.querySelectorAll('[data-stage]').forEach(b => b.onclick = (e) => {
      e.preventDefault();
      const st = b.dataset.stage;
      if (st === 'lost') { S.lostPick = id; paintProfile(true); return; }
      crmAct('stage', { stage: st }, b.tagName === 'BUTTON' ? b : null);
    });
    const q = (box, k) => box.querySelector(`[data-x="${k}"]`);
    el.querySelectorAll('[data-act=lost-save]').forEach(b => b.onclick = async () => {
      const box = b.closest('.crm-form'), why = q(box, 'lost').value;
      if (!why) { toast('เลือกเหตุผลที่ไม่ซื้อก่อน'); return; }
      const r = await crmAct('stage', { stage: 'lost', reason: why }, b);
      if (r) { S.lostPick = 0; paintProfile(true); }
    });
    el.querySelectorAll('[data-act=lost-cancel]').forEach(b => b.onclick = () => { S.lostPick = 0; paintProfile(true); });
    el.querySelectorAll('[data-fdone]').forEach(b => b.onclick = () => {
      const res = prompt('ผลของนัดนี้ (ไม่บังคับ)', ''); if (res === null) return;
      crmAct('followup_done', { fid: +b.dataset.fdone, result: res }, b);
    });
    el.querySelectorAll('[data-fcancel]').forEach(b => b.onclick = () => {
      if (!confirm('ยกเลิกนัดนี้?')) return;
      crmAct('followup_done', { fid: +b.dataset.fcancel, cancel: true }, b);
    });
    const ab = el.querySelector('[data-box=appt]');
    if (ab) {
      const keep = () => { S.apptDraft[id] = { kind: q(ab, 'kind').value, due: q(ab, 'due').value, note: q(ab, 'note').value }; };
      ab.querySelectorAll('[data-x]').forEach(i => i.addEventListener('input', keep));
      ab.querySelectorAll('[data-qd]').forEach(b => b.onclick = () => {
        const d0 = new Date(nowMs()); d0.setDate(d0.getDate() + (+b.dataset.qd)); d0.setHours(10, 0, 0, 0);
        q(ab, 'due').value = localDT(d0); keep();
      });
      ab.querySelector('[data-act=appt-add]').onclick = async (ev) => {
        keep();
        const v = S.apptDraft[id];
        if (!v.due) { toast('เลือกวันเวลานัดก่อน'); return; }
        const r = await crmAct('followup', { kind: v.kind, due: v.due, note: v.note }, ev.target);
        if (r) { delete S.apptDraft[id]; paintProfile(true); }
      };
    }
    // ★ 17 ต.ค.69 ลูกค้าพูดถึงนัดในแชท → ใส่ในฟอร์มนัด (ยังไม่บันทึก — คนตรวจแล้วกด "บันทึกนัด" เอง)
    el.querySelectorAll('[data-act=hint-use]').forEach(b => b.onclick = () => {
      const H = (S.chat.crm || {}).apptHint; if (!H) return;
      S.apptDraft[id] = { kind: 'viewing', due: localDT(new Date(H.at)), note: (S.apptDraft[id] || {}).note || H.text };
      paintProfile(true);
      const f = el.querySelector('[data-box=appt]');
      if (f) { f.scrollIntoView({ block: 'center', behavior: 'smooth' }); f.classList.add('flash'); setTimeout(() => f.classList.remove('flash'), 1800); }
    });
    el.querySelectorAll('[data-act=hint-src]').forEach(b => b.onclick = () => goMsg(+b.dataset.mi, ''));
    el.querySelectorAll('[data-act=hint-no]').forEach(b => b.onclick = () => {
      const H = (S.chat.crm || {}).apptHint; if (!H) return;
      S.hintNo[id] = H.mid; paintProfile(true);
    });
    const cb = el.querySelector('[data-box=call]');
    if (cb) {
      const keep = () => { S.callDraft[id] = { result: q(cb, 'result').value, note: q(cb, 'note').value }; };
      cb.querySelectorAll('select[data-x], input[type=text][data-x]').forEach(i => i.addEventListener('input', keep));
      cb.querySelectorAll('select[data-x]').forEach(i => i.addEventListener('change', keep));
      q(cb, 'file').addEventListener('change', async (ev) => {
        const files = Array.from(ev.target.files || []); ev.target.value = '';
        for (const f of files) {
          if ((S.callMedia[id] || []).length >= 6) { toast('แนบได้ไม่เกิน 6 รูปต่อครั้ง'); break; }
          toast('กำลังอัปโหลด ' + f.name + '…', 1800);
          const r = await upProof(f, id);
          if (!r.ok) { toast(r.error || 'อัปโหลดไม่สำเร็จ', 5000); continue; }
          (S.callMedia[id] = S.callMedia[id] || []).push({ id: r.id, url: r.url });
        }
        keep(); paintProfile(true);
      });
      cb.querySelector('[data-act=call-add]').onclick = async (ev) => {
        keep();
        const v = S.callDraft[id] || {};
        if (!v.result) { toast('เลือกผลการโทรก่อน'); return; }
        const r = await crmAct('call', { result: v.result, note: v.note || '', media: (S.callMedia[id] || []).map(m => ({ id: m.id })) }, ev.target);
        if (r) { delete S.callDraft[id]; delete S.callMedia[id]; paintProfile(true); }
      };
    }
    const sb = el.querySelector('[data-box=sum]');
    if (sb) {
      q(sb, 'sum').addEventListener('input', () => { S.sumDraft[id] = q(sb, 'sum').value; });
      sb.querySelector('[data-act=sum-save]').onclick = async (ev) => {
        const r = await crmAct('summary', { text: q(sb, 'sum').value }, ev.target);
        if (r) { delete S.sumDraft[id]; paintProfile(true); }
      };
      const aib = sb.querySelector('[data-act=ai]');
      if (aib) aib.onclick = async () => {
        aib.disabled = true; aib.textContent = 'AI กำลังอ่านแชท…';
        const r = await api('/connect/api/crm', { action: 'ai', id });
        aib.disabled = false; aib.textContent = 'ให้ AI ร่างสรุปจากแชท';
        if (!r.ok) { toast(r.error || 'AI สรุปไม่สำเร็จ', 6000); return; }
        S.aiDraft[id] = r.draft;
        if (r.draft.summary) S.sumDraft[id] = r.draft.summary;      // ใส่ในช่องให้ตรวจ/แก้ — ยังไม่บันทึก
        paintProfile(true);
      };
    }
    el.querySelectorAll('[data-act=ai-stage]').forEach(b => b.onclick = () => {
      const ai = S.aiDraft[id]; if (!ai || !ai.stage) return;
      if (ai.stage === 'lost') { S.lostPick = id; paintProfile(true); return; }
      crmAct('stage', { stage: ai.stage }, b);
    });
    el.querySelectorAll('[data-act=ai-follow]').forEach(b => b.onclick = async () => {
      const ai = S.aiDraft[id]; if (!ai || !ai.followAt) return;
      const r = await crmAct('followup', { kind: 'follow', due: ai.followAt, note: ai.followNote || '' }, b);
      if (r) { ai.followAt = ''; paintProfile(true); }
    });
    el.querySelectorAll('[data-act=ai-close]').forEach(b => b.onclick = () => { delete S.aiDraft[id]; paintProfile(true); });
  }

  // บันทึกทีละช่อง (ไม่ใช่ทั้งฟอร์ม) — 2 คนแก้คนละช่องพร้อมกันไม่ทับกัน
  async function saveLead(field, value, inp, repaint) {
    const d = S.chat; if (!d) return;
    const id = d.row.id;
    const r = await api('/connect/api/lead', { id, field, value });
    if (!S.chat || S.chat.row.id !== id) return;
    if (!r.ok) {
      toast(r.error || 'บันทึกไม่สำเร็จ', 4500);
      if (inp) inp.classList.add('bad');
      return;
    }
    d.lead = r.lead;
    if (inp) {
      inp.classList.remove('bad');
      const box = inp.closest('.pf-fld'); if (box) { box.classList.add('ok'); setTimeout(() => box.classList.remove('ok'), 1500); }
      // คนแก้แล้ว = ไม่ใช่ค่าอัตโนมัติ (ป้ายที่มา + "ค่าใหม่รอยืนยัน" ของช่องนี้หายทั้ง 2 ฝั่ง)
      document.querySelectorAll(`[data-f="${field}"]`).forEach(x => {
        const fb = x.closest('.pf-fld'); if (fb) fb.querySelectorAll('.pf-auto, .kw-src, .pf-sgm').forEach(y => y.remove());
      });
      // ช่องเดียวกันอีกฝั่ง (คอลัมน์ขวา/แบบพับบนมือถือ) + ใบจ่ายลีด อัปเดตตาม โดยไม่วาดทั้งแผง (คนอาจกำลังพิมพ์ช่องถัดไป)
      document.querySelectorAll(`[data-f="${field}"]`).forEach(x => {
        if (x === inp) return;
        if (x.type === 'checkbox') x.checked = !!r.lead[field]; else x.value = r.lead[field] || '';
      });
      document.querySelectorAll('.pf-slip-text').forEach(x => { x.textContent = r.lead.slipText || ''; });
      refreshKw();                                   // ความพร้อม x/5 · ค่าใหม่รอยืนยัน · ตอบด่วน อัปเดตตามช่องที่เพิ่งแก้
      _profSig = profSig(d);
    }
    if (repaint) { paintProfile(true); paintQuick(); }
    if (field === 'customer_name' || field === 'tags') loadInbox(false);   // ชื่อ/แท็กโชว์ในรายชื่อด้วย
  }

  // ★ 11 ต.ค.69 รูป/วิดีโอ/เสียง/ไฟล์ที่ลูกค้าส่ง — เปิดผ่าน /connect/api/media (เซิร์ฟเวอร์เช็คสิทธิ์ทุกครั้ง)
  //   ไฟล์อยู่นอกโฟลเดอร์สาธารณะ · ยังไม่ได้โหลด = เซิร์ฟเวอร์ลองโหลดตอนเปิด · หมดอายุ/ใหญ่เกิน = บอกเหตุผลแทนรูปแตก
  const FILE_NOTE = { gone: 'ไฟล์นี้หมดอายุที่ต้นทางแล้ว — เปิดดูในแอป LINE OA / Facebook',
                      big: 'ไฟล์ใหญ่เกินที่ระบบเก็บ — เปิดดูในแอป LINE OA / Facebook', none: 'ข้อความนี้ไม่มีไฟล์ให้โหลด' };
  const fmtSize = n => !n ? '' : (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
  function filesHtml(m) {
    return (m.files || []).map(f => {
      if (FILE_NOTE[f.state]) return `<span class="cn-mnote">${FILE_NOTE[f.state]}</span>`;
      const u = h(f.url);
      if (f.kind === 'image') return `<a class="cn-mimg" href="${u}" target="_blank" rel="noopener" title="เปิดรูปเต็ม"><img src="${u}" alt="${m.dir === 'out' ? 'รูปที่ส่งหาลูกค้า' : 'รูปที่ลูกค้าส่ง'}" loading="lazy"></a>`;
      if (f.kind === 'video') return `<video class="cn-mvid" controls preload="none" src="${u}"></video>`;
      if (f.kind === 'audio') return `<audio class="cn-maud" controls preload="none" src="${u}"></audio>`;
      return `<a class="cn-mfile" href="${u}&dl=1">${ic('paperclip', 14)} ${h(f.name || 'ไฟล์แนบ')}${f.size ? ' · ' + fmtSize(f.size) : ''}</a>`
        + (f.ext === 'pdf' ? `<a class="cn-mfile" href="${u}" target="_blank" rel="noopener">เปิดดู</a>` : '');
    }).join('');
  }
  let _msgSig = '';
  function paintMsgs(keepScroll) {
    const el = $('cn-msgs'); if (!el) return;
    const d = S.chat;
    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
    // รีเฟรชทุก 6 วิ แต่ข้อความไม่เปลี่ยน = ไม่วาดใหม่ (ไม่งั้นรูปกะพริบ/โหลดซ้ำ และเลื่อนดูรูปเก่าแล้วถูกดีดลงล่าง)
    const sig = JSON.stringify([d.row && d.row.id, d.access, d.messages, S.hl]);
    if (keepScroll && sig === _msgSig && el.childElementCount) return;
    _msgSig = sig;
    // ★ 12 ต.ค.69 กดคำที่ไฮไลต์ → ไปช่องข้อมูลที่คำนั้นลง (ผูกครั้งเดียวที่กล่องข้อความ)
    el.onclick = e => { const b = e.target.closest && e.target.closest('.kw[data-kw]'); if (b) kwGo(b.dataset.kw, b); };
    let html = '';
    if (d.access === 'preview') {
      html += `<div class="cn-lock">เห็นเฉพาะข้อความที่ลูกค้าเพิ่งส่ง — กด "รับลูกค้าคนนี้" ก่อน ถึงจะเห็นแชทย้อนหลังและตอบได้</div>`;
    }
    if (!(d.messages || []).length) html += `<div class="cn-blank">ยังไม่มีข้อความ</div>`;
    let lastDay = '';
    (d.messages || []).forEach((m, mi) => {
      const dt = m.at ? new Date(m.at) : null;
      const day = dt ? dt.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
      if (day && day !== lastDay) { html += `<div class="cn-day">${h(day)}</div>`; lastDay = day; }
      const t = dt ? pad(dt.getHours()) + ':' + pad(dt.getMinutes()) : '';
      const out = m.dir === 'out';
      const hasF = !!(m.files && m.files.length);
      // "[รูป]" "[วิดีโอ]" คือคำแทนตอนไม่มีไฟล์ให้ดู — มีไฟล์แล้วไม่ต้องโชว์ (ข้อความจริงที่พิมพ์มาพร้อมรูปยังโชว์)
      const txt = hasF && /^\[[^\]]*\]$/.test((m.text || '').trim()) ? '' : kwText(m);
      html += `<div class="bub ${out ? 'out' : 'in'}${m.media && !hasF ? ' media' : ''}${hasF ? ' has-file' : ''}" data-mi="${mi}">`
        + (hasF ? (txt ? `<span class="cn-mtxt">${txt}</span>` : '') + filesHtml(m) : txt + (m.media ? '<br><small>(ไฟล์แนบ)</small>' : ''))
        + `<div class="meta">${out && m.by ? h(m.by) + ' · ' : ''}${t}</div></div>`;
    });
    el.innerHTML = html;
    const stick = !keepScroll || atBottom;
    if (stick) el.scrollTop = el.scrollHeight;
    el.querySelectorAll('.cn-mimg img').forEach(img => {
      img.addEventListener('load', () => { if (stick) el.scrollTop = el.scrollHeight; }, { once: true });   // รูปโหลดเสร็จแล้วสูงขึ้น
      img.addEventListener('error', () => {
        const a = img.closest('a');
        if (a) a.outerHTML = '<span class="cn-mnote">เปิดรูปนี้ไม่ได้ — ไฟล์อาจหมดอายุที่ต้นทางแล้ว (เปิดดูในแอป LINE OA / Facebook)</span>';
      }, { once: true });
    });
  }

  // ลูกค้าจำลอง: ให้คนทดสอบพิมพ์แทนลูกค้าได้ (ทดสอบรอบรอ 5 นาที / ข้อความใหม่จากลูกค้าของฉัน)
  function paintSim() {
    const w = $('cn-sim-wrap'); if (!w) return;
    const d = S.chat;
    if (!(BOOT.test && d && d.row.sim)) { w.innerHTML = ''; return; }
    w.innerHTML = `<div class="cn-sim">🧪 <b class="hide-sm">พิมพ์แทนลูกค้า</b>
      <input id="cn-sim-text" placeholder="เช่น ยังว่างไหมครับ ผ่อนเดือนละเท่าไหร่" autocomplete="off">
      <button class="btn sm" id="cn-sim-send" title="ส่งข้อความนี้ในฐานะลูกค้าจำลอง">ส่งแทนลูกค้า</button></div>`;
    const go = async () => {
      const t = $('cn-sim-text'); const text = (t.value || '').trim(); if (!text) return;
      const r = await api('/connect/api/test', { action: 'say', id: d.row.id, text });
      if (!r.ok) { toast(r.error || 'ส่งไม่สำเร็จ'); return; }
      t.value = ''; openChat(d.row.id, true); loadInbox(false);
    };
    $('cn-sim-send').onclick = go;
    $('cn-sim-text').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); go(); } });
  }

  async function testAct(action, extra) {
    const body = Object.assign({ action }, extra || {});
    if (action === 'clear' && !confirm('ล้างข้อมูลทดสอบทั้งหมด? (ลูกค้าจำลอง + บัญชีเซลล์จำลอง · ลูกค้าจริงที่บัญชีจำลองรับไว้จะกลับเข้าคิว)')) return;
    const r = await api('/connect/api/test', body);
    if (!r.ok) { toast(r.error || 'ทำไม่สำเร็จ', 4500); return; }
    toast(r.message || 'เรียบร้อย');
    if (action === 'as' || action === 'exit' || action === 'clear') {
      setTimeout(() => location.reload(), 500);       // สลับตัวตน = โหลดหน้าใหม่ทั้งหน้า (สิทธิ์เปลี่ยน)
    } else {
      loadInbox(false);
      if (S.pane === 'cfg') openCfg();
    }
  }

  function paintComposer(fresh) {
    const w = $('cn-comp-wrap'); if (!w) return;
    const d = S.chat;
    let why = '';
    if (!d.canReply) why = d.access === 'preview' ? 'กด "รับลูกค้าคนนี้" ก่อนถึงจะตอบได้' : 'ตอบได้เฉพาะเจ้าของลูกค้าและแอดมิน';
    else if (!d.replyOn) why = d.replyWhy || ('ยังล็อกการส่งข้อความหาลูกค้าอยู่ (ช่วงทดสอบ) — ' + (ADMIN ? 'เปิดด้วยคำสั่ง manage.py checkout_config --reply on' : 'รอแอดมินเปิดระบบ'));
    // ลูกค้า Facebook ช่วงทดสอบ: แอดมินกำหนดแชทที่ใช้ทดสอบการตอบได้ (แชทของคนในบริษัท ไม่ใช่ลูกค้าจริง)
    const ft = (ADMIN && d.fbTest && d.fbTest.mode === 'test') ? (d.fbTest.on ? 'on' : 'off') : '';
    const ftHtml = ft ? `<div class="cn-comp-why" style="padding:6px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span>${ft === 'on' ? 'แชทนี้เป็น "แชททดสอบ" การตอบ Facebook' : 'ทดสอบการตอบ Facebook กับแชทของคนในบริษัทก่อน (เช่นทักเพจจาก FB ตัวเอง)'}</span>
        <button class="btn sm" id="cn-fbtest">${ft === 'on' ? 'ยกเลิกแชททดสอบ' : 'ใช้แชทนี้ทดสอบการตอบ'}</button></div>` : '';
    const want = (why ? 'why:' + why : 'comp') + '|' + ft;
    if (!fresh && w.dataset.k === want) return;          // ไม่วาดซ้ำ = ข้อความที่กำลังพิมพ์ไม่หาย
    w.dataset.k = want;
    const bindFt = () => {
      const b = $('cn-fbtest'); if (!b) return;
      b.onclick = async () => {
        const id = d.row.id;
        b.disabled = true;
        const r = await api('/connect/api/fb_test', { id, on: ft !== 'on' });
        b.disabled = false;
        toast(r.ok ? r.message : (r.error || 'ทำไม่สำเร็จ'));
        if (r.ok) openChat(id, true);
      };
    };
    if (why) { w.innerHTML = `<div class="cn-comp-why">${h(why)}</div>` + ftHtml; bindFt(); bindDrop(false); return; }
    // มือถือ: Enter = ขึ้นบรรทัด (กดปุ่มส่งเอา) — คำอธิบาย Enter/Shift+Enter มีแค่บนคอม
    const coarse = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
    w.innerHTML = `<div id="cn-cnd"></div><div class="cn-err" id="cn-err"></div><div id="cn-imgp"></div>
      <div class="cn-comp"><label class="cn-ibtn" title="ส่งรูป (วางรูปด้วย Ctrl+V หรือลากไฟล์มาวางในแชทก็ได้)">${ic('image', 20)}<input type="file" id="cn-file" accept="image/*" hidden></label><button type="button" class="cn-ibtn" id="cn-cnd-btn" title="ข้อความสำเร็จรูป">${ic('canned', 20)}</button><textarea id="cn-text" rows="1" placeholder="${coarse ? 'พิมพ์ข้อความถึงลูกค้า…' : 'พิมพ์ข้อความถึงลูกค้า… (Enter = ส่ง · Shift+Enter = ขึ้นบรรทัด)'}"></textarea>
      <button class="btn pri" id="cn-send">${ic('send')} ส่ง</button></div>` + ftHtml;
    bindFt();
    const ta = $('cn-text');
    ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(160, ta.scrollHeight) + 'px'; });
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && !coarse && !e.isComposing) { e.preventDefault(); send(); }
    });
    $('cn-send').onclick = send;
    $('cn-file').onchange = e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) pickImg(f); };
    // วางรูปจากคลิปบอร์ด — มีข้อความติดมาด้วย (เช่นคัดลอกจาก Excel) = วางเป็นข้อความตามปกติ
    ta.addEventListener('paste', e => {
      const cd = e.clipboardData; if (!cd || cd.getData('text/plain')) return;
      const f = Array.from(cd.files || []).find(x => /^image\//.test(x.type));
      if (f) { e.preventDefault(); pickImg(f); }
    });
    bindDrop(true);
    paintImgP();
    CND.open = false; CND.edit = null;                // วาดช่องพิมพ์ใหม่ = กล่องข้อความสำเร็จรูปปิด
    $('cn-cnd-btn').onclick = cndToggle;
    const cb = $('cn-cnd');
    cb.onclick = cndClick;
    cb.oninput = e => { if (e.target.dataset.c === 'q') { CND.q = e.target.value; paintCndList(); } };
    cb.onkeydown = e => {
      if (e.key === 'Enter' && !e.isComposing && e.target.dataset.c === 'q') {
        e.preventDefault(); const f = cndFiltered()[0]; if (f) cndPick(f);
      }
    };
  }

  // ★ 17 ต.ค.69 ข้อความสำเร็จรูป (หน้าเว็บ) — ชุดเดียวกับแอป (GET/POST /connect/api/canned · KV connect_canned)
  //   เลือกแล้วไปอยู่ในช่องพิมพ์ (ไม่ส่งเอง) · แอดมินเพิ่ม/แก้/ลบได้ในกล่องเดียวกัน · Esc / คลิกที่อื่น = ปิด
  const CND = { open: false, items: null, canEdit: false, err: '', q: '', edit: null, busy: false, focusQ: false };
  const CND_MAX = 60;                               // ตรงกับ chatplus.CANNED_MAX
  function cndFiltered() {
    const q = CND.q.trim().toLowerCase(), all = CND.items || [];
    return q ? all.filter(x => ((x.title || '') + ' ' + x.text).toLowerCase().includes(q)) : all;
  }
  function cndClose() {
    CND.open = false; CND.edit = null; CND.q = ''; CND.focusQ = false;
    const b = $('cn-cnd'); if (b) b.innerHTML = '';
    const k = $('cn-cnd-btn'); if (k) k.classList.remove('on');
  }
  async function cndToggle() {
    if (CND.open) { cndClose(); return; }
    CND.open = true; CND.edit = null; CND.q = ''; CND.err = '';
    CND.focusQ = !(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);   // มือถือไม่โฟกัสช่องค้น (คีย์บอร์ดเด้งบังรายการ)
    $('cn-cnd-btn').classList.add('on');
    paintCnd();                                     // โชว์รายการที่จำไว้ก่อน แล้วค่อยดึงใหม่ (แอดมินอาจเพิ่งแก้จากแอป)
    const d = await api('/connect/api/canned');
    if (!CND.open) return;
    if (d.ok) { CND.items = d.items || []; CND.canEdit = !!d.canEdit; CND.err = ''; }
    else CND.err = d.error || 'โหลดข้อความสำเร็จรูปไม่สำเร็จ';
    if (!CND.edit) paintCnd();
  }
  function paintCnd() {
    const b = $('cn-cnd'); if (!b) return;
    if (!CND.open) { b.innerHTML = ''; return; }
    const head = `<div class="hd"><b>ข้อความสำเร็จรูป</b><button type="button" class="x" data-c="close" title="ปิด (Esc)">${ic('x', 16)}</button></div>`;
    const e = CND.edit;
    if (e) {
      const dis = CND.busy ? ' disabled' : '';
      b.innerHTML = `<div class="cn-cnd">${head}<div class="fm">
        <input data-c="title" maxlength="40" placeholder="หัวข้อสั้นๆ (ไม่บังคับ) เช่น ทักทาย / ขอเบอร์" value="${h(e.title)}">
        <textarea data-c="text" maxlength="1000" rows="5" placeholder="ข้อความที่จะใส่ในช่องพิมพ์">${h(e.text)}</textarea>
        <div class="acts"><button type="button" class="btn sm" data-c="back"${dis}>ยกเลิก</button>
          <button type="button" class="btn pri sm" data-c="save"${dis}>${CND.busy ? 'กำลังบันทึก…' : 'บันทึก'}</button></div></div></div>`;
      cndFit();
      if (!CND.busy) b.querySelector(e.title || !e.id ? '[data-c=text]' : '[data-c=title]').focus();
      return;
    }
    const all = CND.items;
    const q = b.querySelector('[data-c=q]');
    const hadFocus = !!q && document.activeElement === q;
    const search = all && all.length > 5 ? `<input class="q" data-c="q" placeholder="ค้นข้อความ… (Enter = ใช้อันแรก)" value="${h(CND.q)}">` : '';
    const foot = CND.canEdit && all ? `<div class="ft"><button type="button" class="btn sm" data-c="add"${all.length >= CND_MAX ? ' disabled title="ครบแล้ว — ลบอันที่ไม่ใช้ก่อน"' : ''}>${ic('plus', 14)} เพิ่มข้อความ</button><span>${all.length}/${CND_MAX}</span></div>` : '';
    b.innerHTML = `<div class="cn-cnd">${head}${search}<div class="ls" id="cn-cnd-ls"></div>${foot}</div>`;
    paintCndList();
    cndFit();
    const nq = b.querySelector('[data-c=q]');
    if (nq && (hadFocus || CND.focusQ)) { CND.focusQ = false; nq.focus(); nq.setSelectionRange(nq.value.length, nq.value.length); }
  }
  // กล่องสูงไม่เกินที่ว่างเหนือช่องพิมพ์ในกรอบแชท (กรอบตัดส่วนที่ล้น — จอเตี้ย/หน้าต่างแคบ หัวกล่องกับปุ่มปิดจะหาย)
  function cndFit() {
    const box = document.querySelector('.cn-cnd'), pane = $('cn-pane'), wrap = $('cn-comp-wrap');
    if (!box || !pane || !wrap) return;
    const room = wrap.getBoundingClientRect().top - pane.getBoundingClientRect().top - 8;
    box.style.maxHeight = Math.max(160, Math.min(420, room)) + 'px';
  }
  function paintCndList() {
    const el = $('cn-cnd-ls'); if (!el) return;
    if (CND.items === null) {
      el.innerHTML = CND.err ? `<div class="em" style="color:var(--red)">${h(CND.err)}</div>` : `<div class="em">กำลังโหลด…</div>`;
      return;
    }
    const list = cndFiltered();
    el.innerHTML = list.length ? list.map(x => `<div class="it" data-id="${h(x.id)}">
        <button type="button" class="pick" data-c="pick" title="ใส่ในช่องพิมพ์">${x.title ? `<b>${h(x.title)}</b>` : ''}<span>${h(x.text)}</span></button>
        ${CND.canEdit ? `<button type="button" class="ib" data-c="edit" title="แก้">${ic('pencil', 15)}</button><button type="button" class="ib" data-c="del" title="ลบ">${ic('trash', 15)}</button>` : ''}</div>`).join('')
      : `<div class="em">${CND.q.trim() ? 'ไม่พบข้อความที่ตรงกับคำค้น'
          : (CND.canEdit ? 'ยังไม่มีข้อความสำเร็จรูป — กด "เพิ่มข้อความ" ด้านล่าง' : 'ยังไม่มีข้อความสำเร็จรูป — ให้แอดมินเพิ่มได้')}</div>`;
  }
  function cndClick(e) {
    const t = e.target.closest('[data-c]'); if (!t || t.disabled) return;
    const c = t.dataset.c, row = t.closest('[data-id]');
    const it = row && (CND.items || []).find(x => x.id === row.dataset.id);
    if (c === 'close') cndClose();
    else if (c === 'pick' && it) cndPick(it);
    else if (c === 'edit' && it) { CND.edit = { id: it.id, title: it.title || '', text: it.text }; paintCnd(); }
    else if (c === 'add') { CND.edit = { id: '', title: '', text: '' }; paintCnd(); }
    else if (c === 'back') { CND.edit = null; paintCnd(); }
    else if (c === 'save') cndSave();
    else if (c === 'del' && it) cndDel(it);
  }
  function cndPick(it) {
    const ta = $('cn-text'); if (!ta) return;
    ta.value = ta.value.trim() ? ta.value.replace(/\s+$/, '') + ' ' + it.text : it.text;
    ta.dispatchEvent(new Event('input'));
    cndClose();
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  }
  async function cndSave() {
    const b = $('cn-cnd'), e = CND.edit; if (!b || !e || CND.busy) return;
    e.title = b.querySelector('[data-c=title]').value; e.text = b.querySelector('[data-c=text]').value;
    if (!e.text.trim()) { toast('ยังไม่มีข้อความ'); return; }
    CND.busy = true; paintCnd();

  // ★ 17 ต.ค.69 ส่งรูปหาลูกค้า (หน้าเว็บ) — ใช้ /connect/api/reply_image ตัวเดียวกับแอป (เซิร์ฟเวอร์ย่อรูป + ตัด EXIF/พิกัด GPS)
  //   เลือกรูปแล้วโชว์ตัวอย่างก่อน กดส่งเอง · client_id เดิมทั้งรอบ = ส่งไม่ออกแล้วกดส่งอีกครั้ง ลูกค้าไม่ได้รูปเบิ้ล
  let IMG = null;                                   // { id: แถวลูกค้า, file, url: objectURL, cid, busy }
  const IMG_MAX_MB = 15;                            // ตรงกับ chatplus.MAX_IN_MB
  const newCid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
  function dropImg() { if (IMG) { URL.revokeObjectURL(IMG.url); IMG = null; } paintImgP(); }
  function pickImg(f) {
    if (!S.chat || !$('cn-imgp')) return;
    if (!/^image\//.test(f.type || '')) { toast('ส่งได้เฉพาะไฟล์รูป'); return; }
    if (f.size > IMG_MAX_MB * 1048576) { toast('รูปใหญ่เกินไป (ไม่เกิน ' + IMG_MAX_MB + ' MB)', 4500); return; }
    if (IMG && IMG.busy) { toast('รอรูปก่อนหน้าส่งเสร็จก่อน'); return; }
    if (IMG) URL.revokeObjectURL(IMG.url);
    IMG = { id: S.chat.row.id, file: f, url: URL.createObjectURL(f), cid: newCid(), busy: false };
    const er = $('cn-err'); if (er) er.textContent = '';
    paintImgP();
  }
  function paintImgP() {
    const w = $('cn-imgp');
    if (IMG && !IMG.busy && (!w || !S.chat || IMG.id !== S.chat.row.id)) { URL.revokeObjectURL(IMG.url); IMG = null; }   // เปลี่ยนแชท/ตอบไม่ได้แล้ว = ทิ้งรูปที่ค้าง
    if (!w) return;
    if (!IMG || IMG.id !== (S.chat && S.chat.row.id)) { w.innerHTML = ''; return; }
    const b = IMG.busy ? ' disabled' : '';
    w.innerHTML = `<div class="cn-imgp"><img src="${IMG.url}" alt="รูปที่จะส่ง">
      <span class="nm">${h(IMG.file.name || 'รูปที่วาง')}${IMG.file.size ? ' · ' + fmtSize(IMG.file.size) : ''}</span>
      <button class="btn sm" id="cn-img-x"${b}>ยกเลิก</button>
      <button class="btn pri sm" id="cn-img-go"${b}>${ic('send')} ${IMG.busy ? 'กำลังส่ง…' : 'ส่งรูป'}</button></div>`;
    $('cn-img-x').onclick = dropImg;
    $('cn-img-go').onclick = sendImg;
  }
  // ลากไฟล์รูปมาวางตรงไหนก็ได้ในช่องแชท (ไม่งั้นพลาดนิดเดียว เบราว์เซอร์เปิดรูปทับหน้า Connect)
  function bindDrop(on) {
    const m = $('cn-msgs'); const el = m && m.parentElement; if (!el) return;
    const isF = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
    el.ondragover = on ? e => { if (!isF(e)) return; e.preventDefault(); m.classList.add('drop'); } : null;
    el.ondragleave = on ? e => { if (!el.contains(e.relatedTarget)) m.classList.remove('drop'); } : null;
    el.ondrop = on ? e => {
      if (!isF(e)) return;
      e.preventDefault(); m.classList.remove('drop');
      const f = Array.from(e.dataTransfer.files || []).find(x => /^image\//.test(x.type));
      if (f) pickImg(f); else toast('ส่งได้เฉพาะไฟล์รูป');
    } : null;
  }
  async function sendImg() {
    const p = IMG;
    if (!p || p.busy || !S.chat || S.chat.row.id !== p.id) return;
    if (BOOT.test && BOOT.test.as && !S.chat.row.sim
        && !confirm('ลูกค้าคนนี้เป็น "ลูกค้าจริง" — รูปจะถึงเขาจริงในนาม ' + ME.name + ' ส่งไหม?')) return;
    p.busy = true; paintImgP();
    const er = $('cn-err'); if (er) er.textContent = '';
    const fd = new FormData();
    fd.append('id', p.id); fd.append('client_id', p.cid); fd.append('file', p.file, p.file.name || 'image.png');
    let d;
    try {
      const r = await fetch('/connect/api/reply_image', { method: 'POST', body: fd, credentials: 'same-origin', headers: { 'X-CSRFToken': csrf() } });
      if (r.status === 401) { location.href = '/login/?next=' + encodeURIComponent('/connect/'); return; }
      try { d = await r.json(); } catch (e) { d = { ok: false, error: 'ส่งรูปไม่สำเร็จ (' + r.status + ')' }; }
    } catch (e) { d = { ok: false, error: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — กด "ส่งรูป" อีกครั้งได้ (ลูกค้าไม่ได้รูปซ้ำ)' }; }
    p.busy = false;
    if (!d.ok) {
      if (IMG === p && $('cn-imgp')) { paintImgP(); const e2 = $('cn-err'); if (e2) e2.textContent = d.error || 'ส่งรูปไม่สำเร็จ'; }
      else { if (IMG === p) dropImg(); toast(d.error || 'ส่งรูปไม่สำเร็จ', 4500); }
      return;
    }
    if (IMG === p) dropImg();
    if (S.chat && S.chat.row.id === p.id && !S.chat.messages.some(m => m.id === d.message.id)) {
      S.chat.messages.push(d.message);
      S.chat.row.awaiting = false;
      paintHeader(); paintMsgs(false);
    }
    loadInbox(false);
  }

  async function send() {
    const ta = $('cn-text'); if (!ta || !S.chat) return;

    if (BOOT.test && BOOT.test.as && !S.chat.row.sim
        && !confirm('ลูกค้าคนนี้เป็น "ลูกค้าจริง" — ข้อความจะถึงเขาจริงในนาม ' + ME.name + ' ส่งไหม?')) return;

  // เวลาที่ลีดพักอยู่ (data-since) — ทุกวินาที ไม่ยิงเซิร์ฟเวอร์
  function slaOf(sinceIso) {
    const m = Math.max(0, Math.floor((nowMs() - Date.parse(sinceIso)) / 1000));
    const mm = Math.floor(m / 60);
    return { text: mm >= 60 ? Math.floor(mm / 60) + ':' + pad(mm % 60) + ' ชม.' : pad(mm) + ':' + pad(m % 60),
             cls: mm < 10 ? 'ok' : (mm < 30 ? 'warn' : 'crit') };
  }
  setInterval(() => {
    document.querySelectorAll('[data-since]').forEach(el => {
      const s = slaOf(el.dataset.since);
      const t = el.querySelector('.num'); if (t) t.textContent = s.text;
      el.classList.remove('ok', 'warn', 'crit'); el.classList.add(s.cls);

  function dbBadges(r) {

    if (r.src === 'system') b.push(`<span class="lc-dbb s" title="ระบบออกเลขให้แล้ว (จ่ายเบอร์ใน Connect / ลีดภายนอก / ไม้ 2) แต่ยังไม่มีแถวในชีตลีด">ยังไม่ลงชีต</span>`);
    if (r.codeDup) b.push(`<span class="lc-dbb c" title="เลข ${h(r.code)} อยู่ในชีตลีด ${r.codeDup} แถว">Code ×${r.codeDup}</span>`);
    if (r.dup) {
      const k = r.dupKind || [];
      const nm = k.length > 1 ? 'เบอร์/ไลน์' : (k[0] === 'line' ? 'ไลน์' : 'เบอร์');
      b.push(`<span class="lc-dbb p" title="${h(nm)}เดียวกันนี้เป็นลีดอีก ${r.dup} เลข (ไม่นับไม้ 2 ของเลขเดิม)">${nm} ×${r.dup + 1}</span>`);
    }
    if (r.fwdOf) b.push(`<span class="lc-dbb f" title="ไม้ 2 ของเลข ${h(r.fwdOf)} — ลีดเดียวกัน ไม่นับว่าซ้ำ">ไม้ 2</span>`);
    if (b.length) return b.join('');
    if (!r.phone && !r.lineId) return `<span class="lc-dbn" title="ช่องเบอร์โทรไม่มีเบอร์/ไอดีไลน์ที่ใช้เทียบได้ (เช่น QR code / Line@) — เทียบได้แค่ Code">เทียบแค่ Code</span>`;
    return '<span class="lc-dbn">ไม่ซ้ำ</span>';
  }
  function dbZ(x) {
    return `<span class="lc-chip${/คืน|ไม่สนใจ|แบล็ค/.test(x) ? ' crit' : (/จอง|ได้รถ|ส่งมอบ/.test(x) ? ' ok' : '')}">${h(x)}</span>`;
  }
  function dbRow(r) {
    const cells = (r.v || []).map((x, i) => {
      const cls = [i < 4 ? 's' + (i + 1) : '', (i === 3 && r.codeDup) || (i === 1 && r.dup) ? 'hit' : ''].filter(Boolean).join(' ');
      const inner = i === 3 ? `<b>${h(x || '—')}</b>` : (i === 25 && x ? dbZ(x) : h(x));
      return `<td${cls ? ` class="${cls}"` : ''}${x && x.length > 18 ? ` title="${h(x)}"` : ''}><div class="c${DB_LONG.has(i) ? ' w' : ''}">${inner}</div></td>`;
    }).join('');
    return `<tr data-key="${h(r.key)}" class="${S.db.key === r.key ? 'on' : ''}${r.src === 'system' ? ' sys' : ''}"><td class="s0"><div class="c">${dbBadges(r)}</div></td>${cells}</tr>`;
  }

      + dbStat('Code ซ้ำ', st.codeDup, 'var(--red)', 'dup', 'เลขลีดเดียวกันอยู่ในชีตมากกว่า 1 แถว (' + (st.codeDupRows || 0).toLocaleString() + ' แถว) — เช่นลงซ้ำข้ามเดือน หรือใช้เลขเดียวกันกับลูกค้า 2 คน')
      + dbStat('เบอร์/ไลน์ซ้ำ', st.contactDup, 'var(--amber)', 'dup', 'เบอร์หรือ ID LINE เดียวกันเป็นลีดมากกว่า 1 เลข (ไม่นับไม้ 2 ของเลขเดิม)')
      + dbStat('ยังไม่ลงชีต', st.unsheeted, 'var(--blue)', 'unsheeted', 'ระบบออกเลขให้แล้ว แต่ยังไม่มีแถวในชีตลีด')
      + dbStat('คืนเคส', st.returned, 'var(--red)', 'returned', '');
    $('lc-db-st').querySelectorAll('[data-dbgo]').forEach(x => x.onclick = () => {

        (M.map(x => `<div class="lc-rl" style="display:block"><b>${h(x.customer || '-')}</b> <span style="color:var(--t3)">${h(x.code || '')} · @${h(x.seller)}</span>
          <div style="font-size:12px;color:var(--t2);margin-top:2px">อยากได้ ${h(x.want || '-')}${x.budget ? ' · งบ ' + Number(x.budget).toLocaleString() : ''}${x.why ? ' · ' + h(x.why) : ''}</div>
          <div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">${(x.cars || []).map(c => `<span class="lc-chip ok">${h(c.name || c.code || '')}${c.year ? ' ' + c.year : ''}${c.price ? ' · ' + Number(c.price).toLocaleString() : ''}</span>`).join('')}</div></div>`).join('')
         || '<div class="cn-empty">ยังไม่มีลูกค้าที่รอรถแล้วตอนนี้มีรถตรงสเปก</div>');

    const cols = d.cols || [], rows = d.rows || [];
    let lastG = null;
    const body = rows.map(r => {

    }).join('');

    const lead = S.db.mode === 'dup'
      ? `<div class="lc-bh"><span class="note">จับคู่ 2 ทาง: <b>Code</b> เดียวกัน · <b>ช่องเบอร์โทร</b> เดียวกัน (เบอร์ หรือ ID LINE — ช่องนี้ในชีตเก็บได้ทั้งสองแบบ) · ไม้ 2 (R…/1) ของเลขเดิมไม่นับว่าซ้ำ · ${(d.groups || 0).toLocaleString()} กลุ่ม เรียงกลุ่มล่าสุดก่อน</span></div>`
      : (S.db.mode === 'unsheeted' ? `<div class="lc-bh"><span class="note">เลขที่ระบบออกให้ (จ่ายเบอร์ใน Connect · ลีดภายนอก · ไม้ 2) ที่ยังไม่มีแถวในชีตลีด — แอดมินลงชีตแล้วจะหายจากหน้านี้เองภายใน 10 นาที</span></div>` : '');
    $('lc-db-rows').innerHTML = lead + (empty || `<div class="lc-tw lc-sheet"><table class="lc-tbl lc-raw"><thead><tr><th class="s0">ตรวจซ้ำ</th>${cols.map((c, i) => `<th${i < 4 ? ` class="s${i + 1}"` : ''}>${h(c)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`)

        ${d.total > rows.length && S.db.limit < 600 ? '<button class="btn sm" id="lc-db-more" style="margin-left:auto">ดูเพิ่มอีก 150 แถว</button>' : (d.total > rows.length ? '<span class="note" style="margin-left:auto">พิมพ์ค้นหาให้แคบลงเพื่อดูส่วนที่เหลือ</span>' : '')}</div>`;
    const more = $('lc-db-more');
    if (more) more.onclick = () => { S.db.limit = Math.min(600, S.db.limit + 150); more.disabled = true; openDb('more'); };
    $('lc-db-rows').querySelectorAll('tr[data-key]').forEach(tr => tr.onclick = () => openDbDetail(tr.dataset.key));
  }
  function dbCloseProf() {
    S.db.key = '';

  async function openDbDetail(key) {
    S.db.key = key;
    document.querySelectorAll('#lc-db-rows tr[data-key]').forEach(tr => tr.classList.toggle('on', tr.dataset.key === key));
    const grid = $('lc-dbgrid'), box = $('lc-db-prof');
    if (!grid || !box) return;
    grid.classList.add('has-prof'); box.hidden = false;
    box.innerHTML = `<div class="cn-empty"><div class="spin"></div>กำลังโหลด…</div>`;
    if (window.innerWidth <= 1180) box.scrollIntoView({ block: 'start', behavior: 'smooth' });
    const d = await api('/connect/api/leaddb?key=' + encodeURIComponent(key));
    if (S.db.key !== key) return;
    if (!d.ok) { box.innerHTML = `<div class="lc-px"><button class="btn sm" id="lc-db-x">ปิด</button></div><div class="cn-empty" style="color:var(--red)">${h(d.error || 'โหลดไม่สำเร็จ')}</div>`; $('lc-db-x').onclick = dbCloseProf; return; }
    const r = d.row, cols = d.cols || [], v = r.v || [], mt = d.matches || [];
    const contact = r.phone ? fmtPhone(r.phone) : (r.lineId ? 'LINE ' + r.lineId : 'ไม่มีเบอร์/ไลน์');
    const nCode = mt.filter(m => m.why === 'code').length;
    const ctLeads = new Set(mt.filter(m => m.why === 'phone' || m.why === 'line').map(m => m.lin || m.code || m.key));
    const hasCt = !!(r.phone || r.lineId);
    const chk = `<div class="lc-chk"><div><span>Code</span>${!r.code ? '<b class="mu">ไม่มีเลขลีด</b>' : (nCode ? `<span class="lc-chip crit">อยู่ในชีต ${nCode + 1} แถว</span>` : '<span class="lc-chip ok">ไม่ซ้ำ</span>')}</div>
      <div><span>${r.phone ? 'เบอร์' : 'ไลน์'}</span>${!hasCt ? '<b class="mu">ไม่มีเบอร์/ไลน์ให้เทียบ</b>' : (ctLeads.size ? `<span class="lc-chip warn">เป็นลีดอื่นอีก ${ctLeads.size} ลีด</span>` : '<span class="lc-chip ok">ไม่เคยเป็นลีดอื่น</span>')}</div></div>`;
    const mlist = mt.map(m => `<div class="lc-mt${m.key ? ' go' : ''}"${m.key ? ` data-mk="${h(m.key)}"` : ''}><span class="lc-chip ${DB_WHY[m.why] || ''}">${h(m.whyText)}</span><b>${h(m.code || '—')}</b>
        <span class="mu">${m.lin && m.lin !== m.code && m.why !== 'fwd' ? 'ไม้ 2 ของ ' + h(m.lin) + ' · ' : ''}${h(fmtDay(m.date))}${m.seller ? ' · @' + h(m.seller === 'ADMIN' ? 'เทเลเซลล์' : m.seller) : ''}${m.z ? ' · ' + h(m.z) : ''}${m.src === 'system' ? ' · ยังไม่ลงชีต' : ''}</span></div>`).join('');
    const ev = [];
    ev.push({ d: fmtDay(r.date), t: (r.src === 'system' ? 'ระบบออกเลข ' : 'เข้าชีตลีด ') + (r.code || ''), m: [r.channel, v[9], r.carAsk].filter(Boolean).join(' · ') });
    (d.tasks || []).forEach(t => ev.push({ d: fmtWhen(t.postedAt), t: 'ใบจ่ายลีด ' + t.code + ' → @' + (t.seller || '-'),
      m: (LF_KIND[t.kind] || ['', ''])[1] + (t.lastReport ? ' · ' + t.lastReport : '') + (t.history && t.history.length ? ' · เคยจ่ายให้ ' + t.history.join(', ') : '') }));
    (d.reports || []).forEach(x => ev.push({ d: fmtWhen(x.at), t: 'รายงานผล โดย ' + x.seller, m: x.text }));
    const kv = cols.map((c, i) => v[i] ? `<div class="lc-kv"><span>${h(c)}</span><b>${i === 25 ? dbZ(v[i]) : h(v[i])}</b></div>` : '').join('');
    const sellers = S.sellers.map(s => `<option value="${s.id}">${h(s.name)} · ทีม ${h(s.team)}</option>`).join('');
    box.innerHTML = `<div class="ph"><div class="lc-px"><button class="btn sm" id="lc-db-x" title="ปิด">✕</button></div>
        <div class="nm">${h(r.name || 'ไม่ทราบชื่อ')}</div><div class="sub">${h(r.code || 'ไม่มีเลขลีด')} · ${h(contact)} · @${h(r.seller === 'ADMIN' ? 'เทเลเซลล์' : (r.seller || '-'))}</div>
        <div style="margin-top:7px;display:flex;gap:5px;flex-wrap:wrap">${r.src === 'system' ? '<span class="lc-chip brand">ยังไม่ลงชีต (มีแต่ในระบบ)</span>' : '<span class="lc-chip">ชีตลีด</span>'}${r.z ? dbZ(r.z) : ''}${r.car ? `<span class="lc-chip brand">${h(r.car)}</span>` : ''}</div>
        ${d.chatId ? `<button class="btn sm" id="lc-db-chat" style="margin-top:9px">เปิดแชทลูกค้า</button>` : ''}</div>
      <h4>ตรวจลีดซ้ำ</h4>${chk}
      ${mlist ? `<div class="lc-card" style="margin:0 14px 10px">${mlist}</div>` : ''}
      <h4>ประวัติ</h4><div class="lc-tl">${ev.map(e => `<div class="lc-tli"><span class="dot"></span><div><div class="d">${h(e.d)}</div><div class="t">${h(e.t)}</div>${e.m ? `<div class="m">${h(e.m)}</div>` : ''}</div></div>`).join('')}</div>
      ${d.fwdDone ? `<h4>ส่งต่อไม้ 2</h4><div style="padding:0 14px 14px"><span class="lc-chip ok">ส่งต่อแล้ว → ${h(d.fwdDone.code)}${d.fwdDone.seller ? ' @' + h(d.fwdDone.seller) : ''}</span>

      ${d.fwd ? `<h4>ส่งต่อไม้ 2</h4><div style="padding:0 14px 14px"><div class="lf-line">ออกเลข <b>${h(d.fwd)}</b> (R + เลขเดิม + /1) → ใบเข้าห้องจ่ายเบอร์ REJECT พร้อมแท็ก</div>
        <select id="lc-fw-emp" style="width:100%;margin-top:6px;padding:6px 8px;border-radius:7px;border:.5px solid var(--bd2);background:var(--bg2)"><option value="">— เลือกเซลล์ไม้ 2 —</option>${sellers}</select>
        <button class="btn pri sm" id="lc-fw" style="width:100%;margin-top:6px">ส่งต่อไม้ 2</button></div>` : ''}
      <h4>ข้อมูลในชีต (${r.src === 'system' ? 'จากระบบ — ' : ''}ช่องที่มีค่า)</h4><div class="lc-kvs">${kv || '<div class="mu" style="padding:0 14px 12px">—</div>'}</div>`;
    $('lc-db-x').onclick = dbCloseProf;
    box.querySelectorAll('[data-mk]').forEach(x => x.onclick = () => openDbDetail(x.dataset.mk));
    const ch = $('lc-db-chat');
    if (ch) ch.onclick = () => { S.backTo = 'db'; setPanel('inbox'); openChat(+d.chatId); };
    const fw = $('lc-fw');
    if (fw) fw.onclick = async () => {
      const emp = +($('lc-fw-emp').value || 0);
      if (!emp) { toast('เลือกเซลล์ไม้ 2 ก่อน'); return; }
      const nm = (S.sellers.find(s => s.id === emp) || {}).name || '';

      fw.disabled = true;
      const x = await api('/connect/api/leadflow', { action: 'forward', code: r.code, emp });

      if (x.ok) openDbDetail(key);
    };
  }

  // ── แดชบอร์ดทีม ──
  async function openDash() {
    const pg = $('lc-page');
    pg.innerHTML = `<div class="cn-empty"><div class="spin"></div>กำลังคำนวณ…</div>`;
    const d = await api('/connect/api/team');
    if (S.panel !== 'dash') return;
    if (!d.ok) {
      // ตัวเลขทีม (ชีต) โหลดไม่ได้ — วิเคราะห์แชท/สถิติเวลาตอบ (ฐานข้อมูลของเรา) ยังต้องโชว์ได้
      pg.innerHTML = `<div class="lc-card"><div class="cn-empty" style="color:var(--red)">${h(d.error || 'โหลดไม่สำเร็จ')}</div></div><div id="lc-insights"></div><div id="lc-stats"></div>`;
      openStats(7); openInsights(S.insDays || 30);
      return;
    }
    const T = d.tiles || {}, F = d.funnel || [];

          <div class="lc-lane"><div class="lt"><span class="lc-origin direct">ใบร่าง/สายเข้า</span> เบอร์มาก่อน ไม่มีแชท</div>
            <div class="ld">ใบร่างที่แอดมินพักไว้ในกลุ่ม ADMIN เก็บ Lead (TikTok · ไลฟ์ · เพจ) และสายที่โทรเข้าเบอร์กลาง — ได้ชื่อกับเบอร์มาเลย แอดมินคัดมาแล้ว ไม่ต้องคัดซ้ำ</div>
            <div class="path"><b>ใบร่าง/สายเข้า</b>→<b>ห้องพัก Lead</b>→<b>จ่ายเบอร์</b>→<b>เซลล์โทร</b></div></div></div>
        <div class="lc-card"><div class="lc-bh"><h2>ลูกค้าคนเดียวหลายร่าง</h2></div>
          <div class="lc-lane"><div class="ld">ทักไลน์ตอนเช้า เย็นกรอกฟอร์มเว็บ อีกวันทักจากไลฟ์ = 3 เลขลีด · <b>ตัวจับคู่ที่เชื่อได้มีแค่เบอร์โทร</b> เพราะ LINE userId กับ Facebook PSID เป็นคนละระบบ —
            ระบบเช็คสมุดเบอร์ทุกครั้งที่จะจ่าย ถ้าเคยมีคนดูแลอยู่จะขึ้นปุ่ม "จ่ายให้เจ้าของเดิม"</div>
            <div class="path"><b>ได้เบอร์ใหม่</b>→<b>เช็คสมุดเบอร์</b>→<b>เจอซ้ำ</b>→<b>จ่ายเจ้าของเดิม</b></div></div></div>
      </div></div>`;
  }
  function bindRules() {
    CPG().querySelectorAll('[data-acm]').forEach(b => b.onclick = async () => {
      const m = b.dataset.acm, cur = ((((CFG || {}).lf || {}).cfg || {}).auto_chat) || 'off';
      if (m === cur) return;
      if (m === 'on' && !confirm('เปิด "จ่ายลีดขายจากแชท" แบบจ่ายจริง?\nระบบจะออกเลข + ส่งใบเข้าห้องจ่ายเบอร์ + แท็กเซลล์เอง')) return;
      b.disabled = true;
      const res = await api('/connect/api/leadflow', { action: 'config', auto_chat: m });
      b.disabled = false;
      if (!res.ok) { toast(res.error || 'บันทึกไม่สำเร็จ', 6000); return; }
      toast('จ่ายลีดขายจากแชท: ' + AC_NAME[m]);
      openCfg();
    });
    CPG().querySelectorAll('[data-rule]').forEach(b => b.onclick = async () => {
      const r = RULES[+b.dataset.rule];
      if (!r || r.fixed) return;
      const on = !ruleVal(r);
      if (on && r.out && !confirm(`เปิด "${r.t}" ?\n(เรื่องนี้ส่ง LINE ออก/จ่ายงานแทนคน)`)) return;
      b.disabled = true;
      const val = r.num ? (on ? r.num : 0) : on;
      const res = r.src === 'c' ? await api('/connect/api/config', { [r.k]: val })
                                : await api('/connect/api/leadflow', { action: 'config', [r.k]: on });
      b.disabled = false;
      if (!res.ok) { toast(res.error || 'บันทึกไม่สำเร็จ', 6000); return; }
      toast((on ? 'เปิด ' : 'ปิด ') + r.t + ' แล้ว');
      openCfg();
    });
  }
  function fmtDay(iso) {
    if (!iso) return '';
    const d = new Date(String(iso).slice(0, 10) + 'T12:00:00');
    if (isNaN(d)) return String(iso);
    return d.getDate() + ' ' + TH_MON[d.getMonth()] + ' ' + String(d.getFullYear() + 543).slice(-2);
  }

  // ── ค้นหา / เลือกเซลล์ ──
  let _qT = null;
  $('cn-q').addEventListener('input', () => { clearTimeout(_qT); _qT = setTimeout(() => { S.q = $('cn-q').value.trim(); loadInbox(true); }, 350); });
  $('cn-view').addEventListener('change', () => { $('cn-view').blur(); pickTab($('cn-view').value); });
  $('cn-fsel').addEventListener('change', () => {
    const el = $('cn-fsel'), v = el.value;
    el.blur();
    if (v === '_x') return;
    S.f = v === 'aw' ? { awaiting: '1' } : {};
    S.src = v === 'aw' ? '' : v;
    renderFilter(); loadInbox(true);
  });

  // ── นาฬิกาทุกวินาที (ไม่ยิงเซิร์ฟเวอร์) ──
  setInterval(() => {
    document.querySelectorAll('[data-due]').forEach(el => {
      const ck = clockText(el.dataset.due);
      const t = el.querySelector('.ck'); if (t) t.textContent = ck.text;
      el.classList.toggle('late', ck.cls === 'late'); el.classList.toggle('wait', ck.cls === 'wait');
    });
    document.querySelectorAll('[data-tdue]').forEach(el => {
      const ck = taskClock(el.dataset.tdue);
      const t = el.querySelector('.ck'); if (t) t.textContent = ck.text;
      el.classList.toggle('late', ck.cls === 'late'); el.classList.toggle('wait', ck.cls === 'wait');
    });
  }, 1000);
  // ── รีเฟรช: รายชื่อทุก 8 วิ · แชทที่เปิดอยู่ทุก 6 วิ (หยุดตอนสลับไปแท็บอื่น) ──
  setInterval(() => { if (!document.hidden && (S.pane === 'chat' || S.pane === 'dist')) loadInbox(false); }, 8000);
  setInterval(() => { if (!document.hidden && S.pane === 'chat' && S.chat) openChat(S.chat.row.id, true); }, 6000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadInbox(false); });

  loadAlerts();
  setInterval(() => { if (!document.hidden) loadAlerts(); }, 30000);
  setInterval(() => { if (!document.hidden && S.panel === 'cmt' && !(document.activeElement && document.activeElement.id === 'lc-cm-q')) openCmt(true); }, 60000);
  if (S.openId) showPane();
  setPanel(ADMIN && PANEL_PANE[BOOT.panel] && !S.openId ? BOOT.panel : 'inbox', true);
})();
</script>
</body>
</html>
