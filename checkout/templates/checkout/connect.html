    try { d = await api('/connect/api/chat?id=' + id, undefined, ac.signal); }
    catch (e) { if (e.name === 'AbortError') return; d = { ok: false, error: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้' }; }
    if (seq !== _chSeq || S.openId !== id) return;
    if (!d.ok) {
      S.chat = null;
      $('cn-pane').innerHTML = `<div class="cn-ph"><button class="btn sm cn-mback" onclick="window.__cnBack()">${ic('arrow-left')} กลับ</button></div><div class="cn-blank" style="color:var(--red)">${h(d.error || 'เปิดแชทไม่ได้')}</div>`;
      return;
    }
    if (d.now) SKEW = Date.parse(d.now) - Date.now();
    if (d.row && !d.row.unread) {
      const lr = S.rows.find(x => x.id === id);
      if (lr && lr.unread) {
        lr.unread = false;
        const re = document.querySelector('.cn-row[data-id="' + id + '"]');
        if (re) { re.classList.remove('unread'); const dt = re.querySelector('.cn-dot'); if (dt) dt.remove(); }
      }
    }
    const same = S.chat && S.chat.row.id === id;
    S.chat = d;
    if (same) { paintHeader(); paintProfile(); paintMsgs(true); paintQuick(); paintComposer(false); }
    else paintChat();
  }

  function paintChat() {
    $('cn-pane').innerHTML = `
      <div class="cn-ph" id="cn-ph"></div>
      <div class="cn-chat">
        <div class="cn-cmain"><div class="cn-msgs" id="cn-msgs"></div><div id="cn-sim-wrap"></div><div id="cn-qr-wrap"></div><div id="cn-comp-wrap"></div></div>
        <aside class="cn-side" id="cn-side"></aside>
      </div>`;
    // paintProfile(true) — แผงเพิ่งถูกสร้างใหม่ (ว่าง) · ถ้าไม่บังคับ กดกลับแล้วเปิดลูกค้าคนเดิม แผงขวาจะว่าง
    //   เพราะข้อมูลเหมือนรอบก่อน (ลายเซ็นเดิม) เลยไม่ถูกวาด
    applySide(); paintHeader(true); paintProfile(true); paintMsgs(false); paintSim(); paintQuick(); paintComposer(true);
  }

  function paintHeader(force) {
    const d = S.chat, r = d.row;
    // หัวแชทถูกวาดใหม่ทุก 6 วิ — กำลังพิมพ์/เลือกอะไรในหัวแชทอยู่ (ฟอร์มลีดแบบพับบนจอแคบ · ช่องโอน) = ยังไม่วาด
    //   ไม่งั้นช่องที่กำลังพิมพ์หลุดโฟกัส/dropdown ที่กางอยู่ปิดเอง
    const act = document.activeElement;
    if (!force && act && $('cn-ph') && $('cn-ph').contains(act) && /INPUT|TEXTAREA|SELECT/.test(act.tagName)) return;
    // เก็บสิ่งที่ผู้ใช้กำลังทำค้างไว้ (เลือกเซลล์ค้าง / กางประวัติ / ข้อมูลลูกค้าแบบพับ)
    const _prevTo = $('cn-to') ? $('cn-to').value : '';
    const _profOpen = !!document.querySelector('#cn-ph details.cn-prof-m[open]');
    // ★ ข้อมูลลูกค้าแบบพับ (จอแคบ) อยู่ในหัวแชท — เดิมวาดหัวใหม่แล้วแผงนี้ว่างทุก 6 วิ
    //   (paintProfile ไม่วาดซ้ำเมื่อข้อมูลเหมือนเดิม) → ย้ายแผงเดิมกลับเข้าไปทั้งก้อน
    const _profBody = $('cn-prof-m-body');
    const own = r.owner ? `เจ้าของ <b>${h(r.owner)}</b>` : `<b>ยังไม่มีเซลล์รับ</b>`;
    const acts = [];
    // ปุ่มลัดไปกล่อง "จ่ายเบอร์" — กล่องอยู่ในแผงข้อมูลลูกค้า (ด้านขวา/แบบพับ) ซึ่งอาจซ่อนอยู่
    const L = d.lead;
    if (ADMIN && d.codeHelp && L && !L.code && !L.noCode && !L.buy && L.deal !== 'buy') {
      // ★ 11 ต.ค.69 โหมดติ๊ก: แชทเข้าห้องพัก Lead เมื่อแอดมินกด "รับ lead" (ปุ่มในแผงขวาอยู่ลึก ต้องเลื่อนหา → มีที่หัวแชทด้วย)
      if (!L.park && !L.roomAuto)
        acts.push(`<button class="btn" id="cn-park-btn" title="รับ lead จากแชทนี้แล้ว — ส่งเข้าห้องพัก Lead รอจ่ายเบอร์">${ic('check')} รับ lead</button>`);
      acts.push(`<button class="btn pri" id="cn-code-btn" title="ออกเลขลีด + จ่ายลูกค้าคนนี้ให้เซลล์">${ic('hash')} จ่ายเบอร์</button>`);
    }
    if (d.canClaim) acts.push(`<button class="btn pri" id="cn-claim">${ic('user-check')} รับลูกค้าคนนี้</button>`);
    if (d.canRelease) acts.push(`<button class="btn red" id="cn-pool" title="คืนลูกค้าคนนี้เข้าคิวรอรับ ให้เซลล์คนอื่นรับต่อ (จดประวัติว่าใครคืน เพราะอะไร)">คืนกองกลาง</button>`);
    if (d.canDismiss) acts.push(`<button class="btn" id="cn-dismiss" title="ลูกค้าส่งมาแค่ขอบคุณ/สติกเกอร์ หรือตอบนอกระบบไปแล้ว — ปิดรอบนี้โดยไม่ต้องตอบ">${ic('check')} ไม่ต้องตอบ</button>`);
    if (d.canAssign) {
      acts.push(`<select id="cn-to"><option value="">โอนให้เซลล์…</option>${S.sellers.filter(s => s.id !== r.ownerId).map(s =>
        `<option value="${s.id}">${h(s.name)} · ทีม ${h(s.team)}</option>`).join('')}</select>`);
      acts.push(`<button class="btn" id="cn-assign">${ic('repeat')} โอน</button>`);
      if (r.owner) acts.push(`<button class="btn red" id="cn-release">ปล่อยคืนคิว</button>`);
    }
    // นาฬิกา = ป้ายเล็กในบรรทัดเดียวกับเจ้าของ (เดิมเป็นแถบเต็มความกว้าง กินที่แชท)
    let clock = '';
    if (r.awaiting) {
      const ck = clockText(r.due, r.since);
      const late = ck.cls === 'late';
      clock = ` · <span class="cn-clock ${ck.cls}" data-due="${h(r.due)}" title="${late ? 'เลยเวลาแล้ว — แอดมินได้รับแจ้ง' : 'ลูกค้ารอคำตอบ'}">${ic(late ? 'alert' : 'clock', 12)} <span class="ck">${h(ck.text)}</span></span>`;
    }
    const nHist = ADMIN ? (d.history || []).length : 0;
    if (nHist) acts.push(`<button class="btn" id="cn-hist-btn" title="ใครรับ/โอน/ตอบลูกค้าคนนี้ เมื่อไหร่">ประวัติ ${nHist}</button>`);
    acts.push(`<button class="btn wide-only${S.side ? ' pri' : ''}" id="cn-side-btn" title="แสดง/ซ่อนข้อมูลลูกค้าด้านขวา (ซ่อน = แชทกว้างขึ้น)">${ic('user-check')} ข้อมูลลูกค้า</button>`);
    const hist = (nHist && S.histOpen) ? `<div class="cn-hist">${d.history.map(x =>
        `<div>${h(fmtWhen(x.at))} · <b>${h(x.label)}</b>${x.emp ? ' · ' + h(x.emp) : ''}${x.by && x.by !== x.emp ? ' (โดย ' + h(x.by) + ')' : ''}${x.waitSec != null ? ' · ลูกค้ารอ ' + Math.round(x.waitSec / 60) + ' นาที' : ''}${x.onTime === false ? ' · เกินเวลา' : ''}${x.note ? ' · ' + h(x.note) : ''}</div>`).join('')}</div>` : '';
    $('cn-ph').innerHTML = `
      <div class="cn-ph-row">
        <button class="btn sm cn-mback" id="cn-mback">${ic('arrow-left')}<span class="hub-only">ห้องพัก Lead</span></button>
        ${avHtml(r.name, r.pic)}
        <div class="cn-ph-who">
          <h2>${h(r.name)}</h2>
          <div class="cn-sub">${chTag(r.src)}${r.staff ? ' <span class="tag wait">พนักงาน</span>' : ''} ${own}${r.team ? ' · ' + teamTag(r.team) : ''} · ${r.msgs} ข้อความ${clock}</div>
        </div>
        <div class="cn-acts">${acts.join('')}</div>
      </div>
      <details class="cn-prof-m"><summary>ข้อมูลลูกค้า</summary><div id="cn-prof-m-body"></div></details>
      ${hist}`;
    $('cn-mback').onclick = window.__cnBack;
    if (_prevTo && $('cn-to')) $('cn-to').value = _prevTo;
    if (_profOpen) { const dt = document.querySelector('#cn-ph details.cn-prof-m'); if (dt) dt.open = true; }
    if (_profBody && _profBody.innerHTML) { const nb = $('cn-prof-m-body'); if (nb) nb.replaceWith(_profBody); }
    const on = (id, fn) => { const b = $(id); if (b) b.onclick = fn; };
    on('cn-code-btn', goAssign);
    on('cn-park-btn', async ev => {
      ev.currentTarget.disabled = true;
      const res = await api('/connect/api/assign_lead', { id: r.id, park: true });
      toast(res.ok ? res.message : (res.error || 'ทำไม่สำเร็จ'), 3500);
      if (res.ok) { openChat(r.id, true); loadInbox(false); } else ev.currentTarget.disabled = false;
    });
    on('cn-claim', () => claim(r.id));
    on('cn-dismiss', () => dismiss(r.id));
    on('cn-assign', () => assign(r.id, +($('cn-to').value || 0), false));
    on('cn-release', () => assign(r.id, 0, true));
    on('cn-pool', () => crmRelease(r.id));
    on('cn-hist-btn', () => { S.histOpen = !S.histOpen; paintHeader(); });
    on('cn-side-btn', () => {
      S.side = !S.side;
      try { localStorage.setItem('cn_side', S.side ? '1' : '0'); } catch (e) {}
      applySide(); paintHeader();
    });
  }
  // ซ่อน/แสดงคอลัมน์ข้อมูลลูกค้า — จำไว้ในเครื่อง (คนที่อยากได้แชทกว้างไม่ต้องกดซ่อนทุกครั้ง)
  function applySide() {
    const el = document.querySelector('.cn-chat'); if (el) el.classList.toggle('noside', !S.side);
  }
  // ★ 17 ต.ค.69 ของที่อยู่ใน "ข้อมูลเพิ่มเติม" (พับไว้) — กางให้ก่อนเลื่อนไปหา
  //   ระบบกางเอง = ไม่จำลงเครื่อง (ครั้งหน้ายังพับตามที่คนเลือกไว้) · แต่แผงที่วาดใหม่ระหว่างนี้ยังกางอยู่
  let _moreAuto = false;
  function openMore(el) {
    for (let p = el && el.parentElement; p; p = p.parentElement) {
      if (p.tagName !== 'DETAILS' || p.open) continue;
      if (p.classList.contains('pf-more')) { _moreAuto = true; S.moreOpen = true; }
      p.open = true;
    }
  }
  // ปุ่ม "จ่ายเบอร์" บนหัวแชท → พาไปกล่องจ่ายเบอร์ (เปิดคอลัมน์ข้อมูลลูกค้าที่ซ่อนไว้ / กางแบบพับบนจอแคบ)
  function goAssign() {
    let side = $('cn-side');
    if (side && side.offsetParent === null && !S.side && window.innerWidth > 1180) {
      S.side = true;
      try { localStorage.setItem('cn_side', '1'); } catch (e) {}
      applySide(); paintHeader(true);
    }
    side = $('cn-side');
    let box = (side && side.offsetParent !== null) ? side.querySelector('[data-box=assign]') : null;
    if (!box) {
      const dt = document.querySelector('#cn-ph details.cn-prof-m');
      if (dt) { dt.open = true; box = dt.querySelector('[data-box=assign]'); }
    }
    if (!box) { toast('เปิดกล่องจ่ายเบอร์ไม่ได้ — ลองกดชื่อลูกค้าอีกครั้ง'); return; }
    openMore(box);                               // กล่องจ่ายเบอร์อยู่ใน "ข้อมูลเพิ่มเติม" (พับไว้)
    box.scrollIntoView({ block: 'center', behavior: 'smooth' });
    box.classList.add('flash'); setTimeout(() => box.classList.remove('flash'), 1800);
    const sel = box.querySelector('[data-x=emp]');
    if (sel && !sel.value) sel.focus({ preventScroll: true });
  }

  // ── ★ 12 ต.ค.69 คำที่ระบบจับได้ในแชท (เจ้าของเลือกจากเดโม CRM: "เอาแบบนี้แหละ แก้ไขเลย") ──
  //   เซิร์ฟเวอร์ส่ง m.hl = [[เริ่ม, จบ, ช่อง]] (connect.add_spans · ตัวจับชุดเดิม) → ระบายสีตามหมวด
  //   กดคำ = ไปช่องข้อมูลที่คำนั้นลง · กดป้าย "จากแชท 14:02" ที่ช่อง = ย้อนไปข้อความต้นทาง
  const KW_CAT = { phone: 'c', line_id: 'c', car_text: 'r', car_model: 'r', occupation: 'm', income: 'm', job_tenure: 'm',
                   pay_history: 'm', customer_type: 'm', customer_status: 'i', deal: 'i', trade: 'i' };
  const KW_NAME = { phone: 'เบอร์โทร', line_id: 'ID LINE', car_text: 'รถลูกค้าถาม', car_model: 'CAR / สูตร', occupation: 'อาชีพ',
                    income: 'รายได้', job_tenure: 'อายุงาน', pay_history: 'ประวัติการผ่อน', customer_type: 'ประเภทลูกค้า',
                    customer_status: 'สถานะลูกค้า', deal: 'ลีดรับซื้อรถ', trade: 'มีรถเทิร์น' };
  const KW_LEG = [['c', 'ติดต่อ'], ['r', 'รถ'], ['m', 'การเงินลูกค้า'], ['i', 'เจตนา / สถานะ']];
  // ประโยคถามต่อ / ตอบด่วน — {q} = คำลงท้ายคำถาม (ครับ/คะ) · {p} = คำลงท้ายบอกเล่า (ครับ/ค่ะ) · กดแล้วแค่ใส่ช่องพิมพ์ ไม่ส่งเอง
  const KW_ASK = {
    contact: 'รบกวนขอเบอร์โทร หรือ ID LINE ไว้ให้เจ้าหน้าที่ติดต่อกลับหน่อยนะ{q}',
    car: 'สนใจรุ่นไหน ปีประมาณไหนเป็นพิเศษไหม{q}',
    money: 'ลูกค้าทำงานอะไร รายได้ต่อเดือนประมาณเท่าไหร่{q} จะได้เช็คไฟแนนซ์ให้{p}',
    tenure: 'ทำงานที่ปัจจุบันมากี่ปีแล้ว{q}',
    pay: 'ตอนนี้มีผ่อนอะไรอยู่ไหม{q} ผ่อนตรงทุกงวดไหม{q}',
    view: 'สะดวกเข้ามาดูรถที่เต็นท์วันไหน{q}',
    bcar: 'รถรุ่นอะไร ปีไหน เลขไมล์ประมาณเท่าไหร่{q}',
    photos: 'รบกวนส่งภาพรถ ด้านนอก ด้านใน หน้าปัดให้เห็นเลขไมล์ และสำเนาเล่มทะเบียน หน้า 4 และ 18 เพื่อให้เจ้าหน้าที่ฝ่ายจัดซื้อประเมินราคานะ{q}',
    payoff: 'รถยังติดไฟแนนซ์อยู่ไหม{q} ยอดปิดประมาณเท่าไหร่{q}',
    handoff: 'ขอบคุณ{p} แอดมินจะประสานงานให้เจ้าหน้าที่ฝ่ายจัดซื้อติดต่อกลับนะ{q}',
  };
  const ptTxt = s => String(s || '').replace(/\{q\}/g, S.pt === 'f' ? 'คะ' : 'ครับ').replace(/\{p\}/g, S.pt === 'f' ? 'ค่ะ' : 'ครับ');
  const kwKey = f => f === 'car_model' ? 'car_text' : (f === 'customer_type' ? 'occupation' : f);
  const kwNorm = s => String(s || '').replace(/…/g, '').replace(/\s+/g, '').toLowerCase();
  const kwDigits = s => { let d = String(s || '').replace(/\D/g, ''); return d.startsWith('66') ? '0' + d.slice(2) : d; };
  function shortAt(iso) {
    if (!iso) return '';
    const t = new Date(iso), now = new Date();
    const hm = pad(t.getHours()) + ':' + pad(t.getMinutes());
    return t.toDateString() === now.toDateString() ? hm : t.getDate() + '/' + (t.getMonth() + 1) + ' ' + hm;
  }
  function kwText(m) {
    const t = m.text || '', hl = S.hl ? (m.hl || []) : [];
    if (!hl.length) return h(t);
    let x = '', p = 0;
    hl.forEach(([s, e, f]) => {
      if (s < p || e > t.length) return;
      x += h(t.slice(p, s)) + `<button type="button" class="kw kw-${KW_CAT[f] || 'i'}" data-kw="${h(f)}" title="ระบบจับคำนี้ → ช่อง ${h(KW_NAME[f] || f)} (กดเพื่อไปที่ช่อง)">${h(t.slice(s, e))}</button>`;
      p = e;
    });
    return x + h(t.slice(p));
  }
  // ข้อความต้นทางของช่อง f — ตรงกับคำที่จับได้ (autoWhy) / ค่าในช่อง ก่อน · ไม่ตรง = ข้อความแรกที่พูดถึง (สถานะลูกค้า = ล่าสุด)
  function kwFindMsg(f, why, val, last) {
    const ms = (S.chat && S.chat.messages) || [], k = kwKey(f), w = kwNorm(why), dv = kwDigits(val);
    const cand = [];
    ms.forEach((m, i) => (m.hl || []).forEach(x => { if (x[2] === k) cand.push([i, (m.text || '').slice(x[0], x[1])]); }));
    if (!cand.length) return -1;
    const hit = c => (k === 'phone' && dv && kwDigits(c[1]) === dv)
      || (w && (w.includes(kwNorm(c[1])) || kwNorm(c[1]).includes(w)))
      || (k === 'line_id' && val && kwNorm(c[1]).includes(kwNorm(val)));
    const ok = cand.filter(hit);
    const pool = ok.length ? ok : (k === 'phone' && dv ? [] : cand);
    if (!pool.length) return -1;
    return (last ? pool[pool.length - 1] : pool[0])[0];
  }
  function kwSrc(L, f) {
    const i = kwFindMsg(f, (L.autoWhy || {})[f], L[f], f === 'customer_status');
    return i < 0 ? null : { i, at: (S.chat.messages[i] || {}).at };
  }
  // ไปที่ช่องข้อมูล (เปิดคอลัมน์ขวาที่ซ่อนไว้ / กางแบบพับบนจอแคบ) แล้วกระพริบกรอบสีของหมวด
  function kwGo(f, btn) {
    if (btn) { btn.classList.add('on'); setTimeout(() => btn.classList.remove('on'), 2200); }
    const sel = f === 'deal' ? '.pf-buy' : (f === 'trade' ? '[data-box=trade]' : `.pf-fld [data-f="${f}"]`);
    let side = $('cn-side');
    if (side && side.offsetParent === null && !S.side && window.innerWidth > 1180) {
      S.side = true;
      try { localStorage.setItem('cn_side', '1'); } catch (e) {}
      applySide(); paintHeader(true); side = $('cn-side');
    }
    let el = (side && side.offsetParent !== null) ? side.querySelector(sel) : null;
    if (!el) {
      const dt = document.querySelector('#cn-ph details.cn-prof-m');
      if (dt) { dt.open = true; el = dt.querySelector(sel); }
    }
    if (!el) { toast('คำนี้ → ช่อง "' + (KW_NAME[f] || f) + '"'); return; }
    openMore(el);
    const box = el.closest('.pf-fld') || el, cls = 'kw-' + (KW_CAT[f] || 'i');
    box.scrollIntoView({ block: 'center', behavior: 'smooth' });
    box.classList.add('flash', cls);
    setTimeout(() => box.classList.remove('flash', cls), 2200);
  }
  // ย้อนไปข้อความต้นทาง (ป้าย "จากแชท" / "ดูในแชท")
  function goMsg(i, f) {
    const b = document.querySelector(`#cn-msgs .bub[data-mi="${i}"]`);
    if (!b) { toast('ข้อความต้นทางเก่ากว่าที่โหลดไว้ในหน้านี้'); return; }
    b.scrollIntoView({ block: 'center', behavior: 'smooth' });
    b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 2200);
    b.querySelectorAll(`.kw[data-kw="${kwKey(f)}"]`).forEach(x => { x.classList.add('on'); setTimeout(() => x.classList.remove('on'), 2200); });
  }
  // ความพร้อมของข้อมูล — ลีดขาย: ก่อนจ่ายเบอร์ (มีเลขแล้ว = ข้อมูลไฟแนนซ์) · ลีดรับซื้อ: ก่อนส่งจัดซื้อ
  //   [ชื่อ, มีแล้วไหม, คีย์ประโยคถามต่อ, ช่องที่ใช้]
  function kwReady(d) {
    const L = d.lead || {}, has = f => !!(L[f] && String(L[f]).trim());
    if (L.deal === 'buy') {
      const imgs = (d.messages || []).filter(m => m.dir !== 'out' && (m.type === 'image' || (m.files || []).some(x => x.kind === 'image'))).length;
      return { title: 'พร้อมส่งจัดซื้อ', items: [
        ['เบอร์ หรือ ID LINE', has('phone') || has('line_id'), 'contact', 'phone'],
        ['รุ่น + ปีรถของลูกค้า', has('car_text'), 'bcar', 'car_text'],
        ['รูปรถ + เล่ม (2 รูปขึ้นไป)', imgs >= 2, 'photos', ''],
      ] };
    }
    return { title: L.code ? 'ข้อมูลลูกค้าสำหรับไฟแนนซ์' : 'ข้อมูลพร้อมจ่ายเบอร์', items: [
      ['เบอร์ หรือ ID LINE', has('phone') || has('line_id'), 'contact', 'phone'],
      ['รถที่สนใจ', has('car_text') || (has('car_model') && L.car_model !== 'ไม่ระบุรุ่นรถ'), 'car', 'car_text'],
      ['อาชีพ + รายได้', has('occupation') && has('income'), 'money', 'occupation'],
      ['อายุงาน', has('job_tenure'), 'tenure', 'job_tenure'],
      ['ประวัติการผ่อน', has('pay_history'), 'pay', 'pay_history'],
    ] };
  }
  function kwBoxHtml(d) {
    const R = kwReady(d), n = R.items.length, done = R.items.filter(x => x[1]).length, miss = R.items.find(x => !x[1]);
    let x = `<div class="pf-sec kw-box" data-box="kw"><div class="kw-hd"><span class="pf-h" style="margin:0">${h(R.title)}</span><span class="kw-n">${done}/${n}</span></div>
      <div class="kw-bar"><i style="width:${Math.round(done / n * 100)}%"></i></div>
      <div class="kw-ready">${R.items.map(i => i[1] ? `<span class="ok">${ic('check', 13)}${h(i[0])}</span>` : `<span class="no"><i></i>${h(i[0])}</span>`).join('')}</div>`;
    if (miss) {
      x += `<div class="kw-ask"><b>ถามต่อ: ${h(miss[0])}</b><div>“${h(ptTxt(KW_ASK[miss[2]]))}”</div>${
        d.canReply && d.replyOn ? `<button class="btn sm" data-ask="${miss[2]}" style="margin-top:6px">ใส่ในช่องพิมพ์</button>` : ''}</div>`;
    } else {
      x += `<div class="pf-done" style="margin-top:8px">ข้อมูลครบแล้ว</div>`;
    }
    return x + `</div>`;                 // สวิตช์ไฮไลต์ + คำอธิบายสี อยู่ที่กล่อง "เก็บข้อมูลจากแชท" บนสุด (chatCapHtml)
  }
  // ลูกค้าพูดค่าใหม่ทีหลัง — ระบบไม่ทับค่าเดิมเอง ให้คนเลือก (connect.SUGG_KEY)
  const kwVal = (f, v) => f === 'income' && /^\d+$/.test(String(v || '')) ? Number(v).toLocaleString() : (f === 'phone' ? fmtPhone(String(v || '')) : (v || '–'));
  function kwSuggHtml(d) {
    const L = d.lead || {}, sg = L.sugg || {}, keys = Object.keys(sg);
    if (!keys.length || !d.leadEditable) return '';
    return `<div class="pf-sec kw-sugg" data-box="sugg"><div class="pf-h" style="color:var(--amber)">ลูกค้าพูดค่าใหม่ — รอคนตัดสิน (ระบบไม่ทับค่าเดิมเอง)</div>${keys.map(f => {
      const s = sg[f], mi = kwFindMsg(f, s.why, s.v, true);
      const acts = s.opts
        ? s.opts.map(o => `<button class="btn sm" data-sg-use="${h(f)}" data-v="${h(o)}">${h(o)}</button>`).join('') + `<button class="btn sm" data-sg-no="${h(f)}">ยังไม่รู้</button>`
        : `<button class="btn sm pri" data-sg-use="${h(f)}" data-v="${h(s.v)}">ใช้ ${h(kwVal(f, s.v))}</button><button class="btn sm" data-sg-use="${h(f)}" data-v="${h(s.from)}">คง ${h(kwVal(f, s.from))}</button>`;
      return `<div class="kw-sg" data-sg="${h(f)}"><div><b>${h(KW_NAME[f] || f)}</b> ${s.opts
          ? `ลูกค้าบอกแค่ “${h(s.why)}” — รุ่นไหน? (ระบบไม่เดา)`
          : `${h(kwVal(f, s.from))} → <b>${h(kwVal(f, s.v))}</b>`}</div>${!s.opts && s.why ? `<div class="pf-note" style="margin:2px 0 0">${h(s.why)}</div>` : ''}
        <div class="acts">${acts}${mi >= 0 ? `<button class="btn sm" data-src="${h(f)}" data-mi="${mi}">ดูในแชท</button>` : ''}</div></div>`;
    }).join('')}</div>`;
  }
  // ปุ่มในกล่องความพร้อม/ค่าใหม่/ป้ายที่มา — ผูกได้ทั้งแผงขวาและแบบพับ (เรียกซ้ำกับกล่องที่วาดใหม่ได้)
  function bindKw(el) {
    el.querySelectorAll('[data-ask]').forEach(b => b.onclick = () => kwAsk(b.dataset.ask));
    el.querySelectorAll('[data-src]').forEach(b => b.onclick = () => goMsg(+b.dataset.mi, b.dataset.src));
    el.querySelectorAll('[data-act=hl]').forEach(c => c.onchange = () => {
      S.hl = c.checked;
      try { localStorage.setItem('cn_hl', S.hl ? '1' : '0'); } catch (e) {}
      document.querySelectorAll('[data-act=hl]').forEach(x => { x.checked = S.hl; });
      paintMsgs(true);
    });
    el.querySelectorAll('[data-sg-use]').forEach(b => b.onclick = () => { b.disabled = true; saveLead(b.dataset.sgUse, b.dataset.v, null, true); });
    el.querySelectorAll('[data-sg-no]').forEach(b => b.onclick = async () => {
      const id = S.chat.row.id; b.disabled = true;
      const r = await api('/connect/api/lead', { id, field: b.dataset.sgNo, dismiss: true });
      if (!S.chat || S.chat.row.id !== id) return;
      if (!r.ok) { b.disabled = false; toast(r.error || 'ทำไม่สำเร็จ'); return; }
      S.chat.lead = r.lead; paintProfile(true);
    });
  }
  // ข้อมูลลีดเปลี่ยน (คนแก้ช่อง) → วาดเฉพาะกล่องความพร้อม/ค่าใหม่ใหม่ ไม่วาดทั้งแผง (คนอาจกำลังพิมพ์ช่องถัดไป)
  function refreshKw() {
    const d = S.chat; if (!d || !d.lead) return;
    const swap = (old, html) => {
      if (!html) { old.remove(); return; }
      const t = document.createElement('div'); t.innerHTML = html;
      const n = t.firstElementChild; old.replaceWith(n); bindKw(n);
    };
    document.querySelectorAll('[data-box=kw]').forEach(b => swap(b, kwBoxHtml(d)));
    document.querySelectorAll('[data-box=sugg]').forEach(b => swap(b, kwSuggHtml(d)));
    document.querySelectorAll('[data-box=cap]').forEach(b => swap(b, chatCapHtml(d)));
    topState(d).forEach(s => document.querySelectorAll(`[data-qst="${s[0]}"]`).forEach(el => { el.outerHTML = qStat(s); }));
    paintQuick();
  }
  // ประโยคถามต่อ/ตอบด่วน → ใส่ในช่องพิมพ์ (ไม่ส่งเอง — คนตรวจ/แก้ก่อนกดส่ง)
  function kwAsk(k) {
    const ta = $('cn-text');
    if (!ta) { toast('ตอบลูกค้าคนนี้ไม่ได้ตอนนี้'); return; }
    const t = ptTxt(KW_ASK[k] || '');
    ta.value = ta.value.trim() ? ta.value.replace(/\s+$/, '') + ' ' + t : t;
    ta.dispatchEvent(new Event('input'));
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  }
  // แถบตอบด่วนเหนือช่องพิมพ์ — ประโยคถามต่อ (ข้อมูลที่ยังขาด) ขึ้นก่อน · คำลงท้ายเลือกได้ (จำไว้ในเครื่อง)
  function paintQuick() {
    const w = $('cn-qr-wrap'); if (!w) return;
    const d = S.chat;
    if (!d || !d.lead || !d.canReply || !d.replyOn) { if (w.innerHTML) { w.innerHTML = ''; w.dataset.k = ''; } return; }
    const miss = kwReady(d).items.find(x => !x[1]);
    const base = d.lead.deal === 'buy'
      ? [['ขอรูปรถ + เล่ม', 'photos'], ['ถามรุ่น / ปี / ไมล์', 'bcar'], ['ถามยอดปิดไฟแนนซ์', 'payoff'], ['แจ้งส่งจัดซื้อ', 'handoff']]
      : [['ขอเบอร์ / ไลน์', 'contact'], ['ถามอาชีพ / รายได้', 'money'], ['ถามประวัติผ่อน', 'pay'], ['ชวนนัดดูรถ', 'view']];
    const list = (miss ? [['ถามต่อ: ' + miss[0], miss[2], 1]] : []).concat(base.filter(b => !miss || b[1] !== miss[2]));
    const key = list.map(x => x[1]).join(',') + '|' + S.pt;
    if (w.dataset.k === key) return;
    w.dataset.k = key;
    w.innerHTML = `<div class="kw-qr"><span style="color:var(--t3);font-size:12px">ตอบด่วน</span>${list.map(([l, k, nx]) =>
      `<button type="button" class="q${nx ? ' next' : ''}" data-ask="${k}" title="${h(ptTxt(KW_ASK[k]))}">${h(l)}</button>`).join('')}
      <span class="kw-pt" title="คำลงท้ายของข้อความตอบด่วน (จำไว้ในเครื่องนี้)"><button type="button" data-pt="m" class="${S.pt !== 'f' ? 'on' : ''}">ครับ</button><button type="button" data-pt="f" class="${S.pt === 'f' ? 'on' : ''}">ค่ะ</button></span></div>`;
    w.querySelectorAll('[data-ask]').forEach(b => b.onclick = () => kwAsk(b.dataset.ask));
    w.querySelectorAll('[data-pt]').forEach(b => b.onclick = () => {
      S.pt = b.dataset.pt;
      try { localStorage.setItem('cn_pt', S.pt); } catch (e) {}
      paintQuick(); refreshKw();
    });
  }

  // ★ 17 ต.ค.69 แผงขวา "เก็บข้อมูลจากแชท" (เจ้าของสั่ง · เลือก "4 หัวข้อขึ้นบนสุด" + "ไม่ใช้ AI")
  //   4 หัวข้อที่ต้องเก็บจากแชท (รุ่นรถ · เบอร์/ไลน์ · ประวัติลูกค้า · นัดดูรถ) อยู่บนสุด
  //   ที่เหลือ (ขั้นของลีด · จ่ายเบอร์ · ช่องอื่นของชีต · ใบจ่ายลีด) พับไว้ใน "ข้อมูลเพิ่มเติม"
  //   ระบบจับคำในแชทเติมให้เอง (ตัวจับชุดเดิม ไม่ใช้ AI) · ทุกช่องแก้/วางเองได้ ถ้าระบบจับไม่ได้หรือจับผิด
  //   [ช่อง, ป้าย, ชนิด] ชนิด: '' = ข้อความ · tel · area (หลายบรรทัด) · คีย์ต้องตรงกับ LEAD_FIELDS ใน connect.py
  //   ★ ช่องไหนในชีตเป็น dropdown → เป็นตัวเลือกชุดเดียวกับชีตเอง (`leadOptions.dropdowns` อ่านจากชีตทุกชั่วโมง)
  //   ★ แต่ละช่องต้องอยู่ที่เดียว (data-f ซ้ำ = ค่า 2 ช่องไม่ตรงกัน)
  const LEAD_TOP = {
    car: [[['car_text', 'รถลูกค้าถาม']], [['car_model', 'CAR / สูตร']]],
    contact: [[['phone', 'เบอร์โทร', 'tel'], ['line_id', 'ID LINE']]],
    hist: [
      [['occupation', 'อาชีพ'], ['income', 'รายได้']],
      [['job_tenure', 'อายุงาน'], ['pay_history', 'ประวัติการผ่อน']],
      [['customer_type', 'ประเภทลูกค้า'], ['customer_status', 'สถานะลูกค้า']],
      [['admin_profile', 'PROFILE ลูกค้า จาก ADMIN', 'area']],
    ],
  };
  const LEAD_UI = [                     // ช่องอื่นของชีตลีด — อยู่ใน "ข้อมูลเพิ่มเติม"
    { sec: 'ลูกค้า', rows: [[['customer_name', 'ชื่อลูกค้า']]] },
    { sec: 'ข้อมูลลีด', rows: [
      [['code', 'Code (เลขลีด)'], ['lead_type', 'type']],
      [['channel', 'ช่องทาง'], ['branch', 'สาขา']],
      [['ads', 'ADS']], [['account', 'ชื่อ Account']],
      [['admin_name', 'Admin'], ['live_team', 'ทีมไลฟ์']],
      [['focus', 'FOCUS'], ['call_proof', 'แจ้งหลักฐานการโทร']],
      [['fill_note', 'มากรอกชีตกันเถอะ', 'area']],
    ] },
  ];
  let _DDF = {};                       // ตัวเลือก dropdown ของแชทที่เปิดอยู่ (ตั้งใน profileHtml)

  function leadField(L, f, label, kind, ed, sfx) {
    const A = L.auto || {}, v = L[f] || '', W = L.autoWhy || {};
    // ช่องที่จับจาก keyword บอกด้วยว่าจับจากคำไหน — คนตรวจได้ทันทีว่าระบบอ่านถูกไหม
    const why = W[f] ? ` · จับจากคำว่า “${W[f]}”` : '';
    // ★ 12 ต.ค.69 ระบบเติมจากแชท → ป้ายบอกเวลาข้อความต้นทาง กดแล้วย้อนไปข้อความนั้น (หาไม่เจอ = ป้ายเดิม)
    const src = A[f] === 'แชท' ? kwSrc(L, f) : null;
    let badge = '';
    if (src) badge = `<button type="button" class="kw-src kw-${KW_CAT[f] || 'i'}" data-src="${f}" data-mi="${src.i}" title="ระบบเติมให้อัตโนมัติจากแชท${h(why)} — กดเพื่อดูข้อความต้นทาง · แก้ได้">จากแชท ${h(shortAt(src.at))}</button>`;
    else if (A[f] && A[f] !== 'คน') badge = `<span class="pf-auto" title="ระบบเติมให้อัตโนมัติจาก${h(A[f])}${h(why)} — แก้ได้">จาก${h(A[f])}</span>`;
    if ((L.sugg || {})[f]) badge = `<span class="pf-sgm" title="ลูกค้าพูดค่าใหม่ — ดูกล่อง &quot;รอคนตัดสิน&quot; ด้านบน">ค่าใหม่รอยืนยัน</span>` + badge;
    const dis = ed ? '' : ' disabled';
    const opts = Array.isArray(_DDF[f]) && _DDF[f].length ? _DDF[f] : null;
    let inp;
    if (opts) {
      // ค่าเดิมที่ไม่อยู่ในตัวเลือกของชีต (กรอกก่อนมี dropdown / มาจากใบจ่ายลีด) — โชว์ไว้ ไม่ทิ้งข้อมูล
      const extra = v && !opts.includes(v) ? `<option value="${h(v)}" selected>${h(v)} (นอกตัวเลือกชีต)</option>` : '';
      inp = `<select data-f="${f}" class="${v ? '' : 'empty'}"${dis}><option value="">— เลือก —</option>${
        opts.map(o => `<option value="${h(o)}"${o === v ? ' selected' : ''}>${h(o)}</option>`).join('')}${extra}</select>`;
    } else if (kind === 'area') inp = `<textarea data-f="${f}" rows="2"${dis}>${h(v)}</textarea>`;
    else inp = `<input type="${kind === 'tel' ? 'tel' : 'text'}" data-f="${f}" value="${h(v)}"${dis} autocomplete="off">`;
    return `<div class="pf-fld"><div class="pf-lab"><span>${h(label)}</span>${badge ? `<span style="display:flex;gap:4px;align-items:center">${badge}</span>` : ''}</div>${inp}</div>`;
  }
  const rowsHtml = (L, rows, ed, sfx) => rows.map(row => {
    const cells = row.map(([f, lab, kind]) => leadField(L, f, lab, kind, ed, sfx));
    return row.length > 1 ? `<div class="pf-g2">${cells.join('')}</div>` : cells[0];
  }).join('');

  // สถานะของ 4 หัวข้อ — [คีย์, ชื่อ, ไอคอน, เก็บแล้วไหม, ข้อความสถานะ]
  function topState(d) {
    const L = d.lead || {}, has = f => !!(L[f] && String(L[f]).trim());
    const hist = ['occupation', 'income', 'job_tenure', 'pay_history'].filter(has).length;
    const vw = ((d.crm || {}).followups || []).filter(f => !f.done && f.kind === 'viewing');
    return [
      ['car', 'รุ่นรถที่สนใจ', 'car', has('car_text') || (has('car_model') && L.car_model !== 'ไม่ระบุรุ่นรถ'), ''],
      ['contact', 'เบอร์ / ไลน์ ติดต่อ', 'phone', has('phone') || has('line_id'), ''],
      ['hist', 'ประวัติลูกค้า', 'user', hist >= 4, hist + '/4'],
      ['appt', 'นัดดูรถ', 'calendar', vw.length > 0, vw.length ? fmtWhen(vw[0].due) : ''],
    ];
  }
  const qStat = s => `<span class="st ${s[3] ? 'ok' : 'no'}" data-qst="${s[0]}">${s[3] ? ic('check', 12) : ''}${h(s[4] || (s[3] ? 'มีแล้ว' : 'ยังไม่มี'))}</span>`;
  const qHead = s => `<div class="pf-h"><span class="n">${ic(s[2], 13)}</span>${h(s[1])}${qStat(s)}</div>`;
  function chatCapHtml(d) {
    const st = topState(d), n = st.filter(s => s[3]).length;
    return `<div class="pf-cap" data-box="cap"><div class="hd"><b>เก็บข้อมูลจากแชท</b><span>${n}/4</span></div>
      <div>ระบบจับเบอร์ ไลน์ รุ่นรถ อาชีพ/รายได้ จากที่ลูกค้าพิมพ์ แล้วเติมให้เอง (ป้าย “จากแชท” กดดูข้อความต้นทางได้) ·
        ระบบจับไม่ได้หรือจับผิด — คัดลอกจากแชทมาวาง/แก้ในช่องได้เลย</div>
      <div class="ck">${st.map(s => `<span class="${s[3] ? 'ok' : 'no'}">${s[3] ? ic('check', 12) : '<i></i>'}${h(s[1])}</span>`).join('')}</div>
      <div class="kw-leg"><label><input type="checkbox" data-act="hl"${S.hl ? ' checked' : ''}> ไฮไลต์คำที่ระบบจับได้ในแชท</label>${
        KW_LEG.map(([c, t]) => `<span class="kw kw-${c}">${t}</span>`).join('')}</div></div>`;
  }

  // หัวข้อ 4 "นัดดูรถ" — นัดที่ค้าง (นัดติดตามด้วย ไม่งั้นหายจากแผง) · ลูกค้าพูดถึงวันนัดในแชท · ฟอร์มนัด (ค่าเริ่มต้น = นัดดูรถ)
  function apptHtml(d, s) {
    const K = d.crm || {}, id = d.row.id, ed = !!d.leadEditable;
    const fl = K.followups || [];
    const open = fl.filter(f => !f.done).sort((a, b) => (a.kind === 'viewing' ? 0 : 1) - (b.kind === 'viewing' ? 0 : 1));
    const done = fl.filter(f => f.done).slice(0, 3);
    const ad = S.apptDraft[id] || {};
    let x = `<div class="pf-sec pf-q" data-q="appt">${qHead(s)}`;
    const H = K.apptHint;
    if (H && ed && S.hintNo[id] !== H.mid) {
      const mi = (d.messages || []).findIndex(m => m.id === H.mid);
      const used = ad.due === localDT(new Date(H.at));
      x += `<div class="pf-hint"><b>${H.dir === 'out' ? 'ในแชทพูดถึงนัด' : 'ลูกค้าพูดถึงนัด'}</b> → <b>${h(fmtFull(H.at))}</b>
        <div class="q">“${h(H.text)}”</div>
        <div class="acts">${used ? '<span style="color:var(--green);font-size:12px">ใส่ในฟอร์มด้านล่างแล้ว — ตรวจแล้วกด "บันทึกนัด"</span>'
          : `<button class="btn sm pri" data-act="hint-use">ใส่ในฟอร์มนัด</button>`}${
          mi >= 0 ? `<button class="btn sm" data-act="hint-src" data-mi="${mi}">ดูในแชท</button>` : ''}<button class="btn sm" data-act="hint-no">ไม่ใช่นัด</button></div>
        <div class="pf-note" style="margin:4px 0 0">ระบบอ่านวัน-เวลาจากข้อความ (ไม่ใช้ AI) — ยังไม่บันทึกจนกว่าจะกด "บันทึกนัด"</div></div>`;
    }
    x += open.map(f => `<div class="crm-it${f.late ? ' late' : ''}"><b>${h(f.kindLabel)}</b> ${h(fmtFull(f.due))}${f.who ? ' · @' + h(f.who) : ''}${f.late ? ' · <b style="color:var(--red)">เลยนัดแล้ว</b>' : ''}
        ${f.note ? `<div>${h(f.note)}</div>` : ''}${ed ? `<div class="acts"><button class="btn sm pri" data-fdone="${f.id}">ทำแล้ว</button><button class="btn sm" data-fcancel="${f.id}">ยกเลิกนัด</button></div>` : ''}</div>`).join('')
      + done.map(f => `<div class="crm-it done">${h(f.kindLabel)} ${h(fmtFull(f.due))} · ${h(f.result || 'ทำแล้ว')}${f.doneBy ? ' · ' + h(f.doneBy) : ''}</div>`).join('')
      + (!open.length && !done.length ? '<div class="pf-note">ยังไม่มีนัด</div>' : '');
    if (ed) {
      x += `<div class="crm-form" data-box="appt">
        <select data-x="kind"><option value="viewing"${ad.kind !== 'follow' ? ' selected' : ''}>นัดดูรถ (ขั้นเป็น "นัดดูรถ" ให้เอง)</option><option value="follow"${ad.kind === 'follow' ? ' selected' : ''}>นัดติดตาม</option></select>
        <div class="crm-qd"><button data-qd="1">พรุ่งนี้ 10:00</button><button data-qd="3">อีก 3 วัน</button><button data-qd="7">อีก 7 วัน</button></div>
        <input type="datetime-local" data-x="due" value="${h(ad.due || '')}">
        <input type="text" data-x="note" maxlength="300" placeholder="รายละเอียด (ไม่บังคับ) เช่น มาดู City ที่สาขา" value="${h(ad.note || '')}">
        <button class="btn sm pri" data-act="appt-add" style="width:100%">บันทึกนัด</button></div>`;
    }
    return x + `</div>`;
  }

  // ป้ายสถานะบนหัว "ข้อมูลเพิ่มเติม" — เห็นได้โดยไม่ต้องกาง
  function moreBadge(d) {
    const L = d.lead || {}, E = (d.crm || {}).extra || {};
    if (L.code) return 'เลข ' + L.code;
    if (L.buy) return 'ส่งจัดซื้อแล้ว';
    if (L.deal === 'buy') return 'ลีดรับซื้อรถ';
    if (L.noCode) return 'ไม่ต้องจ่ายเบอร์';
    if (L.park) return 'รอจ่ายเบอร์';
    return E.stageLabel || '';
  }

  function profileHtml(d, sfx) {
    const p = d.profile, r = d.row, L = d.lead;
    if (!p) return '';
    const ed = !!d.leadEditable;
    const shownName = (L && L.customer_name) || p.name;
    let x = `<div class="pf-top">${avHtml(shownName, p.pic, 'lg')}
      <div class="pf-name-row"><span class="pf-name">${h(shownName)}</span>${L && ed ? `<button class="pf-pen" data-act="name" title="แก้ชื่อลูกค้า">✎</button>` : ''}</div>
      ${p.lineName && p.lineName !== shownName ? `<div class="pf-line">ชื่อใน ${p.src === 'fb' ? 'Facebook' : 'LINE'}: ${h(p.lineName)}</div>` : ''}
      ${p.src === 'fb' ? `<div class="pf-line">${chTag('fb')} ${h(p.page || '')}</div>${p.inbox ? `<a class="btn sm" href="${h(p.inbox)}" target="_blank" rel="noopener">เปิดใน Facebook ↗</a>` : ''}` : ''}
      ${p.status ? `<div class="pf-status">“${h(p.status)}”</div>` : ''}`;
    if (L) {
      x += `<div class="pf-tags">${(L.tags || []).map(t => `<span class="pf-tag">${h(t)}${ed ? `<button data-tag-del="${h(t)}" title="เอาแท็กออก">×</button>` : ''}</span>`).join('')}
        ${ed ? `<input class="pf-tag-in" data-act="tag" placeholder="+ ใส่แท็ก" list="dl-tag-${sfx}">` : ''}</div>`;
    }
    x += `</div>`;
    const ownerKv = `<div class="pf-kv"><span>ผู้รับผิดชอบ</span><span>${r.owner ? h(r.owner) + (r.team ? ' · ทีม ' + h(r.team) : '') : 'ยังไม่มีคนรับ'}</span></div>`;
    if (!p.full) {
      return x + `<div class="pf-sec">${ownerKv}<div class="pf-kv"><span>ทักครั้งแรก</span><span>${h(fmtFull(p.firstSeen)) || '–'}</span></div></div>
        <div class="pf-sec pf-lock">ข้อมูลลีด เบอร์โทร และรถที่ลูกค้าหา เห็นได้หลังกด "รับลูกค้าคนนี้"</div>`;
    }
    // ช่องที่ระบบคำนวณเอง (ไม่ให้แก้ — แก้แล้วจะไม่ตรงกับของจริง)
    const calcSec = `<div class="pf-sec">${ownerKv}
      <div class="pf-kv"><span>ว/ด/ป · เวลา</span><span>${h(fmtFull(L ? L.leadAt : p.firstSeen)) || '–'}</span></div>
      ${L ? `<div class="pf-kv"><span>วันเวลาที่ติดต่อ</span><span>${h(fmtFull(L.contactAt)) || 'ยังไม่ได้ตอบ'}</span></div>
      <div class="pf-kv"><span>จำนวนอัพเดท</span><span>${L.updates}</span></div>
      <div class="pf-kv"><span>อัพเดทล่าสุด</span><span>${h(fmtFull(L.lastUpdate)) || '–'}</span></div>` : ''}
      <div class="pf-kv"><span>ข้อความทั้งหมด</span><span>${p.msgs}</span></div>
      ${p.language ? `<div class="pf-kv"><span>ภาษา</span><span>${h(LANG[p.language] || p.language)}</span></div>` : ''}
    </div>`;
    if (!L) {
      return x + calcSec + (d.leadError ? `<div class="pf-sec pf-lock" style="color:var(--red)">${h(d.leadError)}</div>` : '');
    }
    const O = d.leadOptions || {};
    _DDF = O.dropdowns || {};
    const dls = `<datalist id="dl-tag-${sfx}">${(O.tags || []).map(v => `<option value="${h(v)}">`).join('')}</datalist>`;
    const src = O.source || {};
    const ddNote = `<div class="pf-note">ตัวเลือกตาม dropdown ของชีตลีด${src.tab ? ' แท็บ ' + h(src.tab) : ''}${
      src.fallback ? ' (ชุดที่จำไว้ ยังอ่านชีตล่าสุดไม่ได้)' : ''}</div>`;
    const st = topState(d), K = d.crm || {};

    // ── บนสุด: เก็บข้อมูลจากแชท + 4 หัวข้อ ──
    x += chatCapHtml(d) + kwSuggHtml(d);
    if (!ed) x += `<div class="pf-lock" style="margin:6px 0">ดูได้อย่างเดียว — แก้ได้เฉพาะเจ้าของลูกค้าและแอดมิน</div>`;
    // 1. รุ่นรถที่สนใจ
    x += `<div class="pf-sec pf-q" data-q="car">${qHead(st[0])}${rowsHtml(L, LEAD_TOP.car, ed, sfx)}`;
    const needs = p.needs || [];
    if (needs.length) x += `<div class="pf-h" style="margin:8px 0 4px">รถที่ลูกค้าหา (จากระบบจับความต้องการ)</div>${needs.map(n =>
      `<div class="pf-need"><b>${h(n.car)}</b>${n.detail ? h(n.detail) + '<br>' : ''}<span style="color:var(--t3)">${h(n.status)}${n.waiting ? ' · รอรถที่ตรงสเปก' : ''}</span></div>`).join('')}`;
    if ((K.cars || []).length) x += `<div class="pf-done">รถพร้อมขายที่ตรงกับลูกค้า: ${K.cars.map(c => `<b>${h(c.name || c.code)}</b>${c.year ? ' ' + h(c.year) : ''}${c.price ? ' ' + fmtBaht(c.price) : ''}`).join(' · ')}</div>`;
    if (L.trade && L.deal !== 'buy') x += `<div class="pf-src" data-box="trade">ลูกค้ามีรถเทิร์น — "${h(L.trade.why || '')}" (ยังเป็นลีดขายรถ)</div>`;
    x += `</div>`;
    // 2. เบอร์ / ไลน์ ติดต่อ
    x += `<div class="pf-sec pf-q" data-q="contact">${qHead(st[1])}${rowsHtml(L, LEAD_TOP.contact, ed, sfx)}`;
    const otherPh = (p.phones || []).filter(n => n !== L.phone);       // เบอร์ที่เจอในแชท — กดเพื่อใช้เป็นเบอร์หลัก
    if (otherPh.length && ed) x += `<div class="pf-phs"><span style="color:var(--t3);font-size:12px">ในแชท:</span>${otherPh.map(n =>
      `<button class="pf-phc" data-phone="${h(n)}" title="ใช้เบอร์นี้">${h(fmtPhone(n))}</button>`).join('')}</div>`;
    if (L.phone) x += `<div class="pf-phs"><a class="btn sm" href="tel:${h(L.phone)}">โทร ${h(fmtPhone(L.phone))}</a></div>`;
    x += `</div>`;
    // 3. ประวัติลูกค้า
    x += `<div class="pf-sec pf-q" data-q="hist">${qHead(st[2])}${rowsHtml(L, LEAD_TOP.hist, ed, sfx)}</div>`;
    // 4. นัดดูรถ
    x += apptHtml(d, st[3]);

    // ── ข้อมูลเพิ่มเติม (พับไว้ · จำว่ากางไว้ไหม) ──
    let m = '';
    m += kwBoxHtml(d);                                   // ★ 12 ต.ค.69 ข้อมูลพร้อมจ่ายเบอร์ x/5
    if (d.crm) m += crmHtml(d, sfx);                     // ขั้นของลีด · โทร · สรุป · ใครเคยดูแล
    m += calcSec;
    if (L.slip) {
      m += `<div class="pf-src">ดึงข้อมูลจากใบจ่ายลีดใน "${h(L.slip.group || 'กลุ่มจ่ายเบอร์')}" (${h(fmtFull(L.slip.at))})</div>`;
    } else if (L.sheet && L.code === L.sheet.code) {
      // ★ 11 ต.ค.69 เบอร์นี้ได้เลขในชีตลีดแล้ว (จ่ายนอกระบบ) → ระบบเติมเลขให้เองแล้วเอาออกจากห้องพัก
      const sv = L.sheet.seller === 'ADMIN' ? 'เทเลเซลล์' : (L.sheet.seller || '');
      const other = (L.sheet.codes || []).filter(c => c !== L.sheet.code);
      m += `<div class="pf-src">จ่ายเบอร์ในชีตลีดแล้ว — เบอร์นี้คือเลข <b>${h(L.sheet.code)}</b>${sv ? ' ของ @' + h(sv) : ''} (${h(String(L.sheet.date || ''))})${
        other.length ? ' · เลขอื่นของเบอร์นี้ในรอบเดียวกัน: ' + h(other.join(', ')) : ''}</div>`;
    }
    if (L.assignedAt) {
      m += `<div class="pf-done">จ่ายเบอร์ <b>${h(L.code)}</b> แล้ว · ${h(fmtFull(L.assignedAt))}${L.assignedBy ? ' โดย ' + h(L.assignedBy) : ''}${
        L.codeDemo ? ' · ทดลอง (ยังไม่ลงชีต ไม่ได้ส่งเข้ากลุ่ม)' : postStatusHtml(L.post, d.codeHelp ? 'data-act="repost"' : 'disabled')}</div>`;
    } else if (L.noCode && !L.code) {
      // แอดมินกด "ไม่ต้องจ่ายเบอร์" ไว้ (ไม่ใช่ลีดขาย) — ออกจากแท็บจ่ายเบอร์แล้ว · กดเอากลับได้
      m += `<div class="pf-skip"><span>ไม่ต้องจ่ายเบอร์${L.noCode.by ? ' · ' + h(L.noCode.by) : ''}${L.noCode.at ? ' ' + h(fmtFull(L.noCode.at)) : ''}</span>
        ${d.codeHelp ? `<button class="btn sm" data-act="nocode-undo">เอากลับมาจ่ายเบอร์</button>` : ''}</div>`;
    } else if (L.buy && !L.code) {
      // แอดมินส่งเข้ากลุ่มเคสHOT ของจัดซื้อแล้ว (ใบ "โค้ด : OC-…") — ลูกค้าอยากขายรถให้เรา ไม่ใช่ลีดขาย ไม่ต้องจ่ายเบอร์
      const B = L.buy;
      m += `<div class="pf-done">ส่งจัดซื้อแล้ว <b>${h(B.code)}</b>${B.seller ? ' → @' + h(B.seller) : ''}
        · ${h(fmtFull(B.at))}${B.by ? ' โดย ' + h(B.by) : ''}<br><span style="color:var(--t2)">ใน "${h(B.group || 'เคสHOT')}" — ลูกค้าอยากขายรถให้เรา</span></div>`;
    } else if (L.deal === 'buy' && !L.code) {
      m += buyLeadBoxHtml(L, !!d.codeHelp);
    } else if (d.codeHelp && !L.code) {
      m += parkRowHtml(L) + assignBoxHtml(d, sfx) + `<div class="pf-note" style="margin:-4px 0 8px">ลูกค้าอยากขายรถให้เรา? <a href="#" data-act="deal-buy">ย้ายไปเป็นลีดรับซื้อรถ</a></div>`;
    }
    if (d.codeHelp && L.code) m += lfBoxHtml(d);
    LEAD_UI.forEach(sec => {
      m += `<div class="pf-sec"><div class="pf-h">${h(sec.sec)}</div>${sec.sec === 'ข้อมูลลีด' ? ddNote : ''}${rowsHtml(L, sec.rows, ed, sfx)}</div>`;
    });
    // ★ 6 ต.ค.69 — ใบนี้ = หน้าตาเดียวกับที่ส่งเข้ากลุ่มจ่ายเบอร์ (pattern ที่เจ้าของกำหนด) · "ไลฟ์" ในใบ = ช่อง "ทีมไลฟ์"
    //   (คอลัมน์เดียวกันในชีต) — เลิกมีช่องพิมพ์ "ไลฟ์" แยก ไม่งั้นมี 2 ที่ให้กรอกเรื่องเดียวกัน
    m += `<div class="pf-sec pf-slip"><div class="pf-h">ใบจ่ายลีด</div>
      <div class="pf-note">หน้าตาเดียวกับที่ส่งเข้ากลุ่มจ่ายเบอร์ · ไลฟ์ = ช่อง "ทีมไลฟ์" ด้านบน · ช่องทาง/ไลฟ์ใช้คำตาม dropdown ของชีต</div>
      ${leadField(L, 'more', 'เพิ่มเติม', 'area', ed, sfx)}
      <pre class="pf-slip-text">${h(L.slipText || '')}</pre>
      <button class="btn sm" data-act="copy-slip">คัดลอกใบจ่ายลีด</button></div>`;
    const mb = moreBadge(d);
    x += `<details class="pf-more"${S.moreOpen ? ' open' : ''}><summary><span class="chev">${ic('chevron-right', 14)}</span>ข้อมูลเพิ่มเติม${
      mb ? `<span class="badge">${h(mb)}</span>` : ''}<span class="sub">ขั้นของลีด · จ่ายเบอร์ · ช่องอื่นของชีต · ใบจ่ายลีด</span></summary>${m}</details>`;
    return x + dls;
  }

  // ── ปุ่ม "จ่ายเบอร์" (แอดมิน) — ★ 6 ต.ค.69 ส่งใบเข้ากลุ่มจ่ายเบอร์จริง + แท็กเซลล์ (สวิตช์ปิด = ทดลองเดิม) ──
  //   ตัวหน้าตาม type ในชีต: NLD=Moderate WLD=Hot HLD=Very Hot BLD=BLD TLD=TikTok · A=ลีดแอดมิน · R=รีเจ็ค
  //   บอกล่วงหน้าว่า "กดแล้วส่งเข้าห้องไหน" (ch.post) — ส่งเข้ากลุ่มจริง = มีคนทั้งห้องเห็น ต้องรู้ก่อนกด
  function postNoteHtml(P, what) {
    if (!P) return '';
    if (!P.on) return `<div class="pf-lock" style="font-size:12px;margin:6px 0">${P.sim
      ? 'ลูกค้าจำลอง — ออกเลขทดลอง ไม่ส่งเข้ากลุ่มจริง'
      : `ทดลอง — เก็บในระบบเราเท่านั้น ยังไม่ลงชีต ไม่โพสต์กลุ่ม (เปิดส่งจริงได้ที่ ตั้งค่า) · เลขจริงคำนวณใหม่ตอนกด`}</div>`;
    const room = P.room ? `"${h(P.room)}"` : '<b style="color:var(--red)">ยังไม่พบกลุ่มจ่ายเบอร์ที่บอทตัวส่งอยู่ (ตั้งได้ที่ ตั้งค่า)</b>';
    return `<div class="pf-src" style="font-size:12px;margin:6px 0;line-height:1.5">กดแล้ว: ออกเลข → ${h(what)}
      → ส่งใบเข้า ${room}${P.rejectRoom && P.rejectRoom !== P.room ? ` (เลข R… → "${h(P.rejectRoom)}")` : ''} พร้อมแท็ก @เซลล์
      · ไม่ลงชีต · เลขจริงคำนวณใหม่ตอนกด (กันซ้ำ)</div>${P.fb
      ? `<div class="pf-lock" style="font-size:12px;margin:0 0 6px;color:var(--amber)">${h(P.fbNote)}</div>` : ''}`;
  }
  // ผลส่งใบเข้ากลุ่ม (post_info) — ส่งไม่สำเร็จ = ปุ่ม "ส่งเข้ากลุ่มอีกครั้ง" (การจ่ายในระบบยังอยู่ ไม่ต้องจ่ายใหม่)
  function postStatusHtml(post, btnAttr) {
    if (!post) return '';
    if (post.ok) {
      return `<br><span style="color:var(--green)">ส่งเข้า "${h(post.groupName || 'กลุ่มจ่ายเบอร์')}" แล้ว</span>${
        post.tagged ? ` · แท็ก @${h(post.seller || '')}` : ` · <span style="color:var(--amber)">แท็กไม่ได้ (${h(post.tagWhy || '-')}) — พิมพ์ @${h(post.seller || '')} แทน</span>`}`;
    }
    if (post.sending && !post.error) return `<br><span style="color:var(--t3)">กำลังส่งเข้ากลุ่ม…</span>`;
    return `<br><span style="color:var(--red)">ส่งเข้ากลุ่มไม่สำเร็จ: ${h(post.error || '-')}</span>
      <div style="margin-top:6px"><button class="btn sm pri" ${btnAttr}>ส่งเข้ากลุ่มอีกครั้ง</button></div>`;
  }
  // ★ 11 ต.ค.69 ติ๊ก "รับ lead จากแชทนี้แล้ว" → ส่งเข้าห้องพัก Lead
  //   (เจ้าของสั่ง: ข้อมูลยังไม่ครบ ยังไม่ให้แชทเข้าห้องเอง 100% — รอคนติ๊กก่อน · สวิตช์ room_chat_auto ในหน้ากฎ)
  //   ★ 18 ต.ค.69 แชทเข้าห้องเองแล้ว (roomAuto) → แถวนี้ว่าง · เหลือป้าย "อยู่ในห้องพัก" ของแชทที่เคยติ๊กไว้
  // ★ 11 ต.ค.69 ลีดรับซื้อรถ (ลูกค้าอยากขายรถให้เรา) — ไม่จ่ายเบอร์ให้เซลล์ · คัดลอกใบเคสรับซื้อไปโพสต์ในกลุ่มเคสHOT ของจัดซื้อ
  //   ระบบเจอใบในกลุ่ม = "ส่งจัดซื้อแล้ว" ออกจากแท็บรับซื้อรถเอง · เจ้าของ "มันจะมี lead รับซื้อรถกับ lead ขายรถ แยกไว้ด้วย"
  function buyLeadBoxHtml(L, admin) {
    const B = L.buyLead || {}, sys = (B.by || '') === 'ระบบ';
    let x = `<div class="pf-buy"><div class="pf-h" style="margin-bottom:4px">ลีดรับซื้อรถ <span class="pf-auto">ลูกค้าอยากขายรถให้เรา</span></div>

          <button class="btn sm" data-act="nocode" title="ไม่ใช่ลีด (สมัครงาน/ถามเรื่องอื่น) — ออกจากแท็บรับซื้อรถ">ไม่ใช่ลีด</button></div>`;

  function parkRowHtml(L) {
    if (L.park) return `<div class="pf-done">อยู่ในห้องพัก Lead · ติ๊กรับ lead${L.park.by ? ' โดย ' + h(L.park.by) : ''}${L.park.at ? ' ' + h(fmtFull(L.park.at)) : ''}

      <button class="btn pri sm" data-act="park" style="width:100%">${ic('check')} รับ lead จากแชทนี้แล้ว — ส่งเข้าห้องพัก</button></div>`;
  }
  function assignBoxHtml(d, sfx) {
    const ch = d.codeHelp, sg = ch.suggest || {}, r = d.row;
    // ที่แอดมินเลือกค้างไว้ต้องไม่หาย ตอนแผงถูกวาดใหม่ (ข้อความใหม่เข้ามา/ระบบเติมข้อมูลลีด)
    const dr = (S.assignDraft && S.assignDraft.id === r.id) ? S.assignDraft : null;
    const vBase = dr ? dr.base : sg.base, vEmp = dr ? dr.emp : r.ownerId;
    const vAdmin = dr ? dr.admin : sg.admin, vReject = dr ? dr.reject : sg.reject;
