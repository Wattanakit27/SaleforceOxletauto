    pg.innerHTML = `<div class="lc-sec">ภาพรวมวันนี้ <span style="font-weight:400;color:var(--t3)">· ${h(d.dayName)} ${h(fmtDay(d.date))} · อัปเดตสด ไม่ต้องรอประชุมสิ้นเดือน</span></div>
      <div class="lc-tiles">
        <div class="lc-card lc-tile"><div class="lbl">จ่ายเบอร์วันนี้</div><div class="val">${T.tasksToday || 0}</div><div class="note">ใบจ่ายลีดผ่านระบบ + ใบที่แอดมินโพสต์ในห้อง</div></div>
        <div class="lc-card lc-tile"><div class="lbl">รายงานผลแล้ว</div><div class="val" style="color:${repPct == null ? 'var(--t3)' : (repPct >= 80 ? 'var(--green)' : 'var(--amber)')}">${repPct == null ? '–' : repPct + '%'}</div><div class="note">${T.reportedToday || 0} จาก ${T.tasksToday || 0} ใบ · เลยเวลา ${T.lateToday || 0} ใบ</div></div>
        <div class="lc-card lc-tile"><div class="lbl">ตอบแชททันเวลา (ผ่าน Connect)</div><div class="val" style="color:${chatPct == null ? 'var(--t3)' : (chatPct >= 80 ? 'var(--green)' : 'var(--amber)')}">${chatPct == null ? '–' : chatPct + '%'}</div><div class="note">${T.repOk || 0} จาก ${T.repAll || 0} คำตอบวันนี้ · ตอบในแอป LINE OA ไม่นับ</div></div>
        <div class="lc-card lc-tile"><div class="lbl">ปล่อยเดือนนี้</div><div class="val">${T.doneMonth || 0}</div><div class="note">จอง ${T.bookingMonth || 0} · จากชีตยอดขาย</div></div>
      </div>
      <div class="lc-card"><div class="lc-bh"><h2>กรวยเดือนนี้ — จากแชทถึงปล่อยรถ</h2><span class="note">แต่ละแถวบอกที่มาของตัวเลข</span></div>
        <div class="lc-funnel">${F.map((x, i) => `<div class="lc-frow"><span>${h(x.k)}</span><div class="bar"><i style="width:${Math.round(x.v * 100 / fmax)}%"></i></div>
          <span class="fv">${x.v.toLocaleString()}${i && F[i - 1].v ? ` <span style="color:var(--t3);font-weight:600">${Math.round(x.v * 100 / F[i - 1].v)}%</span>` : ''} <span style="color:var(--t3);font-weight:500">· ${h(x.src)}</span></span></div>`).join('')}</div></div>
      <div class="lc-card"><div class="lc-tw"><table class="lc-tbl"><thead><tr><th>เซลล์</th><th>ทีม</th><th class="r">ลีดวันนี้</th><th class="r">รายงานแล้ว</th><th class="r">เลยเวลา</th><th class="r">ตอบแชท (ทัน/ทั้งหมด)</th><th class="r">จองเดือนนี้</th><th class="r">ปล่อยเดือนนี้</th><th>6 วันล่าสุด</th><th class="r">สถานะ</th></tr></thead><tbody>
        ${(d.sellers || []).map(s => { const mx = Math.max(1, ...s.spark); return `<tr><td><span style="display:inline-flex;gap:8px;align-items:center"><span class="lc-av" style="background:${teamColor(s.team)}">${h(initial(s.name))}</span><b>${h(s.name)}</b></span></td>
          <td>${teamTag(s.team)}</td><td class="r">${s.leadsToday}</td><td class="r">${s.reported}</td><td class="r" style="color:${s.late ? 'var(--red)' : 'var(--t3)'}">${s.late}</td>
          <td class="r">${s.replies ? s.repliesOk + '/' + s.replies : '–'}</td><td class="r">${s.booking}</td><td class="r">${s.done}</td>
          <td><span class="lc-spark" title="${h(d.sixDays.join(' · '))}">${s.spark.map(v => `<i style="height:${Math.max(3, Math.round(v * 22 / mx))}px"></i>`).join('')}</span></td>
          <td class="r"><span class="lc-chip${s.status === 'หยุดวันนี้' ? '' : ' ok'}">${h(s.status)}</span></td></tr>`; }).join('')}
      </tbody></table></div></div>
      <div id="lc-stats"></div>`;
    openStats(7);
  }

  // ── กฎและเส้นทาง: สวิตช์ใช้งานได้จริง (บันทึกทันที) + สองเส้นทาง · ตั้งค่าละเอียดอยู่ด้านล่าง ──
  const RULES = [
    { t: 'แอดมินคัดก่อน เซลล์ถึงได้รับ', d: 'ห้องพัก Lead รับเฉพาะลูกค้าที่ให้เบอร์หรือ ID LINE แล้ว (ระบบจับจากแชทให้เอง) + ปุ่ม "ไม่ต้องจ่ายเบอร์" สำหรับคนที่ไม่ใช่ลีดขาย', fixed: true },
    { t: 'ส่งใบจ่ายลีดเข้าห้องจ่ายเบอร์ + แท็ก @เซลล์', d: 'ทุกครั้งที่กดจ่าย ส่งจากบอทตัวส่ง (เลข R เข้าห้อง REJECT) · ปิด = โหมดทดลอง เก็บในระบบอย่างเดียว', src: 'c', k: 'slip_post', out: true },
    { t: 'จ่ายวนตามคิว (อัตโนมัติ)', d: 'ใบร่างในห้องพักที่รอเกินเวลาที่ตั้ง → จ่ายให้คนได้ใบน้อยสุด ข้ามคนหยุด/เต็มมือ · เบอร์ซ้ำไม่จ่ายเอง · แชท LINE/FB ไม่จ่ายเอง', src: 'lf', k: 'auto_assign', out: true },
    { t: 'ดึงคืนเมื่อเลยเวลา', d: 'ไม่รายงานผลภายในเวลาที่ตั้ง หรือกดขอผ่าน → จ่ายใหม่ให้คนถัดไปในคิว เลขเดิม ใบเดิม แท็กคนใหม่', src: 'lf', k: 'auto_pull', out: true },
    { t: 'การ์ดปุ่ม รับเคส / ขอผ่าน ในห้องจ่ายเบอร์', d: 'แนบต่อท้ายใบในข้อความเดียวกัน (ไม่เพิ่มโควต้า) · ปุ่มตอบด้วย reply ฟรี · กดได้เฉพาะคนที่ได้เคส', src: 'lf', k: 'card_on', out: true },
    { t: 'รายงานผล → การ์ดยืนยันแชทส่วนตัว → ลงชีต', d: 'เซลล์พิมพ์ "เลข + ผล" ในห้อง · ถ้ามีข้อมูลจริง (อาชีพ/รายได้/นัด/จอง) ส่งการ์ดให้กดยืนยันก่อนลงชีตลีด', src: 'lf', k: 'report_on', out: true },
    { t: 'เตือนนัดลูกค้า', d: 'นัดที่เซลล์ยืนยันแล้ว → เตือนเข้าแชทส่วนตัวก่อนถึงเวลา', src: 'lf', k: 'remind_on', out: true },
    { t: 'ต้องเช็คชื่อเข้างานก่อนได้ใบ', d: 'คิวจ่ายวนข้ามคนที่ยังไม่เช็คชื่อวันนี้', src: 'lf', k: 'need_checkin' },
    { t: 'เบอร์ซ้ำ → หยุดรอแอดมินยืนยัน', d: 'สมุดเบอร์ (ชีตลีดทั้งปี + ใบในห้อง + ปุ่มจ่ายเบอร์) บอกว่าเคยเป็นลีดของใคร ก่อนกดจ่าย', fixed: true },
    { t: 'แจ้งกลุ่มแอดมินเมื่อแชทรอเกินเวลา', d: 'ต้องเลือกกลุ่มในตั้งค่าละเอียดด้านล่าง · ⚠️ ทีมยังตอบในแอป LINE OA Manager ซึ่ง LINE ไม่ส่งกลับมา — เปิดแล้วจะแจ้งถี่', src: 'c', k: 'alert_on', out: true },
    { t: 'บอกเซลล์ทาง LINE เมื่อลูกค้าทัก', d: 'เจ้าของลูกค้า หรือทั้งทีมที่เวร · ทีมละ ~9 คน = กินโควต้าเร็ว', src: 'c', k: 'notify_sellers', out: true },
    { t: 'รับแชท Facebook เข้า Connect', d: 'คิวเดียวกับ LINE · ตอบ Facebook ตั้งได้ในตั้งค่าละเอียด', src: 'c', k: 'fb_on' },
  ];
  function ruleVal(r) {
    if (r.fixed) return true;
    const C2 = (CFG || {}).cfg || {}, L2 = ((CFG || {}).lf || {}).cfg || {};
    return !!(r.src === 'c' ? C2[r.k] : L2[r.k]);
  }
  function rulesHtml() {
    if (!ADMIN) return '';
    return `<div class="lc-rules">
      <div class="lc-card"><div class="lc-bh"><h2>กติกาการจ่ายลีด</h2><span class="note">กดสวิตช์ = บันทึกทันที · สีเขียว = เปิด</span></div>
        ${RULES.map((r, i) => `<div class="lc-rule"><div class="tx"><div class="tt">${h(r.t)}</div><div class="ds">${h(r.d)}</div></div>
          <button class="lc-sw${ruleVal(r) ? ' on' : ''}${r.fixed ? ' fixed' : ''}" data-rule="${i}" aria-pressed="${ruleVal(r)}" title="${r.fixed ? 'ทำงานตลอด' : 'กดเพื่อเปิด/ปิด'}"></button></div>`).join('')}</div>
      <div>
        <div class="lc-card"><div class="lc-bh"><h2>สองเส้นทางที่ต้องรองรับ</h2></div>
          <div class="lc-lane"><div class="lt"><span class="lc-origin">จากแชท</span> แชทมาก่อน เบอร์มาทีหลัง</div>
            <div class="ld">LINE@ และ Facebook Messenger (คิวเดียวกันใน Connect) — ได้ ID ของแพลตฟอร์มทันทีที่ตอบ แต่ยังไม่มีเบอร์ ไม่ต้องบังคับขอเบอร์ก่อนตอบ ลูกค้าหนี · Instagram ยังต่อไม่ได้ (เพจยังไม่ผูก IG) · TikTok inbox รออนุมัติ API</div>
            <div class="path"><b>แชทเข้า</b>→<b>ได้เบอร์/ID LINE</b>→<b>ห้องพัก Lead</b>→<b>จ่ายเบอร์</b>→<b>ใบเข้าห้อง + @เซลล์</b></div></div>
          <div class="lc-lane"><div class="lt"><span class="lc-origin direct">ใบร่าง/สายเข้า</span> เบอร์มาก่อน ไม่มีแชท</div>
            <div class="ld">ใบร่างที่แอดมินพักไว้ในกลุ่ม ADMIN เก็บ Lead (TikTok · ไลฟ์ · เพจ) และสายที่โทรเข้าเบอร์กลาง — ได้ชื่อกับเบอร์มาเลย แอดมินคัดมาแล้ว ไม่ต้องคัดซ้ำ</div>
            <div class="path"><b>ใบร่าง/สายเข้า</b>→<b>ห้องพัก Lead</b>→<b>จ่ายเบอร์</b>→<b>เซลล์โทร</b></div></div></div>
        <div class="lc-card"><div class="lc-bh"><h2>ลูกค้าคนเดียวหลายร่าง</h2></div>
          <div class="lc-lane"><div class="ld">ทักไลน์ตอนเช้า เย็นกรอกฟอร์มเว็บ อีกวันทักจากไลฟ์ = 3 เลขลีด · <b>ตัวจับคู่ที่เชื่อได้มีแค่เบอร์โทร</b> เพราะ LINE userId กับ Facebook PSID เป็นคนละระบบ —
            ระบบเช็คสมุดเบอร์ทุกครั้งที่จะจ่าย ถ้าเคยมีคนดูแลอยู่จะขึ้นปุ่ม "จ่ายให้เจ้าของเดิม"</div>
            <div class="path"><b>ได้เบอร์ใหม่</b>→<b>เช็คสมุดเบอร์</b>→<b>เจอซ้ำ</b>→<b>จ่ายเจ้าของเดิม</b></div></div></div>
      </div></div>`;
  }
  function bindRules() {
    CPG().querySelectorAll('[data-rule]').forEach(b => b.onclick = async () => {
      const r = RULES[+b.dataset.rule];
      if (!r || r.fixed) return;
      const on = !ruleVal(r);
      if (on && r.out && !confirm(`เปิด "${r.t}" ?\n(เรื่องนี้ส่ง LINE ออก/จ่ายงานแทนคน)`)) return;
      b.disabled = true;
      const res = r.src === 'c' ? await api('/connect/api/config', { [r.k]: on })
                                : await api('/connect/api/leadflow', { action: 'config', [r.k]: on });
      b.disabled = false;
      if (!res.ok) { toast(res.error || 'บันทึกไม่สำเร็จ', 6000); return; }
      toast((on ? 'เปิด ' : 'ปิด ') + r.t + ' แล้ว');
      openCfg();
    });
  }
  function fmtDay(iso) {
    if (!iso) return '';
    const d = new Date(String(iso).slice(0, 10) + 'T12:00:00');
    if (isNaN(d)) return String(iso);
    return d.getDate() + ' ' + TH_MON[d.getMonth()] + ' ' + String(d.getFullYear() + 543).slice(-2);
  }

  // ── ค้นหา / เลือกเซลล์ ──
  let _qT = null;
  $('cn-q').addEventListener('input', () => { clearTimeout(_qT); _qT = setTimeout(() => { S.q = $('cn-q').value.trim(); loadInbox(true); }, 350); });
  $('cn-seller').addEventListener('change', () => { S.seller = +$('cn-seller').value || 0; loadInbox(true); });
  $('cn-src').addEventListener('change', () => { S.src = $('cn-src').value; loadInbox(true); });

  // ── นาฬิกาทุกวินาที (ไม่ยิงเซิร์ฟเวอร์) ──
  setInterval(() => {
    document.querySelectorAll('[data-due]').forEach(el => {
      const ck = clockText(el.dataset.due);
      const t = el.querySelector('.ck'); if (t) t.textContent = ck.text;
      el.classList.toggle('late', ck.cls === 'late'); el.classList.toggle('wait', ck.cls === 'wait');
    });
    document.querySelectorAll('[data-tdue]').forEach(el => {
      const ck = taskClock(el.dataset.tdue);
      const t = el.querySelector('.ck'); if (t) t.textContent = ck.text;
      el.classList.toggle('late', ck.cls === 'late'); el.classList.toggle('wait', ck.cls === 'wait');
    });
  }, 1000);
  // ── รีเฟรช: รายชื่อทุก 8 วิ · แชทที่เปิดอยู่ทุก 6 วิ (หยุดตอนสลับไปแท็บอื่น) ──
  setInterval(() => { if (!document.hidden && (S.pane === 'chat' || S.pane === 'dist')) loadInbox(false); }, 8000);
  setInterval(() => { if (!document.hidden && S.pane === 'chat' && S.chat) openChat(S.chat.row.id, true); }, 6000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadInbox(false); });

  if (S.openId) showPane();
  setPanel(ADMIN && PANEL_PANE[BOOT.panel] && !S.openId ? BOOT.panel : 'inbox', true);
})();
</script>
</body>
</html>
