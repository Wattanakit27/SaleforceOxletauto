        <div class="pf-fld"><div class="pf-lab"><span>ตัวหน้า</span></div><select data-x="base">${bases}</select></div>
        <div class="pf-fld"><div class="pf-lab"><span>จ่ายให้เซลล์</span></div><select data-x="emp"><option value="">— เลือก —</option>${sellers}</select></div>
      </div>
      <label class="ck"><input type="checkbox" data-x="admin"${vAdmin ? ' checked' : ''}> A — ลีดของแอดมิน</label>
      <label class="ck"><input type="checkbox" data-x="reject"${vReject ? ' checked' : ''}> R — เคสรีเจ็ค</label>
      <div style="color:var(--t3);font-size:12px">ระบบแนะนำ <b>${h(sugCode)}</b> — ${h(sg.why || '')}</div>
      <div style="margin:6px 0 2px;color:var(--t3);font-size:12px">เลขที่จะได้:</div>
      <div class="pf-code" data-x="preview"></div>
      ${postNoteHtml(P || { on: false }, P && P.fb ? 'ลูกค้าเป็นของเซลล์ในระบบ (เก็บข้อมูลเท่านั้น)' : 'โอนแชทให้เซลล์ (ตอบลูกค้าผ่าน Connect)')}
      <button class="btn pri" data-act="assign-lead" style="width:100%">${live ? 'จ่ายเบอร์ + ส่งเข้ากลุ่ม' : 'จ่ายเบอร์'}</button>
      <button class="btn sm" data-act="nocode" style="width:100%;margin-top:6px"
        title="ลูกค้าไม่ใช่ลีดขาย (ถามศูนย์บริการ · อยากขายรถให้เรา · ลูกค้าเก่าทักมาขอบคุณ) — เอาออกจากแท็บจ่ายเบอร์">ไม่ต้องจ่ายเบอร์ (ไม่ใช่ลีดขาย)</button>
    </div>`;
  }
  function codePreview(box) {
    const ch = (S.chat || {}).codeHelp; if (!ch || !box) return;
    const q = k => box.querySelector(`[data-x="${k}"]`);
    const pre = (q('reject').checked ? 'R' : '') + (q('admin').checked ? 'A' : '') + q('base').value;
    q('preview').textContent = pre + ch.month + '-' + ch.next;
  }

  // แผงโปรไฟล์ถูกเรียกวาดใหม่ทุก 6 วิ (ตามแชท) — **ห้ามวาดทับตอนกำลังพิมพ์ในฟอร์ม**
  //   และไม่วาดถ้าข้อมูลไม่เปลี่ยน (กันกระพริบ/เลื่อนกลับบนสุด)
  let _profSig = '';
  function paintProfile(force) {
    const d = S.chat; if (!d) return;
    const sig = JSON.stringify([d.row.id, d.profile, d.lead, d.leadEditable, d.row.owner, d.row.team]);
    const act = document.activeElement;
    const typing = act && act.closest && act.closest('#cn-side, #cn-prof-m-body') && /INPUT|TEXTAREA|SELECT/.test(act.tagName);
    if (!force && (sig === _profSig || typing)) return;
    _profSig = sig;
    ['cn-side', 'cn-prof-m-body'].forEach((id, i) => {
      const el = $(id); if (!el) return;
      const top = el.scrollTop;
      el.innerHTML = profileHtml(d, i ? 'm' : 's');
      el.scrollTop = top;
      bindProfile(el);
    });
  }

  function bindProfile(el) {
    el.querySelectorAll('[data-f]').forEach(inp => {
      inp.addEventListener('change', () => {
        if (inp.tagName === 'SELECT') inp.classList.toggle('empty', !inp.value);
        saveLead(inp.dataset.f, inp.type === 'checkbox' ? (inp.checked ? 'ส่งแล้ว' : '') : inp.value, inp);
      });
      if (inp.tagName === 'INPUT' && inp.type !== 'checkbox') {
        inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); inp.blur(); } });
      }
    });
    el.querySelectorAll('[data-phone]').forEach(b => b.onclick = () => saveLead('phone', b.dataset.phone, null, true));
    el.querySelectorAll('[data-tag-del]').forEach(b => b.onclick = () => {
      const L = S.chat.lead; saveLead('tags', (L.tags || []).filter(t => t !== b.dataset.tagDel), null, true);
    });
    const tg = el.querySelector('[data-act=tag]');
    if (tg) tg.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || e.isComposing) return;
      e.preventDefault();
      const t = tg.value.trim(); if (!t) return;
      const L = S.chat.lead; saveLead('tags', (L.tags || []).concat([t]), null, true);
    });
    const nb = el.querySelector('[data-act=name]');
    if (nb) nb.onclick = () => {
      const row = nb.closest('.pf-name-row');
      const cur = (S.chat.lead && S.chat.lead.customer_name) || S.chat.profile.name;
      row.innerHTML = `<input class="pf-name-in" value="${h(cur)}" placeholder="ชื่อลูกค้า">`;
      const ni = row.querySelector('input'); ni.focus(); ni.select();
      let done = false;
      const fin = (save) => { if (done) return; done = true;
        if (save && ni.value.trim() !== cur) saveLead('customer_name', ni.value.trim(), null, true); else paintProfile(true); };
      ni.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) fin(true); if (e.key === 'Escape') fin(false); });
      ni.addEventListener('blur', () => fin(true));
    };
    const box = el.querySelector('[data-box=assign]');
    if (box) {
      box.querySelectorAll('[data-x]').forEach(x => x.addEventListener('change', () => {
        const q = k => box.querySelector(`[data-x="${k}"]`);
        S.assignDraft = { id: S.chat.row.id, base: q('base').value, emp: +(q('emp').value || 0),
                          admin: q('admin').checked, reject: q('reject').checked };
        codePreview(box);
      }));
      codePreview(box);
      box.querySelector('[data-act=assign-lead]').onclick = async (ev) => {
        const q = k => box.querySelector(`[data-x="${k}"]`);
        const emp = +(q('emp').value || 0);
        if (!emp) { toast('เลือกเซลล์ที่จะจ่ายเบอร์ให้ก่อน'); return; }
        const P = (S.chat.codeHelp || {}).post || {};
        if (P.on) {                              // ส่งเข้ากลุ่มจริง = ทั้งห้องเห็น — ถามก่อนทุกครั้ง
          const nm = (S.sellers.find(s => s.id === emp) || {}).name || '';
          const room = q('reject').checked && P.rejectRoom ? P.rejectRoom : P.room;
          if (!confirm(`จ่ายเบอร์ ${q('preview').textContent} ให้ ${nm}\nแล้วส่งใบเข้า "${room || 'กลุ่มจ่ายเบอร์'}" พร้อมแท็ก @${nm} ?`)) return;
        }
        ev.target.disabled = true;
        const id = S.chat.row.id;
        const r = await api('/connect/api/assign_lead', { id, emp, base: q('base').value,
          admin: q('admin').checked, reject: q('reject').checked });
        ev.target.disabled = false;
        toast(r.ok ? r.message : (r.error || 'จ่ายเบอร์ไม่สำเร็จ'), r.post && !r.post.ok ? 9000 : 6000);
        if (r.ok) { S.assignDraft = null; openChat(id, true); loadInbox(false); }
      };
    }
    // "ส่งเข้ากลุ่มอีกครั้ง" — รอบแรกส่งไม่สำเร็จ (การจ่ายในระบบยังอยู่ ไม่ออกเลขใหม่)
    el.querySelectorAll('[data-act=repost]').forEach(b => b.onclick = async () => {
      const id = S.chat.row.id;
      b.disabled = true;
      const r = await api('/connect/api/assign_lead', { id, resend: true });
      b.disabled = false;
      toast(r.ok ? r.message : (r.error || 'ส่งไม่สำเร็จ'), 6000);
      openChat(id, true); loadInbox(false);
    });
    // "ไม่ต้องจ่ายเบอร์" / "เอากลับมาจ่ายเบอร์"
    const skipLead = async (ev, on) => {
      const id = S.chat.row.id;
      ev.target.disabled = true;
      const r = await api('/connect/api/assign_lead', { id, skip: on });
      ev.target.disabled = false;
      toast(r.ok ? r.message : (r.error || 'ทำไม่สำเร็จ'), 3500);
      if (r.ok) { S.assignDraft = null; openChat(id, true); loadInbox(false); }
    };
    el.querySelectorAll('[data-act=nocode]').forEach(b => b.onclick = ev => skipLead(ev, true));
    el.querySelectorAll('[data-act=nocode-undo]').forEach(b => b.onclick = ev => skipLead(ev, false));
    const cp = el.querySelector('[data-act=copy-slip]');
    if (cp) cp.onclick = () => {
      const t = (S.chat.lead || {}).slipText || '';
      try { navigator.clipboard.writeText(t); toast('คัดลอกใบจ่ายลีดแล้ว — วางในกลุ่มจ่ายเบอร์ได้เลย'); } catch (e) { toast('คัดลอกไม่ได้'); }
    };
  }

  // บันทึกทีละช่อง (ไม่ใช่ทั้งฟอร์ม) — 2 คนแก้คนละช่องพร้อมกันไม่ทับกัน
  async function saveLead(field, value, inp, repaint) {
    const d = S.chat; if (!d) return;
    const id = d.row.id;
    const r = await api('/connect/api/lead', { id, field, value });
    if (!S.chat || S.chat.row.id !== id) return;
    if (!r.ok) {
      toast(r.error || 'บันทึกไม่สำเร็จ', 4500);
      if (inp) inp.classList.add('bad');
      return;
    }
    d.lead = r.lead;
    if (inp) {
      inp.classList.remove('bad');
      const box = inp.closest('.pf-fld'); if (box) { box.classList.add('ok'); setTimeout(() => box.classList.remove('ok'), 1500); }
      const b = box && box.querySelector('.pf-auto'); if (b) b.remove();              // คนแก้แล้ว = ไม่ใช่ค่าอัตโนมัติ
      // ช่องเดียวกันอีกฝั่ง (คอลัมน์ขวา/แบบพับบนมือถือ) + ใบจ่ายลีด อัปเดตตาม โดยไม่วาดทั้งแผง (คนอาจกำลังพิมพ์ช่องถัดไป)
      document.querySelectorAll(`[data-f="${field}"]`).forEach(x => {
        if (x === inp) return;
        if (x.type === 'checkbox') x.checked = !!r.lead[field]; else x.value = r.lead[field] || '';
      });
      document.querySelectorAll('.pf-slip-text').forEach(x => { x.textContent = r.lead.slipText || ''; });
      _profSig = JSON.stringify([d.row.id, d.profile, d.lead, d.leadEditable, d.row.owner, d.row.team]);
    }
    if (repaint) paintProfile(true);
    if (field === 'customer_name' || field === 'tags') loadInbox(false);   // ชื่อ/แท็กโชว์ในรายชื่อด้วย
  }

  function paintMsgs(keepScroll) {
    const el = $('cn-msgs'); if (!el) return;
    const d = S.chat;
    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
    let html = '';
    if (d.access === 'preview') {
      html += `<div class="cn-lock">เห็นเฉพาะข้อความที่ลูกค้าเพิ่งส่ง — กด "รับลูกค้าคนนี้" ก่อน ถึงจะเห็นแชทย้อนหลังและตอบได้</div>`;
    }
    if (!(d.messages || []).length) html += `<div class="cn-blank">ยังไม่มีข้อความ</div>`;
    let lastDay = '';
    (d.messages || []).forEach(m => {
      const dt = m.at ? new Date(m.at) : null;
      const day = dt ? dt.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
      if (day && day !== lastDay) { html += `<div class="cn-day">${h(day)}</div>`; lastDay = day; }
      const t = dt ? pad(dt.getHours()) + ':' + pad(dt.getMinutes()) : '';
      const out = m.dir === 'out';
      html += `<div class="bub ${out ? 'out' : 'in'}${m.media ? ' media' : ''}">${h(m.text)}${m.media ? '<br><small>(รูป/ไฟล์ยังเปิดในระบบไม่ได้)</small>' : ''}<div class="meta">${out && m.by ? h(m.by) + ' · ' : ''}${t}</div></div>`;
    });
    el.innerHTML = html;
    if (!keepScroll || atBottom) el.scrollTop = el.scrollHeight;
  }

  // ลูกค้าจำลอง: ให้คนทดสอบพิมพ์แทนลูกค้าได้ (ทดสอบรอบรอ 5 นาที / ข้อความใหม่จากลูกค้าของฉัน)
  function paintSim() {
    const w = $('cn-sim-wrap'); if (!w) return;
    const d = S.chat;
    if (!(BOOT.test && d && d.row.sim)) { w.innerHTML = ''; return; }
    w.innerHTML = `<div class="cn-sim">🧪 <b class="hide-sm">พิมพ์แทนลูกค้า</b>
      <input id="cn-sim-text" placeholder="เช่น ยังว่างไหมครับ ผ่อนเดือนละเท่าไหร่" autocomplete="off">
      <button class="btn sm" id="cn-sim-send" title="ส่งข้อความนี้ในฐานะลูกค้าจำลอง">ส่งแทนลูกค้า</button></div>`;
    const go = async () => {
      const t = $('cn-sim-text'); const text = (t.value || '').trim(); if (!text) return;
      const r = await api('/connect/api/test', { action: 'say', id: d.row.id, text });
      if (!r.ok) { toast(r.error || 'ส่งไม่สำเร็จ'); return; }
      t.value = ''; openChat(d.row.id, true); loadInbox(false);
    };
    $('cn-sim-send').onclick = go;
    $('cn-sim-text').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); go(); } });
  }

  async function testAct(action, extra) {
    const body = Object.assign({ action }, extra || {});
    if (action === 'clear' && !confirm('ล้างข้อมูลทดสอบทั้งหมด? (ลูกค้าจำลอง + บัญชีเซลล์จำลอง · ลูกค้าจริงที่บัญชีจำลองรับไว้จะกลับเข้าคิว)')) return;
    const r = await api('/connect/api/test', body);
    if (!r.ok) { toast(r.error || 'ทำไม่สำเร็จ', 4500); return; }
    toast(r.message || 'เรียบร้อย');
    if (action === 'as' || action === 'exit' || action === 'clear') {
      setTimeout(() => location.reload(), 500);       // สลับตัวตน = โหลดหน้าใหม่ทั้งหน้า (สิทธิ์เปลี่ยน)
    } else {
      loadInbox(false);
      if (S.pane === 'cfg') openCfg();
    }
  }

  function paintComposer(fresh) {
    const w = $('cn-comp-wrap'); if (!w) return;
    const d = S.chat;
    let why = '';
    if (!d.canReply) why = d.access === 'preview' ? 'กด "รับลูกค้าคนนี้" ก่อนถึงจะตอบได้' : 'ตอบได้เฉพาะเจ้าของลูกค้าและแอดมิน';
    else if (!d.replyOn) why = d.replyWhy || ('ยังล็อกการส่งข้อความหาลูกค้าอยู่ (ช่วงทดสอบ) — ' + (ADMIN ? 'เปิดด้วยคำสั่ง manage.py checkout_config --reply on' : 'รอแอดมินเปิดระบบ'));
    // ลูกค้า Facebook ช่วงทดสอบ: แอดมินกำหนดแชทที่ใช้ทดสอบการตอบได้ (แชทของคนในบริษัท ไม่ใช่ลูกค้าจริง)
    const ft = (ADMIN && d.fbTest && d.fbTest.mode === 'test') ? (d.fbTest.on ? 'on' : 'off') : '';
    const ftHtml = ft ? `<div class="cn-comp-why" style="padding:6px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span>${ft === 'on' ? 'แชทนี้เป็น "แชททดสอบ" การตอบ Facebook' : 'ทดสอบการตอบ Facebook กับแชทของคนในบริษัทก่อน (เช่นทักเพจจาก FB ตัวเอง)'}</span>
        <button class="btn sm" id="cn-fbtest">${ft === 'on' ? 'ยกเลิกแชททดสอบ' : 'ใช้แชทนี้ทดสอบการตอบ'}</button></div>` : '';
    const want = (why ? 'why:' + why : 'comp') + '|' + ft;
    if (!fresh && w.dataset.k === want) return;          // ไม่วาดซ้ำ = ข้อความที่กำลังพิมพ์ไม่หาย
    w.dataset.k = want;
    const bindFt = () => {
      const b = $('cn-fbtest'); if (!b) return;
      b.onclick = async () => {
        const id = d.row.id;
        b.disabled = true;
        const r = await api('/connect/api/fb_test', { id, on: ft !== 'on' });
        b.disabled = false;
        toast(r.ok ? r.message : (r.error || 'ทำไม่สำเร็จ'));
        if (r.ok) openChat(id, true);
      };
    };
    if (why) { w.innerHTML = `<div class="cn-comp-why">${h(why)}</div>` + ftHtml; bindFt(); return; }
    // มือถือ: Enter = ขึ้นบรรทัด (กดปุ่มส่งเอา) — คำอธิบาย Enter/Shift+Enter มีแค่บนคอม
    const coarse = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
    w.innerHTML = `<div class="cn-err" id="cn-err"></div>
      <div class="cn-comp"><textarea id="cn-text" rows="1" placeholder="${coarse ? 'พิมพ์ข้อความถึงลูกค้า…' : 'พิมพ์ข้อความถึงลูกค้า… (Enter = ส่ง · Shift+Enter = ขึ้นบรรทัด)'}"></textarea>
      <button class="btn pri" id="cn-send">${ic('send')} ส่ง</button></div>` + ftHtml;
    bindFt();
    const ta = $('cn-text');
    ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(160, ta.scrollHeight) + 'px'; });
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && !coarse && !e.isComposing) { e.preventDefault(); send(); }
    });
    $('cn-send').onclick = send;
  }

  async function send() {
    const ta = $('cn-text'); if (!ta || !S.chat) return;
    const text = ta.value.trim(); if (!text) return;
    if (BOOT.test && BOOT.test.as && !S.chat.row.sim
        && !confirm('ลูกค้าคนนี้เป็น "ลูกค้าจริง" — ข้อความจะถึงเขาจริงในนาม ' + ME.name + ' ส่งไหม?')) return;
    const btn = $('cn-send'); btn.disabled = true; $('cn-err').textContent = '';
    const id = S.chat.row.id;
    const d = await api('/connect/api/reply', { id, text });
    btn.disabled = false;
    if (!d.ok) { $('cn-err').textContent = d.error || 'ส่งไม่สำเร็จ'; return; }   // คงข้อความไว้ ไม่ต้องพิมพ์ใหม่
    ta.value = ''; ta.style.height = 'auto';
    if (S.chat && S.chat.row.id === id) {
      S.chat.messages.push(d.message);
      S.chat.row.awaiting = false;
      paintHeader(); paintMsgs(false);
    }
    loadInbox(false);
  }

  async function claim(id) {
    const d = await api('/connect/api/claim', { id });
    if (!d.ok) { toast(d.error || 'รับลูกค้าไม่สำเร็จ', 4500); loadInbox(false); return; }
    toast(d.message || 'รับลูกค้าแล้ว');
    S.chat = null;
    if (!ADMIN) S.view = 'mine';
    await loadInbox(false);
    openChat(id);
  }
  async function dismiss(id) {
    const d = await api('/connect/api/dismiss', { id });
    toast(d.ok ? d.message : (d.error || 'ทำไม่สำเร็จ'));
    if (d.ok) { openChat(id, true); loadInbox(false); }
  }
  async function assign(id, emp, release) {
    if (!release && !emp) { toast('เลือกเซลล์ที่จะโอนให้ก่อน'); return; }
    if (release && !confirm('ปล่อยลูกค้าคนนี้คืนคิว? เซลล์ทีมที่เวรวันนี้จะกดรับได้')) return;
    const d = await api('/connect/api/assign', { id, emp: release ? 0 : emp });
    toast(d.ok ? d.message : (d.error || 'โอนไม่สำเร็จ'));
    if (d.ok) { openChat(id, true); loadInbox(false); }
  }

  window.__cnBack = () => {
    hidePane();
    if (S.pane !== 'chat') { S.pane = 'chat'; renderTabs(); }
    S.openId = 0; S.chat = null;
    document.querySelectorAll('.cn-row.sel').forEach(r => r.classList.remove('sel'));
    try { history.replaceState(null, '', '/connect/' + (BOOT.embed ? '?embed=1' : '')); } catch (e) {}
    renderBlank();
    applyHub();
    // กลับมาที่บอร์ดห้องพัก Lead — โหลดใหม่เลย ลีดที่เพิ่งจ่ายเบอร์ในแชทจะได้หายจากบอร์ดทันที (ไม่ต้องรอรอบ 8 วิ)
    if (ADMIN && S.view === 'tocode') loadInbox(false);
  };

  // ── สถิติ (แอดมิน) ──
  async function openStats(days) {
    days = days || 7;
    S.chat = null; S.openId = 0;
    $('cn-pane').innerHTML = `<div class="cn-page"><div class="cn-empty"><div class="spin"></div>กำลังคำนวณ…</div></div>`;
    const d = await api('/connect/api/stats?days=' + days);
    if (S.pane !== 'stats') return;
    if (!d.ok) { $('cn-pane').innerHTML = `<div class="cn-blank" style="color:var(--red)">${h(d.error || 'โหลดไม่สำเร็จ')}</div>`; return; }
    const rows = d.rows || [];
    $('cn-pane').innerHTML = `<div class="cn-page">
      <div style="margin-bottom:10px"><button class="btn sm cn-mback" onclick="window.__cnBack()">${ic('arrow-left')} กลับ</button></div>
      <div class="card">
        <h3>เวลาตอบลูกค้า รายคน</h3>
        <div class="d">นับเฉพาะ "คำตอบที่ปิดรอบรอ" (ลูกค้าส่งมา → เราตอบ) · ทันเวลา = ตอบภายใน ${d.slaMin} นาที (นับเฉพาะเวลาทำการ) · รอ = ค่ากลาง (มัธยฐาน)</div>
        <div style="display:flex;gap:6px;margin-bottom:10px">${[7, 30].map(n => `<button class="btn sm${n === days ? ' pri' : ''}" data-d="${n}">${n} วันล่าสุด</button>`).join('')}</div>
        ${rows.length ? `<div style="overflow-x:auto"><table class="st"><thead><tr><th>คนตอบ</th><th>ทีม</th><th>รับลูกค้า</th><th>ตอบ</th><th>ทันเวลา</th><th>ลูกค้ารอ (นาที)</th><th>เลยเวลา</th></tr></thead><tbody>
          ${rows.map(r => `<tr><td><b>${h(r.name)}</b></td><td>${r.team ? teamTag(r.team) : '–'}</td><td>${r.claims}</td><td>${r.replies}</td>
            <td style="color:${r.onTimePct == null ? 'var(--t3)' : (r.onTimePct >= 80 ? 'var(--green)' : (r.onTimePct >= 50 ? 'var(--amber)' : 'var(--red)'))}">${r.onTimePct == null ? '–' : r.onTimePct + '%'}</td>
            <td>${r.medianMin == null ? '–' : r.medianMin}</td><td style="color:${r.late ? 'var(--red)' : 'var(--t3)'}">${r.late}</td></tr>`).join('')}
        </tbody></table></div>` : `<div class="cn-empty">ยังไม่มีข้อมูลในช่วงนี้ — ตัวเลขจะขึ้นเมื่อเริ่มรับ/ตอบลูกค้าผ่าน Connect</div>`}
        ${d.unownedLate ? `<div class="d" style="margin-top:10px;color:var(--red)">ลูกค้าที่ <b>ไม่มีเซลล์รับ</b> จนเลยเวลา: ${d.unownedLate} ครั้ง</div>` : ''}
      </div></div>`;
    $('cn-pane').querySelectorAll('[data-d]').forEach(b => b.onclick = () => openStats(+b.dataset.d));
  }

  // ── ตั้งค่า (แอดมิน) — เวร · เส้นตาย · แจ้งเตือน ──
  let CFG = null;
  async function openCfg() {
    S.chat = null; S.openId = 0;
    $('cn-pane').innerHTML = `<div class="cn-page"><div class="cn-empty"><div class="spin"></div>กำลังโหลด…</div></div>`;
    const [d, t] = await Promise.all([api('/connect/api/config'), api('/connect/api/test')]);
    if (S.pane !== 'cfg') return;
    if (!d.ok) { $('cn-pane').innerHTML = `<div class="cn-blank" style="color:var(--red)">${h(d.error || 'โหลดไม่สำเร็จ')}</div>`; return; }
    CFG = d; CFG.test = (t && t.ok) ? t : null; paintCfg();
  }
  function _computed(dateIso) {      // ทีมตามสูตรวันเว้นวัน (ไม่นับการสลับเวร) — ใช้ตอนกดสลับในตาราง
    const c = CFG.cfg, teams = c.teams;
    const a = new Date(c.anchor_date + 'T00:00:00'), x = new Date(dateIso + 'T00:00:00');
    const days = Math.round((x - a) / 86400000);
    const base = Math.max(0, teams.indexOf(c.anchor_team));
    return teams[(((base + days) % teams.length) + teams.length) % teams.length];
  }
  function paintCfg(msg, isErr) {
    const d = CFG, c = d.cfg;
    const todayIso = d.roster.length ? d.roster[0].date : '';
    const ros = d.roster.map(x => {
      const dt = new Date(x.date + 'T00:00:00');
      const team = (c.overrides || {})[x.date] || _computed(x.date);
      return `<button data-day="${x.date}" class="${x.date === todayIso ? 'td' : ''}" title="กดเพื่อสลับเวรเฉพาะวันนี้">
        <span style="color:var(--t3);font-size:12px">${dt.toLocaleDateString('th-TH', { weekday: 'short' })} ${dt.getDate()}</span>
        <b style="color:${TEAM_C[team] || 'var(--t1)'}">${h(team)}</b>${(c.overrides || {})[x.date] ? '<span class="ov"></span>' : ''}</button>`;
    }).join('');
    const teamBoxes = d.teamsAvail.map(t => `<label style="display:inline-flex;gap:5px;align-items:center;margin-right:12px"><input type="checkbox" data-team="${h(t)}"${c.teams.includes(t) ? ' checked' : ''}> ทีม ${h(t)}</label>`).join('');
    const grpOpts = `<option value="">— เลือกกลุ่ม —</option>` + d.groups.map(g => `<option value="${h(g.id)}"${g.id === c.alert_group ? ' selected' : ''}>${h(g.name || g.id)}</option>`).join('')
      + (c.alert_group && !d.groups.some(g => g.id === c.alert_group) ? `<option value="${h(c.alert_group)}" selected>${h(c.alert_group)} (ไม่อยู่ในรายชื่อ)</option>` : '');
    $('cn-pane').innerHTML = `<div class="cn-page">
      <div style="margin-bottom:10px"><button class="btn sm cn-mback" onclick="window.__cnBack()">${ic('arrow-left')} กลับ</button></div>
      ${(d.status || []).map(s => `<div class="card" style="border-color:var(--${s.level === 'err' ? 'red' : 'amber'})"><b>${h(s.text)}</b>${s.fix ? `<div class="d" style="margin:6px 0 0">เปิดด้วยคำสั่งบนเซิร์ฟเวอร์: <code>${h(s.fix)}</code></div>` : ''}</div>`).join('')}
      <div class="card">
        <h3>เวรรับลูกค้าใหม่ (วันเว้นวัน)</h3>
        <div class="d">ทีมที่เวร = กดรับลูกค้าใหม่ได้วันนั้น · ลูกค้าที่มีเจ้าของแล้วคุยกับเจ้าของเดิมได้ทุกวัน · ตัดวันตอนเที่ยงคืน<br>กดวันในตารางเพื่อสลับเวรเฉพาะวันนั้น (จุดส้ม = สลับเวร)</div>
        <div class="fld"><label>ทีมที่ผลัดเวร</label><div>${teamBoxes}</div></div>
        <div class="fld"><label>วันนี้เป็นเวรของ</label>
          <select id="cf-today">${c.teams.map(t => `<option value="${h(t)}"${t === _computed(todayIso) ? ' selected' : ''}>ทีม ${h(t)}</option>`).join('')}</select>
          <span style="color:var(--t3)">(วันต่อไปสลับให้เอง)</span></div>
        <div class="ros" id="cf-ros">${ros}</div>
      </div>
      <div class="card">
        <h3>เส้นตายการตอบ</h3>
        <div class="d">ลูกค้าทักแล้วไม่มีใครตอบภายในเวลานี้ = ขึ้น "เลยเวลา" ให้แอดมิน · ทักนอกเวลาทำการ = เริ่มนับตอนเปิด</div>
        <div class="fld"><label>ต้องตอบภายใน</label><input id="cf-sla" type="number" min="1" max="120" value="${c.sla_min}" style="width:90px"> นาที</div>
        <div class="fld"><label>เวลาทำการ</label><input id="cf-open" type="time" value="${h(c.open)}"> ถึง <input id="cf-close" type="time" value="${h(c.close)}"><span style="color:var(--t3)">(ตั้งเท่ากัน = นับ 24 ชม.)</span></div>
      </div>
      <div class="card">
        <h3>แจ้งเตือนทาง LINE</h3>
        <div class="d">ในหน้า Connect ขึ้นเตือนเสมออยู่แล้ว — ข้างล่างนี้คือ "ส่ง LINE เพิ่ม" (ปิดไว้ก่อน · push นับโควต้าข้อความของ LINE OA)</div>
        <div class="fld"><label><input type="checkbox" id="cf-alert"${c.alert_on ? ' checked' : ''}> ส่งเข้ากลุ่มแอดมินเมื่อลูกค้ารอเกินเวลา</label><select id="cf-group">${grpOpts}</select></div>
        <div class="fld"><label><input type="checkbox" id="cf-notify"${c.notify_sellers ? ' checked' : ''}> บอกเซลล์ทาง LINE เมื่อลูกค้าทักมา</label>
          <span style="color:var(--t3)">เจ้าของลูกค้า หรือทุกคนในทีมที่เวร (ถ้ายังไม่มีเจ้าของ) · ทีมละ ~9 คน = กินโควต้าเร็ว</span></div>
      </div>
      ${slipCardHtml(c)}
      ${fbCardHtml(c)}
      ${testCardHtml()}
      <div style="display:flex;gap:10px;align-items:center;max-width:920px">
        <button class="btn pri" id="cf-save">บันทึก</button>
        <span id="cf-msg" style="color:${isErr ? 'var(--red)' : 'var(--green)'}">${h(msg || '')}</span>
      </div>
    </div>`;
    $('cf-ros').querySelectorAll('[data-day]').forEach(b => b.onclick = () => {
      const day = b.dataset.day, teams = c.teams;
      const cur = (c.overrides || {})[day] || _computed(day);
      const nxt = teams[(teams.indexOf(cur) + 1) % teams.length];
      c.overrides = Object.assign({}, c.overrides);
      if (nxt === _computed(day)) delete c.overrides[day]; else c.overrides[day] = nxt;
      paintCfg('ยังไม่ได้บันทึก', false);
    });
    $('cf-today').onchange = () => {
      c.anchor_date = todayIso; c.anchor_team = $('cf-today').value;
      const ov = Object.assign({}, c.overrides); delete ov[todayIso]; c.overrides = ov;
      paintCfg('ยังไม่ได้บันทึก', false);
    };
    $('cf-save').onclick = saveCfg;
    const fbMsg = t => { const e = $('cf-fbsub-msg'); if (e) e.innerHTML = t; };
    if ($('cf-fbsub')) $('cf-fbsub').onclick = async () => {
      fbMsg('กำลังผูก…');
      const r = await api('/connect/api/fb_webhook', {});
      fbMsg(r.ok ? '<span style="color:var(--green)">ผูกแล้วทุกเพจ</span>'
        : `<span style="color:var(--red)">${h(r.error || 'ไม่สำเร็จ')} ${h(JSON.stringify(r.result || {}))}</span>`);
    };
    if ($('cf-fbchk')) $('cf-fbchk').onclick = async () => {
      fbMsg('กำลังตรวจ…');
      const r = await api('/connect/api/fb_webhook');
      fbMsg(r.ok ? (r.pages || []).map(x => `${h(x.name)}: ${x.subscribed ? '<b style="color:var(--green)">ผูกแล้ว</b> (' + h((x.fields || []).join(', ')) + ')'
        : x.subscribed === false ? '<b style="color:var(--red)">ยังไม่ผูก</b>' : h(x.error || 'ตรวจไม่ได้')}`).join(' · ')
        : `<span style="color:var(--red)">${h(r.error || 'ตรวจไม่ได้')}</span>`);
    };
    $('cn-pane').querySelectorAll('[data-test]').forEach(x => x.onclick = () => testAct(x.dataset.test, { team: x.dataset.team }));
  }
  // ── ปุ่ม "จ่ายเบอร์" ส่งใบเข้ากลุ่มจ่ายเบอร์จริง (6 ต.ค.69 · เจ้าของ: "กลุ่มจ่ายเบอร์อยากให้มันต่อจริงๆ ส่งจริงๆ") ──
  //   ห้องปลายทาง: ว่าง = ระบบหาเองจากชื่อกลุ่ม · ตัวเลือก = เฉพาะกลุ่มจ่ายเบอร์ที่บอทตัวส่งอยู่ (เลือกห้องอื่นไปก็ส่งไม่ออก)
  function slipCardHtml(c) {
    const SL = CFG.slip || {}, R = SL.rooms || {}, cand = SL.candidates || [];
    const sel = (id, key) => {
      const auto = (R[key] || {}).auto ? (R[key] || {}).name : '';
      const opts = cand.map(g => `<option value="${h(g.id)}"${c[id] === g.id ? ' selected' : ''}>${h(g.name || g.id)}</option>`).join('')
        + (c[id] && !cand.some(g => g.id === c[id]) ? `<option value="${h(c[id])}" selected>${h(c[id])} (ไม่อยู่ในรายชื่อ)</option>` : '');
      return `<select id="cf-${id}"><option value="">อัตโนมัติ${auto ? ' — ' + h(auto) : ' (ยังหาไม่เจอ)'}</option>${opts}</select>`;
    };
    return `<div class="card">
      <h3>ส่งใบจ่ายลีดเข้ากลุ่มจ่ายเบอร์</h3>
      <div class="d">ปุ่ม "จ่ายเบอร์" ในห้องพัก Lead / แผงข้อมูลลูกค้า: ออกเลข → ให้สิทธิ์เซลล์ในระบบ → <b>ส่งใบเข้ากลุ่มจ่ายเบอร์ + แท็ก @เซลล์</b> (บอทตัวส่ง · ไม่ลงชีต)
        <br>· ลูกค้า LINE = โอนแชทให้เซลล์ ตอบผ่าน Connect · ลูกค้า Facebook = เซลล์ได้สิทธิ์เก็บข้อมูลเท่านั้น (ตอบแชทไม่ได้)
        · ลีดภายนอก (TikTok ฯลฯ) = จดว่าจ่ายให้ใคร
        <br>· แท็กไม่ได้ (เซลล์ไม่อยู่ในกลุ่ม/ยังไม่เคยพิมพ์ในกลุ่มที่บอทอยู่) = พิมพ์ @ชื่อเล่น แทน ใบยังถึงกลุ่ม
        · ส่งไม่สำเร็จ = การจ่ายในระบบยังอยู่ กด "ส่งเข้ากลุ่มอีกครั้ง" ได้</div>
      <div class="fld"><label><input type="checkbox" id="cf-slip"${c.slip_post ? ' checked' : ''}> ส่งเข้ากลุ่มจริง</label>
        <span style="color:var(--t3)">ไม่ติ๊ก = โหมดทดลอง (เก็บในระบบอย่างเดียว)</span></div>
      <div class="fld"><label>เลขปกติ ส่งเข้า</label>${sel('slip_group', 'main')}</div>
      <div class="fld"><label>เลขขึ้นต้น R (รีเจ็ค) ส่งเข้า</label>${sel('slip_group_reject', 'reject')}</div>
    </div>`;
  }
  // ── Facebook Messenger (4 ต.ค.69 · รวมคิวเดียวกับ LINE) ──
  function fbCardHtml(c) {
    const F = CFG.fb || {}, L = F.last || {};
    const pages = (F.pages || []).map(x => h(x.name)).join(' · ') || '(ยังไม่ได้ตั้ง META_PAGE_IDS)';
    let st = 'ยังไม่เคยดึง';
    if (L.at) {
      const when = fmtWhen(L.at);
      st = L.error ? `<span style="color:var(--red)">ดึงล่าสุด ${h(when)} ไม่สำเร็จ: ${h(L.error)}</span>`
        : L.skipped ? `ดึงล่าสุด ${h(when)} — ข้าม: ${h(L.skipped)}`
        : `ดึงล่าสุด ${h(when)} · ห้องที่มีข้อความใหม่ ${L.threads || 0} · ข้อความใหม่ ${L.newMsgs || 0}`
          + ((L.errors || []).length ? ` · <span style="color:var(--red)">${h(L.errors.join(' · '))}</span>` : '');
    }
    const nTest = (c.fb_test_rows || []).length;
    const W = F.webhook || {}, WL = W.last || {};
    const okc = b => b ? '<b style="color:var(--green)">ตั้งแล้ว</b>' : '<b style="color:var(--red)">ยังไม่ได้ตั้ง</b>';
    let wst = 'Facebook ยังไม่เคยส่งมา';
    if (WL.at) {
      wst = WL.rejected ? `<span style="color:var(--red)">ส่งมาล่าสุด ${h(fmtWhen(WL.at))} แต่ไม่รับ: ${h(WL.rejected)}</span>`
        : `ส่งมาล่าสุด ${h(fmtWhen(WL.at))} · ข้อความใหม่ ${WL.saved || 0}${WL.error ? ` · <span style="color:var(--red)">${h(WL.error)}</span>` : ''}`;
    }
    const pollOpt = [2, 5, 10, 15, 30, 60].map(n => `<option value="${n}"${c.fb_poll_min === n ? ' selected' : ''}>ทุก ${n} นาที</option>`).join('');
    const opt = (v, t) => `<option value="${v}"${c.fb_reply === v ? ' selected' : ''}>${t}</option>`;
    return `<div class="card">
      <h3>Facebook Messenger</h3>
      <div class="d">แชทจากเพจ ${pages} เข้า Connect — คิวเดียวกับ LINE (รับลูกค้า · นับ ${c.sla_min} นาที · โอน · จ่ายเบอร์)
        · ตอบในแอป Facebook / Business Suite ก็หยุดนาฬิกาให้ (Facebook ส่งข้อความขาออกมาด้วย)
        · Facebook ให้ตอบได้ภายใน 24 ชม. นับจากข้อความล่าสุดของลูกค้า</div>
      <div class="fld"><label><input type="checkbox" id="cf-fb"${c.fb_on ? ' checked' : ''}> รับแชท Facebook เข้า Connect</label></div>
      <div class="d" style="margin:8px 0 4px"><b>ทางหลัก — Facebook ส่งมาเองทันที (webhook)</b> · ไม่ใช้โควต้า API
        <br>Callback URL: <code>${h(W.url || '')}</code> · Verify token: ${okc(W.verifySet)} · App Secret: ${okc(W.secretSet)}
        <br>${wst}</div>
      <div class="fld"><button class="btn sm" id="cf-fbsub">ผูกเพจกับแอป (รับแชทผ่าน webhook)</button>
        <button class="btn sm" id="cf-fbchk">ตรวจว่าเพจผูกแล้วหรือยัง</button><span id="cf-fbsub-msg" style="color:var(--t3)"></span></div>
      <div class="fld"><label>ทางสำรอง — ดึงจาก API</label><select id="cf-fbpoll">${pollOpt}</select>
        <span style="color:var(--t3)">${st}</span></div>
      <div class="fld"><label>ตอบลูกค้า Facebook จาก Connect</label>
        <select id="cf-fbreply">${opt('off', 'ปิด — ตอบใน Facebook เอง')}${opt('test', 'ทดสอบ — เฉพาะแชททดสอบ (' + nTest + ' แชท)')}${opt('on', 'เปิด — ทุกแชท')}</select></div>
      ${c.fb_reply === 'test' ? `<div class="d" style="margin:0">ทดสอบ: ทักเพจจาก Facebook ของคุณเอง → เปิดแชทนั้นใน Connect → กด "ใช้แชทนี้ทดสอบการตอบ" ใต้ช่องพิมพ์ → ลองตอบ · ใช้ได้แล้วค่อยเปลี่ยนเป็น "เปิด"</div>` : ''}
    </div>`;
  }

  function testCardHtml() {
    const t = CFG.test; if (!t) return '';
    const c = t.counts || {};
    return `<div class="card">
      <h3>🧪 ทดสอบระบบด้วยบัญชีจำลอง</h3>
      <div class="d">สลับไปใช้หน้าจอแบบเซลล์ได้ทันที โดยไม่ต้องใช้บัญชีเซลล์จริง · กดรับ/ตอบในโหมดนี้เป็นชื่อ "ทดสอบเซลล์"
        · <b>ลูกค้าจำลอง</b> ไม่มีตัวตนใน LINE ตอบไปไม่ออกนอกระบบ และนับ 5 นาทีทันทีทุกเวลา (ทดสอบกลางคืนได้)
        · ถ้าบัญชีจำลองไปรับ/ตอบ "ลูกค้าจริง" ข้อความจะถึงลูกค้าจริง (ระบบถามยืนยันก่อนส่งทุกครั้ง)</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${(t.teams || []).map(tm => `<button class="btn pri" data-test="as" data-team="${h(tm)}">ใช้หน้าจอแบบ ทดสอบเซลล์ ${h(tm)}</button>`).join('')}
        <button class="btn" data-test="customer">+ ลูกค้าจำลองทักเข้ามา</button>
        <button class="btn red" data-test="clear"${(c.customers || c.sellers) ? '' : ' disabled'}>ล้างข้อมูลทดสอบ (ลูกค้าจำลอง ${c.customers || 0} · บัญชีจำลอง ${c.sellers || 0})</button>
      </div>
      ${c.realHeld ? `<div class="d" style="margin:8px 0 0;color:var(--red)">บัญชีจำลองถือ "ลูกค้าจริง" อยู่ ${c.realHeld} คน — กดล้างเพื่อคืนเข้าคิว</div>` : ''}
    </div>`;
  }
  async function saveCfg() {
    const c = CFG.cfg;
    const teams = Array.from(document.querySelectorAll('[data-team]')).filter(x => x.checked).map(x => x.dataset.team);
    const body = {
      teams, anchor_date: c.anchor_date, anchor_team: teams.includes(c.anchor_team) ? c.anchor_team : (teams[0] || ''),
      overrides: c.overrides || {}, sla_min: $('cf-sla').value, open: $('cf-open').value, close: $('cf-close').value,
      alert_on: $('cf-alert').checked, alert_group: $('cf-group').value, notify_sellers: $('cf-notify').checked,
      fb_on: $('cf-fb').checked, fb_reply: $('cf-fbreply').value, fb_poll_min: +$('cf-fbpoll').value,
      slip_post: $('cf-slip').checked, slip_group: $('cf-slip_group').value, slip_group_reject: $('cf-slip_group_reject').value,
    };
    $('cf-save').disabled = true;
    const d = await api('/connect/api/config', body);
    if (!d.ok) { $('cf-save').disabled = false; $('cf-msg').style.color = 'var(--red)'; $('cf-msg').textContent = d.error || 'บันทึกไม่สำเร็จ'; return; }
    CFG = d; paintCfg('บันทึกแล้ว', false);
    loadInbox(false);
  }

  // ── ค้นหา / เลือกเซลล์ ──
  let _qT = null;
  $('cn-q').addEventListener('input', () => { clearTimeout(_qT); _qT = setTimeout(() => { S.q = $('cn-q').value.trim(); loadInbox(true); }, 350); });
  $('cn-seller').addEventListener('change', () => { S.seller = +$('cn-seller').value || 0; loadInbox(true); });
  $('cn-src').addEventListener('change', () => { S.src = $('cn-src').value; loadInbox(true); });

  // ── นาฬิกาทุกวินาที (ไม่ยิงเซิร์ฟเวอร์) ──
  setInterval(() => {
    document.querySelectorAll('[data-due]').forEach(el => {
      const ck = clockText(el.dataset.due);
      const t = el.querySelector('.ck'); if (t) t.textContent = ck.text;
      el.classList.toggle('late', ck.cls === 'late'); el.classList.toggle('wait', ck.cls === 'wait');
    });
  }, 1000);
  // ── รีเฟรช: รายชื่อทุก 8 วิ · แชทที่เปิดอยู่ทุก 6 วิ (หยุดตอนสลับไปแท็บอื่น) ──
  setInterval(() => { if (!document.hidden && S.pane === 'chat') loadInbox(false); }, 8000);
  setInterval(() => { if (!document.hidden && S.pane === 'chat' && S.chat) openChat(S.chat.row.id, true); }, 6000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadInbox(false); });

  if (S.openId) showPane();
  loadInbox(true);
})();
</script>
</body>
</html>
