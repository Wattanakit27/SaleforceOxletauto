{% load static %}<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect · Oxlet</title>
<link rel="icon" type="image/png" href="{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'dashboard/css/globals.css' %}?v=20260920b">
<script>
  // ธีมเดียวกับแดชบอร์ด (คีย์ oxlet_theme) — ตั้งก่อน paint กันจอกระพริบ
  (function(){
    try {
      var t = localStorage.getItem('oxlet_theme');
      if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e) { document.documentElement.setAttribute('data-theme','light'); }
  })();
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Noto Sans Thai', sans-serif; background: var(--bg2); color: var(--t1);
         font-size: var(--fs-body); overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .ic { width: 16px; height: 16px; flex-shrink: 0; vertical-align: -3px; }

  /* ── หัวหน้า ── */
  html { --th: 50px; }
  html.embed { --th: 44px; }
  .cn-top { height: var(--th); display: flex; align-items: center; gap: 10px; padding: 0 16px;
            background: var(--bg); border-bottom: .5px solid var(--bd2); }
  .cn-back { display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 8px;
             border: .5px solid var(--bd2); background: var(--bg2); color: var(--t2); text-decoration: none; }
  .cn-title { font-size: var(--fs-h); font-weight: 800; display: flex; align-items: center; gap: 7px; }
  .cn-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 7px;
             border: .5px solid var(--bd2); background: var(--bg2); color: var(--t2); white-space: nowrap; }
  .cn-chip b { color: var(--t1); }
  .cn-chip.on { background: var(--green-bg); color: var(--green); border-color: var(--green); }
  .cn-chip.on b { color: var(--green); }
  .cn-sp { flex: 1; }
  html.embed .cn-back { display: none; }

  .cn-banners:empty { display: none; }
  .cn-banner { display: flex; gap: 8px; align-items: flex-start; padding: 5px 14px; border-bottom: .5px solid var(--bd); font-size: 12.5px; line-height: 1.5; }
  .cn-banner.err { background: var(--red-bg); color: var(--red); }
  .cn-banner.warn { background: var(--amber-bg); color: var(--amber); }
  .cn-banner code { background: rgba(0,0,0,.06); padding: 1px 6px; border-radius: 5px; font-size: 12px; }
  /* โหมดทดสอบ — แถบบอกตลอดว่ากำลังใช้บัญชีจำลอง (กันลืมว่ากดอะไรไปในนามใคร) */
  .cn-test { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 16px; background: var(--blue-bg);
             color: var(--blue); border-bottom: .5px solid var(--blue); }
  .cn-test b { color: var(--blue-dk); }
  .cn-sim { margin: 0 16px 6px; padding: 5px 8px; border: 1px dashed var(--amber-mid); border-radius: 8px; background: var(--amber-bg);
            display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--amber); }
  .cn-sim input { flex: 1; min-width: 140px; padding: 5px 10px; border-radius: 8px; border: .5px solid var(--bd2); background: var(--bg); }
  .tag.sim { background: var(--amber-bg); color: var(--amber); }

  /* ── 2 ช่อง: รายชื่อ | แชท ── */
  .cn-main { display: grid; grid-template-columns: 350px minmax(0,1fr); height: calc(100% - var(--th) - var(--bh, 0px)); }
  .cn-tool { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 8px; border: .5px solid var(--bd2);
             background: var(--bg2); color: var(--t2); cursor: pointer; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .cn-tool.on { background: var(--blue); color: var(--on-blue); border-color: var(--blue); }
  html:not(.embed) .embed-only { display: none; }
  .cn-list { display: flex; flex-direction: column; min-height: 0; background: var(--bg); border-right: .5px solid var(--bd2); }
  .cn-tab { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 8px; border: .5px solid var(--bd2);
            background: var(--bg2); color: var(--t2); cursor: pointer; font-weight: 600; }
  .cn-tab.on { background: var(--blue); color: var(--on-blue); border-color: var(--blue); }
  .cn-tab .n { min-width: 18px; padding: 0 5px; border-radius: 5px; background: var(--bg3); color: var(--t2); font-size: 12px; text-align: center; }
  .cn-tab.on .n { background: rgba(255,255,255,.25); color: var(--on-blue); }
  .cn-tab .n.hot { background: var(--red); color: #fff; }
  /* ★ 11 ต.ค.69 รอบ 6 เจ้าของ "กรอบแดงซ้ำซ้อนกัน ลดอันล่างออก" — แท็บรายชื่อ (รอรับ/มีเจ้าของ/ทั้งหมด) เป็นแถบที่มีตัวเลข
     ซ้อนกับเมนูด้านบนซึ่งบอกตัวเลขเดียวกันอยู่แล้ว → หัวรายชื่อเหลือแถวเดียว: มุมมอง (dropdown) + ค้นหา + ปุ่มตัวกรอง
     · ★ 17 ต.ค.69 เจ้าของ "ตัวกรองเยอะไป" + "เป็น Drop Down ดีกว่า" → ตัวกรองเป็น dropdown ตัวเดียว 5 ตัวเลือก
       (รวมทุกช่องทาง · Facebook · LINE@ · TikTok · รอตอบกลับ) · กรองอยู่ = dropdown เป็นสีม่วง */
  .cn-tools { display: flex; gap: 6px; padding: 8px 10px 8px; align-items: center; }
  .cn-tools input, .cn-tools select { flex: 1; min-width: 0; padding: 7px 10px; border-radius: 8px; border: .5px solid var(--bd2);
                                      background: var(--bg2); }
  .cn-tools select.cn-view { flex: 0 1 auto; max-width: 42%; font-weight: 700; color: var(--t1); cursor: pointer; }
  .cn-tools select.cn-fsel { flex: 0 1 auto; max-width: 36%; font-weight: 700; color: var(--t2); cursor: pointer; }
  .cn-tools select.cn-fsel.act { background: var(--blue); color: var(--on-blue); border-color: var(--blue); }
  .cn-fsel option { background: var(--bg); color: var(--t1); }   /* Windows: ตัวเลือกไม่ติดสีม่วงตามกล่อง */
  .cn-note { margin: 4px 10px 8px; padding: 10px 12px; border-radius: 8px; background: var(--amber-bg); color: var(--amber); line-height: 1.6; }
  .cn-rows { flex: 1; overflow-y: auto; border-top: .5px solid var(--bd); }
  .cn-row { display: flex; gap: 10px; padding: 11px 12px; border-bottom: .5px solid var(--bd); cursor: pointer; align-items: flex-start; }
  .cn-row:hover { background: var(--bg2); }
  .cn-row.sel { background: var(--blue-bg); }
  .cn-row.lead { box-shadow: inset 3px 0 0 var(--amber); }
  .cn-row.late { box-shadow: inset 3px 0 0 var(--red); }
  .cn-av { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
           font-weight: 800; color: #fff; background: var(--blue); position: relative; overflow: hidden; }
  /* รูปโปรไฟล์ LINE วางทับตัวอักษร — โหลดไม่ขึ้น (ลิงก์ตาย) = this.remove() แล้วเห็นตัวอักษรที่รออยู่ข้างหลัง */
  .cn-av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cn-av.lg { width: 76px; height: 76px; font-size: 28px; }
  .cn-rb { flex: 1; min-width: 0; }
  .cn-rh { display: flex; gap: 6px; align-items: baseline; }
  .cn-rn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .cn-rt { color: var(--t3); font-size: 12px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  /* ★ 9 ต.ค.69 — ยังไม่อ่าน: ชื่อ+ข้อความล่าสุดตัวหนา · จุดแดงหลังเวลา (แบบ LINE OA) */
  .cn-row.unread .cn-rn { font-weight: 800; }
  .cn-row.unread .cn-rp { color: var(--t1); font-weight: 700; }
  .cn-row.unread .cn-rt { color: var(--red); font-weight: 700; }
  .cn-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); flex: 0 0 auto; }
  .cn-rp { color: var(--t2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .cn-rp.out { color: var(--t3); }
  .cn-rm { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 5px; font-size: 12px; font-weight: 700;
         background: var(--bg3); color: var(--t2); white-space: nowrap; }
  .tag.team { color: #fff; }
  .tag.wait { background: var(--amber-bg); color: var(--amber); }
  .tag.lead { background: var(--amber); color: #fff; }
  .tag.buy { background: var(--green-bg); color: var(--green); border: .5px solid var(--green); }
  .tag.late { background: var(--red); color: #fff; }
  .tag.ok { background: var(--green-bg); color: var(--green); }
  .tag.q { background: var(--blue-bg); color: var(--blue); }
  /* ช่องทางที่ลูกค้าทักมา — LINE / Facebook (4 ต.ค.69 · รวมคิวเดียวกัน) */
  .tag.ch-line { background: #06c755; color: #fff; }
  .tag.ch-fb { background: #1877f2; color: #fff; }
  .tag.ch-tt { background: #111; color: #fff; }
  .tag.ch-yt { background: #ff0000; color: #fff; }
  .tag.ch-ot { background: var(--t3); color: #fff; }
  .cn-empty { text-align: center; color: var(--t3); padding: 40px 20px; line-height: 1.7; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px;
         border: .5px solid var(--bd2); background: var(--bg2); color: var(--t1); cursor: pointer; font-weight: 700; white-space: nowrap; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.pri { background: var(--blue); color: var(--on-blue); border-color: var(--blue); }
  .btn.red { background: var(--red-bg); color: var(--red); border-color: var(--red); }
  .btn.sm { padding: 4px 10px; font-size: 12px; }
  a.btn { text-decoration: none; }

  /* ── ช่องขวา ── */
  .cn-pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .cn-ph { padding: 8px 16px; background: var(--bg); border-bottom: .5px solid var(--bd2); }
  .cn-ph-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .cn-ph-who { min-width: 160px; flex: 1; }
  .cn-ph h2 { margin: 0; font-size: var(--fs-sub); font-weight: 800; }
  .cn-sub { color: var(--t3); margin-top: 2px; }
  .cn-acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: flex-end; margin-left: auto; }
  .cn-acts .btn { padding: 6px 11px; }
  .cn-acts select { padding: 7px 10px; border-radius: 8px; border: .5px solid var(--bd2); background: var(--bg2); max-width: 220px; }
  .cn-clock { display: inline-flex; gap: 4px; align-items: center; padding: 1px 8px; border-radius: 6px; font-weight: 700;
              font-size: 12px; white-space: nowrap; vertical-align: 1px; }
  .cn-clock.wait { background: var(--amber-bg); color: var(--amber); }
  .cn-clock.late { background: var(--red-bg); color: var(--red); }
  .cn-hist { margin-top: 8px; color: var(--t2); max-height: 160px; overflow-y: auto; }
  .cn-hist div { padding: 3px 0; border-bottom: .5px dashed var(--bd); }
  .cn-msgs { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .cn-day { align-self: center; color: var(--t3); font-size: 12px; padding: 2px 10px; border-radius: 6px; background: var(--bg3); margin: 8px 0 2px; }
  .bub { max-width: min(560px, 82%); padding: 8px 12px; border-radius: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .bub.in { align-self: flex-start; background: var(--bg); border: .5px solid var(--bd2); border-bottom-left-radius: 4px; }
  .bub.out { align-self: flex-end; background: var(--blue); color: var(--on-blue); border-bottom-right-radius: 4px; }
  .bub .meta { font-size: 11px; opacity: .7; margin-top: 3px; }
  .bub.out .meta { text-align: right; }
  .bub.media { font-style: italic; opacity: .85; }
  /* ★ 11 ต.ค.69 รูป/ไฟล์ที่ลูกค้าส่ง (โหลดผ่าน /connect/api/media — เช็คสิทธิ์ทุกครั้ง) */
  .bub.has-file { padding: 5px; }
  .bub.has-file .meta { padding: 0 6px 2px; }
  .bub .cn-mtxt { display: block; padding: 3px 7px 4px; }
  .cn-mimg { display: block; margin: 2px 0; }
  .cn-mimg img { display: block; max-width: min(260px, 100%); max-height: 320px; min-width: 90px; min-height: 70px;
                 border-radius: 8px; background: var(--bg2); object-fit: cover; cursor: zoom-in; }
  .cn-mvid { display: block; max-width: min(300px, 100%); max-height: 320px; border-radius: 8px; background: #000; margin: 2px 0; }
  .cn-maud { display: block; max-width: 100%; margin: 2px 0; }
  .cn-mfile { display: inline-flex; gap: 6px; align-items: center; margin: 2px 2px 2px 0; padding: 6px 10px; border-radius: 8px;
              background: var(--bg2); color: var(--t1); text-decoration: none; font-size: 13px; font-style: normal; }
  .cn-mfile:hover { background: var(--bg3); }
  .bub.out .cn-mfile { background: rgba(255,255,255,.18); color: var(--on-blue); }
  .cn-mnote { display: block; font-size: 12px; font-style: italic; opacity: .8; padding: 4px 7px; white-space: normal; }
  .cn-lock { margin: 0 16px; padding: 10px 12px; border-radius: 8px; background: var(--blue-bg); color: var(--blue); line-height: 1.6; }
  .cn-comp { display: flex; gap: 8px; padding: 8px 16px 10px; background: var(--bg); border-top: .5px solid var(--bd2); align-items: flex-end; }
  .cn-comp textarea { flex: 1; resize: none; min-height: 40px; max-height: 160px; padding: 9px 12px; border-radius: 10px;
                      border: .5px solid var(--bd2); background: var(--bg2); line-height: 1.5; }
  .cn-comp-why { padding: 12px 16px; background: var(--bg); border-top: .5px solid var(--bd2); color: var(--t3); }
  .cn-err { color: var(--red); padding: 0 16px 8px; background: var(--bg); }
  /* ★ 17 ต.ค.69 ส่งรูปหาลูกค้า — ปุ่มรูป · วางรูป (Ctrl+V) · ลากไฟล์มาวางในแชท → ดูตัวอย่างก่อน แล้วกดส่งเอง */
  .cn-comp .cn-ibtn { flex: none; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center;
                      border-radius: 10px; color: var(--t2); cursor: pointer; }
  .cn-comp .cn-ibtn:hover { background: var(--bg2); color: var(--t1); }
  .cn-imgp { display: flex; gap: 10px; align-items: center; padding: 8px 16px; background: var(--bg); border-top: .5px solid var(--bd2); }
  .cn-imgp img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: var(--bg2); flex: none; }
  .cn-imgp .nm { flex: 1; min-width: 0; font-size: 13px; color: var(--t2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cn-msgs.drop { outline: 2px dashed var(--blue); outline-offset: -8px; }
  /* ★ 17 ต.ค.69 ข้อความสำเร็จรูป — กล่องลอยเหนือช่องพิมพ์ (ชุดเดียวกับแอป) */
  #cn-comp-wrap { position: relative; }
  button.cn-ibtn { border: 0; background: none; font: inherit; padding: 0; }
  .cn-comp .cn-ibtn.on { background: var(--blue-bg); color: var(--blue); }
  .cn-cnd { position: absolute; left: 12px; bottom: calc(100% + 6px); z-index: 30; width: min(440px, calc(100% - 24px)); max-height: min(420px, 60vh);
            display: flex; flex-direction: column; background: var(--bg); border: .5px solid var(--bd2); border-radius: 12px;
            box-shadow: 0 8px 28px rgba(0,0,0,.18); overflow: hidden; }
  .cn-cnd .hd { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 6px 14px; }
  .cn-cnd .x, .cn-cnd .ib { border: 0; background: none; color: var(--t3); cursor: pointer; padding: 6px; border-radius: 8px; display: inline-flex; flex: none; }
  .cn-cnd .x:hover, .cn-cnd .ib:hover { background: var(--bg3); color: var(--t1); }
  .cn-cnd .q { margin: 0 12px 6px; padding: 7px 10px; border-radius: 8px; border: .5px solid var(--bd2); background: var(--bg2); color: var(--t1); font: inherit; }
  .cn-cnd .ls { overflow-y: auto; padding: 0 6px 6px; flex: 1; min-height: 0; }
  .cn-cnd .it { display: flex; align-items: flex-start; gap: 2px; border-radius: 8px; }
  .cn-cnd .it:hover { background: var(--bg2); }
  .cn-cnd .pick { flex: 1; min-width: 0; text-align: left; border: 0; background: none; font: inherit; color: var(--t1); cursor: pointer;
                  padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .cn-cnd .pick span { color: var(--t2); font-size: 13px; line-height: 1.45; white-space: pre-line;
                       display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cn-cnd .em { padding: 16px 12px; color: var(--t3); text-align: center; line-height: 1.5; }
  .cn-cnd .ft { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-top: .5px solid var(--bd2); color: var(--t3); font-size: 12px; }
  .cn-cnd .fm { display: flex; flex-direction: column; gap: 8px; padding: 0 12px 12px; }
  .cn-cnd .fm input, .cn-cnd .fm textarea { font: inherit; padding: 8px 10px; border-radius: 8px; border: .5px solid var(--bd2); background: var(--bg2); color: var(--t1); resize: vertical; }
  .cn-cnd .fm .acts { display: flex; justify-content: flex-end; gap: 8px; }
  /* ★ 12 ต.ค.69 คำที่ระบบจับได้ (สีตามหมวด: ติดต่อ · รถ · การเงิน · เจตนา) · ป้ายที่มา · ค่าใหม่รอยืนยัน · ความพร้อมข้อมูล · ตอบด่วน */
  .kw { font: inherit; line-height: inherit; color: inherit; cursor: pointer; margin: 0; padding: 0 2px; border: 0; border-radius: 4px;
        background: var(--kw-bg); box-shadow: inset 0 -2px 0 var(--kw-ln); white-space: pre-wrap; text-align: inherit; }
  .kw-c { --kw-bg: rgba(37,99,235,.15); --kw-ln: #2563eb; }
  .kw-r { --kw-bg: rgba(124,58,237,.15); --kw-ln: #7c3aed; }
  .kw-m { --kw-bg: rgba(5,150,105,.16); --kw-ln: #059669; }
  .kw-i { --kw-bg: rgba(234,88,12,.16); --kw-ln: #c2410c; }
  .bub.out .kw { background: rgba(255,255,255,.22); box-shadow: inset 0 -2px 0 rgba(255,255,255,.9); }
  .kw.on, .bub.out .kw.on { background: var(--kw-ln); color: #fff; box-shadow: none; }
  .bub.flash { outline: 2px solid var(--blue); outline-offset: 3px; }
  .kw-src { font: inherit; font-size: 10.5px; line-height: 1.5; padding: 0 5px; border-radius: 5px; cursor: pointer; white-space: nowrap;
            background: var(--bg); color: var(--t2); border: 1px solid var(--kw-ln, var(--bd2)); }
  .pf-fld.flash, .pf-buy.flash, .pf-src.flash { outline: 2px solid var(--kw-ln, var(--blue)); outline-offset: 3px; border-radius: 6px; }
  .pf-sgm { font-size: 10.5px; color: var(--amber); white-space: nowrap; font-weight: 700; }
  .kw-hd { display: flex; align-items: baseline; gap: 8px; }
  .kw-n { margin-left: auto; font-weight: 800; color: var(--blue); }
  .kw-bar { height: 6px; border-radius: 3px; background: var(--bg3); overflow: hidden; margin: 6px 0 8px; }
  .kw-bar > i { display: block; height: 100%; background: var(--blue); }
  .kw-ready { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 3px 10px; font-size: 12.5px; }
  .kw-ready span { display: flex; gap: 5px; align-items: center; min-width: 0; }
  .kw-ready .ok { color: var(--green); }
  .kw-ready .no { color: var(--t3); }

  .lc-link { color: #EEEAF8; opacity: .72; text-decoration: none; padding: 2px 4px; }

  .lc-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  /* ★ 11 ต.ค.69 รอบ 5 เจ้าของ "ตัดออก ไม่ก็เหลือแค่ส่วนที่จำเป็นเท่านั้น" — เลิกแถวหัวหน้า (ชื่อหน้าซ้ำกับเมนู · คำอธิบาย · นาฬิกา)
     และแถบขั้นตอน 3 ชั้น (ตัวเลขซ้ำกับป้ายบนเมนู) · เหลือ "เวรวันนี้ + กระดิ่ง" ย้ายมาอยู่ในแถบเมนู (.lc-st)
     · คำอธิบายของแต่ละหน้าอยู่ใน title ของปุ่มเมนู (ชี้เมาส์เห็น) */
  .lc-st { display: flex; align-items: center; gap: 6px; padding: 0 4px 12px; }

  .lc-shell .cn-tab { padding: 4px 8px; gap: 4px; white-space: nowrap; flex: none; }

  /* ห้องพัก Lead */

  .lc-pend { border-bottom: .5px solid var(--bd2); background: var(--amber-bg); }

  .lc-pr .p { color: var(--t3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .lc-pr .a { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  .lc-pr .a a { font-size: 12px; color: var(--t3); cursor: pointer; white-space: nowrap; }
  .lc-pr .a .t { font-size: 12px; color: var(--t3); white-space: nowrap; }
  .lc-pend-f { padding: 7px 14px 10px; font-size: 12px; color: var(--t3); }
  .lc-pend-f a { cursor: pointer; color: var(--blue); font-weight: 700; }
  .lc-lead .who { font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .lc-lead .code { font-size: 11.5px; font-weight: 700; color: var(--t3); letter-spacing: .02em; }

  .lc-lead .more { grid-column: 1 / -1; }
  .lc-origin { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--t1); color: var(--bg); }
  .lc-origin.direct { background: #DB2777; color: #fff; }
  .lc-sla { display: flex; align-items: baseline; gap: 6px; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .lc-sla small { font-size: 10.5px; font-weight: 600; }

  .lc-asg { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }

  .lc-av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff; flex: none; }
  .lc-rl { padding: 9px 14px; border-bottom: .5px solid var(--bd); font-size: 12.5px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .lc-rl:last-child { border-bottom: 0; }
  .lc-log { max-height: 280px; overflow-y: auto; }

  /* ฐานข้อมูล Lead */
  .lc-dbtop { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: .5px solid var(--bd); }
  .lc-dbs { display: flex; align-items: center; gap: 9px; background: var(--bg2); border: .5px solid var(--bd2); border-radius: 9px; padding: 8px 12px; min-width: 0; }

  /* ★ 17 ต.ค.69 หน้าคอมเมนต์ — รวมคอมเมนต์ Facebook · TikTok (รออนุมัติ) · YouTube */
  /* การ์ดคอมเมนต์ — ★ 17 ต.ค.69 (รอบ 3) เจ้าของ "ตัวหนังสือจาง · พื้นที่เหลือเยอะไม่จำเป็น"
     จอกว้างเรียงเป็นการ์ดหลายคอลัมน์ (เดิมแถวเดียวกว้างทั้งจอ เนื้อหาอยู่ซ้าย ป้าย/เวลาไปอยู่สุดขวา)
     ในการ์ด: รูปคน | หัว (ชื่อ ··· ประเภท สถานะ เวลา) · เพจ/ช่อง · ข้อความ · โพสต์ · ปุ่ม (ชิดล่าง การ์ดข้างกันปุ่มตรงกัน)
     ป้ายกว้างตายตัว + ปุ่ม/ช่องเลือกสูงเท่ากัน → ทุกการ์ดตรงกัน (เจ้าของ "เรียงดูแปลกๆ ให้มันเท่ากัน") */
  #lc-cm-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(560px, 100%), 1fr)); gap: 10px; margin-bottom: 13px; }

  .cm-ad { color: var(--amber); }

  .lc-dbgrid { display: grid; grid-template-columns: minmax(0,1fr); gap: 13px; align-items: start; }

  .lc-dbst > div.go:hover { background: var(--bg2); }
  .lc-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .lc-tbl th { text-align: left; font-weight: 700; font-size: 11.5px; letter-spacing: .03em; color: var(--t3); padding: 9px 12px; border-bottom: .5px solid var(--bd2); white-space: nowrap; }
  .lc-tbl td { padding: 9px 12px; border-bottom: .5px solid var(--bd); vertical-align: middle; }

  .lc-tw { overflow-x: auto; }
  .lc-rep { font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 4px; background: var(--red-bg); color: var(--red); margin-left: 4px; }
  .lc-cust b { display: block; }
  .lc-cust span { font-size: 11.5px; color: var(--t3); font-variant-numeric: tabular-nums; }
  /* ตารางแบบชีตลีด (26 คอลัมน์ ค่าดิบ) — หัวตารางตรึงบน · 5 คอลัมน์แรก (ตรวจซ้ำ ว/ด/ป เบอร์ เวลา Code) ตรึงซ้าย */

<script>
(function () {
  const BOOT = JSON.parse((document.getElementById('cn-boot') || {}).textContent || '{}');
  if (!document.getElementById('cn-main')) return;          // หน้าแจ้ง error
  const ME = BOOT.me || {};
  const ADMIN = !!ME.admin;
  if (BOOT.embed) document.documentElement.classList.add('embed');

  // ── ตัวช่วย ──
  const h = s => (s === null || s === undefined) ? '' : String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const ICONS = {
    'phone': '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
    'database': '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
    'columns': '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/>',
    'message-circle': '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
    'arrow-left': '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
    'send': '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
    'clock': '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    'alert': '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    'user-check': '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/>',
    'users': '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    'inbox': '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
    'chart': '<line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/>',
    'sliders': '<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>',
    'repeat': '<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>',
    'check': '<path d="M20 6 9 17l-5-5"/>',
    'paperclip': '<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
    'hash': '<line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/>',
    'bell': '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
    'calendar': '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
    'copy': '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
    'image': '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
    'canned': '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M13 8H7"/><path d="M17 12H7"/>',
    'pencil': '<path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/>',
    'trash': '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
    'plus': '<path d="M5 12h14"/><path d="M12 5v14"/>',
    'x': '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    'messages': '<path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/>',
    'chevron-right': '<path d="m9 18 6-6-6-6"/>',
    'car': '<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>',
    'user': '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    'list': '<line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/>',
  };
  const ic = (n, sz) => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"${sz ? ` style="width:${sz}px;height:${sz}px"` : ''}>${ICONS[n] || ''}</svg>`;
  document.querySelectorAll('[data-ic]').forEach(el => { el.innerHTML = ic(el.dataset.ic, 17); });
  const $ = id => document.getElementById(id);
  const csrf = () => { const m = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/); return m ? decodeURIComponent(m[1]) : ''; };
  const TEAM_C = { A: 'var(--tA)', B: 'var(--tB)', C: 'var(--tC)', ADMIN: 'var(--amber-mid)' };
  // ป้ายช่องทางชุดเดียวทั้งหน้า (รายชื่อ · หัวแชท · ห้องพัก Lead) — `n` = ตัวเลขต่อท้าย (นับในห้องพัก)
  const CH_CLS = { line: ['ch-line', 'LINE'], fb: ['ch-fb', 'Facebook'], facebook: ['ch-fb', 'Facebook'],
                   tiktok: ['ch-tt', 'TikTok'], yt: ['ch-yt', 'YouTube'], other: ['ch-ot', 'อื่นๆ'] };
  const chTag = (s, n) => { const x = CH_CLS[s] || CH_CLS.line; return `<span class="tag ${x[0]}">${x[1]}${n != null ? ' ' + n : ''}</span>`; };
  const teamTag = t => t ? `<span class="tag team" style="background:${TEAM_C[t] || 'var(--t3)'}">ทีม ${h(t)}</span>` : '';
  const AV_C = ['#7c3aed', '#0d9488', '#db2777', '#2563eb', '#d97706', '#059669', '#9333ea', '#dc2626'];
  const avColor = name => { let s = 2166136261; for (const ch of String(name || '')) { s ^= ch.codePointAt(0); s = Math.imul(s, 16777619) >>> 0; } return AV_C[s % AV_C.length]; };
  const initial = name => (Array.from(String(name || '?').trim())[0] || '?').toUpperCase();
  // รูปโปรไฟล์ LINE ทับตัวอักษร — ไม่มีรูป/โหลดไม่ขึ้น = เห็นตัวอักษรบนวงกลมสีแทน (ไม่ใช่กล่องว่าง)
  const avHtml = (name, pic, cls) => `<div class="cn-av${cls ? ' ' + cls : ''}" style="background:${avColor(name)}">${h(initial(name))}`
    + (pic ? `<img src="${h(pic)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '') + `</div>`;
  const LANG = { th: 'ไทย', en: 'อังกฤษ', ja: 'ญี่ปุ่น', zh: 'จีน', 'zh-TW': 'จีน', 'zh-Hant': 'จีน', ko: 'เกาหลี', my: 'พม่า', km: 'เขมร', lo: 'ลาว' };
  const fmtPhone = d => d.length === 10 ? d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6) : (d.length === 9 ? d.slice(0, 2) + '-' + d.slice(2, 5) + '-' + d.slice(5) : d);

  function toast(msg, ms) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), ms || 3200);
  }

  async function api(path, body, signal) {
    const opt = { credentials: 'same-origin', headers: {}, signal };
    if (body !== undefined) {
      opt.method = 'POST'; opt.body = JSON.stringify(body);
      opt.headers['Content-Type'] = 'application/json'; opt.headers['X-CSRFToken'] = csrf();
    }
    const r = await fetch(path, opt);
    let d;
    try { d = await r.json(); } catch (e) { d = { ok: false, error: 'เซิร์ฟเวอร์ตอบผิดรูปแบบ (' + r.status + ')' }; }
    if (r.status === 401) { location.href = '/login/?next=' + encodeURIComponent('/connect/'); }
    return d;
  }

  // ── เวลา ──
  let SKEW = 0;                                   // นาฬิกาเซิร์ฟเวอร์ − นาฬิกาเครื่องนี้
  const nowMs = () => Date.now() + SKEW;
  const pad = n => String(n).padStart(2, '0');
  function fmtWhen(iso) {
    if (!iso) return '';
    const d = new Date(iso), n = new Date(nowMs());
    const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    return d.toDateString() === n.toDateString() ? hm : (d.getDate() + '/' + (d.getMonth() + 1) + ' ' + hm);
  }
  // วันที่เต็ม (ไม่ตัดเหลือแค่เวลาแม้เป็นวันนี้) — ใช้กับ "ทักครั้งแรก" ที่ต้องรู้ว่าลูกค้าเก่าแค่ไหน
  const TH_MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  function fmtFull(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.getDate() + ' ' + TH_MON[d.getMonth()] + ' ' + String(d.getFullYear() + 543).slice(-2) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fmtLeft(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    return Math.floor(s / 60) + ':' + pad(s % 60);
  }
  // ป้ายนาฬิกาของรอบรอ — อัปเดตทุกวินาทีจาก data-due (ไม่ต้องยิงเซิร์ฟเวอร์)
  function clockText(dueIso, sinceIso) {
    if (!dueIso) return { cls: '', text: '' };
    const left = Date.parse(dueIso) - nowMs();
    if (left <= 0) return { cls: 'late', text: 'เลยเวลา ' + Math.max(1, Math.round(-left / 60000)) + ' นาที' };
    const sla = (S.duty ? S.duty.slaMin : 5) * 60000;
    if (left > sla + 30000) {                      // ทักนอกเวลาทำการ — ยังไม่เริ่มนับ
      const st = new Date(Date.parse(dueIso) - sla);
      return { cls: 'wait', text: 'เริ่มนับ ' + pad(st.getHours()) + ':' + pad(st.getMinutes()) };
    }
    return { cls: 'wait', text: 'เหลือ ' + fmtLeft(left) };
  }

  // ── สถานะ ──
  const S = {
    view: '', q: '', seller: 0, src: '', rows: [], counts: {}, duty: null, onDuty: false, sellers: [], status: [], note: '',
    openId: BOOT.openId ? (+BOOT.openId || 0) : 0, chat: null, pane: 'chat', loaded: false,
    histOpen: false, side: true, panel: 'inbox',
    // ★ 11 ต.ค.69 หน้ารวมแชท — ตัวกรอง (crm.FILTER_KEYS) · ตัวเลือกจากเซิร์ฟเวอร์ · ร่างที่พิมพ์ค้างไว้ต่อแชท
    f: {}, alerts: null,
    raPlan: null, raOff: new Set(), raBusy: '', raDone: null,      // Run Auto ของห้องพัก Lead
    lostPick: 0, aiDraft: {}, sumDraft: {}, apptDraft: {}, callDraft: {}, callMedia: {},
    hl: true, pt: 'm',                     // ★ 12 ต.ค.69 ไฮไลต์คำที่ระบบจับได้ · คำลงท้ายของข้อความตอบด่วน (m = ครับ · f = ค่ะ)
    moreOpen: false, hintNo: {},           // ★ 17 ต.ค.69 กาง "ข้อมูลเพิ่มเติม" ไว้ไหม (จำในเครื่อง) · กด "ไม่ใช่นัด" ไว้ต่อแชท
  };
  try { S.side = localStorage.getItem('cn_side') !== '0'; } catch (e) {}
  try { S.moreOpen = localStorage.getItem('cn_more') === '1'; } catch (e) {}
  try { S.hl = localStorage.getItem('cn_hl') !== '0'; S.pt = localStorage.getItem('cn_pt') === 'f' ? 'f' : 'm'; } catch (e) {}
  const TABS_ADMIN = [
    // ★ 7 ต.ค.69 เอาแท็บ "เลยเวลา" ออก (เจ้าของสั่ง) — ทีมตอบลูกค้าในแอป LINE OA Manager ซึ่ง LINE ไม่ส่งกลับมา
    //   → แชทที่ตอบไปแล้วค้างเป็น "เลยเวลา" ไปหมด ตัวเลขไม่มีความหมาย
    // ★ 18 ต.ค.69 เจ้าของ "อยากให้หน้าหลักเป็นรวมแชท รอรับน่าจะไม่ได้ใช้" → แอดมินเปิดมาเจอ "ทั้งหมด" (ข้อความล่าสุดก่อน)
    //   · "รอรับ" ย้ายไปท้ายรายการ (ยังเลือกได้ — เซลล์ยังใช้คิวรอรับในวันเวร)
    { v: 'all', l: 'ทั้งหมด', i: 'list', c: 'all' },
    // ลูกค้าที่คุยในระบบแล้วแต่ยังไม่มีเลขลีด — งานจ่ายเบอร์ของแอดมิน (connect.to_code)
    { v: 'tocode', l: 'ห้องพัก Lead', i: 'hash', c: 'tocode' },
    { v: 'mine', l: 'ของฉัน', i: 'user-check', c: 'mine', needEmp: true },
    { v: 'owned', l: 'มีเจ้าของ', i: 'users', c: 'owned' },
    { v: 'queue', l: 'รอรับ', i: 'inbox', c: 'queue', hot: true },
    { v: '_stats', l: 'สถิติ', i: 'chart' },
    { v: '_cfg', l: 'ตั้งค่า', i: 'sliders' },
  ];
  // ★ 10 ต.ค.69 เมนูซ้ายแบบ "ศูนย์ควบคุมลีด" — แท็บรายชื่อ (รอรับ/มีเจ้าของ/ทั้งหมด/ของฉัน) อยู่ในกล่องแชทรวม
  const RAIL_ADMIN = [
    { p: 'inbox', l: 'กล่องแชทรวม', i: 'message-circle', sub: 'ชั้น 1 · แชท LINE@ และ Facebook มารวมที่นี่ก่อน — เปิดแชทแล้วกด "รับ lead จากแชทนี้แล้ว" ส่งเข้าห้องพัก Lead' },
    { p: 'cmt', l: 'คอมเมนต์', i: 'messages', sub: 'คอมเมนต์ใต้โพสต์/โฆษณา Facebook และคลิป YouTube รวมที่เดียว · TikTok รออนุมัติสิทธิ์' },
    { p: 'dist', l: 'ห้องพัก Lead', i: 'phone', sub: 'ชั้น 2 · ใบร่างจากกลุ่ม ADMIN เก็บ Lead + แชทที่แอดมินกด "รับ lead จากแชทนี้แล้ว" — กดชื่อเซลล์เพื่อจ่ายเบอร์' },
    { p: 'db', l: 'ฐานข้อมูล Lead', i: 'database', sub: 'ค้นหาลูกค้าทุกคนในชีตลีด · คลิกแล้วเห็นประวัติ · ส่งต่อไม้ 2' },
    { p: 'pipe', l: 'ไปป์ไลน์', i: 'columns', sub: 'ดีลที่กำลังเดิน จอง → รอเซ็นต์ → รอผล → รอปล่อย → ปล่อย (จากชีตยอดขาย)' },
    { p: 'dash', l: 'แดชบอร์ดทีม', i: 'chart', sub: 'ใครได้กี่เบอร์ รายงานผลทันไหม ตอบแชททันไหม จอง/ปล่อยเดือนนี้' },
    { p: 'rules', l: 'กฎและเส้นทาง', i: 'sliders', sub: 'กติกาการจ่ายลีด (เปิด/ปิดได้เลย) · เวร · เส้นตาย · กลุ่ม LINE · ทดสอบ' },
  ];
  const RAIL_SELLER = [
    { p: 'inbox', l: 'แชทลูกค้า', i: 'message-circle', sub: 'ลูกค้ารอรับในวันเวรทีมคุณ + ลูกค้าของคุณ' },
  ];
  const PANEL_PANE = { inbox: 'chat', cmt: 'cmt', dist: 'dist', db: 'db', pipe: 'pipe', dash: 'stats', rules: 'cfg' };
  const TABS_SELLER = [
    { v: 'queue', l: 'รอรับ', i: 'inbox', c: 'queue', hot: true },
    { v: 'mine', l: 'ลูกค้าของฉัน', i: 'user-check', c: 'mine', hotKey: 'mineWaiting' },
  ];

  function renderTop() {
    const d = S.duty;
    if (d) {
      $('cn-duty').innerHTML = `เวรวันนี้ <b>ทีม ${h(d.today)}</b><span class="lc-tmr"> · พรุ่งนี้ทีม ${h(d.tomorrow)}</span>`;
    }
    const me = $('cn-me');
    if (ADMIN) {
      me.className = 'cn-chip';
      me.innerHTML = `<b>${h(ME.name || 'แอดมิน')}</b> · แอดมิน`;
      $('cn-back').href = '/dashboard/';
    } else {
      me.className = 'cn-chip' + (S.onDuty ? ' on' : '');
      me.innerHTML = `<b>${h(ME.name)}</b> · ทีม ${h(ME.team || '-')}${S.onDuty ? ' · วันนี้เวรคุณ' : ''}`;
      $('cn-back').href = (BOOT.test && BOOT.test.as) ? '/dashboard/' : '/me/';
      $('cn-back-t').textContent = (BOOT.test && BOOT.test.as) ? 'แดชบอร์ด' : 'หน้าของฉัน';
    }
    $('lc-brand-sub').textContent = ADMIN ? 'ศูนย์ควบคุมลีด' : 'แชทลูกค้า';
    const b = $('cn-banners');
    const T = BOOT.test;
    let testBar = '';
    if (T && T.as) {
      const others = (T.teams || []).filter(t => t !== ME.team);
      testBar = `<div class="cn-test">🧪 <span><b>โหมดทดสอบ</b> — ${h(T.realName || 'แอดมิน')} กำลังใช้หน้าจอแบบ <b>${h(ME.name)}</b> (ทีม ${h(ME.team || '-')} · ${S.onDuty ? 'วันนี้เวร' : 'ไม่ใช่วันเวร'})</span>
        <span class="cn-sp"></span>
        <button class="btn sm" data-test="customer">+ ลูกค้าจำลองทักเข้ามา</button>
        ${others.map(t => `<button class="btn sm" data-test="as" data-team="${h(t)}">สลับเป็นทีม ${h(t)}</button>`).join('')}
        <button class="btn sm pri" data-test="exit">กลับเป็นแอดมิน</button></div>`;
    }
    b.innerHTML = testBar + (S.status || []).map(s => `<div class="cn-banner ${h(s.level)}">${ic('alert')}<div>${h(s.text)}${s.fix ? ` · เปิดด้วยคำสั่ง <code>${h(s.fix)}</code>` : ''}</div></div>`).join('');
    b.querySelectorAll('[data-test]').forEach(x => x.onclick = () => testAct(x.dataset.test, { team: x.dataset.team }));
    document.documentElement.style.setProperty('--bh', b.offsetHeight + 'px');
    // ตัวเลขบนแท็บเบราว์เซอร์ — คนเปิดค้างไว้ข้างหลังจะเห็นว่ามีงาน
    const c = S.counts || {};
    const hot = ADMIN ? (c.queue || 0) : ((c.queue || 0) + (c.mineWaiting || 0));
    document.title = (hot ? '(' + hot + ') ' : '') + 'Connect · Oxlet';
  }

  function renderTabs() {
    const all = (ADMIN ? TABS_ADMIN : TABS_SELLER).filter(t => !t.needEmp || ME.empId);
    // ★ 10 ต.ค.69 ห้องพัก Lead / สถิติ / ตั้งค่า ย้ายไปเมนูซ้าย (ห้องพัก Lead · แดชบอร์ดทีม · กฎและเส้นทาง)
    const tabs = all.filter(t => !t.v.startsWith('_') && t.v !== 'tocode');
    // ★ 11 ต.ค.69 รอบ 6 แท็บ → dropdown (ตัวเลขยังอยู่ในชื่อตัวเลือก) · ไม่วาดทับตอนกำลังเปิดเลือกอยู่ (รายชื่อรีเฟรชทุก 8 วิ)
    const vs = $('cn-view'), c0 = S.counts || {};
    const opts = tabs.map(t => {
      if (!t.c) return [t.v, t.l];
      const v = c0[t.c] || 0, hv = t.hotKey ? (c0[t.hotKey] || 0) : 0;
      return [t.v, t.l + (t.hotKey && hv ? ` (รอตอบ ${hv}/${v})` : ` (${v})`)];
    });
    const sig = opts.map(o => o.join('=')).join('|') + '#' + S.view;
    if (vs.dataset.sig !== sig && document.activeElement !== vs) {
      vs.dataset.sig = sig;
      vs.innerHTML = opts.map(o => `<option value="${h(o[0])}">${h(o[1])}</option>`).join('');
      vs.value = S.view;
    }
    applyHub();
    renderRail();
  }

  // ห้องพัก Lead = บอร์ดเต็มจอ (แอดมิน · เฉพาะตอนดูรายชื่อ — สถิติ/ตั้งค่ายังเป็น 2 ช่องเหมือนเดิม)
  function applyHub() {
    $('cn-main').classList.remove('hub');          // ★ 10 ต.ค.69 ห้องพัก Lead เป็นหน้าของตัวเองแล้ว (เมนูซ้าย)
  }

  function pickTab(v) {
    if (v === '_stats') { setPanel('dash'); return; }
    if (v === '_cfg') { setPanel('rules'); return; }
    if (v === 'tocode' && ADMIN) { setPanel('dist'); return; }
    S.view = v; S.pane = 'chat';
    if (ADMIN && v === 'tocode') {
      // เข้าห้องพัก Lead = เห็นบอร์ดก่อนเสมอ (แชทที่ค้างไว้ปิดไป — ไม่งั้นเปิดแท็บมาเจอแชทเต็มจอแทนบอร์ด)
      S.openId = 0; S.chat = null; hidePane();
      try { history.replaceState(null, '', '/connect/' + (BOOT.embed ? '?embed=1' : '')); } catch (e) {}
    }
    applyHub();
    if (!S.openId) renderBlank();
    loadInbox(true);
  }

  function rowHtml(r) {
    const ck = r.awaiting ? clockText(r.due, r.since) : null;
    const tags = [chTag(r.src)];
    tags.push(...crmTags(r));
    if (r.staff) tags.push(`<span class="tag wait" title="บัญชี LINE นี้ผูกกับพนักงานในทะเบียน — ทดสอบ/ส่งต่อลีด">พนักงาน</span>`);
    if (r.owner) tags.push(`<span class="tag">${ic('user-check', 12)} ${h(r.owner)}</span>`);
    else tags.push(`<span class="tag q">ยังไม่มีคนรับ</span>`);
    if (r.code) tags.push(`<span class="tag code" title="เลขลีด">${ic('hash', 12)} ${h(r.code)}</span>`);
    else if (r.buyCode) tags.push(`<span class="tag" title="ลูกค้าอยากขายรถให้เรา — ส่งเข้ากลุ่มเคสHOT ของจัดซื้อแล้ว">ส่งจัดซื้อ ${h(r.buyCode)}</span>`);
    // ★ 11 ต.ค.69 ลีดรับซื้อรถ (ลูกค้าอยากขายรถให้เรา) — แยกจากลีดขาย · อยู่แท็บ "รับซื้อรถ" ของห้องพัก Lead (ไม่จ่ายเบอร์ให้เซลล์)
    else if (r.deal === 'buy') tags.push(`<span class="tag buy" title="ลูกค้าอยากขายรถให้เรา — ${r.buyRoom
      ? 'อยู่แท็บ &quot;รับซื้อรถ&quot; ในห้องพัก Lead รอส่งใบเคสรับซื้อให้ทีมจัดซื้อ' : 'ยังไม่มีเบอร์/ID LINE (หรือเก่าเกิน) — ยังไม่ขึ้นแท็บรับซื้อรถ'}">ลีดรับซื้อ${r.buyRoom ? ' · รอส่งจัดซื้อ' : ''}</span>`);
    // ★ 11 ต.ค.69 "รอจ่ายเบอร์" = อยู่ในห้องพัก Lead จริง (แอดมินติ๊ก "รับ lead จากแชทนี้แล้ว" · หรือเปิดสวิตช์เข้าเอง)
    //   ให้เบอร์/ID แล้วแต่ยังไม่ติ๊ก = ป้าย "ให้เบอร์แล้ว" ไว้บอกว่าเปิดแชทไปติ๊กได้ · server รุ่นเก่าไม่มี inRoom = ดู contact แบบเดิม
    else if (ADMIN && !r.nocode && (r.inRoom !== undefined ? r.inRoom : r.contact)) tags.push(`<span class="tag wait" title="${r.contact === 'qr'
      ? 'ลูกค้าส่งรูป QR ของ LINE มา — อยู่ในห้องพัก Lead รอจ่ายเบอร์'
      : 'อยู่ในห้องพัก Lead รอจ่ายเบอร์'}${r.parkedBy ? ' · ติ๊กรับ lead โดย ' + h(r.parkedBy) : ''}">${ic('phone', 12)} รอจ่ายเบอร์${r.contact === 'qr' ? ' · QR' : ''}</span>`);
    // ★ 11 ต.ค.69 (ค่ำ) เจ้าของ "ลูกค้าให้เบอร์แล้วไม่เด่นเลย" → ป้ายสีส้มทึบ + ขีดส้มหน้าแถว · แชทนี้อยู่กลุ่ม "รอกดรับ" ในห้องพัก Lead
    else if (ADMIN && r.pendingPark) tags.push(`<span class="tag lead" title="ลูกค้าให้${r.contact === 'qr' ? 'รูป QR ของ LINE' : 'เบอร์/ID LINE'}แล้ว — ขึ้นในห้องพัก Lead กลุ่ม &quot;รอกดรับ&quot; · กด &quot;รับ lead&quot; ที่นั่นหรือบนหัวแชท แล้วจ่ายเบอร์ต่อ">${ic('phone', 12)} ให้${r.contact === 'qr' ? ' QR' : 'เบอร์'}แล้ว · รอรับ lead</span>`);
    else if (ADMIN && !r.nocode && r.contact) tags.push(`<span class="tag" title="ลูกค้าให้${r.contact === 'qr' ? 'รูป QR ของ LINE' : 'เบอร์/ID LINE'}ในแชทแล้ว แต่ยังไม่อยู่ในห้องพัก Lead — เปิดแชทแล้วกด &quot;รับ lead จากแชทนี้แล้ว&quot;">${ic('phone', 12)} ให้${r.contact === 'qr' ? ' QR' : 'เบอร์'}แล้ว</span>`);
    if (r.trade && r.deal !== 'buy') tags.push(`<span class="tag" title="ลูกค้ามีรถเก่ามาเทิร์น — ยังเป็นลีดขายรถ">มีรถเทิร์น</span>`);
    if (r.sim) tags.push(`<span class="tag sim">ลูกค้าจำลอง</span>`);
    (r.tags || []).forEach(t => tags.push(`<span class="tag ok">${h(t)}</span>`));
    if (ck && ck.text) tags.push(`<span class="tag ${ck.cls}" data-due="${h(r.due)}">${ic('clock', 12)} <span class="ck">${h(ck.text)}</span></span>`);
    const claimBtn = (!ADMIN && !r.owner && S.onDuty) ? `<button class="btn pri sm" data-claim="${r.id}">รับ</button>` : '';
    return `<div class="cn-row${r.id === S.openId ? ' sel' : ''}${ADMIN && r.pendingPark ? ' lead' : ''}${r.overdue ? ' late' : ''}${r.unread ? ' unread' : ''}" data-id="${r.id}">
      ${avHtml(r.name, r.pic)}
      <div class="cn-rb">
        <div class="cn-rh"><span class="cn-rn">${h(r.name)}</span><span class="cn-rt"${r.unread ? ' title="ยังไม่มีใครเปิดอ่าน"' : ''}>${h(fmtWhen(r.lastAt))}${r.unread ? '<span class="cn-dot"></span>' : ''}</span></div>
        <div class="cn-rp${r.lastDir === 'out' ? ' out' : ''}">${r.lastDir === 'out' ? 'เรา: ' : ''}${h(r.preview || '—')}</div>
        <div class="cn-rm">${tags.join('')}${claimBtn}</div>
      </div>
    </div>`;
  }

  // ── ★ 11 ต.ค.69 หน้ารวมแชท: ป้ายในรายชื่อ ──
  const STAGE_SKIP_TAG = { new: 1 };            // ลีดใหม่ = ทุกแถวในคิวรอรับเหมือนกันหมด (ไม่ต้องติดป้าย)
  const HEAT_TXT = { hot: '🔥 ร้อน', warm: 'อุ่น', cold: 'เย็น' };
  function crmTags(r) {
    const t = [];
    if (r.stage && !STAGE_SKIP_TAG[r.stage]) t.push(`<span class="tag st-${h(r.stage)}"${r.lostReason ? ` title="${h(r.lostReason)}"` : ''}>${h(r.stageLabel || r.stage)}</span>`);
    if (r.heat === 'hot' || r.heat === 'warm') t.push(`<span class="tag ht-${r.heat}" title="ความร้อน ${r.heatScore}/100${(r.heatWhy || []).length ? ' — ' + h(r.heatWhy.join(' · ')) : ''}">${HEAT_TXT[r.heat]}</span>`);
    if (r.appt) t.push(`<span class="tag ap${r.appt.late ? ' late' : ''}" title="${r.appt.kind === 'viewing' ? 'นัดดูรถ' : 'นัดติดตาม'}${r.appt.late ? ' — เลยเวลานัดแล้ว' : ''}">${ic('calendar', 12)} ${r.appt.kind === 'viewing' ? 'ดูรถ' : 'นัด'} ${h(fmtWhen(r.appt.due))}</span>`);
    if (r.silent) t.push(`<span class="tag wait" title="ลูกค้าไม่ได้ทักมา ${r.silentDays} วัน">เงียบ ${r.silentDays} วัน</span>`);
    else if (r.noReply) t.push(`<span class="tag wait" title="เราส่งล่าสุดเกิน 24 ชม. แล้วลูกค้ายังไม่ตอบ">ลูกค้าไม่ตอบ</span>`);
    if (r.carMatch) t.push(`<span class="tag match" title="มีรถพร้อมขายที่ตรงกับที่ลูกค้าหา">รถใหม่ตรง ${r.carMatch}</span>`);
    return t;
  }

  // ── ★ 17 ต.ค.69 ตัวกรอง = dropdown ตัวเดียว (เจ้าของ "ตัวกรองเยอะไป เหลือแค่นี้พอ" แล้ว "เป็น Drop Down ดีกว่า") ──
  //   5 ตัวเลือก เลือกได้ทีละอย่าง: รวมทุกช่องทาง · Facebook · LINE@ · TikTok (→ src) · รอตอบกลับ (→ awaiting=1 ทุกช่องทาง)
  //   (เดิม 11 ต.ค.69 มีปุ่มลัด 7 อัน + แผงขั้น/ความร้อน/เหตุผล/รุ่น/งบ/วันที่ + เลือกเซลล์ — เอาออกจากหน้าแล้ว เซิร์ฟเวอร์ยังรับได้)
  //   TikTok: แชทใน Connect ตอนนี้มาจาก LINE@/Facebook เท่านั้น → เลือกแล้วรายชื่อว่าง (เซิร์ฟเวอร์คืน 0 แถว)
  //   กระดิ่งแจ้งเตือนยังตั้งตัวกรองอื่นได้ (เงียบ N+ วัน · รถใหม่ตรง) → dropdown มีตัวเลือกที่ 6 ชื่อตัวกรองนั้น (ไม่กรองแบบมองไม่เห็น)
  const FLT_OPTS = [['', 'รวมทุกช่องทาง'], ['fb', 'Facebook'], ['line', 'LINE@'], ['tiktok', 'TikTok'], ['aw', 'รอตอบกลับ']];
  const FLT_LABEL = { awaiting: () => 'รอตอบกลับ', silent: v => 'เงียบ ' + v + '+ วัน', carmatch: () => 'รถใหม่ตรง' };
  const fltLabel = (k, v) => (FLT_LABEL[k] ? FLT_LABEL[k](v) : 'ตัวกรองอื่น');
  function activeFilters() {
    const out = Object.keys(S.f).map(k => fltLabel(k, S.f[k]));
    if (S.src) { const o = FLT_OPTS.find(x => x[0] === S.src); out.push(o ? o[1] : S.src); }
    return out;
  }
  // ค่าที่ dropdown ควรโชว์ — นอกเหนือ 5 ตัวเลือก (ตัวกรองจากกระดิ่ง) = '_x'
  function fltValue() {
    const ks = Object.keys(S.f);
    if (!ks.length) return S.src || '';
    return ks.length === 1 && S.f.awaiting === '1' && !S.src ? 'aw' : '_x';
  }
  function clearFilters() {
    S.f = {}; S.src = ''; S.seller = 0;
    renderFilter(); loadInbox(true);
  }
  function renderFilter() {
    const el = $('cn-fsel'); if (!el) return;
    const v = fltValue();
    const opts = v === '_x' ? FLT_OPTS.concat([['_x', activeFilters().join(' · ')]]) : FLT_OPTS;
    const sig = opts.map(o => o.join('=')).join('|');
    // รายชื่อรีเฟรชทุก 8 วิ — กำลังกางเลือกอยู่ = ไม่วาดทับ (dropdown ที่กางอยู่จะปิดเอง)
    if (document.activeElement === el) return;
    if (el.dataset.sig !== sig) { el.dataset.sig = sig; el.innerHTML = opts.map(o => `<option value="${o[0]}">${h(o[1])}</option>`).join(''); }
    el.value = v;
    el.classList.toggle('act', v !== '');
  }

  // ── ★ 11 ต.ค.69 กระดิ่งแจ้งเตือน (สเปกข้อ 7) — ทุก 30 วิ ──
  async function loadAlerts() {
    let d;
    try { d = await api('/connect/api/alerts'); } catch (e) { return; }
    if (!d || !d.ok) return;
    S.alerts = d;
    const n = $('cn-bell-n');
    if (n) { n.hidden = !d.count; n.textContent = d.count > 99 ? '99+' : String(d.count || ''); }
    if (!$('cn-alerts').hidden) paintAlerts();
  }
  function paintAlerts() {
    const el = $('cn-alerts'), A = S.alerts || { items: [] };
    el.innerHTML = `<div class="hd">${ic('bell', 15)} แจ้งเตือน <span class="cn-sp"></span><button class="btn sm" id="cn-al-x">ปิด</button></div>`
      + ((A.items || []).length ? A.items.map((it, i) => `<div class="cn-al ${h(it.level)}" data-al="${i}"><i></i><div>${h(it.text)}</div></div>`).join('')
         : `<div class="cn-empty" style="padding:22px">ไม่มีอะไรค้าง 👍</div>`);
    $('cn-al-x').onclick = () => { el.hidden = true; };
    el.querySelectorAll('[data-al]').forEach(x => x.onclick = () => {
      const it = A.items[+x.dataset.al]; el.hidden = true;
      if (S.panel !== 'inbox') setPanel('inbox');
      if (it.id) { openChat(it.id); return; }
      if (it.view) { S.f = {}; S.src = ''; renderFilter(); pickTab(it.view); return; }
      if (it.filter) {
        S.f = Object.assign({}, it.filter); S.src = ''; renderFilter();
        pickTab(ADMIN ? 'all' : 'mine');
      }
    });
  }
  $('cn-bell').onclick = (e) => {
    e.stopPropagation();
    const el = $('cn-alerts'); el.hidden = !el.hidden;
    if (!el.hidden) { paintAlerts(); loadAlerts(); }
  };
  document.addEventListener('click', (e) => {
    const el = $('cn-alerts');
    if (el && !el.hidden && !el.contains(e.target) && e.target !== $('cn-bell')) el.hidden = true;
  });

  // ── ห้องพัก Lead (กลุ่ม LINE "ADMIN เก็บ Lead") — ลีดภายนอก (TikTok/FB/เบอร์กลาง …) ที่พักใบร่างไว้ (leadpark.py) ──
  //   จ่ายเบอร์ได้จากตรงนี้ (★ 6 ต.ค.69 ส่งใบเข้ากลุ่มจ่ายเบอร์จริง + แท็กเซลล์ · ไม่ลงชีต) · เลขรันชุดเดียวกับลูกค้า LINE OA
  //   หรือแอดมินโพสต์ใบจริง (เลข + @เซลล์) ในห้องจ่ายเบอร์เองก็ได้ — ระบบจับคู่ด้วยเบอร์/ID LINE แล้วเอาออกจากรายการเอง
  const fmtWait = m => m >= 60 ? Math.floor(m / 60) + ' ชม. ' + (m % 60) + ' นาที' : m + ' นาที';
  const srcTag = s => chTag(s in CH_CLS ? s : 'other');
  S.parkOpen = new Set(); S.parkDraft = {};
  const pWho = i => i.account || i.name || i.lineId || i.phone || '(ไม่มีชื่อ)';

  // ── ★ 10 ต.ค.69 งานจ่ายเบอร์ (leadflow.py) ──
  //   เบอร์ซ้ำ: สมุดเบอร์ (ชีตลีดทั้งปี + ใบในห้องจ่ายเบอร์ + ปุ่มจ่ายเบอร์) บอก "เคยเป็นลีดของใคร" ก่อนกดจ่าย
  //   คิวจ่ายวน: คนได้ใบน้อยสุดวันนี้ก่อน (ตัดคนหยุด/เต็มเพดาน) — กดชื่อ = เลือกเซลล์คนนั้นในกล่อง
  function dupHtml(dp) {
    if (!dp) return '';
    return `<div class="pf-dup">${ic('alert', 13)} เบอร์นี้เคยเป็นลีด <b>${h(dp.code || '-')}</b> ของ <b>@${h(dp.seller || 'ไม่ทราบ')}</b>${
      dp.date ? ' (' + h(fmtDay(dp.date)) + ')' : ''}${dp.more ? ` · และอีก ${dp.more} ครั้ง` : ''}
      — ลูกค้าคนเดียวไม่ควรได้เซลล์ 2 คน${dp.sellerId ? `<br><button class="hub-sel" data-pick="${dp.sellerId}">จ่ายให้ @${h(dp.seller)} (เจ้าของเดิม)</button>` : ''}</div>`;
  }
  // ★ 18 ต.ค.69 จ่ายแล้วหรือยัง: ใบจ่ายลีดที่ตรงแค่ชื่อ (ชื่อซ้ำกันได้) / ID LINE เคยได้เลข
  function maybeHtml(ch) {
    let t = '';
    if (ch.lidDup) t += `<div class="pf-dup">${ic('alert', 13)} ID LINE นี้เคยได้เลข <b>${h(ch.lidDup.code || '-')}</b> (${h(ch.lidDup.where || '')}) — ลูกค้าเก่า ตรวจก่อนจ่ายใหม่</div>`;
    if (ch.maybe) t += `<div class="pf-dup">${ic('alert', 13)} ชื่อตรงกับใบจ่ายลีด <b>${h(ch.maybe.code || '-')}</b>${ch.maybe.tag ? ' (@' + h(ch.maybe.tag) + ')' : ''}${ch.maybe.at ? ' · ' + h(fmtWhen(ch.maybe.at)) : ''} — อาจจ่ายไปแล้ว (เบอร์/ID LINE ไม่ตรงหรือไม่มี)</div>`;
    return t;
  }
  function rrHtml(rr) {
    if (!rr || !rr.length) return '';
    return `<div class="lf-rr">คิวจ่ายวน:${rr.map((x, i) => `<button class="hub-sel" data-pick="${x.id}" title="วันนี้ได้ไป ${x.today} ใบ">${i === 0 ? '▶ ' : ''}${h(x.name)} <b>${x.today}</b></button>`).join('')}</div>`;
  }
  // ปุ่ม data-pick ในกล่อง = เลือกเซลล์คนนั้นใน select ของกล่องเดียวกัน
  function bindPick(box) {
    box.querySelectorAll('[data-pick]').forEach(b => b.onclick = ev => {
      ev.preventDefault();
      const sel = box.querySelector('[data-x="emp"]'); if (!sel) return;
      sel.value = b.dataset.pick; sel.dispatchEvent(new Event('change'));
    });
  }
  // นาฬิกาโทร — ต้องรายงานผลภายใน call_min นาทีหลังใบถึงกลุ่ม (นับเฉพาะเวลาทำการ)
  function taskClock(dueIso) {
    if (!dueIso) return { cls: '', text: '' };
    const left = Date.parse(dueIso) - nowMs();
    if (left <= 0) return { cls: 'late', text: 'เลยเวลา ' + Math.max(1, Math.round(-left / 60000)) + ' นาที' };
    const lim = (((S.leadflow || {}).cfg || {}).callMin || 15) * 60000;
    if (left > lim + 30000) {
      const st = new Date(Date.parse(dueIso) - lim);
      return { cls: 'wait', text: 'เริ่มนับ ' + pad(st.getHours()) + ':' + pad(st.getMinutes()) };
    }
    return { cls: 'wait', text: 'เหลือ ' + fmtLeft(left) };
  }
  const LF_KIND = { reported: ['ok', 'รายงานผลแล้ว'], passed: ['late', 'ขอผ่าน'], unsent: ['late', 'ใบยังไม่ถึงกลุ่ม'],
                    demo: ['', 'ทดลอง (ไม่ได้ส่งเข้ากลุ่ม)'] };
  function taskTag(t) {
    if (!t) return '';
    if (t.kind === 'overdue' || t.kind === 'waiting') {
      const ck = taskClock(t.dueAt);
      return `<span class="tag ${ck.cls}" data-tdue="${h(t.dueAt)}">${ic('clock', 12)} <span class="ck">${h(ck.text)}</span></span>`;
    }
    const k = LF_KIND[t.kind] || ['', t.kind];
    return `<span class="tag ${k[0]}">${h(k[1])}${t.kind === 'reported' && t.reports > 1 ? ' ' + t.reports + ' ครั้ง' : ''}</span>`;
  }

  function parkBoxHtml(i, ch) {
    const keys = (ch.bases || []).map(b => b.key);
    const sugBase = keys.includes(i.base) ? i.base : (i.source === 'tiktok' ? 'TLD' : 'NLD');
    const dr = S.parkDraft[i.id] || { base: sugBase, emp: 0, admin: !!i.admin, reject: !!i.reject };
    const bases = (ch.bases || []).map(b => `<option value="${h(b.key)}"${b.key === dr.base ? ' selected' : ''}>${h(b.key)} · ${h(b.type)}</option>`).join('');
    const sellers = S.sellers.map(s => `<option value="${s.id}"${s.id === dr.emp ? ' selected' : ''}>${h(s.name)} · ทีม ${h(s.team)}</option>`).join('');
    return `<div class="pf-assign" data-park="${h(i.id)}">
      ${dupHtml(i.dup)}${rrHtml(((S.leadflow || {}).rr) || [])}
      <div class="pf-g2">
        <div class="pf-fld"><div class="pf-lab"><span>ตัวหน้า</span></div><select data-x="base">${bases}</select></div>
        <div class="pf-fld"><div class="pf-lab"><span>จ่ายให้เซลล์</span></div><select data-x="emp"><option value="">— เลือก —</option>${sellers}</select></div>
      </div>
      <label class="ck"><input type="checkbox" data-x="admin"${dr.admin ? ' checked' : ''}> A — ลีดของแอดมิน</label>
      <label class="ck"><input type="checkbox" data-x="reject"${dr.reject ? ' checked' : ''}> R — เคสรีเจ็ค</label>
      <div style="color:var(--t3);font-size:12px">เลขที่จะได้: <span class="pf-code" data-x="preview"></span></div>
      ${postNoteHtml(ch.post || { on: false }, 'จดว่าจ่ายให้เซลล์คนไหน')}
      <button class="btn pri" data-pact="assign" style="width:100%">${ch.post && ch.post.on ? 'จ่ายเบอร์ + ส่งเข้ากลุ่ม' : 'จ่ายเบอร์'}</button>
      <button class="btn sm" data-pact="skip" style="width:100%;margin-top:6px" title="ลีดซ้ำ / ไม่ใช่ลีดขาย — เอาออกจากรายการรอเลข">ไม่ต้องจ่ายเบอร์ (ลีดซ้ำ/ไม่ใช่ลีดขาย)</button>
    </div>`;
  }

  // ── ห้องพัก Lead = ศูนย์กระจายลีด "ทุกช่องทาง" (4 ต.ค.69 · เจ้าของ: "ควรทำที่พัก lead จากทุกช่องทาง
  //    เพื่อเป็นศูนย์กระจายให้แอดมินจ่าย") — รวม 2 แหล่งในรายการเดียว เรียงรอนานสุดขึ้นก่อน:
  //    ① ลูกค้าแชท LINE / Facebook ที่คุยในระบบแล้วยังไม่มีเลข → กดเปิดแชท แล้วจ่ายเบอร์ในแผงขวา
  //    ② ใบร่างที่แอดมินพักไว้ในกลุ่ม "ADMIN เก็บ Lead" (TikTok / FB / เบอร์กลาง …) → กดกาง แล้วจ่ายเบอร์ได้เลย
  const SRC_KEY = { line: 'line', fb: 'fb', facebook: 'fb', tiktok: 'tiktok', other: 'other' };
  const SRC_LABEL = { line: 'LINE', fb: 'Facebook', tiktok: 'TikTok', other: 'อื่นๆ' };

  function parkItemHtml(i, P, ch) {
    const mins = Math.max(0, Math.floor((nowMs() - Date.parse(i.at)) / 60000));
    const late = mins >= (P.warnMin || 30);
    const det = [['ID LINE', i.lineId], ['เบอร์โทร', i.phone ? fmtPhone(i.phone) : ''], ['ช่องทาง', i.channel],
                 ['รถ', i.car], ['ไลฟ์', i.live], ['Ads', i.ads], ['เพิ่มเติม', i.more]]
      .filter(x => x[1]).map(x => `${h(x[0])}: <b>${h(x[1])}</b>`).join('<br>');
    return `<details class="cn-prow" data-pk="${h(i.id)}"${S.parkOpen.has(i.id) ? ' open' : ''}><summary>
      <div class="cn-rh"><span class="cn-rn">${h(pWho(i))}</span>${srcTag(i.source)}<span class="tag code">${ic('hash', 12)} ${h(i.prefix)}</span></div>
      <div class="cn-rp">${h([i.car, i.channel].filter(Boolean).join(' · ') || '—')}</div>
      <div class="cn-rm"><span class="tag q">ใบร่างในห้องพัก</span>${i.phone ? `<span class="tag">โทร ${h(fmtPhone(i.phone))}</span>` : ''}
        <span class="tag">พักโดย ${h(i.by || '-')}</span>${i.reposts ? `<span class="tag">โพสต์ซ้ำ ${i.reposts}</span>` : ''}
        <span class="tag ${late ? 'late' : 'wait'}">${ic('clock', 12)} รอเลข ${h(fmtWait(mins))}</span></div>
    </summary>${det ? `<div class="pv">${det}</div>` : ''}${parkBoxHtml(i, ch)}</details>`;
  }

  // ── "จ่ายแล้ว" (4 ต.ค.69 · เจ้าของ: "หลีดบางตัวก็จ่ายไปแล้ว บางตัวก็ยังไม่จ่าย อยากรู้ว่าจ่ายให้ใครบ้าง") ──
  //   รวม 2 แหล่ง: แชท LINE/FB ที่ได้เลขแล้ว (S.assigned · จากปุ่มจ่ายเบอร์ในระบบ หรือใบจ่ายลีดในกลุ่มที่ระบบจับคู่ให้)
  //   + ใบร่างในห้องพักที่ได้เลขแล้ว (P.assigned) · ช่วง: วันนี้ / 7 วัน · กดชื่อเซลล์ในแถบสรุป = กรองเฉพาะคนนั้น
  S.hubTab = 'wait'; S.doneRange = 'today'; S.doneSeller = '';
  const UNKNOWN_SELLER = 'ไม่ทราบ';

  function doneItems(withSeller) {
    const P = S.parked || {};
    const out = (S.assigned || []).map(r => ({ kind: 'chat', id: r.id, name: r.name, src: SRC_KEY[r.src] || 'line', pic: r.pic,
      code: r.code, seller: r.seller || '', by: r.by || '', at: r.at, how: r.how || '', buy: r.kind === 'buy' }));
    (P.assigned || []).forEach(i => {
      // sp = ผลส่งใบเข้ากลุ่มของปุ่มจ่ายเบอร์ในระบบ (6 ต.ค.69) — ส่งสำเร็จแล้วใบนั้นก็จับคู่เป็น "ใบในห้อง" (real) ด้วย
      const real = i.code, sys = i.sys || null, sp = sys && sys.post;
      const failed = !!(sp && !sp.ok && !real && !(sp.sending && !sp.error));
      out.push({ kind: 'park', name: pWho(i), src: SRC_KEY[i.source] || 'other', pic: '',
        code: real || (sys && sys.code) || '',
        seller: real ? (i.sellerNick || i.seller || '') : ((sys && sys.seller) || ''),
        by: real ? (i.assignedBy || '') : ((sys && sys.by) || ''), at: i.doneAt || '',
        how: sp && sp.ok ? 'ระบบ → ส่งเข้ากลุ่มแล้ว' : i.sheetMatch ? (i.assignedRoom || 'ชีตลีด (จ่ายนอกระบบ)') : real ? 'ใบในห้องจ่ายเบอร์'
          : failed ? 'ระบบ (ส่งเข้ากลุ่มไม่สำเร็จ)' : ('ระบบ' + (sys && sys.demo ? ' (ทดลอง)' : '')),
        slip: sys && !real ? i.id : '', repost: failed ? i.id : '', err: failed ? (sp.error || '') : '',
        extra: sys && real && sys.code !== real ? 'เลขทดลอง ' + sys.code : '' });
    });
    const today = new Date(nowMs()).toLocaleDateString('sv-SE');
    const q = (S.q || '').trim().toLowerCase();
    return out.filter(x => x.at && x.code)
      .filter(x => S.doneRange !== 'today' || new Date(x.at).toLocaleDateString('sv-SE') === today)
      .filter(x => !S.src || x.src === S.src)
      .filter(x => !q || [x.name, x.code, x.seller, x.by].some(v => (v || '').toLowerCase().includes(q)))
      .filter(x => !withSeller || !S.doneSeller || (x.seller || UNKNOWN_SELLER) === S.doneSeller)
      .sort((a, b) => Date.parse(b.at) - Date.parse(a.at));
  }

  function doneCardHtml(x) {
    const chat = x.kind === 'chat';
    return `<div class="${chat ? 'cn-row' : 'cn-prow'} hub-done"${chat ? ` data-id="${x.id}" title="เปิดแชท"` : ''}>
      ${chat ? avHtml(x.name, x.pic) : ''}
      <div class="cn-rb">
        <div class="cn-rh"><span class="cn-rn">${h(x.name)}</span><span class="cn-rt">${h(fmtWhen(x.at))}</span></div>
        <div class="hub-to">${x.buy ? 'ส่งจัดซื้อ' : 'จ่ายให้'} <b>${x.seller ? '@' + h(x.seller) : UNKNOWN_SELLER}</b>${
          x.buy ? ' <span style="color:var(--t3);font-size:12px">· ลูกค้าอยากขายรถให้เรา</span>' : ''}</div>
        <div class="cn-rm">${chTag(x.src)}<span class="tag ok">${ic('hash', 12)} ${h(x.code)}</span>
          <span class="tag${x.repost || /ไม่สำเร็จ/.test(x.how || '') ? ' late' : ''}"${x.err ? ` title="${h(x.err)}"` : ''}>${h(x.how)}${x.by ? ' · โดย ' + h(x.by) : ''}</span>${x.extra ? `<span class="tag">${h(x.extra)}</span>` : ''}
          ${x.repost ? `<button class="btn sm pri" data-prepost="${h(x.repost)}" title="${h(x.err || '')}">ส่งเข้ากลุ่มอีกครั้ง</button>` : ''}
          ${x.slip ? `<button class="btn sm" data-slip="${h(x.slip)}">คัดลอกใบจ่ายลีด</button>` : ''}</div>
        ${x.err ? `<div style="color:var(--red);font-size:12px;margin-top:4px">${h(x.err)}</div>` : ''}
      </div></div>`;
  }

  // ── ★ 10 ต.ค.69 แท็บ "นาฬิกาโทร" — ใบจ่ายลีดวันนี้ทุกใบ (ปุ่มในระบบ + ใบที่แอดมินโพสต์เอง) ──
  //   เซลล์พิมพ์ "เลขรัน + ผล" ในห้องจ่ายเบอร์ (หรือตอบลูกค้าผ่าน Connect) = นาฬิกาหยุด
  //   ระบบรู้ไม่ได้ว่าโทรจริงไหม — วัดจาก "รายงานผล" เท่านั้น
  S.clockFilter = 'open';
  const lfLate = () => ((S.leadflow || {}).tasks || []).filter(t => t.kind === 'overdue' || t.kind === 'passed').length;
  function clockRowHtml(t) {
    const fwdable = t.chatId || t.extId;
    const sellers = S.sellers.filter(s => s.id !== t.sellerId).map(s => `<option value="${s.id}">${h(s.name)}</option>`).join('');
    return `<div class="lf-row">
      <div class="cn-rh"><span class="cn-rn">${h(t.code)}</span>${taskTag(t)}<span class="cn-rt">${h(fmtWhen(t.postedAt))}</span></div>
      <div class="hub-to">@<b>${h(t.seller || 'ไม่ทราบ')}</b>${t.customer ? ' · ' + h(t.customer) : ''}${t.car ? ' · ' + h(t.car) : ''}</div>
      <div class="cn-rm"><span class="tag">${t.source === 'system' ? 'จ่ายผ่านระบบ' : 'ใบในห้องจ่ายเบอร์'}${t.by ? ' · ' + h(t.by) : ''}</span>
        ${t.ackedAt ? `<span class="tag ok">กดรับเคส ${h(fmtWhen(t.ackedAt))}</span>` : ''}
        ${t.history && t.history.length ? `<span class="tag">เคยจ่ายให้ ${h(t.history.join(', '))}</span>` : ''}</div>
      ${t.lastReport ? `<div class="lf-line" style="margin-top:4px">รายงานล่าสุด: <b>${h(t.lastReport)}</b></div>` : ''}
      <div class="lf-acts">
        ${t.chatId ? `<button class="btn sm" data-open="${t.chatId}">เปิดแชท</button>` : ''}
        ${t.canReassign && /overdue|passed|waiting|unsent/.test(t.kind) ? `<button class="btn sm" data-lfre="${t.id}">จ่ายใหม่ (คนถัดไปในคิว)</button>` : ''}
        ${fwdable && t.kind !== 'demo' ? `<select data-lffw-emp="${t.id}"><option value="">ไม้ 2 ให้…</option>${sellers}</select>
          <button class="btn sm" data-lffw="${t.id}">ส่งต่อไม้ 2</button>` : ''}
      </div></div>`;
  }
  function clockHubHtml(seg) {
    const L = S.leadflow || {}, all = L.tasks || [], c = L.cfg || {};
    const open = t => /overdue|waiting|passed|unsent/.test(t.kind);
    const rows = all.filter(t => S.clockFilter === 'all' || open(t));
    const n = k => all.filter(t => t.kind === k).length;
    return `<div class="cn-park">
        <div class="cn-park-h">${ic('inbox')} ห้องพัก Lead ${seg}</div>
        <div class="cn-park-f" style="padding-top:0">ใบจ่ายลีดวันนี้ ${all.length} ใบ · เลยเวลา <b>${n('overdue')}</b> · ขอผ่าน <b>${n('passed')}</b>
          · รอรายงาน ${n('waiting')} · รายงานแล้ว ${n('reported')}
          <br>เซลล์ต้องรายงานผลภายใน <b>${c.callMin || 15} นาที</b> หลังใบถึงกลุ่ม — พิมพ์ "เลขรัน + ผล" ในห้องจ่ายเบอร์ หรือตอบลูกค้าผ่าน Connect = นาฬิกาหยุด
          ${c.cardOn ? '· แนบการ์ดปุ่ม รับเคส/ขอผ่าน ต่อท้ายใบ' : ''}${c.autoPull ? ' · เลยเวลา/ขอผ่าน = จ่ายใหม่อัตโนมัติ' : ''}
          <div class="hub-seg" style="margin-top:6px"><button class="btn sm${S.clockFilter === 'open' ? ' pri' : ''}" data-clf="open">ยังไม่รายงาน</button>
            <button class="btn sm${S.clockFilter === 'all' ? ' pri' : ''}" data-clf="all">ทั้งหมดวันนี้</button></div>
          ${rrHtml(L.rr)}</div>
      </div>
      ${rows.map(clockRowHtml).join('') || '<div class="cn-empty">ไม่มีใบที่ค้างรายงานผล 👍</div>'}`;
  }
  function bindClock(el) {
    el.querySelectorAll('[data-clf]').forEach(b => b.onclick = () => { S.clockFilter = b.dataset.clf; renderList(); });
    el.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openChat(+b.dataset.open));
    el.querySelectorAll('.lf-rr [data-pick]').forEach(b => b.onclick = ev => ev.preventDefault());
    el.querySelectorAll('[data-lfre]').forEach(b => b.onclick = async () => {
      if (!confirm('จ่ายใบนี้ใหม่ให้คนถัดไปในคิวจ่ายวน (เลขเดิม · ใบเดิม แท็กคนใหม่)?')) return;
      b.disabled = true;
      const r = await api('/connect/api/leadflow', { action: 'reassign', task: +b.dataset.lfre });
      b.disabled = false; toast(r.ok ? r.message : (r.error || 'ไม่สำเร็จ'), 7000);
      loadInbox(false);
    });
    el.querySelectorAll('[data-lffw]').forEach(b => b.onclick = async () => {
      const t = ((S.leadflow || {}).tasks || []).find(x => x.id === +b.dataset.lffw); if (!t) return;
      const emp = +(el.querySelector(`[data-lffw-emp="${t.id}"]`).value || 0);
      if (!emp) { toast('เลือกเซลล์ไม้ 2 ก่อน'); return; }
      const nm = (S.sellers.find(s => s.id === emp) || {}).name || '';
      if (!confirm(`ส่งต่อไม้ 2 ของ ${t.code} ให้ ${nm}\n(เลขใหม่ R…/1 · ใบเข้าห้องจ่ายเบอร์ REJECT พร้อมแท็ก)?`)) return;
      b.disabled = true;
      const r = await api('/connect/api/leadflow', t.chatId ? { action: 'forward', id: t.chatId, emp }
                                                            : { action: 'forward', mid: t.extId, emp });
      b.disabled = false; toast(r.ok ? r.message : (r.error || 'ไม่สำเร็จ'), 8000);
      loadInbox(false);
    });
  }

  function hubHtml() {
    if (!(ADMIN && S.view === 'tocode')) return '';
    const P = S.parked || {}, ch = P.codeHelp || {};
    const items = [];
    S.rows.forEach(r => items.push({ t: Date.parse(r.since || r.lastAt || '') || 0, src: SRC_KEY[r.src] || 'line', html: rowHtml(r) }));
    (P.waiting || []).filter(i => !S.src || SRC_KEY[i.source] === S.src)
      .forEach(i => items.push({ t: Date.parse(i.at) || 0, src: SRC_KEY[i.source] || 'other', html: parkItemHtml(i, P, ch) }));
    items.sort((x, y) => x.t - y.t);                     // รอนานสุดขึ้นก่อน (ไม่ว่ามาจากช่องทางไหน)
    const doneAll = doneItems(false);
    const rangeL = S.doneRange === 'today' ? 'วันนี้' : '7 วัน';
    const seg = `<span class="hub-seg">
        <button class="cn-tab${S.hubTab === 'wait' ? ' on' : ''}" data-hub="wait">${ic('clock')} รอจ่ายเบอร์ <span class="n">${items.length}</span></button>
        <button class="cn-tab${S.hubTab === 'done' ? ' on' : ''}" data-hub="done">${ic('check')} จ่ายแล้ว${rangeL === 'วันนี้' ? 'วันนี้' : ' 7 วัน'} <span class="n">${doneAll.length}</span></button>
        <button class="cn-tab${S.hubTab === 'clock' ? ' on' : ''}" data-hub="clock">${ic('clock')} นาฬิกาโทร <span class="n">${lfLate()}</span></button>
      </span>`;

    if (S.hubTab === 'clock') return clockHubHtml(seg);

    if (S.hubTab === 'done') {
      const by = {};
      doneAll.forEach(x => { const k = x.seller || UNKNOWN_SELLER; by[k] = (by[k] || 0) + 1; });
      const sum = Object.entries(by).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'th')).map(([k, n]) =>
        `<button class="hub-sel${S.doneSeller === k ? ' on' : ''}" data-dsel="${h(k)}">${k === UNKNOWN_SELLER ? h(k) : '@' + h(k)} <b>${n}</b></button>`).join('');
      const shown = doneItems(true);
      return `<div class="cn-park">
          <div class="cn-park-h">${ic('inbox')} ห้องพัก Lead ${seg}
            <span class="hub-seg"><button class="btn sm${S.doneRange === 'today' ? ' pri' : ''}" data-hubr="today">วันนี้</button><button class="btn sm${S.doneRange === '7d' ? ' pri' : ''}" data-hubr="7d">7 วัน</button></span></div>
          <div class="cn-park-f" style="padding-top:0">จ่ายให้ใครบ้าง${S.doneSeller ? ` — กรองเฉพาะ <b>${h(S.doneSeller)}</b> (กดชื่อเดิมอีกครั้งเพื่อดูทั้งหมด)` : ' — กดชื่อเพื่อดูเฉพาะคนนั้น'}
            · รวมทั้งที่จ่ายผ่านปุ่มในระบบ · ใบจ่ายเบอร์ในห้องจ่ายเบอร์ · และลูกค้าที่อยากขายรถที่ส่งเข้ากลุ่มเคสHOT ของจัดซื้อ (ระบบจับคู่ใบให้เองด้วยเบอร์/ชื่อ)</div>
          ${sum ? `<div class="hub-sum">${sum}</div>` : ''}
        </div>
        ${shown.map(doneCardHtml).join('') || `<div class="cn-empty">ยังไม่มีลีดที่จ่ายเบอร์${h(rangeL === 'วันนี้' ? 'วันนี้' : 'ใน 7 วัน')}</div>`}`;
    }

    const cnt = {};
    items.forEach(x => { cnt[x.src] = (cnt[x.src] || 0) + 1; });
    const chips = Object.keys(SRC_LABEL).filter(k => cnt[k]).map(k => chTag(k, cnt[k])).join(' ');
    const skipped = (P.skipped || []).map(i => `<div class="cn-prow"><div class="cn-rh"><span class="cn-rn">${h(pWho(i))}</span>${srcTag(i.source)}</div>
      <div class="cn-rm"><span class="tag">ซ่อนโดย ${h((i.skipped && i.skipped.by) || '-')}</span><button class="btn sm" data-unskip="${h(i.id)}">เอากลับมาจ่ายเบอร์</button></div></div>`).join('');
    const room = P.room ? `"${h(P.room)}"` : '"ADMIN เก็บ Lead" (บอทยังไม่ได้ยินห้องนี้)';
    return `<div class="cn-park">
        <div class="cn-park-h">${ic('inbox')} ห้องพัก Lead ${seg} <span style="font-weight:400">${chips}</span></div>
        <div class="cn-park-f" style="padding-top:0">ศูนย์กระจายลีดทุกช่องทาง — ใบร่างที่พักไว้ในกลุ่ม ${room} + แชท LINE / Facebook ที่${S.roomAuto ? '<b>ให้เบอร์หรือไอดีไลน์แล้ว</b>' : 'แอดมินกด <b>"รับ lead จากแชทนี้แล้ว"</b>'} แต่ยังไม่มีเลข
          · รอนานสุดขึ้นก่อน · แชท: เปิดแล้วจ่ายเบอร์ในแผงขวา · ใบร่าง: กดกางแล้วจ่ายได้เลย
          · แอดมินโพสต์ใบในห้องจ่ายเบอร์ หรือใบเคสรับซื้อ (โค้ด OC-…) ในกลุ่มเคสHOT แล้ว = ระบบจับคู่ให้เองภายในไม่กี่นาที แล้วย้ายไป "จ่ายแล้ว"</div>
      </div>
      ${items.map(x => x.html).join('') || '<div class="cn-empty">ไม่มีลีดรอจ่ายเบอร์ 👍</div>'}
      ${skipped ? `<div class="cn-park" style="border-top:.5px solid var(--bd2)">
        <details class="cn-prow" data-pk="skip"${S.parkOpen.has('skip') ? ' open' : ''}><summary class="cn-park-f" style="padding:0">ซ่อนไว้ (ไม่ต้องจ่ายเบอร์) ${(P.skipped || []).length} ราย ▾</summary>${skipped}</details>
      </div>` : ''}`;
  }

  function parkPreview(box) {
    const ch = (S.parked || {}).codeHelp || {}, q = k => box.querySelector(`[data-x="${k}"]`);
    q('preview').textContent = (q('reject').checked ? 'R' : '') + (q('admin').checked ? 'A' : '') + q('base').value + (ch.month || '') + '-' + (ch.next || '…');
  }

  function bindPark(el) {
    el.querySelectorAll('details[data-pk]').forEach(d => d.addEventListener('toggle', () => {
      if (d.open) S.parkOpen.add(d.dataset.pk); else S.parkOpen.delete(d.dataset.pk);
    }));
    el.querySelectorAll('[data-park]').forEach(box => {
      const id = box.dataset.park, q = k => box.querySelector(`[data-x="${k}"]`);
      box.querySelectorAll('[data-x]').forEach(x => x.addEventListener('change', () => {
        S.parkDraft[id] = { base: q('base').value, emp: +(q('emp').value || 0), admin: q('admin').checked, reject: q('reject').checked };
        parkPreview(box);
      }));
      parkPreview(box);
      bindPick(box);
      box.querySelector('[data-pact=assign]').onclick = async ev => {
        const emp = +(q('emp').value || 0);
        if (!emp) { toast('เลือกเซลล์ที่จะจ่ายเบอร์ให้ก่อน'); return; }
        const P = ((S.parked || {}).codeHelp || {}).post || {};
        const it0 = ((S.parked || {}).waiting || []).find(x => x.id === id) || {};
        const nm = (S.sellers.find(s => s.id === emp) || {}).name || '';
        if (it0.dup && it0.dup.sellerId && it0.dup.sellerId !== emp
            && !confirm(`เบอร์นี้เคยเป็นลีด ${it0.dup.code || ''} ของ @${it0.dup.seller}\nยังจะจ่ายให้ ${nm} อีกคนใช่ไหม?`)) return;
        if (P.on) {                              // ส่งเข้ากลุ่มจริง = ทั้งห้องเห็น — ถามก่อนทุกครั้ง
          const room = q('reject').checked && P.rejectRoom ? P.rejectRoom : P.room;
          if (!confirm(`จ่ายเบอร์ ${q('preview').textContent} ให้ ${nm}\nแล้วส่งใบเข้า "${room || 'กลุ่มจ่ายเบอร์'}" พร้อมแท็ก @${nm} ?`)) return;
        }
        ev.target.disabled = true;
        const r = await api('/connect/api/park_assign', { mid: id, emp, base: q('base').value,
          admin: q('admin').checked, reject: q('reject').checked });
        ev.target.disabled = false;
        toast(r.ok ? r.message : (r.error || 'จ่ายเบอร์ไม่สำเร็จ'), r.post && !r.post.ok ? 9000 : 6000);
        if (r.ok) { delete S.parkDraft[id]; S.parkOpen.delete(id); S.parkOpen.add('done'); loadInbox(false); }
      };
      box.querySelector('[data-pact=skip]').onclick = async ev => {
        ev.target.disabled = true;
        const r = await api('/connect/api/park_assign', { mid: id, skip: true });
        ev.target.disabled = false;
        toast(r.ok ? r.message : (r.error || 'ทำไม่สำเร็จ'));
        if (r.ok) { delete S.parkDraft[id]; S.parkOpen.delete(id); loadInbox(false); }
      };
    });
    el.querySelectorAll('[data-unskip]').forEach(b => b.onclick = async () => {
      const r = await api('/connect/api/park_assign', { mid: b.dataset.unskip, skip: false });
      toast(r.ok ? r.message : (r.error || 'ทำไม่สำเร็จ'));
      if (r.ok) loadInbox(false);
    });
    el.querySelectorAll('[data-prepost]').forEach(b => b.onclick = async ev => {   // ลีดภายนอก: ส่งเข้ากลุ่มอีกครั้ง
      ev.stopPropagation();
      b.disabled = true;
      const r = await api('/connect/api/park_assign', { mid: b.dataset.prepost, resend: true });
      b.disabled = false;
      toast(r.ok ? r.message : (r.error || 'ส่งไม่สำเร็จ'), 6000);
      loadInbox(false);
    });
    el.querySelectorAll('[data-slip]').forEach(b => b.onclick = () => {
      const it = ((S.parked || {}).assigned || []).find(x => x.id === b.dataset.slip);
      const t = it && it.sys ? it.sys.slip : '';
      try { navigator.clipboard.writeText(t); toast('คัดลอกใบจ่ายลีดแล้ว'); } catch (e) { toast('คัดลอกไม่ได้'); }
    });
  }

  function renderList() {
    if (S.panel === 'dist') { renderDist(); return; }
    $('cn-note').innerHTML = S.note ? `<div class="cn-note">${h(S.note)}</div>` : '';      // หน้าแชท = ตอบแชทอย่างเดียว (Run Auto อยู่ห้องพัก Lead)
    const el = $('cn-rows');
    const hub = hubHtml();
    if (hub) {
      // รายชื่อถูกวาดใหม่ทุก 8 วิ — กำลังเลือกตัวเลือกในกล่องจ่ายเบอร์อยู่ = ยังไม่วาด (dropdown ที่กางอยู่จะปิดเอง)
      //   ที่เลือกค้างไว้เก็บใน S.parkDraft · ลีดที่กางดูอยู่จำใน S.parkOpen — วาดใหม่แล้วไม่หาย
      const act = document.activeElement;
      if (act && el.contains(act) && /SELECT|INPUT|TEXTAREA/.test(act.tagName)) return;
      const top = el.scrollTop;
      el.innerHTML = hub;
      el.scrollTop = top;
      bindPark(el);
      bindClock(el);
      el.querySelectorAll('.cn-row').forEach(r => r.onclick = () => openChat(+r.dataset.id));
      el.querySelectorAll('[data-hub]').forEach(b => b.onclick = () => { S.hubTab = b.dataset.hub; el.scrollTop = 0; renderList(); });
      el.querySelectorAll('[data-hubr]').forEach(b => b.onclick = () => { S.doneRange = b.dataset.hubr; S.doneSeller = ''; renderList(); });
      el.querySelectorAll('[data-dsel]').forEach(b => b.onclick = () => {
        S.doneSeller = S.doneSeller === b.dataset.dsel ? '' : b.dataset.dsel; renderList(); });
      return;
    }
    if (!S.rows.length) {
      const empty = {
        queue: 'ไม่มีลูกค้ารอรับตอนนี้', tocode: 'ไม่มีลูกค้ารอจ่ายเบอร์ 👍',
        mine: ADMIN ? 'ยังไม่มีลูกค้าที่คุณดูแล' : 'ยังไม่มีลูกค้าของคุณ — กดรับจากแท็บ "รอรับ" ในวันเวรของทีม',
        owned: 'ยังไม่มีลูกค้าที่มีเจ้าของ', all: 'ยังไม่มีลูกค้าทักเข้ามา',
      }[S.view] || 'ไม่มีรายการ';
      if (S.note) { el.innerHTML = ''; return; }
      const fl = activeFilters().length;
      const msg = S.src === 'tiktok' ? 'ยังไม่มีแชท TikTok เข้าระบบ — แชทใน Connect ตอนนี้มาจาก LINE@ กับ Facebook'
        : (fl ? 'ไม่มีลูกค้าที่ตรงกับตัวกรอง' : empty);
      el.innerHTML = `<div class="cn-empty">${h(msg)}${fl ? `<div style="margin-top:10px"><button type="button" class="btn sm" id="cn-clr">ล้างตัวกรอง</button></div>` : ''}</div>`;
      if (fl) $('cn-clr').onclick = clearFilters;
      return;
    }
    const top = el.scrollTop;
    el.innerHTML = S.rows.map(rowHtml).join('');
    el.scrollTop = top;
    el.querySelectorAll('.cn-row').forEach(r => r.onclick = () => openChat(+r.dataset.id));
    el.querySelectorAll('[data-claim]').forEach(b => b.onclick = (e) => { e.stopPropagation(); claim(+b.dataset.claim); });
  }

  // ── โหลดรายชื่อ (ยกเลิกคำขอเก่าเมื่อมีคำขอใหม่ — บทเรียนเดิม "ตัวกรองค้าง") ──
  let _inAbort = null, _inSeq = 0;
  async function loadInbox(reset) {
    if (_inAbort) _inAbort.abort();
    const ac = new AbortController(); _inAbort = ac;
    const seq = ++_inSeq;
    const qs = new URLSearchParams();
    if (S.view) qs.set('view', S.view);
    if (S.q) qs.set('q', S.q);
    if (S.seller) qs.set('seller', S.seller);
    if (S.src) qs.set('src', S.src);
    // ★ 11 ต.ค.69 ตัวกรองหน้ารวมแชท — เฉพาะหน้ากล่องแชทรวม (ห้องพัก Lead ใช้ตัวโหลดเดียวกัน แต่ไม่ใช้ตัวกรองชุดนี้)
    if (S.panel === 'inbox') Object.keys(S.f || {}).forEach(k => qs.set(k, S.f[k]));
    if (reset) $('cn-rows').innerHTML = '<div class="cn-empty"><div class="spin"></div>กำลังโหลด…</div>';
    let d;
    try { d = await api('/connect/api/inbox?' + qs.toString(), undefined, ac.signal); }
    catch (e) { if (e.name === 'AbortError') return; d = { ok: false, error: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้' }; }
    if (seq !== _inSeq) return;
    if (!d.ok) { $('cn-rows').innerHTML = `<div class="cn-empty" style="color:var(--red)">${h(d.error || 'โหลดไม่สำเร็จ')}</div>`; return; }
    if (d.now) SKEW = Date.parse(d.now) - Date.now();
    Object.assign(S, { view: d.view, rows: d.rows || [], counts: d.counts || {}, duty: d.duty, onDuty: !!d.onDuty,
                       status: d.status || [], note: d.note || '', sellers: d.sellers || S.sellers, loaded: true,
                       parked: d.parked || null, assigned: d.assigned || [], leadflow: d.leadflow || S.leadflow || null,
                       pending: d.pending || [], pendingDays: d.pendingDays || S.pendingDays || 3,
                       buyRoom: d.buyRoom || [], buyRoomDays: d.buyRoomDays || S.buyRoomDays || 14, buyLast: d.buyLast || S.buyLast || {},
                       lfStrip: d.lfStrip || S.lfStrip || null, rrBoard: d.rrBoard || S.rrBoard || [],
                       roomAuto: d.roomAuto !== undefined ? !!d.roomAuto : !!S.roomAuto });
    renderTop(); renderTabs(); renderFilter(); renderList();
    if (S.openId && !S.chat && S.pane === 'chat') openChat(S.openId);
  }

  // ── แชท ──
  let _chAbort = null, _chSeq = 0;
  function showPane() { document.body.classList.add('pane'); }
  function hidePane() { document.body.classList.remove('pane'); }
  function renderBlank(msg) {
    $('cn-pane').innerHTML = `<div class="cn-blank">${h(msg || 'เลือกลูกค้าทางซ้ายเพื่อเปิดแชท')}</div>`;
  }

  async function openChat(id, keep) {
    if (!id) return;
    S.pane = 'chat';
    const switching = !S.chat || S.chat.row.id !== id;
    S.openId = id;
    if (switching && !keep) {
      $('cn-pane').innerHTML = `<div class="cn-blank"><div><div class="spin"></div>กำลังเปิดแชท…</div></div>`;
      S.chat = null;
    }
    document.querySelectorAll('.cn-row').forEach(r => r.classList.toggle('sel', +r.dataset.id === id));
    showPane();
    try { history.replaceState(null, '', '/connect/?id=' + id + (BOOT.embed ? '&embed=1' : '')); } catch (e) {}
    if (_chAbort) _chAbort.abort();
    const ac = new AbortController(); _chAbort = ac;
    const seq = ++_chSeq;
    let d;
