{% load static %}<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oxlet CRM</title>
<link rel="icon" type="image/png" href="{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
  (function(){
    try {
      var t = localStorage.getItem('oxlet_theme');
      if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e) { document.documentElement.setAttribute('data-theme','light'); }
  })();
</script>
{# ★ 13 ต.ค.69 หน้า Oxlet CRM (แบบ "Oxlet CRM.html") — CSS/JS ฝังในหน้านี้ทั้งหมด (ไม่ต้อง collectstatic) #}
<style>
:root{
  --fs-h:17px; --fs-sub:14.5px; --fs-body:13px;
  --bg:#f6f4fb; --card:#ffffff; --line:#ebe5f6; --line2:#e3dcf1; --col:#efebf7; --soft:#f7f4fd;
  --ink:#1c1830; --ink2:#56506b; --ink3:#6b6483;
  --brand:#7c3aed; --brand-d:#5b21b6; --brand-s:#f2ecfd; --brand-l:#a78bfa; --brand-xl:#ddd6fe;
  --side:#1f1633; --side-ink:#d6cdea; --side-mute:#a99cc6; --side-line:#3a2c5c; --side-hi:#2c2147;
  --ok:#15803d; --ok-s:#e7f6ec; --bad:#991b1b; --bad-s:#fdebeb; --warn:#92500a; --warn-s:#fcf2e1;
  --teal:#0f766e; --teal-s:#e6f6f4; --pink:#db2777; --on-brand:#ffffff;
  --hero:#f3eefe; --hero-grid:rgba(124,58,237,.07); --hero-line:#ddd2f6;
  --c-new:#c4b5fd; --c-contacted:#a78bfa; --c-viewing:#7c3aed; --c-finance:#5b21b6; --c-booked:#0d9488;
  --shadow:0 1px 2px rgba(31,22,51,.04);
}
html[data-theme="dark"]{
  --bg:#0d0a14; --card:#15111f; --line:#2a2338; --line2:#2a2338; --col:#120e1b; --soft:#1c1729;
  --ink:#f3f0fa; --ink2:#a39cb5; --ink3:#8c84a3;
  --brand:#8b5cf6; --brand-d:#c4b5fd; --brand-s:#2e2148; --brand-l:#a78bfa; --brand-xl:#3b2a66;
  --side:#0f0c18; --side-ink:#c9bfe0; --side-mute:#8c84a3; --side-line:#221c30; --side-hi:#1b1528;
  --ok:#86efac; --ok-s:rgba(74,222,128,.14); --bad:#fca5a5; --bad-s:rgba(248,113,113,.14); --warn:#fcd34d; --warn-s:rgba(252,211,77,.12);
  --teal:#5eead4; --teal-s:rgba(45,212,191,.12); --pink:#f472b6;
  --hero:#161027; --hero-grid:rgba(167,139,250,.07); --hero-line:#3a2d57;
  --c-new:#3b2a66; --c-contacted:#5b3fa0; --c-viewing:#7c5ad6; --c-finance:#a78bfa; --c-booked:#2dd4bf;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Noto Sans Thai','Segoe UI',sans-serif;font-size:var(--fs-body);line-height:1.45;font-variant-numeric:tabular-nums}
a{color:var(--brand-d);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.crm{display:flex;min-height:100vh;background:linear-gradient(90deg,var(--side) 0 232px,var(--bg) 232px)}
/* ── แถบซ้าย ── */
.side{width:232px;flex:none;background:var(--side);color:var(--side-ink);padding:20px 14px 14px;display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.side .logo{width:150px;height:auto;margin:0 0 4px 6px;border-radius:6px}
.side .tag{font-size:12px;color:var(--side-mute);margin:0 0 14px 10px;letter-spacing:.04em}
.nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--side-ink);font-size:var(--fs-sub);border:0;background:none;width:100%;text-align:left}
.nv:hover{background:var(--side-hi)}
.nv.on{background:var(--brand);color:#fff;font-weight:600}
.nv svg{flex:none}
.nv .bd{margin-left:auto;font-size:12px;padding:1px 8px;border-radius:6px;background:var(--brand-d);color:#fff;font-weight:600}
.nv:not(.on) .bd{background:#3b2a66;color:#ddd6fe}
.nv .bd.pink{background:var(--pink);color:#fff}
.side .sp{flex-grow:1;min-height:18px}
.picker{margin:2px 0 10px;padding:10px;border-radius:10px;background:var(--side-hi)}
.picker label{display:block;font-size:12px;color:var(--side-mute);margin-bottom:6px}
.picker select{width:100%;height:36px;border-radius:8px;border:1px solid var(--side-line);background:var(--side);color:#fff;padding:0 8px}
.foot{display:flex;align-items:center;gap:10px;padding:12px 6px 4px;border-top:1px solid var(--side-line)}
.av{width:34px;height:34px;border-radius:50%;background:var(--brand-s);color:var(--brand-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.foot .who{line-height:1.3;min-width:0}
.foot .who b{color:#fff;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot .who span{font-size:12px;color:var(--side-mute)}
.foot .ib{margin-left:auto;display:flex;gap:4px}
.ibtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--side-line);background:transparent;color:var(--side-ink);display:flex;align-items:center;justify-content:center}
.ibtn:hover{background:var(--side-hi)}
.links{display:flex;gap:10px;flex-wrap:wrap;padding:8px 8px 0;font-size:12px}
.links a{color:var(--side-mute)}
.links a:hover{color:#fff}
/* ── ส่วนหลัก ── */
.main{flex:1 1 auto;min-width:0;padding:22px 28px 36px;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.ph .t{flex:1 1 320px;min-width:0}
.eb{font-size:12px;font-weight:600;color:var(--brand);letter-spacing:.06em}
.ph h1{margin:4px 0 2px;font-size:28px;font-weight:700;letter-spacing:-.01em}
.ph .sub{color:var(--ink2);font-size:var(--fs-sub)}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--brand-l)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{height:32px;padding:0 11px;font-size:var(--fs-body)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{height:36px;padding:0 13px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:var(--fs-sub)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
.chip .n{opacity:.75;margin-left:4px}
.grow{flex-grow:1}
.muted{color:var(--ink2)}
.mini{font-size:12px;color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0;font-size:var(--fs-sub);font-weight:600}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ch a,.ch .lk{font-size:var(--fs-body);background:none;border:0;color:var(--brand-d);padding:0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.pill{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap}
.p-bad{background:var(--bad-s);color:var(--bad)}
.p-ok{background:var(--ok-s);color:var(--ok)}
.p-warn{background:var(--warn-s);color:var(--warn)}
.p-br{background:var(--brand-s);color:var(--brand-d)}
.p-teal{background:var(--teal-s);color:var(--teal)}
.p-mute{background:var(--soft);color:var(--ink3)}
.code{font-size:12px;font-weight:700;color:var(--brand-d);background:var(--brand-s);padding:1px 6px;border-radius:5px;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--line)}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--brand)}
.empty{padding:18px;text-align:center;color:var(--ink3);border:1.5px dashed var(--line2);border-radius:12px}
.err{padding:12px 14px;border-radius:10px;background:var(--bad-s);color:var(--bad)}
.note{padding:10px 12px;border-radius:10px;background:var(--warn-s);color:var(--warn);font-size:var(--fs-body)}
.load{padding:60px 0;text-align:center;color:var(--ink3)}
/* แดชบอร์ด */
.hero{position:relative;overflow:hidden;background:var(--hero);background-image:linear-gradient(var(--hero-grid) 1px,transparent 1px),linear-gradient(90deg,var(--hero-grid) 1px,transparent 1px);background-size:32px 32px;border:1px solid var(--hero-line);border-radius:16px;padding:22px 24px;display:flex;flex-wrap:wrap;gap:20px}
.hero .l{flex:1 1 280px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hero .r{flex:0 1 160px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;border-left:1px solid var(--hero-line);padding-left:20px}
.big{font-size:46px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.mid{font-size:22px;font-weight:700}
.n40{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1}
.seg{display:flex;height:10px;gap:3px}
.seg>i{border-radius:3px;min-width:4px}
.lg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px}
.lg>div{display:flex;align-items:center;gap:8px}
.lg .sw{width:8px;height:8px;border-radius:2px;flex:none}
.lg b{margin-left:auto}
.wk{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:26px}
.wk>div{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;min-width:0}
.wk .b{width:100%;border-radius:6px;background:var(--brand-l);opacity:.75}
.wk .b.today{background:var(--brand);opacity:1}
.wk .b.fc{border:1px dashed var(--brand-l);background:repeating-linear-gradient(135deg,var(--brand-s) 0 4px,transparent 4px 8px);opacity:1}
.wk .tip{position:absolute;top:-24px;background:var(--ink);color:var(--card);font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);color:var(--ink);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .ic{width:32px;height:32px;border-radius:8px;background:var(--brand-s);color:var(--brand-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.row .tx{flex:1 1 auto;min-width:0}
.row .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx span{display:block;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{text-align:right;flex:none}
.appt{background:var(--brand-s);border-color:var(--brand-xl)}
.appt .ttl{font-size:21px;font-weight:700;line-height:1.35}
.risk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--soft);border:0;width:100%;text-align:left;color:var(--ink)}
.clock{flex-grow:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:44px;font-weight:700;letter-spacing:.02em}
.clock.late{color:var(--bad)}
.rb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--soft);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.rb.pri{background:var(--brand);border:0;color:#fff}
/* ไปป์ไลน์ */
.board{overflow-x:auto;padding-bottom:6px}
.cols{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:14px;min-width:1240px}
.colm{background:var(--col);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;transition:outline-color .1s;outline:2px dashed transparent;outline-offset:-2px}
.colm.drop{outline-color:var(--brand)}
.colm .hd{display:flex;align-items:center;gap:8px;padding:2px 4px}
.colm .hd h2{margin:0;font-size:var(--fs-sub);font-weight:700}
.colm .hd .sw{width:10px;height:10px;border-radius:3px}
.colm .hd .n{margin-left:auto;color:var(--ink2)}
.colm .pr{height:4px;border-radius:2px;background:var(--brand-xl)}
.colm .pr>i{display:block;height:4px;border-radius:2px}
.kc{background:var(--card);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px;border:1px solid var(--line);color:var(--ink);text-align:left;width:100%}
.kc:hover{border-color:var(--brand-l)}
.kc[draggable="true"]{cursor:grab}
.kc.dragging{opacity:.45}
.kc.hl{border:2px solid var(--brand)}
.kc .top{display:flex;align-items:center;gap:6px;min-width:0}
.kc .chn{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kc .top .pill{margin-left:auto}
.kc .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .ds{font-size:var(--fs-body);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .bt{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--ink3)}
.kc .bt.bad{color:var(--bad)}
.kc .bt.br{color:var(--brand-d);font-weight:600}
.kc .src{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.more{border:1.5px dashed var(--line2);border-radius:12px;padding:12px;text-align:center;color:var(--ink3);background:none;width:100%}
.more:hover{border-color:var(--brand-l);color:var(--brand-d)}
/* ลูกค้า */
.cust{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tbl table{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:600;color:var(--ink3);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--soft)}
.tbl tbody tr.sel{background:var(--brand-s)}
.who2{display:flex;align-items:center;gap:10px;min-width:0}
.who2 b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.who2 span{display:block;font-size:12px;color:var(--ink3)}
.who2 span.av{display:flex;font-size:12px;color:var(--brand-d)}
.stg{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--brand-s);color:var(--brand-d);white-space:nowrap}
.pane{position:sticky;top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.pane .hdc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.pane .avl{width:64px;height:64px;font-size:20px}
.pane .nmb{font-size:20px;font-weight:700}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--soft);border-radius:10px;padding:10px 12px;min-width:0}
.tile .k{font-size:12px;color:var(--ink3)}
.tile .v{font-weight:700;font-size:var(--fs-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sect{font-weight:700;font-size:var(--fs-sub)}
.carx{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px}
.carx .ph{width:44px;height:32px;border-radius:6px;background:var(--brand-s);flex:none}
.carx .tx{flex:1;min-width:0}
.carx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{display:flex;flex-direction:column;gap:10px}
.tl>div{display:flex;gap:10px}
.tl .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--brand);flex:none;margin-top:4px}
.tl b{display:block;font-weight:600}
.frm{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;background:var(--soft)}
.frm .fr{display:flex;gap:8px}
.in{height:38px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;background:var(--card);width:100%;min-width:0}
textarea.in{height:64px;padding:8px 10px;resize:vertical}
.stgb{display:flex;flex-wrap:wrap;gap:6px}
.stgb button{height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--line2);background:var(--card);font-size:12px}
.stgb button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.srch{position:relative;flex:0 1 320px}
.srch input{width:100%;height:44px;border:1px solid var(--line2);border-radius:10px;padding:0 12px;background:var(--card)}
/* สต็อก */
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.carc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.carc .im{height:140px;background:var(--brand-s);position:relative;display:flex;align-items:center;justify-content:center;color:var(--brand-l)}
.carc .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.carc .bd2{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.carc b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carc .pr2{font-weight:700;color:var(--brand-d);font-size:var(--fs-sub)}
.carc .tg{position:absolute;top:8px;left:8px;display:flex;gap:4px}
/* รายงาน */
.segc{display:flex;padding:4px;gap:4px;border:1px solid var(--line2);border-radius:10px;background:var(--card)}
.segc button{height:36px;padding:0 14px;border-radius:7px;border:0;background:none;color:var(--ink2)}
.segc button.on{background:var(--brand);color:#fff;font-weight:600}
.k4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:16px}
.kp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kp .v{font-size:32px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.dl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)}
.fun{display:flex;flex-direction:column;gap:10px}
.fun .fh{display:flex;justify-content:space-between;font-size:var(--fs-body)}
.fun .fb{height:22px;border-radius:6px;background:var(--line)}
.fun .fb>i{display:block;height:100%;border-radius:6px}
.rk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk .no{width:18px;font-weight:700;color:var(--brand)}
.rk .bx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rk.me{background:var(--brand-s);border-radius:10px;padding:10px;border-bottom:0;margin:2px 0}
svg text{fill:var(--ink3);font-size:11px;font-family:inherit}
.chatwrap{flex:1;display:flex;flex-direction:column;min-height:0}
.chatwrap iframe{flex:1;width:100%;border:1px solid var(--line);border-radius:14px;background:var(--card);min-height:520px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:92vw}
.toast.bad{background:var(--bad);color:#fff}
@media (max-width:1320px){ .cust{grid-template-columns:minmax(0,1fr) 320px} .tbl th:nth-child(4),.tbl td:nth-child(4){display:none} .tbl td,.tbl th{padding-left:12px;padding-right:12px} }
@media (max-width:1000px){ .cust{grid-template-columns:minmax(0,1fr)} .pane{position:static;max-height:none} }
@media (max-width:900px){
  .crm{flex-direction:column;background:var(--bg)}
  .side{width:auto;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;align-items:center;padding:8px 10px;overflow-x:auto;gap:2px}
  .side .logo{width:84px;margin:0 6px 0 0}
  .side .tag,.side .sp,.picker label,.links,.foot .who{display:none}
  .nv{width:auto;flex:none;padding:8px 10px;white-space:nowrap}
  .picker{margin:0 4px;padding:0;background:none;flex:none}
  .picker select{width:120px;height:34px}
  .foot{border:0;padding:0 0 0 6px;flex:none}
  .main{padding:16px 14px 28px}
  .ph h1{font-size:24px}
  .big{font-size:36px}
  .hero .r{border-left:0;padding-left:0;flex-direction:row;flex-wrap:wrap}
  .tbl th:nth-child(4),.tbl td:nth-child(4),.tbl th:nth-child(5),.tbl td:nth-child(5){display:none}
}
</style>
</head>
<body>
{{ boot|json_script:"crm-boot" }}
<div class="crm">
  <nav class="side" id="side" aria-label="เมนูหลัก"></nav>
  <main class="main" id="main"><div class="load">กำลังโหลด…</div></main>
</div>
<script>
(function(){
'use strict';
const BOOT = JSON.parse(document.getElementById('crm-boot').textContent || '{}');
const LOGO = "{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}";
const PAGES = [
  {k:'dash', l:'แดชบอร์ด', i:'dash'},
  {k:'pipe', l:'ไปป์ไลน์ลีด', i:'pipe'},
  {k:'cust', l:'ลูกค้า', i:'users'},
  {k:'chat', l:'แชทลูกค้า', i:'chat'},
  {k:'stock', l:'สต็อกรถ', i:'car'},
  {k:'report', l:'รายงาน', i:'chart'},
];
const ICON = {
  dash:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
  pipe:'<rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="4" height="8" rx="1"/>',
  users:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7"/><path d="M17 4a4 4 0 0 1 0 8"/><path d="M22 21c0-3-1.5-5.5-4-6.5"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/>',
  car:'<path d="M5 17h14l-1.5-6.5A2 2 0 0 0 15.6 9H8.4a2 2 0 0 0-1.9 1.5z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  star:'<path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/>',
  prev:'<path d="M15 18l-6-6 6-6"/>',
  next:'<path d="M9 18l6-6-6-6"/>',
  sheet:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  ext:'<path d="M14 3h7v7"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
};
const ic = (k, s) => `<svg aria-hidden="true" width="${s||16}" height="${s||16}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]||''}</svg>`;
const COLC = {new:'var(--c-new)', contacted:'var(--c-contacted)', viewing:'var(--c-viewing)', finance:'var(--c-finance)', booked:'var(--c-booked)'};
const CHC = ['#7c3aed','#0d9488','#db2777','#f59e0b','#3b82f6','#64748b','#a78bfa','#84cc16'];
const TH_MON = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_DS = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];

/* ── ตัวช่วย ── */
function h(v){ return v === null || v === undefined ? '' : String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function n0(v){ return Number(v||0).toLocaleString('th-TH', {maximumFractionDigits:0}); }
function baht(v){ v = Number(v||0); const a = Math.abs(v);
  if (a >= 1e6) return '฿' + (v/1e6).toFixed(a >= 1e7 ? 1 : 2).replace(/\.0+$/,'').replace(/(\.\d)0$/,'$1') + 'M';
  if (a >= 1e3) return '฿' + Math.round(v/1e3) + 'k';
  return '฿' + n0(v); }
function initials(s){ s = String(s||'').replace(/^คุณ/,'').trim(); if (!s) return '?'; const m = s.match(/[ก-๙]/); return m ? s.slice(0, /[เแโใไ]/.test(s[0]) ? 2 : 1) : s.slice(0,2).toUpperCase(); }
function phoneFmt(p){ const d = String(p||'').replace(/\D/g,''); return d.length === 10 ? d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6) : (p||''); }
function tel(p){ const d = String(p||'').replace(/[^\d+]/g,''); return d.length >= 9 ? 'tel:' + d : ''; }
function sdate(s){ /* "d/m/yyyy" หรือ "yyyy-mm-dd" → Date (เวลาเที่ยงคืน) */
  if (!s) return null; s = String(s).trim().split(' ')[0];
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (m){ let y = +m[3]; if (y < 100) y += 2000; if (y > 2500) y -= 543; return new Date(y, +m[2]-1, +m[1]); }
  return null; }
function dayDiff(d){ if (!d) return null; const t = new Date(); t.setHours(0,0,0,0); const x = new Date(d); x.setHours(0,0,0,0); return Math.round((t - x) / 864e5); }
function ago(iso){ if (!iso) return ''; const t = new Date(iso); if (isNaN(t)) return ''; let s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return 'เมื่อสักครู่'; if (s < 3600) return Math.floor(s/60) + ' นาทีก่อน'; if (s < 86400) return Math.floor(s/3600) + ' ชม.ก่อน';
  const d = Math.floor(s/86400); return d === 1 ? 'เมื่อวาน' : d + ' วันก่อน'; }
function whenLabel(iso){ if (!iso) return ''; const t = new Date(iso); if (isNaN(t)) return '';
  const hm = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
  const dd = dayDiff(t); if (dd === 0) return 'วันนี้ ' + hm; if (dd === -1) return 'พรุ่งนี้ ' + hm; if (dd === 1) return 'เมื่อวาน ' + hm;
  return TH_DS[t.getDay()] + ' ' + t.getDate() + ' ' + TH_MON[t.getMonth()+1] + ' ' + hm; }
function shortDate(iso){ const t = iso ? new Date(iso) : null; if (!t || isNaN(t)) return ''; const dd = dayDiff(t);
  if (dd === 0) return 'วันนี้ ' + String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
  if (dd === 1) return 'เมื่อวาน'; if (dd > 1 && dd < 7) return dd + ' วันก่อน'; return t.getDate() + ' ' + TH_MON[t.getMonth()+1]; }
function sheetDayLabel(s){ const d = sdate(s); if (!d) return s || ''; const dd = dayDiff(d); if (dd === 0) return 'วันนี้'; if (dd === 1) return 'เมื่อวาน'; if (dd > 1 && dd < 7) return dd + ' วันก่อน'; return d.getDate() + ' ' + TH_MON[d.getMonth()+1]; }
function csrf(){ const m = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/); return m ? decodeURIComponent(m[1]) : ''; }
async function api(url, body){
  const opt = {credentials:'same-origin', headers:{}};
  if (body !== undefined){ opt.method = 'POST'; opt.headers['Content-Type'] = 'application/json'; opt.headers['X-CSRFToken'] = csrf(); opt.body = JSON.stringify(body); }
  const r = await fetch(url, opt); let d = {};
  try { d = await r.json(); } catch(e) { d = {ok:false, error:'เซิร์ฟเวอร์ตอบไม่ถูกต้อง (' + r.status + ')'}; }
  if (!r.ok && d.ok === undefined) d.ok = false;
  if (!r.ok && !d.error) d.error = 'ผิดพลาด (' + r.status + ')';
  return d; }
let _tt = null;
function toast(msg, bad){ let el = document.getElementById('toast'); if (!el){ el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.className = 'toast' + (bad ? ' bad' : ''); el.textContent = msg; el.style.display = 'block'; clearTimeout(_tt); _tt = setTimeout(() => { el.style.display = 'none'; }, 3200); }
const sname = n => n === 'ADMIN' ? 'เทเลเซลล์' : (n || '');

/* ── สถานะ ── */
const S = {
  page: PAGES.some(p => p.k === BOOT.page) ? BOOT.page : 'dash',
  seller: BOOT.seller || '', D: null, err: '', loading: false,
  pipeF: 'all', pipeMore: {}, custF: 'all', q: '', sel: null, custLimit: 60,
  range: 'r30', cust: {}, stock: null, stockF: 'show', stockQ: '', taskI: 0, chatId: '',
  sum: null, form: null,
};
(function(){ const p = new URLSearchParams(location.search); if (p.get('sel')) S.sel = p.get('sel'); if (p.get('id')) S.chatId = p.get('id'); })();
function setUrl(){ const p = new URLSearchParams(); if (BOOT.admin && S.seller) p.set('seller', S.seller); if (S.page !== 'dash') p.set('p', S.page);
  if (S.page === 'cust' && S.sel) p.set('sel', S.sel); if (S.page === 'chat' && S.chatId) p.set('id', S.chatId);
  const q = p.toString(); history.replaceState(null, '', '/crm/' + (q ? '?' + q : '')); }

/* ── ข้อมูล ── */
async function load(fresh){
  if (BOOT.error){ S.err = BOOT.error; render(); return; }
  S.loading = true; if (!S.D) render();
  const d = await api('/crm/api/data?seller=' + encodeURIComponent(S.seller) + (fresh ? '&fresh=1' : ''));
  S.loading = false;
  if (!d.ok){ S.err = d.error || 'โหลดข้อมูลไม่ได้'; render(); return; }
  S.err = ''; S.D = d; buildIndex(); render(); }
async function loadSummary(){ try { const d = await api('/connect/api/summary'); if (d.ok){ S.sum = d; renderSide(); } } catch(e){} }

/* ── รวมลีด 3 แหล่ง (แชท · ชีต · เคสจอง) เป็นการ์ดบนกระดาน + แถวในหน้าลูกค้า ── */
let IDX = {cards: [], rows: [], byKey: {}};
function contactLabel(p){ const s = String(p || '').trim(); if (!s || s === '-') return '';
  const pm = s.match(/0\d[\d\-\s]{7,11}\d/); if (pm){ const d = pm[0].replace(/\D/g, ''); if (d.length >= 9 && d.length <= 10) return phoneFmt(d); }
  const m = s.match(/line\s*(?:id)?\s*[:：]?\s*(.*)$/i);
  if (m){ const id = m[1].trim(); return !id || /^qr/i.test(id) ? 'LINE (QR code)' : 'LINE ' + id; }
  return s; }
function leadName(l, deal){ return deal && deal.name ? deal.name : (contactLabel(l.phone) || 'ลีด ' + (l.code || '')); }
function buildIndex(){
  const D = S.D; const cards = [], rows = [], byKey = {};
  const chatCodes = new Set((D.chats||[]).map(c => (c.code||'').toUpperCase()).filter(Boolean));
  const deals = D.deals || [];
  const dealByCode = {}; deals.forEach(x => { if (x.code) dealByCode[x.code.toUpperCase()] = x; });
  (D.chats||[]).forEach(c => {
    const key = 'chat:' + c.id; const deal = c.code ? dealByCode[c.code.toUpperCase()] : null;
    const it = {kind:'chat', key, col: c.col, c, deal, name: c.name, code: c.code, car: c.car, channel: c.channel,
      hot: c.heat === 'hot', score: c.score || 0, last: c.lastAt, trade: c.trade, phone: c.phone};
    byKey[key] = it; rows.push(it); if (c.col && c.stage !== 'lost') cards.push(it); });
  (D.leads||[]).forEach(l => {
    const code = (l.code||'').toUpperCase(); if (code && chatCodes.has(code)) return;
    const key = 'lead:' + (l.code || l.phone || Math.random().toString(36).slice(2));
    const deal = code ? dealByCode[code] : null;
    const it = {kind:'lead', key, col: l.stage, l, deal, name: leadName(l, deal), code: l.code, car: l.car, channel: l.channel,
      hot: /hot/i.test(l.leadTier||''), score: l.leadScore || 0, phone: l.phone};
    it.lastSort = (sdate(l.lastUpdate) || sdate(l.dateIn) || new Date(0)).getTime();
    byKey[key] = it; rows.push(it);
    // มีเคสจองที่ยังไม่ปล่อยแล้ว = ใบเคสจองแทนลีดนี้บนกระดาน (ไม่ขึ้นซ้ำ 2 ใบ)
    if (l.stage && (l.date || '') >= (D.pipeCut || '') && !deal) cards.push(it); });
  const leadByCode = {}; rows.forEach(r => { if (r.kind === 'lead' && r.code) leadByCode[r.code.toUpperCase()] = r; });
  deals.forEach(x => {
    const code = (x.code||'').toUpperCase(); if (code && chatCodes.has(code)) return;
    const key = 'deal:' + x.id; const it = {kind:'deal', key, col:'booked', x, name: x.name || 'ลูกค้าจอง', code: x.code, car: x.car,
      channel: x.channel, phone: x.phone, score: 0};
    it.lastSort = (sdate(x.date) || new Date(0)).getTime();
    cards.push(it);
    const lead = code ? leadByCode[code] : null;
    if (lead) byKey[key] = lead;              // กดใบเคสจอง → เปิดแถวลีดเดียวกันในหน้าลูกค้า (มีข้อมูลเคสจองติดอยู่)
    else { byKey[key] = it; rows.push(it); } });
  rows.forEach(r => { if (r.kind === 'chat') r.lastSort = r.c.lastAt ? new Date(r.c.lastAt).getTime() : 0; });
  rows.sort((a,b) => (b.lastSort||0) - (a.lastSort||0));
  IDX = {cards, rows, byKey}; }

/* ── แถบซ้าย ── */
function renderSide(){
  const D = S.D || {}; const el = document.getElementById('side');
  const pipeN = IDX.cards.length;
  let chatN = 0, chatPink = false;
  if (S.sum && S.sum.counts){ const c = S.sum.counts; chatN = BOOT.admin ? (c.queue||0) : ((c.mineWaiting||0) + (S.sum.onDuty ? (c.queue||0) : 0)); chatPink = (c.mineOverdue||0) > 0 || chatN > 0; }
  const nav = PAGES.map(p => {
    let bd = '';
    if (p.k === 'pipe' && pipeN) bd = `<span class="bd">${n0(pipeN)}</span>`;
    if (p.k === 'chat' && chatN) bd = `<span class="bd ${chatPink ? 'pink' : ''}">${n0(chatN)}</span>`;
    return `<button class="nv ${S.page === p.k ? 'on' : ''}" data-act="nav" data-k="${p.k}">${ic(p.i,18)}${h(p.l)}${bd}</button>`; }).join('');
  const roster = BOOT.roster || [];
  const picker = BOOT.admin ? `<div class="picker"><label for="pick">ดูของเซลล์</label><select id="pick" data-act="pick">${
    roster.map(r => `<option value="${h(r.name)}" ${r.name === S.seller ? 'selected' : ''}>${h(r.label)}${r.team && r.team !== 'ADMIN' ? ' · ทีม ' + h(r.team) : ''}</option>`).join('')}</select></div>` : '';
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const me = BOOT.admin ? (BOOT.me.nickname || 'แอดมิน') : sname(S.seller);
  const role = BOOT.admin ? 'แอดมิน · ดูของ ' + sname(S.seller) : ((D.teamName ? D.teamName + ' · ' : '') + 'เซลล์');
  el.innerHTML = `<img class="logo" src="${LOGO}" alt="อ๊อกเล็ตธ์ ออโต้"><div class="tag">CRM ทีมขาย</div>${picker}${nav}
    <div class="sp"></div>
    <div class="foot"><div class="av">${h(initials(me))}</div><div class="who"><b>${h(me)}</b><span>${h(role)}</span></div>
      <div class="ib"><button class="ibtn" data-act="theme" title="สลับธีม">${ic(dark ? 'sun' : 'moon',16)}</button>
      <a class="ibtn" href="/logout/" title="ออกจากระบบ">${ic('out',16)}</a></div></div>
    <div class="links"><a href="${BOOT.admin ? '/dashboard/' : '/me/'}">หน้าเดิม</a><a href="/connect/">Connect</a></div>`; }

/* ── หน้า ── */
function render(){
  renderSide();
  const el = document.getElementById('main');
  if (S.err && !S.D){ el.innerHTML = `<div class="err">${h(S.err)}</div>`; return; }
  if (!S.D){ el.innerHTML = '<div class="load">กำลังโหลดข้อมูลจริงจากชีตและ Connect…</div>'; return; }
  try {
    const fn = {dash: pageDash, pipe: pagePipe, cust: pageCust, chat: pageChat, stock: pageStock, report: pageReport}[S.page] || pageDash;
    el.innerHTML = fn() + errBox();
    if (S.page === 'cust') afterCust();
    if (S.page === 'stock' && !S.stock) loadStock();
  } catch(e){ console.error(e); el.innerHTML = `<div class="err">หน้านี้แสดงผลไม่ได้: ${h(e.message)}</div>`; }
  tick(); }
function errBox(){ const e = (S.D && S.D.errors) || {}; const ks = Object.keys(e); if (!ks.length) return '';
  return `<div class="note">บางส่วนโหลดไม่ได้ — ${ks.map(k => h(e[k])).join(' · ')}</div>`; }
function header(eb, title, sub, acts){ return `<div class="ph"><div class="t"><div class="eb">${h(eb)}</div><h1>${h(title)}</h1><div class="sub">${sub}</div></div>${acts||''}</div>`; }
function refreshBtn(){ return `<button class="btn" data-act="refresh" title="ดึงข้อมูลใหม่">${ic('refresh',16)}รีเฟรช</button>`; }

/* ════════ แดชบอร์ด ════════ */
function greet(){ const hr = new Date().getHours(); return hr < 12 ? 'สวัสดีตอนเช้า' : hr < 17 ? 'สวัสดีตอนบ่าย' : 'สวัสดีตอนเย็น'; }
function colCounts(){ const n = {}; (S.D.cols||[]).forEach(c => n[c.key] = 0); IDX.cards.forEach(it => { if (n[it.col] !== undefined) n[it.col]++; }); return n; }
function pageDash(){
  const D = S.D, k = D.kpi || {}, self = D.selfView;
  const title = self || !BOOT.admin ? greet() + ' คุณ' + sname(S.seller) : 'ภาพรวมของ ' + sname(S.seller);
  const acts = `${self ? '<button class="btn" data-act="checkphone">เช็คเบอร์ซ้ำ</button>' : ''}${refreshBtn()}<button class="btn pri" data-act="nav" data-k="pipe">${ic('pipe',16)}เปิดไปป์ไลน์</button>`;
  return header(D.period || '', title, 'ยอดขายไตรมาสนี้ ลีดที่กำลังตาม และงานที่ต้องทำวันนี้ — ตัวเลขชุดเดียวกับหน้าเซลล์', acts)
    + (S.checkPhone ? phoneBox() : '')
    + `<div class="g2">${heroCard(k)}${followCard()}</div>`
    + `<div class="g3">${weekCard()}${hotCard()}${apptCard()}</div>`
    + `<div class="g3">${targetCard()}${riskCard()}${clockCard()}</div>`; }
function heroCard(k){
  if (!k || k.dealValue === undefined) return `<section class="hero"><div class="l"><span class="muted">ยอดปล่อยไตรมาสนี้</span><div class="muted">ยังไม่มีข้อมูล</div></div></section>`;
  const tgt = k.target || 0, pct = tgt ? Math.min(100, Math.round(100 * k.done / tgt)) : 0;
  const delta = k.pct === null || k.pct === undefined ? '' :

const PIPE_F = [{k:'all', l:'ทั้งหมด'}, {k:'hot', l:'ร้อน'}, {k:'todo', l:'ยังไม่โทร / รอเราตอบ'}, {k:'appt', l:'มีนัด'}, {k:'trade', l:'มีรถเทิร์น'}, {k:'chat', l:'ลูกค้าแชท'}];
function pipeMatch(it, f){
  if (f === 'all') return true;
  if (f === 'hot') return it.hot && it.kind !== 'deal';
  if (f === 'todo') return it.kind === 'lead' ? (it.col === 'new' && !(it.l.updateCount)) : it.kind === 'chat' ? it.c.awaiting : false;
  if (f === 'appt') return it.kind === 'chat' ? !!it.c.appt : it.kind === 'lead' ? /นัด|มาดูรถ/.test(it.l.customerStatus || '') : false;
  if (f === 'trade') return it.kind === 'chat' ? !!it.c.trade : it.kind === 'lead' ? /เทริน|เทิร์น/.test(it.l.customerStatus || '') : false;
  if (f === 'chat') return it.kind === 'chat';

function cardSort(col){ return (a, b) => {
  const pa = a.kind === 'deal' ? 2 : a.kind === 'chat' ? 0 : 1, pb = b.kind === 'deal' ? 2 : b.kind === 'chat' ? 0 : 1;
  if (col === 'booked') return (a.kind === 'deal' ? a.x.days : 99) - (b.kind === 'deal' ? b.x.days : 99);
  if (col === 'new'){ const ua = a.kind === 'lead' ? !(a.l.updateCount) : a.c && a.c.awaiting, ub = b.kind === 'lead' ? !(b.l.updateCount) : b.c && b.c.awaiting;

  const sa = a.kind === 'lead' ? (a.l.urgency || 0) : (a.score || 0) + 40, sb = b.kind === 'lead' ? (b.l.urgency || 0) : (b.score || 0) + 40;

let _drag = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('[data-drag]'); if (!c) return; _drag = c.dataset.drag; c.classList.add('dragging');
  try { e.dataTransfer.setData('text/plain', _drag); e.dataTransfer.effectAllowed = 'move'; } catch(x){} });
document.addEventListener('dragend', e => { document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); document.querySelectorAll('.colm.drop').forEach(x => x.classList.remove('drop')); _drag = null; });
document.addEventListener('dragover', e => { if (!_drag) return; const col = e.target.closest && e.target.closest('.colm'); if (!col) return; e.preventDefault();
  document.querySelectorAll('.colm.drop').forEach(x => { if (x !== col) x.classList.remove('drop'); }); col.classList.add('drop'); });
document.addEventListener('drop', async e => { if (!_drag) return; const col = e.target.closest && e.target.closest('.colm'); if (!col) return; e.preventDefault();
  const id = _drag; _drag = null; col.classList.remove('drop'); await moveChat(+id, col.dataset.col); });
async function moveChat(id, colKey){
  const it = IDX.byKey['chat:' + id]; if (!it || it.col === colKey) return;
  const stage = (S.D.colStage || {})[colKey]; if (!stage) return;
  if (colKey === 'booked' && !confirm('ย้าย "' + it.name + '" ไป "จอง / ปิดการขาย"?\nขั้นในระบบจะเป็น "ปิดการขาย"')) return;
  const prev = it.col; it.col = colKey; render();
  const d = await api('/connect/api/crm', {action:'stage', id, stage});
  if (!d.ok){ it.col = prev; render(); toast(d.error || 'เปลี่ยนขั้นไม่ได้', true); return; }
  if (d.row){ Object.assign(it.c, {stage: d.row.stage, stageLabel: d.row.stageLabel, heat: d.row.heat, score: d.row.heatScore}); it.c.col = colKey; }
  delete S.cust[id]; toast(d.message || 'เปลี่ยนขั้นแล้ว'); render(); }

/* ════════ ลูกค้า ════════ */
const CUST_F = [{k:'all', l:'ทั้งหมด'}, {k:'chat', l:'ลูกค้าแชท'}, {k:'todo', l:'ยังไม่โทร / รอเราตอบ'}, {k:'match', l:'มีรถตรงสเปก'}, {k:'silent', l:'เงียบเกิน 7 วัน'}, {k:'deal', l:'จอง'}];
function custMatch(it, f){
  if (f === 'all') return true;
  if (f === 'chat') return it.kind === 'chat';
  if (f === 'todo') return it.kind === 'lead' ? (it.col === 'new' && !it.l.updateCount) : it.kind === 'chat' ? it.c.awaiting : false;
  if (f === 'match') return it.kind === 'chat' ? it.c.carMatch > 0 : it.kind === 'lead' ? (it.l.carMatch || 0) > 0 : false;
  if (f === 'silent') return it.kind === 'chat' ? (it.c.silent >= 7 && it.c.stage !== 'lost' && it.c.stage !== 'won') : it.kind === 'lead' ? (it.l.idle > 7 && it.col && it.col !== 'booked') : false;
  if (f === 'deal') return it.kind === 'deal' || !!it.deal || it.col === 'booked';
  return true; }
function custSearch(it, q){ if (!q) return true; q = q.toLowerCase(); const dq = q.replace(/\D/g, '');
  return [it.name, it.code, it.car, it.channel].some(v => String(v||'').toLowerCase().includes(q)) || (dq.length >= 3 && String(it.phone||'').replace(/\D/g,'').includes(dq)); }
function stageChip(it){
  if (it.kind === 'chat') return `<span class="stg" ${it.c.stage === 'lost' ? 'style="background:var(--bad-s);color:var(--bad)"' : it.c.stage === 'won' ? 'style="background:var(--teal-s);color:var(--teal)"' : ''}>${h(it.c.stageLabel)}</span>`;
  if (it.kind === 'deal') return `<span class="stg" style="background:var(--teal-s);color:var(--teal)">${h(it.x.status)}</span>`;
  if (it.deal) return `<span class="stg" style="background:var(--teal-s);color:var(--teal)" title="เคสจองในชีตยอดขาย">${h(it.deal.status)}</span>`;
  const lbl = (S.D.cols.find(c => c.key === it.col) || {}).label || 'เคสเสีย/ปิด';
  return `<span class="stg" ${!it.col ? 'style="background:var(--soft);color:var(--ink3)"' : it.col === 'booked' ? 'style="background:var(--teal-s);color:var(--teal)"' : ''}>${h(lbl)}</span>`; }
function lastText(it){
  if (it.kind === 'chat'){ const s = it.c.silent; return `<span ${s >= 7 && it.c.stage !== 'won' && it.c.stage !== 'lost' ? 'style="color:var(--bad)"' : ''}>${s >= 7 ? 'เงียบ ' + s + ' วัน' : h(shortDate(it.c.lastAt))}</span>`; }

document.addEventListener('input', e => { const t = e.target; if (!t || !t.dataset) return;
  if (t.dataset.act === 'custQ' || t.dataset.act === 'stockQ'){ clearTimeout(_qt); const id = t.id, v = t.value;
    _qt = setTimeout(() => { if (id === 'cust-q') { S.q = v; S.custLimit = 60; } else S.stockQ = v; render();
      const el = document.getElementById(id); if (el){ el.focus(); el.setSelectionRange(v.length, v.length); } }, 250); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'cp-phone') checkPhone(); });

async function crmPost(id, body){
  const d = await api('/connect/api/crm', Object.assign({id}, body));
  if (!d.ok){ toast(d.error || 'บันทึกไม่ได้', true); return; }
  toast(d.message || 'บันทึกแล้ว'); S.form = null;
  const it = IDX.byKey['chat:' + id];
  if (it && d.row){ Object.assign(it.c, {stage: d.row.stage, stageLabel: d.row.stageLabel, heat: d.row.heat, score: d.row.heatScore, appt: d.row.appt});
    const cols = S.D.colStage || {}; let col = ''; Object.keys(cols).forEach(k => { if (cols[k] === d.row.stage) col = k; });
    it.col = d.row.stage === 'lost' ? '' : ({new:'new', pool:'new', waiting:'new'}[d.row.stage] || col || it.col); it.c.col = it.col;
    it.hot = it.c.heat === 'hot'; it.score = it.c.score;
    if (d.row.stage === 'lost') IDX.cards = IDX.cards.filter(x => x !== it); else if (!IDX.cards.includes(it)) IDX.cards.push(it); }
  await loadCust(id, true); render(); }
async function saveZ(key, btn){
  const it = IDX.byKey[key]; if (!it || it.kind !== 'lead') return;
  const v = document.getElementById('z-sel').value; const msg = document.getElementById('z-msg');
  btn.disabled = true; if (msg) msg.textContent = 'กำลังเขียนลงชีต…';
  const d = await api('/crm/api/lead_status', {code: it.l.code, value: v, seller: S.seller});
  btn.disabled = false;
  if (!d.ok){ if (msg) msg.textContent = ''; toast(d.error || 'บันทึกไม่ได้', true); return; }
  it.l.customerStatus = v; it.l.stage = d.stage; it.col = d.stage;
  if (d.stage && (it.l.date || '') >= (S.D.pipeCut || '')){ if (!IDX.cards.includes(it)) IDX.cards.push(it); } else IDX.cards = IDX.cards.filter(x => x !== it);
  toast('บันทึกลงชีตแล้ว' + (d.cell ? ' (' + d.tab + ' ' + d.cell + ')' : '')); render(); }
async function checkPhone(){
  const i = document.getElementById('cp-phone'), out = document.getElementById('cp-res'); if (!i || !out) return;
  out.textContent = 'กำลังเช็ค…';
  const r = await fetch('/api/seller/check_phone', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify({phone: i.value})});
  let d = {}; try { d = await r.json(); } catch(x){}
  if (!r.ok || d.error){ out.textContent = d.error || 'เช็คไม่ได้'; return; }
  out.innerHTML = !d.found ? '<b style="color:var(--ok)">ยังไม่เคยเป็นลีดของใคร</b>' : d.mine ? `<b style="color:var(--brand-d)">เป็นลีดของคุณเอง${d.code ? ' (' + h(d.code) + ')' : ''}</b>${d.month ? ' · ' + h(d.month) : ''}`
    : `<b style="color:var(--bad)">เคยเป็นลีดของ ${h(sname(d.seller))}</b>${d.month ? ' · ' + h(d.month) : ''}`; }

/* ── เริ่ม ── */
setUrl(); render(); load(); loadSummary();
setInterval(() => { if (document.hidden) return; loadSummary(); }, 60000);
setInterval(() => { if (document.hidden || paneBusy()) return; const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; if (S.page !== 'chat') load(); }, 180000);
})();
</script>
