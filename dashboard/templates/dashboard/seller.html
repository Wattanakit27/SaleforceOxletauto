  // บันทึกวันที่ timeline กลับชีต (เซ็น/ผล/ปล่อย — col=คอลัมน์) · เคสของตัวเอง (server เช็ค ownership)
  async function saveTimelineDate(idx, col) {
    const b = (_bdArr || bookingsInRange())[idx];
    if (!b) return;
    const inp = document.getElementById('td-' + col);
    const msg = document.getElementById('tdmsg-' + col);
    if (!inp) return;
    const val = _fromISODate(inp.value);   // type=date → d/m/yyyy สำหรับชีต (ว่าง = ลบ)
    if (val && !/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(val)) {
      if (msg) { msg.textContent = '⚠ วันที่ไม่ถูกต้อง'; msg.style.color = 'var(--red)'; }
      return;
    }
    if (msg) { msg.textContent = 'กำลังบันทึก...'; msg.style.color = 'var(--t3)'; }
    const token = location.pathname.split('/').filter(Boolean)[1] || '';
    try {
      const res = await fetch('/api/admin/update_release_date', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({tab: b.sheetTab, row: parseInt(b.sheetRow), col: col, value: val, token})
      });
      const d = await res.json();
      if (!res.ok || !d.ok) {
        if (msg) { msg.textContent = '⚠ ' + (d.error || 'บันทึกไม่สำเร็จ'); msg.style.color = 'var(--red)'; }
        return;
      }
      if (msg) { msg.textContent = '✓ บันทึกลงชีตแล้ว'; msg.style.color = 'var(--green-mid)'; }
      // optimistic — map col → field
      if (col === 2) b.date = val;
      else if (col === 14) b.signDate = val;
      else if (col === 18) b.docsDate = val;
      else if (col === 19 || col === 20) b.resultDate = val;
      else { b.releaseDatePrimary = val; if (val) b.releaseDate = val; }
      render();   // refresh กระดิ่ง/badge/ลิสต์ (modal อยู่บน body ไม่หาย · เดิมเรียก renderReleaseAlert ที่ไม่มีจริง)
    } catch (e) {
      if (msg) { msg.textContent = '⚠ error: ' + e; msg.style.color = 'var(--red)'; }
    }
  }

  // บันทึกสถานะเคสกลับชีต (คอลัมน์ N=13) · เคสของตัวเอง (server เช็ค ownership)
  async function saveCaseStatus(idx, sel) {
    const b = (_bdArr || bookingsInRange())[idx];
    if (!b) return;
    const msg = document.getElementById('stmsg');
    const val = sel.value;
    if (msg) { msg.textContent = 'กำลังบันทึก...'; msg.style.color = 'var(--t3)'; }
    const token = location.pathname.split('/').filter(Boolean)[1] || '';
    try {
      const res = await fetch('/api/admin/update_release_date', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tab: b.sheetTab, row: parseInt(b.sheetRow), col: 13, value: val, token })
      });
      const d = await res.json();
      if (!res.ok || !d.ok) {
        if (msg) { msg.textContent = '⚠ ' + (d.error || 'บันทึกไม่สำเร็จ'); msg.style.color = 'var(--red)'; }
        return;
      }
      if (msg) { msg.textContent = '✓ บันทึกลงชีตแล้ว'; msg.style.color = 'var(--green-mid)'; }
      b.status = val;   // optimistic (mirror ตามทันรอบ sync ถัดไป)
      render();   // refresh กระดิ่ง/badge (status กระทบ relBlank/นับ)
    } catch (e) {
      if (msg) { msg.textContent = '⚠ error: ' + e; msg.style.color = 'var(--red)'; }
    }
  }

  // ── filter actions ──
  function setMonth(m) {
    fMonth = m;
    if (m === 0) fDay = 0;
    // เลือก month → ล้าง date range (mutually exclusive)
    if (m > 0) { fDateFrom = ''; fDateTo = ''; }
    render();
  }
  function setMonthFromInput(v) {
    if (!v) { setMonth(0); return; }
    const mo = parseInt(v.split('-')[1] || '0');
    if (mo >= 1 && mo <= 12) setMonth(mo);
  }
  function setDay(d) {
    fDay = d;
    if (d !== 0) { fDateFrom = ''; fDateTo = ''; }  // วันนี้ override range
    render();
  }
  function setDateFrom(v) {
    fDateFrom = v || '';
    // เลือก date range → ล้าง month + day (mutually exclusive)
    if (fDateFrom) { fMonth = 0; fDay = 0; }
    render();
  }
  function setDateTo(v) {
    fDateTo = v || '';
    if (fDateTo) { fMonth = 0; fDay = 0; }
    render();
  }
  function clearDateRange() { fDateFrom = ''; fDateTo = ''; render(); }
  function resetFilter() { fMonth = 0; fDay = 0; fDateFrom = ''; fDateTo = ''; render(); }
  // ปุ่มลัดช่วงวัน
  function setRangeMonth() { const d=new Date(); fDateFrom=_ymdS(new Date(d.getFullYear(),d.getMonth(),1)); fDateTo=_ymdS(new Date(d.getFullYear(),d.getMonth()+1,0)); fMonth=0; fDay=0; render(); }  // เดือนนี้ = ต้นเดือน→สิ้นเดือน (เหมือนหน้าหลัก)
  function setRangeYear() { const d=new Date(); fDateFrom=`${d.getFullYear()}-01-01`; fDateTo=`${d.getFullYear()}-12-31`; fMonth=0; fDay=0; render(); }  // ทั้งปี = ม.ค.–ธ.ค.
  function setRangeToday() { const d=new Date(); fDateFrom=_ymdS(d); fDateTo=_ymdS(d); fMonth=0; fDay=0; render(); }

  // ── เก็บค่า + สร้างข้อความ ──
  function collectFinance() {
    const v = (id) => (document.getElementById(id)?.value || '').trim();
    const docs = [];
    document.querySelectorAll('.fc-doc:checked').forEach(c => docs.push(c.value));
    return {
      leadCode:v('fc_leadcode'), branch:v('fc_branch'), customer:v('fc_customer'),
      car:v('fc_car'), plate:v('fc_plate'), price:v('fc_price'),
      finco:v('fc_finco'), status:v('fc_status'), approved:v('fc_approved'),
      down:v('fc_down'), monthly:v('fc_monthly'), terms:v('fc_terms'), cond:v('fc_cond'),
      signDate:v('fc_signdate'), signTime:v('fc_signtime'), docs,
      seller:v('fc_seller'), extra:v('fc_extra'),
    };
  }
  function financeText(d) {
    const x = (s) => s || '-';
    const docs = d.docs && d.docs.length ? d.docs.join(', ') : '-';
    return `${ic('lucide:clipboard-list',16)} เช็คเคสไฟแนนซ์ก่อนเซ็น
━━━━━━━━━━━━
${ic('lucide:user',16)} ลูกค้า: ${x(d.customer)}
${ic('lucide:bookmark',16)} Lead: ${x(d.leadCode)}  |  สาขา: ${x(d.branch)}
${ic('lucide:car-front',16)} รถ: ${x(d.car)}  (${x(d.plate)})
${ic('lucide:wallet',16)} ราคารถ: ${x(d.price)}

${ic('lucide:landmark',16)} ไฟแนนซ์: ${x(d.finco)} — ${x(d.status)}
วงเงินอนุมัติ: ${x(d.approved)}  |  ดาวน์: ${x(d.down)}
ผ่อน: ${x(d.monthly)} x ${x(d.terms)} งวด
เงื่อนไข: ${x(d.cond)}

${ic('lucide:calendar',16)} นัดเซ็น: ${x(d.signDate)} ${d.signTime||''}
${ic('lucide:paperclip',16)} เอกสาร: ${docs}
${ic('lucide:user-round',16)} เซลล์: ${x(d.seller)}
${ic('lucide:file-pen',16)} ${x(d.extra)}`;
  }
  function previewFinance() {
    const box = document.getElementById('fc-preview-box');
    const txt = financeText(collectFinance());
    box.style.display = 'block';
    box.innerHTML = `<div style="background:var(--bg2);border:.5px solid var(--bd);border-radius:11px;padding:14px 16px;white-space:pre-wrap;word-break:break-word;font-size:12.5px;line-height:1.7;color:var(--t1)">${h(txt)}</div>`;
    box.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  function copyFinance() {
    navigator.clipboard.writeText(financeText(collectFinance())).then(() => {
      const box = document.getElementById('fc-result');
      box.innerHTML = `<div style="padding:9px 13px;background:var(--green-bg,#eaf3de);color:var(--green);border-radius:10px;font-size:12px;font-weight:600">${ic('lucide:circle-check',16)} คัดลอกข้อความแล้ว</div>`;
      setTimeout(() => { box.innerHTML = ''; }, 2000);
    });
  }
  async function sendFinance() {
    const d = collectFinance();
    if (!d.customer && !d.leadCode) { alert('กรอกอย่างน้อย "ชื่อลูกค้า" หรือ "Lead Code"'); return; }
    if (!confirm('ส่งเคสนี้เข้า LINE ให้ Senior อนุมัติ?')) return;
    const btn = document.getElementById('fc-send-btn');
    const box = document.getElementById('fc-result');
    btn.disabled = true; btn.textContent = '⏳ กำลังส่ง...';
    const parts = location.pathname.split('/').filter(Boolean);  // ['s', '<token>']
    const token = parts[1] || '';
    try {
      const res = await fetch('/api/seller/finance_check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, data: d }),
      });
      const j = await res.json();
      if (!res.ok || j.error) {

  // ── ${ic('lucide:camera',16)} สแกนเอกสาร (Gemini OCR) → เติมฟอร์มเป็นร่าง ──
  function downscaleImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        let w = img.width, hh = img.height;
        if (Math.max(w, hh) > maxDim) { const s = maxDim / Math.max(w, hh); w = Math.round(w*s); hh = Math.round(hh*s); }
        const cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
        cv.getContext('2d').drawImage(img, 0, 0, w, hh);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('โหลดรูปไม่ได้')); };
      img.src = url;
    });
  }
  // เซ็ตค่าเข้า field — input ใส่ตรง, select หา option ที่ match (exact/contains/normalize)
  function fcSet(id, val) {
    if (!val) return;
    const el = document.getElementById(id);
    if (!el) return;
    if (el.tagName === 'SELECT') {
      const opts = Array.from(el.options).filter(o => o.value);
      const norm = (s) => (s||'').replace(/[^฀-๿a-zA-Z0-9]/g, '').toLowerCase();
      const nv = norm(val);
      // 1) exact / normalized-exact ก่อน
      let m = opts.find(o => o.value === val) || opts.find(o => norm(o.value) === nv);
      // 2) substring เฉพาะเมื่อ token ยาวพอ (≥3) และ match ชัดตัวเดียว — กัน OCR token สั้นเลือกบริษัทผิดเงียบๆ
      if (!m && nv.length >= 3) {
        const subs = opts.filter(o => norm(o.value).length >= 3 && (norm(o.value).includes(nv) || nv.includes(norm(o.value))));
        if (subs.length === 1) m = subs[0];   // ชัดตัวเดียวเท่านั้น · กำกวม → ปล่อยว่างให้เซลล์เลือกเอง
      }
      if (m) el.value = m.value;
    } else {
      el.value = val;
    }
  }
  function applyScanFields(f) {
    ['leadCode','branch','customer','car','plate','price','finco','status','approved','down','monthly','terms','cond','signDate','signTime','extra']
      .forEach(k => fcSet('fc_' + k, f[k]));
  }

    st.innerHTML = '<span style="display:inline-flex;align-items:center;gap:7px;color:var(--blue);font-weight:600"><span class="spin" style="width:15px;height:15px;border-width:2px;display:inline-block"></span>กำลังอ่านเอกสาร...</span>';
    try {
      const dataUrl = await downscaleImage(file, 2048, 0.92);
      const res = await fetch('/api/seller/scan_doc', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: dataUrl }),

      const j = await res.json();
      if (!res.ok || j.error) {
        st.innerHTML = `<span style="color:var(--red)">${ic('lucide:triangle-alert',16)} ${h(j.error || 'อ่านไม่สำเร็จ')}</span>`;

  // บอร์ดคัมบัง (เหมือนบัญชีหลัก) — คอลัมน์ตามสเตป · default โฟกัสสเตปตัวเอง สลับดูทั้งหมดได้ · การ์ดกด → รายละเอียดเดิม
  function scBoard(D2){
    const _my = new Set((D2.myStages||[]).map(s=>s[0]));
    const by = {}; (D2.cars||[]).filter(c=>!c.sold).forEach(c=>{ (by[c.stage]=by[c.stage]||[]).push(c); });
    Object.values(by).forEach(a=>a.sort((x,y)=>(y.days||0)-(x.days||0)));
    const focus = _scBoardMode==='mine' && _my.size;
    const cols = (D2.stages||[]).filter(s=> s[0]!=='sold' && (!focus || _my.has(s[0])));
    const colHtml = cols.map(([k,n])=>{
      const list = by[k]||[], mine=_my.has(k);
      const cards = list.map(c=>{ const fc=_scFlag[c.flag]||'var(--t3)';
        return `<div onclick="openSellerCar('${(c.code||'').replace(/'/g,'')}')" style="cursor:pointer;background:var(--bg);border:.5px solid var(--bd);border-left:3px solid ${fc};border-radius:9px;padding:7px 8px">
          <div style="display:flex;justify-content:space-between;gap:6px"><b style="font-size:11.5px;color:var(--t1)">${h(c.code)}</b><span style="width:7px;height:7px;border-radius:50%;background:${fc};margin-top:3px;flex-shrink:0"></span></div>

  //   base.html ตรวจว่าอยู่ใน iframe → ซ่อน header ของ /track/ เอง (ไม่หัวซ้ำ) + ส่งความสูงมาปรับ iframe (ไม่สกรอลซ้อน)
  function renderCarsMode() {
    document.getElementById('root').innerHTML = `${modeBar()}
      <iframe id="scTrackFrame" src="/track/" title="${h(scT('carStatus'))}" scrolling="no" style="width:100%;height:700px;border:.5px solid var(--bd);border-radius:14px;background:var(--bg);display:block"></iframe>`;

      window._scFrameOn = true;
      window.addEventListener('message', function (e) {
        if (e && e.data && e.data.oxletTrackHeight) {
          const f = document.getElementById('scTrackFrame');
          if (f) f.style.height = (Number(e.data.oxletTrackHeight) + 24) + 'px';
        }
      });
    }
  }

  // ════════ รายการรถ (list) ════════
  function renderCarsList() {

        <h1>${ic('lucide:car-front',20)} ${h(scT('carStatus'))}</h1>
        <div class="sub">${h(scT('tapCar'))}</div>

      <div id="scBox"><div style="padding:24px;text-align:center;color:var(--t3)">${h(scT('loading'))}</div></div>`;

  function scLangSwitcher() {
    return `<div style="display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:62vw;padding:2px">${

      }).join('')}</div>`;
  }

  async function loadSellerCars(force) {
    const box = document.getElementById('scBox'); if (!box) return;
    if (force) _scData = null;
    if (!_scData) {
      try { _scData = await (await fetch('/track/api/cars', { credentials: 'same-origin' })).json(); }
      catch (e) { box.innerHTML = `<div style="padding:24px;color:var(--red)">${h(scT('loadErr'))}</div>`; return; }
    }
    renderSellerCars();
  }

  function renderSellerCars() {
    const D2 = _scData, box = document.getElementById('scBox'); if (!box || !D2) return;
    if (D2.error) { box.innerHTML = `<div style="padding:24px;color:var(--red)">${h(D2.error)}</div>`; return; }
    const myStages = D2.myStages || [];
    let cars = (D2.cars || []).slice();
    if (_scF.stage) cars = cars.filter(c => c.stage === _scF.stage);
    if (_scF.q) { const q = _scF.q.trim().toLowerCase(); if (q) cars = cars.filter(c => ((c.code||'')+' '+(c.title||'')+' '+(c.brand||'')+' '+(c.model||'')+' '+(c.plate||'')).toLowerCase().includes(q)); }
    const stageOpts = (D2.stages || []).map(s => `<option value="${s[0]}" ${_scF.stage===s[0]?'selected':''}>${h(scStageName(s[0],s[1]))}</option>`).join('');
    let html = scBoard(D2) + `<div style="background:var(--bg);border:.5px solid var(--bd);border-radius:14px;padding:14px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center">

        <span style="font-size:12px;color:var(--t3);margin-left:auto">${cars.length} ${h(scT('cars'))}</span>

    catch(e) { _scCar = { error: scT('loadErr') }; }

  // ── อัปรูป/วิดีโอ (POST เข้าเซิร์ฟเวอร์ → Google Drive · เข้าโฟลเดอร์ของรถคันนั้น) ──
  async function scAddPhotos(input) {
    const files = Array.from(input.files || []); input.value = '';
    const code = (_scCar && _scCar.code) || '';
    for (const f of files) {
      const id = 'u' + Math.random().toString(36).slice(2, 9);
      const isVid = (f.type || '').startsWith('video');
      let url = ''; try { url = URL.createObjectURL(f); } catch(e){}
      _scMedia.push({ id, name: f.name, fileId: '', url, up: true, video: isVid });
      renderScPhotos();
      try {
        const fd = new FormData(); fd.append('file', f); if (code) fd.append('code', code);
        const r = await fetch('/track/api/upload', { method:'POST', headers:{ 'X-Requested-With':'XMLHttpRequest' }, credentials:'same-origin', body: fd });
        const j = await r.json();
        if (!j.ok) throw new Error(j.error || 'upload');
        const it = _scMedia.find(m => m.id === id); if (it) { it.fileId = j.id; it.up = false; }
      } catch (e) {
        _scMedia = _scMedia.filter(m => m.id !== id);
        alert(scT('upFail') + ': ' + e);
      }
      renderScPhotos();
    }
  }
  function scRemovePhoto(id) { _scMedia = _scMedia.filter(m => m.id !== id); renderScPhotos(); }
  function renderScPhotos() {
    const box = document.getElementById('scPhotoStrip'); if (!box) return;
    box.innerHTML = _scMedia.map(m => `
      <div style="position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:.5px solid var(--bd2);background:var(--bg2)">
        ${m.url && !m.video ? `<img src="${m.url}" style="width:100%;height:100%;object-fit:cover">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--t3)">${ic(m.video?'lucide:clapperboard':'lucide:camera',22)}</div>`}
        ${m.up ? `<div style="position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;text-align:center">${h(scT('uploading'))}</div>` : ''}
        <button onclick="scRemovePhoto('${m.id}')" style="position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0">${ic('lucide:circle-x',15)}</button>
      </div>`).join('');
  }

  async function scConfirmStage() {
    const car = _scCar; if (!car) return;
    if (!_scSel) { alert(scT('selectFirst')); return; }
    if (_scMedia.some(m => m.up)) { alert(scT('uploading')); return; }
    const note = (document.getElementById('scNote')?.value || '').trim();
    const media = _scMedia.filter(m => m.fileId).map(m => ({ id: m.fileId, video: m.video }));
    const btn = document.getElementById('scConfirmBtn');
    if (btn) { btn.disabled = true; btn.style.opacity = '.6'; btn.innerHTML = scT('saving'); }
    try {
      const r = await fetch('/track/api/seller_set_stage', { method:'POST', headers:{ 'Content-Type':'application/json', 'X-Requested-With':'XMLHttpRequest' }, credentials:'same-origin', body: JSON.stringify({ code: car.code, stage: _scSel, note, media }) });
      const j = await r.json();
      if (!j.ok) { alert(j.error || scT('failed')); if (btn) { btn.disabled = false; btn.style.opacity = '1'; } renderScChanger(); return; }
      _scData = null;                       // ให้รายการ + myStages โหลดใหม่รอบหน้า
      await openSellerCar(car.code);          // โหลด detail ใหม่ (สเตป + ประวัติอัปเดต)
    } catch (e) { alert('ผิดพลาด: ' + e); if (btn) { btn.disabled = false; btn.style.opacity = '1'; } renderScChanger(); }
  }

  function scHistoryHtml(car) {
    const logs = (car && car.logs) || [];
    let inner;
    if (!logs.length) { inner = `<div style="padding:14px 2px;color:var(--t3);font-size:12.5px">${h(scT('noHistory'))}</div>`; }

      inner = logs.map((l, i) => {
        const media = (l.media || []).slice(0, 4).map(u => {
          const url = (u && typeof u === 'object') ? u.url : u;        // _media_urls คืน {url,video}
          if (u && u.video) return `<a href="${url}" target="_blank" style="width:40px;height:40px;border-radius:6px;border:.5px solid var(--bd2);background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--t2)">${ic('lucide:clapperboard',18)}</a>`;
          return `<a href="${url}" target="_blank"><img src="${url}" style="width:40px;height:40px;object-fit:cover;border-radius:6px;border:.5px solid var(--bd2)"></a>`;

        <div style="font-size:14px;font-weight:800;color:var(--t1);margin-bottom:6px">${ic('lucide:clipboard-list',16)} ${h(scT('history'))}</div>
        ${inner}
      </div>`;
  }

    return o;

บริษัท/กิจการ: ${x(d.company || d.bizName)}
ฐานเงินเดือน ${x(d.salary)} · OT ${x(d.ot)} · เฉลี่ย/เดือน ${x(d.avgIncome)}

${ic('lucide:bar-chart-3',16)} ประวัติเครดิต: ${x(d.credit)}
ผ่อน ${x(d.payBank)} งวดละ ${x(d.payInstallment)} (${x(d.payDuration)}) — ${x(d.payStatus)}
แบล็คลิสต์: ${x(d.blacklist)} · Tracking: ${x(d.tracking)}

${ic('lucide:car-front',16)} รถ: ${x(d.carModel)}
${ic('lucide:landmark',16)} ไฟแนนซ์: ${x(d.finance)}
เหตุผล: ${x(d.reason)}${g}

${ic('lucide:user-round',16)} เซลล์: ${x(d.sales)}  ผู้แนะนำ: ${x(d.referrer)}

  function previewLoan() {

  async function sendLoan() {
    const d = collectLoan();
    if (!d.customer && !d.phone) { alert('กรอกอย่างน้อย "ชื่อลูกค้า" หรือ "เบอร์โทร"'); return; }
    if (!confirm('ส่งใบยื่นสินเชื่อนี้เข้า LINE ให้ Senior อนุมัติ?')) return;
    const btn = document.getElementById('ln-send-btn');
    const box = document.getElementById('ln-result');
    btn.disabled = true; btn.textContent = '⏳ กำลังส่ง...';
    const token = location.pathname.split('/').filter(Boolean)[1] || '';
    try {
      const res = await fetch('/api/seller/loan_submit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, data: d }),
      });
      const j = await res.json();
      if (!res.ok || j.error) {
        box.innerHTML = `<div style="padding:10px 13px;background:var(--red-bg,#fcebeb);color:var(--red);border-radius:10px;font-size:12px;font-weight:600">${ic('lucide:triangle-alert',16)} ${h(j.error || 'ส่งล้มเหลว')}</div>`;

      }
    } catch (e) {
      box.innerHTML = `<div style="padding:10px 13px;background:var(--red-bg,#fcebeb);color:var(--red);border-radius:10px;font-size:12px;font-weight:600">${ic('lucide:triangle-alert',16)} ${h(e.message)}</div>`;
    } finally {
      btn.disabled = false; btn.textContent = '💾 บันทึก & ส่ง LINE';
    }
  }
  async function scanLoanDoc(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const st = document.getElementById('ln_scan_status');
    st.innerHTML = '<span style="display:inline-flex;align-items:center;gap:7px;color:var(--blue);font-weight:600"><span class="spin" style="width:15px;height:15px;border-width:2px;display:inline-block"></span>กำลังอ่านใบยื่น...</span>';
    try {
      const dataUrl = await downscaleImage(file, 2048, 0.92);
      const res = await fetch('/api/seller/scan_doc', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: dataUrl, form: 'loan' }),
      });
      const j = await res.json();
      if (!res.ok || j.error) {
        st.innerHTML = `<span style="color:var(--red)">${ic('lucide:triangle-alert',16)} ${h(j.error || 'อ่านไม่สำเร็จ')}</span>`;
      } else {
        applyLoanScanFields(j.fields || {});
        st.innerHTML = `<span style="color:var(--green)">${ic('lucide:circle-check',16)} กรอกให้แล้ว — ตรวจ/แก้ก่อนกดส่ง</span>`;
      }
    } catch (e) {
      st.innerHTML = `<span style="color:var(--red)">${ic('lucide:triangle-alert',16)} ${h(e.message)}</span>`;
    } finally {
      input.value = '';
    }
  }

  // ── ${ic('lucide:bot',16)} AI โค้ชส่วนตัว ──
  function renderAICoachCard() {
    return `
      <div class="section" style="margin-bottom:10px;border-left:3px solid var(--purple-mid,#8b5cf6)">
        <h2 style="display:flex;align-items:center;gap:6px;margin-bottom:6px">${ic('lucide:bot',16)} AI โค้ชส่วนตัว <span style="font-size:11px;font-weight:400;color:var(--t3)">วิเคราะห์ผลงาน + แนะนำ</span></h2>
        <div id="ai-coach-result" style="font-size:12.5px;color:var(--t1);line-height:1.7"></div>
        <button id="ai-coach-btn" onclick="runAICoach()" style="margin-top:6px;padding:9px 16px;border-radius:10px;border:none;background:var(--purple-mid,#8b5cf6);color:#fff;font-size:13px;font-weight:700;cursor:pointer">${ic('lucide:sparkles',16)} ให้ AI วิเคราะห์ผลงานฉัน</button>
      </div>`;
  }
  function aiStatsSummary() {
    // 🤖 วัดตาม "ตัวกรองที่เลือกอยู่" — เลือกเดือนนี้ = วิเคราะห์เดือนนี้ · เลือกช่วง = วิเคราะห์ช่วงนั้น
    const s = D.seller;
    const num = (n) => Math.round(Number(n||0)).toLocaleString();
    const c = _aiStats || { periodLabel: 'ทั้งปี', lead: s.lead, called: 0, notCalled: 0, follow: 0, booking: 0, done: s.done, dealValue: s.dealValue };
    return `ทีม ${s.team} · เป้าเดือนละ ${s.target} คัน
ช่วงที่กำลังดู: ${c.periodLabel}
- หลีดที่รับ: ${c.lead} (โทรแล้ว ${c.called} · ยังไม่โทร ${c.notCalled} · ต้องโทรต่อ ${c.follow})
- จอง: ${c.booking} · ปล่อย: ${c.done} · ยอดปล่อย: ${num(c.dealValue)} บาท
ภาพรวมทั้งปี (อ้างอิง): lead ${s.lead}, ปล่อย ${s.done}, ยอด ${num(s.dealValue)} บาท`;
  }
  function aiMarkdown(t) {
    return h(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^[-*] /gm, '• ').replace(/\n/g, '<br>');
  }
  async function runAICoach() {
    const btn = document.getElementById('ai-coach-btn');
    const box = document.getElementById('ai-coach-result');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin" style="width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:middle"></span> AI กำลังวิเคราะห์...';
    try {
      const res = await fetch('/api/insights/seller', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seller: SELLER_NAME, stats: aiStatsSummary() }),
      });
      const j = await res.json();
      if (!res.ok || j.error) {
        box.innerHTML = `<div style="color:var(--red)">${ic('lucide:triangle-alert',16)} ${h(j.error || 'วิเคราะห์ไม่สำเร็จ')}</div>`;
      } else {
        box.innerHTML = `<div style="background:var(--purple-bg,#f2ecfd);border-radius:10px;padding:12px 14px;margin-bottom:4px;line-height:1.7">${aiMarkdown(j.analysis)}</div>`;
      }
    } catch (e) {
      box.innerHTML = `<div style="color:var(--red)">${ic('lucide:triangle-alert',16)} ${h(e.message)}</div>`;
    } finally {
      btn.disabled = false; btn.textContent = '✨ วิเคราะห์อีกครั้ง';
    }
  }

  render();
</script>
{% endif %}
</body>
</html>
