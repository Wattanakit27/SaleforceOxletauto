{% load static %}<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard{% if seller %} — {{ seller }}{% endif %}</title>
  <link rel="icon" type="image/png" href="{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}">
  <link rel="apple-touch-icon" href="{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}">
  <link rel="stylesheet" href="{% static 'dashboard/css/globals.css' %}">
  <script>
    (function(){
      try {
        var t = localStorage.getItem('oxlet_theme');
        if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) { document.documentElement.setAttribute('data-theme','light'); }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { overflow-x: hidden; }
    .seller-page { max-width: 1080px; margin: 0 auto; padding: 14px; }
    .seller-hd { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:var(--bg); border:.5px solid var(--bd); border-radius:14px; margin-bottom:10px; gap:10px; }
    .seller-hd h1 { font-size:20px; font-weight:800; color:var(--t1); margin:0; word-break:break-word; }
    .seller-hd .sub { font-size:12px; color:var(--t3); margin-top:2px; }
    .filter-bar { background:var(--bg); border:.5px solid var(--bd); border-radius:12px; padding:10px 12px; margin-bottom:10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .filter-bar .lbl { font-size:11px; color:var(--t3); font-weight:600; margin-right:4px; }
    .f-btn { font-size:11px; padding:5px 11px; border-radius:14px; border:.5px solid var(--bd2); background:var(--bg2); color:var(--t2); cursor:pointer; font-family:inherit; white-space:nowrap; }
    .f-btn.on { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:600; }
    .f-divider { width:1px; height:20px; background:var(--bd); margin:0 4px; }
    .kgrid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-bottom:10px; }
    .kpi-card { background:var(--bg); border:.5px solid var(--bd); border-radius:12px; padding:10px 11px; cursor:pointer; transition:transform .12s, box-shadow .12s; min-width:0; }
    .kpi-card:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.08); }
    .kpi-card.active { border-color:var(--blue); box-shadow:0 0 0 2px var(--blue-bg); }
    .kpi-card .kl { font-size:10px; color:var(--t3); font-weight:500; margin-bottom:4px; line-height:1.3; word-break:break-word; }
    .kpi-card .kv { font-size:22px; font-weight:800; line-height:1; }
    .kpi-card .ks { font-size:10px; color:var(--t3); margin-top:3px; word-break:break-word; line-height:1.4; }
    .cgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
    .cgrid > .chart-card.span2 { grid-column: span 2; }
    .chart-card { background:var(--bg); border:.5px solid var(--bd); border-radius:12px; padding:12px; min-width:0; }
    .chart-card .chart-title { font-size:12px; font-weight:700; color:var(--t1); margin-bottom:8px; }
    .chart-card .chart-box { position:relative; height:220px; }
    .chart-card.span2 .chart-box { height:240px; }
    .section { background:var(--bg); border:.5px solid var(--bd); border-radius:12px; padding:13px; margin-bottom:10px; }
    .section h2 { font-size:14px; font-weight:700; color:var(--t1); margin:0 0 10px; display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:6px; }
    .section h2 .count { font-size:11px; color:var(--t3); font-weight:500; }
    .lead-row { display:grid; grid-template-columns:auto 1fr auto auto; gap:10px; align-items:center; padding:8px 10px; border:.5px solid var(--bd); border-radius:8px; margin-bottom:6px; font-size:12px; cursor:pointer; }
    .lead-row.must { border-color:var(--red); background:var(--red-bg); }
    .lead-row .code { font-weight:700; color:var(--blue); font-size:11px; }
    .lead-row .phone { font-family:monospace; color:var(--t1); font-weight:600; }
    .lead-row .info { font-size:10px; color:var(--t2); margin-top:2px; word-break:break-word; }
    .lead-row .badge-col { display:flex; flex-direction:column; gap:3px; align-items:flex-end; min-width:80px; }
    .badge { font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; white-space:nowrap; }
    .b-red { background:var(--red); color:#fff; }
    .b-amber { background:var(--amber-bg); color:var(--amber); }
    .b-green { background:var(--green-bg); color:var(--green); }
    .b-gray { background:var(--bg2); color:var(--t3); }
    .dots-mini { display:inline-flex; gap:2px; align-items:center; }
    .dot-mini { width:7px; height:7px; border-radius:50%; }
    .empty { text-align:center; padding:24px; color:var(--t3); font-size:13px; }
    .err-wrap { text-align:center; padding:80px 16px; }
    .err-wrap .ttl { font-size:18px; font-weight:700; color:var(--t1); margin-bottom:6px; }
    /* booking table — บน mobile ห่อด้วย wrapper ที่ scroll ได้ */
    .section table { width:100%; }
    @media (max-width:960px) {
      /* tablet — 5 KPI cards → 3 cols */
      .kgrid[style*="repeat(5"] { grid-template-columns: repeat(3, minmax(0,1fr)) !important; }
    }
    @media (max-width:760px) {
      .seller-page { padding: 10px; }
      .kgrid { grid-template-columns:repeat(2,minmax(0,1fr)) !important; gap:6px; }
      .cgrid { grid-template-columns:1fr; }
      .cgrid > .chart-card.span2 { grid-column: auto; }
      .lead-row { grid-template-columns:1fr; gap:6px; }
      .lead-row .badge-col { flex-direction:row; align-items:center; min-width:auto; flex-wrap:wrap; }
      .kpi-card .kv { font-size:20px; }
      .section { padding: 12px 10px; }
      /* booking table มี column เยอะ — wrap ด้วย overflow scroll */
      .section table { display:block; overflow-x:auto; white-space:nowrap; }
    }
    @media (max-width:420px) {
      .kpi-card .kv { font-size:18px; }
      .kpi-card .kl, .kpi-card .ks { font-size:9.5px; }
      .seller-hd h1 { font-size:17px; }
      .seller-hd { padding: 12px 13px; }
    }
  </style>
</head>
<body>
<div class="seller-page">
  {% if error %}
  <div class="err-wrap">
    <div class="ttl">{% if seller %}เกิดข้อผิดพลาด{% else %}ไม่มีสิทธิ์เข้าถึง{% endif %}</div>
    <div style="font-size:13px;color:var(--t2);margin-top:8px">{{ error }}</div>
  </div>
  {% else %}
  <div id="root"><div class="loading-container"><div class="spin"></div><span style="font-size:13px">กำลังโหลด...</span></div></div>
  {% endif %}
</div>

{% if not error %}
<script>
  const D = {{ data_json|safe }};
  const C = {{ constants_json|safe }};
  const SELLER_NAME = "{{ seller|escapejs }}";

  // ── helpers ──
  const h = (s) => s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
  const pct = (a,b) => b > 0 ? Math.round((a/b)*100) : 0;
  const nc = (u) => Math.max(0, C.UPD_TGT - u);

  // ── state ──
  // Filter mode: month (เลือกเดือน) | range (เลือกช่วงวัน) | today | all
  // เลือก month → reset range; เลือก range → reset month (mutually exclusive)
  // กรองด้วย "ช่วงวันที่รับเคส" (จาก-ถึง ข้ามเดือนได้) — รวมตัวกรองเดือน/ช่วงวันเดิมที่ซ้ำกันให้เหลือชุดเดียว
  const _ymdS = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  let fMonth = 0;          // vestige (passFilter/กราฟ บางจุดอ้าง) — ใช้ช่วงวันแทน
  let fDay = 0;
  let fDateFrom = _ymdS(new Date(new Date().getFullYear(), new Date().getMonth(), 1));  // default = ต้นเดือนปัจจุบัน
  let fDateTo = _ymdS(new Date());                                                       // ถึงวันนี้
  let kpiFilter = 'inHand';
  let viewMode = 'leads';
  let bookStatusFilter = 'all';
  let statusFilter = 'all';   // dropdown ในหัว lead list: all | follow | returned | cancelled | reassigned
  let sortOrder = '';         // '' (default urgency) | 'updates_desc' | 'updates_asc'
  let pageMode = 'dashboard'; // 'dashboard' | 'finance' — เลือกจาก dropdown โหมดบนหัว
  const __charts = {};

  // ── date utils ──
  function parseSheetDate(s) {
    if (!s || s === '-') return null;
    s = String(s).trim();
    // Excel serial date (4-5 หลักล้วน) — เช่น 46053
    if (/^\d{4,5}$/.test(s)) {
      const serial = parseInt(s, 10);
      if (serial > 40000 && serial < 50000) {   // ช่วงสมเหตุสมผล ~2009-2036 (กันเลขมั่ว เช่น 25235)
        const dt = new Date(Date.UTC(1899, 11, 30) + serial * 86400000);
        return { day: dt.getUTCDate(), month: dt.getUTCMonth() + 1, year: dt.getUTCFullYear() };
      }
      return null;
    }
    const m = s.match(/^(\d+)\/(\d+)\/(\d+)/);
    if (m) return { day: +m[1], month: +m[2], year: +m[3] };
    return null;
  }
  // คืน normalized JS Date จาก sheet date (รองรับ พ.ศ./yy/yyyy)
  function sheetDateToJS(d) {
    if (!d) return null;
    let y = d.year;
    if (y < 100) y += (y > 50 ? 2500 : 2000);  // >50 = พ.ศ. 2 หลัก (69→2569), ≤50 = ค.ศ. (26)
    if (y > 2500) y -= 543;
    return new Date(y, d.month - 1, d.day);
  }
  function dateMatchesFilter(s) {
    const d = parseSheetDate(s);
    if (!d) return !fDateFrom && !fDateTo && fMonth === 0 && fDay === 0;

    // Range mode — ถ้ามี fDateFrom หรือ fDateTo (override month + day)
    if (fDateFrom || fDateTo) {
      const ld = sheetDateToJS(d);
      if (!ld) return false;
      if (fDateFrom) {
        const from = new Date(fDateFrom + 'T00:00:00');
        if (ld < from) return false;
      }
      if (fDateTo) {
        const to = new Date(fDateTo + 'T23:59:59');
        if (ld > to) return false;
      }
      return true;
    }

    // Month/day mode (legacy)
    if (fMonth > 0 && d.month !== fMonth) return false;
    if (fDay === -1) {
      const now = new Date();
      return d.day === now.getDate() && d.month === (now.getMonth()+1);
    }
    return true;
  }

  // ── Helpers สำหรับ Action Hint / Stale Cases / Funnel ──
  // คืนจำนวนวันจาก dateStr (sheet format) ถึงวันนี้ (null ถ้า parse ไม่ได้)
  function daysSinceSheetDate(dateStr) {
    const p = parseSheetDate(dateStr);
    const d = sheetDateToJS(p);
    if (!d) return null;
    return Math.floor((new Date() - d) / 86400000);
  }

  // วันที่ห่างจาก lastUpdate (อาจมีเวลาตามหลัง) — null ถ้าไม่มี
  function daysSinceLastUpdate(lead) {
    const lu = lead.lastUpdate;
    if (!lu || lu === '-') return null;
    // ตัดเวลาออกถ้ามี
    const dateOnly = String(lu).split(' ')[0];
    return daysSinceSheetDate(dateOnly);
  }

  // ── Action Hint: บอกเซลล์ว่าทำอะไรต่อกับเคสนี้ ──
  // อิงจาก status เป็นหลัก → fallback ตามอายุ lead
  function getActionHint(lead) {
    const a = (lead.adminStatus||'').toLowerCase();
    const s = (lead.salesStatus||'').toLowerCase();
    const combined = a + ' ' + s;
    const daysOld = daysSinceSheetDate(lead.dateIn);

    // ── Stage-based hints (specific status wins) ──
    if (combined.includes('รอปล่อย'))  return {icon:'🚗', text:'นัดวันรับรถ', color:'var(--green)'};
    if (combined.includes('รอผล'))      return {icon:'🏦', text:'เช็คผลกับธนาคาร', color:'var(--amber)'};
    if (combined.includes('รอเซ็น'))    return {icon:'✍️', text:'นัดวันเซ็นเอกสาร', color:'var(--amber)'};
    if (combined.includes('จอง'))       return {icon:'📝', text:'ตามเอกสารให้ครบ', color:'var(--amber)'};
    if (combined.includes('โทรไม่รับ')) return {icon:'📅', text:'ลองโทรช่วง 16-19 น.', color:'var(--red)'};
    if (combined.includes('ผิดนัด'))    return {icon:'⏰', text:'นัดเวลาใหม่ + ยืนยัน', color:'var(--red)'};
    if (combined.includes('นัดหมาย'))   return {icon:'📌', text:'ยืนยันนัดก่อน 1 ชม.', color:'var(--blue)'};
    if (combined.includes('รอตอบ') || combined.includes('รอลูกค้า')) {
      return {icon:'💬', text:'ส่ง LINE ติดตามผล', color:'var(--blue)'};
    }
    if (combined.includes('ติดตาม'))    return {icon:'📞', text:'โทรตามต่อ', color:'var(--blue)'};

    // ── Fallback: ยังไม่โทร → ดูตามอายุ lead ──
    if (!lead.updateCount) {
      if (daysOld === null)    return {icon:'📞', text:'โทรเลย', color:'var(--blue)'};
      if (daysOld <= 1)        return {icon:'🔥', text:'โทรเลย — lead ใหม่!', color:'var(--red)'};
      if (daysOld <= 3)        return {icon:'⚡', text:`เร่งโทร (${daysOld} วันแล้ว)`, color:'var(--amber)'};
      if (daysOld <= 7)        return {icon:'⚠️', text:`${daysOld} วันแล้ว — เร่งติดต่อ`, color:'var(--red)'};
      return {icon:'❄️', text:`${daysOld} วัน — เคสกำลังจะหลุดมือ`, color:'var(--red)'};
    }

    // โทรไปแล้วแต่ไม่มี status เด่นชัด
    return {icon:'📞', text:'อัพเดทเคสล่าสุด', color:'var(--blue)'};
  }

  // ── เดือนปัจจุบัน (สำหรับ banner แจ้งเตือน — ไม่ขึ้นกับ filter) ──
  function leadsInCurrentMonth() {
    const now = new Date();
    const curMonth = now.getMonth() + 1;
    return (D.leads || []).filter(l => {
      const d = parseSheetDate(l.dateIn);
      return d && d.month === curMonth;
    });
  }

  // ── KPI filters ──
  // D.leads รวม junk (คืนเคส/ยกเลิก/จ่ายใหม่/จบ/ส่งมอบ/ไม่สนใจ/dead) ครบ — เซลล์เห็นทั้งหมด
  // แต่ KPI "ยังไม่โทร" + "ต้องโทรต่อ" + banner ตัด junk ออก เพราะไม่ควรเตือนให้โทรเคสที่ admin ปิดแล้ว
  //
  // KPI cards (ภาพรวมหลัก) — clickable filter ของ lead list
  //   "ต้องโทรต่อ" = ภาพรวมที่เซลล์สนใจที่สุด (status-based, คนละมิติกับ "โทรกี่ครั้ง")
  // CALL_FILTERS (filter chip row ด้านล่าง) — drill-down ตามจำนวนครั้งที่โทร (disjoint)
  const SKIP_KEYWORDS = ['จบ','ส่งมอบ','คืนเคส','คืน','ยกเลิก','ไม่สนใจ','dead','จ่ายใหม่'];
  const FOLLOW_KEYWORDS = ['ติดตาม','รอตอบ','รอลูกค้า','รอ','โทรไม่รับ','ผิดนัด','นัดหมาย'];
  // คอลัม Z "สถานะลูกค้า" (layout ใหม่) — sync กับ backend customer_status logic
  // เคสเสีย (ในวงเล็บ): ยังไม่ออก/แบล็คลิส/เครดิตไม่ผ่าน/ไม่สนใจ/คืนเคส
  const Z_DEAD = ['ยังไม่ออก','แบล็คลิส','เครดิตไม่ผ่าน','ไม่สนใจ','คืนเคส'];
  const zVal = (l) => (l.customerStatus || '').trim();
  const isSkipped = (l) => {
    const z = zVal(l);
    if (z) return Z_DEAD.some(k => z.includes(k));   // มี Z → Z ตัดสินว่า junk
    const a = (l.adminStatus||'').toLowerCase();
    const s = (l.salesStatus||'').toLowerCase();
    return SKIP_KEYWORDS.some(k => {
      const kw = k.toLowerCase();
      return (a && a.includes(kw)) || (s && s.includes(kw));
    });
  };
  // "จอง / ปล่อย / ส่งมอบ" = เคสที่จัดการแล้ว (ไม่ต้องเตือนให้โทรตามอีก)
  const isBooked = (l) => {
    const z = zVal(l);
    if (z) return z.includes('จอง') || z.includes('ส่งมอบ') || z.includes('ปล่อย');
    const a = (l.adminStatus||'').toLowerCase();
    const s = (l.salesStatus||'').toLowerCase();
    return a.includes('จอง') || s.includes('จอง') || a.includes('ปล่อย') || s.includes('ปล่อย');
  };
  // "เคสในมือ" = เคสที่ยังต้องดูแล (ติดตาม + จอง + ปล่อย) ไม่นับเคสปิด (คืน/ยกเลิก/จ่ายใหม่)
  const isInHand = (l) => {
    if (isSkipped(l)) return false;
    const z = zVal(l);
    if (z) return !Z_DEAD.some(k => z.includes(k));   // มี Z + ไม่ dead = ยังอยู่ในมือ
    const a = (l.adminStatus||'').toLowerCase();
    const s = (l.salesStatus||'').toLowerCase();
    // เช็คทั้ง admin + sales (เดือน มิ.ย.+ salesStatus ว่าง แต่ adminStatus=ติดตาม)
    const fk = (x) => x && x !== '-' && FOLLOW_KEYWORDS.some(k => x.includes(k));
    if (fk(s) || fk(a)) return true;
    if (a.includes('จอง') || s.includes('จอง')) return true;
    if (a.includes('ปล่อย') || s.includes('ปล่อย')) return true;
    return false;
  };
  const KPI_DEFS = [
    { key: 'inHand',    label: 'เคสในมือ',         color: 'var(--blue)',   hint: 'ติดตาม + จอง + ปล่อย (ไม่นับปิด)', test: isInHand },
    { key: 'called',    label: 'โทรแล้วมีหลักฐาน', color: 'var(--green)',  hint: 'callProof = ส่งแล้ว',  test: l => l.callProof === 'ส่งแล้ว' },
    { key: 'notCalled', label: 'ยังไม่โทร',       color: 'var(--red)',    hint: 'updateCount = 0 (ไม่รวมเคสปิด/จอง/ปล่อย)', test: l => !l.updateCount && !isSkipped(l) && !isBooked(l) },
    { key: 'follow',    label: 'ต้องโทรต่อ',      color: 'var(--blue)',   hint: 'สถานะลูกค้า = ต้องตาม (ไม่รวมเคสปิด/จอง/ปล่อย)', test: l => {
        if (isSkipped(l)) return false;
        if (isBooked(l)) return false;   // จองแล้ว = ไม่ต้องเตือนโทร
        if (zVal(l)) return true;        // มี Z + ผ่าน skip/booked = สถานะ active ต้องตาม
        const s = (l.salesStatus||'').toLowerCase();
        const a = (l.adminStatus||'').toLowerCase();   // เช็ค admin ด้วย (มิ.ย.+ sales ว่าง)
        if ((!s || s==='-') && (!a || a==='-')) return false;
        return FOLLOW_KEYWORDS.some(k => s.includes(k) || a.includes(k));
      }},
    { key: 'all',       label: 'เคสทั้งหมด',       color: 'var(--t1)',     hint: 'รวมที่ปิด/คืน/ยกเลิกด้วย', test: l => true },
  ];
  // Disjoint breakdown ตามจำนวนครั้งที่โทร — chip row ใต้ KPI
  const CALL_FILTERS = [
    { key: 'c0',    label: 'ยังไม่โทร', color: 'var(--red)',       test: l => l.updateCount === 0 },
    { key: 'c1',    label: '1 ครั้ง',   color: 'var(--amber)',     test: l => l.updateCount === 1 },
    { key: 'c2',    label: '2 ครั้ง',   color: 'var(--amber)',     test: l => l.updateCount === 2 },
    { key: 'c3',    label: '3 ครั้ง',   color: 'var(--green-mid)', test: l => l.updateCount === 3 },
    { key: 'cFull', label: `ครบ ${C.UPD_TGT}+`, color: 'var(--green)', test: l => l.updateCount >= C.UPD_TGT },
  ];
  const ALL_FILTERS = [...KPI_DEFS, ...CALL_FILTERS];
  const findFilter = (key) => ALL_FILTERS.find(f => f.key === key) || KPI_DEFS[0];

  // Dropdown สถานะ — เลือกจาก header ของ lead list (override kpiFilter เมื่อไม่ใช่ 'all')
  // junk statuses (คืน/ยกเลิก/จ่ายใหม่) override isInHand เพื่อให้เห็น list ได้
  function statusContains(l, ...kws) {
    const a = (l.adminStatus||'').toLowerCase();
    const s = (l.salesStatus||'').toLowerCase();
    return kws.some(k => {
      const lk = k.toLowerCase();
      return a.includes(lk) || s.includes(lk);
    });
  }
  const STATUS_FILTERS = [
    { key: 'all',        label: 'ทั้งหมด',   test: null },  // null = ใช้ kpiFilter test
    { key: 'follow',     label: 'ติดตาม',    test: l => {
        if (isSkipped(l)) return false;
        const s = (l.salesStatus||'').toLowerCase();
        return s && s !== '-' && FOLLOW_KEYWORDS.some(k => s.includes(k));
    }},
    { key: 'returned',   label: 'คืนเคส',    test: l => statusContains(l, 'คืนเคส') },
    { key: 'cancelled',  label: 'ยกเลิก',    test: l => statusContains(l, 'ยกเลิก') },
    { key: 'reassigned', label: 'จ่ายใหม่',  test: l => statusContains(l, 'จ่ายใหม่') },
  ];
  const SORT_OPTIONS = [
    { key: '',             label: 'เรียงปกติ'  },
    { key: 'last_update',  label: 'อัพเดทล่าสุด' },
    { key: 'updates_desc', label: 'อัพเดทมาก→น้อย' },
    { key: 'updates_asc',  label: 'อัพเดทน้อย→มาก' },
  ];

  // ── ดึง leads ที่ผ่านการกรองช่วงเวลา ──
  function leadsInRange() {
    return (D.leads || []).filter(l => dateMatchesFilter(l.dateIn));
  }
  // ปล่อย → filter ตาม releaseDate (วันปล่อย); statuses อื่น → filter ตาม date (วันจอง)
  // เคสจองเดือน A แต่ปล่อยเดือน B ต้องนับเข้าเดือน B
  function bookingsInRange() {
    return (D.bookingCases || []).filter(b => {
      if (b.status === 'ปล่อย') {
        // releaseDate (คอลัมน์ W) บางเคส admin กรอกเป็นข้อความ เช่น "ปล่อย 9/5" / "รับวันที่ 30/5"
        // → ถ้า parse เป็นวันที่ไม่ได้ ใช้วันจอง (b.date) แทน (ตรงกับ backend get_done_month)
        let rd = b.releaseDate;
        if (!rd || rd === '-' || !parseSheetDate(rd)) rd = b.date;
        return dateMatchesFilter(rd);
      }
      return dateMatchesFilter(b.date);
    });
  }

  // ── chart init ──
  function destroyChart(id) {
    if (__charts[id]) { __charts[id].destroy(); delete __charts[id]; }
  }
  // ฿ แบบกระชับ (shared by KPI + chart axis)
  const fmtBahtChart = (n) => {
    const v = Number(n||0);
    if (v >= 1000000) return '฿' + (v/1000000).toFixed(v >= 10000000 ? 1 : 2) + 'M';
    if (v >= 100000)  return '฿' + Math.round(v/1000) + 'K';
    if (v >= 1000)    return '฿' + (v/1000).toFixed(1) + 'K';
    return '฿' + Math.round(v).toLocaleString();
  };

  function initCharts() {
    if (typeof Chart === 'undefined') return;
    const _dark = document.documentElement.getAttribute('data-theme') === 'dark';
    Chart.defaults.color = _dark ? '#aaa0c4' : '#56506b';
    Chart.defaults.borderColor = _dark ? 'rgba(255,255,255,0.08)' : 'rgba(109,40,217,0.08)';
    const daily = D.daily || {};
    const monthly = D.monthly || {};
    const isDaily = fMonth > 0;
    let labels, leadNormal, leadRJ, bookings, dones, dealValue;

    if (isDaily) {
      const m = daily[fMonth] || daily[String(fMonth)] || { leads:[], leadRJ:[], bookings:[], dones:[], dealValue:[] };
      const yr = (D.meta && D.meta.year) || new Date().getFullYear();
      const daysInMonth = new Date(yr, fMonth, 0).getDate();
      labels = []; leadNormal=[]; leadRJ=[]; bookings=[]; dones=[]; dealValue=[];
      for (let d=1; d<=daysInMonth; d++) {
        labels.push(String(d));
        leadNormal.push((m.leads||[])[d] || 0);
        leadRJ.push((m.leadRJ||[])[d] || 0);
        bookings.push((m.bookings||[])[d] || 0);
        dones.push((m.dones||[])[d] || 0);
        dealValue.push((m.dealValue||[])[d] || 0);
      }
    } else {
      labels = C.MONTHS_SHORT;
      leadNormal=[]; leadRJ=[]; bookings=[]; dones=[]; dealValue=[];
      for (let m=1; m<=12; m++) {
        const x = monthly[m] || monthly[String(m)] || {};
        leadNormal.push(x.leadNormal || 0);
        leadRJ.push(x.leadRJ || 0);
        bookings.push(x.booking || 0);
        dones.push(x.done || 0);
        dealValue.push(x.dealValue || 0);
      }
    }

    const cv1 = document.getElementById('chart-leads');
    if (cv1) {
      destroyChart('leads');
      __charts.leads = new Chart(cv1, {
        type: 'line',
        data: { labels, datasets: [
          { label: 'Lead ปกติ', data: leadNormal, borderColor:'#3b82f6', backgroundColor:'rgba(59,130,246,.15)', tension:.35, fill:true, pointRadius:isDaily?2:3 },
          { label: 'RJ', data: leadRJ, borderColor:'#ef4444', backgroundColor:'rgba(239,68,68,.1)', tension:.35, fill:true, pointRadius:isDaily?2:3 },
        ]},
        options: { responsive:true, maintainAspectRatio:false,
          plugins:{legend:{position:'bottom',labels:{boxWidth:11,font:{size:10}}}},
          scales:{y:{beginAtZero:true,ticks:{precision:0}}}
        }
      });
    }

    const cv2 = document.getElementById('chart-bd');
    if (cv2) {
      destroyChart('bd');
      __charts.bd = new Chart(cv2, {
        type: 'bar',
        data: { labels, datasets: [
          { label:'จอง', data:bookings, backgroundColor:'#f59e0b' },
          { label:'ปล่อย', data:dones, backgroundColor:'#10b981' },
        ]},
        options: { responsive:true, maintainAspectRatio:false,
          plugins:{legend:{position:'bottom',labels:{boxWidth:11,font:{size:10}}}},
          scales:{y:{beginAtZero:true,ticks:{precision:0}}}
        }
      });
    }

    const cv3 = document.getElementById('chart-pipe');
    if (cv3) {
      destroyChart('pipe');
      const order = C.STATUS_ORDER || ['จอง','รอเซ็นต์','รอผล','รอปล่อย','ปล่อย','รีเจ็ก'];
      const pl = {}; order.forEach(k => pl[k] = 0);
      bookingsInRange().forEach(b => { if (pl[b.status] !== undefined) pl[b.status]++; });
      const counts = order.map(k => pl[k] || 0);
      const colors = order.map(k => (C.STATUS_COLOR || {})[k] || '#888');
      __charts.pipe = new Chart(cv3, {
        type:'doughnut',
        data:{ labels:order, datasets:[{ data:counts, backgroundColor:colors, borderWidth:0 }]},
        options:{ responsive:true, maintainAspectRatio:false, cutout:'60%',
          plugins:{legend:{position:'right',labels:{boxWidth:11,font:{size:10}}}},
        }
      });
    }

    // 4) Line — 💰 ยอดปล่อย (Deal Value)
    const cv4 = document.getElementById('chart-deal-value');
    if (cv4) {
      destroyChart('dealValue');
      const totalDV = dealValue.reduce((a,b)=>a+b,0);
      __charts.dealValue = new Chart(cv4, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'ยอดปล่อย (฿)', data: dealValue,
            borderColor: '#059669',
            backgroundColor: 'rgba(5,150,105,.15)',
            tension: .35, fill: true,
            pointRadius: isDaily ? 2 : 4,
            pointBackgroundColor: '#059669',
            borderWidth: 2.4,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => '฿' + Number(ctx.parsed.y||0).toLocaleString(),
                footer: () => totalDV > 0 ? 'รวม ' + fmtBahtChart(totalDV) : '',
              },
            },
          },
          scales: {
            y: { beginAtZero: true, ticks: { callback: (v) => fmtBahtChart(v) } },
          },
        }
      });
    }
  }

  // ── badges ──
  function callBadge(l) {
    if (l.callProof === 'ส่งแล้ว') return '<span class="badge b-green">มีหลักฐาน</span>';
    if (l.updateCount === 0) return '<span class="badge b-red">ยังไม่โทร</span>';
    if (l.updateCount < C.UPD_TGT) return `<span class="badge b-amber">โทรอีก ${nc(l.updateCount)}</span>`;
    return '<span class="badge b-green">ครบ</span>';
  }
  function dotsMini(u) {
    let h = '<span class="dots-mini">';
    for (let i=0; i<C.UPD_TGT; i++) {
      let c = '#ccc';
      if (i<u) {
        if (u >= C.UPD_TGT) c = '#3B6D11';
        else if (u >= 3) c = '#1D9E75';
        else if (u >= 2) c = '#EF9F27';
        else c = '#E24B4A';
      }
      h += `<span class="dot-mini" style="background:${c}"></span>`;
    }
    h += `<span style="font-size:9px;color:var(--t3);margin-left:3px">${u}/${C.UPD_TGT}</span></span>`;
    return h;
  }

  // ── render ──
  function render() {
    if (pageMode === 'finance') { renderFinanceMode(); return; }
    if (pageMode === 'loan') { renderLoanMode(); return; }
    const s = D.seller;
    const teamId = s.team || '?';
    const teamName = (C.TEAM_NAMES || {})[teamId] || teamId;
    const allLeads = leadsInRange();
    const bookings = bookingsInRange();

    // KPI + filter chip counts
    const kpiCounts = {};
    ALL_FILTERS.forEach(k => { kpiCounts[k.key] = allLeads.filter(k.test).length; });
    // Booking สถานะ "ปล่อย" — bookings ผ่าน bookingsInRange() ที่ filter "ปล่อย" ด้วย releaseDate แล้ว
    const doneBookings = bookings.filter(b => b.status === 'ปล่อย');
    const doneCount = doneBookings.length;
    const dealValueRange = doneBookings.reduce((a,b)=>a+(Number(b.price)||0),0);

    // เคสในมือ breakdown — จาก leads ที่ผ่าน isInHand (mutual exclusive bucket)
    // priority: ปล่อย > จอง > ติดตาม → sum = kpiCounts['inHand']
    let h_follow = 0, h_booking = 0, h_released = 0;
    allLeads.filter(isInHand).forEach(l => {
      const a = (l.adminStatus||'').toLowerCase();
      const s = (l.salesStatus||'').toLowerCase();
      if (a.includes('ปล่อย') || s.includes('ปล่อย')) h_released++;
      else if (a.includes('จอง') || s.includes('จอง')) h_booking++;
      else h_follow++;
    });
    const followCount = h_follow;
    const bookingCount = h_booking;
    const inHandTotal = kpiCounts['inHand'] || 0;

    const periodLabel = (() => {
      if (fDateFrom || fDateTo) {
        const f = fDateFrom || '...';
        const t = fDateTo || '...';
        return `${f} ถึง ${t}`;
      }
      if (fDay === -1) return 'วันนี้';
      const mm = fMonth > 0 ? `เดือน${(C.MONTHS_FULL||[])[fMonth-1] || fMonth}` : 'ทั้งปี';
      return mm;
    })();

    // ฿ แบบกระชับ
    const fmtBaht = (n) => {
      const v = Number(n||0);
      if (v >= 1000000) return '฿' + (v/1000000).toFixed(v >= 10000000 ? 1 : 2) + 'M';
      if (v >= 100000)  return '฿' + Math.round(v/1000) + 'K';
      if (v >= 1000)    return '฿' + (v/1000).toFixed(1) + 'K';
      return '฿' + Math.round(v).toLocaleString();
    };

    let html = `
      ${modeBar()}
      <div class="seller-hd">
        <div>
          <h1>${h(SELLER_NAME)}</h1>
          <div class="sub">ทีม ${h(teamName)} · เป้า ${s.target} คัน · ${h(periodLabel)}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:22px;font-weight:800;color:var(--green)">${doneCount}/${s.target}</div>
          <div style="font-size:11px;color:var(--t3)">ปล่อยในช่วงนี้</div>
        </div>
      </div>

      <div class="kgrid" style="margin-bottom:10px;grid-template-columns:1fr">
        <div class="kpi-card" style="cursor:default">
          <div class="kl">ยอดปล่อย ${h(periodLabel)}</div>
          <div class="kv" style="color:var(--green-mid)">${fmtBaht(dealValueRange)}</div>
          <div class="ks">${doneCount ? 'เฉลี่ย '+fmtBaht(dealValueRange/doneCount)+'/คัน · ' + doneCount + ' คัน' : 'ยังไม่มีปล่อย'}</div>
        </div>
      </div>

      ${renderAICoachCard()}

      ${(() => {
        // ── 🔔 แจ้งเตือนเดือนปัจจุบัน — ไม่ขึ้นกับ filter (เพื่อ remind เซลล์เสมอ) ──
        // exclude junk (คืน/ยกเลิก/จ่ายใหม่/...) + จอง/ปล่อย — ไม่ remind เคสที่จัดการแล้ว
        const curMonthLeads = leadsInCurrentMonth().filter(l => !isSkipped(l) && !isBooked(l));
        const curNotCalled = curMonthLeads.filter(l => !l.updateCount).length;
        const curFollow = curMonthLeads.filter(l => {
          const s = (l.salesStatus||'').toLowerCase();
          return s && s !== '-' && ['ติดตาม','รอตอบ','รอลูกค้า','รอ','โทรไม่รับ','ผิดนัด','นัดหมาย'].some(k => s.includes(k));
        }).length;
        const curMonthName = (C.MONTHS_FULL||[])[new Date().getMonth()] || '';
        if (curNotCalled === 0 && curFollow === 0) return '';
        return `
        <div style="background:var(--amber-bg,#fff7e6);border-left:3px solid var(--amber,#ef9f27);border-radius:8px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <span style="font-size:12px;font-weight:700;color:var(--amber,#b07005)">เดือน${h(curMonthName)}</span>
          ${curNotCalled>0 ? `<span style="font-size:12px;color:var(--red);font-weight:600">ยังไม่โทร <b>${curNotCalled}</b> เคส</span>` : ''}
          ${curFollow>0 ? `<span style="font-size:12px;color:var(--blue);font-weight:600">ต้องตามต่อ <b>${curFollow}</b> เคส</span>` : ''}
        </div>`;
      })()}

      <div class="filter-bar">
        <span class="lbl">📅 วันที่รับเคส</span>
        <input type="date" value="${h(fDateFrom)}" onchange="setDateFrom(this.value)" title="ตั้งแต่วันที่" style="padding:6px 10px;border:.5px solid var(--bd2);border-radius:8px;background:var(--bg);color:var(--t1);font-size:12px;font-family:inherit;cursor:pointer">
        <span style="font-size:11px;color:var(--t3)">ถึง</span>
        <input type="date" value="${h(fDateTo)}" onchange="setDateTo(this.value)" title="ถึงวันที่" style="padding:6px 10px;border:.5px solid var(--bd2);border-radius:8px;background:var(--bg);color:var(--t1);font-size:12px;font-family:inherit;cursor:pointer">
        <button class="f-btn" onclick="setRangeMonth()">เดือนนี้</button>
        <button class="f-btn" onclick="setRangeYear()">ทั้งปี</button>
        <button class="f-btn ${(fDateFrom&&fDateFrom===fDateTo)?'on':''}" onclick="setRangeToday()">วันนี้</button>
      </div>

      <div class="kgrid" style="grid-template-columns:repeat(5,minmax(0,1fr))">
        ${KPI_DEFS.map(k => {
          // เคสในมือ → override hint ให้แสดง breakdown (ใช้ตัวเลขจาก leads sheet ให้ sum ตรงกับ count)
          const hint = k.key === 'inHand'
            ? `ติดตาม ${h_follow} · จอง ${h_booking} · ปล่อย ${h_released}`
            : k.hint;
          return `
          <div class="kpi-card ${kpiFilter===k.key?'active':''}" onclick="setKpi('${k.key}')">
            <div class="kl">${k.label}</div>
            <div class="kv" style="color:${k.color}">${kpiCounts[k.key]}</div>
            <div class="ks">${hint}</div>
          </div>
        `;}).join('')}
      </div>

      <div class="filter-bar" style="margin-bottom:10px">
        <span class="lbl">จำนวนครั้งที่โทร</span>
        ${CALL_FILTERS.map(k => {
          const on = kpiFilter === k.key;
          return `<button class="f-btn ${on?'on':''}" onclick="setKpi('${k.key}')" style="${on?`background:${k.color};color:#fff;border-color:${k.color};font-weight:600`:''}">${h(k.label)} <b>${kpiCounts[k.key]}</b></button>`;
        }).join('')}
      </div>

      ${(() => {
        // ── ⚠️ เคสค้าง — ยังไม่โทรเกิน 7 วัน ──
        // นับเฉพาะ: เคสที่ยังไม่โทร (updateCount=0) — ไม่ว่ามี/ไม่มีสถานะติดตาม
        // ตัดออก: junk · จอง · ปล่อย (เพราะจัดการไปแล้ว)
        const staleCases = allLeads
          .filter(l => {
            if (isSkipped(l)) return false;            // ตัด junk
            const a = (l.adminStatus||'').toLowerCase();
            const s = (l.salesStatus||'').toLowerCase();
            if (a.includes('จอง') || s.includes('จอง')) return false;     // ตัดจอง
            if (a.includes('ปล่อย') || s.includes('ปล่อย')) return false; // ตัดปล่อย
            if (l.updateCount > 0) return false;       // นับเฉพาะที่ยังไม่โทร
            const opened = daysSinceSheetDate(l.dateIn);
            if (opened === null) return false;
            l._staleDays = opened;
            return opened > 7;
          })
          .sort((a, b) => (b._staleDays||0) - (a._staleDays||0));

        if (staleCases.length === 0) return '';

        const showTop = staleCases.slice(0, 5);
        const rest = staleCases.slice(5);
        const rowHtml = (l) => {
          const car = h(l.car || '-');
          const phone = h(l.phone || '-');
          const code = h(l.code || '-');
          const days = l._staleDays;
          const hasStatus = (l.adminStatus && l.adminStatus !== '-') || (l.salesStatus && l.salesStatus !== '-');
          const lastInfo = hasStatus ? `มีสถานะแต่ยังไม่โทร · รับมา ${days} วัน` : `ยังไม่มีสถานะ · รับมา ${days} วัน`;
          return `
            <div style="background:var(--bg);border-radius:6px;padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px" onclick="openLeadDetail('${code}')">
              <div style="flex:1;min-width:0">
                <div style="font-size:12px;font-weight:600;color:var(--t1)">${car}</div>
                <div style="font-size:10.5px;color:var(--t3)">${code} · ${phone} · ${lastInfo}</div>
              </div>
              <div style="background:var(--red);color:#fff;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700;flex-shrink:0">${days}d</div>
            </div>
          `;
        };
        return `
        <div style="background:var(--red-bg,#fee);border:.5px solid var(--red-mid,#fca);border-left:3px solid var(--red);border-radius:8px;padding:10px 14px;margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap">
            <div style="font-size:13px;font-weight:700;color:var(--red);display:flex;align-items:center;gap:6px">
              ⚠️ เคสค้าง — ยังไม่โทรเกิน 7 วัน <span style="background:var(--red);color:#fff;padding:1px 7px;border-radius:10px;font-size:11px">${staleCases.length}</span>
            </div>
            <div style="font-size:10.5px;color:var(--t3)">เรียงจากค้างนานสุด — คลิกดูรายละเอียด</div>
          </div>
          <div style="display:grid;gap:5px">
          ${showTop.map(rowHtml).join('')}
          </div>
          ${rest.length > 0 ? `
            <details style="margin-top:6px">
              <summary style="font-size:11px;color:var(--red);cursor:pointer;padding:4px 0;font-weight:600;text-align:center">+ ดูอีก ${rest.length} เคส</summary>
              <div style="display:grid;gap:5px;margin-top:5px">${rest.map(rowHtml).join('')}</div>
            </details>
          ` : ''}
        </div>
        `;
      })()}

      ${(() => {
        // ── 🎯 Lead Score Priority — โทรเคสไหนก่อน ──
        // filter: ยังต้องตาม (!isSkipped + !isBooked) + มีคะแนน
        // จอง/ปล่อยแล้ว = จัดการแล้ว ไม่ต้องเตือนให้โทร
        // sort: คะแนนสูงสุดก่อน (hot → warm → cold)
        const priorityLeads = allLeads
          .filter(l => !isSkipped(l) && !isBooked(l) && (l.leadScore !== undefined && l.leadScore !== null))
          .sort((a,b) => (b.leadScore||0) - (a.leadScore||0))
          .slice(0, 10);

        if (priorityLeads.length === 0) {
          return '';
        }

        const tierColor = (t) => {
          if (!t) return 'var(--t3)';
          if (t.includes('hot'))  return 'var(--red)';
          if (t.includes('warm')) return 'var(--amber)';
          return 'var(--blue)';
        };
        const tierBg = (t) => {
          if (!t) return 'var(--bg2)';
          if (t.includes('hot'))  return 'var(--red-bg,#fee)';
          if (t.includes('warm')) return 'var(--amber-bg,#fff7e6)';

        return `

              </div>
              <div style="height:22px;background:var(--green);border-radius:5px;width:${widthOf(booked)}%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600">${Math.round((booked/received)*100)}%</div>
            </div>

            <div style="text-align:center;font-size:10.5px;color:${rateColor(releaseRate, 70, 40)};font-weight:600;padding:1px 0">▼ ${releaseRate}% ปิดดีล</div>

            <!-- Stage 4: ปล่อย -->
            <div>
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:2px">
                <span style="color:var(--t2);font-weight:600">🚗 ปล่อยรถ</span>
                <span style="font-weight:700;color:var(--t1)">${released} เคส</span>
              </div>
              <div style="height:22px;background:#3a8a3a;border-radius:5px;width:${widthOf(released)}%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600">${received>0?Math.round((released/received)*100):0}%</div>
            </div>

          ${insights.length > 0 ? `
            <div style="background:var(--amber-bg,#fff7e6);border-left:3px solid var(--amber);border-radius:6px;padding:9px 12px;font-size:11.5px;line-height:1.7;color:var(--t1)">
              <div style="font-weight:700;color:var(--amber);margin-bottom:3px">💡 สังเกตได้</div>

          ` : `
            <div style="background:var(--bg2);border-radius:6px;padding:9px 12px;font-size:11px;color:var(--t2);text-align:center">
              ${received < 10 ? 'รับเคสน้อย — sample ยังเล็กไป รอข้อมูลครบก่อน' : '✅ funnel ดูสมดุล — pipeline ของคุณเคลื่อนได้ดี'}

      <div style="display:flex;gap:6px;background:var(--bg2);border:.5px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:10px">
        <button onclick="setViewMode('leads')" style="flex:1;padding:9px 14px;border:none;border-radius:9px;background:${viewMode==='leads'?'var(--blue)':'transparent'};color:${viewMode==='leads'?'#fff':'var(--t2)'};font-size:13px;font-weight:700;cursor:pointer">รายการ Lead <span style="opacity:.85;font-weight:400">(${allLeads.length})</span></button>
        <button onclick="setViewMode('bookings')" style="flex:1;padding:9px 14px;border:none;border-radius:9px;background:${viewMode==='bookings'?'var(--blue)':'transparent'};color:${viewMode==='bookings'?'#fff':'var(--t2)'};font-size:13px;font-weight:700;cursor:pointer">เคสจอง <span style="opacity:.85;font-weight:400">(${bookings.length})</span></button>

      ${viewMode === 'leads' ? renderLeadList(allLeads) : renderBookingSection(bookings)}

    document.getElementById('root').innerHTML = html;
    initCharts();

  function renderLeadList(allLeads) {
    const def = findFilter(kpiFilter);
    const sf = STATUS_FILTERS.find(x => x.key === statusFilter) || STATUS_FILTERS[0];

    // ถ้าเลือก dropdown status (ไม่ใช่ 'all') → override kpiFilter ใช้ status test
    let filtered;
    if (sf.test) {
      filtered = allLeads.filter(sf.test);
    } else {
      filtered = allLeads.filter(def.test);
    }

    // Sort
    if (sortOrder === 'updates_desc') {
      filtered.sort((a,b) => b.updateCount - a.updateCount);
    } else if (sortOrder === 'updates_asc') {
      filtered.sort((a,b) => a.updateCount - b.updateCount);
    } else if (sortOrder === 'last_update') {
      // อัพเดทล่าสุดก่อน (lastUpdate desc); ไม่มีวันที่ → ล่างสุด
      filtered.sort((a,b) => {
        const da = sheetDateToJS(parseSheetDate(a.lastUpdate));
        const db = sheetDateToJS(parseSheetDate(b.lastUpdate));
        return (db ? db.getTime() : 0) - (da ? da.getTime() : 0);
      });
    } else {
      // default: สถานะลูกค้า (Z) สำคัญก่อน → ยังไม่โทรก่อน → โทรน้อยไปมาก
      filtered.sort((a,b) => {
        const pa = a.followPriority||0, pb = b.followPriority||0;
        if (pa !== pb) return pb - pa;     // 🎯 สนใจมาก > ลังเล > ... ก่อน
        const sa = a.updateCount === 0 ? 100 : 0; const sb = b.updateCount === 0 ? 100 : 0;
        if (sa !== sb) return sb - sa;
        return a.updateCount - b.updateCount;
      });
    }

    const title = sf.key !== 'all' ? sf.label : def.label;
    const hintText = sf.key !== 'all' ? `เฉพาะสถานะ ${sf.label}` : (def.hint || `updateCount = ${def.label}`);

    let html = `<div class="section">
      <h2>${h(title)} <span class="count">${filtered.length} เคส · ${h(hintText)} · คลิกดูรายละเอียด</span></h2>

      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;padding:8px 10px;background:var(--bg2);border-radius:8px">
        <span style="font-size:11px;color:var(--t3);font-weight:600">สถานะ</span>
        <select id="status-filter-dd" onchange="setStatusFilter(this.value)" style="padding:5px 10px;border:.5px solid var(--bd2);border-radius:6px;background:var(--bg);color:var(--t1);font-size:12px;font-family:inherit;cursor:pointer;outline:none;max-width:160px">
          ${STATUS_FILTERS.map(s => `<option value="${s.key}" ${statusFilter===s.key?'selected':''}>${h(s.label)}</option>`).join('')}
        </select>
        <span style="width:1px;height:18px;background:var(--bd);margin:0 2px"></span>
        <span style="font-size:11px;color:var(--t3);font-weight:600">เรียง</span>
        ${SORT_OPTIONS.map(o => {
          const on = sortOrder === o.key;
          return `<button class="f-btn ${on?'on':''}" onclick="setSortOrder('${o.key}')">${h(o.label)}</button>`;
        }).join('')}
      </div>
    `;
    if (filtered.length === 0) {
      html += `<div class="empty">ไม่มีเคสในเงื่อนไขนี้</div>`;
    } else {
      filtered.slice(0, 100).forEach(l => {
        const mustCall = l.callProof !== 'ส่งแล้ว' && l.updateCount < C.UPD_TGT;
        const safeCode = (l.code||'').replace(/'/g, "\\'");
        html += `<div class="lead-row ${mustCall && kpiFilter!=='called'?'must':''}" onclick="openLeadDetail('${safeCode}')">
          <div>
            <div class="code">${h(l.code||'-')}</div>
            <div class="info">${h(l.dateIn||'-')}${l.timeIn?' '+h(l.timeIn):''}</div>
          </div>
          <div>
            <div class="phone">${h(l.phone||'-')}</div>
            <div class="info">${h(l.car||'-')}${l.channel?' · '+h(l.channel):''}${l.leadType?' · '+h(l.leadType):''}</div>
            ${l.note && l.note !== '-' ? `<div class="info" style="color:var(--t3);margin-top:2px">${h(l.note.slice(0,60))}</div>` : ''}
          </div>
          <div class="badge-col">
            ${callBadge(l)}
            ${l.salesStatus && l.salesStatus !== '-' ? `<span class="badge b-gray" title="sales_status">${h(l.salesStatus.slice(0,14))}</span>` : ''}
            ${l.adminStatus && l.adminStatus !== '-' ? `<span class="badge b-gray" style="opacity:.6" title="admin_status">${h(l.adminStatus.slice(0,12))}</span>` : ''}
          </div>
          <div>${dotsMini(l.updateCount)}</div>
        </div>`;
      });
      if (filtered.length > 100) {
        html += `<div class="empty">+ อีก ${filtered.length - 100} เคส (แสดงสูงสุด 100)</div>`;
      }
    }
    html += `</div>`;
    return html;
  }

  // ── Lead detail modal ──
  // ── คอลัม S "มากรอกชีตกันเถอะ" — แตกเป็นช่องตามจำนวนอัพเดท (Q) คั่นด้วย / ──
  function leadNoteParts(l) {
    const raw = (l.fillNote != null ? l.fillNote : (l.note || '')) || '';
    const parts = raw ? raw.split('/').map(s => s.trim()) : [];
    const n = Math.max(l.updateCount || 0, parts.length, 1);
    const out = [];
    for (let i = 0; i < n; i++) out.push(parts[i] || '');
    return out;
  }
  function noteSlotsHtml(l) {
    return leadNoteParts(l).map((v, i) => `
      <div style="display:flex;gap:7px;align-items:center;margin-bottom:5px">
        <span style="flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--bg2);color:var(--t3);font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700">${i+1}</span>
        <input class="note-slot" value="${h(v)}" placeholder="อัพเดทครั้งที่ ${i+1}…" style="flex:1;min-width:0;padding:7px 9px;border-radius:7px;border:.5px solid var(--bd2);background:var(--bg);color:var(--t1);font-size:12px">
      </div>`).join('');
  }
  // สถานะลูกค้า (คอลัม Z) → badge สีตามความสำคัญ
  function zStatusBadge(l) {
    const z = (l.customerStatus || '').trim();
    if (!z) return '';
    const p = l.followPriority || 0;
    const col = p >= 5 ? 'var(--green)' : p >= 3 ? 'var(--amber)' : p >= 1 ? 'var(--blue)' : 'var(--t3)';
    return `<span class="badge" style="background:${col};color:#fff">🎯 ${h(z)}</span>`;
  }
  async function saveLeadNote(code) {
    const overlay = document.getElementById('lead-detail-overlay');
    if (!overlay) return;
    const inputs = overlay.querySelectorAll('.note-slot');
    const note = Array.from(inputs).map(i => i.value.trim()).join(' / ');
    const token = location.pathname.split('/').filter(Boolean)[1] || '';
    const l = (D.leads || []).find(x => x.code === code);
    let month = null;
    try { const d = parseSheetDate(l && l.dateIn); if (d) month = d.getMonth() + 1; } catch (e) {}
    const btn = document.getElementById('save-note-btn');
    const msg = document.getElementById('save-note-msg');
    const orig = btn.textContent; btn.disabled = true; btn.textContent = '⏳ บันทึกลงชีต…';
    try {
      const r = await fetch('/api/seller/update_note', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, code, note, month }),
      });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || 'save failed');
      if (l) { l.fillNote = note; l.note = note; }
      btn.textContent = '✓ บันทึกแล้ว';
      if (msg) msg.innerHTML = `<span style="color:var(--green)">✓ เขียนลงชีต ${h(d.tab||'')} ช่อง ${h(d.cell||'')}</span>`;
      setTimeout(() => { btn.disabled = false; btn.textContent = orig; }, 1500);
    } catch (e) {
      if (msg) msg.innerHTML = `<span style="color:var(--red)">✕ ${h(String(e.message || e))}</span>`;
      btn.disabled = false; btn.textContent = orig;
    }
  }

  // ── สถานะลูกค้า (คอลัม Z) — รายการ + priority (sync กับ backend) ──
  // 8 ตัวบนตามลำดับสำคัญ → 5 ตัวล่างในวงเล็บ = เคสเสีย (ไม่ต้องตาม)
  const Z_STATUSES = ['สนใจมาก','ลังเล','ไม่รับสาย','รอเงิน','รอเช็คเครดิต','ดาวน์ไม่พอ','จอง','ส่งมอบ',
                      'ยังไม่ออกเร็วๆนี้','ติดแบล็คลิส','เครดิตไม่ผ่าน','ลูกค้าไม่สนใจแล้ว','คืนเคส'];
  const Z_PRIORITY = {'สนใจมาก':8,'ลังเล':7,'ไม่รับสาย':6,'รอเงิน':5,'รอเช็คเครดิต':4,'ดาวน์ไม่พอ':3,'จอง':2,'ส่งมอบ':1};
  function zPriority(z) { if (!z) return 0; for (const k in Z_PRIORITY) if (z.includes(k)) return Z_PRIORITY[k]; return 0; }
  // ประเภทลูกค้า (คอลัม Y) — preset + เพิ่มเองได้
  const CUSTOMER_TYPE_PRESETS = ['พนักงานบริษัท','เจ้าของธุรกิจส่วนตัว','อาชีพอื่นๆ','ไม่แจ้งอาชีพ'];
  function customerTypeOptions(cur) {
    const seen = (D.leads || []).map(x => (x.customerType || '').trim()).filter(Boolean);
    const all = [...new Set([...CUSTOMER_TYPE_PRESETS, ...seen, (cur || '').trim()].filter(Boolean))];
    return all;
  }
  // เลือก dropdown ที่มี option "เพิ่มเอง" → prompt แล้วเขียน
  async function onSelectField(code, field, sel) {
    let v = sel.value;
    if (v === '__add__') {
      v = (prompt('เพิ่มประเภทลูกค้าใหม่:') || '').trim();
      if (!v) { sel.value = ''; return; }
    }
    await saveLeadField(code, field, v, sel);
  }

  // เขียนค่ากลับชีต 1 ช่อง (field = customer_status / call_proof / fill_sheet_note)
  async function saveLeadField(code, field, value, el) {
    const token = location.pathname.split('/').filter(Boolean)[1] || '';
    const l = (D.leads || []).find(x => x.code === code);
    let month = null;
    try { const d = parseSheetDate(l && l.dateIn); if (d) month = d.getMonth() + 1; } catch (e) {}
    const msg = document.getElementById('field-save-msg');
    if (el) el.disabled = true;
    if (msg) msg.innerHTML = '<span style="color:var(--t3)">⏳ บันทึกลงชีต…</span>';
    try {
      const r = await fetch('/api/seller/update_note', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, code, field, value, month }),
      });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || 'fail');
      if (l) {
        const PROP = { customer_status:'customerStatus', call_proof:'callProof', customer_profile:'profile',
          occupation:'occupation', income:'income', job_tenure:'jobTenure', payment_history:'paymentHistory',
          customer_type:'customerType', fill_sheet_note:'fillNote' };
        if (PROP[field]) l[PROP[field]] = value;
        if (field === 'customer_status') l.followPriority = zPriority(value);
        if (field === 'fill_sheet_note') l.note = value;
      }
      const FNAME = { customer_status:'สถานะลูกค้า', call_proof:'หลักฐานโทร', customer_profile:'โปรไฟล์',
        occupation:'อาชีพ', income:'รายได้', job_tenure:'อายุงาน', payment_history:'ประวัติผ่อน',
        customer_type:'ประเภทลูกค้า', fill_sheet_note:'โน้ต' };
      const fname = FNAME[field] || 'ข้อมูล';
      if (msg) msg.innerHTML = `<span style="color:var(--green)">✓ บันทึก ${fname} ลงชีต ${h(d.tab||'')} ${h(d.cell||'')}</span>`;
    } catch (e) {
      if (msg) msg.innerHTML = `<span style="color:var(--red)">✕ ${h(String(e.message || e))}</span>`;
    } finally { if (el) el.disabled = false; }
  }

  // ── filter actions ──
  function setMonth(m) {
    fMonth = m;
    if (m === 0) fDay = 0;
    // เลือก month → ล้าง date range (mutually exclusive)
    if (m > 0) { fDateFrom = ''; fDateTo = ''; }
    render();
  }
  function setMonthFromInput(v) {
    if (!v) { setMonth(0); return; }
    const mo = parseInt(v.split('-')[1] || '0');
    if (mo >= 1 && mo <= 12) setMonth(mo);
  }
  function setDay(d) {
    fDay = d;
    if (d !== 0) { fDateFrom = ''; fDateTo = ''; }  // วันนี้ override range
    render();
  }
  function setDateFrom(v) {
    fDateFrom = v || '';
    // เลือก date range → ล้าง month + day (mutually exclusive)
    if (fDateFrom) { fMonth = 0; fDay = 0; }
    render();
  }
  function setDateTo(v) {
    fDateTo = v || '';
    if (fDateTo) { fMonth = 0; fDay = 0; }
    render();
  }
  function clearDateRange() { fDateFrom = ''; fDateTo = ''; render(); }
  function resetFilter() { fMonth = 0; fDay = 0; fDateFrom = ''; fDateTo = ''; render(); }
  // ปุ่มลัดช่วงวัน
  function setRangeMonth() { const d=new Date(); fDateFrom=_ymdS(new Date(d.getFullYear(),d.getMonth(),1)); fDateTo=_ymdS(d); fMonth=0; fDay=0; render(); }
  function setRangeYear() { const d=new Date(); fDateFrom=`${d.getFullYear()}-01-01`; fDateTo=_ymdS(d); fMonth=0; fDay=0; render(); }
  function setRangeToday() { const d=new Date(); fDateFrom=_ymdS(d); fDateTo=_ymdS(d); fMonth=0; fDay=0; render(); }
  function setKpi(k) { kpiFilter = k; viewMode = 'leads'; statusFilter = 'all'; render(); }
  function setViewMode(m) { viewMode = m; render(); }
  function setBookStatus(s) { bookStatusFilter = s; render(); }
  function setStatusFilter(v) { statusFilter = v; viewMode = 'leads'; render(); }
  function setSortOrder(v) { sortOrder = v; render(); }

  // ── 📷 สแกนเอกสาร (Gemini OCR) → เติมฟอร์มเป็นร่าง ──
  function downscaleImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        let w = img.width, hh = img.height;
        if (Math.max(w, hh) > maxDim) { const s = maxDim / Math.max(w, hh); w = Math.round(w*s); hh = Math.round(hh*s); }
        const cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
        cv.getContext('2d').drawImage(img, 0, 0, w, hh);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('โหลดรูปไม่ได้')); };
      img.src = url;
    });
  }
  // เซ็ตค่าเข้า field — input ใส่ตรง, select หา option ที่ match (exact/contains/normalize)
  function fcSet(id, val) {
    if (!val) return;
    const el = document.getElementById(id);
    if (!el) return;
    if (el.tagName === 'SELECT') {
      const opts = Array.from(el.options).filter(o => o.value);
      const norm = (s) => (s||'').replace(/[^฀-๿a-zA-Z0-9]/g, '').toLowerCase();
      let m = opts.find(o => o.value === val)
           || opts.find(o => o.value.includes(val) || val.includes(o.value))
           || opts.find(o => norm(o.value) && (norm(o.value).includes(norm(val)) || norm(val).includes(norm(o.value))));
      if (m) el.value = m.value;
    } else {
      el.value = val;
    }
  }
  function applyScanFields(f) {
    ['leadCode','branch','customer','car','plate','price','finco','status','approved','down','monthly','terms','cond','signDate','signTime','extra']
      .forEach(k => fcSet('fc_' + k, f[k]));
  }
  async function scanDoc(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const st = document.getElementById('fc_scan_status');
    st.innerHTML = '<span style="display:inline-flex;align-items:center;gap:7px;color:var(--blue);font-weight:600"><span class="spin" style="width:15px;height:15px;border-width:2px;display:inline-block"></span>กำลังอ่านเอกสาร...</span>';
    try {
      const dataUrl = await downscaleImage(file, 2048, 0.92);
      const res = await fetch('/api/seller/scan_doc', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: dataUrl }),
      });
      const j = await res.json();
      if (!res.ok || j.error) {
        st.innerHTML = `<span style="color:var(--red)">⚠️ ${h(j.error || 'อ่านไม่สำเร็จ')}</span>`;
      } else {
        applyScanFields(j.fields || {});
        st.innerHTML = `<span style="color:var(--green)">✅ กรอกให้แล้ว — ตรวจ/แก้ก่อนกดส่ง</span>`;
      }
    } catch (e) {
      st.innerHTML = `<span style="color:var(--red)">⚠️ ${h(e.message)}</span>`;
    } finally {
      input.value = '';
    }
  }

    const inS = 'width:100%;padding:9px 11px;border:.5px solid var(--bd2);border-radius:9px;background:var(--bg2);color:var(--t1);font-size:13px;outline:none;font-family:inherit;box-sizing:border-box';
    const lbl = (t) => `<div style="font-size:11px;color:var(--t2);font-weight:600;margin-bottom:5px">${t}</div>`;
    const inp = (id, ph, val) => `<input id="ln_${id}" placeholder="${h(ph||'')}" value="${h(val||'')}" style="${inS}">`;
    const num = (id, ph) => `<input id="ln_${id}" type="text" inputmode="numeric" placeholder="${h(ph||'')}" style="${inS}">`;
    const sel = (id, opts) => `<select id="ln_${id}" style="${inS};cursor:pointer">${opts.map((o,i)=>`<option value="${i===0?'':h(o)}">${h(o)}</option>`).join('')}</select>`;
    const area = (id, ph) => `<textarea id="ln_${id}" placeholder="${h(ph||'')}" rows="2" style="${inS};resize:vertical;min-height:54px"></textarea>`;
    const f = (label, ctrl, span) => `<div${span?' style="grid-column:span 2"':''}>${lbl(label)}${ctrl}</div>`;
    const grid = (inner) => `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${inner}</div>`;

    const html = `
      ${modeBar()}
      <div style="background:var(--blue-bg,#e6f1fb);border:.5px solid var(--blue);border-radius:14px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px">
        <div style="font-size:26px">📄</div>
        <div>
          <div style="font-size:17px;font-weight:800;color:var(--t1)">ข้อมูลผู้ยื่นขอสินเชื่อรถยนต์มือสอง</div>
          <div style="font-size:12px;color:var(--t2)">ถ่ายรูปใบยื่น → กรอกอัตโนมัติ → ตรวจ/แก้ → ส่งให้ Senior อนุมัติ</div>
        </div>
      </div>

      <div style="background:var(--blue-bg,#e6f1fb);border:.5px dashed var(--blue);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <input id="ln_scan_input" type="file" accept="image/*" capture="environment" style="display:none" onchange="scanLoanDoc(this)">
        <button onclick="document.getElementById('ln_scan_input').click()" style="padding:10px 16px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap">📷 สแกนใบยื่น กรอกอัตโนมัติ</button>
        <span style="font-size:11px;color:var(--t2);flex:1;min-width:160px">ถ่ายรูปใบกระดาษ → ระบบอ่านลายมือกรอกให้ แล้ว<b>ตรวจ/แก้ก่อนส่ง</b></span>
        <span id="ln_scan_status" style="font-size:12px"></span>
      </div>

      <div class="section">
        <h2>👤 ข้อมูลผู้เช่าซื้อ (ลูกค้า)</h2>
        ${grid(
          f('ชื่อลูกค้า', inp('customer','ชื่อ-นามสกุล'), true) +
          f('อายุ', inp('age','ปี')) +
          f('เบอร์โทร', inp('phone','08x-xxx-xxxx')) +
          f('จังหวัด', inp('province','จังหวัด')) +
          f('เพศ', sel('sex',['เลือก','ชาย','หญิง'])) +
          f('ที่พัก', sel('residence',['เลือก','บ้านตัวเอง','บ้านเช่า','ห้องเช่า','บ้านพักสวัสดิการ'])) +
          f('ค่าเช่า/ผ่อนบ้าน (บาท/เดือน)', num('rent','0')) +
          f('ระยะเวลาที่อาศัย', inp('liveYears','เช่น 20 ปี')) +
          f('สถานภาพ', sel('marital',['เลือก','โสด','สมรส','จดทะเบียน','ไม่จดทะเบียน'])) +
          f('จำนวนบุตร', inp('children','คน'))
        )}
      </div>

      <div class="section">
        <h2>💼 อาชีพ &amp; รายได้</h2>
        ${grid(
          f('อาชีพ', sel('occupation',['เลือก','พนักงานบริษัท','เจ้าของกิจการ','ค้าขาย','เกษตรกร','รับเหมา','อื่นๆ'])) +
          f('แหล่งที่มารายได้', sel('incomeSource',['เลือก','เงินเข้าบัญชีอัตโนมัติ','รับเงินสด','นายจ้างโอนเข้าบัญชี'])) +
          f('ชื่อบริษัท', inp('company','')) +
          f('ทำเกี่ยวกับ', inp('companyAbout','')) +
          f('ที่ตั้งบริษัท', inp('companyLoc',''), true) +
          f('ตำแหน่ง', inp('position','')) +
          f('อายุงาน', inp('workYears','ปี/เดือน')) +
          f('ฐานเงินเดือน', num('salary','0')) +
          f('โอที (OT)', num('ot','0')) +
          f('รับเฉลี่ย/เดือน', num('avgIncome','0')) +
          f('ชื่อกิจการ/ร้าน', inp('bizName','')) +
          f('ประเภทสินค้า', inp('bizType','')) +
          f('ที่ตั้งกิจการ', inp('bizLoc','')) +
          f('เปิดมาแล้ว', inp('bizYears','ปี/เดือน')) +
          f('ประกันสังคม', sel('socialSecurity',['เลือก','มี','ไม่มี'])) +
          f('หักประกันสังคม/เดือน', num('socialAmount','0')) +
          f('อาชีพอื่น', inp('otherJob',''), true)
        )}
      </div>

      <div class="section">
        <h2>📊 ประวัติการผ่อน / เครดิต</h2>
        ${grid(
          f('ประเภทประวัติผ่อน', sel('loanHistoryType',['เลือก','บ้าน','รถยนต์','รถมอเตอร์ไซค์'])) +
          f('บัตรเครดิต / ประวัติ', sel('credit',['เลือก','บัตรเครดิต','ไม่มีประวัติ','อื่นๆ'])) +
          f('ธนาคารที่ผ่อนอยู่', inp('payBank','')) +
          f('งวดละ (บาท)', num('payInstallment','0')) +
          f('ผ่อนมาแล้ว', inp('payDuration','เช่น 1 ปี')) +
          f('สถานะการผ่อน', sel('payStatus',['เลือก','ผ่อนดีผ่อนตรง','เคยล่าช้าไม่เกิน 30 วัน','ล่าช้าเกิน 30 วัน'])) +
          f('การปิดบัญชี', sel('payClosed',['เลือก','ผ่อนชำระหมดแล้ว','ปิดปกติ','ไม่ปกติ'])) +
          f('แบล็คลิสต์', sel('blacklist',['เลือก','ไม่ติด','ปิดแล้ว','ยังไม่ปิด'])) +
          f('Tracking ใน 2 ปี', sel('tracking',['เลือก','เคยยื่นตรวจสอบเครดิต','ไม่เคยยื่น'])) +
          f('สินเชื่อที่ขอ (จำนวนครั้ง)', inp('creditRequests',''))
        )}
      </div>

      <div class="section">
        <h2>🚗 การเลือกไฟแนนซ์</h2>
        ${grid(
          f('รุ่นรถที่เลือกซื้อ', inp('carModel','เช่น Honda Civic 2020'), true) +
          f('ไฟแนนซ์ที่เลือกจัด', sel('finance', LN_BANKS), true)
        )}
        <div style="margin-top:12px">${lbl('เหตุผลที่เลือกไฟแนนซ์นี้')}${area('reason','เช่น อนุมัติง่ายกว่า, ดอกเบี้ยต่ำ...')}</div>
        <div style="margin-top:12px">${lbl('หมายเหตุ')}${area('note','ถ้ามี...')}</div>
      </div>

      <details class="section" style="padding:0">
        <summary style="list-style:none;cursor:pointer;padding:13px;font-size:14px;font-weight:700;color:var(--t1)">🤝 ผู้ค้ำ / ผู้กู้ร่วม <span style="font-size:11px;font-weight:400;color:var(--t3)">(ถ้ามี — กดเพื่อกรอก)</span></summary>
        <div style="padding:0 13px 13px">
          ${grid(
            f('ชื่อผู้ค้ำ', inp('gCustomer','ชื่อ-นามสกุล')) +
            f('ความสัมพันธ์', inp('gRelation','เช่น พี่/น้อง/คู่สมรส')) +
            f('อายุ', inp('gAge','ปี')) +
            f('เบอร์โทร', inp('gPhone','')) +
            f('จังหวัด', inp('gProvince','')) +
            f('อาชีพ', inp('gOccupation','')) +
            f('รายได้เฉลี่ย/เดือน', num('gAvgIncome','0'))
          )}
        </div>
      </details>

      <div class="section">
        <h2>✍️ ลงชื่อ</h2>
        ${grid(
          f('ชื่อคนแนะนำ', inp('referrer','')) +
          f('เบอร์คนแนะนำ', inp('referrerPhone','')) +
          f('พนักงานขาย', inp('sales','', SELLER_NAME)) +
          f('วันที่', `<input id="ln_date" type="date" style="${inS};cursor:pointer">`)
        )}
      </div>

      <div id="ln-result" style="margin-bottom:10px"></div>
      <div id="ln-preview-box" style="display:none;margin-bottom:10px"></div>

      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button onclick="previewLoan()" style="padding:12px 18px;border-radius:11px;border:.5px solid var(--bd2);background:var(--bg);color:var(--t1);font-size:13px;font-weight:700;cursor:pointer">👁️ ดูตัวอย่าง</button>
        <button onclick="copyLoan()" style="padding:12px 18px;border-radius:11px;border:.5px solid var(--bd2);background:var(--bg);color:var(--t1);font-size:13px;font-weight:700;cursor:pointer">📋 คัดลอกข้อความ</button>
        <button id="ln-send-btn" onclick="sendLoan()" style="flex:1;min-width:180px;padding:12px 18px;border-radius:11px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:800;cursor:pointer">💾 บันทึก &amp; ส่ง LINE</button>
      </div>
    `;
    document.getElementById('root').innerHTML = html;
  }

  function collectLoan() {
    const v = (id) => (document.getElementById('ln_' + id)?.value || '').trim();
    const o = {};
    LN_KEYS.forEach(k => o[k] = v(k));
    return o;
  }
  function applyLoanScanFields(f) { LN_KEYS.forEach(k => fcSet('ln_' + k, f[k])); }
  function loanText(d) {
    const x = (s) => s || '-';
    const g = d.gCustomer ? `\n\n🤝 ผู้ค้ำ: ${x(d.gCustomer)} (${x(d.gRelation)})  อาชีพ ${x(d.gOccupation)}  รายได้ ${x(d.gAvgIncome)}` : '';
    return `📄 ข้อมูลผู้ยื่นขอสินเชื่อ
━━━━━━━━━━━━
👤 ${x(d.customer)}  อายุ ${x(d.age)}  ${x(d.phone)}  จ.${x(d.province)}
เพศ ${x(d.sex)} · ${x(d.marital)} · บุตร ${x(d.children)} · ที่พัก ${x(d.residence)}

💼 อาชีพ: ${x(d.occupation)}  รายได้ ${x(d.incomeSource)}
บริษัท/กิจการ: ${x(d.company || d.bizName)}
ฐานเงินเดือน ${x(d.salary)} · OT ${x(d.ot)} · เฉลี่ย/เดือน ${x(d.avgIncome)}

📊 ประวัติเครดิต: ${x(d.credit)}
ผ่อน ${x(d.payBank)} งวดละ ${x(d.payInstallment)} (${x(d.payDuration)}) — ${x(d.payStatus)}
แบล็คลิสต์: ${x(d.blacklist)} · Tracking: ${x(d.tracking)}

🚗 รถ: ${x(d.carModel)}
🏦 ไฟแนนซ์: ${x(d.finance)}
เหตุผล: ${x(d.reason)}${g}

🧑‍💼 เซลล์: ${x(d.sales)}  ผู้แนะนำ: ${x(d.referrer)}
📝 ${x(d.note)}`;
  }
  function previewLoan() {
    const box = document.getElementById('ln-preview-box');
    box.style.display = 'block';
    box.innerHTML = `<div style="background:var(--bg2);border:.5px solid var(--bd);border-radius:11px;padding:14px 16px;white-space:pre-wrap;word-break:break-word;font-size:12.5px;line-height:1.7;color:var(--t1)">${h(loanText(collectLoan()))}</div>`;
    box.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  function copyLoan() {
    navigator.clipboard.writeText(loanText(collectLoan())).then(() => {
      const box = document.getElementById('ln-result');
      box.innerHTML = `<div style="padding:9px 13px;background:var(--green-bg,#eaf3de);color:var(--green);border-radius:10px;font-size:12px;font-weight:600">✅ คัดลอกข้อความแล้ว</div>`;
      setTimeout(() => { box.innerHTML = ''; }, 2000);
    });
  }
  async function sendLoan() {
    const d = collectLoan();
    if (!d.customer && !d.phone) { alert('กรอกอย่างน้อย "ชื่อลูกค้า" หรือ "เบอร์โทร"'); return; }
    if (!confirm('ส่งใบยื่นสินเชื่อนี้เข้า LINE ให้ Senior อนุมัติ?')) return;
    const btn = document.getElementById('ln-send-btn');
    const box = document.getElementById('ln-result');
    btn.disabled = true; btn.textContent = '⏳ กำลังส่ง...';
    const token = location.pathname.split('/').filter(Boolean)[1] || '';
    try {
      const res = await fetch('/api/seller/loan_submit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, data: d }),
      });
      const j = await res.json();
      if (!res.ok || j.error) {
        box.innerHTML = `<div style="padding:10px 13px;background:var(--red-bg,#fcebeb);color:var(--red);border-radius:10px;font-size:12px;font-weight:600">⚠️ ${h(j.error || 'ส่งล้มเหลว')}</div>`;
      } else {
        box.innerHTML = `<div style="padding:10px 13px;background:var(--green-bg,#eaf3de);color:var(--green);border-radius:10px;font-size:12px;font-weight:600">✅ ส่งเข้า LINE แล้ว — รอ Senior อนุมัติ</div>`;
      }
    } catch (e) {
      box.innerHTML = `<div style="padding:10px 13px;background:var(--red-bg,#fcebeb);color:var(--red);border-radius:10px;font-size:12px;font-weight:600">⚠️ ${h(e.message)}</div>`;
    } finally {
      btn.disabled = false; btn.textContent = '💾 บันทึก & ส่ง LINE';
    }
  }
  async function scanLoanDoc(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const st = document.getElementById('ln_scan_status');
    st.innerHTML = '<span style="display:inline-flex;align-items:center;gap:7px;color:var(--blue);font-weight:600"><span class="spin" style="width:15px;height:15px;border-width:2px;display:inline-block"></span>กำลังอ่านใบยื่น...</span>';
    try {
      const dataUrl = await downscaleImage(file, 2048, 0.92);
      const res = await fetch('/api/seller/scan_doc', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: dataUrl, form: 'loan' }),
      });
      const j = await res.json();
      if (!res.ok || j.error) {
        st.innerHTML = `<span style="color:var(--red)">⚠️ ${h(j.error || 'อ่านไม่สำเร็จ')}</span>`;
      } else {
        applyLoanScanFields(j.fields || {});
        st.innerHTML = `<span style="color:var(--green)">✅ กรอกให้แล้ว — ตรวจ/แก้ก่อนกดส่ง</span>`;
      }
    } catch (e) {
      st.innerHTML = `<span style="color:var(--red)">⚠️ ${h(e.message)}</span>`;
    } finally {
      input.value = '';
    }
  }

  // ── 🤖 AI โค้ชส่วนตัว ──
  function renderAICoachCard() {
    return `
      <div class="section" style="margin-bottom:10px;border-left:3px solid var(--purple-mid,#8b5cf6)">
        <h2 style="display:flex;align-items:center;gap:6px;margin-bottom:6px">🤖 AI โค้ชส่วนตัว <span style="font-size:11px;font-weight:400;color:var(--t3)">วิเคราะห์ผลงาน + แนะนำ</span></h2>
        <div id="ai-coach-result" style="font-size:12.5px;color:var(--t1);line-height:1.7"></div>
        <button id="ai-coach-btn" onclick="runAICoach()" style="margin-top:6px;padding:9px 16px;border-radius:10px;border:none;background:var(--purple-mid,#8b5cf6);color:#fff;font-size:13px;font-weight:700;cursor:pointer">✨ ให้ AI วิเคราะห์ผลงานฉัน</button>
      </div>`;
  }
  function aiStatsSummary() {
    const s = D.seller; const cm = new Date().getMonth() + 1;
    const m = (D.monthly && (D.monthly[cm] || D.monthly[String(cm)])) || {};
    const MF = C.MONTHS_FULL || [];
    const num = (n) => Math.round(Number(n||0)).toLocaleString();
    return `ทีม ${s.team} · เป้าเดือนละ ${s.target} คัน
ทั้งปี: lead ${s.lead}, ปล่อย ${s.done}, ยอดปล่อย ${num(s.dealValue)} บาท
เดือน${MF[cm-1]||cm}: lead ${m.lead||0}, ติดตาม ${m.follow||0}, จอง ${m.booking||0}, ปล่อย ${m.done||0}/${s.target}, ยอด ${num(m.dealValue)} บาท`;
  }
  function aiMarkdown(t) {
    return h(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^[-*] /gm, '• ').replace(/\n/g, '<br>');
  }
  async function runAICoach() {
    const btn = document.getElementById('ai-coach-btn');
    const box = document.getElementById('ai-coach-result');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin" style="width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:middle"></span> AI กำลังวิเคราะห์...';
    try {
      const res = await fetch('/api/insights/seller', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seller: SELLER_NAME, stats: aiStatsSummary() }),
      });
      const j = await res.json();
      if (!res.ok || j.error) {
        box.innerHTML = `<div style="color:var(--red)">⚠️ ${h(j.error || 'วิเคราะห์ไม่สำเร็จ')}</div>`;
      } else {
        box.innerHTML = `<div style="background:var(--purple-bg,#f2ecfd);border-radius:10px;padding:12px 14px;margin-bottom:4px;line-height:1.7">${aiMarkdown(j.analysis)}</div>`;
      }
    } catch (e) {
      box.innerHTML = `<div style="color:var(--red)">⚠️ ${h(e.message)}</div>`;
    } finally {
      btn.disabled = false; btn.textContent = '✨ วิเคราะห์อีกครั้ง';
    }
  }

  render();
</script>
{% endif %}
</body>
</html>
