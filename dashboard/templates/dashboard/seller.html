{% load static %}<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard{% if seller %} — {{ seller }}{% endif %}</title>
  <link rel="icon" type="image/png" href="{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}">
  <link rel="apple-touch-icon" href="{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}">
  <link rel="stylesheet" href="{% static 'dashboard/css/globals.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    .seller-page { max-width: 1080px; margin: 0 auto; padding: 14px; }
    .seller-hd { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:var(--bg); border:.5px solid var(--bd); border-radius:14px; margin-bottom:10px; }
    .seller-hd h1 { font-size:20px; font-weight:800; color:var(--t1); margin:0; }
    .seller-hd .sub { font-size:12px; color:var(--t3); margin-top:2px; }
    .filter-bar { background:var(--bg); border:.5px solid var(--bd); border-radius:12px; padding:10px 12px; margin-bottom:10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .filter-bar .lbl { font-size:11px; color:var(--t3); font-weight:600; margin-right:4px; }
    .f-btn { font-size:11px; padding:4px 10px; border-radius:14px; border:.5px solid var(--bd2); background:var(--bg2); color:var(--t2); cursor:pointer; font-family:inherit; }
    .f-btn.on { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:600; }
    .f-divider { width:1px; height:20px; background:var(--bd); margin:0 4px; }
    .kgrid { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:10px; }
    .kpi-card { background:var(--bg); border:.5px solid var(--bd); border-radius:12px; padding:10px 11px; cursor:pointer; transition:transform .12s, box-shadow .12s; }
    .kpi-card:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.08); }
    .kpi-card.active { border-color:var(--blue); box-shadow:0 0 0 2px var(--blue-bg); }
    .kpi-card .kl { font-size:10px; color:var(--t3); font-weight:500; margin-bottom:4px; line-height:1.3; }
    .kpi-card .kv { font-size:22px; font-weight:800; line-height:1; }
    .kpi-card .ks { font-size:10px; color:var(--t3); margin-top:3px; }
    .cgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
    .cgrid > .chart-card.span2 { grid-column: span 2; }
    .chart-card { background:var(--bg); border:.5px solid var(--bd); border-radius:12px; padding:12px; }
    .chart-card .chart-title { font-size:12px; font-weight:700; color:var(--t1); margin-bottom:8px; }
    .chart-card .chart-box { position:relative; height:220px; }
    .chart-card.span2 .chart-box { height:240px; }
    .section { background:var(--bg); border:.5px solid var(--bd); border-radius:12px; padding:13px; margin-bottom:10px; }
    .section h2 { font-size:14px; font-weight:700; color:var(--t1); margin:0 0 10px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px; }
    .section h2 .count { font-size:11px; color:var(--t3); font-weight:500; }
    .lead-row { display:grid; grid-template-columns:auto 1fr auto auto; gap:10px; align-items:center; padding:8px 10px; border:.5px solid var(--bd); border-radius:8px; margin-bottom:6px; font-size:12px; cursor:pointer; }
    .lead-row.must { border-color:var(--red); background:var(--red-bg); }
    .lead-row .code { font-weight:700; color:var(--blue); font-size:11px; }
    .lead-row .phone { font-family:monospace; color:var(--t1); font-weight:600; }
    .lead-row .info { font-size:10px; color:var(--t2); margin-top:2px; }
    .lead-row .badge-col { display:flex; flex-direction:column; gap:3px; align-items:flex-end; min-width:80px; }
    .badge { font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; white-space:nowrap; }
    .b-red { background:var(--red); color:#fff; }
    .b-amber { background:var(--amber-bg); color:var(--amber); }
    .b-green { background:var(--green-bg); color:var(--green); }
    .b-gray { background:var(--bg2); color:var(--t3); }
    .dots-mini { display:inline-flex; gap:2px; align-items:center; }
    .dot-mini { width:7px; height:7px; border-radius:50%; }
    .empty { text-align:center; padding:24px; color:var(--t3); font-size:13px; }
    .err-wrap { text-align:center; padding-top:80px; }
    .err-wrap .ico { font-size:48px; margin-bottom:14px; }
    .err-wrap .ttl { font-size:18px; font-weight:700; color:var(--t1); margin-bottom:6px; }
    @media (max-width:760px) {
      .kgrid { grid-template-columns:repeat(3,1fr); }
      .cgrid { grid-template-columns:1fr; }
      .cgrid > .chart-card.span2 { grid-column: auto; }
      .lead-row { grid-template-columns:1fr auto; }
    }
    @media (max-width:480px) {
      .kgrid { grid-template-columns:repeat(2,1fr); }
    }
  </style>
</head>
<body>
<div class="seller-page">
  {% if error %}
  <div class="err-wrap">
    <div class="ico">{% if seller %}⚠️{% else %}🔒{% endif %}</div>
    <div class="ttl">{% if seller %}เกิดข้อผิดพลาด{% else %}ไม่มีสิทธิ์เข้าถึง{% endif %}</div>
    <div style="font-size:13px;color:var(--t2)">{{ error }}</div>
  </div>
  {% else %}
  <div id="root"></div>
  {% endif %}
</div>

{% if not error %}
<script>
  const D = {{ data_json|safe }};
  const C = {{ constants_json|safe }};
  const SELLER_NAME = "{{ seller|escapejs }}";

  // ── helpers ──
  const h = (s) => s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
  const pct = (a,b) => b > 0 ? Math.round((a/b)*100) : 0;
  const nc = (u) => Math.max(0, C.UPD_TGT - u);

  // ── state ──
  // Filter mode: month (เลือกเดือน) | range (เลือกช่วงวัน) | today | all
  // เลือก month → reset range; เลือก range → reset month (mutually exclusive)
  let fMonth = 0;          // 0=ทั้งปี/range/today, 1-12=เดือน
  let fDay = 0;            // 0=ทั้งเดือน/range, -1=วันนี้ (เก็บไว้ backward compat — UI ลบปุ่ม 1-31 ออก)
  let fDateFrom = '';      // 'YYYY-MM-DD' — ใช้คู่กับ fDateTo
  let fDateTo = '';        // 'YYYY-MM-DD'
  let kpiFilter = 'all';
  let viewMode = 'leads';
  let bookStatusFilter = 'all';
  const __charts = {};

  // ── date utils ──
  function parseSheetDate(s) {
    if (!s || s === '-') return null;
    const m = String(s).match(/^(\d+)\/(\d+)\/(\d+)/);
    if (m) return { day: +m[1], month: +m[2], year: +m[3] };
    return null;
  }
  // คืน normalized JS Date จาก sheet date (รองรับ พ.ศ./yy/yyyy)
  function sheetDateToJS(d) {
    if (!d) return null;
    let y = d.year;
    if (y < 100) y += 2000;
    if (y > 2500) y -= 543;
    return new Date(y, d.month - 1, d.day);
  }
  function dateMatchesFilter(s) {
    const d = parseSheetDate(s);
    if (!d) return !fDateFrom && !fDateTo && fMonth === 0 && fDay === 0;

    // Range mode — ถ้ามี fDateFrom หรือ fDateTo (override month + day)
    if (fDateFrom || fDateTo) {
      const ld = sheetDateToJS(d);
      if (!ld) return false;
      if (fDateFrom) {
        const from = new Date(fDateFrom + 'T00:00:00');
        if (ld < from) return false;
      }
      if (fDateTo) {
        const to = new Date(fDateTo + 'T23:59:59');
        if (ld > to) return false;
      }
      return true;
    }

    // Month/day mode (legacy)
    if (fMonth > 0 && d.month !== fMonth) return false;
    if (fDay === -1) {
      const now = new Date();
      return d.day === now.getDate() && d.month === (now.getMonth()+1);
    }
    return true;
  }

  // ── เดือนปัจจุบัน (สำหรับ banner แจ้งเตือน — ไม่ขึ้นกับ filter) ──
  function leadsInCurrentMonth() {
    const now = new Date();
    const curMonth = now.getMonth() + 1;
    return (D.leads || []).filter(l => {
      const d = parseSheetDate(l.dateIn);
      return d && d.month === curMonth;
    });
  }

  // ── KPI filters ──
  // เคสที่ admin_status มีคำว่า "จบ/ส่งมอบ/คืนเคส/คืน/ยกเลิก/ไม่สนใจ/dead/จ่ายใหม่"
  // → ยังนับใน 'หลีดที่รับ'/'โทรแล้วมีหลักฐาน'/'อัพเดท...' (เพื่อเก็บประวัติ stat เดือนเก่า)
  // → แต่ไม่ขึ้นใน 'ยังไม่โทร' + 'ต้องโทรต่อ' (เพราะ admin บอกว่าเคสจบแล้ว ไม่ต้อง remind)
  const SKIP_KEYWORDS = ['จบ','ส่งมอบ','คืนเคส','คืน','ยกเลิก','ไม่สนใจ','dead','จ่ายใหม่'];
  const isSkipped = (l) => {
    const s = (l.adminStatus||'').toLowerCase();
    return s && SKIP_KEYWORDS.some(k => s.includes(k.toLowerCase()));
  };
  const KPI_DEFS = [
    { key: 'all',       label: 'หลีดที่รับ',       color: 'var(--t1)',     hint: 'ทั้งหมด',           test: l => true },
    { key: 'called',    label: 'โทรแล้วมีหลักฐาน', color: 'var(--green)',  hint: 'callProof = ส่งแล้ว',  test: l => l.callProof === 'ส่งแล้ว' },
    { key: 'notCalled', label: 'ยังไม่โทร',       color: 'var(--red)',    hint: 'updateCount = 0 (ไม่รวมเคสจบ)', test: l => !l.updateCount && !isSkipped(l) },
    { key: 'upd2',      label: 'อัพเดท ≥ 2 ครั้ง',  color: 'var(--amber)',  hint: 'updateCount ≥ 2',     test: l => l.updateCount >= 2 },
    { key: 'updFull',   label: 'อัพเดทครบ',       color: 'var(--green-mid)', hint: `updateCount ≥ ${C.UPD_TGT}`, test: l => l.updateCount >= C.UPD_TGT },
    { key: 'follow',    label: 'ต้องโทรต่อ',      color: 'var(--blue)',   hint: 'sales_status = ติดตาม (ไม่รวมเคสจบ)', test: l => {
        if (isSkipped(l)) return false;
        const s = (l.salesStatus||'').toLowerCase();
        if (!s || s === '-') return false;
        return ['ติดตาม','รอตอบ','รอลูกค้า','รอ','โทรไม่รับ','ผิดนัด','นัดหมาย'].some(k => s.includes(k));
      }},
  ];

  // ── ดึง leads ที่ผ่านการกรองช่วงเวลา ──
  function leadsInRange() {
    return (D.leads || []).filter(l => dateMatchesFilter(l.dateIn));
  }
  function bookingsInRange() {
    return (D.bookingCases || []).filter(b => dateMatchesFilter(b.date));
  }

  // ── chart init ──
  function destroyChart(id) {
    if (__charts[id]) { __charts[id].destroy(); delete __charts[id]; }
  }
  // ฿ แบบกระชับ (shared by KPI + chart axis)
  const fmtBahtChart = (n) => {
    const v = Number(n||0);
    if (v >= 1000000) return '฿' + (v/1000000).toFixed(v >= 10000000 ? 1 : 2) + 'M';
    if (v >= 100000)  return '฿' + Math.round(v/1000) + 'K';
    if (v >= 1000)    return '฿' + (v/1000).toFixed(1) + 'K';
    return '฿' + Math.round(v).toLocaleString();
  };

  function initCharts() {
    if (typeof Chart === 'undefined') return;
    const daily = D.daily || {};
    const monthly = D.monthly || {};
    const isDaily = fMonth > 0;
    let labels, leadNormal, leadRJ, bookings, dones, dealValue;

    if (isDaily) {
      const m = daily[fMonth] || daily[String(fMonth)] || { leads:[], leadRJ:[], bookings:[], dones:[], dealValue:[] };
      const yr = (D.meta && D.meta.year) || new Date().getFullYear();
      const daysInMonth = new Date(yr, fMonth, 0).getDate();
      labels = []; leadNormal=[]; leadRJ=[]; bookings=[]; dones=[]; dealValue=[];
      for (let d=1; d<=daysInMonth; d++) {
        labels.push(String(d));
        leadNormal.push((m.leads||[])[d] || 0);
        leadRJ.push((m.leadRJ||[])[d] || 0);
        bookings.push((m.bookings||[])[d] || 0);
        dones.push((m.dones||[])[d] || 0);
        dealValue.push((m.dealValue||[])[d] || 0);
      }
    } else {
      labels = C.MONTHS_SHORT;
      leadNormal=[]; leadRJ=[]; bookings=[]; dones=[]; dealValue=[];
      for (let m=1; m<=12; m++) {
        const x = monthly[m] || monthly[String(m)] || {};
        leadNormal.push(x.leadNormal || 0);
        leadRJ.push(x.leadRJ || 0);
        bookings.push(x.booking || 0);
        dones.push(x.done || 0);
        dealValue.push(x.dealValue || 0);
      }
    }

    const cv1 = document.getElementById('chart-leads');
    if (cv1) {
      destroyChart('leads');
      __charts.leads = new Chart(cv1, {
        type: 'line',
        data: { labels, datasets: [
          { label: 'Lead ปกติ', data: leadNormal, borderColor:'#3b82f6', backgroundColor:'rgba(59,130,246,.15)', tension:.35, fill:true, pointRadius:isDaily?2:3 },
          { label: 'RJ', data: leadRJ, borderColor:'#ef4444', backgroundColor:'rgba(239,68,68,.1)', tension:.35, fill:true, pointRadius:isDaily?2:3 },
        ]},
        options: { responsive:true, maintainAspectRatio:false,
          plugins:{legend:{position:'bottom',labels:{boxWidth:11,font:{size:10}}}},
          scales:{y:{beginAtZero:true,ticks:{precision:0}}}
        }
      });
    }

    const cv2 = document.getElementById('chart-bd');
    if (cv2) {
      destroyChart('bd');
      __charts.bd = new Chart(cv2, {
        type: 'bar',
        data: { labels, datasets: [
          { label:'จอง', data:bookings, backgroundColor:'#f59e0b' },
          { label:'ปล่อย', data:dones, backgroundColor:'#10b981' },
        ]},
        options: { responsive:true, maintainAspectRatio:false,
          plugins:{legend:{position:'bottom',labels:{boxWidth:11,font:{size:10}}}},
          scales:{y:{beginAtZero:true,ticks:{precision:0}}}
        }
      });
    }

    const cv3 = document.getElementById('chart-pipe');
    if (cv3) {
      destroyChart('pipe');
      const order = C.STATUS_ORDER || ['จอง','รอเซ็นต์','รอผล','รอปล่อย','ปล่อย','รีเจ็ก'];
      const pl = {}; order.forEach(k => pl[k] = 0);
      bookingsInRange().forEach(b => { if (pl[b.status] !== undefined) pl[b.status]++; });
      const counts = order.map(k => pl[k] || 0);
      const colors = order.map(k => (C.STATUS_COLOR || {})[k] || '#888');
      __charts.pipe = new Chart(cv3, {
        type:'doughnut',
        data:{ labels:order, datasets:[{ data:counts, backgroundColor:colors, borderWidth:0 }]},
        options:{ responsive:true, maintainAspectRatio:false, cutout:'60%',
          plugins:{legend:{position:'right',labels:{boxWidth:11,font:{size:10}}}},
        }
      });
    }

    // 4) Line — 💰 ยอดปล่อย (Deal Value)
    const cv4 = document.getElementById('chart-deal-value');
    if (cv4) {
      destroyChart('dealValue');
      const totalDV = dealValue.reduce((a,b)=>a+b,0);
      __charts.dealValue = new Chart(cv4, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'ยอดปล่อย (฿)', data: dealValue,
            borderColor: '#059669',
            backgroundColor: 'rgba(5,150,105,.15)',
            tension: .35, fill: true,
            pointRadius: isDaily ? 2 : 4,
            pointBackgroundColor: '#059669',
            borderWidth: 2.4,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => '฿' + Number(ctx.parsed.y||0).toLocaleString(),
                footer: () => totalDV > 0 ? 'รวม ' + fmtBahtChart(totalDV) : '',
              },
            },
          },
          scales: {
            y: { beginAtZero: true, ticks: { callback: (v) => fmtBahtChart(v) } },
          },
        }
      });
    }
  }

  // ── badges ──
  function callBadge(l) {
    if (l.callProof === 'ส่งแล้ว') return '<span class="badge b-green">✓ มีหลักฐาน</span>';
    if (l.updateCount === 0) return '<span class="badge b-red">📞 ยังไม่โทร</span>';
    if (l.updateCount < C.UPD_TGT) return `<span class="badge b-amber">📞 อีก ${nc(l.updateCount)}</span>`;
    return '<span class="badge b-green">✓ ครบ</span>';
  }
  function dotsMini(u) {
    let h = '<span class="dots-mini">';
    for (let i=0; i<C.UPD_TGT; i++) {
      let c = '#ccc';
      if (i<u) {
        if (u >= C.UPD_TGT) c = '#3B6D11';
        else if (u >= 3) c = '#1D9E75';
        else if (u >= 2) c = '#EF9F27';
        else c = '#E24B4A';
      }
      h += `<span class="dot-mini" style="background:${c}"></span>`;
    }
    h += `<span style="font-size:9px;color:var(--t3);margin-left:3px">${u}/${C.UPD_TGT}</span></span>`;
    return h;
  }

  // ── render ──
  function render() {
    const s = D.seller;
    const teamId = s.team || '?';
    const teamName = (C.TEAM_NAMES || {})[teamId] || teamId;
    const allLeads = leadsInRange();
    const bookings = bookingsInRange();

    // KPI counts
    const kpiCounts = {};
    KPI_DEFS.forEach(k => { kpiCounts[k.key] = allLeads.filter(k.test).length; });
    // Booking สถานะ "ปล่อย" — รวมยอดเงินด้วย
    const doneBookings = bookings.filter(b => b.status === 'ปล่อย');
    const doneCount = doneBookings.length;
    const dealValueRange = doneBookings.reduce((a,b)=>a+(Number(b.price)||0),0);
    // เคสในมือ — รวมเคสที่ยังต้องดูแล: ติดตาม + จอง + ปล่อย (filter ตาม period)
    const followCount = kpiCounts['follow'] || 0;
    const bookingCount = bookings.filter(b => b.status === 'จอง').length;
    const inHandTotal = followCount + bookingCount + doneCount;

    const periodLabel = (() => {
      if (fDateFrom || fDateTo) {
        const f = fDateFrom || '...';
        const t = fDateTo || '...';
        return `${f} ถึง ${t}`;
      }
      if (fDay === -1) return 'วันนี้';
      const mm = fMonth > 0 ? `เดือน${(C.MONTHS_FULL||[])[fMonth-1] || fMonth}` : 'ทั้งปี';
      return mm;
    })();

    // ฿ แบบกระชับ
    const fmtBaht = (n) => {
      const v = Number(n||0);
      if (v >= 1000000) return '฿' + (v/1000000).toFixed(v >= 10000000 ? 1 : 2) + 'M';
      if (v >= 100000)  return '฿' + Math.round(v/1000) + 'K';
      if (v >= 1000)    return '฿' + (v/1000).toFixed(1) + 'K';
      return '฿' + Math.round(v).toLocaleString();
    };

    let html = `
      <div class="seller-hd">
        <div>
          <h1>👋 ${h(SELLER_NAME)}</h1>
          <div class="sub">ทีม ${h(teamName)} · เป้า ${s.target} คัน · ${h(periodLabel)}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:22px;font-weight:800;color:var(--green)">${doneCount}/${s.target}</div>
          <div style="font-size:11px;color:var(--t3)">ปล่อยในช่วงนี้</div>
        </div>
      </div>

      <div class="kgrid" style="margin-bottom:10px">
        <div class="kpi-card" style="cursor:default">
          <div class="kl">💰 ยอดปล่อย ${h(periodLabel)}</div>
          <div class="kv" style="color:var(--green-mid)">${fmtBaht(dealValueRange)}</div>
          <div class="ks">${doneCount ? 'เฉลี่ย '+fmtBaht(dealValueRange/doneCount)+'/คัน' : 'ยังไม่มีปล่อย'}</div>
        </div>
        <div class="kpi-card" style="cursor:default">
          <div class="kl">🎯 เคสในมือ ${h(periodLabel)}</div>
          <div class="kv" style="color:var(--blue)">${inHandTotal}</div>
          <div class="ks">ติดตาม ${followCount} · จอง ${bookingCount} · ปล่อย ${doneCount}</div>
        </div>
      </div>

      ${(() => {
        // ── 🔔 แจ้งเตือนเดือนปัจจุบัน — ไม่ขึ้นกับ filter (เพื่อ remind เซลล์เสมอ) ──
        // exclude เคส skipped (จบ/คืน/ยกเลิก/จ่ายใหม่) — เซลล์ไม่ต้องตามต่อ
        const curMonthLeads = leadsInCurrentMonth().filter(l => !isSkipped(l));
        const curNotCalled = curMonthLeads.filter(l => !l.updateCount).length;
        const curFollow = curMonthLeads.filter(l => {
          const s = (l.salesStatus||'').toLowerCase();
          return s && s !== '-' && ['ติดตาม','รอตอบ','รอลูกค้า','รอ','โทรไม่รับ','ผิดนัด','นัดหมาย'].some(k => s.includes(k));
        }).length;
        const curMonthName = (C.MONTHS_FULL||[])[new Date().getMonth()] || '';
        if (curNotCalled === 0 && curFollow === 0) return '';
        return `
        <div style="background:var(--amber-bg,#fff7e6);border:.5px solid var(--amber,#ef9f27);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span style="font-size:18px">🔔</span>
          <span style="font-size:12px;font-weight:600;color:var(--t1)">แจ้งเตือนเดือน${h(curMonthName)}:</span>
          ${curNotCalled>0 ? `<span style="font-size:12px;color:var(--red);font-weight:600">📞 ยังไม่โทร <b>${curNotCalled}</b> เคส</span>` : ''}
          ${curFollow>0 ? `<span style="font-size:12px;color:var(--blue);font-weight:600">📋 ต้องตามต่อ <b>${curFollow}</b> เคส</span>` : ''}
        </div>`;
      })()}

      <div class="filter-bar">
        <span class="lbl">📅 เดือน:</span>
        <button class="f-btn ${fMonth===0 && !fDateFrom && !fDateTo && fDay===0 ?'on':''}" onclick="resetFilter()">ทั้งปี</button>
        <button class="f-btn ${fDay===-1?'on':''}" onclick="setDay(-1)">วันนี้</button>
        <input type="month" value="${fMonth>0 ? `${new Date().getFullYear()}-${String(fMonth).padStart(2,'0')}` : ''}" onchange="setMonthFromInput(this.value)" title="เลือกเดือน (ปี ${new Date().getFullYear()})" style="padding:6px 10px;border:.5px solid var(--bd2);border-radius:8px;background:var(--bg);color:var(--t1);font-size:12px;font-family:inherit;cursor:pointer">
        ${fMonth>0 ? `<span style="font-size:11px;color:var(--blue);font-weight:500;margin-left:4px">${(C.MONTHS_FULL||[])[fMonth-1]||''}</span>` : ''}
      </div>

      <div class="filter-bar">
        <span class="lbl">🗓️ ช่วงวัน:</span>
        <input type="date" value="${h(fDateFrom)}" onchange="setDateFrom(this.value)" title="ตั้งแต่วันที่" style="padding:6px 10px;border:.5px solid var(--bd2);border-radius:8px;background:var(--bg);color:var(--t1);font-size:12px;font-family:inherit;cursor:pointer">
        <span style="font-size:11px;color:var(--t3)">ถึง</span>
        <input type="date" value="${h(fDateTo)}" onchange="setDateTo(this.value)" title="ถึงวันที่" style="padding:6px 10px;border:.5px solid var(--bd2);border-radius:8px;background:var(--bg);color:var(--t1);font-size:12px;font-family:inherit;cursor:pointer">
        ${(fDateFrom||fDateTo) ? `<button class="f-btn" onclick="clearDateRange()" style="background:var(--red-bg,#fee);color:var(--red)">✕ ล้าง</button>` : ''}
      </div>

      <div class="kgrid">
        ${KPI_DEFS.map(k => `
          <div class="kpi-card ${kpiFilter===k.key?'active':''}" onclick="setKpi('${k.key}')">
            <div class="kl">${k.label}</div>
            <div class="kv" style="color:${k.color}">${kpiCounts[k.key]}</div>
            <div class="ks">${k.hint}</div>
          </div>
        `).join('')}
      </div>

      <div class="cgrid">
        <div class="chart-card">
          <div class="chart-title">📈 Lead ของฉัน (${h(periodLabel)})</div>
          <div class="chart-box"><canvas id="chart-leads"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">📊 จอง / ปล่อย</div>
          <div class="chart-box"><canvas id="chart-bd"></canvas></div>
        </div>
        <div class="chart-card span2">
          <div class="chart-title">💰 ยอดปล่อย (Deal Value) ${h(periodLabel)} · รวม ${fmtBahtChart(dealValueRange)}</div>
          <div class="chart-box"><canvas id="chart-deal-value"></canvas></div>
        </div>
        <div class="chart-card span2">
          <div class="chart-title">🥯 สถานะดีล ${h(periodLabel)} (${bookings.length} เคส)</div>
          <div class="chart-box"><canvas id="chart-pipe"></canvas></div>
        </div>
      </div>

      <div style="display:flex;gap:6px;background:var(--bg2);border:.5px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:10px">
        <button onclick="setViewMode('leads')" style="flex:1;padding:9px 14px;border:none;border-radius:9px;background:${viewMode==='leads'?'var(--blue)':'transparent'};color:${viewMode==='leads'?'#fff':'var(--t2)'};font-size:13px;font-weight:700;cursor:pointer">📋 รายการ Lead <span style="opacity:.85;font-weight:400">(${allLeads.length})</span></button>
        <button onclick="setViewMode('bookings')" style="flex:1;padding:9px 14px;border:none;border-radius:9px;background:${viewMode==='bookings'?'var(--blue)':'transparent'};color:${viewMode==='bookings'?'#fff':'var(--t2)'};font-size:13px;font-weight:700;cursor:pointer">🚗 เคสจอง <span style="opacity:.85;font-weight:400">(${bookings.length})</span></button>
      </div>

      ${viewMode === 'leads' ? renderLeadList(allLeads) : renderBookingSection(bookings)}
    `;

    document.getElementById('root').innerHTML = html;
    initCharts();
  }

  function renderLeadList(allLeads) {
    const def = KPI_DEFS.find(k => k.key === kpiFilter) || KPI_DEFS[0];
    const filtered = allLeads.filter(def.test);
    filtered.sort((a,b) => {
      const sa = a.updateCount === 0 ? 100 : 0; const sb = b.updateCount === 0 ? 100 : 0;
      if (sa !== sb) return sb - sa;
      return a.updateCount - b.updateCount;
    });

    let html = `<div class="section"><h2>📋 ${h(def.label)} <span class="count">${filtered.length} เคส · กรอง: ${h(def.hint)} · คลิกเพื่อดูรายละเอียด</span></h2>`;
    if (filtered.length === 0) {
      html += `<div class="empty">ไม่มีเคสในเงื่อนไขนี้</div>`;
    } else {
      filtered.slice(0, 100).forEach(l => {
        const mustCall = l.callProof !== 'ส่งแล้ว' && l.updateCount < C.UPD_TGT;
        const safeCode = (l.code||'').replace(/'/g, "\\'");
        html += `<div class="lead-row ${mustCall && kpiFilter!=='called'?'must':''}" onclick="openLeadDetail('${safeCode}')">
          <div>
            <div class="code">${h(l.code||'-')}</div>
            <div class="info">${h(l.dateIn||'-')}${l.timeIn?' '+h(l.timeIn):''}</div>
          </div>
          <div>
            <div class="phone">${h(l.phone||'-')}</div>
            <div class="info">${h(l.car||'-')}${l.channel?' · '+h(l.channel):''}${l.leadType?' · '+h(l.leadType):''}</div>
            ${l.note && l.note !== '-' ? `<div class="info" style="color:var(--t3);margin-top:2px">📝 ${h(l.note.slice(0,60))}</div>` : ''}
          </div>
          <div class="badge-col">
            ${callBadge(l)}
            ${l.salesStatus && l.salesStatus !== '-' ? `<span class="badge b-gray" title="sales_status">${h(l.salesStatus.slice(0,14))}</span>` : ''}
            ${l.adminStatus && l.adminStatus !== '-' ? `<span class="badge b-gray" style="opacity:.6" title="admin_status">${h(l.adminStatus.slice(0,12))}</span>` : ''}
          </div>
          <div>${dotsMini(l.updateCount)}</div>
        </div>`;
      });
      if (filtered.length > 100) {
        html += `<div class="empty">+ อีก ${filtered.length - 100} เคส (แสดงสูงสุด 100)</div>`;
      }
    }
    html += `</div>`;
    return html;
  }

  // ── Lead detail modal ──
  function openLeadDetail(code) {
    const l = (D.leads || []).find(x => x.code === code);
    if (!l) return;
    const old = document.getElementById('lead-detail-overlay');
    if (old) old.remove();

    const overlay = document.createElement('div');
    overlay.id = 'lead-detail-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

    // helper: row หนึ่งของ field
    const row = (label, value, opts={}) => {
      if (!value || value === '-') return '';
      const styleVal = opts.mono ? 'font-family:monospace;' : '';
      const wrap = opts.wrap ? 'white-space:pre-wrap;word-break:break-word;' : '';
      return `<div style="display:grid;grid-template-columns:110px 1fr;gap:10px;padding:7px 0;border-bottom:.5px solid var(--bd)">
        <div style="font-size:11px;color:var(--t3);font-weight:600">${h(label)}</div>
        <div style="font-size:12px;color:var(--t1);${styleVal}${wrap}">${h(value)}</div>
      </div>`;
    };

    const mustCall = l.callProof !== 'ส่งแล้ว' && l.updateCount < C.UPD_TGT;
    const callIcon = l.callProof === 'ส่งแล้ว' ? '✅' : (l.updateCount === 0 ? '📵' : '📞');

    const phoneClean = (l.phone||'').replace(/[^0-9+]/g, '');
    const callLink = phoneClean ? `<a href="tel:${phoneClean}" style="background:var(--green);color:#fff;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none">📞 โทร ${h(l.phone)}</a>` : '';

    overlay.innerHTML = `
      <div style="background:var(--bg);border-radius:14px;max-width:560px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden" onclick="event.stopPropagation()">
        <div style="background:${mustCall?'var(--red-bg)':'var(--blue-bg)'};padding:14px 16px;border-bottom:.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:10px">
          <div>
            <div style="font-size:11px;color:var(--t3);font-weight:600">Code · รับเข้า ${h(l.dateIn||'-')}${l.timeIn?' '+h(l.timeIn):''}</div>
            <div style="font-size:18px;font-weight:800;color:${mustCall?'var(--red)':'var(--blue)'}">${callIcon} ${h(l.code||'-')}</div>
          </div>
          <button onclick="document.getElementById('lead-detail-overlay').remove()" style="background:transparent;border:none;font-size:22px;color:var(--t3);cursor:pointer;line-height:1">✕</button>
        </div>

        <div style="overflow-y:auto;padding:14px 16px;flex:1">
          ${callLink ? `<div style="margin-bottom:12px;text-align:center">${callLink}</div>` : ''}

          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
            ${callBadge(l)}
            <span class="badge b-gray">${dotsMini(l.updateCount)}</span>
          </div>

          <div style="font-size:11px;color:var(--t3);font-weight:700;margin-bottom:4px;padding-top:4px">📞 การติดต่อ</div>
          ${row('เบอร์โทร', l.phone, {mono:true})}
          ${row('ช่องทาง', l.channel)}
          ${row('ประเภท Lead', l.leadType)}
          ${row('รถสนใจ', l.car)}

          <div style="font-size:11px;color:var(--t3);font-weight:700;margin:14px 0 4px">📊 สถานะ</div>
          ${row('Status เซลล์', l.salesStatus)}
          ${row('Status แอดมิน', l.adminStatus)}
          ${row('หลักฐานการโทร', l.callProof || '—')}
          ${row('จำนวนอัพเดท', `${l.updateCount} / ${C.UPD_TGT} ครั้ง`)}
          ${row('อัพเดทล่าสุด', l.lastUpdate)}

          ${l.note && l.note !== '-' ? `
            <div style="font-size:11px;color:var(--t3);font-weight:700;margin:14px 0 4px">📝 หมายเหตุ</div>
            <div style="padding:10px 12px;background:var(--bg2);border-radius:8px;font-size:12px;color:var(--t1);white-space:pre-wrap;word-break:break-word;line-height:1.5">${h(l.note)}</div>
          ` : ''}

          ${l.profile ? `
            <div style="font-size:11px;color:var(--t3);font-weight:700;margin:14px 0 4px">👤 โปรไฟล์ลูกค้า</div>
            <div style="padding:10px 12px;background:var(--bg2);border-radius:8px;font-size:12px;color:var(--t1);white-space:pre-wrap;word-break:break-word;line-height:1.5">${h(l.profile)}</div>
          ` : ''}
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
  }

  function renderBookingSection(bookings) {
    // Status filter chips
    const order = C.STATUS_ORDER || ['จอง','รอเซ็นต์','รอผล','รอปล่อย','ปล่อย','รีเจ็ก'];
    const statusCounts = { all: bookings.length };
    order.forEach(s => statusCounts[s] = 0);
    bookings.forEach(b => { if (statusCounts[b.status] !== undefined) statusCounts[b.status]++; });

    const filtered = bookStatusFilter === 'all'
      ? bookings
      : bookings.filter(b => b.status === bookStatusFilter);

    let html = `<div class="section">
      <h2>🚗 เคสจอง <span class="count">${filtered.length} / ${bookings.length} เคส · คลิกเพื่อดูรายละเอียด</span></h2>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">
        <button class="f-btn ${bookStatusFilter==='all'?'on':''}" onclick="setBookStatus('all')">ทั้งหมด (${statusCounts.all})</button>
        ${order.map(s => {
          const c = (C.STATUS_COLOR||{})[s] || '#888';
          const on = bookStatusFilter === s;
          return `<button class="f-btn" onclick="setBookStatus('${h(s)}')" style="${on?`background:${c};color:#fff;border-color:${c};font-weight:600`:''}">${h(s)} (${statusCounts[s]||0})</button>`;
        }).join('')}
      </div>`;

    if (filtered.length === 0) {
      html += `<div class="empty">ไม่มีเคสในสถานะนี้</div>`;
    } else {
      html += `<table style="width:100%;font-size:12px;border-collapse:collapse">
        <thead><tr>
          <th style="text-align:left;padding:6px;color:var(--t3);font-size:10px;border-bottom:.5px solid var(--bd)">วันที่</th>
          <th style="text-align:left;padding:6px;color:var(--t3);font-size:10px;border-bottom:.5px solid var(--bd)">ลูกค้า</th>
          <th style="text-align:left;padding:6px;color:var(--t3);font-size:10px;border-bottom:.5px solid var(--bd)">รถ</th>
          <th style="text-align:left;padding:6px;color:var(--t3);font-size:10px;border-bottom:.5px solid var(--bd)">สถานะ</th>
          <th style="text-align:right;padding:6px;color:var(--t3);font-size:10px;border-bottom:.5px solid var(--bd)">ราคา</th>
        </tr></thead><tbody>`;
      filtered.forEach((b, idx) => {
        const col = (C.STATUS_COLOR||{})[b.status] || '#888';
        const origIdx = bookings.indexOf(b);
        html += `<tr onclick="openBookingDetail(${origIdx})" style="cursor:pointer" onmouseover="this.style.background='var(--bg2)'" onmouseout="this.style.background=''">
          <td style="padding:8px 6px;border-bottom:.5px solid var(--bd);color:var(--t2)">${h(b.date)}</td>
          <td style="padding:8px 6px;border-bottom:.5px solid var(--bd)"><div style="color:var(--t1);font-weight:600">${h(b.customer)}</div><div style="font-family:monospace;font-size:10px;color:var(--t3)">${h(b.phone)}</div></td>
          <td style="padding:8px 6px;border-bottom:.5px solid var(--bd);color:var(--t2)">${h(b.car)}${b.year?` (${h(b.year)})`:''}</td>
          <td style="padding:8px 6px;border-bottom:.5px solid var(--bd)"><span class="badge" style="background:${col};color:#fff">${h(b.status)}</span>${b.isCash?' 💵':''}</td>
          <td style="padding:8px 6px;border-bottom:.5px solid var(--bd);text-align:right;font-family:monospace">${b.price?Number(b.price).toLocaleString():'-'}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
    }
    html += `</div>`;
    return html;
  }

  // ── Booking detail modal ──
  function openBookingDetail(idx) {
    const allBookings = bookingsInRange();
    const b = allBookings[idx];
    if (!b) return;
    const old = document.getElementById('book-detail-overlay');
    if (old) old.remove();

    const overlay = document.createElement('div');
    overlay.id = 'book-detail-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

    const row = (label, value, opts={}) => {
      if (value == null || value === '' || value === '-') return '';
      const styleVal = opts.mono ? 'font-family:monospace;' : '';
      const wrap = opts.wrap ? 'white-space:pre-wrap;word-break:break-word;' : '';
      return `<div style="display:grid;grid-template-columns:130px 1fr;gap:10px;padding:7px 0;border-bottom:.5px solid var(--bd)">
        <div style="font-size:11px;color:var(--t3);font-weight:600">${h(label)}</div>
        <div style="font-size:12px;color:var(--t1);${styleVal}${wrap}">${typeof value === 'number' ? value.toLocaleString() : h(value)}</div>
      </div>`;
    };

    const statusColor = (C.STATUS_COLOR||{})[b.status] || '#888';
    const phoneClean = (b.phone||'').replace(/[^0-9+]/g, '');
    const callLink = phoneClean ? `<a href="tel:${phoneClean}" style="background:var(--green);color:#fff;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none">📞 โทร ${h(b.phone)}</a>` : '';

    overlay.innerHTML = `
      <div style="background:var(--bg);border-radius:14px;max-width:560px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden" onclick="event.stopPropagation()">
        <div style="background:${statusColor};padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px">
          <div>
            <div style="font-size:11px;color:#fff;opacity:.85;font-weight:600">เคสจอง · ${h(b.date||'-')}</div>
            <div style="font-size:18px;font-weight:800;color:#fff">${h(b.customer||'-')}</div>
            <div style="font-size:11px;color:#fff;opacity:.9;margin-top:2px">สถานะ: <b>${h(b.status||'-')}</b>${b.isCash?' · 💵 ซื้อสด':''}</div>
          </div>
          <button onclick="document.getElementById('book-detail-overlay').remove()" style="background:transparent;border:none;font-size:22px;color:#fff;cursor:pointer;line-height:1;opacity:.9">✕</button>
        </div>

        <div style="overflow-y:auto;padding:14px 16px;flex:1">
          ${callLink ? `<div style="margin-bottom:12px;text-align:center">${callLink}</div>` : ''}

          <div style="font-size:11px;color:var(--t3);font-weight:700;margin-bottom:4px">👤 ลูกค้า</div>
          ${row('ชื่อลูกค้า', b.customer)}
          ${row('เบอร์โทร', b.phone, {mono:true})}
          ${row('Lead Code', b.leadCode, {mono:true})}

          <div style="font-size:11px;color:var(--t3);font-weight:700;margin:14px 0 4px">🚗 รถ</div>
          ${row('รถ', b.car)}
          ${row('ปีรถ', b.year)}
          ${row('ทะเบียน', b.plate)}

          <div style="font-size:11px;color:var(--t3);font-weight:700;margin:14px 0 4px">💰 ราคา / การจ่าย</div>
          ${row('ราคาขาย', b.price)}
          ${row('เงินจอง', b.deposit)}
          ${row('ไฟแนนซ์', b.finance)}
          ${row('เกรด', b.grade)}

          <div style="font-size:11px;color:var(--t3);font-weight:700;margin:14px 0 4px">📅 ไทม์ไลน์</div>
          ${row('วันที่จอง', b.date)}
          ${row('วันที่เซ็นต์', b.signDate)}
          ${row('วันที่รู้ผล', b.resultDate)}
          ${row('เอกสารครบ', b.docsDate)}
          ${row('วันที่ปล่อยรถ', b.releaseDate)}

          ${b.note && b.note !== '-' ? `
            <div style="font-size:11px;color:var(--t3);font-weight:700;margin:14px 0 4px">📝 หมายเหตุ</div>
            <div style="padding:10px 12px;background:var(--bg2);border-radius:8px;font-size:12px;color:var(--t1);white-space:pre-wrap;word-break:break-word;line-height:1.5">${h(b.note)}</div>
          ` : ''}
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
  }

  // ── filter actions ──
  function setMonth(m) {
    fMonth = m;
    if (m === 0) fDay = 0;
    // เลือก month → ล้าง date range (mutually exclusive)
    if (m > 0) { fDateFrom = ''; fDateTo = ''; }
    render();
  }
  function setMonthFromInput(v) {
    if (!v) { setMonth(0); return; }
    const mo = parseInt(v.split('-')[1] || '0');
    if (mo >= 1 && mo <= 12) setMonth(mo);
  }
  function setDay(d) {
    fDay = d;
    if (d !== 0) { fDateFrom = ''; fDateTo = ''; }  // วันนี้ override range
    render();
  }
  function setDateFrom(v) {
    fDateFrom = v || '';
    // เลือก date range → ล้าง month + day (mutually exclusive)
    if (fDateFrom) { fMonth = 0; fDay = 0; }
    render();
  }
  function setDateTo(v) {
    fDateTo = v || '';
    if (fDateTo) { fMonth = 0; fDay = 0; }
    render();
  }
  function clearDateRange() { fDateFrom = ''; fDateTo = ''; render(); }
  function resetFilter() { fMonth = 0; fDay = 0; fDateFrom = ''; fDateTo = ''; render(); }
  function setKpi(k) { kpiFilter = k; viewMode = 'leads'; render(); }
  function setViewMode(m) { viewMode = m; render(); }
  function setBookStatus(s) { bookStatusFilter = s; render(); }

  render();
</script>
{% endif %}
</body>
</html>
