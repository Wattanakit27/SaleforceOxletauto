{% load static %}<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard{% if seller %} — {{ seller }}{% endif %}</title>
  <link rel="icon" type="image/png" href="{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}">
  <link rel="apple-touch-icon" href="{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}">
  <link rel="stylesheet" href="{% static 'dashboard/css/globals.css' %}?v=20260606f">
  <script>
    (function(){
      try {
        var t = localStorage.getItem('oxlet_theme');
        if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) { document.documentElement.setAttribute('data-theme','light'); }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { overflow-x: hidden; }
    .seller-page { max-width: 1080px; margin: 0 auto; padding: 14px; }
    .seller-hd { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:var(--bg); border:.5px solid var(--bd); border-radius:14px; margin-bottom:10px; gap:10px; box-shadow:var(--shadow); }
    .seller-hd h1 { font-size:20px; font-weight:800; color:var(--t1); margin:0; word-break:break-word; }
    .seller-hd .sub { font-size:12px; color:var(--t3); margin-top:2px; }
    .filter-bar { background:var(--bg); border:.5px solid var(--bd); border-radius:12px; padding:10px 12px; margin-bottom:10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; box-shadow:var(--shadow); }
    .filter-bar .lbl { font-size:11px; color:var(--t3); font-weight:600; margin-right:4px; }
    .f-btn { font-size:11px; padding:5px 11px; border-radius:14px; border:.5px solid var(--bd2); background:var(--bg2); color:var(--t2); cursor:pointer; font-family:inherit; white-space:nowrap; transition:background .15s ease,border-color .15s ease,color .15s ease; }
    .f-btn:hover { border-color:var(--blue); color:var(--t1); }
    .f-btn.on { background:var(--grad); color:#fff; border-color:transparent; font-weight:600; box-shadow:0 3px 10px rgba(124,58,237,.3); }
    .f-divider { width:1px; height:20px; background:var(--bd); margin:0 4px; }
    .kgrid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-bottom:10px; }
    .kpi-card { position:relative; overflow:hidden; background:var(--bg); border:.5px solid var(--bd); border-radius:12px; padding:12px 11px 11px; cursor:pointer; transition:transform .14s ease, box-shadow .14s ease; min-width:0; box-shadow:var(--shadow); }
    .kpi-card::before { content:""; position:absolute; top:0; left:0; right:0; height:3px; background:var(--grad); opacity:.85; }
    .kpi-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-h); }
    .kpi-card.active { border-color:var(--blue); box-shadow:0 0 0 2px var(--blue-bg), var(--shadow); }
    .kpi-card .kl { font-size:10px; color:var(--t3); font-weight:500; margin-bottom:4px; line-height:1.3; word-break:break-word; }
    .kpi-card .kv { font-size:22px; font-weight:800; line-height:1; }
    .kpi-card .ks { font-size:10px; color:var(--t3); margin-top:3px; word-break:break-word; line-height:1.4; }
    .cgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
    .cgrid > .chart-card.span2 { grid-column: span 2; }
    .chart-card { background:var(--bg); border:.5px solid var(--bd); border-radius:12px; padding:12px; min-width:0; box-shadow:var(--shadow); }
    .chart-card .chart-title { font-size:12px; font-weight:700; color:var(--t1); margin-bottom:8px; display:flex; align-items:center; gap:7px; }
    .chart-card .chart-title::before { content:""; width:4px; height:14px; border-radius:3px; background:var(--grad); flex-shrink:0; box-shadow:0 1px 4px rgba(124,58,237,.4); }
    .chart-card .chart-box { position:relative; height:220px; }
    .chart-card.span2 .chart-box { height:240px; }
    .section { background:var(--bg); border:.5px solid var(--bd); border-radius:12px; padding:13px; margin-bottom:10px; box-shadow:var(--shadow); }
    .section h2 { font-size:14px; font-weight:700; color:var(--t1); margin:0 0 10px; display:flex; align-items:center; justify-content:flex-start; flex-wrap:wrap; gap:7px; }
    .section h2::before { content:""; width:4px; height:16px; border-radius:3px; background:var(--grad); flex-shrink:0; box-shadow:0 1px 4px rgba(124,58,237,.4); }
    .section h2 .count { font-size:11px; color:var(--t3); font-weight:500; margin-left:auto; }
    .lead-row { display:grid; grid-template-columns:auto 1fr auto auto; gap:10px; align-items:center; padding:8px 10px; border:.5px solid var(--bd); border-radius:8px; margin-bottom:6px; font-size:12px; cursor:pointer; }
    .lead-row.must { border-color:var(--red); background:var(--red-bg); }
    .lead-row .code { font-weight:700; color:var(--blue); font-size:11px; }
    .lead-row .phone { font-family:monospace; color:var(--t1); font-weight:600; }
    .lead-row .info { font-size:10px; color:var(--t2); margin-top:2px; word-break:break-word; }
    .lead-row .badge-col { display:flex; flex-direction:column; gap:3px; align-items:flex-end; min-width:80px; }
    .badge { font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; white-space:nowrap; }
    .b-red { background:var(--red); color:#fff; }
    .b-amber { background:var(--amber-bg); color:var(--amber); }
    .b-green { background:var(--green-bg); color:var(--green); }
    .b-gray { background:var(--bg2); color:var(--t3); }
    .dots-mini { display:inline-flex; gap:2px; align-items:center; }
    .dot-mini { width:7px; height:7px; border-radius:50%; }
    .empty { text-align:center; padding:24px; color:var(--t3); font-size:13px; }
    .err-wrap { text-align:center; padding:80px 16px; }
    .err-wrap .ttl { font-size:18px; font-weight:700; color:var(--t1); margin-bottom:6px; }
    /* booking table — บน mobile ห่อด้วย wrapper ที่ scroll ได้ */
    .section table { width:100%; }
    @media (max-width:960px) {
      /* tablet — 5 KPI cards → 3 cols */
      .kgrid[style*="repeat(5"] { grid-template-columns: repeat(3, minmax(0,1fr)) !important; }
    }
    @media (max-width:760px) {
      .seller-page { padding: 10px; }
      .kgrid { grid-template-columns:repeat(2,minmax(0,1fr)) !important; gap:6px; }
      .cgrid { grid-template-columns:1fr; }
      .cgrid > .chart-card.span2 { grid-column: auto; }
      .lead-row { grid-template-columns:1fr; gap:6px; }
      .lead-row .badge-col { flex-direction:row; align-items:center; min-width:auto; flex-wrap:wrap; }
      .kpi-card .kv { font-size:20px; }
      .section { padding: 12px 10px; }
      /* booking table มี column เยอะ — wrap ด้วย overflow scroll */
      .section table { display:block; overflow-x:auto; white-space:nowrap; }
    }
    @media (max-width:420px) {
      .kpi-card .kv { font-size:18px; }
      .kpi-card .kl, .kpi-card .ks { font-size:9.5px; }
      .seller-hd h1 { font-size:17px; }
      .seller-hd { padding: 12px 13px; }
    }
  </style>
</head>
<body>
<div class="seller-page">
  {% if error %}
  <div class="err-wrap">
    <div class="ttl">{% if seller %}เกิดข้อผิดพลาด{% else %}ไม่มีสิทธิ์เข้าถึง{% endif %}</div>
    <div style="font-size:13px;color:var(--t2);margin-top:8px">{{ error }}</div>
  </div>
  {% else %}
  <div id="root"><div class="loading-container"><div class="spin"></div><span style="font-size:13px">กำลังโหลด...</span></div></div>
  {% endif %}
</div>

{% if not error %}

  const ic = (name, size=16) => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.15em;flex-shrink:0">${LUCIDE[name.replace('lucide:','')]||''}</svg>`;
  // 🟢 heartbeat — ให้เซลล์ที่กำลังใช้งานถูกนับใน "คนเข้าเว็บตอนนี้" (แอดมินเห็นในหน้าหลัก)
  (function(){ function ping(){ fetch('/api/presence?p=seller',{credentials:'same-origin'}).catch(function(){}); } ping(); setInterval(ping, 45000); })();
  const pct = (a,b) => b > 0 ? Math.round((a/b)*100) : 0;
  const nc = (u) => Math.max(0, C.UPD_TGT - u);

  // ── state ──
  // Filter mode: month (เลือกเดือน) | range (เลือกช่วงวัน) | today | all
  // เลือก month → reset range; เลือก range → reset month (mutually exclusive)
  // กรองด้วย "ช่วงวันที่รับเคส" (จาก-ถึง ข้ามเดือนได้) — รวมตัวกรองเดือน/ช่วงวันเดิมที่ซ้ำกันให้เหลือชุดเดียว
  const _ymdS = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  let fMonth = 0;          // vestige (passFilter/กราฟ บางจุดอ้าง) — ใช้ช่วงวันแทน
  let fDay = 0;
  let _aiStats = null;     // stats ของช่วงที่กรองอยู่ (render() เซ็ตทุกครั้ง) → AI โค้ชใช้ "วัดตามตัวกรอง"
  let fDateFrom = _ymdS(new Date(new Date().getFullYear(), new Date().getMonth(), 1));  // default = ต้นเดือนปัจจุบัน
  let fDateTo = _ymdS(new Date(new Date().getFullYear(), new Date().getMonth()+1, 0));   // ถึงสิ้นเดือนปัจจุบัน (เหมือนหน้าหลัก · เดิมถึงแค่วันนี้)
  // ฝังใน iframe หน้า admin หรือ deep link → รับช่วงวันที่จาก URL (?from=YYYY-MM-DD&to=YYYY-MM-DD)
  try {
    const _q = new URLSearchParams(location.search);
    const _qf = _q.get('from'), _qt = _q.get('to');
    if (_qf && /^\d{4}-\d{2}-\d{2}$/.test(_qf)) { fDateFrom = _qf; fMonth = 0; fDay = 0; }
    if (_qt && /^\d{4}-\d{2}-\d{2}$/.test(_qt)) { fDateTo = _qt; fMonth = 0; fDay = 0; }
  } catch (e) {}
  let kpiFilter = 'inHand';
  let viewMode = 'leads';
  let bookStatusFilter = 'all';
  let statusFilter = 'all';   // dropdown ในหัว lead list: all | z_<สถานะลูกค้า> (16 ค่า · มิ.ย.69)
  let sortOrder = '';         // '' (default urgency) | 'updates_desc' | 'updates_asc'
  let pageMode = 'dashboard'; // 'dashboard' | 'finance' — เลือกจาก dropdown โหมดบนหัว
  const __charts = {};

  // ── date utils ──
  function parseSheetDate(s) {
    if (!s || s === '-') return null;
    s = String(s).trim();
    // Excel serial date (4-5 หลักล้วน) — เช่น 46053
    if (/^\d{4,5}$/.test(s)) {
      const serial = parseInt(s, 10);
      if (serial > 40000 && serial < 50000) {   // ช่วงสมเหตุสมผล ~2009-2036 (กันเลขมั่ว เช่น 25235)
        const dt = new Date(Date.UTC(1899, 11, 30) + serial * 86400000);
        return { day: dt.getUTCDate(), month: dt.getUTCMonth() + 1, year: dt.getUTCFullYear() };
      }
      return null;
    }
    const m = s.match(/^(\d+)\/(\d+)\/(\d+)/);
    if (m) return { day: +m[1], month: +m[2], year: +m[3] };
    return null;
  }
  // คืน normalized JS Date จาก sheet date (รองรับ พ.ศ./yy/yyyy)
  function sheetDateToJS(d) {
    if (!d) return null;
    let y = d.year;
    if (y < 100) y += (y > 50 ? 2500 : 2000);  // >50 = พ.ศ. 2 หลัก (69→2569), ≤50 = ค.ศ. (26)
    if (y > 2500) y -= 543;
    return new Date(y, d.month - 1, d.day);
  }
  function dateMatchesFilter(s) {
    const d = parseSheetDate(s);
    if (!d) return !fDateFrom && !fDateTo && fMonth === 0 && fDay === 0;

    // Range mode — ถ้ามี fDateFrom หรือ fDateTo (override month + day)
    if (fDateFrom || fDateTo) {
      const ld = sheetDateToJS(d);
      if (!ld) return false;
      if (fDateFrom) {
        const from = new Date(fDateFrom + 'T00:00:00');
        if (ld < from) return false;
      }
      if (fDateTo) {
        const to = new Date(fDateTo + 'T23:59:59');
        if (ld > to) return false;
      }
      return true;
    }

    // Month/day mode (legacy)
    if (fMonth > 0 && d.month !== fMonth) return false;
    if (fDay === -1) {
      const now = new Date();
      return d.day === now.getDate() && d.month === (now.getMonth()+1);
    }
    return true;
  }

  // ── Helpers สำหรับ Action Hint / Stale Cases / Funnel ──
  // คืนจำนวนวันจาก dateStr (sheet format) ถึงวันนี้ (null ถ้า parse ไม่ได้)
  function daysSinceSheetDate(dateStr) {
    const p = parseSheetDate(dateStr);
    const d = sheetDateToJS(p);
    if (!d) return null;
    return Math.floor((new Date() - d) / 86400000);
  }

  // วันที่ห่างจาก lastUpdate (อาจมีเวลาตามหลัง) — null ถ้าไม่มี
  function daysSinceLastUpdate(lead) {
    const lu = lead.lastUpdate;
    if (!lu || lu === '-') return null;
    // ตัดเวลาออกถ้ามี
    const dateOnly = String(lu).split(' ')[0];
    return daysSinceSheetDate(dateOnly);
  }

  // ── 🔥 สมองจัดลำดับ "ควรตามแค่ไหน" — รวม ฮอท × ดองนาน + ยังไม่โทร + สถานะลูกค้า ──
  // (เฟส 2: จะ mirror เป็น Python ให้ noti ใช้สมองเดียวกัน)
  function _idleDays(l) {
    let d = daysSinceLastUpdate(l);
    if (d == null) d = daysSinceSheetDate(l.dateIn);
    return d == null ? 0 : Math.max(0, d);
  }
  // จังหวะตาม (cadence) — เว้นกี่วันก่อนตามอีก ตามสถานะลูกค้า · เพิ่งตามยังไม่ถึงรอบ = ยังไม่ต้องเด้งซ้ำ
  const CADENCE = { 'สนใจมาก': 1, 'ลังเล': 2, 'ไม่รับสาย': 1, 'รอเงิน': 3, 'รอเช็คเครดิต': 2, 'ดาวน์ไม่พอ': 3, 'เงินสดเงินไม่พอ': 3, 'ลูกค้าไม่ตอบ': 1 };
  const NOANS_CAP = 5;   // ไม่รับสายเกินนี้ = พักไว้ (ไม่สแปม)
  function cadenceDays(l) {
    const z = zVal(l);
    for (const k in CADENCE) if (z.includes(k)) return CADENCE[k];
    return 2;   // default
  }
  function followUrgency(l) {
    const score = l.leadScore || 0;            // ฮอท 0-100
    const updates = l.updateCount || 0;
    const cp = l.followPriority || 0;          // สถานะลูกค้า 1-8 (สนใจมาก=8)
    const idle = Math.min(_idleDays(l), 21);   // ดองกี่วัน (cap 21)
    // ไม่รับสาย ลองมากพอแล้ว → พักไว้ (ไม่ดัน ไม่สแปม)
    if (zVal(l).includes('ไม่รับสาย') && updates >= NOANS_CAP) return -1;
    if (updates === 0) {                       // ยังไม่โทรเลย = ด่วนสุดเสมอ (speed-to-lead)
      return 120 + (score / 100) * idle * 9 + cp * 6 + idle * 2;
    }
    // เคยตามแล้ว → ด่วนเมื่อ "ถึงรอบ" (idle ≥ cadence) · เพิ่งตาม = ดันลงล่าง
    const over = idle - cadenceDays(l);        // เลยรอบกี่วัน (ลบ = ยังไม่ถึงรอบ)
    let u = cp * 6;
    if (over >= 0) {
      u += 40;                                 // ถึงรอบตามแล้ว
      u += (score / 100) * over * 9;           // ฮอท × เลยรอบ (ฮอทค้างนานพุ่งบน)
      u += over * 2;
    } else {
      u *= 0.35;                               // เพิ่งตาม (ยังไม่ถึงรอบ) → ดันลงล่าง
    }
    return u;
  }
  function urgencyReason(l) {
    const updates = l.updateCount || 0;
    const idle = _idleDays(l);
    const hot = (l.leadTier || '').includes('hot');
    const over = idle - cadenceDays(l);
    if (updates === 0)                 return { t: 'ยังไม่โทรเลย — โทรด่วน', c: 'var(--red)' };
    if (zVal(l).includes('ไม่รับสาย')) return { t: `ไม่รับสาย — ลองใหม่ (ครั้งที่ ${updates + 1})`, c: 'var(--amber)' };
    if (hot && over >= 0)              return { t: `ฮอท + ถึงรอบตาม (ค้าง ${idle} วัน)`, c: 'var(--red)' };
    if (over >= 2)                     return { t: `เลยรอบตาม ${over} วัน`, c: 'var(--amber)' };
    if (over >= 0)                     return { t: 'ถึงรอบตามแล้ว', c: 'var(--amber)' };
    if ((l.followPriority || 0) >= 7)  return { t: 'ลูกค้าสนใจมาก', c: 'var(--green)' };
    return { t: `เพิ่งตาม — รออีก ${-over} วัน`, c: 'var(--t3)' };
  }

  // ── Action Hint: บอกเซลล์ว่าทำอะไรต่อกับเคสนี้ ──
  // อิงจาก status เป็นหลัก → fallback ตามอายุ lead
  function getActionHint(lead) {
    const a = (lead.adminStatus||'').toLowerCase();
    const s = (lead.salesStatus||'').toLowerCase();
    const combined = a + ' ' + s;
    const daysOld = daysSinceSheetDate(lead.dateIn);

    // ── Stage-based hints (specific status wins) ──
    if (combined.includes('รอปล่อย'))  return {icon:'🚗', text:'นัดวันรับรถ', color:'var(--green)'};
    if (combined.includes('รอผล'))      return {icon:'🏦', text:'เช็คผลกับธนาคาร', color:'var(--amber)'};
    if (combined.includes('รอเซ็น'))    return {icon:'✍️', text:'นัดวันเซ็นเอกสาร', color:'var(--amber)'};
    if (combined.includes('จอง'))       return {icon:'📝', text:'ตามเอกสารให้ครบ', color:'var(--amber)'};
    if (combined.includes('โทรไม่รับ')) return {icon:'📅', text:'ลองโทรช่วง 16-19 น.', color:'var(--red)'};
    if (combined.includes('ผิดนัด'))    return {icon:'⏰', text:'นัดเวลาใหม่ + ยืนยัน', color:'var(--red)'};
    if (combined.includes('นัดหมาย'))   return {icon:'📌', text:'ยืนยันนัดก่อน 1 ชม.', color:'var(--blue)'};
    if (combined.includes('รอตอบ') || combined.includes('รอลูกค้า')) {
      return {icon:'💬', text:'ส่ง LINE ติดตามผล', color:'var(--blue)'};
    }
    if (combined.includes('ติดตาม'))    return {icon:'📞', text:'โทรตามต่อ', color:'var(--blue)'};

    // ── Fallback: ยังไม่โทร → ดูตามอายุ lead ──
    if (!lead.updateCount) {
      if (daysOld === null)    return {icon:'📞', text:'โทรเลย', color:'var(--blue)'};
      if (daysOld <= 1)        return {icon:'🔥', text:'โทรเลย — lead ใหม่!', color:'var(--red)'};
      if (daysOld <= 3)        return {icon:'⚡', text:`เร่งโทร (${daysOld} วันแล้ว)`, color:'var(--amber)'};
      if (daysOld <= 7)        return {icon:'⚠️', text:`${daysOld} วันแล้ว — เร่งติดต่อ`, color:'var(--red)'};
      return {icon:'❄️', text:`${daysOld} วัน — เคสกำลังจะหลุดมือ`, color:'var(--red)'};
    }

    // โทรไปแล้วแต่ไม่มี status เด่นชัด
    return {icon:'📞', text:'อัพเดทเคสล่าสุด', color:'var(--blue)'};
  }

  // ── เดือนปัจจุบัน (สำหรับ banner แจ้งเตือน — ไม่ขึ้นกับ filter) ──
  function leadsInCurrentMonth() {
    const now = new Date();
    const curMonth = now.getMonth() + 1;
    return (D.leads || []).filter(l => {
      const d = parseSheetDate(l.dateIn);
      return d && d.month === curMonth;
    });
  }

  // ── 🔔 กระดิ่งแจ้งเตือนเซลล์ — รวบงานที่ต้องทำ (เหมือนหน้าแอดมิน) ──
  function computeSellerAlerts() {
    const cur = leadsInCurrentMonth().filter(l => !isSkipped(l) && !isBooked(l));
    const followF = findFilter('follow').test;
    let notCalled = 0, follow = 0, noStatus = 0;
    cur.forEach(l => {
      if (!l.updateCount) notCalled++;
      if (followF(l)) follow++;
      if (!zVal(l)) noStatus++;
    });
    // ปล่อยแล้วลงวันไม่ครบ (เคสตัวเอง) — กระทบคะแนนเวลาปิด
    const _e = (v) => !v || v === '' || v === '-';
    const relBlank = bookingsInRange().map((b, i) => ({ b, i })).filter(o => {
      if (o.b.status !== 'ปล่อย' || !o.b.sheetTab) return false;
      const _cash = o.b.isCash || (o.b.signDate || '').includes('สด') || (o.b.grade || '').includes('สด');
      const miss = [];
      if (!_cash && _e(o.b.signDate)) miss.push('เซ็น');
      if (!_cash && _e(o.b.resultDate)) miss.push('ผล');
      if (_e(o.b.releaseDatePrimary)) miss.push('ปล่อย');
      o.miss = miss;
      return miss.length > 0;
    });
    // วันที่ปีผิด (เคสตัวเอง) — ปีนอก 2020–2035 (มักพิมพ์ 1969) → อายุเคส/คะแนนเวลาเพี้ยน · สแกนทุกเคส (อาจหลุดช่วงวันที่)
    const _badY = (s) => { const d = sheetDateToJS(parseSheetDate(s)); if (!d) return false; const y = d.getFullYear(); return y < 2020 || y > 2035; };
    const _yf = [['วันจอง', 'date'], ['วันเซ็น', 'signDate'], ['วันผล', 'resultDate'], ['วันปล่อย', 'releaseDate']];
    const badYr = [];
    (D.bookingCases || []).forEach((b, gi) => {
      const errs = [];
      _yf.forEach(([lbl, k]) => { if (b[k] && _badY(b[k])) errs.push(lbl + '=' + b[k]); });
      if (errs.length) badYr.push({ b, gi, errs });
    });
    const curMonthName = (C.MONTHS_FULL || [])[new Date().getMonth()] || '';
    // badge = งานด่วน/finite: ยังไม่โทร (speed-to-lead) + ปล่อยลงวันไม่ครบ + วันที่ปีผิด (กระทบคะแนน)
    // ไม่รวม follow/noStatus (pipeline/nudge ก้อนใหญ่ → badge จะบวม 99+ ตลอด) — ยังโชว์เป็นปุ่มในกระดิ่ง
    return { notCalled, follow, noStatus, relBlank, badYr, curMonthName, total: notCalled + relBlank.length + badYr.length };
  }

  function sellerBellHtml() {
    const a = computeSellerAlerts();
    const tot = a.total;
    const badge = tot > 0 ? `<span style="position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 3px;border-radius:9px;background:var(--red);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3)">${tot > 99 ? '99+' : tot}</span>` : '';
    const color = a.badYr.length > 0 ? 'var(--red)' : (a.relBlank.length > 0 ? 'var(--amber)' : (tot > 0 ? 'var(--blue)' : 'var(--t3)'));
    return `<button id="seller-alerts-bell" onclick="openSellerAlertsPanel()" title="แจ้งเตือน: งานที่ต้องทำ / เคสปล่อยลงวันไม่ครบ" style="margin-left:auto;position:relative;font-size:15px;padding:7px 11px;border-radius:9px;border:.5px solid var(--bd2);background:var(--bg2);color:${color};cursor:pointer;display:inline-flex;align-items:center">${ic('lucide:bell', 17)}${badge}</button>`;
  }

  function openSellerAlertsPanel() {
    const old = document.getElementById('salerts-overlay'); if (old) old.remove();
    const a = computeSellerAlerts();
    const tot = a.total;
    const overlay = document.createElement('div');
    overlay.id = 'salerts-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:transparent;z-index:1010';
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
    const _close = `document.getElementById('salerts-overlay').remove()`;
    const _bell = document.getElementById('seller-alerts-bell');
    const _r = _bell ? _bell.getBoundingClientRect() : null;
    const _top = _r ? Math.round(_r.bottom + 6) : 54;
    let _right = _r ? Math.max(8, Math.round(window.innerWidth - _r.right)) : 12;
    const _pw = Math.min(340, window.innerWidth * 0.92);
    _right = Math.min(_right, Math.max(8, Math.round(window.innerWidth - _pw - 8)));

    let bd = '';
    if (!tot) bd += `<div style="text-align:center;color:var(--green);padding:44px 12px"><div>${ic('lucide:circle-check', 32)}</div><div style="margin-top:8px;font-weight:700;font-size:13px">ไม่มีงานค้าง ✓</div></div>`;

    // ── งานเดือนนี้: ยังไม่โทร / ต้องตามต่อ (แตะ → กรอง lead list) ──
    if (a.notCalled > 0 || a.follow > 0) {
      bd += `<div style="margin-bottom:15px">`;
      bd += `<div style="font-size:12.5px;font-weight:800;color:var(--amber)">${ic('lucide:phone', 15)} งานเดือน${h(a.curMonthName)}</div>`;
      bd += `<div style="font-size:10px;color:var(--t3);margin:2px 0 6px">แตะเพื่อกรองดูในรายการเคส</div>`;
      bd += `<div style="display:flex;flex-wrap:wrap;gap:6px">`;
      if (a.notCalled > 0) bd += `<button onclick="${_close};setPageMode('dashboard');setKpi('notCalled')" style="font-size:11.5px;background:var(--red-bg,#fdecec);border:.5px solid var(--red,#e5484d);border-radius:8px;padding:5px 11px;cursor:pointer;color:var(--red,#e5484d);font-weight:700">ยังไม่โทร ${a.notCalled}</button>`;
      if (a.follow > 0) bd += `<button onclick="${_close};setPageMode('dashboard');setKpi('follow')" style="font-size:11.5px;background:var(--blue-bg,#eaf2fe);border:.5px solid var(--blue,#3b82f6);border-radius:8px;padding:5px 11px;cursor:pointer;color:var(--blue,#3b82f6);font-weight:700">ต้องตามต่อ ${a.follow}</button>`;
      bd += `</div></div>`;
    }

    // ── ปล่อยแล้วลงวันไม่ครบ (เคสตัวเอง) ──
    if (a.relBlank.length) {
      bd += `<div style="margin-bottom:15px">`;
      bd += `<div style="font-size:12.5px;font-weight:800;color:var(--amber)">${ic('lucide:calendar', 15)} ปล่อยแล้วลงวันไม่ครบ · ${a.relBlank.length}</div>`;
      bd += `<div style="font-size:10px;color:var(--t3);margin:2px 0 6px">ลงวัน เซ็น/ผล/ปล่อย ให้ครบ คะแนนเวลาปิดจะขึ้น · แตะไปเติม</div>`;
      a.relBlank.slice(0, 40).forEach(o => {
        bd += `<div onclick="${_close};openBookingDetail(${o.i})" style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 2px;border-bottom:.5px solid var(--bd);cursor:pointer;font-size:11.5px"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h((o.b.customer || '-').slice(0, 22))}</span><span style="color:var(--amber);font-weight:600;white-space:nowrap;font-size:10.5px">ขาด ${h((o.miss || []).join('/'))}</span></div>`;
      });
      if (a.relBlank.length > 40) bd += `<div style="font-size:10px;color:var(--t3);padding:5px 0">… อีก ${a.relBlank.length - 40} เคส</div>`;
      bd += `</div>`;
    }

    // ── ยังไม่ลงสถานะลูกค้า (Z) ──
    if (a.noStatus > 0) {
      bd += `<div style="margin-bottom:6px">`;
      bd += `<div style="font-size:12.5px;font-weight:800;color:var(--blue)">${ic('lucide:bell', 15)} ยังไม่ลงสถานะลูกค้า · ${a.noStatus}</div>`;
      bd += `<div style="font-size:10px;color:var(--t3);margin:2px 0 6px">กดเปิดเคสแล้วเลือกสถานะ จะช่วยจัดลำดับการตามให้แม่นขึ้น</div>`;
      bd += `<button onclick="${_close};setPageMode('dashboard');setKpi('notCalled')" style="font-size:11px;padding:5px 11px;border-radius:9px;border:.5px solid var(--blue,#3b82f6);background:var(--blue-bg,#eaf2fe);color:var(--blue,#3b82f6);font-weight:700;cursor:pointer">ดูรายการเคส →</button>`;
      bd += `</div>`;
    }

    // ── วันที่ปีผิด (เคสตัวเอง) — แตะไปแก้ ──
    if (a.badYr.length) {
      bd += `<div style="margin-bottom:6px">`;
      bd += `<div style="font-size:12.5px;font-weight:800;color:var(--red)">${ic('lucide:triangle-alert', 15)} วันที่ปีผิด · ${a.badYr.length}</div>`;
      bd += `<div style="font-size:10px;color:var(--t3);margin:2px 0 6px">ปีนอก 2020–2035 (มักพิมพ์ 1969) ทำให้อายุเคส/คะแนนเวลาเพี้ยน → แตะไปแก้</div>`;
      a.badYr.slice(0, 40).forEach(o => {
        bd += `<div onclick="${_close};openBadYrCase(${o.gi})" style="padding:7px 2px;border-bottom:.5px solid var(--bd);cursor:pointer;font-size:11px"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><b>${h((o.b.customer || '-').slice(0, 22))}</b></div><div style="color:var(--red);font-size:10px;margin-top:1px">${h(o.errs.join(' · '))}</div></div>`;
      });
      if (a.badYr.length > 40) bd += `<div style="font-size:10px;color:var(--t3);padding:5px 0">… อีก ${a.badYr.length - 40} เคส</div>`;
      bd += `</div>`;
    }

    overlay.innerHTML = `<div id="salerts-pop" style="position:fixed;top:${_top}px;right:${_right}px;width:min(340px,92vw);max-height:min(76vh,640px);background:var(--bg);border:.5px solid var(--bd);border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden;transform-origin:top right;transform:translateY(-8px) scale(.98);opacity:0;transition:transform .15s ease,opacity .15s ease" onclick="event.stopPropagation()">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;border-bottom:.5px solid var(--bd);flex-shrink:0">
        <div style="font-size:14px;font-weight:800;color:var(--t1)">${ic('lucide:bell', 16)} แจ้งเตือน ${tot ? `<span style="font-size:12px;color:var(--red)">(${tot})</span>` : ''}</div>
        <button onclick="${_close}" style="padding:4px 10px;border-radius:8px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);font-weight:700;font-size:12px;cursor:pointer">✕</button>
      </div>
      <div style="flex:1;overflow-y:auto;padding:12px 14px">${bd}</div>
    </div>`;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => { const p = document.getElementById('salerts-pop'); if (p) { p.style.transform = 'translateY(0) scale(1)'; p.style.opacity = '1'; } });
  }

  // ── KPI filters ──
  // D.leads รวม junk (คืนเคส/ยกเลิก/จ่ายใหม่/จบ/ส่งมอบ/ไม่สนใจ/dead) ครบ — เซลล์เห็นทั้งหมด
  // แต่ KPI "ยังไม่โทร" + "ต้องโทรต่อ" + banner ตัด junk ออก เพราะไม่ควรเตือนให้โทรเคสที่ admin ปิดแล้ว
  //
  // KPI cards (ภาพรวมหลัก) — clickable filter ของ lead list
  //   "ต้องโทรต่อ" = ภาพรวมที่เซลล์สนใจที่สุด (status-based, คนละมิติกับ "โทรกี่ครั้ง")
  // CALL_FILTERS (filter chip row ด้านล่าง) — drill-down ตามจำนวนครั้งที่โทร (disjoint)
  const SKIP_KEYWORDS = ['จบ','ส่งมอบ','คืนเคส','คืน','ยกเลิก','ไม่สนใจ','dead','จ่ายใหม่'];
  const FOLLOW_KEYWORDS = ['ติดตาม','รอตอบ','รอลูกค้า','รอ','โทรไม่รับ','ผิดนัด','นัดหมาย'];
  // คอลัม Z "สถานะลูกค้า" (layout ใหม่) — sync กับ backend customer_status logic
  // เคสเสีย (ในวงเล็บ): ยังไม่ออก/แบล็คลิส/เครดิตไม่ผ่าน/ไม่สนใจ/คืนเคส
  const Z_DEAD = ['ยังไม่ออก','แบล็คลิส','เครดิตไม่ผ่าน','ไม่สนใจ','คืนเคส'];
  // 16 ค่าของ dropdown "สถานะลูกค้า" (มิ.ย.69) — ใช้ทั้งตัวกรองสถานะ (STATUS_FILTERS) + dropdown แก้ในเคส
  const Z_STATUSES = ['สนใจมาก','ลังเล','ไม่รับสาย','รอเงิน','รอเช็คเครดิต','ดาวน์ไม่พอ','จอง','ส่งมอบ',
                      'ยังไม่ออกเร็วๆนี้','ติดแบล็คลิส','เครดิตไม่ผ่าน','ลูกค้าไม่สนใจแล้ว','คืนเคส',
                      'ได้รถแล้ว','เงินสดเงินไม่พอ','ลูกค้าไม่ตอบ'];
  const zVal = (l) => (l.customerStatus || '').trim();
  // "ไม่ต้องตาม" = ดูคอลัม Z (สถานะลูกค้า) ร่วมกับ AB (Status แอดมิน) + เซลล์ แบบ OR — อันใดอันหนึ่งเข้า = ตัด
  // (sync กับ backend _skip/_booked · เดิมดู Z ก่อน ถ้า Z มีค่าจะไม่สน AB → เคส Z=ติดตาม·AB=จอง หลุดมาโดนตามผิด)
  const isSkipped = (l) => {
    const z = zVal(l);
    if (Z_DEAD.some(k => z.includes(k))) return true;   // คำ "เคสเสีย" ของ Z (controlled vocab)
    // ยกเลิก/คืนเคส/จ่ายใหม่/จบ/ส่งมอบ... ที่ไหนก็ตาม (Z หรือ AB หรือเซลล์)
    const st = (z + ' ' + (l.adminStatus||'') + ' ' + (l.salesStatus||'')).toLowerCase();
    return SKIP_KEYWORDS.some(k => st.includes(k.toLowerCase()));
  };
  // "จอง / ปล่อย / ส่งมอบ / ได้รถแล้ว" ที่คอลัมไหนก็ตาม (Z + AB + เซลล์) = จัดการแล้ว ไม่ต้องเตือนโทร
  const isBooked = (l) => {
    const blob = zVal(l) + ' ' + (l.adminStatus||'') + ' ' + (l.salesStatus||'');
    return blob.includes('จอง') || blob.includes('ส่งมอบ') || blob.includes('ปล่อย') || blob.includes('ได้รถแล้ว');
  };
  // "เคสในมือ" = เคสที่ยังต้องดูแล (ติดตาม + จอง + ปล่อย) ไม่นับเคสปิด (คืน/ยกเลิก/จ่ายใหม่)
  const isInHand = (l) => {
    if (isSkipped(l)) return false;
    const z = zVal(l);
    if (z) return !Z_DEAD.some(k => z.includes(k));   // มี Z + ไม่ dead = ยังอยู่ในมือ
    const a = (l.adminStatus||'').toLowerCase();
    const s = (l.salesStatus||'').toLowerCase();
    // เช็คทั้ง admin + sales (เดือน มิ.ย.+ salesStatus ว่าง แต่ adminStatus=ติดตาม)
    const fk = (x) => x && x !== '-' && FOLLOW_KEYWORDS.some(k => x.includes(k));
    if (fk(s) || fk(a)) return true;
    if (a.includes('จอง') || s.includes('จอง')) return true;
    if (a.includes('ปล่อย') || s.includes('ปล่อย')) return true;
    return false;
  };
  const KPI_DEFS = [
    { key: 'inHand',    label: 'เคสในมือ',         color: 'var(--blue)',   hint: 'ติดตาม + จอง + ปล่อย (ไม่นับปิด)', test: isInHand },
    { key: 'called',    label: 'โทรแล้วมีหลักฐาน', color: 'var(--green)',  hint: 'callProof = ส่งแล้ว',  test: l => l.callProof === 'ส่งแล้ว' },
    { key: 'notCalled', label: 'ยังไม่โทร',       color: 'var(--red)',    hint: 'updateCount = 0 (ไม่รวมเคสปิด/จอง/ปล่อย)', test: l => !l.updateCount && !isSkipped(l) && !isBooked(l) },
    { key: 'follow',    label: 'ต้องโทรต่อ',      color: 'var(--blue)',   hint: 'สถานะลูกค้า = ต้องตาม (ไม่รวมเคสปิด/จอง/ปล่อย)', test: l => {
        if (isSkipped(l)) return false;
        if (isBooked(l)) return false;   // จองแล้ว = ไม่ต้องเตือนโทร
        if (zVal(l)) return true;        // มี Z + ผ่าน skip/booked = สถานะ active ต้องตาม
        const s = (l.salesStatus||'').toLowerCase();
        const a = (l.adminStatus||'').toLowerCase();   // เช็ค admin ด้วย (มิ.ย.+ sales ว่าง)
        if ((!s || s==='-') && (!a || a==='-')) return false;
        return FOLLOW_KEYWORDS.some(k => s.includes(k) || a.includes(k));
      }},
    { key: 'all',       label: 'เคสทั้งหมด',       color: 'var(--t1)',     hint: 'รวมที่ปิด/คืน/ยกเลิกด้วย', test: l => true },
  ];
  // Disjoint breakdown ตามจำนวนครั้งที่โทร — chip row ใต้ KPI
  const CALL_FILTERS = [
    { key: 'c0',    label: 'ยังไม่โทร', color: 'var(--red)',       test: l => l.updateCount === 0 },
    { key: 'c1',    label: '1 ครั้ง',   color: 'var(--amber)',     test: l => l.updateCount === 1 },
    { key: 'c2',    label: '2 ครั้ง',   color: 'var(--amber)',     test: l => l.updateCount === 2 },
    { key: 'c3',    label: '3 ครั้ง',   color: 'var(--green-mid)', test: l => l.updateCount === 3 },
    { key: 'cFull', label: `ครบ ${C.UPD_TGT}+`, color: 'var(--green)', test: l => l.updateCount >= C.UPD_TGT },
  ];
  const ALL_FILTERS = [...KPI_DEFS, ...CALL_FILTERS];
  const findFilter = (key) => ALL_FILTERS.find(f => f.key === key) || KPI_DEFS[0];

  // Dropdown สถานะ — เลือกจาก header ของ lead list (override kpiFilter เมื่อไม่ใช่ 'all')
  // junk statuses (คืน/ยกเลิก/จ่ายใหม่) override isInHand เพื่อให้เห็น list ได้
  function statusContains(l, ...kws) {
    const a = (l.adminStatus||'').toLowerCase();
    const s = (l.salesStatus||'').toLowerCase();
    return kws.some(k => {
      const lk = k.toLowerCase();
      return a.includes(lk) || s.includes(lk);
    });
  }
  // ตัวกรองสถานะ — กรองตาม "สถานะลูกค้า" (Z) 16 ค่าใหม่ (มิ.ย.69)
  // เดิมมี ติดตาม/คืนเคส/ยกเลิก/จ่ายใหม่ (จาก admin/sales) → เปลี่ยนเป็น dropdown Z ตามที่ผู้ใช้กำหนด
  const STATUS_FILTERS = [
    { key: 'all', label: 'ทั้งหมด', test: null },  // null = ใช้ kpiFilter test
    // ตัวกรองข้ามหมวด (ไม่ใช่ค่า Z) — ตัด junk/จอง ออกให้ตรงกับ KPI "ยังไม่โทร"/banner ไม่มีสถานะ
    { key: 'f_nocall',   label: 'ยังไม่โทร',     test: l => !l.updateCount && !isSkipped(l) && !isBooked(l) },
    { key: 'f_nostatus', label: 'ยังไม่มีสถานะ', test: l => !zVal(l) && !isSkipped(l) && !isBooked(l) },
    ...Z_STATUSES.map(z => ({ key: 'z_' + z, label: z, test: l => zVal(l).includes(z) })),
  ];
  const SORT_OPTIONS = [
    { key: '',             label: 'เรียงปกติ'  },
    { key: 'last_update',  label: 'อัพเดทล่าสุด' },
    { key: 'updates_desc', label: 'อัพเดทมาก→น้อย' },
    { key: 'updates_asc',  label: 'อัพเดทน้อย→มาก' },
  ];

  // ── ดึง leads ที่ผ่านการกรองช่วงเวลา ──
  function leadsInRange() {
    return (D.leads || []).filter(l => dateMatchesFilter(l.dateIn));
  }
  // ปล่อย → filter ตาม releaseDate (วันปล่อย); statuses อื่น → filter ตาม date (วันจอง)
  // เคสจองเดือน A แต่ปล่อยเดือน B ต้องนับเข้าเดือน B
  function bookingsInRange() {
    return (D.bookingCases || []).filter(b => {
      if (b.status === 'ปล่อย') {
        // releaseDate (คอลัมน์ W) บางเคส admin กรอกเป็นข้อความ เช่น "ปล่อย 9/5" / "รับวันที่ 30/5"
        // → ถ้า parse เป็นวันที่ไม่ได้ ใช้วันจอง (b.date) แทน (ตรงกับ backend get_done_month)
        let rd = b.releaseDate;
        if (!rd || rd === '-' || !parseSheetDate(rd)) rd = b.date;
        return dateMatchesFilter(rd);
      }
      return dateMatchesFilter(b.date);
    });
  }

  // 🏆 ตารางคะแนนเซลล์ (leaderboard) — คะแนนเดือนนี้ของทุกเซลล์ · ไฮไลท์แถวตัวเอง
  function renderScorecard() {
    const sc = (D.scorecard || []).slice().sort((a,b) => (b.total||0) - (a.total||0));
    if (!sc.length) return '';
    const f1 = (n) => (Math.round(Number(n||0)*10)/10).toFixed(1);
    const medals = ['🥇','🥈','🥉'];
    const cols = '.4fr 1.1fr .55fr .55fr .6fr .7fr .7fr .75fr .8fr .85fr .7fr .8fr';

      <h2 style="display:flex;align-items:center;gap:6px">${ic('lucide:trophy',16)} ตารางคะแนนเซลล์ <span style="font-size:11px;font-weight:400;color:var(--t3);font-family:inherit">(100 คะแนน · เดือนนี้)</span></h2>
      <div style="font-size:11px;color:var(--t3);margin-bottom:8px">อันดับคะแนนทุกเซลล์ของเดือนนี้ — <b style="color:var(--blue)">แถวสีน้ำเงิน = ของคุณ</b></div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><div style="min-width:720px">
        <div style="display:grid;grid-template-columns:${cols};gap:3px;font-size:9.5px;color:var(--t3);padding:5px 6px;border-bottom:.5px solid var(--bd);font-weight:600">
          <span>#</span><span>เซลล์</span><span style="text-align:right">ปล่อย</span><span style="text-align:right">จอง</span><span style="text-align:right">Conv%</span>
          <span style="text-align:right">จบ/30</span><span style="text-align:right">จอง/10</span><span style="text-align:right">Conv/20</span><span style="text-align:right">เวลา/10</span><span style="text-align:right">ตาม/20</span><span style="text-align:right">แบน/10</span><span style="text-align:right">รวม</span>
        </div>`;
    sc.forEach((e, i) => {
      const me = e.name === SELLER_NAME;

      s += `<div style="display:grid;grid-template-columns:${cols};gap:3px;font-size:11px;padding:6px;border-bottom:.5px solid var(--bd);${me?'background:var(--blue-bg,#eef2ff);border-radius:6px':''}">
        <span style="${i<3?'font-size:13px':'color:var(--t3)'}">${rank}</span>
        <span style="font-weight:${me?'800':i<3?'700':'500'};${me?'color:var(--blue)':''}">${h(sname(e.name))}${me?' (คุณ)':''}</span>
        <span style="text-align:right;color:var(--t2)">${e.dones}</span>
        <span style="text-align:right;color:var(--t2)">${e.jongs}</span>
        <span style="text-align:right;color:var(--t3);font-size:10px">${f1(e.conv)}</span>
        <span style="text-align:right;color:var(--green-mid)">${f1(e.sDone)}</span>
        <span style="text-align:right;color:var(--blue)">${f1(e.sJong)}</span>
        <span style="text-align:right;color:var(--blue)">${f1(e.sConv)}</span>
        <span style="text-align:right;color:#7c3aed">${f1(e.sVel)}</span>
        <span style="text-align:right;color:var(--amber)">${f1(e.sFollow)}</span>
        <span style="text-align:right;color:${e.sBan<10?'var(--red)':'var(--t2)'}">${f1(e.sBan)}</span>
        <span style="text-align:right;color:${tc};font-weight:800;font-size:12.5px">${f1(e.total)}</span>
      </div>`;
    });
    s += `</div></div></div>`;
    return s;
  }

  // จำนวนเดือนที่ช่วงวันที่ครอบ — ใช้สเกล "เป้า" (รายเดือน) ให้ตรงกับช่วง (เดือนละ 8 · กรองทั้งปี = ×เดือนในช่วง)
  function rangeMonthCount() {
    if (fMonth > 0) return 1;
    if (!fDateFrom && !fDateTo) return 12;
    const from = fDateFrom ? new Date(fDateFrom + 'T00:00:00') : new Date();
    const to = fDateTo ? new Date(fDateTo + 'T00:00:00') : new Date();
    const set = new Set();
    let cur = new Date(from.getFullYear(), from.getMonth(), 1);
    const end = new Date(to.getFullYear(), to.getMonth(), 1);
    let g = 0;
    while (cur <= end && g < 24) { set.add(cur.getFullYear() + '-' + cur.getMonth()); cur.setMonth(cur.getMonth() + 1); g++; }
    return set.size || 1;
  }

  // สร้างชุดข้อมูลกราฟตามช่วงวันที่ (≤45 วัน = รายวัน · มากกว่านั้น = รายเดือนเฉพาะเดือนในช่วง) — เลิกโชว์ 12 เดือนทั้งปีเสมอ
  function buildRangeSeries() {
    const daily = D.daily || {}, monthly = D.monthly || {};
    const MS = C.MONTHS_SHORT || [];
    const o = { labels: [], leadNormal: [], leadRJ: [], bookings: [], dones: [], dealValue: [], pointMode: false };
    if (!fDateFrom && !fDateTo) {   // fallback: ทั้งปี 12 เดือน
      o.labels = MS.slice();
      for (let m = 1; m <= 12; m++) { const x = monthly[m] || monthly[String(m)] || {}; o.leadNormal.push(x.leadNormal||0); o.leadRJ.push(x.leadRJ||0); o.bookings.push(x.booking||0); o.dones.push(x.done||0); o.dealValue.push(x.dealValue||0); }
      return o;
    }
    const yr = (D.meta && D.meta.year) || new Date().getFullYear();
    const from = fDateFrom ? new Date(fDateFrom + 'T00:00:00') : new Date(yr, 0, 1);
    const to = fDateTo ? new Date(fDateTo + 'T00:00:00') : new Date();
    const days = Math.floor((to - from) / 86400000) + 1;
    if (days <= 45) {                 // รายวัน
      o.pointMode = true;
      let cur = new Date(from), g = 0;
      while (cur <= to && g < 400) {
        const m = cur.getMonth() + 1, d = cur.getDate();
        const md = daily[m] || daily[String(m)] || {};
        o.labels.push(d + '/' + m);
        o.leadNormal.push((md.leads||[])[d]||0); o.leadRJ.push((md.leadRJ||[])[d]||0);
        o.bookings.push((md.bookings||[])[d]||0); o.dones.push((md.dones||[])[d]||0); o.dealValue.push((md.dealValue||[])[d]||0);
        cur.setDate(cur.getDate() + 1); g++;
      }
    } else {                          // รายเดือน (เฉพาะวันในช่วง)
      let cur = new Date(from.getFullYear(), from.getMonth(), 1);
      const end = new Date(to.getFullYear(), to.getMonth(), 1), g0 = 0; let g = g0;
      while (cur <= end && g < 24) {
        const m = cur.getMonth() + 1;
        const md = daily[m] || daily[String(m)] || {};
        const dim = new Date(yr, m, 0).getDate();
        let ln=0,lr=0,bk=0,dn=0,dv=0;
        for (let d = 1; d <= dim; d++) {
          const dd = new Date(cur.getFullYear(), m - 1, d);
          if (dd < from || dd > to) continue;
          ln += (md.leads||[])[d]||0; lr += (md.leadRJ||[])[d]||0; bk += (md.bookings||[])[d]||0; dn += (md.dones||[])[d]||0; dv += (md.dealValue||[])[d]||0;
        }
        o.labels.push(MS[m-1] || ('ด.'+m)); o.leadNormal.push(ln); o.leadRJ.push(lr); o.bookings.push(bk); o.dones.push(dn); o.dealValue.push(dv);
        cur.setMonth(cur.getMonth() + 1); g++;
      }
    }
    return o;
  }

  // ── chart init ──
  function destroyChart(id) {
    if (__charts[id]) { __charts[id].destroy(); delete __charts[id]; }
  }
  // ฿ แบบกระชับ (shared by KPI + chart axis)
  const fmtBahtChart = (n) => {
    const v = Number(n||0);
    if (v >= 1000000) return '฿' + (v/1000000).toFixed(v >= 10000000 ? 1 : 2) + 'M';
    if (v >= 100000)  return '฿' + Math.round(v/1000) + 'K';
    if (v >= 1000)    return '฿' + (v/1000).toFixed(1) + 'K';
    return '฿' + Math.round(v).toLocaleString();
  };

  function initCharts() {
    if (typeof Chart === 'undefined') return;
    const _dark = document.documentElement.getAttribute('data-theme') === 'dark';
    Chart.defaults.color = _dark ? '#aaa0c4' : '#56506b';
    Chart.defaults.borderColor = _dark ? 'rgba(255,255,255,0.08)' : 'rgba(109,40,217,0.08)';
    const daily = D.daily || {};
    const monthly = D.monthly || {};
    // 📅 ตามตัวกรองวันที่เสมอ (รายวันถ้าช่วงสั้น · รายเดือนถ้าช่วงยาว) — ไม่โชว์ 12 เดือนทั้งปีอีก
    const _rs = buildRangeSeries();
    const isDaily = _rs.pointMode;
    const labels = _rs.labels, leadNormal = _rs.leadNormal, leadRJ = _rs.leadRJ,
          bookings = _rs.bookings, dones = _rs.dones, dealValue = _rs.dealValue;

    const cv1 = document.getElementById('chart-leads');
    if (cv1) {
      destroyChart('leads');
      __charts.leads = new Chart(cv1, {
        type: 'line',
        data: { labels, datasets: [
          { label: 'Lead ปกติ', data: leadNormal, borderColor:'#3b82f6', backgroundColor:'rgba(59,130,246,.15)', tension:.35, fill:true, pointRadius:isDaily?2:3 },
          { label: 'RJ', data: leadRJ, borderColor:'#ef4444', backgroundColor:'rgba(239,68,68,.1)', tension:.35, fill:true, pointRadius:isDaily?2:3 },
        ]},
        options: { responsive:true, maintainAspectRatio:false,
          plugins:{legend:{position:'bottom',labels:{boxWidth:11,font:{size:10}}}},
          scales:{y:{beginAtZero:true,ticks:{precision:0}}}
        }
      });
    }

    const cv2 = document.getElementById('chart-bd');
    if (cv2) {
      destroyChart('bd');
      __charts.bd = new Chart(cv2, {
        type: 'bar',
        data: { labels, datasets: [
          { label:'จอง', data:bookings, backgroundColor:'#f59e0b' },
          { label:'ปล่อย', data:dones, backgroundColor:'#10b981' },
        ]},
        options: { responsive:true, maintainAspectRatio:false,
          plugins:{legend:{position:'bottom',labels:{boxWidth:11,font:{size:10}}}},
          scales:{y:{beginAtZero:true,ticks:{precision:0}}}
        }
      });
    }

    const cv3 = document.getElementById('chart-pipe');
    if (cv3) {
      destroyChart('pipe');
      const order = C.STATUS_ORDER || ['จอง','รอเซ็นต์','รอผล','รอปล่อย','ปล่อย','รีเจ็ก'];
      const pl = {}; order.forEach(k => pl[k] = 0);
      bookingsInRange().forEach(b => { if (pl[b.status] !== undefined) pl[b.status]++; });
      const counts = order.map(k => pl[k] || 0);
      const colors = order.map(k => (C.STATUS_COLOR || {})[k] || '#888');
      __charts.pipe = new Chart(cv3, {
        type:'doughnut',
        data:{ labels:order, datasets:[{ data:counts, backgroundColor:colors, borderWidth:0 }]},
        options:{ responsive:true, maintainAspectRatio:false, cutout:'60%',
          plugins:{legend:{position:'right',labels:{boxWidth:11,font:{size:10}}}},
        }
      });
    }

    // 4) Line — ${ic('lucide:wallet',16)} ยอดปล่อย (Deal Value)
    const cv4 = document.getElementById('chart-deal-value');
    if (cv4) {
      destroyChart('dealValue');
      const totalDV = dealValue.reduce((a,b)=>a+b,0);
      __charts.dealValue = new Chart(cv4, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'ยอดปล่อย (฿)', data: dealValue,
            borderColor: '#059669',
            backgroundColor: 'rgba(5,150,105,.15)',
            tension: .35, fill: true,
            pointRadius: isDaily ? 2 : 4,
            pointBackgroundColor: '#059669',
            borderWidth: 2.4,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => '฿' + Number(ctx.parsed.y||0).toLocaleString(),
                footer: () => totalDV > 0 ? 'รวม ' + fmtBahtChart(totalDV) : '',
              },
            },
          },
          scales: {
            y: { beginAtZero: true, ticks: { callback: (v) => fmtBahtChart(v) } },
          },
        }
      });
    }
  }

  // ── badges ──
  function callBadge(l) {
    if (l.callProof === 'ส่งแล้ว') return '<span class="badge b-green">มีหลักฐาน</span>';
    if (l.updateCount === 0) return '<span class="badge b-red">ยังไม่โทร</span>';
    if (l.updateCount < C.UPD_TGT) return `<span class="badge b-amber">โทรอีก ${nc(l.updateCount)}</span>`;
    return '<span class="badge b-green">ครบ</span>';
  }
  function dotsMini(u) {
    let h = '<span class="dots-mini">';
    for (let i=0; i<C.UPD_TGT; i++) {
      let c = '#ccc';
      if (i<u) {
        if (u >= C.UPD_TGT) c = '#3B6D11';
        else if (u >= 3) c = '#1D9E75';
        else if (u >= 2) c = '#EF9F27';
        else c = '#E24B4A';
      }
      h += `<span class="dot-mini" style="background:${c}"></span>`;

  // ── render ──
  function render() {
    if (pageMode === 'cars') { renderCarsMode(); return; }                            // 🚗 สถานะรถ

    const s = D.seller;
    const teamId = s.team || '?';

    const allLeads = leadsInRange();
    const bookings = bookingsInRange();

    // KPI + filter chip counts
    const kpiCounts = {};

    // Booking สถานะ "ปล่อย" — bookings ผ่าน bookingsInRange() ที่ filter "ปล่อย" ด้วย releaseDate แล้ว
    const doneBookings = bookings.filter(b => b.status === 'ปล่อย');

    const dealValueRange = doneBookings.reduce((a,b)=>a+(Number(b.price)||0),0);

    // เคสในมือ breakdown — จาก leads ที่ผ่าน isInHand (mutual exclusive bucket)
    // priority: ปล่อย > จอง > ติดตาม → sum = kpiCounts['inHand']
    // ★ ใช้สถานะลูกค้า (Z) ก่อน — ได้รถแล้ว/ส่งมอบ/ปล่อย=จบ · จอง=จอง · อื่นๆ=ติดตาม · ไม่มี Z → admin/sales เดิม
    let h_follow = 0, h_booking = 0, h_released = 0;
    allLeads.filter(isInHand).forEach(l => {
      const z = zVal(l);
      if (z) {
        if (z.includes('ปล่อย') || z.includes('ส่งมอบ') || z.includes('ได้รถแล้ว')) h_released++;
        else if (z.includes('จอง')) h_booking++;
        else h_follow++;
        return;
      }
      const a = (l.adminStatus||'').toLowerCase();
      const s = (l.salesStatus||'').toLowerCase();
      if (a.includes('ปล่อย') || s.includes('ปล่อย')) h_released++;
      else if (a.includes('จอง') || s.includes('จอง')) h_booking++;
      else h_follow++;
    });
    const followCount = h_follow;
    const bookingCount = h_booking;
    const inHandTotal = kpiCounts['inHand'] || 0;

    const periodLabel = (() => {
      if (fDateFrom || fDateTo) {
        const f = fDateFrom || '...';
        const t = fDateTo || '...';
        return `${f} ถึง ${t}`;
      }
      if (fDay === -1) return 'วันนี้';
      const mm = fMonth > 0 ? `เดือน${(C.MONTHS_FULL||[])[fMonth-1] || fMonth}` : 'ทั้งปี';
      return mm;
    })();

    // 🤖 เก็บ stats ของ "ช่วงที่กรองอยู่" ให้ AI โค้ชใช้ → AI วัดตามตัวกรอง (เลือกเดือนนี้ = วิเคราะห์เดือนนี้)
    _aiStats = {
      periodLabel,
      lead: allLeads.length,
      called: kpiCounts['called'] || 0,
      notCalled: kpiCounts['notCalled'] || 0,
      follow: kpiCounts['follow'] || 0,
      booking: bookingCount,
      done: doneCount,
      dealValue: dealValueRange,
    };

    // ฿ แบบกระชับ
    const fmtBaht = (n) => {
      const v = Number(n||0);
      if (v >= 1000000) return '฿' + (v/1000000).toFixed(v >= 10000000 ? 1 : 2) + 'M';
      if (v >= 100000)  return '฿' + Math.round(v/1000) + 'K';
      if (v >= 1000)    return '฿' + (v/1000).toFixed(1) + 'K';
      return '฿' + Math.round(v).toLocaleString();
    };

    // 📅 เป้ารายเดือน × จำนวนเดือนในช่วง (เดือนละ ${s.target} · กรองหลายเดือน/ทั้งปี = คูณ)
    const _mc = rangeMonthCount();
    const scaledTarget = Math.round((s.target || 0) * _mc);
    const targetSub = _mc > 1 ? `เป้า ${scaledTarget} คัน (เดือนละ ${s.target}×${_mc})` : `เป้า ${scaledTarget} คัน`;

    let html = `
      ${modeBar()}
      <div class="seller-hd">
        <div>
          <h1>${h(SELLER_NAME)}</h1>
          <div class="sub">ทีม ${h(teamName)} · ${targetSub} · ${h(periodLabel)}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:22px;font-weight:800;color:var(--green)">${doneCount}/${scaledTarget}</div>
          <div style="font-size:11px;color:var(--t3)">ปล่อยในช่วงนี้</div>
        </div>
      </div>

      <div class="kgrid" style="margin-bottom:10px;grid-template-columns:1fr">
        <div class="kpi-card" style="cursor:default">
          <div class="kl">ยอดปล่อย ${h(periodLabel)}</div>
          <div class="kv" style="color:var(--green-mid)">${fmtBaht(dealValueRange)}</div>
          <div class="ks">${doneCount ? 'เฉลี่ย '+fmtBaht(dealValueRange/doneCount)+'/คัน · ' + doneCount + ' คัน' : 'ยังไม่มีปล่อย'}</div>
        </div>
      </div>

      ${renderAICoachCard()}

      ${renderScorecard()}

      <div class="filter-bar">

        <span style="font-size:11px;color:var(--t3)">ถึง</span>
        <input type="date" value="${h(fDateTo)}" onchange="setDateTo(this.value)" title="ถึงวันที่" style="padding:6px 10px;border:.5px solid var(--bd2);border-radius:8px;background:var(--bg);color:var(--t1);font-size:12px;font-family:inherit;cursor:pointer">
        <button class="f-btn" onclick="setRangeMonth()">เดือนนี้</button>
        <button class="f-btn" onclick="setRangeYear()">ทั้งปี</button>
        <button class="f-btn ${(fDateFrom&&fDateFrom===fDateTo)?'on':''}" onclick="setRangeToday()">วันนี้</button>
      </div>

      ${(() => {
        // ── ${ic('lucide:triangle-alert',16)} เคสค้าง — ยังไม่โทรเกิน 7 วัน ──
        // นับเฉพาะ: เคสที่ยังไม่โทร (updateCount=0) — ไม่ว่ามี/ไม่มีสถานะติดตาม
        // ตัดออก: junk · จอง · ปล่อย (เพราะจัดการไปแล้ว)
        const staleCases = allLeads
          .filter(l => {
            if (isSkipped(l)) return false;            // ตัด junk
            const a = (l.adminStatus||'').toLowerCase();
            const s = (l.salesStatus||'').toLowerCase();

            if (a.includes('ปล่อย') || s.includes('ปล่อย')) return false; // ตัดปล่อย
            if (l.updateCount > 0) return false;       // นับเฉพาะที่ยังไม่โทร
            const opened = daysSinceSheetDate(l.dateIn);
            if (opened === null) return false;
            l._staleDays = opened;

          return `

              <div style="flex:1;min-width:0">

        };
        return `
        <div style="background:var(--red-bg,#fee);border:.5px solid var(--red-mid,#fca);border-left:3px solid var(--red);border-radius:8px;padding:10px 14px;margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap">
            <div style="font-size:13px;font-weight:700;color:var(--red);display:flex;align-items:center;gap:6px">
              ${ic('lucide:triangle-alert',16)} เคสค้าง — ยังไม่โทรเกิน 7 วัน <span style="background:var(--red);color:#fff;padding:1px 7px;border-radius:10px;font-size:11px">${staleCases.length}</span>
            </div>
            <div style="font-size:10.5px;color:var(--t3)">เรียงจากค้างนานสุด — คลิกดูรายละเอียด</div>
          </div>
          <div style="display:grid;gap:5px">
          ${showTop.map(rowHtml).join('')}
          </div>
          ${rest.length > 0 ? `
            <details style="margin-top:6px">
              <summary style="font-size:11px;color:var(--red);cursor:pointer;padding:4px 0;font-weight:600;text-align:center">+ ดูอีก ${rest.length} เคส</summary>
              <div style="display:grid;gap:5px;margin-top:5px">${rest.map(rowHtml).join('')}</div>
            </details>
          ` : ''}
        </div>
        `;
      })()}

      ${(() => {
        // ── ${ic('lucide:target',16)} Lead Score Priority — โทรเคสไหนก่อน ──
        // filter: ยังต้องตาม (!isSkipped + !isBooked) + มีคะแนน
        // จอง/ปล่อยแล้ว = จัดการแล้ว ไม่ต้องเตือนให้โทร
        // sort: คะแนนสูงสุดก่อน (hot → warm → cold)
        const _isReturned = (l) => zVal(l).includes('คืนเคส') || (l.adminStatus||'').includes('คืนเคส') || (l.salesStatus||'').includes('คืนเคส');
        const priorityLeads = allLeads
          .filter(l => !isSkipped(l) && !isBooked(l) && !_isReturned(l) && (l.leadScore !== undefined && l.leadScore !== null))   // ★ คืนเคส (Z/admin/sales) ไม่ต้องตาม
          .filter(l => followUrgency(l) > 0)   // ตัดเคสที่ "พักไว้" (ไม่รับสายเกิน cap)
          .sort((a,b) => followUrgency(b) - followUrgency(a))
          .slice(0, 10);

        if (priorityLeads.length === 0) {
          return '';
        }

        const tierColor = (t) => {
          if (!t) return 'var(--t3)';
          if (t.includes('hot'))  return 'var(--red)';
          if (t.includes('warm')) return 'var(--amber)';
          return 'var(--blue)';
        };
        const tierBg = (t) => {
          if (!t) return 'var(--bg2)';
          if (t.includes('hot'))  return 'var(--red-bg,#fee)';
          if (t.includes('warm')) return 'var(--amber-bg,#fff7e6)';
          return 'var(--blue-bg,#e7f0fd)';
        };

        return `
        <div class="section" style="margin-bottom:14px">
          <h2 style="display:flex;align-items:center;gap:6px">${ic('lucide:flame',16)} ตามด่วน — โทรก่อน <span style="font-size:11px;font-weight:400;color:var(--t3);font-family:inherit">(Top ${priorityLeads.length})</span>
            <span style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--bg2);color:var(--t2);font-size:11px;font-weight:700;cursor:help;border:.5px solid var(--bd2);margin-left:4px" onclick="showLeadScoreHelp()" title="ดูสูตร Lead Score">?</span>
          </h2>
          <div style="font-size:11px;color:var(--t3);margin-bottom:10px;line-height:1.5">เรียงตามความด่วน: <b>ยังไม่โทร</b> + <b>ฮอท × ดองนาน</b> + <b>ถึงรอบตาม</b> + <b>ลูกค้าสนใจมาก</b> → เคสเพิ่งตามจะพักไว้ (ไม่เด้งซ้ำ)</div>
          <div style="display:grid;grid-template-columns:1fr;gap:8px">
          ${priorityLeads.map((l, i) => {
            const tier = l.leadTier || '❄cold';
            const score = l.leadScore || 0;
            const car = h(l.car || '-');
            const phone = h(l.phone || '-');
            const code = h(l.code || '-');
            const updates = l.updateCount || 0;
            const breakdownStr = (l.scoreBreakdown||[])
              .map(b => `${h(b[0])} (${b[1]>0?'+':''}${b[1]})`)
              .join(' · ');
            const action = getActionHint(l);
            const reason = urgencyReason(l);
            return `
              <div style="background:${tierBg(tier)};border:.5px solid var(--bd);border-left:3px solid ${tierColor(tier)};border-radius:8px;padding:10px 12px;cursor:pointer" onclick="openLeadDetail('${code}')">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px">
                  <div style="flex:1;min-width:0">
                    <div style="font-size:13px;font-weight:700;color:var(--t1)">#${i+1} · ${car}</div>
                    <div style="font-size:11px;color:var(--t3);margin-top:1px">${code} · ${phone} · โทรไปแล้ว ${updates} ครั้ง</div>
                  </div>
                  <div style="text-align:right;flex-shrink:0">
                    <div style="font-size:18px;font-weight:800;color:${tierColor(tier)}">${score}</div>
                    <div style="font-size:10px;color:${tierColor(tier)};font-weight:600">${h(tier)}</div>
                  </div>
                </div>
                <div style="display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:${reason.c};margin:5px 0 1px">${ic('lucide:zap',12)} ด่วนเพราะ: ${h(reason.t)}</div>
                <div style="display:flex;align-items:center;gap:6px;margin-top:5px;padding:6px 9px;background:var(--bg);border-radius:6px;border-left:2px solid ${action.color}">
                  <span style="font-size:14px">${action.icon}</span>
                  <span style="font-size:11.5px;font-weight:600;color:${action.color}">ขั้นถัดไป: ${h(action.text)}</span>
                </div>
                ${breakdownStr ? `<div style="font-size:10px;color:var(--t3);line-height:1.4;margin-top:4px;border-top:.5px dashed var(--bd);padding-top:4px">${breakdownStr}</div>` : ''}
              </div>
            `;
          }).join('')}
          </div>
        </div>
        `;
      })()}

      ${(() => {
        // ── 🚩 ดีลค้าง — ดันต่อ (จอง/รอเซ็นค้าง · รอผลนาน · รอปล่อยค้าง) ──
        // ใช้ bookingsInRange() (array เดียวกับ openBookingDetail → idx ตรง + respect ตัวกรองวัน)
        const inRange = bookingsInRange();
        const stuck = inRange.map((b, idx) => {
          const st = b.status || '';
          const sd = b.signDate && b.signDate !== '-' ? b.signDate : null;
          let reason = null, days = 0, color = 'var(--amber)';
          if (st.includes('รอเซ็น') || (st.includes('จอง') && !sd)) {
            const d = daysSinceSheetDate(b.date);
            if (d != null && d > 3) { reason = 'ค้างเซ็น'; days = d; }
          } else if (st.includes('รอผล')) {
            const d = daysSinceSheetDate(sd || b.date);
            if (d != null && d > 5) { reason = 'รอผลไฟแนนซ์นาน'; days = d; color = 'var(--red)'; }
          } else if (st.includes('รอปล่อย')) {
            const d = daysSinceSheetDate(b.resultDate || sd || b.date);
            if (d != null && d > 3) { reason = 'รอปล่อยค้าง'; days = d; }
          }
          return reason ? { b, idx, reason, days, color } : null;
        }).filter(Boolean).sort((a, b) => b.days - a.days).slice(0, 8);

        if (stuck.length === 0) return '';
        return `

          <div style="font-size:11px;color:var(--t3);margin-bottom:10px;line-height:1.5">เคสจองที่ค้างนานในแต่ละขั้น — ดันเอกสาร/ตามผลให้เดินต่อ (ดีลเกือบปิดแล้ว ไม่ใช่ลีดใหม่)</div>
          <div style="display:grid;gap:8px">

                  <div style="flex:1;min-width:0">

      ${(() => {
        // ── ${ic('lucide:filter',16)} My Pipeline Funnel — เห็นว่าเคสหายไปตรงไหน ──
        // 4 stage: รับ → ตาม (มี updateCount≥1) → จอง → ปล่อย
        // ใช้ allLeads (in range) + bookings (in range) ที่คำนวณไว้แล้ว
        const received = allLeads.filter(l => !isSkipped(l)).length;
        const called   = allLeads.filter(l => !isSkipped(l) && l.updateCount > 0).length;
        // จอง = ดีลที่จองได้จริงจาก sales_reports (ทุกสถานะที่ผ่านการจอง ยกเว้นรีเจ็ก) — ตรงกับโดนัท "สถานะดีล"
        //   (เดิมนับจาก leads admin/sales ซึ่งบางเซลล์ไม่กรอก "จอง" ในชีต lead → กล่องขึ้น 0 ทั้งที่มีจองใน sales)
        const booked   = bookings.filter(b => b.status && b.status !== 'รีเจ็ก').length;
        const released = doneCount;  // จาก bookings (status=ปล่อย)

        if (received === 0) return '';

        // % conversion
        const callRate    = received > 0 ? Math.round((called / received) * 100) : 0;
        const bookRate    = called > 0 ? Math.round((booked / called) * 100) : 0;
        const releaseRate = booked > 0 ? Math.round((released / booked) * 100) : 0;

        // ความกว้าง bar — based on received as 100%
        const widthOf = (n) => received > 0 ? Math.max(8, (n / received) * 100) : 0;

        // สี + คำแนะนำ insight สำหรับ rate ต่ำๆ
        const rateColor = (r, good, ok) => r >= good ? 'var(--green)' : r >= ok ? 'var(--amber)' : 'var(--red)';
        const insights = [];
        if (received >= 10 && callRate < 70) insights.push(`${ic('lucide:phone',16)} โทรไม่ครบ — ตามแค่ ${callRate}% ของที่รับมา`);
        if (called >= 10 && bookRate < 15)   insights.push(`${ic('lucide:refresh-cw',16)} จองยาก — ${bookRate}% จากที่ตาม (ทีมเฉลี่ย ~20%)`);
        if (booked >= 5 && releaseRate < 50) insights.push(`${ic('lucide:car-front',16)} ปิดดีลยาก — ${releaseRate}% ของจองได้ปล่อย`);

        return `
        <div class="section" style="margin-bottom:14px">

              <div style="font-size:21px;font-weight:800;color:var(--blue)">${received}</div>

            </div>
            <div style="background:var(--bg);border:.5px solid var(--bd);border-radius:10px;padding:9px 6px;text-align:center;box-shadow:var(--shadow)">
              <div style="font-size:10px;color:var(--t3);margin-bottom:3px">${ic('lucide:phone',16)} โทรตามแล้ว</div>
              <div style="font-size:21px;font-weight:800;color:var(--amber)">${called}</div>
              <div style="font-size:9.5px;color:var(--t3);margin-top:1px">${received>0?Math.round((called/received)*100):0}%</div>
            </div>
            <div style="background:var(--bg);border:.5px solid var(--bd);border-radius:10px;padding:9px 6px;text-align:center;box-shadow:var(--shadow)">
              <div style="font-size:10px;color:var(--t3);margin-bottom:3px">${ic('lucide:file-pen',16)} จอง</div>
              <div style="font-size:21px;font-weight:800;color:var(--green)">${booked}</div>
              <div style="font-size:9.5px;color:var(--t3);margin-top:1px">${received>0?Math.round((booked/received)*100):0}%</div>

              <div style="font-size:9.5px;color:var(--t3);margin-top:1px">${received>0?Math.round((released/received)*100):0}%</div>

          </div>

          ${insights.length > 0 ? `
            <div style="background:var(--amber-bg,#fff7e6);border-left:3px solid var(--amber);border-radius:6px;padding:9px 12px;font-size:11.5px;line-height:1.7;color:var(--t1)">
              <div style="font-weight:700;color:var(--amber);margin-bottom:3px">${ic('lucide:lightbulb',16)} สังเกตได้</div>
              ${insights.map(i => `<div>• ${i}</div>`).join('')}

          ` : `
            <div style="background:var(--bg2);border-radius:6px;padding:9px 12px;font-size:11px;color:var(--t2);text-align:center">
              ${received < 10 ? 'รับเคสน้อย — sample ยังเล็กไป รอข้อมูลครบก่อน' : '✅ funnel ดูสมดุล — pipeline ของคุณเคลื่อนได้ดี'}

          `}
        </div>

      })()}

      <!-- 📊 KPI cards + chip จำนวนครั้งโทร — ตัวกรอง lead list · ย้ายลงมาไว้ใกล้ list ที่มันกรอง (มิ.ย.69) -->
      <div class="kgrid" style="grid-template-columns:repeat(5,minmax(0,1fr))">
        ${KPI_DEFS.map(k => {
          const hint = k.key === 'inHand'
            ? `ติดตาม ${h_follow} · จอง ${h_booking} · ปล่อย ${h_released}`

          <div class="kpi-card ${kpiFilter===k.key?'active':''}" onclick="setKpi('${k.key}')">

          const on = kpiFilter === k.key;
          return `<button class="f-btn ${on?'on':''}" onclick="setKpi('${k.key}')" style="${on?`background:${k.color};color:#fff;border-color:${k.color};font-weight:600`:''}">${h(k.label)} <b>${kpiCounts[k.key]}</b></button>`;

        <button onclick="setViewMode('bookings')" style="flex:1;padding:9px 14px;border:none;border-radius:9px;background:${viewMode==='bookings'?'var(--blue)':'transparent'};color:${viewMode==='bookings'?'#fff':'var(--t2)'};font-size:13px;font-weight:700;cursor:pointer">เคสจอง <span style="opacity:.85;font-weight:400">(${bookings.length})</span></button>
      </div>

      ${viewMode === 'leads' ? renderLeadList(allLeads) : renderBookingSection(bookings)}
    `;

    document.getElementById('root').innerHTML = html;
    initCharts();
  }

  function renderLeadList(allLeads) {
    const def = findFilter(kpiFilter);
    const sf = STATUS_FILTERS.find(x => x.key === statusFilter) || STATUS_FILTERS[0];

    // ถ้าเลือก dropdown status (ไม่ใช่ 'all') → override kpiFilter ใช้ status test
    let filtered;
    if (sf.test) {
      filtered = allLeads.filter(sf.test);
    } else {
      filtered = allLeads.filter(def.test);
    }

    // Sort
    if (sortOrder === 'updates_desc') {
      filtered.sort((a,b) => b.updateCount - a.updateCount);
    } else if (sortOrder === 'updates_asc') {
      filtered.sort((a,b) => a.updateCount - b.updateCount);
    } else if (sortOrder === 'last_update') {
      // อัพเดทล่าสุดก่อน (lastUpdate desc); ไม่มีวันที่ → ล่างสุด
      filtered.sort((a,b) => {
        const da = sheetDateToJS(parseSheetDate(a.lastUpdate));
        const db = sheetDateToJS(parseSheetDate(b.lastUpdate));
        return (db ? db.getTime() : 0) - (da ? da.getTime() : 0);
      });
    } else {
      // default: สถานะลูกค้า (Z) สำคัญก่อน → ยังไม่โทรก่อน → โทรน้อยไปมาก
      filtered.sort((a,b) => {
        const pa = a.followPriority||0, pb = b.followPriority||0;
        if (pa !== pb) return pb - pa;     // ${ic('lucide:target',16)} สนใจมาก > ลังเล > ... ก่อน
        const sa = a.updateCount === 0 ? 100 : 0; const sb = b.updateCount === 0 ? 100 : 0;
        if (sa !== sb) return sb - sa;
        return a.updateCount - b.updateCount;
      });
    }

    const title = sf.key !== 'all' ? sf.label : def.label;
    const hintText = sf.key !== 'all' ? `เฉพาะสถานะ ${sf.label}` : (def.hint || `updateCount = ${def.label}`);

    let html = `<div class="section">
      <h2>${h(title)} <span class="count">${filtered.length} เคส · ${h(hintText)} · คลิกดูรายละเอียด</span></h2>

      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;padding:8px 10px;background:var(--bg2);border-radius:8px">
        <span style="font-size:11px;color:var(--t3);font-weight:600">สถานะ</span>
        <select id="status-filter-dd" onchange="setStatusFilter(this.value)" style="padding:5px 10px;border:.5px solid var(--bd2);border-radius:6px;background:var(--bg);color:var(--t1);font-size:12px;font-family:inherit;cursor:pointer;outline:none;max-width:160px">
          ${STATUS_FILTERS.map(s => `<option value="${s.key}" ${statusFilter===s.key?'selected':''}>${h(s.label)}</option>`).join('')}
        </select>
        <span style="width:1px;height:18px;background:var(--bd);margin:0 2px"></span>
        <span style="font-size:11px;color:var(--t3);font-weight:600">เรียง</span>
        ${SORT_OPTIONS.map(o => {
          const on = sortOrder === o.key;
          return `<button class="f-btn ${on?'on':''}" onclick="setSortOrder('${o.key}')">${h(o.label)}</button>`;
        }).join('')}
      </div>
    `;
    if (filtered.length === 0) {
      html += `<div class="empty">ไม่มีเคสในเงื่อนไขนี้</div>`;
    } else {
      filtered.slice(0, 100).forEach(l => {
        const mustCall = l.callProof !== 'ส่งแล้ว' && l.updateCount < C.UPD_TGT;
        const safeCode = (l.code||'').replace(/'/g, "\\'");
        html += `<div class="lead-row ${mustCall && kpiFilter!=='called'?'must':''}" onclick="openLeadDetail('${safeCode}')">
          <div>
            <div class="code">${h(l.code||'-')}</div>
            <div class="info">${h(l.dateIn||'-')}${l.timeIn?' '+h(l.timeIn):''}</div>
          </div>
          <div>
            <div class="phone">${h(l.phone||'-')}</div>
            <div class="info">${h(l.car||'-')}${l.channel?' · '+h(l.channel):''}${l.leadType?' · '+h(l.leadType):''}</div>
            ${l.note && l.note !== '-' ? `<div class="info" style="color:var(--t3);margin-top:2px">${h(l.note.slice(0,60))}</div>` : ''}
          </div>
          <div class="badge-col">
            ${callBadge(l)}
            ${l.salesStatus && l.salesStatus !== '-' ? `<span class="badge b-gray" title="sales_status">${h(l.salesStatus.slice(0,14))}</span>` : ''}
            ${l.adminStatus && l.adminStatus !== '-' ? `<span class="badge b-gray" style="opacity:.6" title="admin_status">${h(l.adminStatus.slice(0,12))}</span>` : ''}
          </div>
          <div>${dotsMini(l.updateCount)}</div>
        </div>`;
      });
      if (filtered.length > 100) {
        html += `<div class="empty">+ อีก ${filtered.length - 100} เคส (แสดงสูงสุด 100)</div>`;
      }
    }
    html += `</div>`;
    return html;
  }

  // ── Lead detail modal ──
  // ── คอลัม S "มากรอกชีตกันเถอะ" — แตกเป็นช่องตามจำนวนอัพเดท (Q) คั่นด้วย / ──
  function leadNoteParts(l) {
    const raw = (l.fillNote != null ? l.fillNote : (l.note || '')) || '';
    const parts = raw ? raw.split('/').map(s => s.trim()) : [];
    const n = Math.max(l.updateCount || 0, parts.length, 1);
    const out = [];
    for (let i = 0; i < n; i++) out.push(parts[i] || '');
    return out;
  }
  function noteSlotsHtml(l) {
    return leadNoteParts(l).map((v, i) => `
      <div style="display:flex;gap:7px;align-items:center;margin-bottom:5px">
        <span style="flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--bg2);color:var(--t3);font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700">${i+1}</span>
        <input class="note-slot" value="${h(v)}" placeholder="อัพเดทครั้งที่ ${i+1}…" style="flex:1;min-width:0;padding:7px 9px;border-radius:7px;border:.5px solid var(--bd2);background:var(--bg);color:var(--t1);font-size:12px">
      </div>`).join('');
  }
  // สถานะลูกค้า (คอลัม Z) → badge สีตามความสำคัญ
  function zStatusBadge(l) {
    const z = (l.customerStatus || '').trim();
    if (!z) return '';
    const p = l.followPriority || 0;
    const col = p >= 5 ? 'var(--green)' : p >= 3 ? 'var(--amber)' : p >= 1 ? 'var(--blue)' : 'var(--t3)';
    return `<span class="badge" style="background:${col};color:#fff">${ic('lucide:target',16)} ${h(z)}</span>`;
  }
  async function saveLeadNote(code) {
    const overlay = document.getElementById('lead-detail-overlay');
    if (!overlay) return;
    const inputs = overlay.querySelectorAll('.note-slot');
    const note = Array.from(inputs).map(i => i.value.trim()).join(' / ');
    const token = location.pathname.split('/').filter(Boolean)[1] || '';
    const l = (D.leads || []).find(x => x.code === code);
    let month = null;
    try { const d = parseSheetDate(l && l.dateIn); if (d) month = d.getMonth() + 1; } catch (e) {}
    const btn = document.getElementById('save-note-btn');
    const msg = document.getElementById('save-note-msg');
    const orig = btn.textContent; btn.disabled = true; btn.textContent = '⏳ บันทึกลงชีต…';
    try {
      const r = await fetch('/api/seller/update_note', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, code, note, month }),
      });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || 'save failed');
      if (l) { l.fillNote = note; l.note = note; }
      btn.textContent = '✓ บันทึกแล้ว';
      if (msg) msg.innerHTML = `<span style="color:var(--green)">✓ เขียนลงชีต ${h(d.tab||'')} ช่อง ${h(d.cell||'')}</span>`;
      setTimeout(() => { btn.disabled = false; btn.textContent = orig; }, 1500);
    } catch (e) {
      if (msg) msg.innerHTML = `<span style="color:var(--red)">✕ ${h(String(e.message || e))}</span>`;
      btn.disabled = false; btn.textContent = orig;
    }
  }

  // ── สถานะลูกค้า (คอลัม Z) — รายการ + priority (sync กับ backend) ──
  // 8 ตัวบนตามลำดับสำคัญ → 5 ตัวล่างในวงเล็บ = เคสเสีย (ไม่ต้องตาม)
  // Z_STATUSES ย้ายขึ้นไปนิยามใกล้ Z_DEAD แล้ว (ใช้ร่วมกับ STATUS_FILTERS)
  const Z_PRIORITY = {'สนใจมาก':8,'ลังเล':7,'ไม่รับสาย':6,'รอเงิน':5,'รอเช็คเครดิต':4,'ดาวน์ไม่พอ':3,'จอง':2,'ส่งมอบ':1,
                      'ได้รถแล้ว':1,'เงินสดเงินไม่พอ':3,'ลูกค้าไม่ตอบ':6};
  function zPriority(z) { if (!z) return 0; for (const k in Z_PRIORITY) if (z.includes(k)) return Z_PRIORITY[k]; return 0; }
  // ประเภทลูกค้า (คอลัม Y) — preset + เพิ่มเองได้
  const CUSTOMER_TYPE_PRESETS = ['พนักงานบริษัท','เจ้าของธุรกิจส่วนตัว','อาชีพอื่นๆ','ไม่แจ้งอาชีพ','ข้าราชการ/รัฐวิสาหกิจ','เกษตกร/ปศุสัตว์','ไม่มีอาชีพ','ค้าขาย','Rider/driver','ฟรีแลนด์'];
  function customerTypeOptions(cur) {
    const seen = (D.leads || []).map(x => (x.customerType || '').trim()).filter(Boolean);
    const all = [...new Set([...CUSTOMER_TYPE_PRESETS, ...seen, (cur || '').trim()].filter(Boolean))];
    return all;
  }
  // เลือก dropdown ที่มี option "เพิ่มเอง" → prompt แล้วเขียน
  async function onSelectField(code, field, sel) {
    let v = sel.value;
    if (v === '__add__') {
      v = (prompt('เพิ่มประเภทลูกค้าใหม่:') || '').trim();
      if (!v) { sel.value = ''; return; }
    }
    await saveLeadField(code, field, v, sel);
  }
  // text field: เขียนเมื่อ blur (ถ้าค่าเปลี่ยน)
  async function onBlurField(code, field, inp) {
    const v = inp.value.trim();
    if (v === (inp.dataset.orig || '')) return;
    await saveLeadField(code, field, v, inp);
    inp.dataset.orig = v;
  }

  // เขียนค่ากลับชีต 1 ช่อง (field = customer_status / call_proof / fill_sheet_note)
  async function saveLeadField(code, field, value, el) {
    const token = location.pathname.split('/').filter(Boolean)[1] || '';
    const l = (D.leads || []).find(x => x.code === code);
    let month = null;
    try { const d = parseSheetDate(l && l.dateIn); if (d) month = d.getMonth() + 1; } catch (e) {}
    const msg = document.getElementById('field-save-msg');
    if (el) el.disabled = true;
    if (msg) msg.innerHTML = '<span style="color:var(--t3)">⏳ บันทึกลงชีต…</span>';
    try {
      const r = await fetch('/api/seller/update_note', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, code, field, value, month }),
      });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || 'fail');
      if (l) {
        const PROP = { customer_status:'customerStatus', call_proof:'callProof', customer_profile:'profile',
          occupation:'occupation', income:'income', job_tenure:'jobTenure', payment_history:'paymentHistory',
          customer_type:'customerType', fill_sheet_note:'fillNote' };
        if (PROP[field]) l[PROP[field]] = value;
        if (field === 'customer_status') l.followPriority = zPriority(value);
        if (field === 'fill_sheet_note') l.note = value;
      }
      const FNAME = { customer_status:'สถานะลูกค้า', call_proof:'หลักฐานโทร', customer_profile:'โปรไฟล์',
        occupation:'อาชีพ', income:'รายได้', job_tenure:'อายุงาน', payment_history:'ประวัติผ่อน',
        customer_type:'ประเภทลูกค้า', fill_sheet_note:'โน้ต' };
      const fname = FNAME[field] || 'ข้อมูล';
      if (msg) msg.innerHTML = `<span style="color:var(--green)">✓ บันทึก ${fname} ลงชีต ${h(d.tab||'')} ${h(d.cell||'')}</span>`;
    } catch (e) {
      if (msg) msg.innerHTML = `<span style="color:var(--red)">✕ ${h(String(e.message || e))}</span>`;
    } finally { if (el) el.disabled = false; }
  }
  function openLeadDetail(code) {
    const l = (D.leads || []).find(x => x.code === code);
    if (!l) return;
    const safeCode = (l.code || '').replace(/'/g, '');
    const old = document.getElementById('lead-detail-overlay');
    if (old) old.remove();

    const overlay = document.createElement('div');
    overlay.id = 'lead-detail-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

    // helper: row หนึ่งของ field
    const row = (label, value, opts={}) => {
      if (!value || value === '-') return '';
      const styleVal = opts.mono ? 'font-family:monospace;' : '';
      const wrap = opts.wrap ? 'white-space:pre-wrap;word-break:break-word;' : '';
      return `<div style="display:grid;grid-template-columns:110px 1fr;gap:10px;padding:7px 0;border-bottom:.5px solid var(--bd)">
        <div style="font-size:11px;color:var(--t3);font-weight:600">${h(label)}</div>
        <div style="font-size:12px;color:var(--t1);${styleVal}${wrap}">${h(value)}</div>
      </div>`;
    };

    // text field ที่กรอกแล้วเขียนลงชีต (blur)
    const editTextRow = (label, field, value) => `
      <div style="display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:.5px solid var(--bd)">
        <div style="font-size:11px;color:var(--t3);font-weight:600">${h(label)}</div>
        <input value="${h(value||'')}" data-orig="${h(value||'')}" onblur="onBlurField('${safeCode}','${field}',this)" placeholder="—" style="padding:7px 9px;border-radius:7px;border:.5px solid var(--bd2);background:var(--bg);color:var(--t1);font-size:12px;font-family:inherit;min-width:0">
      </div>`;

    const mustCall = l.callProof !== 'ส่งแล้ว' && l.updateCount < C.UPD_TGT;

    const phoneClean = (l.phone||'').replace(/[^0-9+]/g, '');
    const callLink = phoneClean ? `<a href="tel:${phoneClean}" style="background:var(--green);color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none">โทร ${h(l.phone)}</a>` : '';

    overlay.innerHTML = `
      <div style="background:var(--bg);border-radius:14px;max-width:560px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden" onclick="event.stopPropagation()">

    order.forEach(s => statusCounts[s] = 0);

  // ── Booking detail modal ──
  // แปลงวันที่: ชีต d/m/yyyy ↔ input type=date (YYYY-MM-DD)
  function _toISODate(s) {
    const p = String(s||'').trim().split('/');
    if (p.length < 2) return '';
    let d = parseInt(p[0]), m = parseInt(p[1]);
    let y = p.length >= 3 ? parseInt(p[2]) : (new Date()).getFullYear();
    if (!d || !m || !y) return '';
    if (y < 100) y += (y > 50 ? 2500 : 2000);
    if (y > 2500) y -= 543;
    if (y < 2020 || y > 2035) return '';
    return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  function _fromISODate(s) {
    const p = String(s||'').trim().split('-');
    if (p.length < 3) return '';
    const y = parseInt(p[0]), m = parseInt(p[1]), d = parseInt(p[2]);
    if (!y || !m || !d) return '';
    return `${d}/${m}/${y}`;
  }
