{% load static %}<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>งานจัดซื้อ · Oxlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'dashboard/css/globals.css' %}?v=20260930a">
<style>
  body{font-family:'Noto Sans Thai',sans-serif;background:var(--bg2);color:var(--t1);margin:0}
  .wrap{max-width:820px;margin:0 auto;padding:14px 14px 44px}
  .card{background:var(--bg);border:.5px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .card-title{font-size:var(--fs-h);font-weight:800;margin-bottom:4px}
  .kpi{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .kpi>div{flex:1;min-width:100px;background:var(--bg);border:.5px solid var(--bd);
           border-radius:12px;padding:12px 14px}
  .kpi b{display:block;font-size:30px;line-height:1.15;font-weight:800}
  .mut{color:var(--t3);font-size:var(--fs-body)}
  .sub{color:var(--t2);font-size:var(--fs-body)}
  .row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:.5px solid var(--bd)}
  .num{flex:0 0 26px;height:26px;border-radius:7px;background:var(--bg2);color:var(--t2);
       display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--fs-body)}
  .pill{display:inline-block;padding:1px 8px;border-radius:6px;font-size:var(--fs-body);font-weight:700}
  .tel{color:var(--blue);font-weight:700;text-decoration:none}
  .btn{display:inline-block;padding:7px 14px;border-radius:7px;border:.5px solid var(--bd);
       background:var(--bg2);color:var(--t1);font:inherit;font-size:var(--fs-body);font-weight:700;cursor:pointer}
  .hdr{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg);
       border-bottom:.5px solid var(--bd);position:sticky;top:0;z-index:5}
  .hdr img{height:24px}
</style>
</head>
<body>
<div class="hdr">
  <img src="{% static 'dashboard/image/logo.png' %}" alt="" onerror="this.remove()">
  <div style="font-weight:800">งานจัดซื้อ</div>
  <div class="sub" id="who" style="margin-left:auto"></div>
  <a href="/logout/" class="mut" style="text-decoration:none">ออก</a>
</div>

<div class="wrap" id="root">
  {% if error %}<div class="card" style="color:var(--red);font-weight:700">{{ error }}</div>{% endif %}
</div>

<script>
const DATA = {{ data_json|safe }};
const SHOW_FIRST = 10;          // เหลือซ่อนไว้หลังปุ่ม — 100+ แถวรวดเดียวหาของไม่เจอ
let _all = false;

const h = s => s === null || s === undefined ? '' :
  String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = n => (Number(n) || 0).toLocaleString('th-TH');

//  อันดับ "ขาดหนัก" ของแต่ละรุ่น — gap เรียงมาจากเซิร์ฟเวอร์แล้ว (ขาดมากสุดก่อน)
const gapRank = {};
(DATA && DATA.gap || []).forEach((g, i) => { gapRank[g.key] = i + 1; });

//  "พร้อมขาย 0" ต้องมีคำกำกับ ไม่งั้นอ่านเป็น "ไม่มีรถรุ่นนี้เลย"
//  (เจ้าของทักเรื่องนี้เองตอนเห็น Civic FE = 0 ทั้งที่มี 4 คันติดจอง/ซ่อม)
function notReady(g) {
  const n = (g.total || 0) - (g.show || 0);
  return n > 0 ? ` (มีอีก ${num(n)} คัน ยังไม่พร้อมขาย)` : '';
}

function caseRow(c, i) {
  const pills = [];
  if (!c.talked) pills.push(`<span class="pill" style="background:#fee2e2;color:#b91c1c">ยังไม่ได้โทร</span>`);
  const rank = c.gap ? gapRank[c.gap.key] : 0;
  if (rank && rank <= (DATA.topGap || 5))
    pills.push(`<span class="pill" style="background:#fef3c7;color:#b45309">ขาดหนัก อันดับ ${rank}</span>`);

  const tel = c.phone
    ? `<a class="tel" href="tel:${h(String(c.phone).replace(/[^0-9+]/g, ''))}">${h(c.phone)}</a>`
    : '<span class="mut">ไม่มีเบอร์</span>';
  const who = [h(c.name) || '(ไม่มีชื่อ)', tel].join(' · ');
  const gapLine = c.gap
    ? `<div class="mut">${h(c.gap.name)} — ตลาดถามหา ${num(c.gap.demand)} ครั้ง · เรามีพร้อมขาย ${num(c.gap.show)} คัน${notReady(c.gap)}${
        c.gap.recent ? ` · เพิ่งรับเข้า ${num(c.gap.recent)}` : ''}</div>` : '';

  return `<div class="row">
    <div class="num">${i + 1}</div>
    <div style="flex:1;min-width:0">
      <div style="font-weight:700">${h(c.car) || '(ไม่ระบุรุ่น)'}</div>
      <div class="sub">${who}${c.code ? ' · ' + h(c.code) : ''}</div>
      ${gapLine}
      ${pills.length ? `<div style="margin-top:5px;display:flex;gap:6px;flex-wrap:wrap">${pills.join('')}</div>` : ''}
    </div>
    <div class="mut" style="white-space:nowrap">ค้าง ${num(c.age)} วัน</div>
  </div>`;
}

function gapRow(g, i) {
  return `<div class="row">
    <div class="num">${i + 1}</div>
    <div style="flex:1;min-width:0">
      <div style="font-weight:700">${h(g.name)}</div>
      <div class="mut">ตลาดถามหา ${num(g.demand)} ครั้ง · พร้อมขาย ${num(g.show)} คัน${notReady(g)}${
        g.recent ? ` · เพิ่งรับเข้า ${num(g.recent)}` : ''}</div>
    </div>
  </div>`;
}

function render() {
  const root = document.getElementById('root');
  if (!DATA) return;                       // มี error — Django render ไว้ให้แล้ว
  document.getElementById('who').textContent = DATA.owner || '';

  const kpi = [
    ['ต้องตามทั้งหมด', DATA.total, 'var(--t1)'],
    ['ยังไม่ได้โทร', DATA.notCalled, DATA.notCalled ? '#b91c1c' : '#15803d'],
    [`ค้างเกิน ${num(DATA.staleDays)} วัน`, DATA.stale, DATA.stale ? '#b45309' : 'var(--t3)'],
  ].map(x => `<div><div class="mut">${x[0]}</div><b style="color:${x[2]}">${num(x[1])}</b></div>`).join('');

  const cases = DATA.cases || [];
  const shown = _all ? cases : cases.slice(0, SHOW_FIRST);
  const more = cases.length - shown.length;

  const gap = (DATA.gap || []).slice(0, 8);
  const uncounted = (DATA.stockInfo || {}).uncounted || 0;

  root.innerHTML = `
    <div class="kpi">${kpi}</div>

    <div class="card">
      <div class="card-title">ตามงานก่อน — เรียงให้แล้วว่าควรโทรใครก่อน</div>
      <div class="mut" style="margin-bottom:8px">
        ยังไม่ได้โทรขึ้นก่อนเสมอ · แล้วค่อยรุ่นที่ขาดตลาด · แล้วค่อยเคสที่ค้างนาน
        · เคสย้อนหลัง ${num(DATA.days)} วัน
      </div>
      ${shown.map(caseRow).join('') || '<div class="mut" style="padding:14px 0">ไม่มีเคสค้าง — ตามครบแล้ว</div>'}
      ${more > 0 ? `<div style="padding-top:12px"><button class="btn" onclick="_all=true;render()">
        ดูอีก ${num(more)} เคส</button></div>` : ''}
    </div>

    <div class="card">
      <div class="card-title">รถที่ขาดตลาด — ควรหารุ่นนี้</div>
      <div class="mut" style="margin-bottom:8px">
        คิดจาก "ลูกค้าถามหากี่ครั้ง (${num(DATA.demandMonths)} เดือนล่าสุด)" เทียบกับ
        "มีพร้อมขายกี่คัน" — นับรถที่จัดซื้อเพิ่งหามาได้แล้วด้วย
      </div>
      ${gap.map(gapRow).join('') || '<div class="mut" style="padding:14px 0">ยังไม่มีข้อมูล</div>'}
      ${uncounted ? `<div class="mut" style="padding-top:10px">
        พร้อมขายอีก ${num(uncounted)} คันเป็นรุ่นที่ตลาดไม่ได้ถามหา ไม่ได้นับในตารางนี้</div>` : ''}
    </div>

    <div class="mut" style="text-align:center;padding:4px 0">
      เคสมาจากชีตจัดซื้อ · กรอก "รับซื้อ / ไม่รับซื้อ" เมื่อไหร่ เคสจะหลุดจากรายการนี้เอง
    </div>`;
}
render();
</script>
{% if APP_VERSION %}<div style="position:fixed;bottom:6px;right:10px;font-size:var(--fs-body);color:#94a3b8;opacity:.75;z-index:9999;pointer-events:none">{{ APP_VERSION }}</div>{% endif %}
</body>
</html>
