    // ── Seller Bookings modal — แสดงรายการ booking (จอง/ปล่อย/...) ของเซลล์รายคน ──
    function openSellerBookingsModal(sellerName, statusFilter, noteText) {
      const old = document.getElementById('seller-bookings-overlay');
      if (old) old.remove();

      const periodLbl = dfMonth > 0 ? `เดือน${C.MONTHS_FULL[dfMonth-1]}` : (dfMonth===-1 ? 'วันนี้' : 'ทั้งปี');
      // Filter bookings ของเซลล์ตาม period (ปล่อย ใช้ releaseDate, อื่นๆ ใช้ b.date)
      const allBookings = (D.bookingCases || []).filter(b => {
        if (b.seller !== sellerName) return false;
        if (statusFilter !== 'all' && b.status !== statusFilter) return false;
        if (dfMonth > 0) {
          const useDate = (b.status === 'ปล่อย' ? (b.releaseDate || b.date) : b.date) || '';
          const p = String(useDate).split('/');
          if (p.length < 2 || parseInt(p[1]) !== dfMonth) return false;
        } else if (dfMonth === -1) {
          const useDate = (b.status === 'ปล่อย' ? (b.releaseDate || b.date) : b.date) || '';
          const p = String(useDate).split('/');
          if (p.length < 2) return false;
          const now = new Date();
          if (parseInt(p[0]) !== now.getDate() || parseInt(p[1]) !== (now.getMonth()+1)) return false;
        }
        return true;
      });
      // sort: status order แล้ว date ใหม่ก่อน
      const statusOrd = {"จอง":1,"รอเซ็นต์":2,"รอผล":3,"รอปล่อย":4,"ปล่อย":5,"รีเจ็ก":6};
      allBookings.sort((a,b) => {
        const sa = statusOrd[a.status]||9, sb = statusOrd[b.status]||9;
        if (sa !== sb) return sa - sb;
        return (b.date||'').localeCompare(a.date||'');
      });

      const totalDealValue = allBookings.filter(b => b.status === 'ปล่อย').reduce((a,b) => a + (Number(b.price)||0), 0);

      const overlay = document.createElement('div');
      overlay.id = 'seller-bookings-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

      const statusEmoji = {"จอง":"🟡","รอเซ็นต์":"🔵","รอผล":"🟠","รอปล่อย":"🟣","ปล่อย":"🏁","รีเจ็ก":"❌","all":"📋"};
      const titleEmoji = statusEmoji[statusFilter] || '📋';
      const titleStatus = statusFilter === 'all' ? 'ทุกสถานะ' : statusFilter;

      let inner = `<div style="background:var(--bg);border-radius:14px;max-width:820px;width:100%;max-height:85vh;overflow-y:auto;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.35)">`;
      inner += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap">`;
      inner += `<div><div style="font-size:11px;color:var(--t3)">${h(periodLbl)}</div><div style="font-size:18px;font-weight:800">${titleEmoji} ${h(sellerName)} — ${h(titleStatus)} ${allBookings.length} เคส</div></div>`;
      inner += `<button onclick="document.getElementById('seller-bookings-overlay').remove()" style="background:var(--bg2);border:.5px solid var(--bd2);color:var(--t2);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px">✕ ปิด</button>`;
      inner += `</div>`;

      // Summary: ยอดเงินรวม + breakdown by status
      if (totalDealValue > 0) {
        inner += `<div style="padding:10px;background:var(--green-bg);border-radius:8px;margin-bottom:12px;text-align:center"><div style="font-size:10px;color:var(--t3)">💰 ยอดรวม (ปล่อย)</div><div style="font-size:22px;font-weight:800;color:var(--green-mid)">${fmtBaht(totalDealValue)}</div></div>`;
      }
      if (statusFilter === 'all' && allBookings.length > 0) {
        const stCounts = {};
        allBookings.forEach(b => { stCounts[b.status] = (stCounts[b.status]||0) + 1; });
        inner += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">`;
        Object.entries(stCounts).forEach(([st,n]) => {
          const c = (C.STATUS_COLOR||{})[st] || '#888';
          inner += `<span style="background:${c}22;color:${c};padding:4px 10px;border-radius:14px;font-size:11px;font-weight:600">${h(st)}: ${n}</span>`;
        });
        inner += `</div>`;
      }

      // ตาราง bookings
      if (allBookings.length > 0) {
        inner += `<div style="border:.5px solid var(--bd);border-radius:8px;max-height:420px;overflow-y:auto">`;
        inner += `<div style="display:grid;grid-template-columns:.7fr 1.1fr 1.4fr .6fr .8fr .8fr;gap:6px;padding:7px 10px;font-size:10px;color:var(--t3);font-weight:600;background:var(--bg2);border-bottom:.5px solid var(--bd);position:sticky;top:0"><span>สถานะ</span><span>ลูกค้า</span><span>รถ</span><span>เบอร์</span><span>วันที่</span><span style="text-align:right">ราคา</span></div>`;
        allBookings.forEach(b => {
          const stCol = (C.STATUS_COLOR||{})[b.status] || '#888';
          const dateShow = b.status === 'ปล่อย' ? (b.releaseDate || b.date) : b.date;
          inner += `<div style="display:grid;grid-template-columns:.7fr 1.1fr 1.4fr .6fr .8fr .8fr;gap:6px;padding:8px 10px;font-size:11px;border-bottom:.5px solid var(--bd);align-items:center">`;
          inner += `<span style="background:${stCol}22;color:${stCol};padding:2px 8px;border-radius:10px;font-weight:600;text-align:center;font-size:10px">${h(b.status)}${b.isCash?' 💵':''}</span>`;
          inner += `<span style="color:var(--t1);font-weight:500">${h((b.customer||'').slice(0,20))}</span>`;
          inner += `<span style="color:var(--t2)">${h((b.car||'').slice(0,30))}</span>`;
          inner += `<span style="color:var(--blue);font-family:monospace;font-size:10px">${h(b.phone||'-')}</span>`;
          inner += `<span style="font-family:monospace;color:var(--t3);font-size:10px">${h(dateShow||'-')}</span>`;
          inner += `<span style="text-align:right;color:var(--green-mid);font-weight:600">${b.price>0?fmtBaht(b.price):'-'}</span>`;
          inner += `</div>`;
        });
        inner += `</div>`;
      } else {
        const emptyMsg = noteText || `ยังไม่มีเคส "${titleStatus}" ใน${periodLbl}`;
        inner += `<div style="padding:24px;text-align:center;color:var(--t3);font-size:13px">${h(emptyMsg)}</div>`;
      }

      inner += `<div style="font-size:10px;color:var(--t3);margin-top:10px;line-height:1.5">💡 รายการจาก sales_reports (รายงานฝ่ายขาย) · กรอง: ${h(titleStatus)} · period: ${h(periodLbl)}</div>`;
      inner += `</div>`;
      overlay.innerHTML = inner;
      document.body.appendChild(overlay);
    }

    // ── Follow cases section ──
    function renderFollowCasesSection() {
      let cases = (FD.followCases||[]).filter(l=>ir(l.dateIn));
      if(followFilter==='notcalled') cases=cases.filter(l=>l.updateCount===0);
      else if(followFilter==='hot') cases=cases.filter(l=>l.updateCount>=3);
      if(followFilter==='recent') cases.sort((a,b)=>{const pa=a.lastUpdate&&a.lastUpdate!=='-';const pb=b.lastUpdate&&b.lastUpdate!=='-';if(!pa&&!pb)return 0;if(!pa)return 1;if(!pb)return -1;return new Date(b.lastUpdate)-new Date(a.lastUpdate);});
      else cases.sort((a,b)=>urg(b)-urg(a));

      let html = `<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px">`;
      html += `<div class="card-title" style="margin:0">📞 เคสติดตาม <span style="font-size:11px;font-weight:400;color:var(--t3)">(${cases.length} เคส)</span></div>`;
      html += `<select onchange="followFilter=this.value;render()"><option value="urgent" ${followFilter==='urgent'?'selected':''}>เร่งด่วนก่อน</option><option value="notcalled" ${followFilter==='notcalled'?'selected':''}>ยังไม่โทร</option><option value="hot" ${followFilter==='hot'?'selected':''}>ติดตาม 3+x</option><option value="recent" ${followFilter==='recent'?'selected':''}>อัพเดทล่าสุด</option></select></div>`;
      html += `<div class="lfhdr"><span>Code · เซลล์</span><span>หมายเหตุ / รถ</span><span style="text-align:right">อัพ</span></div>`;
      html += `<div style="max-height:480px;overflow-y:auto">`;
      if(cases.length===0) html += `<div style="text-align:center;color:var(--t3);padding:18px;font-size:12px">ไม่มีเคสติดตาม</div>`;
      cases.slice(0,50).forEach(l=>{
        const cls = l.updateCount===0?'lfrow hr':nc(l.updateCount)>=2?'lfrow ha':l.updateCount>=3?'lfrow hb':'lfrow';
        const carHas = !nocar(l.car);

        html += `<div><div style="font-weight:700;font-size:11px;color:var(--blue)">${h(l.code)}</div><div style="font-size:10px;color:var(--t2);margin-top:1px">${h(l.seller)}</div><div style="font-size:10px;color:var(--t3)">${l.lastUpdate&&l.lastUpdate!=='-'?h(l.lastUpdate):'ยังไม่อัพเดท'}</div></div>`;
        html += `<div><div style="font-size:11px;color:var(--t2);line-height:1.5">${h((l.note||'-').slice(0,80))}</div>`;
        if(carHas) html += `<div style="font-size:10px;color:var(--t3);margin-top:2px">🚗 ${h(l.car)}</div>`;
        html += `<div style="margin-top:3px">${urgBadge(l)}</div></div>`;
        html += `<div>${dotsHtml(l.updateCount)}</div></div>`;
      });
      html += `</div></div>`;
      return html;

    // ── ACTIVITY TAB ──
    function renderActivity(sellers) {
      const la = D.liveActivity || {totalInbox:0,totalLead:0,totalSessions:0,byHost:{},sessions:[]};
      const totLive = sellers.reduce((a,s)=>a+s.live,0);
      const totClip = sellers.reduce((a,s)=>a+s.clip,0);

      let html = `<div class="g3">`;
      [{l:"ไลฟ์รวม",v:totLive+" ครั้ง",s:la.totalSessions+" session",c:"var(--blue)"},
       {l:"Inbox รวม",v:String(la.totalInbox),s:la.totalLead+" lead จากไลฟ์",c:"var(--green)"},
       {l:"คลิปรวม",v:totClip+" คลิป",s:sellers.filter(s=>s.clip>=s.clipTarget).length+" คน ถึงเป้า",c:"var(--purple-mid)"}
      ].forEach(k=>{
        html += `<div class="card" style="margin:0;text-align:center"><div class="kl">${k.l}</div><div class="kv" style="color:${k.c}">${k.v}</div><div class="ks">${k.s}</div></div>`;
      });
      html += `</div>`;

      // 2-col: live + clips
      html += `<div class="g2">`;
      // Live
      html += `<div class="card" style="margin:0"><div class="card-title">📡 ไลฟ์สด</div>`;
      html += `<div class="act-hdr"><span>เซลล์</span><span>จำนวนครั้ง</span><span style="text-align:right">inbox</span></div>`;
      [...sellers].sort((a,b)=>b.live-a.live).forEach(s=>{
        const inbox = la.byHost[s.name]?.inbox||0;
        html += `<div class="act-row" onclick="switchToSeller('${h(s.name)}')"><span style="font-weight:500">${h(s.name)}</span><span style="font-size:12px;font-weight:600;color:var(--blue)">${s.live} ครั้ง</span><span style="text-align:right;font-size:11px;color:var(--t3)">📥${inbox}</span></div>`;
      });
      html += `</div>`;
      // Clips
      html += `<div class="card" style="margin:0"><div class="card-title">🎬 คลิป TikTok</div>`;
      html += `<div class="act-hdr"><span>เซลล์</span><span>คลิป/เป้า</span><span style="text-align:right">สถานะ</span></div>`;
      [...sellers].sort((a,b)=>(b.clip/Math.max(b.clipTarget,1))-(a.clip/Math.max(a.clipTarget,1))).forEach(s=>{
        const ok=s.clip>=(s.clipTarget||1); const p=s.clipTarget>0?Math.min((s.clip/s.clipTarget)*100,100):0;
        html += `<div class="act-row" onclick="switchToSeller('${h(s.name)}')"><span style="font-weight:500">${h(s.name)}</span><div style="display:flex;align-items:center;gap:5px"><div style="flex:1;height:5px;border-radius:3px;background:var(--bg3);overflow:hidden"><div style="height:100%;border-radius:3px;width:${p}%;background:${ok?'var(--green-mid)':'var(--purple-mid)'}"></div></div><span style="font-size:10px;color:${ok?'var(--green)':'var(--amber)'}">${s.clip}/${s.clipTarget}</span></div><span style="text-align:right;font-size:11px">${ok?'✅':'⚠️ ขาด '+((s.clipTarget||4)-s.clip)}</span></div>`;
      });
      html += `</div></div>`;

      // Sessions list
      let sessions = [...(la.sessions||[])];
      if(liveMonth>0) sessions=sessions.filter(s=>{const p=(s.date||'').split('/');return p.length>=2&&parseInt(p[1])===liveMonth;});
      if(liveTeam!=='all') sessions=sessions.filter(s=>s.team===liveTeam);
      sessions.sort((a,b)=>String(b.date)>String(a.date)?1:-1);
      const liveTeams = [...new Set((la.sessions||[]).map(s=>s.team).filter(Boolean))].sort();

      html += `<div class="card" style="margin-top:0"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px">`;
      html += `<div class="card-title" style="margin:0">📺 ไลฟ์รายครั้ง <span style="font-size:11px;font-weight:400;color:var(--t3)">${liveMonth>0?C.MONTHS_SHORT[liveMonth-1]:'ทั้งปี'}${liveTeam!=='all'?' · ทีม '+liveTeam:''} (${sessions.length})</span></div>`;
      html += `<div style="display:flex;gap:6px;align-items:center">`;
      html += `<select onchange="liveMonth=Number(this.value);render()" style="font-size:11px"><option value="0">ทุกเดือน</option>`;
      C.MONTHS_SHORT.forEach((m,i)=>{html+=`<option value="${i+1}" ${liveMonth===i+1?'selected':''}>${m}</option>`;});
      html += `</select>`;
      html += `<select onchange="liveTeam=this.value;render()" style="font-size:11px"><option value="all">ทุกทีม</option>`;
      liveTeams.forEach(t=>{html+=`<option value="${h(t)}" ${liveTeam===t?'selected':''}>${h(t)}</option>`;});
      html += `</select></div></div>`;
      if(sessions.length===0) html += `<div style="padding:12px;text-align:center;color:var(--t3);font-size:12px">ไม่มีข้อมูลไลฟ์</div>`;
      sessions.slice(0,30).forEach(s=>{
        html += `<div style="display:grid;grid-template-columns:72px auto 1fr 1fr 60px;gap:6px;align-items:center;padding:7px 0;border-bottom:.5px solid var(--bd);font-size:11px">`;
        html += `<span style="color:var(--t3)">${h(s.date)}${s.time?' '+h(s.time):''}</span>`;
        html += `<span style="font-size:9px;padding:1px 5px;border-radius:8px;background:var(--bg3);color:var(--t3)">${h(s.team||'-')}</span>`;
        html += `<span style="font-weight:500">${h(s.hosts.join(', '))}</span>`;
        html += `<span style="color:var(--t2)">${h(s.topic||'—')}</span>`;
        html += `<span style="text-align:right;color:var(--t2)">📥${s.inbox} 🎯${s.lead}</span></div>`;
      });
      if(sessions.length>30) html += `<div style="text-align:center;padding:8px;font-size:11px;color:var(--t3)">แสดง 30 จาก ${sessions.length} รายการ</div>`;
      html += `</div>`;
      return html;
    }

    // ── BOOKING TAB ──
    function renderBookings(sellerNames) {
      let bk = [...(FD.bookingCases||[])];
      if(bkSel!=='all') bk=bk.filter(b=>b.seller===bkSel);
      if(bkStatus!=='all') bk=bk.filter(b=>b.status===bkStatus);
      bk=bk.filter(b=>ir(b.date));
      bk.sort((a,b)=>{const ai=C.STATUS_ORDER.indexOf(a.status);const bi=C.STATUS_ORDER.indexOf(b.status);return(ai===-1?99:ai)-(bi===-1?99:bi);});

      let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px">`;
      html += `<div style="font-size:13px;font-weight:600">Pipeline จอง</div>`;
      html += `<div style="display:flex;gap:6px;align-items:center">`;
      html += `<select onchange="bkSel=this.value;render()"><option value="all">ทุกเซลล์</option>`;
      sellerNames.forEach(n=>{html+=`<option value="${h(n)}" ${bkSel===n?'selected':''}>${h(n)}</option>`;});
      html += `</select>`;
      html += `<select onchange="bkStatus=this.value;render()"><option value="all">ทุกสถานะ</option>`;
      C.STATUS_ORDER.forEach(s=>{html+=`<option value="${h(s)}" ${bkStatus===s?'selected':''}>${h(s)}</option>`;});
      html += `</select></div></div>`;

      if(bk.length===0) html += `<div style="text-align:center;padding:24px;color:var(--t3);font-size:13px">ไม่มีเคสในระบบ</div>`;
      bk.forEach(b=>{
        const color = C.STATUS_COLOR[b.status]||'#6b7280';
        let keyDate='',keyLabel='',needDate=false;
        if(b.status==='รอเซ็นต์'){keyLabel='นัดเซ็น';keyDate=b.signDate;needDate=empty(b.signDate);}
        else if(b.status==='รอผล'){keyLabel='ผลออก';keyDate=b.resultDate;needDate=empty(b.resultDate);}
        else if(b.status==='รอปล่อย'){keyLabel='ปล่อยรถ';keyDate=b.releaseDate;needDate=empty(b.releaseDate);}
        else if(b.status==='ปล่อย'){keyLabel='ปล่อยแล้ว';keyDate=b.releaseDate;}
        else if(b.status==='จอง'){keyLabel='วันจอง';keyDate=b.date;}
        html += `<div class="booking-card">`;
        html += `<div class="booking-head" style="background:linear-gradient(135deg,${color} 0%,${color}cc 100%)">`;
        html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><span style="font-size:11px;color:#fff;font-weight:700;background:rgba(0,0,0,.2);padding:2px 8px;border-radius:20px">${h(b.status)}</span><span style="font-size:11px;color:#fff;opacity:.9">${h(b.seller)}${b.isCash?' · 💵 ซื้อสด':''}</span></div>`;
        html += `<div style="font-size:13px;color:#fff;font-weight:600;margin-bottom:2px">${h(b.customer)}</div>`;
        html += `<div style="font-size:11px;color:rgba(255,255,255,.8)">${h(b.car)}${b.plate&&b.plate!=='-'?' · '+h(b.plate):''}</div></div>`;
        html += `<div class="booking-body">`;
        if(keyLabel) html += `<div class="brow"><span class="blbl">📅 ${keyLabel}</span><span class="bval" style="color:${needDate?'var(--red)':'var(--t1)'};font-weight:${needDate?600:400}">${needDate?'⚠️ ยังไม่ได้ใส่!':h(keyDate||'-')}</span></div>`;
        if(b.phone&&!empty(b.phone)) html += `<div class="brow"><span class="blbl">📞 เบอร์</span><span class="bval" style="color:var(--blue)">${h(b.phone)}</span></div>`;
        if(b.price>0) html += `<div class="brow"><span class="blbl">💰 ราคา</span><span class="bval" style="color:var(--t1);font-weight:500">${fmtPrice(b.price)}</span></div>`;
        html += `<div class="brow"><span class="blbl">💳 มัดจำ</span><span class="bval" style="color:var(--green);font-weight:600">${fmtPrice(b.deposit)}</span></div>`;
        if(b.finance&&!empty(b.finance)) html += `<div class="brow"><span class="blbl">🏦 ไฟแนนซ์</span><span class="bval">${h(b.finance)}${b.grade&&!empty(b.grade)?' · เกรด '+h(b.grade):''}${b.year&&!empty(b.year)?' · ปี '+h(b.year):''}</span></div>`;
        if(b.leadCode&&!empty(b.leadCode)) html += `<div class="brow"><span class="blbl">🔖 Lead Code</span><span class="bval" style="color:var(--blue);cursor:pointer" onclick="event.stopPropagation();openCaseFromOverview('${h(b.leadCode)}','${h(b.seller)}')">${h(b.leadCode)} →</span></div>`;
        if(b.note&&!empty(b.note)) html += `<div class="brow"><span class="blbl">📝 หมายเหตุ</span><span class="bval" style="color:var(--t2)">${h(b.note)}</span></div>`;
        html += `</div></div>`;
      });
      return html;
    }

    // ── SELLER TAB ──
    function renderSeller(sellers, sellerNames, dilMap) {
      const effectiveCurS = curS || (sellers[0]?.name??'');
      if(!curS && effectiveCurS) curS = effectiveCurS;
      const sdYear = sellers.find(s=>s.name===effectiveCurS) || {};
      // ถ้ามี filter เดือน → ใช้ค่ารายเดือนจาก monthlySummary (overlay บน sdYear เพื่อคง target/team)
      const sdMonth = (dfMonth > 0 && D.monthlySummary?.[dfMonth]?.sellers?.[effectiveCurS]) || null;
      const sd = sdMonth ? {...sdYear, ...sdMonth} : sdYear;
      const isAdminTeam = sdYear.team==='ADMIN';
      const cases = (FD.followCases||[]).filter(l=>l.seller===effectiveCurS && ir(l.dateIn));
      const noU = cases.filter(l=>l.updateCount===0).length;
      const hot = cases.filter(l=>l.updateCount>=3).length;
      const totU = cases.reduce((a,l)=>a+l.updateCount,0);
      const bkCount = (FD.bookingCases||[]).filter(b=>b.seller===effectiveCurS).length;

      // Case detail
      if(showCase) {
        const l = (D.followCases||[]).find(c=>c.code===showCase);
        if(l) return renderCaseDetail(l);
      }

      let html = '';

      // Header
      html += `<div style="display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap">`;
      html += `<button class="bbtn" onclick="switchTab('o')">← กลับ</button>`;
      html += `<div class="av">${effectiveCurS.charAt(0)}</div>`;
      const sellerPeriodLbl = dfMonth>0 ? `${C.MONTHS_FULL[dfMonth-1]}` : (dfMonth===-1 ? 'วันนี้' : 'ทั้งปี');
      html += `<div style="flex:1"><div style="font-size:15px;font-weight:700">${h(effectiveCurS)} <span style="font-size:11px;color:var(--t3);font-weight:500">· ${sellerPeriodLbl}</span></div><div style="font-size:11px;color:var(--t2)">${sd.lead||0} Lead · ว่าง ${sd.vacant||0} · จอง ${sd.booking||0} · ทีม ${sdYear.team||'?'}</div></div>`;
      html += `<select onchange="curS=this.value;showCase=null;curF='all';lfPage=1;updateUrl();render()">`;
      sellerNames.forEach(n=>{html+=`<option value="${h(n)}" ${effectiveCurS===n?'selected':''}>${h(n)}</option>`;});
      html += `</select></div>`;

      // KPI — กดดูรายละเอียดได้ทุก card
      // คลิก → ไป chip filter หรือเปิด modal แสดง booking list ของเซลล์
      const kpis = [
        {l:"Lead",v:sd.lead||0,c:"var(--t1)",       action:`curF='all';lfPage=1;render()`,  hint:"ดูเคสติดตาม"},
        {l:"ติดตาม",v:sd.follow||0,c:"var(--blue)", action:`curF='followstatus';lfPage=1;render()`, hint:"ดูเคสติดตาม"},
        {l:"ว่าง",v:sd.vacant||0,c:"var(--t3)",     action:`openSellerBookingsModal('${h(effectiveCurS)}','all','ว่าง — ไม่มีในเคสติดตาม')`, hint:"ดูใน sheet"},
        {l:"จอง",v:sd.booking||0,c:"var(--green)",  action:`openSellerBookingsModal('${h(effectiveCurS)}','จอง','')`,  hint:"ดูเคสจอง"},
        {l:"ปิด/เป้า",v:(sd.done||0)+'/'+(sd.target||0),c:(sd.done||0)>=(sd.target||1)?'var(--green)':'var(--amber)', action:`openSellerBookingsModal('${h(effectiveCurS)}','ปล่อย','')`, hint:"ดูเคสที่ปล่อย"},
        {l:"💰 ยอดปล่อย",v:fmtBaht(sd.dealValue||0),c:"var(--green-mid)", action:`openSellerBookingsModal('${h(effectiveCurS)}','ปล่อย','')`, hint:"ดูเคสที่ปล่อย"},
        {l:"ยังไม่โทร",v:noU,c:noU>10?'var(--red)':'var(--amber)', action:`curF='notcalled';lfPage=1;render()`, hint:"ดูเคสยังไม่โทร"},
      ];
      html += `<div class="kgrid" style="margin-bottom:10px">`;
      kpis.forEach(k=>{
        html += `<div class="kpi" style="cursor:pointer" onclick="${k.action}" title="${k.hint}"><div class="kl">${k.l} <span style="font-size:9px;color:var(--t3);font-weight:400">↗</span></div><div class="kv" style="color:${k.c}">${k.v}</div></div>`;
      });
      html += `</div>`;

      // Lead types
      const lt = sd.leadTypes||{};
      const ltTotal = Object.values(lt).reduce((a,v)=>a+v,0)||1;
      const ltSorted = Object.entries(lt).sort((a,b)=>b[1]-a[1]);
      html += `<div class="card" style="margin-bottom:10px"><div class="card-title">🏷️ ประเภท Lead</div>`;
      if(ltSorted.length===0) html += `<span style="font-size:12px;color:var(--t3)">ยังไม่มีข้อมูล</span>`;
      ltSorted.forEach(([name,count])=>{
        const p=Math.round((count/ltTotal)*100);
        const c=C.LT_COLORS[name]||'var(--t2)';
        html += `<div class="lt-row"><span style="min-width:60px;font-size:11px;font-weight:500;color:var(--t1)">${h(name)}</span><div class="lt-bar" style="width:${Math.max(p,2)}%;background:${c};flex-shrink:0"></div><span style="font-size:11px;color:${c};margin-left:5px;min-width:50px">${count} (${p}%)</span></div>`;
      });
      html += `</div>`;

      // Chips
      const chips = [
        {f:'all',l:'ทั้งหมด',n:cases.length},{f:'notcalled',l:'ยังไม่โทร',n:noU},{f:'frequent',l:'ติดตามมาก',n:hot},
        {f:'followstatus',l:'ต้องตาม',n:cases.filter(l=>{const st=(l.adminStatus||'').toLowerCase();return['ติดตาม','รอตอบ','รอลูกค้า','โทรไม่รับ','ผิดนัด'].some(s=>st.includes(s));}).length},
        {f:'need2',l:'โทรอีก 2+',n:cases.filter(l=>nc(l.updateCount)>=2).length},
        {f:'hascar',l:'มีรถสนใจ',n:cases.filter(l=>!nocar(l.car)).length},
      ];
      html += `<div class="chips">`;
      chips.forEach(ch=>{
        html += `<button class="chip${ch.f===curF?' on':''}" onclick="curF='${ch.f}';lfPage=1;render()">${ch.l} <span class="cpill">${ch.n}</span></button>`;
      });
      html += `</div>`;

      // Search & sort
      html += `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px">`;
      html += `<input type="text" placeholder="ค้นหา code / รถ / หมายเหตุ..." style="flex:1;min-width:130px" value="${h(searchQ)}" oninput="searchQ=this.value;lfPage=1;render()">`;
      html += `<div style="display:flex;gap:3px;flex-wrap:wrap">`;
      [{s:'urgent',l:'เร่งด่วน'},{s:'upd-asc',l:'อัพน้อย'},{s:'upd-desc',l:'ติดตามมาก'},{s:'date',l:'ล่าสุด'}].forEach(b=>{
        html += `<button class="sbtn${curSo===b.s?' on':''}" onclick="curSo='${b.s}';lfPage=1;render()">${b.l}</button>`;
      });
      html += `</div></div>`;

      // Filtered & sorted leads
      let rows = [...cases];
      if(curF==='notcalled') rows=rows.filter(l=>l.updateCount===0);
      else if(curF==='frequent') rows=rows.filter(l=>l.updateCount>=3);
      else if(curF==='followstatus') rows=rows.filter(l=>{const st=(l.adminStatus||'').toLowerCase();return['ติดตาม','รอตอบ','รอลูกค้า','โทรไม่รับ','ผิดนัด'].some(s=>st.includes(s));});
      else if(curF==='need2') rows=rows.filter(l=>nc(l.updateCount)>=2);
      else if(curF==='hascar') rows=rows.filter(l=>!nocar(l.car));
      if(searchQ){const q=searchQ.toLowerCase();rows=rows.filter(l=>[l.code,l.car,l.note,l.phone,l.channel,l.leadType].join(' ').toLowerCase().includes(q));}
      if(curSo==='urgent') rows.sort((a,b)=>urg(b)-urg(a));
      else if(curSo==='upd-asc') rows.sort((a,b)=>a.updateCount-b.updateCount);
      else if(curSo==='upd-desc') rows.sort((a,b)=>b.updateCount-a.updateCount);
      else if(curSo==='date') rows.sort((a,b)=>{const pa=a.lastUpdate&&a.lastUpdate!=='-';const pb=b.lastUpdate&&b.lastUpdate!=='-';if(!pa&&!pb)return 0;if(!pa)return 1;if(!pb)return -1;return new Date(b.lastUpdate)-new Date(a.lastUpdate);});

      const total=rows.length;
      const totalPages=Math.ceil(total/C.PAGE_SIZE)||1;
      const safePage=lfPage>totalPages?totalPages:lfPage;
      const start=(safePage-1)*C.PAGE_SIZE;
      const pageRows=rows.slice(start,start+C.PAGE_SIZE);

      html += `<div class="card"><div class="lfhdr"><span>Code · อัพล่าสุด</span><span>หมายเหตุ / รถ</span><span style="text-align:right">อัพ</span></div>`;
      html += `<div style="max-height:440px;overflow-y:auto">`;
      pageRows.forEach(l=>{
        const cls=l.updateCount===0?'lfrow hr':nc(l.updateCount)>=2?'lfrow ha':l.updateCount>=3?'lfrow hb':'lfrow';
        const carHas=!nocar(l.car); const chanHas=!empty(l.channel)&&l.channel!=='-';
        html += `<div class="${cls}" onclick="showCase='${h(l.code)}';updateUrl();render()">`;
        html += `<div><div style="font-weight:700;font-size:11px;color:var(--blue)">${h(l.code)}${l.leadType?`<span style="font-size:9px;padding:1px 4px;border-radius:4px;background:var(--blue-bg);color:var(--blue);font-weight:600;margin-left:3px">${h(l.leadType)}</span>`:''}</div>`;
        html += `<div style="font-size:10px;color:var(--t3)">${l.lastUpdate&&l.lastUpdate!=='-'?h(l.lastUpdate):'ยังไม่อัพเดท'}</div>`;
        if(carHas) html += `<div style="font-size:10px;color:var(--t2)">🚗 ${h(l.car)}</div>`;
        if(chanHas) html += `<div style="font-size:10px;color:var(--purple-mid)">📢 ${h(l.channel)}</div>`;
        html += `</div><div><div style="font-size:11px;color:var(--t2);line-height:1.5">${h((l.note||'-').slice(0,80))}</div><div style="margin-top:3px">${urgBadge(l)}</div></div>`;
        html += `<div>${dotsHtml(l.updateCount)}</div></div>`;
      });
      html += `</div>`;
      if(total===0) html += `<div style="text-align:center;color:var(--t3);padding:22px 0;font-size:13px">ไม่พบเคส</div>`;
      // Pagination
      html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap;gap:6px">`;
      html += `<div style="font-size:11px;color:var(--t3)">แสดง ${start+1}-${Math.min(start+C.PAGE_SIZE,total)} จาก ${total} เคส</div>`;
      html += `<div style="display:flex;gap:6px">`;
      if(safePage>1) html += `<button class="pg-btn" onclick="lfPage=${safePage-1};render()">←</button>`;
      html += `<span style="font-size:12px;color:var(--t2);padding:0 6px;line-height:32px">${safePage}/${totalPages}</span>`;
      if(safePage<totalPages) html += `<button class="pg-btn primary" onclick="lfPage=${safePage+1};render()">→</button>`;
      html += `</div></div></div>`;
      return html;
    }

    // ── CASE DETAIL ──
    function renderCaseDetail(l) {
      const n=nc(l.updateCount); const noC=l.updateCount===0;
      const uc=noC?'var(--red)':n>=2?'var(--amber)':n===0?'var(--green)':'var(--blue)';
      const ut=noC?'ยังไม่โทร':n>=2?'โทรอีก '+n+'x':n===1?'โทรอีก 1x':'ครบแล้ว';
      const cdKpis=[
        {l:'อัพเดท',v:l.updateCount+'/'+C.UPD_TGT,c:l.updateCount>=C.UPD_TGT?'var(--green)':'var(--amber)'},
        {l:'สถานะ',v:ut,c:uc},
        {l:'หลักฐาน',v:l.callProof||'-',c:l.callProof==='ส่งแล้ว'?'var(--green)':l.callProof==='-'?'var(--t3)':'var(--red)'},
        {l:'อัพล่าสุด',v:l.lastUpdate&&l.lastUpdate!=='-'?l.lastUpdate:'ยังไม่มี',c:'var(--t2)'},
      ];
      const infoRows=[
        {l:'📞 เบอร์',v:l.phone||'-',c:!empty(l.phone)?'var(--blue)':'var(--t3)'},
        {l:'🚗 รถ',v:nocar(l.car)?'-':l.car,c:'var(--t1)'},
        {l:'📢 ช่องทาง',v:!empty(l.channel)&&l.channel!=='-'?l.channel:'-',c:'var(--purple-mid)'},
        {l:'📋 Status',v:l.adminStatus||'-',c:'var(--t1)'},
        {l:'📅 รับเคส',v:l.dateIn+(l.timeIn?' '+l.timeIn:''),c:'var(--t2)'},
      ];
      if(l.profile&&!empty(l.profile)) infoRows.push({l:'👤 Profile',v:l.profile,c:'var(--t2)'});
      const history = parseNoteHistory(l.note||'');

      let html = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">`;
      html += `<button class="bbtn" onclick="showCase=null;updateUrl();render()">← รายการ</button>`;
      html += `<div><div style="font-size:15px;font-weight:700;color:var(--blue)">${h(l.code)}</div>`;
      html += `<div style="font-size:11px;color:var(--t2)">${h(l.seller)} · ${h(l.dateIn)}${l.leadType?`<span style="font-size:10px;padding:1px 5px;border-radius:4px;background:var(--blue-bg);color:var(--blue);font-weight:600;margin-left:4px">${h(l.leadType)}</span>`:''}</div></div></div>`;
      // KPI
      html += `<div class="cd-kpi-grid">`;
      cdKpis.forEach(k=>{html+=`<div class="cd-kpi"><div class="cd-kl">${k.l}</div><div class="cd-kv" style="color:${k.c}">${h(k.v)}</div></div>`;});
      html += `</div>`;
      // Info
      html += `<div class="card" style="margin-bottom:10px"><div class="card-title">📞 ข้อมูลลูกค้า</div>`;
      infoRows.forEach(r=>{html+=`<div class="irow"><span class="ilbl">${r.l}</span><span class="ival" style="color:${r.c}">${h(r.v)}</span></div>`;});
      // Progress dots
      html += `<div style="margin-top:10px;padding-top:10px;border-top:.5px solid var(--bd)"><div style="font-size:11px;color:var(--t3);margin-bottom:5px">ความคืบหน้า</div><div style="display:flex;align-items:center;gap:4px">`;
      for(let j=0;j<C.UPD_TGT;j++){

      return html;

    // ── Actions ──
    function switchTab(t) { tab=t; showCase=null; updateUrl(); render(); }
    function switchToSeller(name) { tab='s'; curS=name; showCase=null; curF='all'; lfPage=1; dfMonth=0; updateUrl(); render(); }
    function setDf(preset) { dfMonth=preset; lfPage=1; render(); }
    function setDfFromInput(v) {
      if (!v) { setDf(0); return; }
      // v format: "YYYY-MM" — ใช้แค่ month (ระบบ filter ปีปัจจุบันใน backend แล้ว)
      const mo = parseInt(v.split('-')[1] || '0');
      if (mo >= 1 && mo <= 12) setDf(mo);
    }
    function setImpersonate(name) {
      impersonate = name||null;
      if(name) localStorage.setItem('oxlet_impersonate',name);
      else localStorage.removeItem('oxlet_impersonate');
      // รีเซ็ตมุมมองที่ผูกกับเซลล์ — กลับมาเป็น Admin จะได้ไม่ค้างที่ seller tab
      curS = name || '';
      showCase = null;
      if(!name && tab==='s') tab = 'o';
      updateUrl();
      render();
    }
    function openCaseFromOverview(code, seller) {
      tab='s'; curS=seller; showCase=code; updateUrl(); render();
    }

    // ── Admin Login Modal ──
    function getCsrfToken() {
      const m = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
      return m ? decodeURIComponent(m[1]) : '';
    }
    function openAdminLogin() {
      // ปิด modal เก่าถ้ามี

          <div style="margin-bottom:10px">

            <input id="admin-user" type="text" autocomplete="username" value="admin" style="width:100%;padding:10px 12px;border:.5px solid var(--bd2);border-radius:10px;background:var(--bg2);color:var(--t1);font-size:13px;outline:none;box-sizing:border-box">
          </div>
          <div style="margin-bottom:14px">

            <button id="admin-login-submit" onclick="submitAdminLogin()" style="flex:2;padding:10px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-weight:700;font-size:13px;cursor:pointer">เข้าสู่ระบบ</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      const u = document.getElementById('admin-user');
      const p = document.getElementById('admin-pass');
      p.focus();
      const onEnter = (e) => { if (e.key === 'Enter') submitAdminLogin(); };
      u.addEventListener('keydown', onEnter);
      p.addEventListener('keydown', onEnter);
    }
    async function submitAdminLogin() {
      const u = document.getElementById('admin-user').value.trim();
      const p = document.getElementById('admin-pass').value;
      const btn = document.getElementById('admin-login-submit');
      const errBox = document.getElementById('admin-login-err');
      errBox.style.display = 'none';
      btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';
      try {
        const fd = new FormData();
        fd.append('username', u);
        fd.append('password', p);
        fd.append('next', '/dashboard/');
        const res = await fetch('/login/', {
          method: 'POST',
          body: fd,
          headers: { 'X-Requested-With': 'XMLHttpRequest', 'X-CSRFToken': getCsrfToken() },
          credentials: 'same-origin',
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          location.reload();
          return;
        }
        errBox.textContent = '⚠️ ' + (data.error || 'เข้าสู่ระบบไม่สำเร็จ');
        errBox.style.display = 'block';
      } catch (e) {
        errBox.textContent = '⚠️ เกิดข้อผิดพลาด: ' + e.message;
        errBox.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
      }
    }

              <td style="padding:5px 6px;border-bottom:.5px solid var(--bd)"><input list="sc-teams" value="${h(s.team)}" oninput="__scRows[${i}].team=this.value.toUpperCase();this.value=__scRows[${i}].team" style="width:100%;padding:6px 9px;border:.5px solid var(--bd2);border-radius:6px;background:var(--bg);color:var(--t1);font-size:12px;outline:none;box-sizing:border-box;text-align:center;font-weight:700"></td>
              <td style="padding:5px 6px;border-bottom:.5px solid var(--bd)"><input type="number" min="0" value="${s.target}" oninput="__scRows[${i}].target=parseInt(this.value)||0;__scUpdateTotal()" style="width:100%;padding:6px 9px;border:.5px solid var(--bd2);border-radius:6px;background:var(--bg);color:var(--t1);font-size:12px;outline:none;box-sizing:border-box;text-align:right"></td>
              <td style="padding:5px 6px;border-bottom:.5px solid var(--bd);text-align:center"><button onclick="__scDeleteRow(${i})" title="ลบเซลล์นี้" style="background:transparent;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:4px">🗑️</button></td>

        <div style="display:flex;gap:8px">

    function __scUpdateTotal() {

    async function __scSave() {
      const btn = document.getElementById('sc-save-btn');
      const msg = document.getElementById('sc-msg');
      // basic validation
      for (let i = 0; i < __scRows.length; i++) {
        const r = __scRows[i];
        if (!r.name || !r.name.trim()) {
          msg.innerHTML = `<div style="padding:8px 12px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">⚠️ แถวที่ ${i+1}: ชื่อว่าง</div>`; return;
        }
        if (!r.team || !r.team.trim()) {
          msg.innerHTML = `<div style="padding:8px 12px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">⚠️ ${h(r.name)}: ยังไม่ได้ใส่ทีม</div>`; return;
        }
      }
      if (!confirm(`บันทึกการตั้งค่าเซลล์ ${__scRows.length} คน? (จะเขียนทับ sheet)`)) return;
      btn.disabled = true; btn.textContent = '⏳ กำลังบันทึก...';
      msg.innerHTML = '';
      try {
        const res = await fetch('/api/admin/seller_config', {
          method: 'POST',
          headers: { 'Content-Type':'application/json', 'X-CSRFToken': getCsrfToken(), 'X-Requested-With':'XMLHttpRequest' },
          credentials: 'same-origin',
          body: JSON.stringify({ sellers: __scRows }),

          msg.innerHTML = `<div style="padding:8px 12px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">⚠️ ${h(data.error || 'บันทึกล้มเหลว')}</div>`;

        }

    // ── Cron Schedule Panel (admin only) ──
    // ตั้งเวลาใน Sheet → external cron ยิงเข้า /api/cron/tick ทุกนาที → endpoint อ่าน sheet เช็คเวลา
    let __schedRows = [];

    async function openCronPanel() {
      if (!isAdmin) return;

      overlay.id = 'cron-overlay';

          fetch('/api/admin/send_line', { credentials:'same-origin' }),
          fetch('/api/admin/schedule_config', { credentials:'same-origin' }),
        ]);
        const preview = await previewRes.json();
        const sched = await schedRes.json();

        if (sched.error) throw new Error(sched.error);
        modal.__lfPreview = preview;
        modal.__lfSched = sched;
        __schedRows = (sched.schedules || []).map(s => ({...s, sellers: (s.sellers||['*'])}));
        if (__lsSelected.size === 0) {
          (preview.sellers || []).forEach(s => {
            if (s.has_user_id && (s.called + s.notCalled + s.followUp) > 0) __lsSelected.add(s.seller);

        __lfTab('now');

    function __lfTab(tab) {
      const modal = document.querySelector('#cron-overlay > div');
      if (!modal) return;
      // update tab buttons style
      modal.querySelectorAll('.lf-tab').forEach(b => {
        const on = b.getAttribute('data-tab') === tab;
        b.style.color = on ? 'var(--blue)' : 'var(--t3)';
        b.style.borderBottomColor = on ? 'var(--blue)' : 'transparent';
      });
      // ลบ footer เก่า (ทั้ง 2 tab มี footer ของตัวเอง)
      const oldFooter = modal.querySelector('#ls-footer, #sched-footer');
      if (oldFooter) oldFooter.remove();

      const content = modal.querySelector('#lf-content');
      content.style.padding = '14px 16px';

      if (tab === 'now') {
        content.innerHTML = `<div id="ls-body"></div>`;
        renderLineSendBody(modal, modal.__lfPreview);
      } else {
        content.innerHTML = `<div id="sched-body"></div>`;
        drawSchedBody(modal, modal.__lfSched);
        drawSchedFooter(modal);
      }

    function drawSchedBody(modal, meta) {
      const baseUrl = location.origin;
      const tickUrl = `${baseUrl}/api/cron/tick?secret=YOUR_CRON_SECRET`;

      let html = `<div style="padding:9px 12px;background:var(--blue-bg);border:.5px solid var(--blue);border-radius:8px;font-size:11px;color:var(--blue);margin-bottom:12px;line-height:1.6">
        🔄 ต้องใช้คู่กับ cron-job.org ยิงเข้า URL ด้านล่างทุก 1 นาที — ระบบจะเช็คตารางและส่งตรงเวลาเอง
      </div>`;
      html += `<div style="position:relative;margin-bottom:14px">
        <input id="sched-tick-url" readonly value="${h(tickUrl)}" style="width:100%;padding:8px 70px 8px 11px;border:.5px solid var(--bd2);border-radius:8px;background:var(--bg2);color:var(--t1);font-size:10px;font-family:monospace;outline:none;box-sizing:border-box">
        <button onclick="navigator.clipboard.writeText(document.getElementById('sched-tick-url').value).then(()=>{this.textContent='✓';setTimeout(()=>this.textContent='📋',1200)})" style="position:absolute;right:5px;top:5px;font-size:10px;padding:5px 10px;border-radius:6px;border:.5px solid var(--bd2);background:var(--bg);color:var(--t2);cursor:pointer">📋</button>
      </div>`;

      // Render each schedule card
      if (__schedRows.length === 0) {
        html += `<div style="text-align:center;padding:24px;color:var(--t3);font-size:13px;border:.5px dashed var(--bd);border-radius:10px">ยังไม่มีตาราง — กดเพิ่มด้านล่าง</div>`;
      } else {
        __schedRows.forEach((s, i) => {
          html += renderSchedCard(s, i);
        });
      }
      html += `<button onclick="__schedAdd()" style="margin-top:10px;padding:9px 14px;border-radius:10px;border:.5px dashed var(--blue);background:transparent;color:var(--blue);cursor:pointer;font-size:12px;font-weight:600;width:100%">➕ เพิ่มตารางใหม่</button>`;

      html += `<details style="margin-top:14px;padding:10px;background:var(--bg2);border-radius:8px;font-size:11px">
        <summary style="cursor:pointer;font-weight:600;color:var(--t1)">🧪 ทดสอบยิง tick endpoint ทันที</summary>
        <input id="sched-test-secret" type="password" placeholder="CRON_SECRET" style="margin-top:8px;width:100%;padding:8px 11px;border:.5px solid var(--bd2);border-radius:8px;background:var(--bg);color:var(--t1);font-size:11px;outline:none;box-sizing:border-box">
        <button onclick="__schedTestTick()" style="margin-top:8px;padding:7px 14px;border-radius:8px;border:none;background:var(--purple);color:#fff;font-weight:700;font-size:11px;cursor:pointer">🚀 ยิง tick</button>
        <div id="sched-test-result" style="margin-top:8px"></div>
      </details>`;

      html += `<div id="sched-msg" style="margin-top:10px"></div>`;
      modal.querySelector('#sched-body').innerHTML = html;
      modal.__schedMeta = meta;
    }

    // ── helper: เปรียบเทียบ sellers list (handle '*' = all)
    function __schedSellersDisplay(sellers, total) {
      if (sellers.length === 0) return 'ไม่ส่งให้เซลล์';
      if (sellers.includes('*') || sellers.length >= total) return `ทุกเซลล์ (${total})`;
      if (sellers.length <= 3) return sellers.join(', ');
      return `${sellers.slice(0,2).join(', ')} +${sellers.length-2}`;
    }

    function renderSchedCard(s, i) {
      const isOpen = __expandedSched.has(i);
      const sellersData = (D.sellers || []).filter(x => x.team !== 'ADMIN');
      const allNames = sellersData.map(x => x.name);
      const totalSellers = allNames.length;
      // Normalize: ถ้า sellers === ['*'] แสดงเป็นทั้งหมด
      const isAll = s.sellers.includes('*');
      const checkedSet = isAll ? new Set(allNames) : new Set(s.sellers);

      const daysLbl = ({'*':'ทุกวัน','1-5':'จ-ศ','0,6':'ส-อา','1':'จันทร์','5':'ศุกร์'})[s.days] || s.days;
      const recCount = (isAll ? totalSellers : s.sellers.filter(x => x !== '*').length) + (s.include_executive ? 1 : 0);
      const recDesc = `${__schedSellersDisplay(s.sellers, totalSellers)}${s.include_executive ? ' + 🎩 ผู้บริหาร' : ''}`;
      const modeDesc = s.test_target ? `🧪 test → ${s.test_target.slice(0,12)}...` : 'ส่งจริง';

      let html = `<div style="border:.5px solid var(--bd);border-radius:10px;margin-bottom:8px;overflow:hidden;${s.enabled?'':'opacity:.6'}">`;

      // Header (clickable to expand)
      html += `<div style="display:grid;grid-template-columns:auto 70px auto 1fr auto auto;gap:8px;align-items:center;padding:10px 12px;background:var(--bg2);cursor:pointer" onclick="__schedExpand(${i})">
        <label style="display:flex;align-items:center;cursor:pointer" onclick="event.stopPropagation()"><input type="checkbox" ${s.enabled?'checked':''} onchange="__schedRows[${i}].enabled=this.checked;__schedRedraw()" style="cursor:pointer"></label>
        <span style="font-family:monospace;font-weight:700;color:var(--t1);font-size:13px">⏰ ${h(s.time)}</span>
        <span style="font-size:11px;color:var(--t2);background:var(--bg);padding:2px 8px;border-radius:8px">${h(daysLbl)}</span>
        <span style="font-size:12px;color:var(--t1);font-weight:600">${h(s.label||'-')}</span>
        <span style="font-size:10px;color:var(--t3)">${recCount} ผู้รับ · ${modeDesc}</span>
        <span style="font-size:14px;color:var(--t3)">${isOpen?'▲':'▼'}</span>
      </div>`;

      if (isOpen) {
        // Expanded edit form
        html += `<div style="padding:12px 14px;background:var(--bg)">`;

        // Row 1: time, day, label
        html += `<div style="display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;margin-bottom:12px;align-items:center">
          <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2)">⏰<input type="time" value="${h(s.time)}" oninput="__schedRows[${i}].time=this.value" style="padding:6px 10px;border:.5px solid var(--bd2);border-radius:6px;background:var(--bg);color:var(--t1);font-size:12px;font-family:monospace"></label>
          <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2)">📅<select onchange="__schedRows[${i}].days=this.value;__schedRedraw()" style="padding:6px 10px;border:.5px solid var(--bd2);border-radius:6px;background:var(--bg);color:var(--t1);font-size:12px">
            <option value="*" ${s.days==='*'?'selected':''}>ทุกวัน</option>
            <option value="1-5" ${s.days==='1-5'?'selected':''}>จ-ศ</option>
            <option value="0,6" ${s.days==='0,6'?'selected':''}>ส-อา</option>
            <option value="1" ${s.days==='1'?'selected':''}>จันทร์</option>
            <option value="5" ${s.days==='5'?'selected':''}>ศุกร์</option>
            ${!['*','1-5','0,6','1','5'].includes(s.days) ? `<option value="${h(s.days)}" selected>${h(s.days)}</option>` : ''}
          </select></label>
          <input value="${h(s.label||'')}" oninput="__schedRows[${i}].label=this.value" placeholder="ป้ายชื่อ (เช่น เช้าวันทำการ)" style="padding:6px 10px;border:.5px solid var(--bd2);border-radius:6px;background:var(--bg);color:var(--t1);font-size:12px;outline:none">
          <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2);cursor:pointer"><input type="checkbox" ${s.enabled?'checked':''} onchange="__schedRows[${i}].enabled=this.checked;__schedRedraw()">เปิด</label>
        </div>`;

        // Section: 👥 ผู้รับ — checkboxes by team
        html += `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div style="font-size:12px;font-weight:700;color:var(--t1)">👥 ผู้รับ Flex รายเซลล์</div>
            <div style="display:flex;gap:4px">
              <button onclick="__schedSetAllSellers(${i},true)" style="font-size:10px;padding:3px 8px;border-radius:6px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);cursor:pointer">เลือกทั้งหมด</button>
              <button onclick="__schedSetAllSellers(${i},false)" style="font-size:10px;padding:3px 8px;border-radius:6px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);cursor:pointer">ล้าง</button>
            </div>
          </div>`;

        // Group by team
        const teamGroups = {};
        sellersData.forEach(x => { (teamGroups[x.team] = teamGroups[x.team] || []).push(x); });
        const teamColors = C.TEAM_COLORS || {};

        Object.keys(teamGroups).sort().forEach(tid => {
          const color = teamColors[tid] || 'var(--t3)';
          html += `<div style="margin-bottom:6px;padding:8px 10px;background:var(--bg2);border-radius:8px;border-left:3px solid ${color}">
            <div style="font-size:11px;font-weight:600;color:${color};margin-bottom:4px">ทีม ${h(tid)} (${teamGroups[tid].length} คน)</div>
            <div style="display:flex;gap:4px 10px;flex-wrap:wrap">`;
          teamGroups[tid].forEach(seller => {
            const isChecked = checkedSet.has(seller.name);
            html += `<label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--t1);cursor:pointer;padding:3px 7px;border-radius:6px;background:${isChecked?'var(--blue-bg)':'transparent'}">
              <input type="checkbox" ${isChecked?'checked':''} onchange="__schedToggleSeller(${i},'${h(seller.name)}',this.checked)">${h(seller.name)}
            </label>`;
          });
          html += `</div></div>`;
        });

        // Executive toggle
        const execChecked = !!s.include_executive;
        html += `<div style="margin-top:6px;padding:9px 11px;background:${execChecked?'var(--purple-bg)':'var(--bg2)'};border-radius:8px;border:.5px solid ${execChecked?'var(--purple-mid)':'var(--bd)'}">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" ${execChecked?'checked':''} onchange="__schedRows[${i}].include_executive=this.checked;__schedRedraw()">
            <span style="font-size:12px;font-weight:700;color:${execChecked?'var(--purple)':'var(--t1)'}">🎩 ผู้บริหาร — รับ Overview Flex (สรุปยอดรวมทีม)</span>
          </label>
          <div style="font-size:10px;color:var(--t3);margin-top:3px;margin-left:24px;font-family:monospace">user_id (จาก env): ดู EXECUTIVE_USER_IDS</div>
        </div>`;

        html += `</div>`; // close ผู้รับ section

        // Test mode field
        html += `<div style="margin-top:10px;padding:9px 11px;background:var(--amber-bg);border:.5px solid var(--amber-mid);border-radius:8px">
          <label style="display:block;font-size:11px;color:var(--amber);font-weight:600;margin-bottom:5px">🧪 Test mode — ถ้ามีค่า: ทุก Flex จะส่งไปที่ user_id นี้แทน (ไม่ส่งจริง)</label>
          <input value="${h(s.test_target||'')}" oninput="__schedRows[${i}].test_target=this.value;__schedRedraw()" placeholder="ว่าง = ส่งจริง / ใส่ U... = test ส่งให้ตัวเอง" style="width:100%;padding:7px 10px;border:.5px solid var(--bd2);border-radius:6px;background:var(--bg);color:var(--t1);font-size:11px;outline:none;box-sizing:border-box;font-family:monospace">
        </div>`;

        // Delete + collapse
        html += `<div style="display:flex;justify-content:space-between;margin-top:12px">
          <button onclick="__schedDel(${i})" style="padding:6px 12px;border-radius:6px;border:.5px solid var(--red);background:var(--red-bg);color:var(--red);cursor:pointer;font-size:11px;font-weight:600">🗑️ ลบตารางนี้</button>
          <button onclick="__schedExpand(${i})" style="padding:6px 12px;border-radius:6px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);cursor:pointer;font-size:11px">▲ ยุบ</button>
        </div>`;

        html += `</div>`; // close expanded
      }

      html += `</div>`; // close card
      return html;
    }

    function __schedRedraw() {
      const modal = document.querySelector('#cron-overlay > div');
      if (modal && modal.__schedMeta) drawSchedBody(modal, modal.__schedMeta);
    }
    function __schedExpand(i) {
      if (__expandedSched.has(i)) __expandedSched.delete(i);
      else __expandedSched.add(i);
      __schedRedraw();
    }
    function __schedSetAllSellers(i, on) {
      const allNames = (D.sellers || []).filter(x => x.team !== 'ADMIN').map(x => x.name);
      __schedRows[i].sellers = on ? allNames.slice() : [];
      __schedRedraw();
    }
    function __schedToggleSeller(i, name, on) {
      const arr = __schedRows[i].sellers;
      // Expand '*' to explicit if currently '*'
      const expanded = arr.includes('*')
        ? (D.sellers || []).filter(x => x.team !== 'ADMIN').map(x => x.name)
        : arr.slice();
      const idx = expanded.indexOf(name);
      if (on && idx === -1) expanded.push(name);
      else if (!on && idx !== -1) expanded.splice(idx, 1);
      __schedRows[i].sellers = expanded;
      __schedRedraw();
    }

    function drawSchedFooter(modal) {
      let footer = modal.querySelector('#sched-footer');
      if (!footer) {
        footer = document.createElement('div');
        footer.id = 'sched-footer';
        footer.style.cssText = 'padding:12px 16px;border-top:.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:10px';
        modal.appendChild(footer);
      }
      footer.innerHTML = `<div style="font-size:11px;color:var(--t3)">บันทึก = เขียนทับ tab "ตั้งเวลาส่ง"</div>
        <div style="display:flex;gap:8px">
          <button onclick="document.getElementById('cron-overlay').remove()" style="padding:8px 14px;border-radius:8px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);font-weight:600;font-size:12px;cursor:pointer">ปิด</button>
          <button id="sched-save-btn" onclick="__schedSave()" style="padding:8px 20px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-weight:700;font-size:13px;cursor:pointer">💾 บันทึก</button>
        </div>`;
    }

    function __schedAdd() {
      const newIdx = __schedRows.length;
      __schedRows.push({ time:'09:00', days:'*', sellers:['*'], test_target:'', enabled:true, label:'', include_executive:false });
      __expandedSched.add(newIdx); // auto-expand new row
      __schedRedraw();
    }
    function __schedDel(i) {
      if (!confirm(`ลบตาราง ${__schedRows[i]?.time || ''} ${__schedRows[i]?.label || ''}?`)) return;
      __schedRows.splice(i, 1);
      // Re-index expanded set
      const newSet = new Set();
      __expandedSched.forEach(idx => {
        if (idx < i) newSet.add(idx);
        else if (idx > i) newSet.add(idx - 1);
      });
      __expandedSched = newSet;
      __schedRedraw();
    }
    async function __schedSave() {
      const btn = document.getElementById('sched-save-btn');
      const msg = document.getElementById('sched-msg');
      for (let i = 0; i < __schedRows.length; i++) {
        const r = __schedRows[i];
        if (!r.time || !/^\d{1,2}:\d{2}$/.test(r.time)) {
          msg.innerHTML = `<div style="padding:8px 12px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">⚠️ แถวที่ ${i+1}: เวลาผิด (ต้อง HH:MM)</div>`; return;
        }
      }
      btn.disabled = true; btn.textContent = '⏳ บันทึก...';
      msg.innerHTML = '';
      try {
        const res = await fetch('/api/admin/schedule_config', {
          method:'POST',
          headers:{'Content-Type':'application/json','X-CSRFToken': getCsrfToken(),'X-Requested-With':'XMLHttpRequest'},
          credentials:'same-origin',
          body: JSON.stringify({ schedules: __schedRows }),
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          msg.innerHTML = `<div style="padding:8px 12px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">⚠️ ${h(data.error || 'failed')}</div>`;
        } else {
          msg.innerHTML = `<div style="padding:8px 12px;background:var(--green-bg);color:var(--green);border-radius:8px;font-size:11px;font-weight:600">✅ บันทึก ${data.saved} ตารางเรียบร้อย</div>`;
        }
      } catch (e) {
        msg.innerHTML = `<div style="padding:8px 12px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">⚠️ ${h(e.message)}</div>`;
      } finally {
        btn.disabled = false; btn.textContent = '💾 บันทึก';
      }
    }
    async function __schedTestTick() {
      const secret = document.getElementById('sched-test-secret').value.trim();
      const result = document.getElementById('sched-test-result');
      if (!secret) { result.innerHTML = `<div style="padding:8px 11px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">⚠️ ต้องใส่ secret</div>`; return; }
      result.innerHTML = `<div style="padding:8px;color:var(--t3);font-size:11px">⏳ ยิง tick...</div>`;
      try {
        const res = await fetch(`/api/cron/tick?secret=${encodeURIComponent(secret)}`);
        const data = await res.json();
        if (!res.ok || data.error) {
          result.innerHTML = `<div style="padding:8px 11px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">⚠️ ${h(data.error||'failed')}</div>`;
        } else {
          const fired = data.fired || 0;
          result.innerHTML = `<div style="padding:8px 11px;background:var(--green-bg);color:var(--green);border-radius:8px;font-size:11px">✅ Now: ${h(data.now)} · Fired ${fired} schedule(s)${fired===0?' (ยังไม่ถึงเวลาใดเลย — เป็นเรื่องปกติ)':''}</div>`;
        }
      } catch (e) {
        result.innerHTML = `<div style="padding:8px 11px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">⚠️ ${h(e.message)}</div>`;
      }
    }

    async function __cronTestFire() {
      const secret = document.getElementById('cron-test-secret').value.trim();
      const testMode = document.getElementById('cron-test-mode').checked;
      const target = document.getElementById('cron-test-target').value.trim();
      const result = document.getElementById('cron-test-result');
      if (!secret) { result.innerHTML = `<div style="padding:8px 11px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">⚠️ ต้องใส่ secret</div>`; return; }
      if (testMode && !target) { result.innerHTML = `<div style="padding:8px 11px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">⚠️ Test mode ต้องใส่ target user_id</div>`; return; }
      result.innerHTML = `<div style="padding:8px;color:var(--t3);font-size:11px">⏳ กำลังยิง...</div>`;
      try {
        const params = new URLSearchParams({ secret });
        if (testMode) { params.set('test', '1'); params.set('target', target); }
        const res = await fetch(`/api/cron/send_line?${params.toString()}`);
        const data = await res.json();
        if (!res.ok || data.error) {
          result.innerHTML = `<div style="padding:8px 11px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">⚠️ ${h(data.error || 'failed')}</div>`;
        } else {
          result.innerHTML = `<div style="padding:8px 11px;background:var(--green-bg);color:var(--green);border-radius:8px;font-size:11px;font-weight:600">✅ ส่งสำเร็จ ${data.sent}/${data.count} ${data.failed?'(ล้มเหลว '+data.failed+')':''}</div>`;
        }
      } catch (e) {
        result.innerHTML = `<div style="padding:8px 11px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">⚠️ ${h(e.message)}</div>`;
      }
    }

    // ── Send Flex render (used by tab "ส่งทันที" ใน LINE Flex Manager) ──
    let __lsTestMode = false;
    let __lsTestUid = '';
    let __lsSelected = new Set(); // selected seller names

    function renderLineSendBody(modal, preview) {
      const sellers = preview.sellers || [];
      if (__lsSelected.size === 0) {
        // โดย default: เลือกเฉพาะคนที่มี user_id และมีเคสในเดือนนี้
        sellers.forEach(s => {
          if (s.has_user_id && (s.called + s.notCalled + s.followUp) > 0) __lsSelected.add(s.seller);
        });
      }
      const tokenWarn = preview.has_token ? '' :
        `<div style="background:var(--red-bg);color:var(--red);padding:8px 12px;border-radius:10px;font-size:11px;margin-bottom:10px;border:.5px solid var(--red-mid)">⚠️ ยังไม่ได้ตั้ง <code>LINE_CHANNEL_ACCESS_TOKEN</code> ใน <code>.env</code> — ส่งจริงจะไม่ทำงาน</div>`;

      let html = tokenWarn;
      html += `<div style="background:var(--bg2);padding:10px 12px;border-radius:10px;font-size:11px;color:var(--t2);margin-bottom:10px;line-height:1.6">
        📦 พบ <b>${sellers.length}</b> เซลล์มีข้อมูลเดือนนี้ · เลือก <b id="ls-count">${__lsSelected.size}</b> คน<br>
        💡 ติ๊กถูกตามชื่อเพื่อเลือกผู้รับ · เซลล์ที่ไม่มี LINE user_id จะถูกข้าม
      </div>`;
      html += `<div style="display:flex;gap:8px;margin-bottom:10px">
        <button onclick="__lsSelectAll(true)" style="font-size:11px;padding:4px 10px;border-radius:8px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);cursor:pointer">เลือกทั้งหมด</button>
        <button onclick="__lsSelectAll(false)" style="font-size:11px;padding:4px 10px;border-radius:8px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);cursor:pointer">ล้างการเลือก</button>
      </div>`;
      html += `<table style="width:100%;font-size:12px;border-collapse:collapse">
        <thead><tr>
          <th style="text-align:center;padding:6px 4px;color:var(--t3);font-weight:600;border-bottom:.5px solid var(--bd);width:32px"></th>
          <th style="text-align:left;padding:6px 8px;color:var(--t3);font-weight:600;border-bottom:.5px solid var(--bd)">เซลล์</th>
          <th style="text-align:right;padding:6px 8px;color:var(--t3);font-weight:600;border-bottom:.5px solid var(--bd)">โทรแล้ว</th>
          <th style="text-align:right;padding:6px 8px;color:var(--t3);font-weight:600;border-bottom:.5px solid var(--bd)">ยังไม่โทร</th>
          <th style="text-align:right;padding:6px 8px;color:var(--t3);font-weight:600;border-bottom:.5px solid var(--bd)">ต้องตาม</th>
          <th style="text-align:center;padding:6px 8px;color:var(--t3);font-weight:600;border-bottom:.5px solid var(--bd)">UID</th>
        </tr></thead><tbody>`;
      sellers.forEach(s => {
        const checked = __lsSelected.has(s.seller) ? 'checked' : '';
        const dis = !s.has_user_id ? 'disabled title="ไม่มี LINE user_id ในชีต — ไม่สามารถส่งได้"' : '';
        html += `<tr style="${!s.has_user_id?'opacity:.5;':''}">
          <td style="text-align:center;padding:6px 4px;border-bottom:.5px solid var(--bd)"><input type="checkbox" ${checked} ${dis} onchange="__lsToggle('${h(s.seller)}',this.checked)" style="cursor:pointer"></td>
          <td style="padding:8px;border-bottom:.5px solid var(--bd);color:var(--t1);font-weight:600">${h(s.seller)}</td>
          <td style="text-align:right;padding:8px;border-bottom:.5px solid var(--bd);color:var(--green)">${s.called}</td>
          <td style="text-align:right;padding:8px;border-bottom:.5px solid var(--bd);color:var(--red)">${s.notCalled}</td>
          <td style="text-align:right;padding:8px;border-bottom:.5px solid var(--bd);color:var(--amber)">${s.followUp}</td>
          <td style="text-align:center;padding:8px;border-bottom:.5px solid var(--bd)">${s.has_user_id?'<span style="color:var(--green)">✓</span>':'<span style="color:var(--red)">✗</span>'}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
      html += `<div style="margin-top:14px;padding:10px 12px;background:var(--amber-bg);border:.5px solid var(--amber-mid);border-radius:10px">
        <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--amber);font-weight:600;cursor:pointer">
          <input type="checkbox" ${__lsTestMode?'checked':''} onchange="__lsToggleTest(this.checked)"> 🧪 Test mode — ส่งทุก Flex ไปที่ user_id ที่กำหนด (ไม่ส่งจริงไปเซลล์)
        </label>
        <input id="ls-test-uid" type="text" value="${h(__lsTestUid)}" oninput="__lsTestUid=this.value" placeholder="U6bf1d72cf1d7e237c3a5c9848dde9bf4" style="display:${__lsTestMode?'block':'none'};margin-top:8px;width:100%;padding:8px 11px;border:.5px solid var(--bd2);border-radius:8px;background:var(--bg2);color:var(--t1);font-size:12px;outline:none;font-family:monospace;box-sizing:border-box">
        <div id="ls-test-hint" style="display:${__lsTestMode?'block':'none'};margin-top:6px;font-size:10px;color:var(--amber)">💡 ถ้าไม่ติ๊กเซลล์ใดเลย → จะส่ง Flex ของ <b>ทุกเซลล์ที่มีข้อมูล</b> ไปที่ user_id นี้</div>
      </div>`;
      html += `<div id="ls-result" style="margin-top:12px"></div>`;
      modal.querySelector('#ls-body').innerHTML = html;

      // footer
      let footer = modal.querySelector('#ls-footer');
      if (!footer) {
        footer = document.createElement('div');
        footer.id = 'ls-footer';
        footer.style.cssText = 'padding:12px 16px;border-top:.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:10px';
        modal.appendChild(footer);
      }
      footer.innerHTML = `<div style="font-size:11px;color:var(--t3)">ทั้งหมด: <b id="ls-count2">${__lsSelected.size}</b> คน</div>
        <button id="ls-send-btn" onclick="__lsSend()" style="padding:9px 18px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-weight:700;font-size:13px;cursor:pointer">📤 ส่ง</button>`;
    }
    function __lsToggle(name, on) {
      if (on) __lsSelected.add(name); else __lsSelected.delete(name);
      const a = document.getElementById('ls-count'); if (a) a.textContent = __lsSelected.size;
      const b = document.getElementById('ls-count2'); if (b) b.textContent = __lsSelected.size;
    }
    function __lsSelectAll(on) {
      const overlay = document.getElementById('cron-overlay');
      if (!overlay) return;
      // ใช้ selector แคบเพื่อกัน Test mode checkbox โดน match ไปด้วย
      overlay.querySelectorAll('input[type=checkbox][onchange^="__lsToggle(\'"]').forEach(cb => {
        if (cb.disabled) return;
        cb.checked = on;
        const m = (cb.getAttribute('onchange') || '').match(/'([^']+)'/);
        if (!m) return;
        const name = m[1];
        if (on) __lsSelected.add(name); else __lsSelected.delete(name);
      });
      const a = document.getElementById('ls-count'); if (a) a.textContent = __lsSelected.size;
      const b = document.getElementById('ls-count2'); if (b) b.textContent = __lsSelected.size;
    }
    function __lsToggleTest(on) {
      __lsTestMode = on;
      const inp = document.getElementById('ls-test-uid');
      if (inp) inp.style.display = on ? 'block' : 'none';
      const hint = document.getElementById('ls-test-hint');
      if (hint) hint.style.display = on ? 'block' : 'none';
    }
    async function __lsSend() {
      const btn = document.getElementById('ls-send-btn');
      const result = document.getElementById('ls-result');
      // Test mode: ถ้าไม่เลือก → ส่งทุกเซลล์ไป test user_id
      // Production: ต้องเลือกอย่างน้อย 1 คน
      if (!__lsTestMode && __lsSelected.size === 0) {
        result.innerHTML = `<div style="padding:10px 12px;background:var(--red-bg);color:var(--red);border-radius:10px;font-size:12px">⚠️ กรุณาเลือกเซลล์อย่างน้อย 1 คน</div>`;
        return;
      }
      if (__lsTestMode && !__lsTestUid.trim()) {
        result.innerHTML = `<div style="padding:10px 12px;background:var(--red-bg);color:var(--red);border-radius:10px;font-size:12px">⚠️ Test mode ต้องกรอก target user_id</div>`;
        return;
      }
      const sellersToSend = __lsSelected.size > 0 ? Array.from(__lsSelected) : [];
      const countLabel = sellersToSend.length > 0 ? `${sellersToSend.length} คน` : 'ทุกเซลล์ที่มีข้อมูล';
      if (!confirm(`ยืนยันส่ง LINE Flex (${countLabel})?${__lsTestMode?' [Test mode → '+__lsTestUid.trim().slice(0,20)+'...]':''}`)) return;
      btn.disabled = true; btn.textContent = 'กำลังส่ง...';
      result.innerHTML = `<div style="padding:10px;color:var(--t3);font-size:12px">⏳ กำลังส่ง...</div>`;
      try {
        const payload = {
          test: __lsTestMode,
          target_user_id: __lsTestMode ? __lsTestUid.trim() : '',
        };
        // ส่ง sellers filter เฉพาะตอนเลือก, ถ้าไม่ส่ง backend จะใช้ทุกเซลล์
        if (sellersToSend.length > 0) payload.sellers = sellersToSend;
        const res = await fetch('/api/admin/send_line', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken(), 'X-Requested-With': 'XMLHttpRequest' },
          credentials: 'same-origin',
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          result.innerHTML = `<div style="padding:10px 12px;background:var(--red-bg);color:var(--red);border-radius:10px;font-size:12px">⚠️ ${h(data.error || 'ส่งล้มเหลว')}</div>`;
        } else {
          const results = data.results || [];
          const ok = results.filter(r => r.sent);
          const fail = results.filter(r => !r.sent);
          const headerColor = fail.length === 0 ? 'var(--green)' : (ok.length === 0 ? 'var(--red)' : 'var(--amber)');
          const headerBg = fail.length === 0 ? 'var(--green-bg)' : (ok.length === 0 ? 'var(--red-bg)' : 'var(--amber-bg)');
          const headerIcon = fail.length === 0 ? '✅' : (ok.length === 0 ? '❌' : '⚠️');
          let html = `<div style="padding:10px 12px;background:${headerBg};color:${headerColor};border-radius:10px;font-size:12px;font-weight:600">${headerIcon} สำเร็จ ${ok.length}/${data.count} · ล้มเหลว ${fail.length}</div>`;

          // ✅ Success list — แสดงทุกคนที่ส่งสำเร็จ
          if (ok.length) {
            html += `<div style="margin-top:8px;padding:10px 12px;background:var(--green-bg);border-radius:10px;font-size:11px"><div style="color:var(--green);font-weight:700;margin-bottom:6px">✅ ส่งสำเร็จ (${ok.length})</div><div style="display:flex;flex-wrap:wrap;gap:5px">`;
            ok.forEach(r => {
              html += `<span style="background:var(--green);color:#fff;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:500">${h(r.seller)}</span>`;
            });
            html += `</div></div>`;
          }

          // ❌ Failure list — แสดงทุกคนที่ล้มเหลว + เหตุผล
          if (fail.length) {
            html += `<div style="margin-top:8px;padding:10px 12px;background:var(--red-bg);border-radius:10px;font-size:11px"><div style="color:var(--red);font-weight:700;margin-bottom:6px">❌ ล้มเหลว (${fail.length})</div>`;
            fail.forEach(f => {
              html += `<div style="margin-bottom:4px;padding:4px 0;border-bottom:.5px solid rgba(0,0,0,.05)"><b style="color:var(--red)">${h(f.seller)}</b> <span style="color:var(--t3);font-size:10px">— ${h(f.error || 'unknown')}</span></div>`;
            });
            html += `</div>`;
          }
          result.innerHTML = html;
        }
      } catch (e) {
        result.innerHTML = `<div style="padding:10px 12px;background:var(--red-bg);color:var(--red);border-radius:10px;font-size:12px">⚠️ ${h(e.message)}</div>`;
      } finally {
        btn.disabled = false; btn.textContent = '📤 ส่ง';
      }
    }

    // ── LINE ID Panel (admin only) ──
    let __empPanelFilter = '';
    function openLineIdPanel() {
      if (!isAdmin) return;
      const overlay = document.createElement('div');
      overlay.id = 'line-id-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
      const modal = document.createElement('div');
      modal.style.cssText = 'background:var(--bg);border-radius:14px;max-width:760px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden';
      modal.onclick = (e) => e.stopPropagation();
      overlay.appendChild(modal);
      document.body.appendChild(overlay);
      renderEmpPanel(modal);
    }
    function renderEmpPanel(modal) {
      const emps = (D.employees || []).slice();
      // จัดเรียง: admin > executive/ผู้บริหาร > เซลล์ > อื่นๆ
      const rank = (p) => {
        const x = (p||'').toLowerCase();
        if (x === 'admin') return 0;
        if (['executive','ผู้บริหาร','manager','exec'].includes(x) || p === 'ผู้บริหาร') return 1;
        if (x === 'seller' || x === 'sale' || x === 'sales') return 2;
        return 3;
      };
      emps.sort((a,b) => {
        const r = rank(a.position) - rank(b.position);
        if (r) return r;
        return (a.nickname||'').localeCompare(b.nickname||'','th');
      });
      const q = __empPanelFilter.trim().toLowerCase();
      const filtered = q ? emps.filter(e =>
        (e.nickname||'').toLowerCase().includes(q) ||
        (e.display_name||'').toLowerCase().includes(q) ||
        (e.position||'').toLowerCase().includes(q) ||
        (e.user_id||'').toLowerCase().includes(q)
      ) : emps;

      const posChip = (p) => {
        const x = (p||'').toLowerCase();
        if (x === 'admin') return `<span style="background:var(--amber-bg);color:var(--amber);padding:1px 7px;border-radius:8px;font-size:10px;font-weight:700">👑 Admin</span>`;
        if (['executive','ผู้บริหาร','manager','exec'].includes(x) || p === 'ผู้บริหาร') return `<span style="background:var(--purple-bg);color:var(--purple);padding:1px 7px;border-radius:8px;font-size:10px;font-weight:700">🎩 ผู้บริหาร</span>`;
        if (!p) return `<span style="background:var(--bg2);color:var(--t3);padding:1px 7px;border-radius:8px;font-size:10px">—</span>`;
        return `<span style="background:var(--blue-bg);color:var(--blue);padding:1px 7px;border-radius:8px;font-size:10px;font-weight:600">${h(p)}</span>`;
      };
      const shortId = (id) => id ? (id.slice(0,8)+'…'+id.slice(-4)) : '—';

      let body = `<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:.5px solid var(--bd)">`;
      body += `<div style="font-size:15px;font-weight:700;color:var(--t1)">👥 ข้อมูลพนักงาน <span style="font-size:11px;color:var(--t3);font-weight:400">(${emps.length} คน · แสดง ${filtered.length})</span></div>`;
      body += `<button onclick="document.getElementById('line-id-overlay').remove()" style="background:transparent;border:none;font-size:20px;color:var(--t3);cursor:pointer;line-height:1">✕</button>`;
      body += `</div>`;
      body += `<div style="padding:10px 16px;border-bottom:.5px solid var(--bd)">`;
      body += `<input id="emp-filter" type="text" placeholder="🔍 ค้นหา ชื่อเล่น / display name / ตำแหน่ง / user_id" value="${h(__empPanelFilter)}" style="width:100%;padding:7px 11px;border:.5px solid var(--bd2);border-radius:10px;background:var(--bg2);color:var(--t1);font-size:12px;outline:none">`;
      body += `</div>`;
      body += `<div style="overflow-y:auto;padding:8px 12px;flex:1">`;
      if (filtered.length === 0) {
        body += `<div style="text-align:center;padding:32px;color:var(--t3);font-size:13px">ไม่พบพนักงานที่ตรงกับคำค้น</div>`;
      } else {
        body += `<div style="display:flex;flex-direction:column;gap:8px">`;
        filtered.forEach(e => {
          const pic = e.picture_url && /^https?:/i.test(e.picture_url)
            ? `<img src="${h(e.picture_url)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" style="width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0">`
            : '';
          const initial = (e.nickname || e.display_name || '?').charAt(0);
          const fallback = `<div style="${pic?'display:none;':''}width:42px;height:42px;border-radius:50%;background:var(--blue-bg);color:var(--blue);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">${h(initial)}</div>`;
          body += `<div style="display:flex;align-items:center;gap:12px;padding:10px 12px;border:.5px solid var(--bd);border-radius:10px">`;
          body += pic + fallback;
          body += `<div style="flex:1;min-width:0">`;
          body += `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span style="font-size:13px;font-weight:700;color:var(--t1)">${h(e.nickname||'—')}</span>${posChip(e.position)}</div>`;
          body += `<div style="font-size:11px;color:var(--t2);margin-top:2px">${h(e.display_name||'—')}</div>`;
          body += `<div style="font-size:10px;color:var(--t3);margin-top:3px;font-family:monospace;display:flex;gap:10px;flex-wrap:wrap">`;
          body += `<span title="${h(e.user_id)}">UID: ${h(shortId(e.user_id))}</span>`;
          if (e.group_id) body += `<span title="${h(e.group_id)}">GID: ${h(shortId(e.group_id))}</span>`;
          body += `</div></div>`;
          body += `<div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">`;
          body += `<button onclick="navigator.clipboard.writeText('${h(e.user_id)}').then(()=>{this.textContent='✓ copied';setTimeout(()=>this.textContent='📋 user_id',1200)})" style="font-size:10px;padding:4px 9px;border-radius:8px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);cursor:pointer;white-space:nowrap">📋 user_id</button>`;
          if (e.group_id) body += `<button onclick="navigator.clipboard.writeText('${h(e.group_id)}').then(()=>{this.textContent='✓ copied';setTimeout(()=>this.textContent='📋 group_id',1200)})" style="font-size:10px;padding:4px 9px;border-radius:8px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);cursor:pointer;white-space:nowrap">📋 group_id</button>`;
          body += `</div></div>`;
        });
        body += `</div>`;
      }
      body += `</div>`;
      body += `<div style="padding:10px 16px;background:var(--amber-bg);color:var(--amber);font-size:11px;line-height:1.5;border-top:.5px solid var(--bd)">💡 ใช้ <code>user_id</code> สำหรับ <b>LINE Push Message</b> รายบุคคล · ใช้ <code>group_id</code> สำหรับยิงเข้ากลุ่ม</div>`;
      modal.innerHTML = body;

      const inp = modal.querySelector('#emp-filter');
      if (inp) {
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
        inp.oninput = (ev) => { __empPanelFilter = ev.target.value; renderEmpPanel(modal); };
      }
    }

    // ── Init ──
    document.getElementById('loading').style.display='none';
    root.style.display='block';
    render();
  </script>
  {% endif %}
</body>
</html>
