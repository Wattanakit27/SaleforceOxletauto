      </div>
      <div id="ai-body" style="overflow-y:auto;padding:16px;flex:1"><div style="text-align:center;padding:24px;color:var(--t3);font-size:13px"><div class="spin" style="margin:0 auto 10px"></div>กำลังโหลด...</div></div>`;
      overlay.appendChild(modal);
      document.body.appendChild(overlay);
      try {
        const res = await fetch('/api/admin/admin_config', { credentials:'same-origin' });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'load failed');
        __aiAdmins = (data.admins || []).map(a => ({...a}));
        __aiEmployees = data.employees || [];
        modal.__aiData = data;
        drawAdminIds(modal, data);
      } catch (e) {
        modal.querySelector('#ai-body').innerHTML = `<div style="padding:24px;text-align:center;color:var(--red)">${ic('lucide:triangle-alert',16)} ${h(e.message)}</div>`;
      }
    }

    function drawAdminIds(modal, data) {
      const adminIds = new Set(__aiAdmins.map(a => a.user_id));
      const avail = __aiEmployees.filter(e => !adminIds.has(e.user_id));
      const sheetBtn = `<a href="${h(data.sheet_url)}" target="_blank" style="font-size:11px;color:var(--blue);text-decoration:none">${ic('lucide:bar-chart-3',16)} ดูใน Sheet</a>`;

      let html = `<div style="padding:8px 12px;background:var(--amber-bg);color:var(--amber);border:.5px solid var(--amber-mid);border-radius:8px;font-size:11px;margin-bottom:12px;line-height:1.6">
        แอดมินกลุ่มนี้ = คนที่ <b>ไม่ใช่เซลล์ใน TEAMS</b> (เทเลเซลล์/ออฟฟิศ) — login ด้วย LINE user_id แล้วได้สิทธิ์แอดมิน<br>
        <span style="display:flex;justify-content:space-between"><span>เซลล์ที่เป็นแอดมิน ให้ติ๊กในปุ่ม "ตั้งเป้า / ทีม" แทน</span>${sheetBtn}</span>
      </div>`;

      // ── add section ──
      html += `<div style="background:var(--bg2);border-radius:10px;padding:12px;margin-bottom:14px">
        <div style="font-size:12px;font-weight:700;color:var(--t1);margin-bottom:8px">${ic('lucide:plus',16)} เพิ่มแอดมิน</div>
        <div style="display:flex;gap:6px;margin-bottom:8px">
          <select id="ai-emp-sel" style="flex:1;padding:8px 10px;border:.5px solid var(--bd2);border-radius:8px;background:var(--bg);color:var(--t1);font-size:12px;outline:none">
            <option value="">— เลือกจากรายชื่อพนักงาน —</option>
            ${avail.map(e => `<option value="${h(e.user_id)}">${h(e.nickname || e.display || '(ไม่มีชื่อ)')}${e.dept ? ' · '+h(e.dept) : ''}</option>`).join('')}
          </select>
          <button onclick="__aiAddFromSel()" style="padding:8px 14px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap">เพิ่ม</button>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <input id="ai-uid-manual" placeholder="หรือวาง LINE user_id (U...)" style="flex:1;padding:8px 10px;border:.5px solid var(--bd2);border-radius:8px;background:var(--bg);color:var(--t1);font-size:12px;outline:none;box-sizing:border-box">
          <button onclick="__aiAddManual()" style="padding:8px 14px;border-radius:8px;border:.5px solid var(--bd2);background:var(--bg);color:var(--t2);font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap">วางเอง</button>
        </div>
      </div>`;

      // ── current admins list ──
      html += `<div style="font-size:12px;font-weight:700;color:var(--t1);margin-bottom:8px">แอดมินปัจจุบัน (${__aiAdmins.length})</div>`;
      if (!__aiAdmins.length) {
        html += `<div style="padding:16px;text-align:center;color:var(--t3);font-size:12px;background:var(--bg2);border-radius:8px">ยังไม่มีแอดมินในรายชื่อ</div>`;
      } else {
        html += `<div style="display:flex;flex-direction:column;gap:6px">`;
        __aiAdmins.forEach((a,i) => {
          html += `<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg2);border-radius:8px">
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;color:var(--t1)">${h(a.name || '(ไม่ระบุชื่อ)')}</div>
              <code style="font-size:10px;color:var(--t3)" title="${h(a.user_id)}">${h(a.user_id.slice(0,12))}...${h(a.user_id.slice(-4))}</code>
            </div>
            <button onclick="__aiRemove(${i})" title="เอาออก" style="background:transparent;border:none;color:var(--red);cursor:pointer;font-size:13px;padding:4px 8px">ลบ</button>
          </div>`;
        });
        html += `</div>`;
      }
      html += `<div id="ai-msg" style="margin-top:10px"></div>`;

      modal.querySelector('#ai-body').innerHTML = html;

      // footer
      let footer = modal.querySelector('#ai-footer');
      if (!footer) {
        footer = document.createElement('div');
        footer.id = 'ai-footer';
        footer.style.cssText = 'padding:12px 16px;border-top:.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:10px';
        modal.appendChild(footer);
      }
      footer.innerHTML = `<div style="font-size:11px;color:var(--t3)">${ic('lucide:triangle-alert',16)} บันทึก = เขียนทับชีต "ตั้งค่าแอดมิน"</div>
        <div style="display:flex;gap:8px">
          <button onclick="document.getElementById('aiconfig-overlay').remove()" style="padding:8px 14px;border-radius:8px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);font-weight:600;font-size:12px;cursor:pointer">ปิด</button>
          <button id="ai-save-btn" onclick="__aiSave()" style="padding:8px 20px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-weight:700;font-size:13px;cursor:pointer">${ic('lucide:save',16)} บันทึก</button>
        </div>`;
    }

    function __aiRedraw() {
      const modal = document.querySelector('#aiconfig-overlay > div');
      if (modal && modal.__aiData) drawAdminIds(modal, modal.__aiData);
    }
    function __aiAddFromSel() {
      const sel = document.getElementById('ai-emp-sel');
      const uid = sel.value;
      if (!uid) return;
      const emp = __aiEmployees.find(e => e.user_id === uid);
      if (__aiAdmins.some(a => a.user_id === uid)) return;
      __aiAdmins.push({ user_id: uid, name: emp ? (emp.nickname || emp.display) : '', note: '' });
      __aiRedraw();
    }
    function __aiAddManual() {
      const inp = document.getElementById('ai-uid-manual');
      const uid = (inp.value || '').trim();
      const msg = document.getElementById('ai-msg');
      if (!uid) return;
      if (!uid.startsWith('U') || uid.length < 20) {
        msg.innerHTML = `<div style="padding:8px 12px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">${ic('lucide:triangle-alert',16)} LINE user_id ต้องขึ้นต้นด้วย U</div>`; return;
      }
      if (__aiAdmins.some(a => a.user_id === uid)) {
        msg.innerHTML = `<div style="padding:8px 12px;background:var(--amber-bg);color:var(--amber);border-radius:8px;font-size:11px">มีไอดีนี้อยู่แล้ว</div>`; return;
      }
      const emp = __aiEmployees.find(e => e.user_id === uid);
      __aiAdmins.push({ user_id: uid, name: emp ? (emp.nickname || emp.display) : '', note: '' });
      __aiRedraw();
    }
    function __aiRemove(i) {
      const name = __aiAdmins[i]?.name || __aiAdmins[i]?.user_id || '';
      if (!confirm(`เอา "${name}" ออกจากแอดมิน?`)) return;
      __aiAdmins.splice(i, 1);
      __aiRedraw();
    }
    async function __aiSave() {
      const btn = document.getElementById('ai-save-btn');
      const msg = document.getElementById('ai-msg');
      if (!confirm(`บันทึกแอดมิน ${__aiAdmins.length} คน? (เขียนทับชีต)`)) return;
      btn.disabled = true; btn.textContent = '⏳ กำลังบันทึก...';
      try {
        const res = await fetch('/api/admin/admin_config', {
          method: 'POST',
          headers: { 'Content-Type':'application/json', 'X-CSRFToken': getCsrfToken(), 'X-Requested-With':'XMLHttpRequest' },
          credentials: 'same-origin',
          body: JSON.stringify({ admins: __aiAdmins }),
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          msg.innerHTML = `<div style="padding:8px 12px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">${ic('lucide:triangle-alert',16)} ${h(data.error || 'บันทึกล้มเหลว')}</div>`;
        } else {
          msg.innerHTML = `<div style="padding:8px 12px;background:var(--green-bg);color:var(--green);border-radius:8px;font-size:11px;font-weight:600">${ic('lucide:circle-check',16)} บันทึก ${data.saved} แอดมินเรียบร้อย</div>`;
        }
      } catch (e) {
        msg.innerHTML = `<div style="padding:8px 12px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">${ic('lucide:triangle-alert',16)} ${h(e.message)}</div>`;
      } finally {
        btn.disabled = false; btn.textContent = '💾 บันทึก';
      }
    }

    // ── Cron Schedule Panel (admin only) ──
    // ตั้งเวลาใน Sheet → external cron ยิงเข้า /api/cron/tick ทุกนาที → endpoint อ่าน sheet เช็คเวลา
    let __schedRows = [];
    let __expandedSched = new Set(); // index ที่กางอยู่
    async function openCronPanel() {
      if (!isAdmin) return;
      const old = document.getElementById('cron-overlay');
      if (old) old.remove();
      const overlay = document.createElement('div');
      overlay.id = 'cron-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
      const modal = document.createElement('div');
      modal.style.cssText = 'background:var(--bg);border-radius:14px;max-width:900px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden';
      modal.onclick = (e) => e.stopPropagation();

      // Tabs: ส่งทันที / ตารางเวลา
      modal.innerHTML = `<div style="padding:14px 16px;border-bottom:.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:15px;font-weight:700;color:var(--t1)">${ic('lucide:send',16)} แจ้งเตือนตามด่วน</div>
        <button onclick="document.getElementById('cron-overlay').remove()" style="background:transparent;border:none;font-size:20px;color:var(--t3);cursor:pointer">✕</button>
      </div>
      <div style="display:flex;border-bottom:.5px solid var(--bd);background:var(--bg2)">
        <button class="lf-tab on" data-tab="now" onclick="__lfTab('now')" style="flex:1;padding:10px 14px;border:none;background:transparent;cursor:pointer;font-size:12px;font-weight:600;color:var(--blue);border-bottom:2px solid var(--blue)">${ic('lucide:rocket',16)} ส่งทันที (One-time)</button>
        <button class="lf-tab" data-tab="sched" onclick="__lfTab('sched')" style="flex:1;padding:10px 14px;border:none;background:transparent;cursor:pointer;font-size:12px;font-weight:600;color:var(--t3);border-bottom:2px solid transparent">${ic('lucide:calendar',16)} ตารางเวลา (Auto)</button>
      </div>
      <div id="lf-content" style="overflow-y:auto;flex:1"><div style="text-align:center;padding:24px;color:var(--t3);font-size:13px"><div class="spin" style="margin:0 auto 10px"></div>กำลังโหลด...</div></div>`;
      overlay.appendChild(modal);
      document.body.appendChild(overlay);

      try {
        // โหลดทั้ง preview send + schedule
        const [previewRes, schedRes] = await Promise.all([
          fetch('/api/admin/send_line', { credentials:'same-origin' }),
          fetch('/api/admin/schedule_config', { credentials:'same-origin' }),
        ]);
        const preview = await previewRes.json();
        const sched = await schedRes.json();
        if (preview.error) throw new Error(preview.error);
        if (sched.error) throw new Error(sched.error);
        modal.__lfPreview = preview;
        modal.__lfSched = sched;
        __schedRows = (sched.schedules || []).map(s => ({...s, sellers: (s.sellers||['*'])}));
        if (__lsSelected.size === 0) {
          (preview.sellers || []).forEach(s => {
            if (s.has_user_id && (s.called + s.notCalled + s.followUp) > 0) __lsSelected.add(s.seller);
          });
        }
        // Default tab = ส่งทันที
        __lfTab('now');
      } catch (e) {
        modal.querySelector('#lf-content').innerHTML = `<div style="padding:24px;text-align:center;color:var(--red)">${ic('lucide:triangle-alert',16)} ${h(e.message)}</div>`;
      }
    }

    function __lfTab(tab) {
      const modal = document.querySelector('#cron-overlay > div');
      if (!modal) return;
      // update tab buttons style
      modal.querySelectorAll('.lf-tab').forEach(b => {
        const on = b.getAttribute('data-tab') === tab;
        b.style.color = on ? 'var(--blue)' : 'var(--t3)';
        b.style.borderBottomColor = on ? 'var(--blue)' : 'transparent';
      });
      // ลบ footer เก่า (ทั้ง 2 tab มี footer ของตัวเอง)
      const oldFooter = modal.querySelector('#ls-footer, #sched-footer');
      if (oldFooter) oldFooter.remove();

      const content = modal.querySelector('#lf-content');
      content.style.padding = '14px 16px';

      if (tab === 'now') {
        content.innerHTML = `<div id="ls-body"></div>`;
        renderLineSendBody(modal, modal.__lfPreview);
      } else {
        content.innerHTML = `<div id="sched-body"></div>`;
        drawSchedBody(modal, modal.__lfSched);
        drawSchedFooter(modal);
      }
    }

    function drawSchedBody(modal, meta) {
      const baseUrl = location.origin;
      const tickUrl = `${baseUrl}/api/cron/tick?secret=YOUR_CRON_SECRET`;

      let html = `<div style="padding:9px 12px;background:var(--blue-bg);border:.5px solid var(--blue);border-radius:8px;font-size:11px;color:var(--blue);margin-bottom:12px;line-height:1.6">
        ${ic('lucide:refresh-cw',16)} ต้องใช้คู่กับ n8n ยิงเข้า URL ด้านล่างทุก 1 นาที — ถึงเวลาในตาราง ระบบจะส่ง "ตามด่วน" ให้เซลล์เอง
      </div>`;
      html += `<div style="position:relative;margin-bottom:14px">
        <input id="sched-tick-url" readonly value="${h(tickUrl)}" style="width:100%;padding:8px 70px 8px 11px;border:.5px solid var(--bd2);border-radius:8px;background:var(--bg2);color:var(--t1);font-size:10px;font-family:monospace;outline:none;box-sizing:border-box">
        <button onclick="navigator.clipboard.writeText(document.getElementById('sched-tick-url').value).then(()=>{this.textContent='✓';setTimeout(()=>this.textContent='📋',1200)})" style="position:absolute;right:5px;top:5px;font-size:10px;padding:5px 10px;border-radius:6px;border:.5px solid var(--bd2);background:var(--bg);color:var(--t2);cursor:pointer">${ic('lucide:clipboard-list',16)}</button>
      </div>`;

      // Render each schedule card
      if (__schedRows.length === 0) {
        html += `<div style="text-align:center;padding:24px;color:var(--t3);font-size:13px;border:.5px dashed var(--bd);border-radius:10px">ยังไม่มีตาราง — กดเพิ่มด้านล่าง</div>`;
      } else {
        __schedRows.forEach((s, i) => {
          html += renderSchedCard(s, i);
        });
      }
      html += `<button onclick="__schedAdd()" style="margin-top:10px;padding:9px 14px;border-radius:10px;border:.5px dashed var(--blue);background:transparent;color:var(--blue);cursor:pointer;font-size:12px;font-weight:600;width:100%">${ic('lucide:plus',16)} เพิ่มตารางใหม่</button>`;

      // ── Log สถานะ cron + followup (แทนปุ่มทดสอบเดิม) — รู้ว่าตัวตั้งเวลายิงเข้ามาไหม + ส่งล่าสุดเมื่อไหร่ ──
      html += `<div style="margin-top:14px;padding:11px 13px;background:var(--bg2);border-radius:10px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <span style="font-weight:700;color:var(--t1);font-size:12px">${ic('lucide:activity',15)} สถานะตัวตั้งเวลา (cron) + log การส่ง</span>
          <button onclick="__schedRefreshLog()" style="font-size:10px;padding:4px 9px;border-radius:6px;border:.5px solid var(--bd2);background:var(--bg);color:var(--t2);cursor:pointer">${ic('lucide:refresh-cw',14)} รีเฟรช</button>
        </div>
        <div id="sched-cron-log" style="font-size:11px">${__schedLogHtml(meta)}</div>
      </div>`;

      html += `<div id="sched-msg" style="margin-top:10px"></div>`;
      modal.querySelector('#sched-body').innerHTML = html;
      modal.__schedMeta = meta;
    }

    // ── Log cron/followup: สร้าง HTML สถานะ (cron ยิงล่าสุด + followup ส่งล่าสุด) ──
    function __schedLogHtml(meta) {
      const sbOff = meta && meta.supabaseOk === false;
      const ct = meta && meta.cronTick;
      const age = ct ? ct.ageSec : null;
      const cronTxt = sbOff ? 'โหมดอ่านสด — ไม่ติดตาม heartbeat (cron ทำงานปกติ · เช็คจาก response 200)'
        : age == null ? '❌ ยังไม่เคยยิงเข้ามา (ตั้ง n8n หรือยัง?)'
        : (age < 90 ? '✅ ทำงานปกติ (' + Math.round(age) + ' วิที่แล้ว)'
        : age < 600 ? '⚠️ ' + Math.round(age/60) + ' นาทีที่แล้ว'
        : '❌ หยุดยิง ' + Math.round(age/60) + ' นาที');
      const cronCol = sbOff ? 'var(--t3)' : ((age == null || age > 600) ? 'var(--red)' : (age > 180 ? 'var(--amber)' : 'var(--green)'));
      const fu = meta && meta.lastFollowup;
      let fuTxt = 'ยังไม่เคยส่ง';
      if (fu && fu.at) {
        try {
          fuTxt = new Date(fu.at).toLocaleString('th-TH', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})
            + (fu.count != null ? ' · ' + fu.count + ' คน' : '')
            + (fu.time ? ' (รอบ ' + fu.time + ')' : '');
        } catch(e) {}
      }
      return `<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0"><span style="color:var(--t3)">cron ยิงล่าสุด</span><span style="font-weight:700;color:${cronCol};text-align:right">${cronTxt}</span></div>
        <div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:.5px solid var(--bd)"><span style="color:var(--t3)">followup ส่งล่าสุด</span><span style="font-weight:700;color:var(--t1);text-align:right">${h(fuTxt)}</span></div>`;
    }
    async function __schedRefreshLog() {
      try {
        const r = await fetch('/api/admin/schedule_config', { credentials:'same-origin' });
        const j = await r.json();
        const el = document.getElementById('sched-cron-log');
        if (el && !j.error) el.innerHTML = __schedLogHtml(j);
      } catch(e) {}
    }

    // ── helper: เปรียบเทียบ sellers list (handle '*' = all)
    function __schedSellersDisplay(sellers, total) {
      if (sellers.length === 0) return 'ไม่ส่งให้เซลล์';
      if (sellers.includes('*') || sellers.length >= total) return `ทุกเซลล์ (${total})`;
      if (sellers.length <= 3) return sellers.join(', ');
      return `${sellers.slice(0,2).join(', ')} +${sellers.length-2}`;
    }

    function renderSchedCard(s, i) {
      const isOpen = __expandedSched.has(i);
      const sellersData = (D.sellers || []);  // รวมกลุ่ม ADMIN (เทเลเซลล์) ด้วย
      const allNames = sellersData.map(x => x.name);
      const totalSellers = allNames.length;
      // Normalize: ถ้า sellers === ['*'] แสดงเป็นทั้งหมด
      const isAll = s.sellers.includes('*');
      const checkedSet = isAll ? new Set(allNames) : new Set(s.sellers);

      const daysLbl = ({'*':'ทุกวัน','1-5':'จ-ศ','0,6':'ส-อา','1':'จันทร์','5':'ศุกร์'})[s.days] || s.days;
      const recCount = (isAll ? totalSellers : s.sellers.filter(x => x !== '*').length) + (s.include_executive ? 1 : 0);
      const recDesc = `${__schedSellersDisplay(s.sellers, totalSellers)}${s.include_executive ? ' + ผู้บริหาร' : ''}`;
      const modeDesc = s.test_target ? `${ic('lucide:flask-conical',16)} test → ${s.test_target.slice(0,12)}...` : 'ส่งจริง';

      let html = `<div style="border:.5px solid var(--bd);border-radius:10px;margin-bottom:8px;overflow:hidden;${s.enabled?'':'opacity:.6'}">`;

      // Header (clickable to expand)
      html += `<div style="display:grid;grid-template-columns:auto 70px auto 1fr auto auto;gap:8px;align-items:center;padding:10px 12px;background:var(--bg2);cursor:pointer" onclick="__schedExpand(${i})">
        <label style="display:flex;align-items:center;cursor:pointer" onclick="event.stopPropagation()"><input type="checkbox" ${s.enabled?'checked':''} onchange="__schedRows[${i}].enabled=this.checked;__schedRedraw()" style="cursor:pointer"></label>
        <span style="font-family:monospace;font-weight:700;color:var(--t1);font-size:13px">${ic('lucide:alarm-clock',16)} ${h(s.time)}</span>
        <span style="font-size:11px;color:var(--t2);background:var(--bg);padding:2px 8px;border-radius:8px">${h(daysLbl)}</span>
        <span style="font-size:12px;color:var(--t1);font-weight:600">${h(s.label||'-')}</span>
        <span style="font-size:10px;color:var(--t3)">${recCount} ผู้รับ · ${modeDesc}</span>
        <span style="font-size:14px;color:var(--t3)">${isOpen?'▲':'▼'}</span>
      </div>`;

      if (isOpen) {
        // Expanded edit form
        html += `<div style="padding:12px 14px;background:var(--bg)">`;

        // Row 1: time, day, label
        html += `<div style="display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;margin-bottom:12px;align-items:center">
          <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2)">${ic('lucide:alarm-clock',16)}<input type="time" value="${h(s.time)}" oninput="__schedRows[${i}].time=this.value" style="padding:6px 10px;border:.5px solid var(--bd2);border-radius:6px;background:var(--bg);color:var(--t1);font-size:12px;font-family:monospace"></label>
          <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2)">${ic('lucide:calendar',16)}<select onchange="__schedRows[${i}].days=this.value;__schedRedraw()" style="padding:6px 10px;border:.5px solid var(--bd2);border-radius:6px;background:var(--bg);color:var(--t1);font-size:12px">
            <option value="*" ${s.days==='*'?'selected':''}>ทุกวัน</option>
            <option value="1-5" ${s.days==='1-5'?'selected':''}>จ-ศ</option>
            <option value="0,6" ${s.days==='0,6'?'selected':''}>ส-อา</option>
            <option value="1" ${s.days==='1'?'selected':''}>จันทร์</option>
            <option value="5" ${s.days==='5'?'selected':''}>ศุกร์</option>
            ${!['*','1-5','0,6','1','5'].includes(s.days) ? `<option value="${h(s.days)}" selected>${h(s.days)}</option>` : ''}
          </select></label>
          <input value="${h(s.label||'')}" oninput="__schedRows[${i}].label=this.value" placeholder="ป้ายชื่อ (เช่น เช้าวันทำการ)" style="padding:6px 10px;border:.5px solid var(--bd2);border-radius:6px;background:var(--bg);color:var(--t1);font-size:12px;outline:none">
          <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2);cursor:pointer"><input type="checkbox" ${s.enabled?'checked':''} onchange="__schedRows[${i}].enabled=this.checked;__schedRedraw()">เปิด</label>
        </div>`;

        // Section: ผู้รับ — checkboxes by team
        html += `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div style="font-size:12px;font-weight:700;color:var(--t1)">ผู้รับ "ตามด่วน" (เลือกเซลล์ที่จะได้)</div>
            <div style="display:flex;gap:4px">
              <button onclick="__schedSetAllSellers(${i},true)" style="font-size:10px;padding:3px 8px;border-radius:6px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);cursor:pointer">เลือกทั้งหมด</button>
              <button onclick="__schedSetAllSellers(${i},false)" style="font-size:10px;padding:3px 8px;border-radius:6px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);cursor:pointer">ล้าง</button>
            </div>
          </div>`;

        // Group by team
        const teamGroups = {};
        sellersData.forEach(x => { (teamGroups[x.team] = teamGroups[x.team] || []).push(x); });
        const teamColors = C.TEAM_COLORS || {};

        Object.keys(teamGroups).sort().forEach(tid => {
          const color = teamColors[tid] || 'var(--t3)';
          html += `<div style="margin-bottom:6px;padding:8px 10px;background:var(--bg2);border-radius:8px;border-left:3px solid ${color}">
            <div style="font-size:11px;font-weight:600;color:${color};margin-bottom:4px">${tid === 'ADMIN' ? 'เทเลเซลล์' : 'ทีม ' + h(tid)} (${teamGroups[tid].length} คน)</div>
            <div style="display:flex;gap:4px 10px;flex-wrap:wrap">`;
          teamGroups[tid].forEach(seller => {
            const isChecked = checkedSet.has(seller.name);
            html += `<label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--t1);cursor:pointer;padding:3px 7px;border-radius:6px;background:${isChecked?'var(--blue-bg)':'transparent'}">
              <input type="checkbox" ${isChecked?'checked':''} onchange="__schedToggleSeller(${i},'${h(seller.name)}',this.checked)">${h(seller.name)}
            </label>`;
          });
          html += `</div></div>`;
        });

        // Executive toggle
        const execChecked = !!s.include_executive;
        html += `<div style="margin-top:6px;padding:9px 11px;background:${execChecked?'var(--purple-bg)':'var(--bg2)'};border-radius:8px;border:.5px solid ${execChecked?'var(--purple-mid)':'var(--bd)'}">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" ${execChecked?'checked':''} onchange="__schedRows[${i}].include_executive=this.checked;__schedRedraw()">
            <span style="font-size:12px;font-weight:700;color:${execChecked?'var(--purple)':'var(--t1)'}">ผู้บริหาร — รับ Overview Flex (สรุปยอดรวมทีม)</span>
          </label>
          <div style="font-size:10px;color:var(--t3);margin-top:3px;margin-left:24px;font-family:monospace">user_id (จาก env): ดู EXECUTIVE_USER_IDS</div>
        </div>`;

        html += `</div>`; // close ผู้รับ section

        // Test mode field
        html += `<div style="margin-top:10px;padding:9px 11px;background:var(--amber-bg);border:.5px solid var(--amber-mid);border-radius:8px">
          <label style="display:block;font-size:11px;color:var(--amber);font-weight:600;margin-bottom:5px">${ic('lucide:flask-conical',16)} Test mode — ใส่ user_id = ส่งทดสอบเข้า id นั้น (เว้นว่าง = ส่งเซลล์จริง)</label>
          <input value="${h(s.test_target||'')}" oninput="__schedRows[${i}].test_target=this.value" placeholder="ว่าง = ส่งจริง / ใส่ U... = test ส่งให้ตัวเอง" style="width:100%;padding:7px 10px;border:.5px solid var(--bd2);border-radius:6px;background:var(--bg);color:var(--t1);font-size:11px;outline:none;box-sizing:border-box;font-family:monospace">
        </div>`;

        // Delete + collapse
        html += `<div style="display:flex;justify-content:space-between;margin-top:12px">
          <button onclick="__schedDel(${i})" style="padding:6px 12px;border-radius:6px;border:.5px solid var(--red);background:var(--red-bg);color:var(--red);cursor:pointer;font-size:11px;font-weight:600">${ic('lucide:trash-2',16)} ลบตารางนี้</button>
          <button onclick="__schedExpand(${i})" style="padding:6px 12px;border-radius:6px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);cursor:pointer;font-size:11px">▲ ยุบ</button>
        </div>`;

        html += `</div>`; // close expanded
      }

      html += `</div>`; // close card
      return html;
    }

    function __schedRedraw() {
      const modal = document.querySelector('#cron-overlay > div');
      if (modal && modal.__schedMeta) drawSchedBody(modal, modal.__schedMeta);
    }
    function __schedExpand(i) {
      if (__expandedSched.has(i)) __expandedSched.delete(i);
      else __expandedSched.add(i);
      __schedRedraw();
    }
    function __schedSetAllSellers(i, on) {
      const allNames = (D.sellers || []).map(x => x.name);
      __schedRows[i].sellers = on ? allNames.slice() : [];
      __schedRedraw();
    }
    function __schedToggleSeller(i, name, on) {
      const arr = __schedRows[i].sellers;
      // Expand '*' to explicit if currently '*'
      const expanded = arr.includes('*')
        ? (D.sellers || []).map(x => x.name)
        : arr.slice();
      const idx = expanded.indexOf(name);
      if (on && idx === -1) expanded.push(name);
      else if (!on && idx !== -1) expanded.splice(idx, 1);
      __schedRows[i].sellers = expanded;
      __schedRedraw();
    }

    function drawSchedFooter(modal) {
      let footer = modal.querySelector('#sched-footer');
      if (!footer) {
        footer = document.createElement('div');
        footer.id = 'sched-footer';
        footer.style.cssText = 'padding:12px 16px;border-top:.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:10px';
        modal.appendChild(footer);
      }
      footer.innerHTML = `<div style="font-size:11px;color:var(--t3)">บันทึก = เขียนทับ tab "ตั้งเวลาส่ง"</div>
        <div style="display:flex;gap:8px">
          <button onclick="document.getElementById('cron-overlay').remove()" style="padding:8px 14px;border-radius:8px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);font-weight:600;font-size:12px;cursor:pointer">ปิด</button>
          <button id="sched-save-btn" onclick="__schedSave()" style="padding:8px 20px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-weight:700;font-size:13px;cursor:pointer">${ic('lucide:save',16)} บันทึก</button>
        </div>`;
    }

    function __schedAdd() {
      const newIdx = __schedRows.length;
      __schedRows.push({ time:'09:00', days:'*', sellers:['*'], test_target:'', enabled:true, label:'', include_executive:false });
      __expandedSched.add(newIdx); // auto-expand new row
      __schedRedraw();
    }
    function __schedDel(i) {
      if (!confirm(`ลบตาราง ${__schedRows[i]?.time || ''} ${__schedRows[i]?.label || ''}?`)) return;
      __schedRows.splice(i, 1);
      // Re-index expanded set
      const newSet = new Set();
      __expandedSched.forEach(idx => {
        if (idx < i) newSet.add(idx);
        else if (idx > i) newSet.add(idx - 1);
      });
      __expandedSched = newSet;
      __schedRedraw();
    }
    async function __schedSave() {
      const btn = document.getElementById('sched-save-btn');
      const msg = document.getElementById('sched-msg');
      for (let i = 0; i < __schedRows.length; i++) {
        const r = __schedRows[i];
        if (!r.time || !/^\d{1,2}:\d{2}$/.test(r.time)) {
          msg.innerHTML = `<div style="padding:8px 12px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">${ic('lucide:triangle-alert',16)} แถวที่ ${i+1}: เวลาผิด (ต้อง HH:MM)</div>`; return;
        }
      }
      btn.disabled = true; btn.textContent = '⏳ บันทึก...';
      msg.innerHTML = '';
      try {
        const res = await fetch('/api/admin/schedule_config', {
          method:'POST',
          headers:{'Content-Type':'application/json','X-CSRFToken': getCsrfToken(),'X-Requested-With':'XMLHttpRequest'},
          credentials:'same-origin',
          body: JSON.stringify({ schedules: __schedRows }),
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          msg.innerHTML = `<div style="padding:8px 12px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">${ic('lucide:triangle-alert',16)} ${h(data.error || 'failed')}</div>`;
        } else {
          msg.innerHTML = `<div style="padding:8px 12px;background:var(--green-bg);color:var(--green);border-radius:8px;font-size:11px;font-weight:600">${ic('lucide:circle-check',16)} บันทึก ${data.saved} ตารางเรียบร้อย</div>`;
        }
      } catch (e) {
        msg.innerHTML = `<div style="padding:8px 12px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">${ic('lucide:triangle-alert',16)} ${h(e.message)}</div>`;
      } finally {
        btn.disabled = false; btn.textContent = '💾 บันทึก';
      }
    }
    async function __schedTestTick() {
      const secret = document.getElementById('sched-test-secret').value.trim();
      const result = document.getElementById('sched-test-result');
      if (!secret) { result.innerHTML = `<div style="padding:8px 11px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">${ic('lucide:triangle-alert',16)} ต้องใส่ secret</div>`; return; }
      result.innerHTML = `<div style="padding:8px;color:var(--t3);font-size:11px">${ic('lucide:hourglass',16)} ยิง tick...</div>`;
      try {
        const res = await fetch(`/api/cron/tick?secret=${encodeURIComponent(secret)}`);
        const data = await res.json();
        if (!res.ok || data.error) {
          result.innerHTML = `<div style="padding:8px 11px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">${ic('lucide:triangle-alert',16)} ${h(data.error||'failed')}</div>`;
        } else {
          const fired = data.fired || 0;
          result.innerHTML = `<div style="padding:8px 11px;background:var(--green-bg);color:var(--green);border-radius:8px;font-size:11px">${ic('lucide:circle-check',16)} Now: ${h(data.now)} · Fired ${fired} schedule(s)${fired===0?' (ยังไม่ถึงเวลาใดเลย — เป็นเรื่องปกติ)':''}</div>`;
        }
      } catch (e) {
        result.innerHTML = `<div style="padding:8px 11px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">${ic('lucide:triangle-alert',16)} ${h(e.message)}</div>`;
      }
    }

    async function __cronTestFire() {
      const secret = document.getElementById('cron-test-secret').value.trim();
      const testMode = document.getElementById('cron-test-mode').checked;
      const target = document.getElementById('cron-test-target').value.trim();
      const result = document.getElementById('cron-test-result');

          result.innerHTML = `<div style="padding:8px 11px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">${ic('lucide:triangle-alert',16)} ${h(data.error || 'failed')}</div>`;

      html += `<table style="width:100%;font-size:12px;border-collapse:collapse">

          <th style="text-align:right;padding:6px 8px;color:var(--t3);font-weight:600;border-bottom:.5px solid var(--bd)">โทรแล้ว</th>
          <th style="text-align:right;padding:6px 8px;color:var(--t3);font-weight:600;border-bottom:.5px solid var(--bd)">ยังไม่โทร</th>
          <th style="text-align:right;padding:6px 8px;color:var(--t3);font-weight:600;border-bottom:.5px solid var(--bd)">ต้องตาม</th>

        </tr></thead><tbody>`;
      sellers.forEach(s => {
        const checked = __lsSelected.has(s.seller) ? 'checked' : '';
        const dis = !s.has_user_id ? 'disabled title="ไม่มี LINE user_id ในชีต — ไม่สามารถส่งได้"' : '';
        html += `<tr style="${!s.has_user_id?'opacity:.5;':''}">
          <td style="text-align:center;padding:6px 4px;border-bottom:.5px solid var(--bd)"><input type="checkbox" ${checked} ${dis} onchange="__lsToggle('${h(s.seller)}',this.checked)" style="cursor:pointer"></td>
          <td style="padding:8px;border-bottom:.5px solid var(--bd);color:var(--t1);font-weight:600">${h(sname(s.seller))}</td>
          <td style="text-align:right;padding:8px;border-bottom:.5px solid var(--bd);color:var(--green)">${s.called}</td>
          <td style="text-align:right;padding:8px;border-bottom:.5px solid var(--bd);color:var(--red)">${s.notCalled}</td>
          <td style="text-align:right;padding:8px;border-bottom:.5px solid var(--bd);color:var(--amber)">${s.followUp}</td>
          <td style="text-align:center;padding:8px;border-bottom:.5px solid var(--bd)">${s.has_user_id?'<span style="color:var(--green)">✓</span>':'<span style="color:var(--red)">✗</span>'}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
      html += `<div style="margin-top:14px;padding:10px 12px;background:var(--amber-bg);border:.5px solid var(--amber-mid);border-radius:10px">
        <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--amber);font-weight:600;cursor:pointer">
          <input type="checkbox" ${__lsTestMode?'checked':''} onchange="__lsToggleTest(this.checked)"> ${ic('lucide:flask-conical',16)} Test mode — ส่งทุกข้อความไปที่ user_id ที่กำหนด (ไม่ส่งจริงไปเซลล์)
        </label>
        <input id="ls-test-uid" type="text" value="${h(__lsTestUid)}" oninput="__lsTestUid=this.value" placeholder="U6bf1d72cf1d7e237c3a5c9848dde9bf4" style="display:${__lsTestMode?'block':'none'};margin-top:8px;width:100%;padding:8px 11px;border:.5px solid var(--bd2);border-radius:8px;background:var(--bg2);color:var(--t1);font-size:12px;outline:none;font-family:monospace;box-sizing:border-box">
        <div id="ls-test-hint" style="display:${__lsTestMode?'block':'none'};margin-top:6px;font-size:10px;color:var(--amber)">หมายเหตุ:ถ้าไม่ติ๊กเซลล์ใดเลย → จะส่งตามด่วนของ <b>ทุกเซลล์ที่มีข้อมูล</b> ไปที่ user_id นี้</div>
      </div>`;
      html += `<div id="ls-result" style="margin-top:12px"></div>`;

      // footer

      if (!footer) {
        footer = document.createElement('div');
        footer.id = 'ls-footer';
        footer.style.cssText = 'padding:12px 16px;border-top:.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:10px';
        modal.appendChild(footer);

      footer.innerHTML = `<div style="font-size:11px;color:var(--t3)">ทั้งหมด: <b id="ls-count2">${__lsSelected.size}</b> คน</div>
        <button id="ls-send-btn" onclick="__lsSend()" style="padding:9px 18px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-weight:700;font-size:13px;cursor:pointer">${ic('lucide:send',16)} ส่ง</button>`;
    }
    function __lsToggle(name, on) {
      if (on) __lsSelected.add(name); else __lsSelected.delete(name);
      const a = document.getElementById('ls-count'); if (a) a.textContent = __lsSelected.size;
      const b = document.getElementById('ls-count2'); if (b) b.textContent = __lsSelected.size;
    }
    function __lsSelectAll(on) {
      const overlay = document.getElementById('cron-overlay');
      if (!overlay) return;
      // ใช้ selector แคบเพื่อกัน Test mode checkbox โดน match ไปด้วย
      overlay.querySelectorAll('input[type=checkbox][onchange^="__lsToggle(\'"]').forEach(cb => {
        if (cb.disabled) return;
        cb.checked = on;
        const m = (cb.getAttribute('onchange') || '').match(/'([^']+)'/);
        if (!m) return;
        const name = m[1];
        if (on) __lsSelected.add(name); else __lsSelected.delete(name);
      });
      const a = document.getElementById('ls-count'); if (a) a.textContent = __lsSelected.size;
      const b = document.getElementById('ls-count2'); if (b) b.textContent = __lsSelected.size;
    }
    function __lsToggleTest(on) {
      __lsTestMode = on;
      const inp = document.getElementById('ls-test-uid');
      if (inp) inp.style.display = on ? 'block' : 'none';
      const hint = document.getElementById('ls-test-hint');
      if (hint) hint.style.display = on ? 'block' : 'none';
    }
    async function __lsSend() {
      const btn = document.getElementById('ls-send-btn');
      const result = document.getElementById('ls-result');
      // Test mode: ถ้าไม่เลือก → ส่งทุกเซลล์ไป test user_id
      // Production: ต้องเลือกอย่างน้อย 1 คน
      if (!__lsTestMode && __lsSelected.size === 0) {
        result.innerHTML = `<div style="padding:10px 12px;background:var(--red-bg);color:var(--red);border-radius:10px;font-size:12px">${ic('lucide:triangle-alert',16)} กรุณาเลือกเซลล์อย่างน้อย 1 คน</div>`;
        return;
      }
      if (__lsTestMode && !__lsTestUid.trim()) {
        result.innerHTML = `<div style="padding:10px 12px;background:var(--red-bg);color:var(--red);border-radius:10px;font-size:12px">${ic('lucide:triangle-alert',16)} Test mode ต้องกรอก target user_id</div>`;
        return;
      }
      const sellersToSend = __lsSelected.size > 0 ? Array.from(__lsSelected) : [];
      const countLabel = sellersToSend.length > 0 ? `${sellersToSend.length} คน` : 'ทุกเซลล์ที่มีข้อมูล';
      if (!confirm(`ยืนยันส่งแจ้งเตือน "ตามด่วน" (${countLabel})?${__lsTestMode?' [Test mode → '+__lsTestUid.trim().slice(0,20)+'...]':''}`)) return;
      btn.disabled = true; btn.textContent = 'กำลังส่ง...';
      result.innerHTML = `<div style="padding:10px;color:var(--t3);font-size:12px">${ic('lucide:hourglass',16)} กำลังส่ง...</div>`;
      try {
        const payload = {
          test: __lsTestMode,
          target_user_id: __lsTestMode ? __lsTestUid.trim() : '',
        };
        // ส่ง sellers filter เฉพาะตอนเลือก, ถ้าไม่ส่ง backend จะใช้ทุกเซลล์
        if (sellersToSend.length > 0) payload.sellers = sellersToSend;
        const res = await fetch('/api/admin/send_followup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken(), 'X-Requested-With': 'XMLHttpRequest' },
          credentials: 'same-origin',
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          result.innerHTML = `<div style="padding:10px 12px;background:var(--red-bg);color:var(--red);border-radius:10px;font-size:12px">${ic('lucide:triangle-alert',16)} ${h(data.error || 'ส่งล้มเหลว')}</div>`;
        } else {
          const results = data.results || [];
          const ok = results.filter(r => r.sent);
          const fail = results.filter(r => !r.sent);
          const headerColor = fail.length === 0 ? 'var(--green)' : (ok.length === 0 ? 'var(--red)' : 'var(--amber)');
          const headerBg = fail.length === 0 ? 'var(--green-bg)' : (ok.length === 0 ? 'var(--red-bg)' : 'var(--amber-bg)');
          const headerIcon = fail.length === 0 ? '✅' : (ok.length === 0 ? '❌' : '⚠️');
          let _now = ''; try { _now = ' · ' + new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); } catch(e){}
          const _mode = data.test_mode ? ' · 🧪 test' : '';
          let html = `<div style="padding:10px 12px;background:${headerBg};color:${headerColor};border-radius:10px;font-size:12px;font-weight:600">${headerIcon} สำเร็จ ${ok.length}/${data.count ?? results.length} · ล้มเหลว ${fail.length}${_now}${_mode}</div>`;

          // ${ic('lucide:circle-check',16)} Success list — แสดงทุกคนที่ส่งสำเร็จ
          if (ok.length) {
            html += `<div style="margin-top:8px;padding:10px 12px;background:var(--green-bg);border-radius:10px;font-size:11px"><div style="color:var(--green);font-weight:700;margin-bottom:6px">${ic('lucide:circle-check',16)} ส่งสำเร็จ (${ok.length})</div>`;
            ok.forEach(r => {
              const _nm = r.seller || r.user_id || '(ไม่ทราบ)';
              const _id = r.user_id ? `<span style="color:var(--t3);font-size:10px;font-family:monospace">${h(r.user_id.slice(0,8))}…${h(r.user_id.slice(-4))}</span>` : '';
              html += `<div style="padding:2px 0;color:var(--t1)">✓ ส่งไปที่ <b>${h(_nm)}</b> ${_id}</div>`;
            });
            html += `</div>`;
          }

          // ${ic('lucide:circle-x',16)} Failure list — แสดงทุกคนที่ล้มเหลว + เหตุผล
          if (fail.length) {
            html += `<div style="margin-top:8px;padding:10px 12px;background:var(--red-bg);border-radius:10px;font-size:11px"><div style="color:var(--red);font-weight:700;margin-bottom:6px">${ic('lucide:circle-x',16)} ล้มเหลว (${fail.length})</div>`;
            fail.forEach(f => {
              const _id = f.user_id ? ` <span style="color:var(--t3);font-size:10px;font-family:monospace">${h(f.user_id.slice(0,8))}…</span>` : '';
              html += `<div style="margin-bottom:4px;padding:4px 0;border-bottom:.5px solid rgba(0,0,0,.05)">✗ <b style="color:var(--red)">${h(f.seller)}</b>${_id} <span style="color:var(--t3);font-size:10px">— ${h(f.error || 'unknown')}</span></div>`;
            });
            html += `</div>`;
          }
          result.innerHTML = html;
        }
      } catch (e) {
        result.innerHTML = `<div style="padding:10px 12px;background:var(--red-bg);color:var(--red);border-radius:10px;font-size:12px">${ic('lucide:triangle-alert',16)} ${h(e.message)}</div>`;
      } finally {
        btn.disabled = false; btn.textContent = '📤 ส่ง';
      }
    }

    // ── LINE ID Panel (admin only) ──
    let __empPanelFilter = '';
    function openLineIdPanel() {
      if (!isAdmin) return;
      const overlay = document.createElement('div');
      overlay.id = 'line-id-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
      const modal = document.createElement('div');
      modal.style.cssText = 'background:var(--bg);border-radius:14px;max-width:760px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden';
      modal.onclick = (e) => e.stopPropagation();
      overlay.appendChild(modal);
      document.body.appendChild(overlay);
      renderEmpPanel(modal);
    }
    function renderEmpPanel(modal) {
      const emps = (D.employees || []).slice();
      // จัดเรียง: admin > executive/ผู้บริหาร > เซลล์ > อื่นๆ
      const rank = (p) => {
        const x = (p||'').toLowerCase();
        if (x === 'admin') return 0;
        if (['executive','ผู้บริหาร','manager','exec'].includes(x) || p === 'ผู้บริหาร') return 1;
        if (x === 'seller' || x === 'sale' || x === 'sales') return 2;
        return 3;
      };
      emps.sort((a,b) => {
        const r = rank(a.position) - rank(b.position);
        if (r) return r;
        return (a.nickname||'').localeCompare(b.nickname||'','th');
      });
      const q = __empPanelFilter.trim().toLowerCase();
      const filtered = q ? emps.filter(e =>
        (e.nickname||'').toLowerCase().includes(q) ||
        (e.display_name||'').toLowerCase().includes(q) ||
        (e.position||'').toLowerCase().includes(q) ||
        (e.user_id||'').toLowerCase().includes(q)
      ) : emps;

      const posChip = (p) => {
        const x = (p||'').toLowerCase();
        if (x === 'admin') return `<span style="background:var(--amber-bg);color:var(--amber);padding:1px 7px;border-radius:8px;font-size:10px;font-weight:700">Admin</span>`;
        if (['executive','ผู้บริหาร','manager','exec'].includes(x) || p === 'ผู้บริหาร') return `<span style="background:var(--purple-bg);color:var(--purple);padding:1px 7px;border-radius:8px;font-size:10px;font-weight:700">ผู้บริหาร</span>`;
        if (!p) return `<span style="background:var(--bg2);color:var(--t3);padding:1px 7px;border-radius:8px;font-size:10px">—</span>`;
        return `<span style="background:var(--blue-bg);color:var(--blue);padding:1px 7px;border-radius:8px;font-size:10px;font-weight:600">${h(p)}</span>`;
      };
      const shortId = (id) => id ? (id.slice(0,8)+'…'+id.slice(-4)) : '—';

      let body = `<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:.5px solid var(--bd)">`;
      body += `<div style="font-size:15px;font-weight:700;color:var(--t1)">ข้อมูลพนักงาน <span style="font-size:11px;color:var(--t3);font-weight:400">(${emps.length} คน · แสดง ${filtered.length})</span></div>`;
      body += `<button onclick="document.getElementById('line-id-overlay').remove()" style="background:transparent;border:none;font-size:20px;color:var(--t3);cursor:pointer;line-height:1">✕</button>`;
      body += `</div>`;
      body += `<div style="padding:10px 16px;border-bottom:.5px solid var(--bd)">`;
      body += `<input id="emp-filter" type="text" placeholder="🔍 ค้นหา ชื่อเล่น / display name / ตำแหน่ง / user_id" value="${h(__empPanelFilter)}" style="width:100%;padding:7px 11px;border:.5px solid var(--bd2);border-radius:10px;background:var(--bg2);color:var(--t1);font-size:12px;outline:none">`;
      body += `</div>`;
      body += `<div style="overflow-y:auto;padding:8px 12px;flex:1">`;
      if (filtered.length === 0) {
        body += `<div style="text-align:center;padding:32px;color:var(--t3);font-size:13px">ไม่พบพนักงานที่ตรงกับคำค้น</div>`;
      } else {
        body += `<div style="display:flex;flex-direction:column;gap:8px">`;
        filtered.forEach(e => {
          const pic = e.picture_url && /^https?:/i.test(e.picture_url)
            ? `<img src="${h(e.picture_url)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" style="width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0">`
            : '';
          const initial = (e.nickname || e.display_name || '?').charAt(0);
          const fallback = `<div style="${pic?'display:none;':''}width:42px;height:42px;border-radius:50%;background:var(--blue-bg);color:var(--blue);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">${h(initial)}</div>`;
          body += `<div style="display:flex;align-items:center;gap:12px;padding:10px 12px;border:.5px solid var(--bd);border-radius:10px">`;
          body += pic + fallback;
          body += `<div style="flex:1;min-width:0">`;
          body += `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span style="font-size:13px;font-weight:700;color:var(--t1)">${h(e.nickname||'—')}</span>${posChip(e.position)}</div>`;
          body += `<div style="font-size:11px;color:var(--t2);margin-top:2px">${h(e.display_name||'—')}</div>`;
          body += `<div style="font-size:10px;color:var(--t3);margin-top:3px;font-family:monospace;display:flex;gap:10px;flex-wrap:wrap">`;
          body += `<span title="${h(e.user_id)}">UID: ${h(shortId(e.user_id))}</span>`;
          if (e.group_id) body += `<span title="${h(e.group_id)}">GID: ${h(shortId(e.group_id))}</span>`;
          body += `</div></div>`;
          body += `<div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">`;
          body += `<button onclick="navigator.clipboard.writeText('${h(e.user_id)}').then(()=>{this.textContent='✓ copied';setTimeout(()=>this.textContent='📋 user_id',1200)})" style="font-size:10px;padding:4px 9px;border-radius:8px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);cursor:pointer;white-space:nowrap">${ic('lucide:clipboard-list',16)} user_id</button>`;
          if (e.group_id) body += `<button onclick="navigator.clipboard.writeText('${h(e.group_id)}').then(()=>{this.textContent='✓ copied';setTimeout(()=>this.textContent='📋 group_id',1200)})" style="font-size:10px;padding:4px 9px;border-radius:8px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);cursor:pointer;white-space:nowrap">${ic('lucide:clipboard-list',16)} group_id</button>`;
          body += `</div></div>`;
        });
        body += `</div>`;
      }
      body += `</div>`;
      body += `<div style="padding:10px 16px;background:var(--amber-bg);color:var(--amber);font-size:11px;line-height:1.5;border-top:.5px solid var(--bd)">หมายเหตุ:ใช้ <code>user_id</code> สำหรับ <b>LINE Push Message</b> รายบุคคล · ใช้ <code>group_id</code> สำหรับยิงเข้ากลุ่ม</div>`;
      modal.innerHTML = body;

      const inp = modal.querySelector('#emp-filter');
      if (inp) {
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
        inp.oninput = (ev) => { __empPanelFilter = ev.target.value; renderEmpPanel(modal); };
      }
    }

    // ── Init ──
    document.getElementById('loading').style.display='none';
    root.style.display='block';
    render();
  </script>
  {% endif %}
</body>
</html>
