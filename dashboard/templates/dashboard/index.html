    // ── Seller Bookings modal — แสดงรายการ booking (จอง/ปล่อย/...) ของเซลล์รายคน ──
    function openSellerBookingsModal(sellerName, statusFilter, noteText) {
      const old = document.getElementById('seller-bookings-overlay');
      if (old) old.remove();

      const periodLbl = '📅 '+rangeLabelTH();
      // Filter bookings ของเซลล์ตาม period (ปล่อย ใช้ releaseDate, อื่นๆ ใช้ b.date)
      const allBookings = (D.bookingCases || []).filter(b => {
        if (b.seller !== sellerName) return false;
        if (statusFilter !== 'all' && b.status !== statusFilter) return false;
        // ${ic('lucide:calendar',16)} กรองตามช่วงวันที่ (ปล่อย → วันปล่อย, อื่นๆ → วันจอง)
        const useDate = (b.status === 'ปล่อย' ? (b.releaseDate || b.date) : b.date) || '';
        if (!ir(useDate)) return false;
        return true;
      });
      // sort: status order แล้ว date ใหม่ก่อน
      const statusOrd = {"จอง":1,"รอเซ็นต์":2,"รอผล":3,"รอปล่อย":4,"ปล่อย":5,"รีเจ็ก":6};
      allBookings.sort((a,b) => {
        const sa = statusOrd[a.status]||9, sb = statusOrd[b.status]||9;
        if (sa !== sb) return sa - sb;
        return (b.date||'').localeCompare(a.date||'');
      });

      const totalDealValue = allBookings.filter(b => b.status === 'ปล่อย').reduce((a,b) => a + (Number(b.price)||0), 0);

      const overlay = document.createElement('div');
      overlay.id = 'seller-bookings-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

      const statusEmoji = {"จอง":"🟡","รอเซ็นต์":"🔵","รอผล":"🟠","รอปล่อย":"🟣","ปล่อย":"🏁","รีเจ็ก":"❌","all":"📋"};
      const titleEmoji = statusEmoji[statusFilter] || '📋';
      const titleStatus = statusFilter === 'all' ? 'ทุกสถานะ' : statusFilter;

      let inner = `<div style="background:var(--bg);border-radius:14px;max-width:820px;width:100%;max-height:85vh;overflow-y:auto;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.35)">`;
      inner += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap">`;
      inner += `<div><div style="font-size:11px;color:var(--t3)">${h(periodLbl)}</div><div style="font-size:18px;font-weight:800">${titleEmoji} ${h(sellerName)} — ${h(titleStatus)} ${allBookings.length} เคส</div></div>`;
      inner += `<button onclick="document.getElementById('seller-bookings-overlay').remove()" style="background:var(--bg2);border:.5px solid var(--bd2);color:var(--t2);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px">✕ ปิด</button>`;
      inner += `</div>`;

      // Summary: ยอดเงินรวม + breakdown by status
      if (totalDealValue > 0) {
        inner += `<div style="padding:10px;background:var(--green-bg);border-radius:8px;margin-bottom:12px;text-align:center"><div style="font-size:10px;color:var(--t3)">${ic('lucide:wallet',16)} ยอดรวม (ปล่อย)</div><div style="font-size:22px;font-weight:800;color:var(--green-mid)">${fmtBaht(totalDealValue)}</div></div>`;
      }
      if (statusFilter === 'all' && allBookings.length > 0) {
        const stCounts = {};
        allBookings.forEach(b => { stCounts[b.status] = (stCounts[b.status]||0) + 1; });
        inner += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">`;
        Object.entries(stCounts).forEach(([st,n]) => {
          const c = (C.STATUS_COLOR||{})[st] || '#888';
          inner += `<span style="background:${c}22;color:${c};padding:4px 10px;border-radius:14px;font-size:11px;font-weight:600">${h(st)}: ${n}</span>`;
        });
        inner += `</div>`;
      }

      // ตาราง bookings
      if (allBookings.length > 0) {
        inner += `<div style="border:.5px solid var(--bd);border-radius:8px;max-height:420px;overflow-y:auto">`;
        inner += `<div style="display:grid;grid-template-columns:.7fr 1.1fr 1.4fr .6fr .8fr .8fr;gap:6px;padding:7px 10px;font-size:10px;color:var(--t3);font-weight:600;background:var(--bg2);border-bottom:.5px solid var(--bd);position:sticky;top:0"><span>สถานะ</span><span>ลูกค้า</span><span>รถ</span><span>เบอร์</span><span>วันที่</span><span style="text-align:right">ราคา</span></div>`;
        allBookings.forEach(b => {
          const stCol = (C.STATUS_COLOR||{})[b.status] || '#888';
          const dateShow = b.status === 'ปล่อย' ? (b.releaseDate || b.date) : b.date;
          inner += `<div style="display:grid;grid-template-columns:.7fr 1.1fr 1.4fr .6fr .8fr .8fr;gap:6px;padding:8px 10px;font-size:11px;border-bottom:.5px solid var(--bd);align-items:center">`;
          inner += `<span style="background:${stCol}22;color:${stCol};padding:2px 8px;border-radius:10px;font-weight:600;text-align:center;font-size:10px">${h(b.status)}${b.isCash?' 💵':''}</span>`;
          inner += `<span style="color:var(--t1);font-weight:500">${h((b.customer||'').slice(0,20))}</span>`;
          inner += `<span style="color:var(--t2)">${h((b.car||'').slice(0,30))}</span>`;
          inner += `<span style="color:var(--blue);font-family:monospace;font-size:10px">${h(b.phone||'-')}</span>`;
          inner += `<span style="font-family:monospace;color:var(--t3);font-size:10px">${h(dateShow||'-')}</span>`;
          inner += `<span style="text-align:right;color:var(--green-mid);font-weight:600">${b.price>0?fmtBaht(b.price):'-'}</span>`;
          inner += `</div>`;
        });
        inner += `</div>`;
      } else {
        const emptyMsg = noteText || `ยังไม่มีเคส "${titleStatus}" ใน${periodLbl}`;
        inner += `<div style="padding:24px;text-align:center;color:var(--t3);font-size:13px">${h(emptyMsg)}</div>`;
      }

      inner += `<div style="font-size:10px;color:var(--t3);margin-top:10px;line-height:1.5">หมายเหตุ:รายการจาก sales_reports (รายงานฝ่ายขาย) · กรอง: ${h(titleStatus)} · period: ${h(periodLbl)}</div>`;
      inner += `</div>`;
      overlay.innerHTML = inner;
      document.body.appendChild(overlay);
    }

    // ── Follow cases section ──
    function renderFollowCasesSection() {
      let cases = (FD.followCases||[]).filter(l=>ir(l.dateIn));
      if(followFilter==='notcalled') cases=cases.filter(l=>l.updateCount===0);
      else if(followFilter==='hot') cases=cases.filter(l=>l.updateCount>=3);
      if(followFilter==='recent') cases.sort((a,b)=>{const pa=a.lastUpdate&&a.lastUpdate!=='-';const pb=b.lastUpdate&&b.lastUpdate!=='-';if(!pa&&!pb)return 0;if(!pa)return 1;if(!pb)return -1;return new Date(b.lastUpdate)-new Date(a.lastUpdate);});
      else cases.sort((a,b)=>urg(b)-urg(a));

      let html = `<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px">`;
      html += `<div class="card-title" style="margin:0">${ic('lucide:phone',16)} เคสติดตาม <span style="font-size:11px;font-weight:400;color:var(--t3)">(${cases.length} เคส)</span></div><div class="card-sub">เคสที่ยังต้องโทรต่อ — เร่งด่วนก่อน คือเคสที่อัพเดทน้อยที่สุด</div>`;
      html += `<select onchange="followFilter=this.value;render()"><option value="urgent" ${followFilter==='urgent'?'selected':''}>เร่งด่วนก่อน</option><option value="notcalled" ${followFilter==='notcalled'?'selected':''}>ยังไม่โทร</option><option value="hot" ${followFilter==='hot'?'selected':''}>ติดตาม 3+x</option><option value="recent" ${followFilter==='recent'?'selected':''}>อัพเดทล่าสุด</option></select></div>`;
      html += `<div class="lfhdr"><span>Code · เซลล์</span><span>หมายเหตุ / รถ</span><span style="text-align:right">อัพ</span></div>`;
      html += `<div style="max-height:480px;overflow-y:auto">`;
      if(cases.length===0) html += `<div style="text-align:center;color:var(--t3);padding:18px;font-size:12px">ไม่มีเคสติดตาม</div>`;
      cases.slice(0,50).forEach(l=>{
        const cls = l.updateCount===0?'lfrow hr':nc(l.updateCount)>=2?'lfrow ha':l.updateCount>=3?'lfrow hb':'lfrow';
        const carHas = !nocar(l.car);
        html += `<div class="${cls}" onclick="openCaseFromOverview('${h(l.code)}','${h(l.seller)}')">`;
        html += `<div><div style="font-weight:700;font-size:11px;color:var(--blue)">${h(l.code)}</div><div style="font-size:10px;color:var(--t2);margin-top:1px">${h(l.seller)}</div><div style="font-size:10px;color:var(--t3)">${l.lastUpdate&&l.lastUpdate!=='-'?h(l.lastUpdate):'ยังไม่อัพเดท'}</div></div>`;
        html += `<div><div style="font-size:11px;color:var(--t2);line-height:1.5">${h((l.note||'-').slice(0,80))}</div>`;
        if(carHas) html += `<div style="font-size:10px;color:var(--t3);margin-top:2px">${ic('lucide:car-front',16)} ${h(l.car)}</div>`;
        html += `<div style="margin-top:3px">${urgBadge(l)}</div></div>`;
        html += `<div>${dotsHtml(l.updateCount)}</div></div>`;
      });
      html += `</div></div>`;
      return html;
    }

    function renderHotCases(sellerNames) {

      });

    // ── ACTIVITY TAB ──
    function renderActivity(sellers) {
      const la = D.liveActivity || {totalInbox:0,totalLead:0,totalSessions:0,byHost:{},sessions:[]};
      const periodLbl = '📅 '+rangeLabelTH();

      // ${ic('lucide:calendar',16)} Filter sessions ตามช่วงวันที่ที่กรอง
      const allSessions = la.sessions || [];
      const filteredSessions = allSessions.filter(s => ir(s.date || ''));

      // Aggregate per-seller จาก filtered sessions
      const liveByHost = {};
      const inboxByHost = {};
      let totalInbox = 0, totalLead = 0;
      filteredSessions.forEach(s => {
        totalInbox += Number(s.inbox || 0);
        totalLead += Number(s.lead || 0);
        (s.hosts || []).forEach(host => {
          if (!host) return;  // hosts จาก backend normalize_seller มาแล้ว
          liveByHost[host] = (liveByHost[host]||0) + 1;
          inboxByHost[host] = (inboxByHost[host]||0) + Number(s.inbox || 0);
        });
      });
      const totLive = filteredSessions.length;

      // คลิป TikTok: กรองตามช่วงวันที่ถ้า backend ส่ง la.clips (มีวันที่รายคลิป) · เกณฑ์ = อาทิตย์ละ 2
      const _hasClips = Array.isArray(la.clips);
      const clipList = _hasClips ? la.clips.filter(c=>ir(c.date||'')) : [];
      const clipByHost = {};
      if (_hasClips) clipList.forEach(c=>{ clipByHost[c.name]=(clipByHost[c.name]||0)+1; });
      else sellers.forEach(s=>{ clipByHost[s.name]=s.clip||0; });   // fallback: ยอดทั้งปี (ก่อน deploy ใหม่)
      const totClip = _hasClips ? clipList.length : sellers.reduce((a,s)=>a+(s.clip||0),0);
      // เป้า = จำนวนสัปดาห์ในช่วง (ไม่เกินวันนี้) × 2
      const _cToday = new Date(); _cToday.setHours(0,0,0,0);
      const _cFrom = dfFrom ? new Date(dfFrom) : null;
      let _cTo = dfTo ? new Date(dfTo) : _cToday; if(_cTo>_cToday) _cTo=_cToday;
      const _cDays = (_cFrom && _cTo>=_cFrom) ? Math.floor((_cTo-_cFrom)/86400000)+1 : 7;
      const clipTarget = _hasClips ? Math.max(2, Math.ceil(_cDays/7)*2) : ((sellers[0]&&sellers[0].clipTarget)||4);
      const _clipLbl = _hasClips ? periodLbl : 'ทั้งปี';

      let html = `<div style="font-size:11px;color:var(--t3);margin-bottom:8px">${ic('lucide:calendar',16)} ข้อมูลในช่วง <b style="color:var(--blue)">${h(periodLbl)}</b> (กรองจากตัวเลือกบนหัว)</div>`;
      html += `<div class="g3">`;
      [{l:"ไลฟ์รวม",v:totLive+" ครั้ง",s:`session ในช่วงนี้`,c:"var(--blue)",tip:`จำนวนเซสชั่นไลฟ์ในช่วง ${periodLbl}\nกรองจาก sheet 'live_sessions' ตามวันที่`},
       {l:"Inbox รวม",v:fmtNum(totalInbox),s:fmtNum(totalLead)+" lead จากไลฟ์",c:"var(--green)",tip:"จำนวน inbox + lead ที่ได้จากไลฟ์ในช่วงนี้\nรวมจากทุกเซสชั่นที่ filter"},
       {l:"คลิปรวม",v:totClip+" คลิป",s:sellers.filter(s=>(clipByHost[s.name]||0)>=clipTarget).length+" คน ถึงเป้า ("+clipTarget+"/คน)",c:"var(--purple-mid)",tip:"จำนวนคลิป TikTok ในช่วงที่เลือก\nเกณฑ์: อาทิตย์ละ 2 คลิป → เป้า = สัปดาห์ในช่วง × 2\nจาก sheet 'ติดตามไลฟ์สด'"}
      ].forEach(k=>{
        const tipBtn = k.tip ? `<span class="info-tip" tabindex="0" data-tip="${h(k.tip)}">?</span>` : '';
        html += `<div class="card" style="margin:0;text-align:center"><div class="kl">${k.l}${tipBtn}</div><div class="kv" style="color:${k.c}">${k.v}</div><div class="ks">${k.s}</div></div>`;
      });
      html += `</div>`;

      // 2-col: live + clips
      html += `<div class="g2">`;
      // Live — sort + display ตาม filtered data
      html += `<div class="card" style="margin:0"><div class="card-title">${ic('lucide:radio',16)} ไลฟ์สด <span style="font-size:11px;color:var(--t3);font-weight:400">${h(periodLbl)}</span><span class="info-tip" tabindex="0" data-tip="จำนวนเซสชั่นไลฟ์ของเซลล์ในช่วงนี้\nนับจาก field 'hosts' (เจ้าภาพ) แต่ละ session\n📥 = inbox ที่ได้จากเซสชั่นนั้น">?</span></div>`;
      html += `<div class="act-hdr"><span>เซลล์</span><span>จำนวนครั้ง</span><span style="text-align:right">inbox</span></div>`;
      const liveSorted = [...sellers].map(s => ({...s, _live: liveByHost[s.name]||0, _inbox: inboxByHost[s.name]||0}))
        .filter(s => s._live > 0)
        .sort((a,b)=>b._live - a._live);
      if (liveSorted.length === 0) html += `<div style="padding:12px;text-align:center;color:var(--t3);font-size:12px">ไม่มีไลฟ์ในช่วงนี้</div>`;
      liveSorted.forEach(s=>{
        html += `<div class="act-row" onclick="switchToSeller('${h(s.name)}')"><span style="font-weight:500">${h(sname(s.name))}</span><span style="font-size:12px;font-weight:600;color:var(--blue)">${s._live} ครั้ง</span><span style="text-align:right;font-size:11px;color:var(--t3)">${ic('lucide:inbox',16)}${s._inbox}</span></div>`;
      });
      html += `</div>`;
      // Clips — กรองตามช่วงวันที่ (clipByHost) · เป้าอาทิตย์ละ 2 (clipTarget)
      html += `<div class="card" style="margin:0"><div class="card-title">คลิป TikTok <span style="font-size:11px;color:var(--t3);font-weight:400">${h(_clipLbl)} · เป้า ${clipTarget}</span><span class="info-tip" tabindex="0" data-tip="คลิป TikTok ที่เซลล์ทำ ในช่วงที่เลือก / เป้าหมาย\nเกณฑ์: อาทิตย์ละ 2 คลิป → เป้า = สัปดาห์ในช่วง × 2 = ${clipTarget}\nจาก sheet 'ติดตามไลฟ์สด'">?</span></div>`;
      html += `<div class="act-hdr"><span>เซลล์</span><span>คลิป/เป้า</span><span style="text-align:right">สถานะ</span></div>`;
      [...sellers].map(s=>({name:s.name,_clip:clipByHost[s.name]||0})).sort((a,b)=>b._clip-a._clip).forEach(s=>{
        const ok=s._clip>=clipTarget; const p=clipTarget>0?Math.min((s._clip/clipTarget)*100,100):0;
        html += `<div class="act-row" onclick="switchToSeller('${h(s.name)}')"><span style="font-weight:500">${h(s.name)}</span><div style="display:flex;align-items:center;gap:5px"><div style="flex:1;height:5px;border-radius:3px;background:var(--bg3);overflow:hidden"><div style="height:100%;border-radius:3px;width:${p}%;background:${ok?'var(--green-mid)':'var(--purple-mid)'}"></div></div><span style="font-size:10px;color:${ok?'var(--green)':'var(--amber)'}">${s._clip}/${clipTarget}</span></div><span style="text-align:right;font-size:11px">${ok?'ครบ':'ขาด '+(clipTarget-s._clip)}</span></div>`;
      });
      html += `</div></div>`;

      // Sessions list — ใช้ filteredSessions แล้ว + filter ทีมเพิ่มเติม
      let sessions = [...filteredSessions];
      if(liveTeam!=='all') sessions=sessions.filter(s=>s.team===liveTeam);
      sessions.sort((a,b)=>String(b.date)>String(a.date)?1:-1);
      const liveTeams = [...new Set((la.sessions||[]).map(s=>s.team).filter(Boolean))].sort();

      html += `<div class="card" style="margin-top:0"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px">`;
      html += `<div class="card-title" style="margin:0">${ic('lucide:tv',16)} ไลฟ์รายครั้ง <span style="font-size:11px;font-weight:400;color:var(--t3)">${h(periodLbl)}${liveTeam!=='all'?' · ทีม '+liveTeam:''} (${sessions.length})</span><span class="info-tip" tabindex="0" data-tip="รายการเซสชั่นไลฟ์ตามวันที่ ในช่วงที่เลือก\nกรองเดือนจากตัวเลือกบนหัว / กรองทีมจาก dropdown ขวา\nแสดง 30 รายการล่าสุด">?</span></div>`;
      html += `<div style="display:flex;gap:6px;align-items:center">`;
      html += `<select onchange="liveTeam=this.value;render()" style="font-size:11px"><option value="all">ทุกทีม</option>`;
      liveTeams.forEach(t=>{html+=`<option value="${h(t)}" ${liveTeam===t?'selected':''}>${h(t)}</option>`;});
      html += `</select></div></div>`;
      if(sessions.length===0) html += `<div style="padding:12px;text-align:center;color:var(--t3);font-size:12px">ไม่มีข้อมูลไลฟ์</div>`;
      sessions.slice(0,30).forEach(s=>{
        html += `<div style="display:grid;grid-template-columns:72px auto 1fr 1fr 60px;gap:6px;align-items:center;padding:7px 0;border-bottom:.5px solid var(--bd);font-size:11px">`;
        html += `<span style="color:var(--t3)">${h(s.date)}${s.time?' '+h(s.time):''}</span>`;
        html += `<span style="font-size:9px;padding:1px 5px;border-radius:8px;background:var(--bg3);color:var(--t3)">${h(s.team||'-')}</span>`;
        html += `<span style="font-weight:500">${h(s.hosts.join(', '))}</span>`;
        html += `<span style="color:var(--t2)">${h(s.topic||'—')}</span>`;
        html += `<span style="text-align:right;color:var(--t2)">${ic('lucide:inbox',16)}${s.inbox} ${ic('lucide:target',16)}${s.lead}</span></div>`;
      });
      if(sessions.length>30) html += `<div style="text-align:center;padding:8px;font-size:11px;color:var(--t3)">แสดง 30 จาก ${sessions.length} รายการ</div>`;
      html += `</div>`;
      return html;
    }

    // ── BOOKING TAB ──
    function renderBookings(sellerNames) {
      // base = กรอง seller + ช่วงวันที่ (ยังไม่กรองสถานะ — ไว้ทำแถบสรุป pipeline)
      // "ปล่อย" นับตามวันปล่อย (releaseDate) ให้ตรงกับ KPI "ปิดได้" · สถานะอื่นนับตามวันจอง
      // releaseDate แบบ "10/6" (ไม่มีปี) → เติมปีของช่วงที่เลือกแล้ว parse → นับเดือนถูก (ตรงกับ backend parse_month_day)
      // เดิม: _parseDmy ต้องมี 3 ส่วน → "10/6" = null → fallback วันจอง → นับคนละเดือน (KPI/ตารางได้ 10 แต่ตารางนี้ได้ 9)
      const _dfYear = (new Date(dfTo+'T00:00:00')).getFullYear();
      const _effDate = (b)=>{
        if(b.status==='ปล่อย' && b.releaseDate){
          if(_parseDmy(b.releaseDate)) return b.releaseDate;        // วันปล่อยมีปีครบ
          const p = String(b.releaseDate).trim().split('/');         // "d/m" ไม่มีปี → เติมปีของช่วง
          if(p.length===2){
            const dd=parseInt(p[0]), mo=parseInt(p[1]);
            if(dd>=1&&dd<=31&&mo>=1&&mo<=12) return `${dd}/${mo}/${_dfYear}`;
          }
        }
        return b.date;                                               // อื่นๆ / parse ไม่ได้ → วันจอง
      };
      let base = (FD.bookingCases||[]).filter(b=>ir(_effDate(b)));
      if(bkSel!=='all') base = base.filter(b=>b.seller===bkSel);
      const STAGES = ['จอง','รอเซ็นต์','รอผล','รอปล่อย','ปล่อย'];
      const STAT_EMOJI = {'จอง':ic('lucide:bookmark',14),'รอเซ็นต์':ic('lucide:pen-line',14),'รอผล':ic('lucide:hourglass',14),'รอปล่อย':ic('lucide:car-front',14),'ปล่อย':ic('lucide:circle-check',14),'รีเจ็ก':ic('lucide:circle-x',14)};
      const counts = {}; let releasedVal = 0;
      C.STATUS_ORDER.forEach(s=>counts[s]=0);
      base.forEach(b=>{ counts[b.status]=(counts[b.status]||0)+1; if(b.status==='ปล่อย') releasedVal+=(b.price||0); });
      let bk = (bkStatus==='all') ? [...base] : base.filter(b=>b.status===bkStatus);
      bk.sort((a,b)=>{const ai=C.STATUS_ORDER.indexOf(a.status);const bi=C.STATUS_ORDER.indexOf(b.status);return(ai===-1?99:ai)-(bi===-1?99:bi);});
      const gidx = new Map((D.bookingCases||[]).map((b,i)=>[b,i]));
      const ageOf = (ds)=>{const d=_parseDmy(ds);return d?Math.floor((Date.now()-d.getTime())/86400000):null;};
      const ageCol = (n)=> n>90?'var(--red)':n>30?'var(--amber)':'var(--green-mid)';

      let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px">`;
      html += `<div style="font-size:13px;font-weight:600">Pipeline จอง${releasedVal>0?` · <span style="color:var(--green)">ปล่อย ${fmtBaht(releasedVal)}</span>`:''}</div>`;
      html += `<select onchange="bkSel=this.value;render()"><option value="all">ทุกเซลล์</option>`;
      sellerNames.forEach(n=>{html+=`<option value="${h(n)}" ${bkSel===n?'selected':''}>${h(sname(n))}</option>`;});
      html += `</select></div>`;
      // แถบสรุป pipeline (กดเพื่อ filter ตามสถานะ)
      html += `<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px">`;
      html += `<button onclick="bkStatus='all';render()" style="flex-shrink:0;border:none;cursor:pointer;border-radius:10px;padding:7px 12px;font-size:11px;font-weight:700;background:${bkStatus==='all'?'var(--blue)':'var(--bg2)'};color:${bkStatus==='all'?'#fff':'var(--t2)'}">ทั้งหมด ${base.length}</button>`;
      C.STATUS_ORDER.forEach(s=>{ const c=counts[s]||0, col=C.STATUS_COLOR[s]||'#888', active=bkStatus===s; html += `<button onclick="bkStatus='${h(s)}';render()" style="flex-shrink:0;border:1px solid ${col}55;cursor:pointer;border-radius:10px;padding:7px 12px;font-size:11px;font-weight:700;background:${active?col:'transparent'};color:${active?'#fff':col};opacity:${c===0?.45:1}">${STAT_EMOJI[s]||''} ${h(s)} ${c}</button>`; });
      html += `</div>`;

      if(bk.length===0) return html + `<div style="text-align:center;padding:24px;color:var(--t3);font-size:13px">ไม่มีเคสในสถานะนี้</div>`;
      bk.forEach(b=>{
        const color = C.STATUS_COLOR[b.status]||'#6b7280';
        const gi = gidx.get(b);
        const clickAttr = (gi!=null) ? `onclick="openBookingDetail(${gi})" style="cursor:pointer"` : '';
        const ci = STAGES.indexOf(b.status);
        let stepper;
        if(b.status==='รีเจ็ก'){ stepper = `<span style="font-size:10px;color:#fff;font-weight:700;opacity:.95;display:inline-flex;align-items:center;gap:3px">${ic('lucide:circle-x',12)} ไม่อนุมัติ</span>`; }
        else { stepper = `<span style="display:inline-flex;align-items:center">`+STAGES.map((s,i)=>{ const on=ci>=0&&i<=ci; const dot=`<span title="${h(s)}" style="width:7px;height:7px;border-radius:50%;background:${on?'#fff':'rgba(255,255,255,.4)'};display:inline-block"></span>`; const ln=i<STAGES.length-1?`<span style="width:9px;height:2px;background:${(ci>=0&&i<ci)?'#fff':'rgba(255,255,255,.4)'};display:inline-block"></span>`:''; return dot+ln; }).join('')+`</span>`; }
        const _pending = (b.status!=='ปล่อย' && b.status!=='รีเจ็ก');
        const _ag = ageOf(b.date);
        const agePill = (_pending && _ag!=null) ? `<span style="background:rgba(255,255,255,.92);color:${ageCol(_ag)};font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap">${ic('lucide:hourglass',16)} ค้าง ${_ag} วัน</span>` : '';
        let keyDate='',keyLabel='',needDate=false;
        if(b.status==='รอเซ็นต์'){keyLabel='นัดเซ็น';keyDate=b.signDate;needDate=empty(b.signDate);}
        else if(b.status==='รอผล'){keyLabel='ผลออก';keyDate=b.resultDate;needDate=empty(b.resultDate);}
        else if(b.status==='รอปล่อย'){keyLabel='ปล่อยรถ';keyDate=b.releaseDate;needDate=empty(b.releaseDate);}
        else if(b.status==='ปล่อย'){keyLabel='ปล่อยแล้ว';keyDate=b.releaseDate;}
        else if(b.status==='จอง'){keyLabel='วันจอง';keyDate=b.date;}
        html += `<div class="booking-card" ${clickAttr}>`;
        html += `<div class="booking-head" style="background:linear-gradient(135deg,${color} 0%,${color}cc 100%)">`;
        html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">${stepper}<span style="margin-left:auto">${agePill}</span></div>`;
        html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><span style="font-size:11px;color:#fff;font-weight:700;background:rgba(0,0,0,.2);padding:2px 8px;border-radius:20px">${h(b.status)}</span><span style="font-size:11px;color:#fff;opacity:.9">${h(b.seller)}${b.isCash?' · 💵 ซื้อสด':''}</span></div>`;
        html += `<div style="font-size:13px;color:#fff;font-weight:600;margin-bottom:2px">${h(b.customer)}</div>`;
        html += `<div style="font-size:11px;color:rgba(255,255,255,.8)">${h(b.car)}${b.plate&&b.plate!=='-'?' · '+h(b.plate):''}</div></div>`;
        html += `<div class="booking-body">`;
        if(keyLabel) html += `<div class="brow"><span class="blbl">${ic('lucide:calendar',16)} ${keyLabel}</span><span class="bval" style="color:${needDate?'var(--red)':'var(--t1)'};font-weight:${needDate?600:400}">${needDate?'⚠️ ยังไม่ได้ใส่!':h(keyDate||'-')}</span></div>`;
        if(b.phone&&!empty(b.phone)) html += `<div class="brow"><span class="blbl">${ic('lucide:phone',16)} เบอร์</span><span class="bval" style="color:var(--blue)">${h(b.phone)}</span></div>`;
        if(b.price>0) html += `<div class="brow"><span class="blbl">${ic('lucide:wallet',16)} ราคา</span><span class="bval" style="color:var(--t1);font-weight:500">${fmtPrice(b.price)}</span></div>`;
        html += `<div class="brow"><span class="blbl">${ic('lucide:credit-card',16)} มัดจำ</span><span class="bval" style="color:var(--green);font-weight:600">${fmtPrice(b.deposit)}</span></div>`;
        if(b.finance&&!empty(b.finance)) html += `<div class="brow"><span class="blbl">${ic('lucide:landmark',16)} ไฟแนนซ์</span><span class="bval">${h(b.finance)}${b.grade&&!empty(b.grade)?' · เกรด '+h(b.grade):''}${b.year&&!empty(b.year)?' · ปี '+h(b.year):''}</span></div>`;
        if(b.leadCode&&!empty(b.leadCode)) html += `<div class="brow"><span class="blbl">${ic('lucide:bookmark',16)} Lead Code</span><span class="bval" style="color:var(--blue);cursor:pointer" onclick="event.stopPropagation();openCaseFromOverview('${h(b.leadCode)}','${h(b.seller)}')">${h(b.leadCode)} →</span></div>`;
        if(b.note&&!empty(b.note)) html += `<div class="brow"><span class="blbl">${ic('lucide:file-pen',16)} หมายเหตุ</span><span class="bval" style="color:var(--t2)">${h(b.note)}</span></div>`;
        html += `<div style="text-align:center;padding-top:7px"><span style="font-size:10px;color:var(--t3)">${ic('lucide:mouse-pointer-click',16)} กดดูรายละเอียด · ไทม์ไลน์</span></div>`;
        html += `</div></div>`;
      });
      return html;
    }

    // ── SELLER TAB ──
    function renderSeller(sellers, sellerNames, dilMap) {
      const effectiveCurS = curS || (sellers[0]?.name??'');
      if(!curS && effectiveCurS) curS = effectiveCurS;
      const sdYear = sellers.find(s=>s.name===effectiveCurS) || {};
      // ถ้ามี filter เดือน → ใช้ค่ารายเดือนจาก monthlySummary (overlay บน sdYear เพื่อคง target/team)
      const sdMonth = (dfMonth > 0 && D.monthlySummary?.[dfMonth]?.sellers?.[effectiveCurS]) || null;
      const sd = sdMonth ? {...sdYear, ...sdMonth} : sdYear;
      const isAdminTeam = sdYear.team==='ADMIN';
      const cases = (FD.followCases||[]).filter(l=>l.seller===effectiveCurS && ir(l.dateIn));
      const noU = cases.filter(l=>l.updateCount===0).length;
      const hot = cases.filter(l=>l.updateCount>=3).length;
      const totU = cases.reduce((a,l)=>a+l.updateCount,0);
      const bkCount = (FD.bookingCases||[]).filter(b=>b.seller===effectiveCurS).length;

      // ── ฝังหน้าจริงที่เซลล์เห็น (/s/<token>/) — รายชื่อเซลล์กรองตามช่วงแล้ว (sellerNames จาก rangeActiveSellers) ──
      const monthNames = sellerNames;
      let curSeller = (curS && monthNames.includes(curS)) ? curS : (curS || monthNames[0] || '');
      if (curS !== curSeller) curS = curSeller;
      const token = (D.sellerTokens || {})[curSeller] || '';
      const monthLbl = rangeLabelTH();   // 📅 ตามตัวกรองวันที่
      const _ifq = `?from=${encodeURIComponent(dfFrom)}&to=${encodeURIComponent(dfTo)}`;   // ส่งช่วงวันที่เข้า iframe

      let html = '';
      html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">`;
      html += `<button class="bbtn" onclick="switchTab('o')">← กลับ</button>`;
      html += `<div class="av">${h(curSeller.charAt(0))}</div>`;
      html += `<div style="flex:1;min-width:100px"><div style="font-size:15px;font-weight:700">${h(curSeller)}</div><div style="font-size:11px;color:var(--t2)">หน้าจริงที่เซลล์เห็น</div></div>`;
      html += `<select onchange="curS=this.value;showCase=null;updateUrl();render()" title="เลือกเซลล์ (เฉพาะคนที่มีข้อมูลในช่วงที่กรอง)" style="max-width:160px">`;
      if (curSeller && !monthNames.includes(curSeller)) html += `<option value="${h(curSeller)}" selected>${h(curSeller)} (ไม่มีข้อมูลในช่วง)</option>`;
      monthNames.forEach(n => { html += `<option value="${h(n)}" ${curSeller===n?'selected':''}>${h(n)}</option>`; });
      html += `</select>`;
      if (token) html += `<a href="/s/${h(token)}/${_ifq}" target="_blank" class="bbtn" style="text-decoration:none">${ic('lucide:arrow-up-right',13)} เต็มจอ</a>`;
      html += `</div>`;
      html += `<div style="font-size:11px;color:var(--t3);margin-bottom:8px">${ic('lucide:calendar',16)} ${h(monthLbl)} · เซลล์ที่มีข้อมูล ${monthNames.length} คน</div>`;

      if (token) {
        html += `<div style="position:relative;width:100%;height:calc(100vh - 200px);min-height:540px">
          <div id="seller-iframe-loading" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);border:.5px solid var(--bd);border-radius:14px;z-index:2"><div class="spin"></div><span style="font-size:13px;color:var(--t3)">กำลังโหลดหน้าเซลล์...</span></div>
          <iframe src="/s/${h(token)}/${_ifq}" title="หน้าเซลล์ ${h(curSeller)}" onload="var el=document.getElementById('seller-iframe-loading');if(el)el.style.display='none'" style="width:100%;height:100%;border:.5px solid var(--bd);border-radius:14px;background:var(--bg)"></iframe>
        </div>`;
      } else {
        html += `<div class="card" style="text-align:center;padding:36px 16px"><div style="font-size:30px;margin-bottom:8px">${ic('lucide:link',16)}</div><div style="font-size:14px;color:var(--t1);font-weight:600;margin-bottom:4px">เซลล์ "${h(curSeller)}" ยังไม่มี LINE user_id</div><div style="font-size:12px;color:var(--t3)">ตั้ง LINE user_id ใน sheet พนักงาน เพื่อแสดงหน้าส่วนตัวของเซลล์คนนี้</div></div>`;
      }
      return html;

      // ───────────── โค้ดมุมมองเซลล์แบบเดิม (admin) ไม่ถูกเรียกแล้ว เก็บไว้เผื่อย้อน ─────────────
      // eslint-disable-next-line
      var _legacyHtml = '';

      // Header
      html += `<div style="display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap">`;
      html += `<button class="bbtn" onclick="switchTab('o')">← กลับ</button>`;
      html += `<div class="av">${effectiveCurS.charAt(0)}</div>`;
      const sellerPeriodLbl = '📅 '+rangeLabelTH();
      html += `<div style="flex:1"><div style="font-size:15px;font-weight:700">${h(effectiveCurS)} <span style="font-size:11px;color:var(--t3);font-weight:500">· ${sellerPeriodLbl}</span></div><div style="font-size:11px;color:var(--t2)">${sd.lead||0} Lead · ว่าง ${sd.vacant||0} · จอง ${sd.booking||0} · ทีม ${sdYear.team||'?'}</div></div>`;
      html += `<select onchange="curS=this.value;showCase=null;curF='all';lfPage=1;updateUrl();render()">`;
      sellerNames.forEach(n=>{html+=`<option value="${h(n)}" ${effectiveCurS===n?'selected':''}>${h(sname(n))}</option>`;});
      html += `</select></div>`;

      // KPI — กดดูรายละเอียดได้ทุก card
      // คลิก → ไป chip filter หรือเปิด modal แสดง booking list ของเซลล์
      const kpis = [
        {l:"Lead",v:sd.lead||0,c:"var(--t1)",       action:`curF='all';lfPage=1;render()`,  hint:"ดูเคสติดตาม"},
        {l:"ติดตาม",v:sd.follow||0,c:"var(--blue)", action:`curF='followstatus';lfPage=1;render()`, hint:"ดูเคสติดตาม"},
        {l:"ว่าง",v:sd.vacant||0,c:"var(--t3)",     action:`openSellerBookingsModal('${h(effectiveCurS)}','all','ว่าง — ไม่มีในเคสติดตาม')`, hint:"ดูใน sheet"},
        {l:"จอง",v:sd.booking||0,c:"var(--green)",  action:`openSellerBookingsModal('${h(effectiveCurS)}','จอง','')`,  hint:"ดูเคสจอง"},
        {l:"ปิด/เป้า",v:(sd.done||0)+'/'+(sd.target||0),c:(sd.done||0)>=(sd.target||1)?'var(--green)':'var(--amber)', action:`openSellerBookingsModal('${h(effectiveCurS)}','ปล่อย','')`, hint:"ดูเคสที่ปล่อย"},
        {l:ic('lucide:wallet',15)+" ยอดปล่อย",v:fmtBaht(sd.dealValue||0),c:"var(--green-mid)", action:`openSellerBookingsModal('${h(effectiveCurS)}','ปล่อย','')`, hint:"ดูเคสที่ปล่อย"},
        {l:"ยังไม่โทร",v:noU,c:noU>10?'var(--red)':'var(--amber)', action:`curF='notcalled';lfPage=1;render()`, hint:"ดูเคสยังไม่โทร"},
      ];
      html += `<div class="kgrid" style="margin-bottom:10px">`;
      kpis.forEach(k=>{
        html += `<div class="kpi" style="cursor:pointer" onclick="${k.action}" title="${k.hint}"><div class="kl">${k.l} <span style="font-size:9px;color:var(--t3);font-weight:400">${ic('lucide:arrow-up-right',13)}</span></div><div class="kv" style="color:${k.c}">${k.v}</div></div>`;
      });
      html += `</div>`;

      // Lead types
      const lt = sd.leadTypes||{};
      const ltTotal = Object.values(lt).reduce((a,v)=>a+v,0)||1;
      const ltSorted = Object.entries(lt).sort((a,b)=>b[1]-a[1]);
      html += `<div class="card" style="margin-bottom:10px"><div class="card-title">${ic('lucide:tag',16)} ประเภท Lead</div>`;
      if(ltSorted.length===0) html += `<span style="font-size:12px;color:var(--t3)">ยังไม่มีข้อมูล</span>`;
      ltSorted.forEach(([name,count])=>{
        const p=Math.round((count/ltTotal)*100);
        const c=C.LT_COLORS[name]||'var(--t2)';
        html += `<div class="lt-row"><span style="min-width:60px;font-size:11px;font-weight:500;color:var(--t1)">${h(name)}</span><div class="lt-bar" style="width:${Math.max(p,2)}%;background:${c};flex-shrink:0"></div><span style="font-size:11px;color:${c};margin-left:5px;min-width:50px">${count} (${p}%)</span></div>`;
      });
      html += `</div>`;

      // Chips
      const chips = [
        {f:'all',l:'ทั้งหมด',n:cases.length},{f:'notcalled',l:'ยังไม่โทร',n:noU},{f:'frequent',l:'ติดตามมาก',n:hot},
        {f:'followstatus',l:'ต้องตาม',n:cases.filter(l=>{const st=(l.adminStatus||'').toLowerCase();return['ติดตาม','รอตอบ','รอลูกค้า','โทรไม่รับ','ผิดนัด'].some(s=>st.includes(s));}).length},
        {f:'need2',l:'โทรอีก 2+',n:cases.filter(l=>nc(l.updateCount)>=2).length},
        {f:'hascar',l:'มีรถสนใจ',n:cases.filter(l=>!nocar(l.car)).length},
      ];
      html += `<div class="chips">`;
      chips.forEach(ch=>{
        html += `<button class="chip${ch.f===curF?' on':''}" onclick="curF='${ch.f}';lfPage=1;render()">${ch.l} <span class="cpill">${ch.n}</span></button>`;
      });
      html += `</div>`;

      // Search & sort
      html += `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px">`;
      html += `<input id="lf-search" type="text" placeholder="ค้นหา code / รถ / หมายเหตุ..." style="flex:1;min-width:130px" value="${h(searchQ)}" oninput="searchQ=this.value;lfPage=1;render()">`;
      html += `<div style="display:flex;gap:3px;flex-wrap:wrap">`;
      [{s:'urgent',l:'เร่งด่วน'},{s:'upd-asc',l:'อัพน้อย'},{s:'upd-desc',l:'ติดตามมาก'},{s:'date',l:'ล่าสุด'}].forEach(b=>{
        html += `<button class="sbtn${curSo===b.s?' on':''}" onclick="curSo='${b.s}';lfPage=1;render()">${b.l}</button>`;
      });
      html += `</div></div>`;

      // Filtered & sorted leads
      let rows = [...cases];
      if(curF==='notcalled') rows=rows.filter(l=>l.updateCount===0);
      else if(curF==='frequent') rows=rows.filter(l=>l.updateCount>=3);
      else if(curF==='followstatus') rows=rows.filter(l=>{const st=(l.adminStatus||'').toLowerCase();return['ติดตาม','รอตอบ','รอลูกค้า','โทรไม่รับ','ผิดนัด'].some(s=>st.includes(s));});
      else if(curF==='need2') rows=rows.filter(l=>nc(l.updateCount)>=2);
      else if(curF==='hascar') rows=rows.filter(l=>!nocar(l.car));
      if(searchQ){const q=searchQ.toLowerCase();rows=rows.filter(l=>[l.code,l.car,l.note,l.phone,l.channel,l.leadType].join(' ').toLowerCase().includes(q));}
      if(curSo==='urgent') rows.sort((a,b)=>urg(b)-urg(a));
      else if(curSo==='upd-asc') rows.sort((a,b)=>a.updateCount-b.updateCount);
      else if(curSo==='upd-desc') rows.sort((a,b)=>b.updateCount-a.updateCount);
      else if(curSo==='date') rows.sort((a,b)=>{const pa=a.lastUpdate&&a.lastUpdate!=='-';const pb=b.lastUpdate&&b.lastUpdate!=='-';if(!pa&&!pb)return 0;if(!pa)return 1;if(!pb)return -1;return new Date(b.lastUpdate)-new Date(a.lastUpdate);});

      const total=rows.length;
      const totalPages=Math.ceil(total/C.PAGE_SIZE)||1;
      const safePage=lfPage>totalPages?totalPages:lfPage;
      const start=(safePage-1)*C.PAGE_SIZE;
      const pageRows=rows.slice(start,start+C.PAGE_SIZE);

      html += `<div class="card"><div class="lfhdr"><span>Code · อัพล่าสุด</span><span>หมายเหตุ / รถ</span><span style="text-align:right">อัพ</span></div>`;
      html += `<div style="max-height:440px;overflow-y:auto">`;
      pageRows.forEach(l=>{
        const cls=l.updateCount===0?'lfrow hr':nc(l.updateCount)>=2?'lfrow ha':l.updateCount>=3?'lfrow hb':'lfrow';
        const carHas=!nocar(l.car); const chanHas=!empty(l.channel)&&l.channel!=='-';
        html += `<div class="${cls}" onclick="showCase='${h(l.code)}';updateUrl();render()">`;
        html += `<div><div style="font-weight:700;font-size:11px;color:var(--blue)">${h(l.code)}${l.leadType?`<span style="font-size:9px;padding:1px 4px;border-radius:4px;background:var(--blue-bg);color:var(--blue);font-weight:600;margin-left:3px">${h(l.leadType)}</span>`:''}</div>`;
        html += `<div style="font-size:10px;color:var(--t3)">${l.lastUpdate&&l.lastUpdate!=='-'?h(l.lastUpdate):'ยังไม่อัพเดท'}</div>`;
        if(carHas) html += `<div style="font-size:10px;color:var(--t2)">${ic('lucide:car-front',16)} ${h(l.car)}</div>`;
        if(chanHas) html += `<div style="font-size:10px;color:var(--purple-mid)">${ic('lucide:megaphone',16)} ${h(l.channel)}</div>`;
        html += `</div><div><div style="font-size:11px;color:var(--t2);line-height:1.5">${h((l.note||'-').slice(0,80))}</div><div style="margin-top:3px">${urgBadge(l)}</div></div>`;
        html += `<div>${dotsHtml(l.updateCount)}</div></div>`;
      });
      html += `</div>`;
      if(total===0) html += `<div style="text-align:center;color:var(--t3);padding:22px 0;font-size:13px">ไม่พบเคส</div>`;
      // Pagination
      html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap;gap:6px">`;
      html += `<div style="font-size:11px;color:var(--t3)">แสดง ${start+1}-${Math.min(start+C.PAGE_SIZE,total)} จาก ${total} เคส</div>`;
      html += `<div style="display:flex;gap:6px">`;
      if(safePage>1) html += `<button class="pg-btn" onclick="lfPage=${safePage-1};render()">←</button>`;
      html += `<span style="font-size:12px;color:var(--t2);padding:0 6px;line-height:32px">${safePage}/${totalPages}</span>`;
      if(safePage<totalPages) html += `<button class="pg-btn primary" onclick="lfPage=${safePage+1};render()">→</button>`;
      html += `</div></div></div>`;
      return html;
    }

    // ── CASE DETAIL ──
    function renderCaseDetail(l) {
      const n=nc(l.updateCount); const noC=l.updateCount===0;
      const uc=noC?'var(--red)':n>=2?'var(--amber)':n===0?'var(--green)':'var(--blue)';
      const ut=noC?'ยังไม่โทร':n>=2?'โทรอีก '+n+'x':n===1?'โทรอีก 1x':'ครบแล้ว';
      const cdKpis=[
        {l:'อัพเดท',v:l.updateCount+'/'+C.UPD_TGT,c:l.updateCount>=C.UPD_TGT?'var(--green)':'var(--amber)'},
        {l:'สถานะ',v:ut,c:uc},
        {l:'หลักฐาน',v:l.callProof||'-',c:l.callProof==='ส่งแล้ว'?'var(--green)':l.callProof==='-'?'var(--t3)':'var(--red)'},
        {l:'อัพล่าสุด',v:l.lastUpdate&&l.lastUpdate!=='-'?l.lastUpdate:'ยังไม่มี',c:'var(--t2)'},
      ];
      const infoRows=[
        {l:'📞 เบอร์',v:l.phone||'-',c:!empty(l.phone)?'var(--blue)':'var(--t3)'},
        {l:'🚗 รถ',v:nocar(l.car)?'-':l.car,c:'var(--t1)'},
        {l:'📢 ช่องทาง',v:!empty(l.channel)&&l.channel!=='-'?l.channel:'-',c:'var(--purple-mid)'},
        {l:'📋 Status',v:l.adminStatus||'-',c:'var(--t1)'},
        {l:'📅 รับเคส',v:l.dateIn+(l.timeIn?' '+l.timeIn:''),c:'var(--t2)'},
      ];
      if(l.profile&&!empty(l.profile)) infoRows.push({l:'Profile',v:l.profile,c:'var(--t2)'});
      const history = parseNoteHistory(l.note||'');

      let html = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">`;
      html += `<button class="bbtn" onclick="showCase=null;updateUrl();render()">← รายการ</button>`;
      html += `<div><div style="font-size:15px;font-weight:700;color:var(--blue)">${h(l.code)}</div>`;
      html += `<div style="font-size:11px;color:var(--t2)">${h(l.seller)} · ${h(l.dateIn)}${l.leadType?`<span style="font-size:10px;padding:1px 5px;border-radius:4px;background:var(--blue-bg);color:var(--blue);font-weight:600;margin-left:4px">${h(l.leadType)}</span>`:''}</div></div></div>`;
      // KPI
      html += `<div class="cd-kpi-grid">`;
      cdKpis.forEach(k=>{html+=`<div class="cd-kpi"><div class="cd-kl">${k.l}</div><div class="cd-kv" style="color:${k.c}">${h(k.v)}</div></div>`;});
      html += `</div>`;
      // Info
      html += `<div class="card" style="margin-bottom:10px"><div class="card-title">${ic('lucide:phone',16)} ข้อมูลลูกค้า</div>`;
      infoRows.forEach(r=>{html+=`<div class="irow"><span class="ilbl">${r.l}</span><span class="ival" style="color:${r.c}">${h(r.v)}</span></div>`;});
      // Progress dots
      html += `<div style="margin-top:10px;padding-top:10px;border-top:.5px solid var(--bd)"><div style="font-size:11px;color:var(--t3);margin-bottom:5px">ความคืบหน้า</div><div style="display:flex;align-items:center;gap:4px">`;
      for(let j=0;j<C.UPD_TGT;j++){
        const f=j<l.updateCount;
        const c2=f?(l.updateCount>=C.UPD_TGT?'#3B6D11':l.updateCount>=3?'#1D9E75':l.updateCount>=2?'#EF9F27':'#E24B4A'):'#ccc';
        html += `<span class="dot" style="background:${c2};width:12px;height:12px"></span>`;
      }
      html += `<span style="font-size:11px;color:var(--t3);margin-left:6px">${l.updateCount}/${C.UPD_TGT} ครั้ง</span></div></div></div>`;
      // History
      html += `<div class="card"><div class="card-title">${ic('lucide:file-pen',16)} ประวัติการติดตาม</div>`;
      if(history.length===0) html += `<div style="color:var(--t3);font-size:12px;padding:8px 0">ยังไม่มีหมายเหตุ</div>`;
      history.forEach((hh,i)=>{
        html += `<div class="upd-item"><span class="upd-n">${String(i+1).padStart(2,'0')}</span><div><div style="font-size:11px;color:var(--t2);line-height:1.55">${h(hh)}</div>`;
        if(i===history.length-1) html += `<span class="bdg" style="background:var(--blue-bg);color:var(--blue);margin-top:3px;display:inline-block">${ic('lucide:map-pin',16)} ล่าสุด</span>`;
        html += `</div></div>`;
      });
      html += `</div>`;
      return html;
    }

    // ── Actions ──
    function switchTab(t) { tab=t; showCase=null; updateUrl(); render(); }
    function switchToSeller(name) { tab='s'; curS=name; showCase=null; curF='all'; lfPage=1; dfMonth=0; updateUrl(); render(); }
    // setDf(preset) — ตอนนี้ map เป็นช่วงวันที่: 0=ทั้งปี · -1=วันนี้ · 1-12=ทั้งเดือนนั้น
    // (ใช้ตอนกดบาร์เดือนในกราฟ drill-in)
    function setDf(preset) {
      const y = new Date().getFullYear();
      if (preset === 0) { dfThisYear(); return; }
      if (preset === -1) { const d = new Date(); setDfRange(_ymd(d), _ymd(d)); return; }
      if (preset >= 1 && preset <= 12) {
        const mm = String(preset).padStart(2, '0');
        const last = new Date(y, preset, 0).getDate();
        setDfRange(`${y}-${mm}-01`, `${y}-${mm}-${String(last).padStart(2, '0')}`);
        return;
      }
      render();
    }
    function setDfFromInput(v) {
      if (!v) { setDf(0); return; }
      const mo = parseInt(v.split('-')[1] || '0');
      if (mo >= 1 && mo <= 12) setDf(mo);
    }
    function setImpersonate(name) {
      impersonate = name||null;
      if(name) localStorage.setItem('oxlet_impersonate',name);
      else localStorage.removeItem('oxlet_impersonate');
      // รีเซ็ตมุมมองที่ผูกกับเซลล์ — กลับมาเป็น Admin จะได้ไม่ค้างที่ seller tab
      curS = name || '';
      showCase = null;
      if(!name && tab==='s') tab = 'o';
      updateUrl();
      render();
    }
    function openCaseFromOverview(code, seller) {
      tab='s'; curS=seller; showCase=code; updateUrl(); render();
    }

    // ── CSRF token helper ──
    function getCsrfToken() {
      const m = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
      return m ? decodeURIComponent(m[1]) : '';
    }
    // (ลบ openAdminLogin/submitAdminLogin + modal ออก — login ทำที่หน้า /login/ แล้ว
    //  เลือก role ตอน login, ไม่ต้อง upgrade เป็น admin ในหน้า dashboard อีก)

    // ── Seller Config Panel (admin only) — ตั้งเป้า + จัดทีม ผ่าน Google Sheet ──
    // ── ${ic('lucide:search',16)} Diagnostics Panel (admin only) — ดู log การกรองข้อมูล + เคสที่หาย ──
    // ── Export Diligence Score ลง Google Sheet ──
    async function exportLeadScore() {
      const now = new Date();
      const month = (dfMonth > 0) ? dfMonth : now.getMonth() + 1;
      const monthName = (C.MONTHS_FULL||[])[month-1] || ('เดือน'+month);
      if (!confirm(`เขียน Diligence Score ของ "${monthName}" ลง sheet 'leadscore'?\n(จะ overwrite ข้อมูลเดิมในชีต)`)) return;
      try {
        const res = await fetch('/api/admin/export_leadscore', {
          method: 'POST',
          headers: {'Content-Type':'application/json','X-CSRFToken': getCsrfToken(),'X-Requested-With':'XMLHttpRequest'},
          credentials: 'same-origin',
          body: JSON.stringify({ month })
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          alert('เขียนล้มเหลว: ' + (data.error || res.status));
          return;
        }
        alert(`เขียนสำเร็จ ${data.rows_written} เซลล์ (${data.month_name} ${data.year})\nเปิด Google Sheet ดูที่ tab 'leadscore'`);
      } catch (e) {
        alert('เกิดข้อผิดพลาด: ' + e.message);
      }
    }

    // ── ${ic('lucide:bar-chart-3',16)} แหล่งข้อมูล (Sheets) — แบบ node ใน n8n ──
    // ── หน้าสถานะระบบ — เช็คว่าระบบปกติไหม + รีเฟรช + เช็กข้อมูลผิดอัตโนมัติ ──
    async function openHealthPanel() {
      const old = document.getElementById('health-overlay'); if (old) old.remove();
      const overlay = document.createElement('div');
      overlay.id = 'health-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1010;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
      overlay.innerHTML = `<div id="health-box" style="background:var(--bg);border-radius:16px;max-width:560px;width:100%;padding:24px" onclick="event.stopPropagation()"><div style="text-align:center;color:var(--t3);padding:40px"><div class="spin" style="margin:0 auto 12px"></div>กำลังเช็คสถานะระบบ...</div></div>`;
      document.body.appendChild(overlay);
      let data;
      try {
        const r = await fetch('/api/admin/system_health', {credentials:'same-origin'});
        data = await r.json();
        if (data.error) throw new Error(data.error);
      } catch (e) {
        const bx = document.getElementById('health-box');
        if (bx) bx.innerHTML = `<div style="text-align:center;padding:24px;color:var(--red)">โหลดสถานะไม่ได้: ${h(String(e.message||e))}</div><div style="text-align:center"><button onclick="document.getElementById('health-overlay').remove()" style="padding:8px 16px;border-radius:10px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);cursor:pointer">ปิด</button></div>`;
        return;
      }
      renderHealthPanel(data);
    }

    function renderHealthPanel(data) {
      const box = document.getElementById('health-box'); if (!box) return;
      const st = data.status || 'ok';
      const stCfg = {
        ok:   {c:'var(--green)', bg:'var(--green-bg)', bd:'var(--green-mid)', ic:'lucide:circle-check',  t:'ระบบปกติ ✓'},
        warn: {c:'var(--amber)', bg:'var(--amber-bg)', bd:'var(--amber-mid)', ic:'lucide:triangle-alert', t:'มีบางอย่างต้องดู'},
        err:  {c:'var(--red)',   bg:'var(--red-bg)',   bd:'var(--red-mid)',   ic:'lucide:triangle-alert', t:'ต้องแก้ด่วน'},
      }[st];
      const sbOff = data.supabaseOk === false;   // โหมดอ่าน Google ตรง — ไม่ใช้ Supabase sync/heartbeat
      const age = data.syncAgeSec;
      const ageTxt = sbOff ? 'อ่านสดจาก Sheet' : (age == null ? 'ยังไม่เคย' : (age < 60 ? Math.round(age)+' วิที่แล้ว' : Math.round(age/60)+' นาทีที่แล้ว'));
      const ageCol = sbOff ? 'var(--t3)' : (age == null ? 'var(--t3)' : (age > 600 ? 'var(--red)' : age > 300 ? 'var(--amber)' : 'var(--green)'));
      let genTxt = '-';
      try { if (data.generatedAt) genTxt = new Date(data.generatedAt).toLocaleString('th-TH',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'}); } catch(e) {}
      const c = data.counts || {};
      const cell = (label,val,col) => `<div style="background:var(--bg2);border-radius:9px;padding:10px 12px"><div style="font-size:10px;color:var(--t3)">${label}</div><div style="font-size:14px;font-weight:700;color:${col||'var(--t1)'}">${val}</div></div>`;
      // cron heartbeat + followup log
      const ctAge = data.cronTickAgeSec;
      const cronTxt = sbOff ? 'โหมดอ่านสด (ไม่ใช้ Supabase)' : (ctAge == null ? '❌ ไม่ทำงาน' : (ctAge < 90 ? '✅ '+Math.round(ctAge)+' วิที่แล้ว' : Math.round(ctAge/60)+' นาทีที่แล้ว'));
      const cronCol = sbOff ? 'var(--t3)' : ((ctAge == null || ctAge > 600) ? 'var(--red)' : (ctAge > 120 ? 'var(--amber)' : 'var(--green)'));
      const fu = data.lastFollowup;
      let fuTxt = 'ยังไม่ส่ง';
      try { if (fu && fu.at) fuTxt = new Date(fu.at).toLocaleString('th-TH',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'}) + ' · ' + (fu.count!=null?fu.count+' คน':'-'); } catch(e){}

      let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">`;
      html += `<div style="font-size:17px;font-weight:800;color:var(--t1)">${ic('lucide:circle-check',18)} สถานะระบบ</div>`;
      html += `<button onclick="document.getElementById('health-overlay').remove()" style="padding:6px 14px;border-radius:10px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);font-weight:600;font-size:12px;cursor:pointer">✕ ปิด</button></div>`;
      html += `<div style="display:flex;align-items:center;gap:10px;background:${stCfg.bg};border:.5px solid ${stCfg.bd};border-radius:12px;padding:14px;margin-bottom:14px"><span style="color:${stCfg.c}">${ic(stCfg.ic,26)}</span><span style="font-size:16px;font-weight:800;color:${stCfg.c}">${stCfg.t}</span></div>`;
      (data.issues||[]).forEach(it => {
        const col = it.level==='err'?'var(--red)':'var(--amber)';
        const bg = it.level==='err'?'var(--red-bg)':'var(--amber-bg)';
        html += `<div style="display:flex;gap:8px;align-items:flex-start;background:${bg};border-radius:9px;padding:9px 12px;margin-bottom:7px;font-size:12px;color:var(--t1)"><span style="color:${col};flex-shrink:0">${ic('lucide:triangle-alert',15)}</span><span>${h(it.msg)}</span></div>`;
      });
      html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0">`;
      html += cell('cron (ตัวตั้งเวลา)', cronTxt, cronCol);
      html += cell('followup ส่งล่าสุด', h(fuTxt));
      html += cell('sync ล่าสุด', ageTxt, ageCol);
      html += cell('ข้อมูลสด ณ', h(genTxt));
      html += cell('Supabase (ฐานข้อมูล)', data.supabaseOk?'✅ ติด':'❌ ไม่ติด', data.supabaseOk?'var(--green)':'var(--red)');
      html += cell('LINE (แจ้งเตือน)', data.lineOk?'✅ ตั้งแล้ว':'❌ ยังไม่ตั้ง', data.lineOk?'var(--green)':'var(--red)');
      html += `</div>`;
      html += `<div style="font-size:11px;color:var(--t3);font-weight:700;margin:8px 0 6px">${ic('lucide:bar-chart-3',15)} จำนวนข้อมูลปีนี้</div>`;
      html += `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px">`;
      html += cell('หลีดธรรมดา', fmtNum(c.leadNormal||0)+' <span style="font-size:10px;color:var(--red)">+RJ '+fmtNum(c.leadRJ||0)+'</span>');
      html += cell('จอง', fmtNum(c.bookings||0));
      html += cell('ปิดได้', fmtNum(c.done||0));
      html += cell('วันนี้รับ lead', fmtNum(data.todayLeads||0), (data.todayLeads||0)>0?'var(--green)':'var(--amber)');
      html += cell('ไลฟ์ (session)', fmtNum(c.live||0));
      html += cell('เซลล์', fmtNum(c.sellers||0));
      html += `</div>`;
      html += `<div style="display:flex;gap:8px;margin-top:14px">`;
      html += `<button onclick="__refreshDataNow(this)" style="flex:1;padding:11px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-weight:800;font-size:13px;cursor:pointer">${ic('lucide:refresh-cw',16)} รีเฟรชข้อมูลเดี๋ยวนี้</button>`;
      html += `<button onclick="document.getElementById('health-overlay').remove();openSheetsPanel()" style="padding:11px 14px;border-radius:10px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);font-weight:600;font-size:12px;cursor:pointer">เช็คแหล่งข้อมูล →</button></div>`;
      html += `<div style="font-size:10px;color:var(--t3);margin-top:8px;text-align:center">ปกติข้อมูลอัปเดตเองทุก ~3-4 นาที · กดรีเฟรชถ้าอยากให้สดเดี๋ยวนี้</div>`;
      box.innerHTML = html;
    }

    async function __refreshDataNow(btn) {
      const orig = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = '⏳ กำลังรีเฟรช... (อาจใช้เวลาหลายวิ)';
      try {
        const r = await fetch('/api/admin/refresh_data', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:'{}'});
        const d = await r.json();
        if (!r.ok || d.error) throw new Error(d.error||'failed');
        openHealthPanel();
      } catch (e) {
        alert('รีเฟรชไม่สำเร็จ: ' + (e.message||e));

    // ── โหมดแก้ไข: เลือกไฟล์/tab จาก dropdown (แบบ n8n) — เก็บลง Supabase ──
    async function renderSheetsEdit() {

        const r = await fetch('/api/admin/list_drive_sheets', {credentials:'same-origin'});

        }
        const cur = s.spreadsheetId || '';
        const inList = files.some(f => f.id === cur);
        let opts = `<option value="">— ใช้ค่าเดิมในโค้ด —</option>`;
        if (cur && !inList) opts += `<option value="${h(cur)}" selected>⚠️ ไฟล์ปัจจุบัน (ยังไม่แชร์ให้ระบบ?)</option>`;
        files.forEach(f => { opts += `<option value="${h(f.id)}" ${f.id===cur?'selected':''}>${h(f.name)}</option>`; });
        return `<label style="font-size:10.5px;color:var(--t3)">ไฟล์ <span style="color:var(--t3)">(เลือกจากที่แชร์ให้ระบบแล้ว)</span>
              <select class="sh-sid" onchange="__loadTabsFor(this)" style="${inputCss}">${opts}</select></label>`;
      };
      // 4 ตัวหลักนี้อ่าน "แท็บรายเดือนอัตโนมัติตามชื่อ" — Tab ที่เลือกเป็นแค่ failsafe (เลือกแค่ไฟล์พอ)
      const MONTHLY = new Set(['leads','sales_reports','bookings','live_sessions']);
      const tabField = (s) => {
        const isMonthly = MONTHLY.has(s.key);
        const note = isMonthly ? `<div style="font-size:10.5px;color:var(--green);background:var(--green-bg);border:.5px solid var(--green-mid);border-radius:7px;padding:6px 9px;margin-top:3px;line-height:1.5">${ic('lucide:calendar-days',14)} ระบบอ่านแท็บ<b>รายเดือนเองตามชื่อ</b> (มกราคม·กุมภาพันธ์...) — <b>เลือกแค่ไฟล์พอ</b> ไม่ต้องเลือก Tab</div>` : '';
        const tabLabel = isMonthly ? `Tab สำรอง <span style="color:var(--t3)">(failsafe · ปกติไม่ต้องแตะ)</span>` : `Tab <span style="color:var(--t3)">(เลือกจากไฟล์)</span>`;
        if (!useDrop) {
          return note + `<label style="font-size:10.5px;color:var(--t3)">${tabLabel}
              <input class="sh-tab" value="${h(s.tab || '')}" placeholder="รวม sheet" style="${inputCss}"></label>`;
        }
        const curTab = s.tab || '';
        let opts = `<option value="">— ใช้ค่าเดิม —</option>`;
        if (curTab) opts += `<option value="${h(curTab)}" selected>${h(curTab)}</option>`;
        return note + `<label style="font-size:10.5px;color:var(--t3)">${tabLabel}
              <select class="sh-tab" style="${inputCss}">${opts}</select></label>`;
      };
      const editRow = (s, isCfg) => `
        <div data-sk="${h(s.key)}" style="border:.5px solid var(--bd);border-radius:11px;padding:12px;background:var(--bg2);margin-bottom:9px">
          <div style="font-size:12.5px;font-weight:700;color:var(--t1);margin-bottom:7px">${h(s.name)}${isCfg ? ' <span style="font-size:10px;color:var(--t3);font-weight:400">(sheet ตั้งค่า)</span>' : ''}</div>
          <div style="display:grid;grid-template-columns:1fr;gap:7px">
            ${fileField(s)}
            ${tabField(s)}
          </div>
        </div>`;

      let html = `<div style="padding:11px 13px;background:var(--amber-bg);border-radius:10px;border-left:3px solid var(--amber);font-size:11px;color:var(--t2);line-height:1.6;margin-bottom:14px">`;
      html += `${ic('lucide:triangle-alert',16)} <b>ย้ายไฟล์ชีต (เช่น ขึ้นปีใหม่):</b> เลือก<b>ไฟล์</b>จากดรอปดาวน์ → กดบันทึก (เก็บใน Supabase ไม่ต้องแก้โค้ด/deploy)<br>4 แหล่งหลัก (Lead/ยอดขาย/จอง/ไลฟ์) <b>ระบบหาแท็บรายเดือนเองตามชื่อ</b> — เลือกแค่ไฟล์พอ<br>`;
      html += `ไฟล์ใหม่ไม่ขึ้นในรายการ? → <b>แชร์ไฟล์ให้ระบบ (อีเมล service account) ก่อน</b> แล้วกด "เช็คใหม่"`;
      html += `</div>`;
      html += `<div style="font-size:12px;font-weight:800;color:var(--t1);margin-bottom:8px">${ic('lucide:bar-chart-3',16)} แหล่งข้อมูลหลัก</div>`;
      html += data.sources.map(s => editRow(s, false)).join('');
      if ((data.configSources || []).length) {
        html += `<div style="font-size:12px;font-weight:800;color:var(--t1);margin:14px 0 8px">${ic('lucide:settings',16)} Sheet ตั้งค่า</div>`;
        html += data.configSources.map(s => editRow(s, true)).join('');
      }
      html += `<div style="display:flex;gap:8px;margin-top:14px;position:sticky;bottom:0;background:var(--bg);padding-top:8px">`;
      html += `<button onclick="saveSheetsConfig(this)" style="flex:1;padding:11px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-weight:800;font-size:13px;cursor:pointer">${ic('lucide:save',16)} บันทึก + sync ข้อมูลใหม่</button>`;
      html += `<button onclick="openSheetsPanel()" style="padding:11px 16px;border-radius:10px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);font-weight:600;font-size:13px;cursor:pointer">← กลับ</button>`;
      html += `</div>`;
      body.innerHTML = html;
      // โหลด tab ของไฟล์ปัจจุบันแต่ละแถวให้พร้อมเลือก
      if (useDrop) document.querySelectorAll('#sheets-body select.sh-sid').forEach(sel => { if (sel.value) __loadTabsFor(sel); });
    }

    // โหลดรายชื่อ tab ของไฟล์ที่เลือก → เติมลง dropdown tab ของแถวนั้น
    async function __loadTabsFor(selEl) {
      const row = selEl.closest('[data-sk]');
      const tabSel = row && row.querySelector('.sh-tab');
      if (!tabSel || tabSel.tagName !== 'SELECT') return;
      const sid = selEl.value;
      const prev = tabSel.value;
      if (!sid) { tabSel.innerHTML = `<option value="">— ใช้ค่าเดิม —</option>`; return; }
      tabSel.innerHTML = `<option value="">⏳ โหลด tab...</option>`;
      try {
        const r = await fetch('/api/admin/list_tabs?sid=' + encodeURIComponent(sid), {credentials:'same-origin'});
        const d = await r.json();
        const tabs = d.tabs || [];
        let opts = `<option value="">— เลือก tab —</option>`;
        let hasPrev = false;
        tabs.forEach(t => { if (t === prev) hasPrev = true; opts += `<option value="${h(t)}" ${t===prev?'selected':''}>${h(t)}</option>`; });
        if (prev && !hasPrev) opts += `<option value="${h(prev)}" selected>${h(prev)} (เดิม)</option>`;
        tabSel.innerHTML = opts;
      } catch (e) {
        tabSel.innerHTML = `<option value="${h(prev)}" selected>${h(prev || '')}</option>`;
      }
    }

    async function saveSheetsConfig(btn) {
      const rows = document.querySelectorAll('#sheets-body [data-sk]');
      const items = [];
      rows.forEach(r => items.push({
        key: r.getAttribute('data-sk'),
        spreadsheetId: (r.querySelector('.sh-sid') || {}).value?.trim() || '',
        sheetName: (r.querySelector('.sh-tab') || {}).value?.trim() || '',
      }));
      const orig = btn.textContent;
      btn.disabled = true; btn.textContent = '⏳ บันทึก + sync ข้อมูลใหม่...';
      try {
        const r = await fetch('/api/admin/sheet_config', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items }),
        });
        const d = await r.json();
        if (!r.ok || d.error) throw new Error(d.error || 'save failed');
        btn.textContent = '✓ บันทึกแล้ว — กำลังโหลดสถานะใหม่';
        setTimeout(() => openSheetsPanel(), 800);
      } catch (e) {
        alert('บันทึกไม่สำเร็จ: ' + e.message);
        btn.disabled = false; btn.textContent = orig;
      }
    }

    async function openSellerConfigPanel() {
      if (!isAdmin) return;
      const old = document.getElementById('sconfig-overlay');
      if (old) old.remove();
      const overlay = document.createElement('div');
      overlay.id = 'sconfig-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
      const modal = document.createElement('div');
      modal.style.cssText = 'background:var(--bg);border-radius:14px;max-width:680px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden';
      modal.onclick = (e) => e.stopPropagation();
      modal.innerHTML = `<div style="padding:14px 16px;border-bottom:.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:15px;font-weight:700;color:var(--t1)">ตั้งเป้าและจัดทีมเซลล์</div>
        <button onclick="document.getElementById('sconfig-overlay').remove()" style="background:transparent;border:none;font-size:20px;color:var(--t3);cursor:pointer">✕</button>
      </div>
      <div id="sc-body" style="overflow-y:auto;padding:16px;flex:1"><div style="text-align:center;padding:24px;color:var(--t3);font-size:13px"><div class="spin" style="margin:0 auto 10px"></div>กำลังโหลด config...</div></div>`;
      overlay.appendChild(modal);
      document.body.appendChild(overlay);

      try {
        const res = await fetch('/api/admin/seller_config', { credentials:'same-origin' });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'load failed');
        renderSellerConfig(modal, data);
      } catch (e) {
        modal.querySelector('#sc-body').innerHTML = `<div style="padding:24px;text-align:center;color:var(--red)">${ic('lucide:triangle-alert',16)} ${h(e.message)}</div>`;
      }
    }

    // editable state — copy ของ data.sellers ที่แก้ได้
    let __scRows = [];

    function renderSellerConfig(modal, data) {
      __scRows = (data.sellers || []).map(s => ({...s}));
      drawSellerConfigBody(modal, data);
      drawSellerConfigFooter(modal);
    }

    function drawSellerConfigBody(modal, data) {
      const total = __scRows.reduce((a,s)=>a+(parseInt(s.target)||0),0);
      const teamSet = new Set(__scRows.map(s=>s.team).filter(Boolean));
      const sheetUrlBtn = `<a href="${h(data.sheet_url)}" target="_blank" style="font-size:11px;color:var(--blue);text-decoration:none">${ic('lucide:bar-chart-3',16)} ดูใน Sheet</a>`;

      const banner = data.loaded_from_sheet
        ? `<div style="padding:8px 12px;background:var(--green-bg);color:var(--green);border:.5px solid var(--green-mid);border-radius:8px;font-size:11px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center"><span>${ic('lucide:circle-check',16)} โหลดจาก Sheet "${h(data.sheet_name)}" สำเร็จ</span>${sheetUrlBtn}</div>`
        : `<div style="padding:8px 12px;background:var(--amber-bg);color:var(--amber);border:.5px solid var(--amber-mid);border-radius:8px;font-size:11px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center"><span>${ic('lucide:triangle-alert',16)} ยังไม่มี sheet — กดบันทึกจะสร้างให้อัตโนมัติ</span>${sheetUrlBtn}</div>`;

        <div style="padding:7px;background:var(--bg2);border-radius:6px;text-align:center"><div style="font-size:10px;color:var(--t3)">ทีม</div><div style="font-size:17px;font-weight:800;color:var(--blue)">${teamSet.size}</div></div>
        <div style="padding:7px;background:var(--bg2);border-radius:6px;text-align:center"><div style="font-size:10px;color:var(--t3)">เป้ารวม</div><div style="font-size:17px;font-weight:800;color:var(--green)">${total}</div></div>
      </div>`;

      html += `<datalist id="sc-teams">${teamOpts.map(t=>`<option value="${h(t)}">`).join('')}</datalist>`;
      html += `<table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr>

          <th style="text-align:left;padding:5px 6px;color:var(--t3);font-size:10px;font-weight:600;border-bottom:.5px solid var(--bd);width:170px">URL ส่วนตัว</th>

          ${__scRows.map((s,i) => {

              <td style="padding:5px 6px;border-bottom:.5px solid var(--bd)"><input type="number" min="0" value="${s.target}" oninput="__scRows[${i}].target=parseInt(this.value)||0;__scUpdateTotal()" style="width:100%;padding:6px 9px;border:.5px solid var(--bd2);border-radius:6px;background:var(--bg);color:var(--t1);font-size:12px;outline:none;box-sizing:border-box;text-align:right"></td>
              <td style="padding:5px 6px;border-bottom:.5px solid var(--bd);text-align:center"><input type="checkbox" ${s.is_admin?'checked':''} onchange="__scRows[${i}].is_admin=this.checked" title="ติ๊ก = เซลล์คนนี้ได้สิทธิ์แอดมินด้วย" style="width:16px;height:16px;cursor:pointer;accent-color:var(--amber)"></td>

      html += `<button onclick="__scAddRow()" style="margin-top:8px;padding:7px 14px;border-radius:8px;border:.5px dashed var(--blue);background:transparent;color:var(--blue);cursor:pointer;font-size:12px;font-weight:600;width:100%">${ic('lucide:plus',16)} เพิ่มเซลล์ใหม่</button>`;
      html += `<div id="sc-msg" style="margin-top:10px"></div>`;

      modal.querySelector('#sc-body').innerHTML = html;

    function drawSellerConfigFooter(modal) {
      let footer = modal.querySelector('#sc-footer');
      if (!footer) {
        footer = document.createElement('div');
        footer.id = 'sc-footer';
        footer.style.cssText = 'padding:12px 16px;border-top:.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:10px';
        modal.appendChild(footer);
      }
      footer.innerHTML = `<div style="font-size:11px;color:var(--t3)">${ic('lucide:triangle-alert',16)} บันทึก = เขียนทับ tab "ตั้งค่าเซลล์" ใน Google Sheet</div>
        <div style="display:flex;gap:8px">
          <button onclick="document.getElementById('sconfig-overlay').remove()" style="padding:8px 14px;border-radius:8px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);font-weight:600;font-size:12px;cursor:pointer">ปิด</button>
          <button id="sc-save-btn" onclick="__scSave()" style="padding:8px 20px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-weight:700;font-size:13px;cursor:pointer">${ic('lucide:save',16)} บันทึก</button>

    function __scAddRow() {
      __scRows.push({ name: '', team: '', target: 0, is_admin: false });
      const modal = document.querySelector('#sconfig-overlay > div');
      if (modal && modal.__sellerConfigData) drawSellerConfigBody(modal, modal.__sellerConfigData);

    function __scDeleteRow(i) {
      const name = __scRows[i]?.name || '(ว่าง)';
      if (!confirm(`ลบเซลล์ "${name}" ออกจากระบบ?`)) return;
      __scRows.splice(i, 1);
      const modal = document.querySelector('#sconfig-overlay > div');
      if (modal && modal.__sellerConfigData) drawSellerConfigBody(modal, modal.__sellerConfigData);
    }
    function __scUpdateTotal() {
      const total = __scRows.reduce((a,s)=>a+(parseInt(s.target)||0),0);
      const cells = document.querySelectorAll('#sc-body > div:nth-child(2) > div');
      // skip — เพื่อ simplicity ไม่ redraw ทุก keystroke, รอ save แสดงจริง
    }
    async function __scSave() {
      const btn = document.getElementById('sc-save-btn');
      const msg = document.getElementById('sc-msg');
      // normalize + validate
      for (let i = 0; i < __scRows.length; i++) {
        const r = __scRows[i];
        r.team = (r.team || '').trim().toUpperCase();  // uppercase ตอน save (กัน cursor jump ระหว่างพิมพ์)
        if (!r.name || !r.name.trim()) {
          msg.innerHTML = `<div style="padding:8px 12px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">${ic('lucide:triangle-alert',16)} แถวที่ ${i+1}: ชื่อว่าง</div>`; return;
        }
        if (!r.team) {
          msg.innerHTML = `<div style="padding:8px 12px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">${ic('lucide:triangle-alert',16)} ${h(r.name)}: ยังไม่ได้ใส่ทีม</div>`; return;
        }
      }
      if (!confirm(`บันทึกการตั้งค่าเซลล์ ${__scRows.length} คน? (จะเขียนทับ sheet)`)) return;
      btn.disabled = true; btn.textContent = '⏳ กำลังบันทึก...';
      msg.innerHTML = '';
      try {
        const res = await fetch('/api/admin/seller_config', {
          method: 'POST',
          headers: { 'Content-Type':'application/json', 'X-CSRFToken': getCsrfToken(), 'X-Requested-With':'XMLHttpRequest' },
          credentials: 'same-origin',
          body: JSON.stringify({ sellers: __scRows }),
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          msg.innerHTML = `<div style="padding:8px 12px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">${ic('lucide:triangle-alert',16)} ${h(data.error || 'บันทึกล้มเหลว')}</div>`;
        } else {
          msg.innerHTML = `<div style="padding:8px 12px;background:var(--green-bg);color:var(--green);border-radius:8px;font-size:11px;font-weight:600">${ic('lucide:circle-check',16)} บันทึก ${data.saved} เซลล์เรียบร้อย — รีเฟรชหน้า dashboard เพื่อดูผล</div>`;
        }
      } catch (e) {
        msg.innerHTML = `<div style="padding:8px 12px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:11px">${ic('lucide:triangle-alert',16)} ${h(e.message)}</div>`;
      } finally {
        btn.disabled = false; btn.textContent = '💾 บันทึก';
      }
    }

    // ── ${ic('lucide:crown',16)} จัดการแอดมิน (admin IDs) — รายชื่อ LINE user_id ที่เป็นแอดมิน (เทเลเซลล์/ออฟฟิศ) ──
    let __aiAdmins = [];      // [{user_id, name, note}]
    let __aiEmployees = [];   // [{user_id, nickname, display, dept}]
    async function openAdminIdsPanel() {

      if (old) old.remove();
      const overlay = document.createElement('div');
      overlay.id = 'aiconfig-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
      const modal = document.createElement('div');
      modal.style.cssText = 'background:var(--bg);border-radius:14px;max-width:600px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden';
      modal.onclick = (e) => e.stopPropagation();
      modal.innerHTML = `<div style="padding:14px 16px;border-bottom:.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center">
