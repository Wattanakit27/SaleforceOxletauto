<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oxlet Dashboard</title>
  {% load static %}
  <link rel="icon" type="image/png" href="{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}">
  <link rel="apple-touch-icon" href="{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}">
  <link rel="stylesheet" href="{% static 'dashboard/css/globals.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    .cgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
    .cgrid > .chart-card.span2 { grid-column: span 2; }
    .chart-card .chart-box { position:relative; height:240px; }
    .chart-card.span2 .chart-box { height:260px; }
    @media (max-width:760px) {
      .cgrid { grid-template-columns:1fr; }
      .cgrid > .chart-card.span2 { grid-column: auto; }
      .chart-card .chart-box { height:220px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    {% if error %}
    <div style="text-align:center;padding-top:80px">
      <div style="font-size:48px;margin-bottom:14px">⚠️</div>
      <div style="font-size:18px;font-weight:700;color:var(--t1);margin-bottom:6px">เกิดข้อผิดพลาด</div>
      <div style="font-size:13px;color:var(--t2)">{{ error }}</div>
      <button onclick="location.reload()" class="bbtn" style="margin-top:12px">🔄 ลองอีกครั้ง</button>
    </div>
    {% else %}
    <div class="loading-container" id="loading">
      <div class="spin"></div>
      <span style="font-size:13px">กำลังโหลด Dashboard...</span>
    </div>
    <div id="dashboard-root" style="display:none"></div>
    {% endif %}
  </div>

  {% if not error %}
  <script>
    // ── Data from server ──
    const D = {{ data_json|safe }};
    const C = {{ constants_json|safe }};
    const SESSION_USER = {{ session_user_json|safe }};
    const LOGO_URL = "{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}";

    // ── Auth ──
    // Backend ให้ default เป็น 'ผู้บริหาร' มาแล้วเมื่อยังไม่ login → frontend แค่อ่านค่า
    function getEmployee() {
      if (SESSION_USER && SESSION_USER.position) {
        return {
          id: SESSION_USER.user_id || '',
          user_id: SESSION_USER.user_id || '',
          display_name: SESSION_USER.display_name || '',
          nickname: SESSION_USER.nickname || '',
          position: SESSION_USER.position || '',
        };
      }
      // fallback: cookie จาก magic_link (สำหรับเซลล์ที่ใช้ลิงก์ส่วนตัว)
      try {
        const cookies = document.cookie.split(';');
        for (const cookie of cookies) {
          const [name, ...rest] = cookie.trim().split('=');
          if (name === 'oxlet_employee') {
            return JSON.parse(decodeURIComponent(rest.join('=')));
          }
        }
      } catch {}
      // ไม่ควรเกิด เพราะ backend ส่ง default executive มาแล้ว
      return { id:'', user_id:'', display_name:'ผู้บริหาร', nickname:'ผู้บริหาร', position:'executive' };
    }
    const employee = getEmployee();
    const isAdmin = employee.position === 'admin';
    // ผู้บริหาร — เห็นทุกอย่างเหมือน admin ปัจจุบัน + impersonate ได้ แต่ไม่มีเครื่องมือ admin-only (LINE, schedule ฯลฯ)
    const isExecutive = ['executive','ผู้บริหาร','manager','exec'].includes((employee.position||'').toLowerCase()) || employee.position === 'ผู้บริหาร';
    const canViewAll = isAdmin || isExecutive;

    // ── State ──
    let tab = new URLSearchParams(location.search).get('tab') || 'o';
    let curS = new URLSearchParams(location.search).get('seller') || '';
    let showCase = new URLSearchParams(location.search).get('case') || null;
    let dfMonth = 0;
    let curF = 'all';
    let curSo = 'urgent';
    let curMode = 'month';
    let lfPage = 1;
    let msort = 'lead';
    let hsel = 'all';
    let liveMonth = 0;
    let liveTeam = 'all';
    let followFilter = 'urgent';
    let bkSel = 'all';
    let bkStatus = 'all';
    let searchQ = '';
    // Lead-by-car + Released-cars state (admin/exec only)
    let leadCarHideUnknown = true;
    let leadCarQuery = '';
    let leadCarPage = 1;
    const LEAD_CAR_PAGE_SIZE = 20;
    let releasedSort = 'date';  // 'date' | 'price' | 'seller' | 'age'
    let releasedSeller = 'all';
    let releasedStatus = 'ปล่อย';  // 'ปล่อย' | 'all' | 'จอง' | 'รอเซ็นต์' | 'รอผล' | 'รอปล่อย' | 'รีเจ็ก'
    let releasedPage = 1;
    const RELEASED_PAGE_SIZE = 50;
    let impersonate = canViewAll ? localStorage.getItem('oxlet_impersonate') : null;

    // Validate impersonate
    if (impersonate) {
      const validNames = (D.sellers || []).map(s => s.name);
      if (!validNames.includes(impersonate)) impersonate = null;
    }

    // ── Filtered data ──
    function getFilteredData() {
      const filterTo = !canViewAll ? employee.nickname : impersonate;
      if (!filterTo) return D;
      return {
        ...D,
        sellers: (D.sellers||[]).filter(s => s.name === filterTo),
        followCases: (D.followCases||[]).filter(c => c.seller === filterTo),
        bookingCases: (D.bookingCases||[]).filter(b => b.seller === filterTo),
      };
    }
    let FD = getFilteredData();

    // ── Helpers ──
    const h = (s) => s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
    const pct = (a,b) => b > 0 ? Math.round((a/b)*100) : 0;
    const nc = (u) => Math.max(0, C.UPD_TGT - u);
    const urg = (l) => { let s = l.updateCount===0?100:0; s += nc(l.updateCount)*10; return s; };
    const nocar = (c) => !c || c==='ลูกค้าไม่ตอบ' || c==='รถที่ไม่ได้ทำการตลาด' || c==='-';
    const empty = (v) => !v || v==='-' || v==='';
    const passMonth = (ds, m) => {
      if(m===0) return true;
      if(!ds) return true;
      const p = ds.split('/');
      if(p.length<2) return true;
      const day=parseInt(p[0]),mo=parseInt(p[1]);
      if(isNaN(day)||isNaN(mo)) return true;
      if(m===-1) { const now=new Date(); return day===now.getDate() && mo===now.getMonth()+1; }
      return mo===m;
    };
    const ir = (ds) => passMonth(ds, dfMonth);
    const parseNoteHistory = (note) => {
      if(!note||note==='-') return [];
      return note.replace(/^\d{4,5}\s*/,'').split('/').map(s=>s.trim()).filter(s=>s&&s!=='-');
    };
    const dotsHtml = (u) => {
      let html='';
      for(let i=0;i<C.UPD_TGT;i++){
        const f=i<u;
        const c=f?(u>=C.UPD_TGT?'#3B6D11':u>=3?'#1D9E75':u>=2?'#EF9F27':'#E24B4A'):'#ccc';
        html+=`<span class="dot" style="background:${c}"></span>`;
      }
      return `<span style="display:flex;align-items:center">${html}<span style="font-size:10px;color:var(--t3);margin-left:2px">${u}/${C.UPD_TGT}</span></span>`;
    };
    const urgBadge = (l) => {
      const n=nc(l.updateCount);
      if(l.updateCount===0) return `<span class="bdg" style="background:var(--red-bg);color:var(--red)">ยังไม่โทร</span>`;
      if(n>=3) return `<span class="bdg" style="background:var(--red-bg);color:var(--red)">+${n}</span>`;
      if(n>=1) return `<span class="bdg" style="background:var(--amber-bg);color:var(--amber)">+${n}</span>`;
      return `<span class="bdg" style="background:var(--green-bg);color:var(--green)">✓</span>`;
    };
    const fmtNum = (n) => Number(n||0).toLocaleString();
    const fmtPrice = (n) => '฿'+Number(n||0).toLocaleString();

    // ── MoM helper: ดึงค่า metric ของเดือน m เทียบกับเดือน m-1 ──
    // คืน {cur, prev, delta, pct, isUp} หรือ null ถ้าเปรียบเทียบไม่ได้
    function getMoM(month, key) {
      if (!month || month < 2 || month > 12) return null;
      const ms = D.monthlySummary || {};
      const curMs  = ms[month] || ms[String(month)] || {};
      const prevMs = ms[month-1] || ms[String(month-1)] || {};
      const cur  = Number(curMs[key] || 0);
      const prev = Number(prevMs[key] || 0);
      if (cur === 0 && prev === 0) return null;
      const delta = cur - prev;
      const pct = prev > 0
        ? Math.round((delta/prev) * 1000) / 10
        : (cur > 0 ? 999 : 0);  // 999 = "ใหม่" (เดือนก่อนเป็น 0)
      return {cur, prev, delta, pct, isUp: delta >= 0};
    }
    // คืน HTML badge ของ MoM — ใส่ใน subtitle ของ KPI card
    // invert=true ถ้า metric ที่ "ลด = ดี" (เช่น RJ, ติดตามค้าง)
    function momBadge(mom, invert=false, fmt) {
      if (!mom) return '';
      fmt = fmt || ((n) => Number(n).toLocaleString());
      // 999 = ใหม่ทั้งหมด (prev=0)
      if (mom.pct === 999) {
        return `<span style="display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--blue);background:var(--blue-bg);padding:1px 5px;border-radius:8px;margin-left:4px" title="เดือนก่อน 0 → ใหม่ทั้งหมด">✨ ใหม่</span>`;
      }
      // ลด = ดี (RJ): invert color
      const goodTrend = invert ? !mom.isUp : mom.isUp;
      const col = mom.pct === 0 ? 'var(--t3)' : goodTrend ? 'var(--green)' : 'var(--red)';
      const bg  = mom.pct === 0 ? 'var(--bg2)' : goodTrend ? 'var(--green-bg)' : 'var(--red-bg)';
      const arrow = mom.delta > 0 ? '↗' : mom.delta < 0 ? '↘' : '→';
      const sign = mom.delta > 0 ? '+' : '';
      return `<span style="display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:700;color:${col};background:${bg};padding:1px 5px;border-radius:8px;margin-left:4px" title="เดือนก่อน ${fmt(mom.prev)} → เดือนนี้ ${fmt(mom.cur)}">${arrow} ${sign}${mom.pct}%</span>`;
    }

    // ฿ แบบกระชับ: ≥1M → "฿1.2M", ≥1K → "฿850K", ที่เหลือ → "฿1,234"
    const fmtBaht = (n) => {
      const v = Number(n||0);
      if (v >= 1000000) return '฿' + (v/1000000).toFixed(v >= 10000000 ? 1 : 2) + 'M';
      if (v >= 100000)  return '฿' + Math.round(v/1000) + 'K';
      if (v >= 1000)    return '฿' + (v/1000).toFixed(1) + 'K';
      return '฿' + Math.round(v).toLocaleString();
    };

    // ── URL sync ──
    function updateUrl() {
      const p = new URLSearchParams();
      p.set('tab', tab);
      if(curS) p.set('seller', curS);
      if(showCase) p.set('case', showCase);
      history.replaceState(null, '', '/dashboard/?'+p.toString());
    }

    // ── Diligence map ──
    function buildDilMap() {
      const m = {};
      (FD.followCases||[]).forEach(l => {
        if(!m[l.seller]) m[l.seller]={tot:0,cnt:0,high:0};
        m[l.seller].tot += l.updateCount;
        m[l.seller].cnt++;
        if(l.updateCount>=3) m[l.seller].high++;
      });
      return m;
    }

    // ── Render engine ──
    const root = document.getElementById('dashboard-root');

    function render() {
      FD = getFilteredData();
      const sellers = FD.sellers || [];
      const sellerNames = sellers.map(s=>s.name);
      const dilMap = buildDilMap();

      let html = '';

      // Header
      html += `<header style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px">`;
      html += `<div style="display:flex;align-items:center;gap:8px">`;
      html += `<img src="${LOGO_URL}" alt="Oxlet" style="height:28px;width:auto;display:block">`;
      html += `<span style="font-size:16px;font-weight:700;color:var(--t1)">Oxlet Dashboard</span>`;
      // Viewer badge
      if(canViewAll) {
        const roleLabel = isAdmin ? '👑 Admin' : '🎩 ผู้บริหาร';
        const roleBg = isAdmin ? 'var(--amber-bg)' : 'var(--purple-bg)';
        const roleFg = isAdmin ? 'var(--amber)' : 'var(--purple)';
        const roleBd = isAdmin ? 'var(--amber-mid)' : 'var(--purple-mid)';
        if(impersonate) {
          html += `<button onclick="setImpersonate('')" title="คลิกเพื่อกลับสู่มุมมอง${isAdmin?' Admin':'ผู้บริหาร'}" style="background:var(--purple-bg);color:var(--purple);padding:3px 9px;border-radius:14px;font-size:11px;font-weight:600;border:.5px solid var(--purple-mid);cursor:pointer">👁️ ดูในฐานะ ${h(impersonate)} ✕</button>`;
        } else {
          html += `<span style="background:${roleBg};color:${roleFg};padding:3px 9px;border-radius:14px;font-size:11px;font-weight:600;border:.5px solid ${roleBd}">${roleLabel} (ทั้งหมด)</span>`;
        }
      } else {
        html += `<span style="background:var(--blue-bg);color:var(--blue);padding:3px 9px;border-radius:14px;font-size:11px;font-weight:600;border:.5px solid var(--blue)">👤 ${h(employee.nickname)}</span>`;
      }
      html += `</div>`;
      html += `<div style="display:flex;align-items:center;gap:8px">`;
      // Admin-only: LINE tools
      if(isAdmin) {
        html += `<button onclick="openLineIdPanel()" title="ดูรายชื่อพนักงานและ LINE user_id" style="font-size:11px;padding:4px 10px;border-radius:14px;border:.5px solid var(--green-mid);background:var(--green-bg);color:var(--green);cursor:pointer">📋 LINE ID</button>`;
        html += `<button onclick="openCronPanel()" title="ส่ง LINE Flex (ทันที + ตั้งเวลาอัตโนมัติ)" style="font-size:11px;padding:4px 10px;border-radius:14px;border:.5px solid var(--blue);background:var(--blue-bg);color:var(--blue);cursor:pointer">📤 LINE Flex</button>`;
        html += `<button onclick="openSellerConfigPanel()" title="ตั้งเป้าและจัดทีมเซลล์" style="font-size:11px;padding:4px 10px;border-radius:14px;border:.5px solid var(--amber-mid);background:var(--amber-bg);color:var(--amber);cursor:pointer">🎯 ตั้งเป้า/ทีม</button>`;
        html += `<button onclick="openDiagnosticsPanel()" title="ดู Log การกรองข้อมูล / เคสที่หาย" style="font-size:11px;padding:4px 10px;border-radius:14px;border:.5px solid var(--purple-mid);background:var(--purple-bg,#f3e8ff);color:var(--purple-mid,#7c3aed);cursor:pointer">🔍 Log ข้อมูล</button>`;
      }
      // Impersonate switcher (admin + ผู้บริหาร)
      if(canViewAll && D.sellers) {
        const allNames = D.sellers.map(s=>s.name);
        const selfLabel = isAdmin ? '👑 Admin (ทั้งหมด)' : '🎩 ผู้บริหาร (ทั้งหมด)';
        html += `<select onchange="setImpersonate(this.value)" style="font-size:11px;padding:3px 9px;border-radius:14px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t1);cursor:pointer">`;
        html += `<option value="" ${!impersonate?'selected':''}>${selfLabel}</option>`;
        allNames.forEach(n => { html += `<option value="${h(n)}" ${impersonate===n?'selected':''}>👁️ ดูในฐานะ ${h(n)}</option>`; });
        html += `</select>`;
      }
      html += `<button onclick="location.reload()" style="font-size:11px;padding:4px 10px;border-radius:14px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);cursor:pointer">🔄 รีเฟรช</button>`;
      if (isAdmin) {
        html += `<button onclick="if(confirm('ออกจากสิทธิ์ Admin? (จะกลับเป็นมุมมองผู้บริหาร)'))location.href='/logout/'" title="ออกจากสิทธิ์ Admin" style="font-size:11px;padding:4px 10px;border-radius:14px;border:.5px solid var(--red-mid);background:var(--red-bg);color:var(--red);cursor:pointer">🚪 ออก Admin</button>`;
      } else if (canViewAll) {
        // ผู้บริหาร (executive) — โชว์ปุ่ม ADMIN ให้ upgrade ได้
        html += `<button onclick="openAdminLogin()" title="เข้าสู่ระบบในฐานะ Admin" style="font-size:11px;padding:4px 12px;border-radius:14px;border:.5px solid var(--amber);background:var(--amber-bg);color:var(--amber);cursor:pointer;font-weight:700">🔐 ADMIN</button>`;
      }
      html += `</div></header>`;

      // Last fetch
      if(D.meta?.generatedAt) {
        const d = new Date(D.meta.generatedAt);
        html += `<div style="font-size:10px;color:var(--t3);margin-bottom:8px;text-align:right">🕑 ดึงข้อมูลล่าสุด: ${d.toLocaleString('th-TH',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})}</div>`;
      }

      // Tabs
      html += `<div style="display:flex;gap:2px;background:var(--bg2);padding:3px;border-radius:24px;border:.5px solid var(--bd);margin-bottom:10px">`;
      [{id:'o',l:'📊 ภาพรวม'},{id:'a',l:'🎬 กิจกรรม'},{id:'b',l:'📋 จอง'},{id:'s',l:'👤 เซลล์'}].forEach(t => {
        html += `<button class="ntab${tab===t.id?' on':''}" onclick="switchTab('${t.id}')">${t.l}</button>`;
      });
      html += `</div>`;

      // Date filter bar
      html += renderDateFilterBar();

      // Tab content
      if(tab==='o') html += renderOverview(sellers, dilMap, sellerNames);
      else if(tab==='a') html += renderActivity(sellers);
      else if(tab==='b') html += renderBookings(sellerNames);
      else if(tab==='s') html += renderSeller(sellers, sellerNames, dilMap);

      root.innerHTML = html;
      if(tab==='o') initCharts();
    }

    // ── Charts (Chart.js) ──
    const __charts = {};
    function destroyChart(id) {
      if (__charts[id]) { __charts[id].destroy(); delete __charts[id]; }
    }
    function initCharts() {
      if (typeof Chart === 'undefined') return;
      const ms = D.monthlySummary || {};
      const isDaily = dfMonth > 0;
      // เซลล์ที่ admin กำลังสวมมุมมอง หรือ เซลล์ตัวเองตอนไม่ใช่ admin
      const focusSeller = !canViewAll ? employee.nickname : impersonate;
      let labels, leadNormal, leadRJ, bookings, dones, dealValue;

      if (isDaily) {
        // รายวันของเดือนที่เลือก
        const dailySrc = focusSeller
          ? ((D.dailyBySeller || {})[focusSeller] || {})
          : (D.dailyByMonth || {});
        const daily = dailySrc[dfMonth] || { leads:[], leadRJ:[], bookings:[], dones:[], dealValue:[] };
        const yr = (D.meta && D.meta.year) || new Date().getFullYear();
        const daysInMonth = new Date(yr, dfMonth, 0).getDate();
        labels = []; leadNormal = []; leadRJ = []; bookings = []; dones = []; dealValue = [];
        for (let d = 1; d <= daysInMonth; d++) {
          labels.push(String(d));
          leadNormal.push((daily.leads || [])[d] || 0);
          leadRJ.push((daily.leadRJ || [])[d] || 0);
          bookings.push((daily.bookings || [])[d] || 0);
          dones.push((daily.dones || [])[d] || 0);
          dealValue.push((daily.dealValue || [])[d] || 0);
        }
      } else {
        // รายเดือนทั้งปี
        labels = C.MONTHS_SHORT;
        leadNormal = []; leadRJ = []; bookings = []; dones = []; dealValue = [];
        for (let m = 1; m <= 12; m++) {
          const x = ms[m] || {};
          if (focusSeller) {
            const ss = (x.sellers || {})[focusSeller] || {};
            leadNormal.push(ss.leadNormal || 0);
            leadRJ.push(ss.leadRJ || 0);
            bookings.push(ss.booking || 0);
            dones.push(ss.done || 0);
            dealValue.push(ss.dealValue || 0);
          } else {
            leadNormal.push(x.leadNormal || 0);
            leadRJ.push(x.leadRJ || 0);
            bookings.push(x.totalBookings || 0);
            dones.push(x.totalDone || 0);
            dealValue.push(x.totalDealValue || 0);
          }
        }
      }

      // 1) Line — Lead
      const cv1 = document.getElementById('chart-leads');
      if (cv1) {
        destroyChart('leads');
        __charts.leads = new Chart(cv1, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              { label: 'Lead ปกติ', data: leadNormal, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,.15)', tension: .35, fill: true, pointRadius: isDaily ? 2 : 3 },
              { label: 'RJ', data: leadRJ, borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,.10)', tension: .35, fill: true, pointRadius: isDaily ? 2 : 3 },
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
          }
        });
      }

      // 2) Bar — จอง vs ปล่อย
      const cv2 = document.getElementById('chart-book-done');
      if (cv2) {
        destroyChart('bookDone');
        __charts.bookDone = new Chart(cv2, {
          type: 'bar',
          data: {
            labels: labels,

    function renderOverview(sellers, dilMap, sellerNames) {

      const MF = ["","มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

      // Deal Value — รวมยอดปล่อยรถ (฿) ของ ช่วงที่กรอง
      const dvDeal = ms ? (ms.totalDealValue||0) : (D.summary.totalDealValue||0);

      const momActive = dfMonth > 0 && !isToday && dfMonth >= 2;
      const m_lead    = momActive ? getMoM(dfMonth, 'totalLeads')     : null;
      const m_follow  = momActive ? getMoM(dfMonth, 'totalFollow')    : null;
      const m_book    = momActive ? getMoM(dfMonth, 'totalBookings')  : null;
      const m_done    = momActive ? getMoM(dfMonth, 'totalDone')      : null;
      const m_deal    = momActive ? getMoM(dfMonth, 'totalDealValue') : null;
      const m_rj      = momActive ? getMoM(dfMonth, 'leadRJ')         : null;
      const kpis = [
        {l:"Lead"+(isToday?" วันนี้":dfMonth>0?" เดือนนี้":" ทั้งปี"),v:fmtNum(sm.totalLeads||0),s:"รายการ"+momBadge(m_lead),c:"var(--t1)",mk:"totalLeads"},
        {l:"ติดตามอยู่",v:fmtNum(sm.totalFollow||0),s:pct(sm.totalFollow||0,sm.totalLeads||1)+"%"+momBadge(m_follow, true),c:"var(--blue)",mk:"totalFollow"},
        {l:"จองแล้ว",v:fmtNum(ms?ms.totalBookings:D.summary.totalBookings),s:"Conv "+pct(ms?ms.totalBookings:D.summary.totalBookings,sm.totalLeads||1)+"%"+momBadge(m_book),c:"var(--green)",mk:"totalBookings"},
        {l:"ปิดได้",v:fmtNum(ms?ms.totalDone:D.summary.totalDone),s:pct(ms?ms.totalDone:D.summary.totalDone,D.summary.totalTarget)+"%  ของเป้า"+momBadge(m_done),c:"var(--green-mid)",mk:"totalDone"},
        {l:"💰 ยอดปล่อย",v:fmtBaht(dvDeal),s:(dvAvg?("เฉลี่ย "+fmtBaht(dvAvg)+"/คัน"):"ยังไม่มีปล่อย")+momBadge(m_deal, false, fmtBaht),c:"var(--green-mid)",mk:"totalDealValue"},
        {l:"เป้าหมาย",v:fmtNum(D.summary.totalTarget),s:"เคส/เดือน",c:"var(--amber)"},
        {l:"RJ",v:fmtNum(ms?ms.leadRJ:D.summary.leadRJ),s:"จาก "+(ms?ms.leadNormal:D.summary.leadNormal)+" ปกติ"+momBadge(m_rj, true),c:"var(--red)",mk:"leadRJ"},
      ];
      const pipeColors = {"รอเซ็นต์":"var(--blue)","รอผล":"var(--amber)","รอปล่อย":"var(--amber)","ปล่อย":"var(--green-mid)","รีเจ็ก":"var(--red)","จอง":"var(--green)"};

      let html = '';

      // Mode toggle
      html += `<div style="display:flex;gap:6px;margin-bottom:10px;align-items:center">`;
      html += `<span style="font-size:12px;color:var(--t2)">แสดงข้อมูล:</span>`;
      html += `<button class="sbtn${curMode==='month'?' on':''}" onclick="curMode='month';render()">เดือนนี้</button>`;
      html += `<button class="sbtn${curMode==='today'?' on':''}" onclick="curMode='today';render()">วันนี้</button>`;
      html += `<span style="font-size:11px;color:var(--t3)">${modeLabel}</span></div>`;

      // MoM hint (ถ้ามี)
      if (momActive) {
        const curMonthName = C.MONTHS_FULL[dfMonth-1] || '';
        const prevFull = C.MONTHS_FULL[dfMonth-2] || '';
        html += `<div style="font-size:11px;color:var(--t3);margin-bottom:6px;padding:4px 10px;background:var(--bg2);border-radius:8px;display:inline-block">📊 % คือเทียบ <b style="color:var(--t1)">${curMonthName}</b> vs <b style="color:var(--t1)">${prevFull}</b></div>`;
      }

      // KPI Grid — k.v ถูก pre-format มาแล้ว, k.mk = metric key (กดได้ถ้ามี)
      html += `<div class="kgrid">`;
      kpis.forEach(k => {
        const clickAttr = k.mk
          ? ` onclick="openMetricDetail('${k.mk}')" style="cursor:pointer" title="คลิกดูรายละเอียด + trend 12 เดือน"`
          : '';
        html += `<div class="kpi"${clickAttr}><div class="kl">${k.l}${k.mk?' <span style=\"font-size:9px;color:var(--t3);font-weight:400\">↗ ดูเพิ่ม</span>':''}</div><div class="kv" style="color:${k.c}">${k.v}</div><div class="ks">${k.s}</div></div>`;
      });
      html += `</div>`;

      // Charts
      const _focusName = (!canViewAll ? employee.nickname : impersonate);
      const _focusSuffix = _focusName ? ` · ${h(_focusName)}` : ``;
      const _chartPeriod = dfMonth > 0
        ? `รายวัน — เดือน${C.MONTHS_FULL[dfMonth-1]}`

      const _pipePeriod = dfMonth > 0 ? `เดือน${C.MONTHS_FULL[dfMonth-1]}` : `ทั้งปี`;
      html += `<div class="cgrid">`;
      html += `<div class="card chart-card"><div class="card-title">📈 ยอด Lead ${_chartPeriod}${_focusSuffix}</div><div class="chart-box"><canvas id="chart-leads"></canvas></div></div>`;
      html += `<div class="card chart-card"><div class="card-title">📊 ยอดจอง / ปล่อย ${_chartPeriod}${_focusSuffix}</div><div class="chart-box"><canvas id="chart-book-done"></canvas></div></div>`;
      html += `<div class="card chart-card span2"><div class="card-title">💰 ยอดปล่อย (Deal Value) ${_chartPeriod}${_focusSuffix} · รวม ${fmtBaht(dvDeal)}</div><div class="chart-box"><canvas id="chart-deal-value"></canvas></div></div>`;
      html += `<div class="card chart-card span2"><div class="card-title">🥯 ภาพรวมสถานะดีล (${_pipePeriod}${_focusSuffix})</div><div class="chart-box"><canvas id="chart-pipeline"></canvas></div></div>`;
      html += `</div>`;

      // Pipeline
      html += `<div class="card"><div class="card-title">📋 Pipeline ดีล</div><div class="pipe-row">`;
      Object.entries(pl).forEach(([k,v]) => {
        html += `<div class="pipe-item"><div class="pipe-num" style="color:${pipeColors[k]||'var(--t1)'}">${v}</div><div class="pipe-lbl">${k}</div></div>`;
      });
      html += `</div></div>`;

      // Teams
      // MoM per-team helper
      function teamMoM(tid, key) {
        if (!momActive) return null;
        const ms_ = D.monthlySummary || {};
        const cur  = ((ms_[dfMonth]   || ms_[String(dfMonth)]   || {}).teams || {})[tid] || {};
        const prev = ((ms_[dfMonth-1] || ms_[String(dfMonth-1)] || {}).teams || {})[tid] || {};
        const c = Number(cur[key] || 0);
        const p = Number(prev[key] || 0);
        if (c === 0 && p === 0) return null;
        const delta = c - p;
        const pctv = p > 0 ? Math.round((delta/p)*1000)/10 : (c > 0 ? 999 : 0);
        return {cur:c, prev:p, delta, pct:pctv, isUp: delta >= 0};
      }

      html += `<div class="card"><div class="card-title">👥 แยกตามทีม</div>`;
      Object.entries(D.teams||{}).forEach(([tid,t]) => {
        const mt = ms?.teams?.[tid];
        const tLead=mt?mt.lead:t.lead, tFollow=mt?mt.follow:t.follow;
        const tBooking=mt?mt.booking:t.booking, tDone=mt?mt.done:t.done;
        const tDealValue = mt ? (mt.dealValue||0) : (t.dealValue||0);
        const conv=pct(tBooking,tLead), tPct=pct(tDone,t.target);
        const cPct = t.clipTarget>0 ? Math.min((t.clip/t.clipTarget)*100,100) : 0;
        // MoM
        const t_mLead = teamMoM(tid, 'lead');
        const t_mDone = teamMoM(tid, 'done');
        const t_mBook = teamMoM(tid, 'booking');

        html += `<div class="team-card ${tid}">`;
        html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:4px">`;
        html += `<span style="font-size:13px;font-weight:700;color:${C.TEAM_COLORS[tid]}">${C.TEAM_NAMES[tid]}</span>`;
        html += `<span style="font-size:11px;color:var(--t2)">${t.members.join(' · ')}</span></div>`;
        html += `<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px;text-align:center">`;
        html += `<div><div style="font-size:10px;color:var(--t3)">Lead</div><div style="font-size:15px;font-weight:600;color:${C.TEAM_COLORS[tid]}">${tLead}</div>${momBadge(t_mLead)}</div>`;
        html += `<div><div style="font-size:10px;color:var(--t3)">ติดตาม</div><div style="font-size:15px;font-weight:600;color:var(--blue)">${tFollow}</div></div>`;
        html += `<div><div style="font-size:10px;color:var(--t3)">จอง</div><div style="font-size:15px;font-weight:600;color:var(--green)">${tBooking}</div>${momBadge(t_mBook)}</div>`;
        html += `<div onclick="event.stopPropagation();openTeamDoneDetail('${tid}')" style="cursor:pointer" title="กดดูเซลล์ในทีมที่ปล่อย"><div style="font-size:10px;color:var(--t3)">ปิด/เป้า ↗</div><div style="font-size:15px;font-weight:600;color:${tDone>=t.target?'var(--green)':'var(--amber)'}">${tDone}/${t.target}</div>${momBadge(t_mDone)}</div>`;
        html += `<div><div style="font-size:10px;color:var(--t3)">Conv</div><div style="font-size:15px;font-weight:600;color:${conv>=8?'var(--green)':conv>=4?'var(--amber)':'var(--red)'}">${conv}%</div></div>`;
        html += `</div>`;
        // Deal Value row
        html += `<div style="margin-bottom:6px;padding:6px 8px;background:var(--green-bg);border-radius:6px;text-align:center">`;
        html += `<div style="font-size:10px;color:var(--t3)">💰 ยอดปล่อย</div><div style="font-size:14px;font-weight:700;color:var(--green-mid)">${fmtBaht(tDealValue)} ${momBadge(t_mDeal, false, fmtBaht)}</div>`;
        html += `</div>`;
        // Progress bars
        html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">`;
        html += `<div><div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px"><span style="color:var(--t3)">เป้าจบ ${t.done}/${t.target}</span><span style="color:${C.TEAM_COLORS[tid]}">${tPct}%</span></div><div class="pbr" style="height:5px"><div class="pbf" style="width:${Math.min(tPct,100)}%;background:${C.TEAM_COLORS[tid]}"></div></div></div>`;
        html += `<div><div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px"><span style="color:var(--t3)">📡${t.live} 🎬${t.clip}/${t.clipTarget}</span><span style="color:${t.clip>=t.clipTarget?'var(--green)':'var(--amber)'}">${Math.round(cPct)}%</span></div><div class="pbr" style="height:5px"><div class="pbf" style="width:${Math.min(cPct,100)}%;background:${t.clip>=t.clipTarget?'var(--green-mid)':'var(--purple-mid)'}"></div></div></div>`;
        html += `</div></div>`;
      });
      html += `</div>`;

      // Seller table — เพิ่มมูลค่าดีล (฿ ปล่อย)
      const _sval = (s, key) => {
        const msd = ms?.sellers?.[s.name];
        return msd ? (msd[key]||0) : (s[key]||0);
      };
      let ss = [...sellers];
      if(msort==='booking') ss.sort((a,b)=>b.booking-a.booking);
      else if(msort==='diligent') ss.sort((a,b)=>(dilMap[b.name]?.tot||0)-(dilMap[a.name]?.tot||0));
      else if(msort==='done') ss.sort((a,b)=>b.done-a.done);
      else if(msort==='dealValue') ss.sort((a,b)=>_sval(b,'dealValue')-_sval(a,'dealValue'));
      else ss.sort((a,b)=>b.lead-a.lead);

      html += `<div class="card">`;
      html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px">`;
      html += `<div class="card-title" style="margin:0">สรุปรายเซลล์</div>`;
      html += `<select onchange="msort=this.value;render()"><option value="lead" ${msort==='lead'?'selected':''}>Lead มากสุด</option><option value="booking" ${msort==='booking'?'selected':''}>จองสูงสุด</option><option value="diligent" ${msort==='diligent'?'selected':''}>ติดตามมาก</option><option value="done" ${msort==='done'?'selected':''}>ปิดมากสุด</option><option value="dealValue" ${msort==='dealValue'?'selected':''}>฿ ปล่อยสูงสุด</option></select></div>`;
      html += `<div class="shdr" style="grid-template-columns:1.4fr .6fr .6fr .6fr .6fr .9fr .7fr .7fr 1fr"><span>เซลล์</span><span style="text-align:right">Lead</span><span style="text-align:right">ติดตาม</span><span style="text-align:right">จอง</span><span style="text-align:right">ปิด</span><span style="text-align:right">฿ ปล่อย</span><span style="text-align:right">คลิป</span><span style="text-align:right">ไลฟ์</span><span>Conv%</span></div>`;
      ss.forEach(s => {

        const sDealVal = msd ? (msd.dealValue||0) : (s.dealValue||0);
        const conv=pct(sBooking,sLead), cPct2=pct(s.clip,s.clipTarget||1);

        const d=dilMap[s.name]; const avg=d&&d.cnt?Math.round((d.tot/d.cnt)*10)/10:0;
        // Virtual "❓ ไม่ระบุ" row — เคสที่ seller ไม่อยู่ใน ALL_SELLERS → กดเพื่อดูรายชื่อต้นฉบับ
        const isUnknown = s.name === '❓ ไม่ระบุ';
        const rowClick = isUnknown
          ? `onclick="alert('🔍 เซลล์ใน sheet ที่ไม่ตรงกับ ALL_SELLERS:\\n\\n' + (${JSON.stringify(s.unknownSellerNames||[])}).join('\\n') + '\\n\\n💡 เพิ่มชื่อใน sheet ตั้งค่าเซลล์ หรือใส่ใน normalize_seller() ให้ map ชื่อนี้')" style="background:var(--amber-bg);cursor:help"`
          : `onclick="switchToSeller('${h(s.name)}')"`;
        html += `<div class="srow" style="grid-template-columns:1.4fr .6fr .6fr .6fr .6fr .9fr .7fr .7fr 1fr" ${rowClick}>`;
        html += `<span style="font-weight:600">${h(s.name)}<span style="font-size:9px;padding:1px 4px;border-radius:4px;background:${C.TEAM_COLORS[s.team]||'var(--t3)'};color:#fff;margin-left:2px">${s.team}</span></span>`;
        html += `<span style="text-align:right">${sLead}</span>`;
        html += `<span style="text-align:right;color:var(--blue)">${sFollow}</span>`;
        html += `<span style="text-align:right;color:var(--green)">${sBooking}</span>`;
        html += `<span style="text-align:right;color:var(--green-mid)">${sDone}</span>`;
        html += `<span style="text-align:right;color:var(--green-mid);font-weight:600">${fmtBaht(sDealVal)}</span>`;
        html += `<span style="text-align:right;color:${cPct2>=100?'var(--green)':'var(--amber)'}">${s.clip}/${s.clipTarget}</span>`;
        html += `<span style="text-align:right;color:${s.live>0?'var(--blue)':'var(--t3)'}">${s.live}</span>`;
        html += `<div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px"><span class="sbdg" style="background:${tBg};color:${tC}">${conv}% Conv</span><span style="font-size:10px;color:var(--t3)">🔁${avg}x</span></div><div class="pbr"><div class="pbf" style="width:${Math.min(cPct2,100)}%;background:var(--green-mid)"></div></div></div>`;
        html += `</div>`;
      });
      html += `</div>`;

      // ── Admin/Executive only sections: Lead by Car + Released Cars ──
      if (canViewAll) {
        html += renderLeadCarsTable();
        html += renderReleasedCarsTable();
      }

      // Follow cases section
      html += renderFollowCasesSection();

      // 3-col panels
      const nu = {};
      (FD.followCases||[]).filter(l=>l.updateCount===0 && ir(l.dateIn)).forEach(l=>{nu[l.seller]=(nu[l.seller]||0)+1;});
      const topBook = [...sellers].sort((a,b)=>b.booking-a.booking).slice(0,6);
      // Top มูลค่าดีล (฿ ปล่อย) — ใช้ค่าตาม ms ถ้ามี filter เดือน
      const topDealValue = [...sellers]
        .map(s => ({...s, _dv: _sval(s, 'dealValue'), _done: _sval(s, 'done')}))
        .filter(s => s._dv > 0)
        .sort((a,b)=>b._dv - a._dv)
        .slice(0,6);
      const medals = ['🥇','🥈','🥉','4.','5.','6.'];
      const dilEntries = Object.entries(dilMap).map(([n,d])=>({n,avg:d.cnt?Math.round((d.tot/d.cnt)*10)/10:0,high:d.high})).sort((a,b)=>b.avg-a.avg).slice(0,6);

      html += `<div class="g3">`;
      // No update
      html += `<div class="card" style="margin:0"><div class="card-title">🔴 ยังไม่อัพเดท</div>`;
      const nuEntries = Object.entries(nu).sort((a,b)=>b[1]-a[1]).slice(0,6);
      if(nuEntries.length===0) html += `<span style="font-size:12px;color:var(--t3)">ทุกเคสอัพเดทแล้ว 🎉</span>`;
      nuEntries.forEach(([name,count])=>{
        html += `<div class="prow" onclick="switchToSeller('${h(name)}')"><span style="font-weight:500">${h(name)}</span><span style="color:var(--red);font-weight:500">${count} เคส</span></div>`;
      });
      html += `</div>`;
      // Top มูลค่าดีล (ใหม่)
      html += `<div class="card" style="margin:0"><div class="card-title">💰 Top มูลค่าดีล</div>`;
      if(topDealValue.length===0) html += `<span style="font-size:12px;color:var(--t3)">ยังไม่มีดีลปล่อย</span>`;
      topDealValue.forEach((s,i)=>{
        html += `<div class="prow" onclick="switchToSeller('${h(s.name)}')"><span style="font-weight:500">${medals[i]} ${h(s.name)}</span><span style="color:var(--green-mid);font-weight:600">${fmtBaht(s._dv)} <span style="color:var(--t3);font-weight:400;font-size:10px">· ${s._done} คัน</span></span></div>`;
      });
      html += `</div>`;
      // Top booking
      html += `<div class="card" style="margin:0"><div class="card-title">🏆 Top จอง</div>`;
      topBook.forEach((s,i)=>{
        html += `<div class="prow" onclick="switchToSeller('${h(s.name)}')"><span style="font-weight:500">${medals[i]} ${h(s.name)}</span><span style="color:var(--green);font-weight:500">${s.booking} จอง · ${pct(s.booking,s.lead)}%</span></div>`;
      });
      html += `</div></div>`;
      // Diligent (เป็นแถวเดียวใหม่ใต้ 3-col)
      html += `<div class="card"><div class="card-title">🔁 ติดตามมาก</div>`;
      dilEntries.forEach(d=>{
        html += `<div class="dilrow" onclick="switchToSeller('${h(d.n)}')" style="cursor:pointer"><span style="font-size:12px;font-weight:500;min-width:44px">${h(d.n)}</span><div class="dilbar"><div class="dilfill" style="width:${Math.min((d.avg/C.UPD_TGT)*100,100)}%;background:var(--blue)"></div></div><span style="font-size:11px;color:var(--blue);font-weight:600;min-width:26px;text-align:right">${d.avg}x</span><span style="font-size:10px;color:var(--amber)">🔥${d.high}</span></div>`;
      });
      html += `</div>`;

      // Hot cases
      html += renderHotCases(sellerNames);

      return html;
    }

    // ── Lead by Car Model (admin/executive only) ──
    function renderLeadCarsTable() {
      const monthKey = dfMonth > 0 ? dfMonth : 0;  // 0 = ทั้งปี
      const src = (D.leadCarsByMonth || {})[monthKey]
               || (D.leadCarsByMonth || {})[String(monthKey)]
               || {};
      let entries = Object.entries(src).map(([car, cnt]) => ({car, cnt}));
      if (leadCarHideUnknown) {
        entries = entries.filter(e => e.car !== 'ไม่ระบุ');
      }
      if (leadCarQuery.trim()) {
        const q = leadCarQuery.trim().toLowerCase();
        entries = entries.filter(e => e.car.toLowerCase().includes(q));
      }
      entries.sort((a,b) => b.cnt - a.cnt);
      const totalLead = entries.reduce((a,e)=>a+e.cnt,0);
      // Pagination
      const totalPages = Math.max(1, Math.ceil(entries.length / LEAD_CAR_PAGE_SIZE));
      if (leadCarPage > totalPages) leadCarPage = totalPages;
      if (leadCarPage < 1) leadCarPage = 1;
      const startIdx = (leadCarPage - 1) * LEAD_CAR_PAGE_SIZE;
      const top = entries.slice(startIdx, startIdx + LEAD_CAR_PAGE_SIZE);
      const periodLbl = dfMonth > 0 ? `เดือน${C.MONTHS_FULL[dfMonth-1]}` : 'ทั้งปี';

      let html = `<div class="card">`;
      html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px">`;
      html += `<div class="card-title" style="margin:0">🚗 Lead รถรุ่นยอดนิยม <span style="font-size:11px;font-weight:400;color:var(--t3)">(${periodLbl} · ${entries.length} รุ่น · ${totalLead} เคส)</span></div>`;
      html += `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">`;
      html += `<input type="text" placeholder="🔍 ค้นหา..." value="${h(leadCarQuery)}" oninput="leadCarQuery=this.value;leadCarPage=1;render()" style="padding:4px 8px;border:.5px solid var(--bd);border-radius:6px;font-size:11px;width:120px;background:var(--bg)">`;
      html += `<label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--t2);cursor:pointer"><input type="checkbox" ${leadCarHideUnknown?'checked':''} onchange="leadCarHideUnknown=this.checked;leadCarPage=1;render()"> ซ่อน 'ไม่ระบุ'</label>`;
      html += `</div></div>`;

      if (top.length === 0) {
        html += `<div style="text-align:center;color:var(--t3);padding:18px;font-size:12px">ไม่มีข้อมูล</div>`;
      } else {
        html += `<div class="shdr" style="grid-template-columns:.5fr 4fr 1fr 1fr 2fr"><span>#</span><span>รถรุ่น</span><span style="text-align:right">Lead</span><span style="text-align:right">%</span><span>สัดส่วน</span></div>`;
        const maxCnt = entries[0].cnt;  // base scale = อันดับ 1 ของผลกรอง
        top.forEach((e, i) => {
          const pctVal = totalLead > 0 ? Math.round(e.cnt/totalLead*1000)/10 : 0;
          const barW = Math.round(e.cnt/maxCnt*100);
          const safeCar = String(e.car).replace(/'/g, "\\'").replace(/"/g, '&quot;');
          const rank = startIdx + i + 1;
          html += `<div class="srow" style="grid-template-columns:.5fr 4fr 1fr 1fr 2fr;cursor:pointer" onclick="openCarDetail('${safeCar}')" title="คลิกดูเซลล์ที่รับเคสรถนี้">`;
          html += `<span style="color:var(--t3);font-size:11px">${rank}</span>`;
          html += `<span style="font-weight:500;color:var(--blue)">🚗 ${h(e.car).slice(0,60)}</span>`;
          html += `<span style="text-align:right;font-weight:600;color:var(--blue)">${e.cnt}</span>`;
          html += `<span style="text-align:right;color:var(--t3);font-size:11px">${pctVal}%</span>`;
          html += `<div><div class="pbr"><div class="pbf" style="width:${barW}%;background:var(--blue)"></div></div></div>`;
          html += `</div>`;
        });
        // Pagination controls — ไป/กลับ
        if (totalPages > 1) {
          const prevDis = leadCarPage <= 1;
          const nextDis = leadCarPage >= totalPages;
          html += `<div style="display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 0 4px">`;
          html += `<button onclick="leadCarPage=Math.max(1,leadCarPage-1);render()" ${prevDis?'disabled':''} style="padding:5px 14px;border-radius:8px;border:.5px solid var(--bd2);background:${prevDis?'var(--bg2)':'var(--bg)'};color:${prevDis?'var(--t3)':'var(--t1)'};font-size:12px;cursor:${prevDis?'not-allowed':'pointer'};font-weight:600">← กลับ</button>`;
          html += `<span style="font-size:12px;color:var(--t2);font-weight:600">หน้า ${leadCarPage}/${totalPages} <span style="font-size:10px;color:var(--t3);font-weight:400">· อันดับ ${startIdx+1}-${Math.min(startIdx+LEAD_CAR_PAGE_SIZE, entries.length)} จาก ${entries.length}</span></span>`;
          html += `<button onclick="leadCarPage=Math.min(${totalPages},leadCarPage+1);render()" ${nextDis?'disabled':''} style="padding:5px 14px;border-radius:8px;border:.5px solid var(--bd2);background:${nextDis?'var(--bg2)':'var(--bg)'};color:${nextDis?'var(--t3)':'var(--t1)'};font-size:12px;cursor:${nextDis?'not-allowed':'pointer'};font-weight:600">ไป →</button>`;
          html += `</div>`;
        }
      }
      html += `</div>`;
      return html;
    }

    // ── Released Cars list (admin/executive only) ──
    function renderReleasedCarsTable() {
      // ใส่ index จาก D.bookingCases เพื่อใช้เปิด detail modal
      const indexed = (D.bookingCases || []).map((b, i) => ({...b, _idx: i}));
      // กรองตาม status (default = 'ปล่อย' / all = ทุกสถานะ)
      let base = releasedStatus === 'all' ? indexed : indexed.filter(b => b.status === releasedStatus);
      // กรองตามเดือนที่เลือก (ใช้ releaseDate, fallback date)
      let cars = base.filter(b => {
        if (dfMonth <= 0) return true;
        const useDate = b.releaseDate || b.date || '';
        const parts = useDate.split('/');
        return parts.length >= 2 && parseInt(parts[1]) === dfMonth;
      });
      // กรอง seller dropdown
      if (releasedSeller !== 'all') {
        cars = cars.filter(b => b.seller === releasedSeller);
      }
      // เรียง
      const parseDmy = (s) => {
        if (!s) return 0;
        const p = String(s).split('/');
        if (p.length < 3) return 0;
        let y = parseInt(p[2]);
        if (y < 100) y += 2000;
        if (y > 2500) y -= 543;
        return y*10000 + (parseInt(p[1])||0)*100 + (parseInt(p[0])||0);
      };
      const ageDays = (dateStr) => {
        const p = String(dateStr||'').split('/');
        if (p.length < 3) return null;
        let y = parseInt(p[2]); if (y<100) y+=2000; if (y>2500) y-=543;
        const d = new Date(y, (parseInt(p[1])||1)-1, parseInt(p[0])||1);
        return isNaN(d) ? null : Math.floor((Date.now() - d.getTime())/86400000);
      };
      if (releasedSort === 'price') cars.sort((a,b) => (b.price||0) - (a.price||0));
      else if (releasedSort === 'seller') cars.sort((a,b) => (a.seller||'').localeCompare(b.seller||''));
      else if (releasedSort === 'age') cars.sort((a,b) => parseDmy(a.releaseDate||a.date) - parseDmy(b.releaseDate||b.date));
      else cars.sort((a,b) => parseDmy(b.releaseDate||b.date) - parseDmy(a.releaseDate||a.date));

      const totalPrice = cars.reduce((a,b)=>a+(b.price||0),0);
      const sellerNames = Array.from(new Set(base.map(b=>b.seller).filter(Boolean))).sort();
      const periodLbl = dfMonth > 0 ? `เดือน${C.MONTHS_FULL[dfMonth-1]}` : 'ทั้งปี';
      const statusLbl = releasedStatus === 'all' ? 'ทุกสถานะ' : releasedStatus;
      const titleEmoji = releasedStatus === 'ปล่อย' ? '🏁' : releasedStatus === 'all' ? '📋' : '🟡';

      // Pagination
      const totalPages = Math.max(1, Math.ceil(cars.length / RELEASED_PAGE_SIZE));
      if (releasedPage > totalPages) releasedPage = totalPages;
      if (releasedPage < 1) releasedPage = 1;
      const startIdx = (releasedPage - 1) * RELEASED_PAGE_SIZE;
      const pageCars = cars.slice(startIdx, startIdx + RELEASED_PAGE_SIZE);

      let html = `<div class="card">`;
      html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px">`;
      html += `<div class="card-title" style="margin:0">${titleEmoji} เคสจอง · <span style="color:var(--blue)">${h(statusLbl)}</span> <span style="font-size:11px;font-weight:400;color:var(--t3)">(${periodLbl} · ${cars.length} คัน${releasedStatus==='ปล่อย'?` · ${fmtBaht(totalPrice)}`:''})</span></div>`;
      html += `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">`;
      // Status filter — ปล่อย default + ทุกสถานะ + แต่ละ status
      const statuses = ['ปล่อย','all','จอง','รอเซ็นต์','รอผล','รอปล่อย','รีเจ็ก'];
      html += `<select onchange="releasedStatus=this.value;releasedPage=1;render()" style="font-size:11px">`;
      statuses.forEach(st => {
        const lbl = st === 'all' ? 'ทุกสถานะ' : st;
        html += `<option value="${st}" ${releasedStatus===st?'selected':''}>${lbl}</option>`;
      });
      html += `</select>`;
      html += `<select onchange="releasedSeller=this.value;releasedPage=1;render()" style="font-size:11px"><option value="all" ${releasedSeller==='all'?'selected':''}>ทุกเซลล์</option>`;
      sellerNames.forEach(n => { html += `<option value="${h(n)}" ${releasedSeller===n?'selected':''}>${h(n)}</option>`; });
      html += `</select>`;
      html += `<select onchange="releasedSort=this.value;render()" style="font-size:11px"><option value="date" ${releasedSort==='date'?'selected':''}>ล่าสุดก่อน</option><option value="age" ${releasedSort==='age'?'selected':''}>เก่าสุดก่อน</option><option value="price" ${releasedSort==='price'?'selected':''}>ราคามากสุด</option><option value="seller" ${releasedSort==='seller'?'selected':''}>เซลล์</option></select>`;
      html += `</div></div>`;

      if (cars.length === 0) {
        html += `<div style="text-align:center;color:var(--t3);padding:18px;font-size:12px">ไม่มีเคสในช่วงนี้</div>`;
      } else {
        html += `<div class="shdr" style="grid-template-columns:.85fr .7fr .8fr 2fr .85fr .9fr"><span>วันที่</span><span>เก่า</span><span>เซลล์</span><span>รถ</span><span>ทะเบียน</span><span style="text-align:right">ราคา</span></div>`;
        html += `<div>`;
        pageCars.forEach(b => {
          const carLbl = (b.car||'-') + (b.year ? ` (${b.year})` : '');
          const dispDate = b.releaseDate || b.date || '-';
          const ageN = ageDays(dispDate);
          const ageBadge = ageN == null ? '-' : (ageN > 90 ? `<span style="color:var(--red);font-weight:600">${ageN}d</span>` : ageN > 30 ? `<span style="color:var(--amber);font-weight:600">${ageN}d</span>` : `<span style="color:var(--green-mid);font-weight:600">${ageN}d</span>`);
          const teamCol = C.TEAM_COLORS[(D.sellers||[]).find(s=>s.name===b.seller)?.team]||'var(--t1)';
          const stColor = (C.STATUS_COLOR||{})[b.status] || '#888';
          html += `<div class="srow" style="grid-template-columns:.85fr .7fr .8fr 2fr .85fr .9fr;cursor:pointer" onclick="openBookingDetail(${b._idx})">`;
          html += `<span style="font-size:11px;color:var(--t2)">${h(dispDate)}${releasedStatus==='all'?`<br><span style='display:inline-block;padding:1px 5px;border-radius:6px;background:${stColor};color:#fff;font-size:9px;margin-top:2px'>${h(b.status)}</span>`:''}</span>`;
          html += `<span style="font-size:11px">${ageBadge}</span>`;
          html += `<span style="font-weight:600;color:${teamCol}">${h(b.seller||'-')}</span>`;
          html += `<span style="font-size:12px">${h(carLbl).slice(0,60)}</span>`;
          html += `<span style="font-size:11px;color:var(--t3)">${h(b.plate||'-')}</span>`;
          html += `<span style="text-align:right;font-weight:600;color:${b.status==='ปล่อย'?'var(--green-mid)':'var(--t2)'}">${fmtBaht(b.price||0)}</span>`;
          html += `</div>`;
        });
        html += `</div>`;
        // Pagination controls — ไป/กลับ
        if (totalPages > 1) {
          const prevDis = releasedPage <= 1;
          const nextDis = releasedPage >= totalPages;
          html += `<div style="display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 0 4px;border-top:.5px solid var(--bd);margin-top:6px">`;
          html += `<button onclick="releasedPage=Math.max(1,releasedPage-1);render()" ${prevDis?'disabled':''} style="padding:5px 14px;border-radius:8px;border:.5px solid var(--bd2);background:${prevDis?'var(--bg2)':'var(--bg)'};color:${prevDis?'var(--t3)':'var(--t1)'};font-size:12px;cursor:${prevDis?'not-allowed':'pointer'};font-weight:600">← กลับ</button>`;
          html += `<span style="font-size:12px;color:var(--t2);font-weight:600">หน้า ${releasedPage}/${totalPages} <span style="font-size:10px;color:var(--t3);font-weight:400">· แสดง ${startIdx+1}-${Math.min(startIdx+RELEASED_PAGE_SIZE, cars.length)} จาก ${cars.length}</span></span>`;
          html += `<button onclick="releasedPage=Math.min(${totalPages},releasedPage+1);render()" ${nextDis?'disabled':''} style="padding:5px 14px;border-radius:8px;border:.5px solid var(--bd2);background:${nextDis?'var(--bg2)':'var(--bg)'};color:${nextDis?'var(--t3)':'var(--t1)'};font-size:12px;cursor:${nextDis?'not-allowed':'pointer'};font-weight:600">ไป →</button>`;
          html += `</div>`;
        }
      }
      html += `</div>`;
      return html;
    }

    // ── KPI Detail Modal — กดที่ KPI card เพื่อดู trend 12 เดือน + breakdown ──
    function openMetricDetail(metricKey) {
      const cfg = {
        'totalLeads':     {label:'Lead',         emoji:'📩', color:'#374151', invert:false, fmt:fmtNum},
        'totalFollow':    {label:'ติดตามอยู่',    emoji:'📞', color:'#3b82f6', invert:true,  fmt:fmtNum},
        'totalBookings':  {label:'จองแล้ว',       emoji:'📋', color:'#10b981', invert:false, fmt:fmtNum},
        'totalDone':      {label:'ปิดได้',        emoji:'🏁', color:'#059669', invert:false, fmt:fmtNum},
        'totalDealValue': {label:'ยอดปล่อย',     emoji:'💰', color:'#059669', invert:false, fmt:fmtBaht},
        'leadRJ':         {label:'RJ',           emoji:'🚫', color:'#ef4444', invert:true,  fmt:fmtNum},
      }[metricKey];
      if (!cfg) return;
      const old = document.getElementById('metric-detail-overlay');
      if (old) old.remove();

      const ms = D.monthlySummary || {};
      // ดึง 12 เดือนทั้งปี
      const monthData = [];
      let maxVal = 0;
      for (let m = 1; m <= 12; m++) {
        const v = Number((ms[m] || ms[String(m)] || {})[metricKey] || 0);
        monthData.push({m, v});
        if (v > maxVal) maxVal = v;
      }
      const totalYear = monthData.reduce((a,e)=>a+e.v,0);
      const curMonth = (D.meta && D.meta.month) || (new Date().getMonth()+1);
      const focusMonth = dfMonth > 0 ? dfMonth : curMonth;
      const focusVal = monthData[focusMonth-1].v;
      const prevVal  = focusMonth > 1 ? monthData[focusMonth-2].v : 0;
      const delta = focusVal - prevVal;
      const deltaPct = prevVal > 0 ? Math.round(delta/prevVal*1000)/10 : (focusVal>0 ? 999 : 0);
      const goodTrend = cfg.invert ? delta <= 0 : delta >= 0;
      const deltaCol = deltaPct === 0 ? 'var(--t3)' : goodTrend ? 'var(--green)' : 'var(--red)';

      // Team breakdown (เดือน focus)
      const teamData = ((ms[focusMonth] || ms[String(focusMonth)] || {}).teams) || {};
      const teamRows = Object.entries(teamData)
        .filter(([tid]) => tid !== 'ADMIN')
        .map(([tid, t]) => {
          const teamKey = {
            'totalLeads':'lead', 'totalFollow':'follow', 'totalBookings':'booking',
            'totalDone':'done', 'totalDealValue':'dealValue', 'leadRJ':null
          }[metricKey];
          const v = teamKey ? Number(t[teamKey] || 0) : 0;
          return {tid, v};
        })
        .filter(r => r.v > 0 || metricKey === 'leadRJ');

      // RJ ไม่มีใน team breakdown → ข้าม
      const showTeamSection = metricKey !== 'leadRJ' && teamRows.length > 0;
      const teamTotal = teamRows.reduce((a,r)=>a+r.v,0);

      const overlay = document.createElement('div');
      overlay.id = 'metric-detail-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1010;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

      let inner = `<div style="background:var(--bg);border-radius:16px;max-width:680px;width:100%;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.35)" onclick="event.stopPropagation()">`;
      // Header
      inner += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap">`;
      inner += `<div><div style="font-size:11px;color:var(--t3)">รายละเอียด · ${C.MONTHS_FULL[focusMonth-1]}</div>`;
      inner += `<div style="font-size:18px;font-weight:800;color:${cfg.color}">${cfg.emoji} ${cfg.label}</div></div>`;
      inner += `<button onclick="document.getElementById('metric-detail-overlay').remove()" style="padding:6px 14px;border-radius:10px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);font-weight:600;font-size:12px;cursor:pointer">✕ ปิด</button>`;
      inner += `</div>`;

      // Big number + comparisons
      inner += `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">`;
      inner += `<div style="background:${cfg.color}1a;border-radius:10px;padding:12px;text-align:center"><div style="font-size:10px;color:var(--t3)">${C.MONTHS_FULL[focusMonth-1]}</div><div style="font-size:22px;font-weight:800;color:${cfg.color}">${cfg.fmt(focusVal)}</div></div>`;
      inner += `<div style="background:var(--bg2);border-radius:10px;padding:12px;text-align:center"><div style="font-size:10px;color:var(--t3)">${focusMonth > 1 ? C.MONTHS_FULL[focusMonth-2] : '-'}</div><div style="font-size:18px;font-weight:700;color:var(--t2)">${focusMonth > 1 ? cfg.fmt(prevVal) : '-'}</div></div>`;
      if (deltaPct === 999) {
        inner += `<div style="background:var(--blue-bg);border-radius:10px;padding:12px;text-align:center"><div style="font-size:10px;color:var(--t3)">MoM</div><div style="font-size:18px;font-weight:800;color:var(--blue)">✨ ใหม่</div></div>`;
      } else {
        const arrow = delta > 0 ? '↗' : delta < 0 ? '↘' : '→';
        const sign = delta > 0 ? '+' : '';
        inner += `<div style="background:${deltaCol}1a;border-radius:10px;padding:12px;text-align:center"><div style="font-size:10px;color:var(--t3)">MoM</div><div style="font-size:18px;font-weight:800;color:${deltaCol}">${arrow} ${sign}${deltaPct}%</div><div style="font-size:10px;color:var(--t3)">${sign}${cfg.fmt(Math.abs(delta))}</div></div>`;
      }
      inner += `</div>`;

      // 12-month bar trend
      inner += `<div style="font-size:11px;color:var(--t3);font-weight:700;margin-bottom:6px">📈 Trend ทั้งปี · รวม ${cfg.fmt(totalYear)}</div>`;
      inner += `<div style="background:var(--bg2);border-radius:10px;padding:12px;margin-bottom:14px">`;
      inner += `<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:120px">`;
      monthData.forEach(({m, v}) => {
        const ratio = maxVal > 0 ? v/maxVal : 0;
        const h = Math.max(2, Math.round(ratio * 100));
        const isCur = m === focusMonth;
        const bg = isCur ? cfg.color : (cfg.color + '66');
        inner += `<div title="${C.MONTHS_FULL[m-1]}: ${cfg.fmt(v)}" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer" onclick="document.getElementById('metric-detail-overlay').remove();setDf(${m});render()">`;
        inner += `<div style="font-size:9px;color:var(--t3);margin-bottom:2px;${isCur?'font-weight:700;color:'+cfg.color:''}">${v>0?cfg.fmt(v).replace('฿',''):''}</div>`;
        inner += `<div style="width:100%;background:${bg};border-radius:3px 3px 0 0;height:${h}%"></div>`;
        inner += `</div>`;
      });
      inner += `</div>`;
      // Month labels
      inner += `<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:6px">`;
      monthData.forEach(({m}) => {
        const isCur = m === focusMonth;
        inner += `<div style="font-size:10px;text-align:center;color:${isCur?cfg.color:'var(--t3)'};font-weight:${isCur?700:400}">${C.MONTHS_SHORT[m-1]}</div>`;
      });
      inner += `</div>`;
      inner += `</div>`;

      // Team breakdown
      if (showTeamSection) {
        inner += `<div style="font-size:11px;color:var(--t3);font-weight:700;margin-bottom:6px">👥 แยกตามทีม · ${C.MONTHS_FULL[focusMonth-1]}</div>`;
        inner += `<div style="background:var(--bg2);border-radius:10px;padding:10px">`;
        teamRows.sort((a,b)=>b.v-a.v).forEach(r => {
          const ratio = teamTotal > 0 ? r.v/teamTotal : 0;
          const teamCol = C.TEAM_COLORS[r.tid] || 'var(--t3)';
          const teamName = C.TEAM_NAMES[r.tid] || r.tid;
          inner += `<div style="display:grid;grid-template-columns:80px 1fr 80px 50px;gap:8px;align-items:center;padding:5px 0">`;
          inner += `<span style="font-size:12px;font-weight:700;color:${teamCol}">${h(teamName)}</span>`;
          inner += `<div style="height:14px;background:var(--bg);border-radius:4px;overflow:hidden"><div style="height:100%;width:${ratio*100}%;background:${teamCol}"></div></div>`;
          inner += `<span style="font-size:12px;font-weight:600;text-align:right">${cfg.fmt(r.v)}</span>`;
          inner += `<span style="font-size:11px;color:var(--t3);text-align:right">${Math.round(ratio*1000)/10}%</span>`;
          inner += `</div>`;
        });
        inner += `</div>`;
      }
      inner += `<div style="font-size:10px;color:var(--t3);margin-top:10px">💡 คลิกที่แท่งกราฟ trend → กรองไปเดือนนั้น</div>`;
      inner += `</div>`;
      overlay.innerHTML = inner;
      document.body.appendChild(overlay);
    }

    // ── Booking Detail Modal — กดที่แถวรถที่ปล่อย / รถจอง แล้วเปิด ──
    function openBookingDetail(idx) {
      const b = (D.bookingCases || [])[idx];
      if (!b) return;
      const old = document.getElementById('book-detail-overlay');
      if (old) old.remove();

      const overlay = document.createElement('div');
      overlay.id = 'book-detail-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1010;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

      const row = (label, value, opts={}) => {
        if (value == null || value === '' || value === '-') return '';
        const mono = opts.mono ? 'font-family:monospace;' : '';
        const wrap = opts.wrap ? 'white-space:pre-wrap;word-break:break-word;' : '';
        const disp = (typeof value === 'number') ? value.toLocaleString() : h(value);
        return `<div style="display:grid;grid-template-columns:130px 1fr;gap:10px;padding:7px 0;border-bottom:.5px solid var(--bd)">
          <div style="font-size:11px;color:var(--t3);font-weight:600">${h(label)}</div>
          <div style="font-size:12px;color:var(--t1);${mono}${wrap}">${disp}</div>
        </div>`;
      };

      const statusColor = (C.STATUS_COLOR||{})[b.status] || '#888';
      const phoneClean = (b.phone||'').replace(/[^0-9+]/g, '');
      const callLink = phoneClean
        ? `<a href="tel:${phoneClean}" style="background:var(--green);color:#fff;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none">📞 โทร ${h(b.phone)}</a>` : '';

      // คำนวณ "เก่ากี่วันแล้ว" — เทียบจากวันที่จอง/ปล่อย ใกล้สุดที่ parse ได้ กับวันนี้
      const parseDmy = (s) => {
        const p = String(s||'').split('/');
        if (p.length < 3) return null;
        let y = parseInt(p[2]);
        if (y < 100) y += 2000;
        if (y > 2500) y -= 543;
        const d = new Date(y, (parseInt(p[1])||1)-1, parseInt(p[0])||1);
        return isNaN(d) ? null : d;
      };
      const ageDays = (dateStr) => {
        const d = parseDmy(dateStr);
        if (!d) return null;
        return Math.floor((Date.now() - d.getTime()) / 86400000);
      };
      const bookAge = ageDays(b.date);
      const releaseAge = ageDays(b.releaseDate);
      const ageBadge = (n, lbl) => {
        if (n == null) return '';
        const col = n > 90 ? 'var(--red)' : n > 30 ? 'var(--amber)' : 'var(--green-mid)';
        return `<span style="display:inline-block;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;font-size:10px;font-weight:600;margin-left:6px">${lbl} ${n} วันก่อน</span>`;
      };

      overlay.innerHTML = `
        <div style="background:var(--bg);border-radius:14px;max-width:600px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden" onclick="event.stopPropagation()">
          <div style="background:${statusColor};padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px">
            <div>
              <div style="font-size:11px;color:#fff;opacity:.85;font-weight:600">เคสจอง · ${h(b.date||'-')} ${ageBadge(bookAge, 'จอง')}</div>
              <div style="font-size:18px;font-weight:800;color:#fff">${h(b.customer||'-')}</div>
              <div style="font-size:11px;color:#fff;opacity:.9;margin-top:2px">
                สถานะ: <b>${h(b.status||'-')}</b>${b.isCash?' · 💵 ซื้อสด':''}
                ${b.status==='ปล่อย' ? ageBadge(releaseAge, '· ปล่อย') : ''}
              </div>
            </div>
            <button onclick="document.getElementById('book-detail-overlay').remove()" style="background:transparent;border:none;font-size:22px;color:#fff;cursor:pointer;line-height:1;opacity:.9">✕</button>
          </div>

          <div style="overflow-y:auto;padding:14px 16px;flex:1">
            ${callLink ? `<div style="margin-bottom:12px;text-align:center">${callLink}</div>` : ''}

            <div style="font-size:11px;color:var(--t3);font-weight:700;margin-bottom:4px">👤 ลูกค้า</div>
            ${row('ชื่อลูกค้า', b.customer)}
            ${row('เบอร์โทร', b.phone, {mono:true})}
            ${row('Lead Code', b.leadCode, {mono:true})}
            ${row('เซลล์', b.seller)}

            <div style="font-size:11px;color:var(--t3);font-weight:700;margin:14px 0 4px">🚗 รถ</div>
            ${row('รถ', b.car)}
            ${row('ปีรถ', b.year)}
            ${row('ทะเบียน', b.plate)}

            <div style="font-size:11px;color:var(--t3);font-weight:700;margin:14px 0 4px">💰 ราคา / การจ่าย</div>
            ${row('ราคาขาย', b.price)}
            ${row('เงินจอง', b.deposit)}
            ${row('ไฟแนนซ์', b.finance)}
            ${row('เกรด', b.grade)}

            <div style="font-size:11px;color:var(--t3);font-weight:700;margin:14px 0 4px">📅 ไทม์ไลน์</div>
            ${row('วันที่จอง', b.date)}
            ${row('วันที่เซ็นต์', b.signDate)}
            ${row('วันที่รู้ผล', b.resultDate)}
            ${row('เอกสารครบ', b.docsDate)}
            ${row('วันที่ปล่อยรถ', b.releaseDate)}

            ${b.note && b.note !== '-' ? `
              <div style="font-size:11px;color:var(--t3);font-weight:700;margin:14px 0 4px">📝 หมายเหตุ</div>
              <div style="padding:10px 12px;background:var(--bg2);border-radius:8px;font-size:12px;color:var(--t1);white-space:pre-wrap;word-break:break-word;line-height:1.5">${h(b.note)}</div>
            ` : ''}
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    // ── Car Detail Modal — กดที่รถใน Lead car table แล้วเปิด ──
    function openCarDetail(car) {
      // ปิด modal เก่า
      const old = document.getElementById('car-detail-overlay');
      if (old) old.remove();

      const periodLbl = dfMonth > 0 ? `เดือน${C.MONTHS_FULL[dfMonth-1]}` : 'ทั้งปี';
      const carLower = String(car).toLowerCase();

      // ── Lead per seller (จาก leadCarSellerMonth — exact match key) ──
      const leadMap = (D.leadCarSellerMonth || {})[car] || {};

      // ── Booking + ปล่อย per seller (substring match จาก bookingCases) ──
      const bookSellerMap = {};  // seller → {booked, done, dealValue}
      (D.bookingCases || []).forEach(b => {
        if (!b.car || !b.seller) return;
        if (!b.car.toLowerCase().includes(carLower)) return;
        // กรองเดือน (ถ้าตั้ง filter)
        if (dfMonth > 0) {
          const useDate = b.releaseDate || b.date || '';
          const p = String(useDate).split('/');
          if (p.length < 2 || parseInt(p[1]) !== dfMonth) return;
        }
        if (!bookSellerMap[b.seller]) bookSellerMap[b.seller] = {booked:0, done:0, dealValue:0};
        const ent = bookSellerMap[b.seller];
        if (['จอง','รอเซ็นต์','รอผล','รอปล่อย','ปล่อย'].includes(b.status)) {
          ent.booked++;
          if (b.status === 'ปล่อย') {
            ent.done++;
            ent.dealValue += b.price || 0;
          }
        }
      });

      // ── รวม seller จากทั้ง 2 แหล่ง ──
      const allSellers = new Set([...Object.keys(leadMap), ...Object.keys(bookSellerMap)]);
      const rows = Array.from(allSellers).map(seller => {
        const lm = leadMap[seller] || {total:0, byMonth:[]};
        const leadCount = dfMonth > 0 ? (lm.byMonth?.[dfMonth] || 0) : (lm.total || 0);
        const bm = bookSellerMap[seller] || {booked:0, done:0, dealValue:0};
        const sellerObj = (D.sellers || []).find(s => s.name === seller);
        const team = sellerObj?.team || '?';
        const convPct = leadCount > 0 ? Math.round(bm.booked/leadCount*1000)/10 : 0;
        return {seller, team, lead:leadCount, booked:bm.booked, done:bm.done, dealValue:bm.dealValue, convPct};
      }).filter(r => r.lead > 0 || r.booked > 0).sort((a,b) => b.lead - a.lead || b.done - a.done);

      const sumLead = rows.reduce((a,r)=>a+r.lead,0);
      const sumBook = rows.reduce((a,r)=>a+r.booked,0);
      const sumDone = rows.reduce((a,r)=>a+r.done,0);
      const sumDeal = rows.reduce((a,r)=>a+r.dealValue,0);

      const overlay = document.createElement('div');
      overlay.id = 'car-detail-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

      let inner = `<div style="background:var(--bg);border-radius:16px;max-width:780px;width:100%;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.35)" onclick="event.stopPropagation()">`;
      inner += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap">`;
      inner += `<div><div style="font-size:11px;color:var(--t3)">รายละเอียดรถ · ${h(periodLbl)}</div><div style="font-size:18px;font-weight:800;color:var(--blue)">🚗 ${h(car)}</div></div>`;
      inner += `<button onclick="document.getElementById('car-detail-overlay').remove()" style="padding:6px 14px;border-radius:10px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);font-weight:600;font-size:12px;cursor:pointer">✕ ปิด</button>`;
      inner += `</div>`;

      // Summary stat cards
      inner += `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">`;
      inner += `<div style="background:var(--blue-bg);border-radius:10px;padding:10px;text-align:center"><div style="font-size:10px;color:var(--t3)">รับ Lead</div><div style="font-size:18px;font-weight:800;color:var(--blue)">${sumLead}</div></div>`;
      inner += `<div style="background:var(--amber-bg);border-radius:10px;padding:10px;text-align:center"><div style="font-size:10px;color:var(--t3)">จอง</div><div style="font-size:18px;font-weight:800;color:var(--amber)">${sumBook}</div></div>`;
      inner += `<div style="background:var(--green-bg);border-radius:10px;padding:10px;text-align:center"><div style="font-size:10px;color:var(--t3)">ปล่อย</div><div style="font-size:18px;font-weight:800;color:var(--green-mid)">${sumDone}</div></div>`;
      inner += `<div style="background:var(--green-bg);border-radius:10px;padding:10px;text-align:center"><div style="font-size:10px;color:var(--t3)">ยอดปล่อย</div><div style="font-size:15px;font-weight:800;color:var(--green-mid)">${fmtBaht(sumDeal)}</div></div>`;
      inner += `</div>`;

      if (rows.length === 0) {
        inner += `<div style="text-align:center;color:var(--t3);padding:24px;font-size:13px">ไม่มีข้อมูลในช่วงนี้</div>`;
      } else {
        inner += `<div style="font-size:11px;color:var(--t3);margin-bottom:6px">จำนวน Lead / จอง / ปล่อย / ยอดปล่อย แยกตามเซลล์</div>`;
        inner += `<div class="shdr" style="grid-template-columns:1.4fr .8fr .7fr .7fr 1fr 1fr"><span>เซลล์</span><span style="text-align:right">Lead</span><span style="text-align:right">จอง</span><span style="text-align:right">ปล่อย</span><span style="text-align:right">Conv%</span><span style="text-align:right">฿ ปล่อย</span></div>`;
        inner += `<div style="max-height:380px;overflow-y:auto">`;
        rows.forEach(r => {
          const tCol = C.TEAM_COLORS[r.team] || 'var(--t3)';
          inner += `<div class="srow" style="grid-template-columns:1.4fr .8fr .7fr .7fr 1fr 1fr;cursor:pointer" onclick="document.getElementById('car-detail-overlay').remove();switchToSeller('${h(r.seller)}')">`;
          inner += `<span style="font-weight:600">${h(r.seller)}<span style="font-size:9px;padding:1px 4px;border-radius:4px;background:${tCol};color:#fff;margin-left:4px">${r.team}</span></span>`;
          inner += `<span style="text-align:right;color:var(--blue);font-weight:600">${r.lead}</span>`;
          inner += `<span style="text-align:right;color:var(--amber)">${r.booked||'-'}</span>`;
          inner += `<span style="text-align:right;color:var(--green-mid);font-weight:600">${r.done||'-'}</span>`;
          inner += `<span style="text-align:right;color:var(--t3);font-size:11px">${r.lead>0?r.convPct+'%':'-'}</span>`;
          inner += `<span style="text-align:right;color:var(--green-mid)">${r.dealValue>0?fmtBaht(r.dealValue):'-'}</span>`;
          inner += `</div>`;
        });
        inner += `</div>`;
      }
      inner += `<div style="font-size:10px;color:var(--t3);margin-top:10px;line-height:1.5">💡 Lead นับจากชื่อรถใน lead sheet · จอง/ปล่อย นับจากรายการจองที่รุ่นรถมีคำว่า "${h(car)}" (case-insensitive)</div>`;
      inner += `</div>`;
      overlay.innerHTML = inner;
      document.body.appendChild(overlay);
    }

    // ── Team Done Detail modal — แสดงรายชื่อเซลล์ในทีม + เคสปล่อยของแต่ละคน ──
    function openTeamDoneDetail(tid) {
      const old = document.getElementById('team-done-overlay');
      if (old) old.remove();

      const team = (D.teams || {})[tid];
      if (!team) return;
      const teamName = (C.TEAM_NAMES || {})[tid] || tid;
      const teamColor = (C.TEAM_COLORS || {})[tid] || 'var(--t3)';
      const periodLbl = dfMonth > 0 ? `เดือน${C.MONTHS_FULL[dfMonth-1]}` : (dfMonth===-1 ? 'วันนี้' : 'ทั้งปี');
      const ms = (dfMonth > 0 && D.monthlySummary?.[dfMonth]) ? D.monthlySummary[dfMonth] : null;

      // คำนวณ done + dealValue ต่อเซลล์ในทีมนี้
      const members = team.members || [];
      const sellerStats = members.map(name => {
        const msd = ms?.sellers?.[name];
        const sd = (D.sellers || []).find(x => x.name === name) || {};
        const done = msd ? (msd.done || 0) : (sd.done || 0);
        const dealValue = msd ? (msd.dealValue || 0) : (sd.dealValue || 0);
        const target = sd.target || 0;
        return { name, done, dealValue, target };
      }).sort((a,b) => b.done - a.done);

      const totalDone = sellerStats.reduce((a,s) => a + s.done, 0);
      const totalDealValue = sellerStats.reduce((a,s) => a + s.dealValue, 0);
      const totalTarget = team.target || 0;

      // เคสปล่อยจริงของทีมนี้ — filter จาก bookingCases ตาม period + sellerในทีม
      const memberSet = new Set(members);
      const releasedCases = (D.bookingCases || []).filter(b => {
        if (b.status !== 'ปล่อย') return false;
        if (!memberSet.has(b.seller)) return false;
        if (dfMonth > 0) {
          const useDate = b.releaseDate || b.date || '';
          const p = String(useDate).split('/');
          if (p.length < 2 || parseInt(p[1]) !== dfMonth) return false;
        }
        return true;
      }).sort((a,b) => (a.seller || '').localeCompare(b.seller || '', 'th'));

      const overlay = document.createElement('div');
      overlay.id = 'team-done-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

      let inner = `<div style="background:var(--bg);border-radius:14px;max-width:760px;width:100%;max-height:85vh;overflow-y:auto;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.35)">`;
      inner += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap">`;
