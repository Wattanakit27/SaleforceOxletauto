<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oxlet Dashboard</title>
  {% load static %}
  <link rel="icon" type="image/png" href="{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}">
  <link rel="apple-touch-icon" href="{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}">
  <link rel="stylesheet" href="{% static 'dashboard/css/globals.css' %}?v=20260604b">
  <script>
    // ตั้งธีมก่อน paint (กันจอกระพริบ) — ใช้ค่าที่บันทึก หรือตามระบบ
    (function(){
      try {
        var t = localStorage.getItem('oxlet_theme');
        if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) { document.documentElement.setAttribute('data-theme','light'); }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* Mobile safety — ป้องกัน horizontal scroll + KPI grid overflow */
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; max-width: 100vw; }
    .app { max-width: 100vw; }

    /* Admin nav dropdown */
    .admin-nav-menu summary::-webkit-details-marker { display: none; }
    .admin-nav-menu summary { user-select: none; }
    .admin-nav-menu[open] summary { background: var(--blue) !important; color: #fff !important; }

    /* Subtitle ใต้ card-title — อธิบายว่าตาราง/กราฟนี้ดูอะไร */
    .card-sub { font-size: 10.5px; color: var(--t3); margin: -6px 0 10px; line-height: 1.5; font-weight: 400; }

    /* Info tooltip — ไอคอน '?' วงกลมเล็ก กด/hover แล้วโผล่คำอธิบาย */
    .info-tip {
      display: inline-flex; align-items: center; justify-content: center;
      width: 15px; height: 15px; border-radius: 50%;
      background: var(--t3); color: #fff;
      font-size: 10px; font-weight: 700;
      cursor: help; margin-left: 5px; vertical-align: middle;
      position: relative; user-select: none;
      transition: background .15s;
    }
    .info-tip:hover, .info-tip:focus { background: var(--blue); outline: none; }
    .info-tip::after {
      content: attr(data-tip);
      position: absolute; bottom: calc(100% + 8px); left: 50%;
      transform: translateX(-50%);
      background: var(--t1); color: var(--bg);
      padding: 9px 12px; border-radius: 8px;
      font-size: 11px; font-weight: 400; line-height: 1.6;
      white-space: pre-line; width: max-content; max-width: 280px;
      text-align: left;
      box-shadow: 0 6px 20px rgba(0,0,0,.18);
      opacity: 0; pointer-events: none;
      transition: opacity .15s ease;
      z-index: 100;
    }
    .info-tip::before {
      content: ''; position: absolute; bottom: calc(100% + 3px); left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent; border-top-color: var(--t1);
      opacity: 0; pointer-events: none;
      transition: opacity .15s;
    }
    .info-tip:hover::after, .info-tip:focus::after,
    .info-tip:hover::before, .info-tip:focus::before { opacity: 1; }
    /* Mobile: ถ้าเข้าใกล้ขอบจอ shift ไปฝั่งซ้าย */
    @media (max-width: 480px) {
      .info-tip::after { max-width: 220px; left: auto; right: 0; transform: none; }
      .info-tip::before { display: none; }
    }

    /* Collapsible advanced sections (Lead-by-Car, Released Cars) */
    details.adv-section { background: var(--bg); border: .5px solid var(--bd); border-radius: 12px; margin-bottom: 10px; }
    details.adv-section[open] { padding-bottom: 8px; }
    details.adv-section > summary { list-style: none; cursor: pointer; padding: 12px 14px; font-weight: 600; font-size: 13px; color: var(--t1); display: flex; align-items: center; justify-content: space-between; }
    details.adv-section > summary::-webkit-details-marker { display: none; }
    details.adv-section > summary::after { content: '▾ ขยาย'; font-size: 11px; font-weight: 500; color: var(--t3); }
    details.adv-section[open] > summary::after { content: '▴ ย่อ'; }
    details.adv-section > .adv-body { padding: 0 14px; }
    /* ลบ inner card border/padding ซ้ำเมื่ออยู่ใน adv-section */
    details.adv-section .adv-body > .card { border: none; padding: 0; margin: 0; background: transparent; }

    .cgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
    .cgrid > .chart-card.span2 { grid-column: span 2; }
    .chart-card .chart-box { position:relative; height:240px; }
    .chart-card.span2 .chart-box { height:260px; }

    /* KPI grid + card content — bullet-proof responsive */
    .kgrid > * { min-width: 0; }
    .kpi .kl, .kpi .ks { word-break: break-word; line-height: 1.4; }
    .kpi .kv { line-height: 1; word-break: break-word; }

    /* Tables ที่อาจกว้างเกิน mobile — wrap ด้วย overflow scroll */
    .card table, .booking-card table { width: 100%; }

    @media (max-width:760px) {
      .cgrid { grid-template-columns:1fr; }
      .cgrid > .chart-card.span2 { grid-column: auto; }
      .chart-card .chart-box { height:220px; }
      .card { padding: 12px 11px; }
      .card-title { font-size: 12px; }
      /* booking + lead-by-car tables → scroll horizontal */
      .card table { display: block; overflow-x: auto; white-space: nowrap; }
      .shdr, .srow { font-size: 11px; gap: 4px; padding: 6px 5px; }
      .lfhdr, .lfrow { font-size: 11px; }
      .hlhdr, .hlrow { font-size: 10px; gap: 4px; padding: 5px 4px; }
      /* sort/search inputs ที่ shrink ได้ */
      input[type="text"], select { font-size: 12px; padding: 5px 8px; }
    }
    @media (max-width:420px) {
      .kpi .kv { font-size: 18px; }
      .kpi .kl { font-size: 10px; }
      .kpi .ks { font-size: 9.5px; }
      .pipe-num { font-size: 17px; }
      .pipe-lbl { font-size: 9.5px; }
      .card { padding: 11px 9px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    {% if error %}
    <div style="text-align:center;padding-top:80px">
      <div style="font-size:48px;margin-bottom:14px">⚠️</div>
      <div style="font-size:18px;font-weight:700;color:var(--t1);margin-bottom:6px">เกิดข้อผิดพลาด</div>
      <div style="font-size:13px;color:var(--t2)">{{ error }}</div>
      <button onclick="location.reload()" class="bbtn" style="margin-top:12px">🔄 ลองอีกครั้ง</button>
    </div>
    {% else %}
    <div class="loading-container" id="loading">
      <div class="spin"></div>
      <span style="font-size:13px">กำลังโหลด Dashboard...</span>
    </div>
    <div id="dashboard-root" style="display:none"></div>
    {% endif %}
  </div>

  {% if not error %}
  <script>
    // ── Data from server ──
    const D = {{ data_json|safe }};
    const C = {{ constants_json|safe }};
    const SESSION_USER = {{ session_user_json|safe }};
    const LOGO_URL = "{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}";

    // ── Close admin-nav-menu dropdown เมื่อคลิกข้างนอก หรือกดเมนูใน ──
    document.addEventListener('click', (e) => {
      document.querySelectorAll('.admin-nav-menu[open]').forEach(d => {
        // ปิดถ้า: คลิกปุ่มภายใน menu (action ถูก trigger แล้ว) หรือคลิกข้างนอก details
        if (d.contains(e.target)) {
          if (e.target.closest('.admin-nav-item')) d.open = false;  // กดเมนู → ปิด
        } else {
          d.open = false;  // คลิกข้างนอก → ปิด
        }
      });
    });

    // ── Auth ──
    // Backend ให้ default เป็น 'ผู้บริหาร' มาแล้วเมื่อยังไม่ login → frontend แค่อ่านค่า
    function getEmployee() {
      if (SESSION_USER && SESSION_USER.position) {
        return {
          id: SESSION_USER.user_id || '',
          user_id: SESSION_USER.user_id || '',
          display_name: SESSION_USER.display_name || '',
          nickname: SESSION_USER.nickname || '',
          position: SESSION_USER.position || '',
        };
      }
      // fallback: cookie จาก magic_link (สำหรับเซลล์ที่ใช้ลิงก์ส่วนตัว)
      try {
        const cookies = document.cookie.split(';');
        for (const cookie of cookies) {
          const [name, ...rest] = cookie.trim().split('=');
          if (name === 'oxlet_employee') {
            return JSON.parse(decodeURIComponent(rest.join('=')));
          }
        }
      } catch {}
      // ไม่ควรเกิด เพราะ backend ส่ง default executive มาแล้ว
      return { id:'', user_id:'', display_name:'ผู้บริหาร', nickname:'ผู้บริหาร', position:'executive' };
    }
    const employee = getEmployee();
    const isAdmin = employee.position === 'admin';
    // ผู้บริหาร — เห็นทุกอย่างเหมือน admin ปัจจุบัน + impersonate ได้ แต่ไม่มีเครื่องมือ admin-only (LINE, schedule ฯลฯ)
    const isExecutive = ['executive','ผู้บริหาร','manager','exec'].includes((employee.position||'').toLowerCase()) || employee.position === 'ผู้บริหาร';
    const canViewAll = isAdmin || isExecutive;

    // ── State ──
    let tab = new URLSearchParams(location.search).get('tab') || 'o';
    let curS = new URLSearchParams(location.search).get('seller') || '';
    let showCase = new URLSearchParams(location.search).get('case') || null;
    // 📅 กรองวันที่รับเคส (ช่วงวัน จาก-ถึง · ข้ามเดือนได้) — แทน month/today filter เดิม
    let dfMonth = 0;  // vestige (โค้ดเก่าบางจุดอ้าง — ตั้ง 0 = ไม่ใช้ month filter)
    const _ymd = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    let dfTo = _ymd(new Date());
    let dfFrom = _ymd(new Date(new Date().getFullYear(), new Date().getMonth(), 1));  // default = ต้นเดือนปัจจุบัน
    let curF = 'all';
    let curSo = 'urgent';
    let curMode = 'month';
    let lfPage = 1;
    let msort = 'lead';
    let hsel = 'all';
    let liveMonth = 0;
    let liveTeam = 'all';
    let followFilter = 'urgent';
    let bkSel = 'all';
    let bkStatus = 'all';
    let dilSort = 'score';  // 'score' | 'cnt' | 'avg' | 'high' | 'tot' — sort การ์ดติดตามมาก (default = Diligence Score)
    let leadPerDay = null;  // lead ต่อวัน (null = auto คำนวณจากสถิติ · เลข = ผู้ใช้ตั้งเอง)
    let searchQ = '';
    // Lead-by-car + Released-cars state (admin/exec only)
    let leadCarHideUnknown = true;
    let leadCarQuery = '';
    let leadCarPage = 1;
    const LEAD_CAR_PAGE_SIZE = 20;
    let releasedSort = 'date';  // 'date' | 'price' | 'seller' | 'age'
    let releasedSeller = 'all';
    let releasedStatus = 'ปล่อย';  // 'ปล่อย' | 'all' | 'จอง' | 'รอเซ็นต์' | 'รอผล' | 'รอปล่อย' | 'รีเจ็ก'
    let releasedPage = 1;
    const RELEASED_PAGE_SIZE = 50;
    let impersonate = canViewAll ? localStorage.getItem('oxlet_impersonate') : null;

    // Validate impersonate
    if (impersonate) {
      const validNames = (D.sellers || []).map(s => s.name);
      if (!validNames.includes(impersonate)) impersonate = null;
    }

    // ── Filtered data ──
    function getFilteredData() {
      const filterTo = !canViewAll ? employee.nickname : impersonate;
      if (!filterTo) return D;
      return {
        ...D,
        sellers: (D.sellers||[]).filter(s => s.name === filterTo),
        followCases: (D.followCases||[]).filter(c => c.seller === filterTo),
        bookingCases: (D.bookingCases||[]).filter(b => b.seller === filterTo),
      };
    }
    let FD = getFilteredData();

    // ── Helpers ──
    const h = (s) => s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
    const pct = (a,b) => b > 0 ? Math.round((a/b)*100) : 0;
    const nc = (u) => Math.max(0, C.UPD_TGT - u);
    const urg = (l) => { let s = l.updateCount===0?100:0; s += nc(l.updateCount)*10; return s; };
    const nocar = (c) => !c || c==='ลูกค้าไม่ตอบ' || c==='รถที่ไม่ได้ทำการตลาด' || c==='-';
    const empty = (v) => !v || v==='-' || v==='';
    const passMonth = (ds, m) => {
      if(m===0) return true;
      if(!ds) return true;
      const p = ds.split('/');
      if(p.length<2) return true;
      const day=parseInt(p[0]),mo=parseInt(p[1]);
      if(isNaN(day)||isNaN(mo)) return true;
      if(m===-1) { const now=new Date(); return day===now.getDate() && mo===now.getMonth()+1; }
      return mo===m;
    };
    // เช็ค dateIn (d/m/yy) อยู่ในช่วง [dfFrom, dfTo] ไหม (เทียบ string YYYY-MM-DD)
    function inRange(ds){
      if(!ds) return true;
      const d = _parseDmy(ds);
      if(!d) return true;
      const t = _ymd(d);
      return t >= dfFrom && t <= dfTo;
    }
    const ir = inRange;
    function setDfRange(from, to){
      if(from!==undefined) dfFrom = from || dfFrom;
      if(to!==undefined) dfTo = to || dfTo;
      if(dfFrom > dfTo){ const x = dfFrom; dfFrom = dfTo; dfTo = x; }
      lfPage = 1; releasedPage = 1; render();
    }
    // list ของ [month, day] ในช่วง (ปีนี้)
    function rangeDays(){
      const out = []; let cur = new Date(dfFrom + 'T00:00:00'); const end = new Date(dfTo + 'T00:00:00');
      let g = 0;
      while(cur <= end && g < 400){ out.push([cur.getMonth()+1, cur.getDate()]); cur.setDate(cur.getDate()+1); g++; }
      return out;
    }
    function _sumDaily(src){
      let lead=0, leadRJ=0, booking=0, done=0, deal=0;
      for(const [m,d] of rangeDays()){
        const dd = src && src[m]; if(!dd) continue;
        lead += (dd.leads&&dd.leads[d])||0; leadRJ += (dd.leadRJ&&dd.leadRJ[d])||0;
        booking += (dd.bookings&&dd.bookings[d])||0; done += (dd.dones&&dd.dones[d])||0;
        deal += (dd.dealValue&&dd.dealValue[d])||0;
      }
      return {lead, leadRJ, booking, done, deal};
    }
    // สร้าง summary+sellers สำหรับช่วงวันที่ (รูปร่างเหมือน monthlySummary[m]) — แคชต่อ render
    let _rmCache = null, _rmKey = '';
    function buildRangeMs(){
      const key = dfFrom + '|' + dfTo;
      if(_rmCache && _rmKey === key) return _rmCache;
      const ov = _sumDaily(D.dailyByMonth || {});
      const monthsIn = [...new Set(rangeDays().map(x => x[0]))];
      const sellers = {};
      (D.sellers || []).forEach(s => {
        const x = _sumDaily((D.dailyBySeller || {})[s.name] || {});
        // bans/leadDist ไม่มีรายวัน → รวมรายเดือน (whole-month) ของเดือนในช่วง
        let bans = 0, leadDist = 0;
        monthsIn.forEach(m => { const md = (D.monthlySummary && D.monthlySummary[m] && D.monthlySummary[m].sellers && D.monthlySummary[m].sellers[s.name]) || {}; bans += md.bans||0; leadDist += md.leadDist||0; });
        sellers[s.name] = { lead:x.lead+x.leadRJ, leadNormal:x.lead, leadRJ:x.leadRJ,
          booking:x.booking, done:x.done, dealValue:x.deal, follow:0, vacant:0,
          bans, leadDist, target:s.target||0, team:s.team };
      });
      let totalFollow = 0;
      (D.followCases || []).forEach(c => { if(!inRange(c.dateIn)) return; totalFollow++; if(sellers[c.seller]) sellers[c.seller].follow++; });
      _rmKey = key;
      _rmCache = { totalLeads:ov.lead+ov.leadRJ, leadNormal:ov.lead, leadRJ:ov.leadRJ,
        totalBookings:ov.booking, totalDone:ov.done, totalDealValue:ov.deal, totalFollow,
        sellers, pipeline:D.pipeline };
      return _rmCache;
    }
    const rangeLabelTH = () => {
      const f = new Date(dfFrom+'T00:00:00'), t = new Date(dfTo+'T00:00:00');
      const o = {day:'numeric',month:'short'};
      return f.toLocaleDateString('th-TH',o) + ' – ' + t.toLocaleDateString('th-TH',o);
    };
    const parseNoteHistory = (note) => {
      if(!note||note==='-') return [];
      return note.replace(/^\d{4,5}\s*/,'').split('/').map(s=>s.trim()).filter(s=>s&&s!=='-');
    };
    const dotsHtml = (u) => {
      let html='';
      for(let i=0;i<C.UPD_TGT;i++){
        const f=i<u;
        const c=f?(u>=C.UPD_TGT?'#3B6D11':u>=3?'#1D9E75':u>=2?'#EF9F27':'#E24B4A'):'#ccc';
        html+=`<span class="dot" style="background:${c}"></span>`;
      }
      return `<span style="display:flex;align-items:center">${html}<span style="font-size:10px;color:var(--t3);margin-left:2px">${u}/${C.UPD_TGT}</span></span>`;
    };
    const urgBadge = (l) => {
      const n=nc(l.updateCount);
      if(l.updateCount===0) return `<span class="bdg" style="background:var(--red-bg);color:var(--red)">ยังไม่โทร</span>`;
      if(n>=3) return `<span class="bdg" style="background:var(--red-bg);color:var(--red)">+${n}</span>`;
      if(n>=1) return `<span class="bdg" style="background:var(--amber-bg);color:var(--amber)">+${n}</span>`;
      return `<span class="bdg" style="background:var(--green-bg);color:var(--green)">✓</span>`;
    };
    const fmtNum = (n) => Number(n||0).toLocaleString();
    const fmtPrice = (n) => '฿'+Number(n||0).toLocaleString();

    // ── MoM helper: ดึงค่า metric ของเดือน m เทียบกับเดือน m-1 ──
    // คืน {cur, prev, delta, pct, isUp} หรือ null ถ้าเปรียบเทียบไม่ได้
    function getMoM(month, key) {
      if (!month || month < 2 || month > 12) return null;
      const ms = D.monthlySummary || {};
      const curMs  = ms[month] || ms[String(month)] || {};
      const prevMs = ms[month-1] || ms[String(month-1)] || {};
      const cur  = Number(curMs[key] || 0);
      const prev = Number(prevMs[key] || 0);
      if (cur === 0 && prev === 0) return null;
      const delta = cur - prev;
      const pct = prev > 0
        ? Math.round((delta/prev) * 1000) / 10
        : (cur > 0 ? 999 : 0);  // 999 = "ใหม่" (เดือนก่อนเป็น 0)
      return {cur, prev, delta, pct, isUp: delta >= 0};
    }
    // คืน HTML badge ของ MoM — ใส่ใน subtitle ของ KPI card
    // invert=true ถ้า metric ที่ "ลด = ดี" (เช่น RJ, ติดตามค้าง)
    function momBadge(mom, invert=false, fmt) {
      if (!mom) return '';
      fmt = fmt || ((n) => Number(n).toLocaleString());
      // 999 = ใหม่ทั้งหมด (prev=0)
      if (mom.pct === 999) {
        return `<span style="display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--blue);background:var(--blue-bg);padding:1px 5px;border-radius:8px;margin-left:4px" title="เดือนก่อน 0 → ใหม่ทั้งหมด">ใหม่</span>`;
      }
      // ลด = ดี (RJ): invert color
      const goodTrend = invert ? !mom.isUp : mom.isUp;
      const col = mom.pct === 0 ? 'var(--t3)' : goodTrend ? 'var(--green)' : 'var(--red)';
      const bg  = mom.pct === 0 ? 'var(--bg2)' : goodTrend ? 'var(--green-bg)' : 'var(--red-bg)';
      const arrow = mom.delta > 0 ? '↗' : mom.delta < 0 ? '↘' : '→';
      const sign = mom.delta > 0 ? '+' : '';
      return `<span style="display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:700;color:${col};background:${bg};padding:1px 5px;border-radius:8px;margin-left:4px" title="เดือนก่อน ${fmt(mom.prev)} → เดือนนี้ ${fmt(mom.cur)}">${arrow} ${sign}${mom.pct}%</span>`;
    }

    // ฿ แบบกระชับ: ≥1M → "฿1.2M", ≥1K → "฿850K", ที่เหลือ → "฿1,234"
    const fmtBaht = (n) => {
      const v = Number(n||0);
      if (v >= 1000000) return '฿' + (v/1000000).toFixed(v >= 10000000 ? 1 : 2) + 'M';
      if (v >= 100000)  return '฿' + Math.round(v/1000) + 'K';
      if (v >= 1000)    return '฿' + (v/1000).toFixed(1) + 'K';
      return '฿' + Math.round(v).toLocaleString();
    };

    // ── URL sync ──
    function updateUrl() {
      const p = new URLSearchParams();
      p.set('tab', tab);
      if(curS) p.set('seller', curS);
      if(showCase) p.set('case', showCase);
      history.replaceState(null, '', '/dashboard/?'+p.toString());
    }

    // ── Diligence map ──
    // Diligence Score — รวมคะแนนความขยัน + ผลลัพธ์ที่ได้
    //   โทรครั้งที่ 1: +10  (Coverage)
    //   โทรครั้งที่ 2: +15  (Persistence — สำคัญสุดต่อ closing)
    //   โทรครั้งที่ 3+: +5/ครั้ง (Consistency)
    //   *** RJ (เคสไม่ค่อยดี) ได้คะแนน × 0.5 (ครึ่ง) ของ Normal — เพราะคุณภาพ lead ต่ำ
    //   จอง (รวมพีลไลน์ จอง/รอเซ็น/รอผล/รอปล่อย): +50/เคส (เริ่มดีลแล้ว)
    //   ปล่อย: +100/เคส (ปิดดีล!)
    const SCORE_JONG = 50;
    const SCORE_DONE = 100;
    const RJ_WEIGHT = 0.5;
    // ── เป้าสูตรคะแนนใหม่ (100 คะแนน) ──
    const DONE_TGT = 15;   // จบ(ปล่อย) เป้า → เต็ม 30
    const JONG_TGT = 30;   // จอง เป้า → เต็ม 10
    const CONV_TGT = 5;    // Conv เป้า (%) → เต็ม 20
    // ความเร็ว (เต็ม 10): 3 ช่วง จอง→เซ็น ≤3วัน · เซ็น→ผล ≤3วัน · ผล→ปล่อย ≤1วัน
    const VEL_STAGES = [['date','signDate',3], ['signDate','resultDate',3], ['resultDate','releaseDate',1]];
    const JONG_STATUSES = new Set(['จอง', 'รอเซ็นต์', 'รอผล', 'รอปล่อย']);
    const RJ_TYPES_SET = new Set(['RJ', 'Hot RJ', 'Hot RB']);

    function diligenceScore(updateCount, isRJ) {
      const u = Math.max(0, updateCount || 0);
      if (u === 0) return 0;
      let base;
      if (u === 1) base = 10;
      else if (u === 2) base = 25;          // 10 + 15
      else base = 25 + (u - 2) * 5;         // 10 + 15 + (u-2)*5
      return isRJ ? Math.round(base * RJ_WEIGHT) : base;
    }

    function _ensureDilEntry(m, name) {
      if (!m[name]) m[name] = {
        tot:0, totNormal:0, totRJ:0,
        cnt:0, cntNormal:0, cntRJ:0,
        high:0, score:0, jongs:0, dones:0,
        scoreCall:0, scoreCallNormal:0, scoreCallRJ:0,
        scoreJong:0, scoreDone:0,
        // สูตรคะแนนใหม่: capped updates (ติดตาม) · leads (conv) · bans (โดนแบน)
        capUpd:0, leads:0, bans:0,
        // ความเร็ว (3 ช่วง): velSum = ผลรวมสัดส่วน [0,1] ของเคสปล่อย, velCnt = จำนวนเคส
        velSum:0, velCnt:0, velPct:0,
        sDone:0, sJong:0, sConv:0, sVel:0, sFollow:0, sBan:0, conv:0, completion:0,
        // Distribution ตามจำนวนครั้งที่โทร — สำหรับ breakdown ใน modal
        // callBuckets[updateCount] = {nNormal, nRJ, score}
        callBuckets: {},
        // Velocity Phase 1: รับหลีด → จอง (avg days)
        // เก็บเฉพาะเคสที่มี leadDate + date ทั้งคู่
        velP1Sum:0, velP1Count:0,
        // Velocity Phase 2: จอง → ปล่อย (avg days, status=ปล่อย เท่านั้น)
        velP2Sum:0, velP2Count:0,
      };
      return m[name];
    }

    // ── Helpers สำหรับ Velocity ──
    // parse "d/m/yy" → Date object (รองรับ พ.ศ. → ค.ศ.)
    function _parseDmy(ds) {
      if (!ds || ds === '-') return null;
      // Excel serial
      if (/^\d{4,5}$/.test(ds)) {
        const serial = parseInt(ds, 10);
        if (serial > 40000 && serial < 50000) {   // ช่วงสมเหตุสมผล ~2009-2036 (กันเลขมั่ว)
          // Excel epoch = 1899-12-30
          return new Date(Date.UTC(1899, 11, 30) + serial * 86400000);
        }
        return null;
      }
      const p = ds.split('/');
      if (p.length < 3) return null;
      let d = parseInt(p[0], 10), mo = parseInt(p[1], 10), y = parseInt(p[2], 10);
      if (isNaN(d) || isNaN(mo) || isNaN(y)) return null;
      if (y < 100) y += (y > 50 ? 2500 : 2000);  // >50 = พ.ศ. 2 หลัก (69→2569), ≤50 = ค.ศ. (26)
      if (y > 2500) y -= 543;       // 2569 → 2026
      return new Date(y, mo - 1, d);
    }
    // คืนจำนวนวันระหว่าง 2 dates (a → b) ; null ถ้า parse ไม่ได้
    function _daysBetween(a, b) {
      const da = _parseDmy(a), db = _parseDmy(b);
      if (!da || !db) return null;
      return Math.round((db - da) / 86400000);
    }
    // ดึง datestr ออกจาก lastUpdate field (อาจมีเวลาตามหลัง)
    function _dateOnly(s) {
      if (!s || s === '-') return s;
      return String(s).split(' ')[0];
    }
    // คะแนนความเร็ว 1 ช่วง: ทันกำหนด=1, เกินลดเชิงเส้นถึง 0 ที่ 3× กำหนด, วันว่าง/parse ไม่ได้=0
    function _stageScore(dFrom, dTo, deadline) {
      const days = _daysBetween(dFrom, dTo);
      if (days === null) return 0;
      if (days <= deadline) return 1;
      return Math.max(0, 1 - (days - deadline) / (2 * deadline));
    }

    function buildDilMap() {
      const m = {};
      // ส่วนที่ 1: คะแนนจากการอัพเดท (follow cases) — RJ ได้ครึ่งของ Normal
      // filter ตามเดือนที่เลือก (dfMonth) ผ่าน ir(l.dateIn)
      (FD.followCases||[]).forEach(l => {
        if (!ir(l.dateIn)) return;
        const e = _ensureDilEntry(m, l.seller);
        const isRJ = RJ_TYPES_SET.has(l.leadType);
        e.tot += l.updateCount;
        e.capUpd += Math.min(l.updateCount || 0, 4);   // ติดตาม: cap 4/เคส
        if (isRJ) { e.cntRJ++; e.totRJ += l.updateCount; }
        else      { e.cntNormal++; e.totNormal += l.updateCount; }
        e.cnt++;
        if(l.updateCount>=3) e.high++;
        const sc = diligenceScore(l.updateCount, isRJ);
        if (isRJ) e.scoreCallRJ += sc;
        else      e.scoreCallNormal += sc;
        e.scoreCall += sc;
        e.score += sc;
        // เก็บ distribution ตามจำนวนครั้งที่โทร (สำหรับ breakdown ใน modal)
        const uc = l.updateCount || 0;
        if (!e.callBuckets[uc]) e.callBuckets[uc] = {nNormal:0, nRJ:0, score:0};
        const bk = e.callBuckets[uc];
        if (isRJ) bk.nRJ++; else bk.nNormal++;
        bk.score += sc;
      });
      // ส่วนที่ 2: คะแนนจากการจอง + ปล่อย
      // ใช้ ms.sellers[name].booking + .done จาก backend monthlySummary
      // เพื่อให้ตัวเลขตรงกับ "สรุปรายเซลล์" ตาราง (single source of truth)
      const monthlySrc = buildRangeMs();   // 📅 คะแนนตามช่วงวันที่ที่เลือก
      const sellersList = FD.sellers || D.sellers || [];
      sellersList.forEach(s => {
        const sd = (monthlySrc.sellers && monthlySrc.sellers[s.name]) || {};
        const jongs = sd.booking || 0;
        const dones = sd.done || 0;
        const leads = sd.lead || 0;
        const bans  = sd.bans || 0;
        // สร้าง entry ให้ "ทุกเซลล์" — คะแนนแบนเริ่ม 10 เสมอ (ไม่งั้นเซลล์ที่ไม่มี activity total=0 ขัดกับแบน=10)
        const e = _ensureDilEntry(m, s.name);
        e.jongs = jongs; e.dones = dones; e.leads = leads; e.bans = bans;
        e.scoreJong = jongs * SCORE_JONG;   // เก็บไว้ใช้ใน velocity/breakdown เดิม
        e.scoreDone = dones * SCORE_DONE;
      });
      // ส่วนที่ 3: Pipeline Velocity — แยก 2 phase
      //   Phase 1: รับหลีด (leadDate) → จอง (date)
      //   Phase 2: จอง (date) → ปล่อย (releaseDate, status=ปล่อย เท่านั้น)
      //   ตัด walk-in (จองหน้าร้าน) — ไม่มี lead flow จริง → inflate velocity
      (FD.bookingCases || []).forEach(b => {
        if (_isWalkIn(b.channel)) return;  // ข้าม walk-in
        // Phase 1: leadDate → date (วันจอง)
        if (b.leadDate && b.date && b.leadDate !== '-' && b.date !== '-') {
          if (ir(b.date)) {
            const d1 = _daysBetween(b.leadDate, b.date);
            if (d1 !== null && d1 >= 0 && d1 <= 365) {
              const e1 = _ensureDilEntry(m, b.seller);
              e1.velP1Sum += d1;
              e1.velP1Count++;
            }
          }
        }
        // Phase 2: date (จอง) → releaseDate (ปล่อย) — เฉพาะ status=ปล่อย
        if (b.status === 'ปล่อย') {
          const startDate = b.date;
          const endDate = b.releaseDate && b.releaseDate !== '-' ? b.releaseDate : null;
          if (startDate && endDate && ir(endDate)) {
            const d2 = _daysBetween(startDate, endDate);
            if (d2 !== null && d2 >= 0 && d2 <= 365) {
              const e2 = _ensureDilEntry(m, b.seller);
              e2.velP2Sum += d2;
              e2.velP2Count++;
            }
          }
        }
      });
      // ส่วนที่ 4: ความเร็ว 3 ช่วง (เต็ม 10) — เคสปล่อยในช่วงที่เลือก (รวม walk-in)
      //   จอง→เซ็น ≤3วัน · เซ็น→ผล ≤3วัน · ผล→ปล่อย ≤1วัน · เฉลี่ย 3 ช่วง → [0,1]
      //   วันที่ช่วงไหนว่าง/ไม่กรอก = 0 ช่วงนั้น (จูงใจให้กรอกวันเซ็น/วันผล)
      (FD.bookingCases || []).forEach(b => {
        if (b.status !== 'ปล่อย') return;
        const endDate = b.releaseDate && b.releaseDate !== '-' ? b.releaseDate : b.date;
        if (!endDate || !ir(endDate)) return;
        const frac = (_stageScore(b.date, b.signDate, 3)
                    + _stageScore(b.signDate, b.resultDate, 3)
                    + _stageScore(b.resultDate, b.releaseDate, 1)) / 3;
        const e = _ensureDilEntry(m, b.seller);
        e.velSum += frac;
        e.velCnt++;
      });
      // ── สูตรคะแนนใหม่ (100 คะแนน) — แทนสูตรเดิม ──
      //   จบ30 (ปล่อย/15) · จอง10 (จอง/30) · Conv20 (ปล่อย÷lead vs 5%) · ความเร็ว10 · ติดตาม20 · โดนแบน10
      Object.values(m).forEach(e => {
        const sDone = Math.min((e.dones || 0) / DONE_TGT, 1) * 30;
        const sJong = Math.min((e.jongs || 0) / JONG_TGT, 1) * 10;
        const conv = (e.leads || 0) > 0 ? (e.dones || 0) / e.leads * 100 : 0;
        const sConv = Math.min(conv / CONV_TGT, 1) * 20;
        const vel = (e.velCnt || 0) > 0 ? (e.velSum / e.velCnt) : 0;
        const sVel = vel * 10;
        const completion = (e.cnt || 0) > 0 ? (e.capUpd || 0) / (4 * e.cnt) : 0;
        const sFollow = completion * 20;
        const sBan = Math.max(0, 10 - (e.bans || 0));
        e.conv = Math.round(conv * 10) / 10;
        e.completion = Math.round(completion * 100);
        e.velPct = Math.round(vel * 100);
        e.sDone = Math.round(sDone * 10) / 10;
        e.sJong = Math.round(sJong * 10) / 10;
        e.sConv = Math.round(sConv * 10) / 10;
        e.sVel = Math.round(sVel * 10) / 10;
        e.sFollow = Math.round(sFollow * 10) / 10;
        e.sBan = sBan;
        e.score = Math.round((sDone + sJong + sConv + sVel + sFollow + sBan) * 10) / 10;  // 0-100
      });
      return m;
    }

    // ── Walk-in detector: จองหน้าร้าน / walk-in / WI ──
    function _isWalkIn(channel) {
      if (!channel) return false;
      const c = String(channel).toLowerCase();
      return c.includes('หน้าร้าน') || c.includes('walk') || c === 'wi';
    }

    // ── หาเคสที่ contribute ใน velocity (สำหรับ modal) ──
    function _getVelocityCases(sellerName, phase) {
      const out = [];
      (FD.bookingCases || []).forEach(b => {
        if (b.seller !== sellerName) return;
        if (_isWalkIn(b.channel)) return;
        if (phase === 1) {
          if (!b.leadDate || !b.date || b.leadDate === '-' || b.date === '-') return;
          if (!ir(b.date)) return;
          const days = _daysBetween(b.leadDate, b.date);
          if (days === null || days < 0 || days > 365) return;
          out.push({ ...b, _days: days, _start: b.leadDate, _end: b.date, _phase: 1 });
        } else {
          if (b.status !== 'ปล่อย') return;
          const endDate = b.releaseDate && b.releaseDate !== '-' ? b.releaseDate : null;
          if (!b.date || !endDate) return;
          if (!ir(endDate)) return;
          const days = _daysBetween(b.date, endDate);
          if (days === null || days < 0 || days > 365) return;
          out.push({ ...b, _days: days, _start: b.date, _end: endDate, _phase: 2 });
        }
      });
      out.sort((a, b) => b._days - a._days);   // ช้าสุดก่อน
      return out;
    }

    // ── Generic case-list modal ──
    function _showCaseListModal({title, subtitle, headers, rows, footer}) {
      const old = document.getElementById('case-list-overlay');
      if (old) old.remove();
      const overlay = document.createElement('div');
      overlay.id = 'case-list-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1100;display:flex;align-items:center;justify-content:center;padding:16px';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
      const headerHtml = headers.map(h2 => `<th style="padding:8px 9px;text-align:${h2.align||'left'};font-weight:600;font-size:10.5px">${h(h2.label)}</th>`).join('');
      const rowsHtml = rows.length === 0
        ? `<tr><td colspan="${headers.length}" style="padding:18px;text-align:center;color:var(--t3);font-size:12px">ไม่มีเคสในช่วงที่เลือก</td></tr>`
        : rows.join('');
      overlay.innerHTML = `
        <div style="background:var(--bg);border-radius:14px;max-width:720px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden">
          <div style="padding:14px 18px;border-bottom:.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center;background:var(--blue-bg)">
            <div>
              <div style="font-size:11px;color:var(--blue);font-weight:600">${h(subtitle||'')}</div>
              <div style="font-size:15px;font-weight:700;color:var(--t1);margin-top:2px">${title}</div>
            </div>
            <button onclick="document.getElementById('case-list-overlay').remove()" style="background:transparent;border:none;font-size:22px;color:var(--t3);cursor:pointer;line-height:1">✕</button>
          </div>
          <div style="overflow-y:auto;flex:1">
            <table style="width:100%;border-collapse:collapse">
              <thead><tr style="background:var(--bg2);color:var(--t3);position:sticky;top:0">${headerHtml}</tr></thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
          ${footer ? `<div style="padding:10px 16px;border-top:.5px solid var(--bd);background:var(--bg2);font-size:10.5px;color:var(--t3);line-height:1.5">${footer}</div>` : ''}
        </div>
      `;
      document.body.appendChild(overlay);
    }

    // ── Modal: เคส "ยังไม่อัพเดท" ของเซลล์คนหนึ่ง ──
    function showNotCalledCases(sellerName) {

      all.sort((a, b) => {
        // เก่าสุดก่อน → เร่งโทรก่อน
        const da = _parseDmy(a.dateIn), db = _parseDmy(b.dateIn);
        return (da ? da.getTime() : 0) - (db ? db.getTime() : 0);
      });
      const rows = all.map(c => {
        const isRJ = RJ_TYPES_SET.has(c.leadType);
        const typeColor = isRJ ? 'var(--red)' : 'var(--t2)';
        return `
          <tr style="border-top:.5px solid var(--bd)">
            <td style="padding:7px 9px;font-size:11px">
              <div style="font-weight:600;color:var(--t1)">${h(c.car||'-')}</div>
              <div style="font-size:10px;color:var(--t3)">${h(c.code||'-')} · ${h(c.phone||'-')}</div>

            <td style="padding:7px 9px;font-size:11px;color:var(--t2)">${h(c.channel||'-')}</td>
            <td style="padding:7px 9px;font-size:11px;text-align:right;color:var(--t2)">${h(c.dateIn||'-')}</td>
          </tr>
        `;
      });
      _showCaseListModal({
        title: `🔴 ยังไม่อัพเดท · ${h(sellerName)}`,
        subtitle: `${all.length} เคส — เรียงจากเคสที่รับมานานสุดก่อน`,
        headers: [
          {label: 'ลูกค้า / รถ'},
          {label: 'ประเภท'},
          {label: 'ช่อง'},
          {label: 'วันที่รับ', align: 'right'},

        rows,
        footer: `<b>updateCount = 0</b> · ไม่นับ junk (จบ/คืน/ยกเลิก/จ่ายใหม่)`,
      });
    }

    // ── Modal: เคส "ปล่อย" ของเซลล์ (Top มูลค่าดีล) ──

        if (b.status !== 'ปล่อย') return;

    // ── Modal: เคส "จอง" ของเซลล์ (Top จอง) ──

    // ── Modal: รายชื่อเคสที่ contribute ใน velocity ──
    function showVelocityCases(sellerName, phase) {
      const old = document.getElementById('velocity-cases-overlay');
      if (old) old.remove();
      const cases = _getVelocityCases(sellerName, phase);
      const phaseLabel = phase === 1 ? 'รับหลีด → จอง' : 'จอง → ปล่อย';
      const startLabel = phase === 1 ? 'วันรับเคส' : 'วันจอง';
      const endLabel   = phase === 1 ? 'วันจอง'    : 'วันปล่อย';
      const avg = cases.length > 0 ? (cases.reduce((a,c)=>a+c._days,0) / cases.length).toFixed(1) : 0;

      const overlay = document.createElement('div');
      overlay.id = 'velocity-cases-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1100;display:flex;align-items:center;justify-content:center;padding:16px';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

      const rowsHtml = cases.length === 0
        ? `<tr><td colspan="5" style="padding:18px;text-align:center;color:var(--t3);font-size:12px">ไม่มีเคสในช่วงที่เลือก (อาจตัด walk-in ออกแล้ว)</td></tr>`
        : cases.map(c => {
          const dayClr = c._days <= (phase===1?7:14) ? 'var(--green)' : c._days <= (phase===1?21:30) ? 'var(--amber)' : 'var(--red)';
          return `
            <tr style="border-top:.5px solid var(--bd)">
              <td style="padding:7px 9px;font-size:11px">
                <div style="font-weight:600;color:var(--t1)">${h(c.customer || c.car || '-')}</div>
                <div style="font-size:10px;color:var(--t3)">${h(c.car || '')} ${c.leadCode ? '· '+h(c.leadCode) : ''}</div>
              </td>
              <td style="padding:7px 9px;font-size:11px;text-align:right">${h(c._start)}</td>
              <td style="padding:7px 9px;font-size:11px;text-align:right">${h(c._end)}</td>
              <td style="padding:7px 9px;font-size:13px;font-weight:700;text-align:right;color:${dayClr}">${c._days}d</td>
              <td style="padding:7px 9px;font-size:10px;color:var(--t3);text-align:right">${h(c.status || '-')}</td>
            </tr>
          `;
        }).join('');

      overlay.innerHTML = `
        <div style="background:var(--bg);border-radius:14px;max-width:680px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden">
          <div style="padding:14px 18px;border-bottom:.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center;background:var(--blue-bg)">
            <div>
              <div style="font-size:11px;color:var(--blue);font-weight:600">${h(phaseLabel)} · ${h(sellerName)}</div>
              <div style="font-size:14px;font-weight:700;color:var(--t1);margin-top:2px">${cases.length} เคส · เฉลี่ย <b style="color:var(--blue)">${avg} วัน</b></div>
            </div>
            <button onclick="document.getElementById('velocity-cases-overlay').remove()" style="background:transparent;border:none;font-size:22px;color:var(--t3);cursor:pointer;line-height:1">✕</button>
          </div>
          <div style="overflow-y:auto;flex:1">
            <table style="width:100%;border-collapse:collapse">
              <thead>
                <tr style="background:var(--bg2);color:var(--t3);position:sticky;top:0">
                  <th style="padding:8px 9px;text-align:left;font-weight:600;font-size:10.5px">ลูกค้า / รถ</th>
                  <th style="padding:8px 9px;text-align:right;font-weight:600;font-size:10.5px">${h(startLabel)}</th>
                  <th style="padding:8px 9px;text-align:right;font-weight:600;font-size:10.5px">${h(endLabel)}</th>
                  <th style="padding:8px 9px;text-align:right;font-weight:600;font-size:10.5px">วัน</th>
                  <th style="padding:8px 9px;text-align:right;font-weight:600;font-size:10.5px">สถานะ</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
          <div style="padding:10px 16px;border-top:.5px solid var(--bd);background:var(--bg2);font-size:10.5px;color:var(--t3);line-height:1.5">
            ตัด <b>จองหน้าร้าน (walk-in)</b> ออกแล้ว — ไม่มี lead flow จริง · เรียงจากเคสที่ใช้เวลานานสุดก่อน
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    // ── Modal: แสดงวิธีคำนวณ Score ของเซลล์คนเดียว ──
    function showSellerScoreBreakdown(name) {
      const old = document.getElementById('seller-score-overlay');
      if (old) old.remove();
      const m = buildDilMap();  // ใช้ map ตัวเดียวกับตาราง — มี date filter อยู่แล้ว
      const d = m[name] || _ensureDilEntry({}, name);
      const fmtNum = (n) => Number(n||0).toLocaleString();
      // แสดงช่วงเวลาที่กรอง
      const MF = ["","มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
      const periodLabel = dfMonth === 0 ? "ทั้งปี" : dfMonth === -1 ? "วันนี้" : `เดือน${MF[dfMonth]}`;
      const overlay = document.createElement('div');
      overlay.id = 'seller-score-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1100;display:flex;align-items:center;justify-content:center;padding:16px';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

      // Velocity 2 phases
      const v1Avg = d.velP1Count > 0 ? Math.round((d.velP1Sum/d.velP1Count)*10)/10 : null;
      const v2Avg = d.velP2Count > 0 ? Math.round((d.velP2Sum/d.velP2Count)*10)/10 : null;

      // ── Breakdown ตามจำนวนครั้งที่โทร — สร้างแถวเรียงจากน้อยไปมาก ──
      const _bk = d.callBuckets || {};
      const _bkKeys = Object.keys(_bk).map(Number).sort((a,b)=>a-b);
      const _callRows = _bkKeys.map(uc => {
        const b = _bk[uc];
        const n = b.nNormal + b.nRJ;
        const rjPart = b.nRJ > 0 ? ` <span style="color:var(--red);font-size:9.5px">(RJ ${b.nRJ})</span>` : '';
        const sumUpd = uc * n;  // รวมอัพเดทของกลุ่มนี้ = จำนวนครั้ง × จำนวนเคส
        const label = uc === 0 ? 'ยังไม่โทร' : `โทร ${uc} ครั้ง`;
        return `<tr>
          <td style="padding:6px 9px;border-bottom:.5px solid var(--bd)">${label}</td>
          <td style="padding:6px 9px;border-bottom:.5px solid var(--bd);text-align:right">${n}${rjPart}</td>
          <td style="padding:6px 9px;border-bottom:.5px solid var(--bd);text-align:right;color:var(--blue);font-weight:700">${sumUpd}</td>
        </tr>`;
      }).join('');

      overlay.innerHTML = `
        <div style="background:var(--bg);border-radius:14px;max-width:560px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden">
          <div style="padding:14px 18px;border-bottom:.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center;background:var(--blue-bg)">
            <div>
              <div style="font-size:11px;color:var(--blue);font-weight:600">Sales Performance · ${h(periodLabel)}</div>
              <div style="font-size:18px;font-weight:800;color:var(--t1);margin-top:2px">${h(name)} <span style="color:var(--blue)">— ${fmtNum(d.score)} คะแนน</span></div>
            </div>
            <button onclick="document.getElementById('seller-score-overlay').remove()" style="background:transparent;border:none;font-size:22px;color:var(--t3);cursor:pointer;line-height:1">✕</button>
          </div>

          <div style="padding:14px 18px;overflow-y:auto;flex:1">

            <!-- องค์ประกอบคะแนน (6 ด้าน รวม 100) -->
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px">
              ${[
                {l:'จบ (ปล่อย)', sc:d.sDone, max:30, sub:`${d.dones||0}/${DONE_TGT} คัน`, c:'var(--green)'},
                {l:'จอง', sc:d.sJong, max:10, sub:`${d.jongs||0}/${JONG_TGT}`, c:'var(--blue)'},
                {l:'Conv', sc:d.sConv, max:20, sub:`${d.conv||0}% · เป้า ${CONV_TGT}%`, c:'var(--blue)'},
                {l:'ความเร็ว', sc:d.sVel, max:10, sub:`${d.velPct||0}% · ${d.velCnt||0} เคสปล่อย`, c:'var(--purple)'},
                {l:'ติดตาม', sc:d.sFollow, max:20, sub:`${d.completion||0}% · ${d.cnt||0} เคส`, c:'var(--amber)'},
                {l:'โดนแบน', sc:d.sBan, max:10, sub:`แบน ${d.bans||0} ครั้ง`, c:(d.bans>0?'var(--red)':'var(--green)')},
              ].map(x=>`
                <div style="padding:9px 8px;background:var(--bg2);border-radius:8px;text-align:center">
                  <div style="font-size:10px;color:var(--t3);font-weight:600">${x.l}</div>
                  <div style="font-size:18px;font-weight:800;color:${x.c};margin-top:2px">${fmtNum(x.sc)}<span style="font-size:10px;color:var(--t3)">/${x.max}</span></div>
                  <div style="font-size:9px;color:var(--t3);margin-top:1px">${x.sub}</div>
                </div>`).join('')}
            </div>

            <!-- Pipeline Velocity 2 Phases -->
            <div style="margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
              <div style="padding:10px 12px;background:var(--bg2);border-radius:8px">
                <div style="font-size:11px;color:var(--t3);font-weight:600">รับ → จอง</div>
                <div style="font-size:18px;font-weight:700;color:${v1Avg===null?'var(--t3)':v1Avg<=7?'var(--green)':v1Avg<=21?'var(--amber)':'var(--red)'};margin-top:2px">${v1Avg===null?'-':v1Avg+' วัน'}</div>
                <div style="font-size:10px;color:var(--t3)">${d.velP1Count > 0 ? `เฉลี่ย ${d.velP1Count} เคส` : 'ไม่มีข้อมูล'}</div>
              </div>
              <div style="padding:10px 12px;background:var(--bg2);border-radius:8px">
                <div style="font-size:11px;color:var(--t3);font-weight:600">จอง → ปล่อย</div>
                <div style="font-size:18px;font-weight:700;color:${v2Avg===null?'var(--t3)':v2Avg<=14?'var(--green)':v2Avg<=30?'var(--amber)':'var(--red)'};margin-top:2px">${v2Avg===null?'-':v2Avg+' วัน'}</div>
                <div style="font-size:10px;color:var(--t3)">${d.velP2Count > 0 ? `เฉลี่ย ${d.velP2Count} เคส` : 'ไม่มีข้อมูล'}</div>
              </div>
            </div>

            <!-- 1. รายละเอียด Activity — แยกตามจำนวนครั้งที่โทร -->
            <div style="margin-bottom:14px">
              <div style="font-size:12px;font-weight:700;color:var(--t1);margin-bottom:3px">📞 รายละเอียด Activity</div>
              <div style="font-size:10.5px;color:var(--t3);margin-bottom:6px">รับผิดชอบ <b style="color:var(--t1)">${d.cnt}</b> เคสติดตาม · อัพเดทรวม <b style="color:var(--t1)">${d.tot}</b> ครั้ง — แยกตามว่าโทรกี่ครั้ง</div>
              <table style="width:100%;border-collapse:collapse;font-size:11px">
                <thead>
                  <tr style="background:var(--bg2);color:var(--t3)">
                    <th style="padding:6px 9px;text-align:left;font-weight:600">โทรกี่ครั้ง</th>
                    <th style="padding:6px 9px;text-align:right;font-weight:600">กี่เคส</th>
                    <th style="padding:6px 9px;text-align:right;font-weight:600">รวมอัพเดท</th>
                  </tr>
                </thead>
                <tbody>
                  ${_callRows || `<tr><td colspan="3" style="padding:10px;text-align:center;color:var(--t3)">ไม่มีเคสติดตาม</td></tr>`}
                  <tr style="background:var(--bg2)">
                    <td style="padding:7px 9px;font-weight:700">รวม</td>
                    <td style="padding:7px 9px;text-align:right;font-weight:700">${d.cnt} เคส</td>
                    <td style="padding:7px 9px;text-align:right;color:var(--blue);font-weight:800">${d.tot}</td>
                  </tr>
                </tbody>
              </table>
              <div style="font-size:10px;color:var(--t3);margin-top:4px;line-height:1.5;text-align:center">เฉลี่ย <b style="color:var(--blue)">${d.cnt>0?Math.round((d.tot/d.cnt)*10)/10:0}</b> ครั้ง/เคส (รวมอัพเดท ${d.tot} ÷ ${d.cnt} เคส)</div>
            </div>

            <!-- รวมทั้งหมด -->
            <div style="padding:12px 14px;background:var(--blue);color:#fff;border-radius:10px;display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="font-size:13px;font-weight:700">Total Sales Performance</div>
                <div style="font-size:10px;opacity:.85;margin-top:1px">Activity + Pipeline + Outcome</div>
              </div>
              <div style="font-size:22px;font-weight:800">${fmtNum(d.score)}</div>
            </div>

            <div style="margin-top:12px;display:flex;gap:8px">
              <button onclick="document.getElementById('seller-score-overlay').remove();showScoreHelp()" style="flex:1;padding:8px 12px;border-radius:8px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);cursor:pointer;font-size:12px">ดูสูตรคะแนน</button>
              <button onclick="document.getElementById('seller-score-overlay').remove();switchToSeller('${h(name)}')" style="flex:1;padding:8px 12px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;font-size:12px">ไปหน้า ${h(name)}</button>
            </div>

          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    // ── Theme toggle (สว่าง/มืด) ──
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      try { localStorage.setItem('oxlet_theme', cur); } catch(e) {}
      if (typeof render === 'function') render();  // refresh ไอคอนปุ่ม + สีกราฟ
    }
    function themeIcon() {
      return document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
    }

    // ── Render engine ──

      let labels = [], leadNormal = [], leadRJ = [], bookings = [], dones = [], dealValue = [];
      if (isDaily) {
        // รายวันตลอดช่วง (ข้ามเดือนได้)
        for (const [mo, d] of _days) {
          const dd = _dailySrc[mo] || {};
          labels.push(d + '/' + mo);
          leadNormal.push((dd.leads || [])[d] || 0);
          leadRJ.push((dd.leadRJ || [])[d] || 0);
          bookings.push((dd.bookings || [])[d] || 0);
          dones.push((dd.dones || [])[d] || 0);
          dealValue.push((dd.dealValue || [])[d] || 0);
        }
      } else {
        // รายเดือน — รวมเฉพาะวันที่อยู่ในช่วง (เดือนหัว/ท้ายอาจไม่เต็มเดือน)
        const monthsIn = [...new Set(_days.map(x => x[0]))].sort((a, b) => a - b);
        for (const mo of monthsIn) {
          const dd = _dailySrc[mo] || {};
          let ln = 0, lr = 0, bk = 0, dn = 0, dv = 0;
          for (const [mm, d] of _days) {
            if (mm !== mo) continue;

            lr += (dd.leadRJ || [])[d] || 0;
            bk += (dd.bookings || [])[d] || 0;
            dn += (dd.dones || [])[d] || 0;
            dv += (dd.dealValue || [])[d] || 0;

          labels.push((C.MONTHS_SHORT || [])[mo - 1] || ('ด.' + mo));

    // ── Date filter bar (📅 กรองวันที่รับเคส — ช่วงวัน จาก-ถึง ข้ามเดือนได้) ──

    // ── 🔮 พยากรณ์ยอดขาย (linear regression จากยอดจริงรายเดือน) ──
    function monthForecast(vals12) {
      // vals12: index 0..11 = Jan..Dec — ใช้เฉพาะเดือนที่ผ่านมาจริง (1..เดือนปัจจุบัน) กันค่าหลงในอนาคตถ่วง
      const _cur = new Date().getMonth() + 1;
      const pts = [];
      for (let m=1;m<=Math.min(12,_cur);m++){ if (vals12[m-1] > 0) pts.push([m, vals12[m-1]]); }
      if (pts.length < 2) return null;
      const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]), n=xs.length;
      const sx=xs.reduce((a,b)=>a+b,0), sy=ys.reduce((a,b)=>a+b,0);
      const sxx=xs.reduce((a,b)=>a+b*b,0), sxy=xs.reduce((a,_,i)=>a+xs[i]*ys[i],0);
      const denom = n*sxx - sx*sx;
      const slope = denom ? (n*sxy - sx*sy)/denom : 0;
      const intercept = (sy - slope*sx)/n;
      const lastM = pts[pts.length-1][0];
      const arr = new Array(12).fill(null);
      arr[lastM-1] = vals12[lastM-1];  // จุดเชื่อมกับเส้นจริง
      for (let k=1;k<=3 && lastM+k<=12;k++) arr[lastM-1+k] = Math.max(0, Math.round(slope*(lastM+k)+intercept));
      return { arr, slope, lastM, next: Math.max(0, Math.round(slope*(lastM+1)+intercept)) };
    }
    function _monthlyVals(key) {

    // เส้นแนวโน้มจากยอดจริง (regression เฉพาะเดือนที่มีข้อมูล — ไม่ต่อไปอนาคต)
    function trendLineActual(vals12) {
      const _cur = new Date().getMonth() + 1;
      const pts=[]; for(let m=1;m<=Math.min(12,_cur);m++){ if(vals12[m-1]>0) pts.push([m,vals12[m-1]]); }
      if(pts.length<2) return null;
      const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),n=xs.length;
      const sx=xs.reduce((a,b)=>a+b,0),sy=ys.reduce((a,b)=>a+b,0);
      const sxx=xs.reduce((a,b)=>a+b*b,0),sxy=xs.reduce((a,_,i)=>a+xs[i]*ys[i],0);
      const d=n*sxx-sx*sx; const slope=d?(n*sxy-sx*sy)/d:0; const ic=(sy-slope*sx)/n;
      const arr=new Array(12).fill(null);
      for(let m=pts[0][0];m<=pts[pts.length-1][0];m++) arr[m-1]=Math.max(0, Math.round((slope*m+ic)*10)/10);
      return arr;
    }
    function runForecastAI() {

      const summary = 'ยอดขายรายเดือนปีนี้:\n' + lines.join('\n');
      const btn=document.getElementById('forecast-ai-btn'), box=document.getElementById('forecast-ai-result');
      btn.disabled=true; btn.innerHTML='<span class="spin" style="width:13px;height:13px;border-width:2px;display:inline-block;vertical-align:middle"></span> AI กำลังวิเคราะห์...';
      fetch('/api/insights/forecast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({summary})})
        .then(r=>r.json()).then(j=>{
          if(!j.ok||j.error){ box.innerHTML=`<div style="color:var(--red)">⚠️ ${h(j.error||'วิเคราะห์ไม่สำเร็จ')}</div>`; }

        }).catch(e=>{ box.innerHTML=`<div style="color:var(--red)">⚠️ ${h(e.message)}</div>`; })
        .finally(()=>{ btn.disabled=false; btn.textContent='🤖 วิเคราะห์อีกครั้ง'; });
    }

      scoreEntries.forEach((e, i) => {

      });
      html += `</div></div>`;
      html += `<div style="margin-top:8px;font-size:10px;color:var(--t3)">น้ำหนัก: จบ 30 · จอง 10 · Conv 20 · ความเร็ว 10 · ติดตาม 20 · โดนแบน 10 = 100 · ข้อมูลแบนจาก "รายงานแบน" · กดแถวดูรายละเอียด</div>`;
      html += `</div>`;

      // ════════════════════════════════════════════════════════════════
      // 📈 จัดสรร Lead ตามคะแนน — ใส่ lead/วัน → กระจายตามคะแนน 100 แต้ม
      // ════════════════════════════════════════════════════════════════
      // วิธี: แต่ละคนได้ = (คะแนนตัวเอง ÷ คะแนนรวมทีม) × lead/วัน
      //   • Floor 1 lead/วัน (ทุกคนได้อย่างน้อย 1 — ให้โอกาส)
      //   • ปัดเศษด้วย Largest Remainder → รวมได้ตรง lead/วัน เป๊ะ
      // ════════════════════════════════════════════════════════════════
      // จัดสรร lead เฉพาะเซลล์ที่มี activity จริง (ปล่อย/จอง/เคสติดตาม) — ไม่นับคนที่ได้แค่คะแนนแบนเริ่มต้น 10
      const allocPool = scoreEntries.filter(e => (e.dones + e.jongs + e.cnt) > 0);
      const _sumScore = allocPool.reduce((a, e) => a + e.total, 0) || 1;

      // → เฉพาะการจัดสรรอนาคต ไม่กระทบ KPI/เคส/RJ ที่นับเต็ม

      const _sval = (s, key) => {
