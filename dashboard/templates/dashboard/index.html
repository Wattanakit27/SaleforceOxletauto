<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oxlet Dashboard</title>
  {% load static %}
  <link rel="icon" type="image/png" href="{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}">
  <link rel="apple-touch-icon" href="{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}">
  <link rel="stylesheet" href="{% static 'dashboard/css/globals.css' %}?v=20260606f">
  <script>
    // ตั้งธีมก่อน paint (กันจอกระพริบ) — ใช้ค่าที่บันทึก หรือตามระบบ
    (function(){
      try {
        var t = localStorage.getItem('oxlet_theme');
        if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) { document.documentElement.setAttribute('data-theme','light'); }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* Mobile safety — ป้องกัน horizontal scroll + KPI grid overflow */
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; max-width: 100vw; }
    .app { max-width: 100vw; }

    /* Admin nav dropdown */
    .admin-nav-menu summary::-webkit-details-marker { display: none; }
    .admin-nav-menu summary { user-select: none; }
    .admin-nav-menu[open] summary { background: var(--blue) !important; color: #fff !important; }

    /* Subtitle ใต้ card-title — อธิบายว่าตาราง/กราฟนี้ดูอะไร */
    .card-sub { font-size: 10.5px; color: var(--t3); margin: -6px 0 10px; line-height: 1.5; font-weight: 400; }

    /* Info tooltip — ไอคอน '?' วงกลมเล็ก กด/hover แล้วโผล่คำอธิบาย */
    .info-tip {
      display: inline-flex; align-items: center; justify-content: center;
      width: 15px; height: 15px; border-radius: 50%;
      background: var(--t3); color: #fff;
      font-size: 10px; font-weight: 700;
      cursor: help; margin-left: 5px; vertical-align: middle;
      position: relative; user-select: none;
      transition: background .15s;
    }
    .info-tip:hover, .info-tip:focus { background: var(--blue); outline: none; }
    /* กล่อง tooltip render ด้วย JS smart-tooltip (position:fixed อิง viewport) — เลิกใช้ ::after
       เพราะโดน parent overflow:hidden (เช่น .kpi) ตัดหัวตอนการ์ดอยู่แถวบนสุดของจอ */

    /* Collapsible advanced sections (Lead-by-Car, Released Cars) */
    details.adv-section { background: var(--bg); border: .5px solid var(--bd); border-radius: 12px; margin-bottom: 10px; }
    details.adv-section[open] { padding-bottom: 8px; }
    details.adv-section > summary { list-style: none; cursor: pointer; padding: 12px 14px; font-weight: 600; font-size: 13px; color: var(--t1); display: flex; align-items: center; justify-content: space-between; }
    details.adv-section > summary::-webkit-details-marker { display: none; }
    details.adv-section > summary::after { content: '▾ ขยาย'; font-size: 11px; font-weight: 500; color: var(--t3); }
    details.adv-section[open] > summary::after { content: '▴ ย่อ'; }
    details.adv-section > .adv-body { padding: 0 14px; }
    /* ลบ inner card border/padding ซ้ำเมื่ออยู่ใน adv-section */
    details.adv-section .adv-body > .card { border: none; padding: 0; margin: 0; background: transparent; }

    .cgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
    .cgrid > .chart-card.span2 { grid-column: span 2; }
    .chart-card .chart-box { position:relative; height:240px; }
    .chart-card.span2 .chart-box { height:260px; }

    /* KPI grid + card content — bullet-proof responsive */
    .kgrid > * { min-width: 0; }
    .kpi .kl, .kpi .ks { word-break: break-word; line-height: 1.4; }
    .kpi .kv { line-height: 1; word-break: break-word; }

    /* Tables ที่อาจกว้างเกิน mobile — wrap ด้วย overflow scroll */
    .card table, .booking-card table { width: 100%; }

    @media (max-width:760px) {
      .cgrid { grid-template-columns:1fr; }
      .cgrid > .chart-card.span2 { grid-column: auto; }
      .chart-card .chart-box { height:220px; }
      .card { padding: 12px 11px; }
      .card-title { font-size: 12px; }
      /* booking + lead-by-car tables → scroll horizontal */
      .card table { display: block; overflow-x: auto; white-space: nowrap; }
      .shdr, .srow { font-size: 11px; gap: 4px; padding: 6px 5px; }
      .lfhdr, .lfrow { font-size: 11px; }
      .hlhdr, .hlrow { font-size: 10px; gap: 4px; padding: 5px 4px; }
      /* sort/search inputs ที่ shrink ได้ */
      input[type="text"], select { font-size: 12px; padding: 5px 8px; }
    }
    @media (max-width:420px) {
      .kpi .kv { font-size: 18px; }
      .kpi .kl { font-size: 10px; }
      .kpi .ks { font-size: 9.5px; }
      .pipe-num { font-size: 17px; }
      .pipe-lbl { font-size: 9.5px; }
      .card { padding: 11px 9px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    {% if error %}
    <div style="text-align:center;padding-top:80px">
      <div style="font-size:48px;margin-bottom:14px">${ic('lucide:triangle-alert',16)}</div>
      <div style="font-size:18px;font-weight:700;color:var(--t1);margin-bottom:6px">เกิดข้อผิดพลาด</div>
      <div style="font-size:13px;color:var(--t2)">{{ error }}</div>
      <button onclick="location.reload()" class="bbtn" style="margin-top:12px">${ic('lucide:refresh-cw',16)} ลองอีกครั้ง</button>
    </div>
    {% else %}
    <div class="loading-container" id="loading">
      <div class="spin"></div>
      <span style="font-size:13px">กำลังโหลด Dashboard...</span>
    </div>
    <div id="dashboard-root" style="display:none"></div>
    {% endif %}
  </div>

  {% if not error %}
  <script>
    // ── Data from server ──
    const D = {{ data_json|safe }};
    const C = {{ constants_json|safe }};
    const SESSION_USER = {{ session_user_json|safe }};
    const LOGO_URL = "{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}";

    // ── Close admin-nav-menu dropdown เมื่อคลิกข้างนอก หรือกดเมนูใน ──
    document.addEventListener('click', (e) => {
      document.querySelectorAll('.admin-nav-menu[open]').forEach(d => {
        // ปิดถ้า: คลิกปุ่มภายใน menu (action ถูก trigger แล้ว) หรือคลิกข้างนอก details
        if (d.contains(e.target)) {
          if (e.target.closest('.admin-nav-item')) d.open = false;  // กดเมนู → ปิด
        } else {
          d.open = false;  // คลิกข้างนอก → ปิด
        }
      });
    });

    // ── Auth ──
    // Backend ให้ default เป็น 'ผู้บริหาร' มาแล้วเมื่อยังไม่ login → frontend แค่อ่านค่า
    function getEmployee() {
      if (SESSION_USER && SESSION_USER.position) {
        return {
          id: SESSION_USER.user_id || '',
          user_id: SESSION_USER.user_id || '',
          display_name: SESSION_USER.display_name || '',
          nickname: SESSION_USER.nickname || '',
          position: SESSION_USER.position || '',
        };
      }
      // ไม่มี session (ไม่ควรเกิด — backend บังคับ login) → ไม่ให้สิทธิ์อะไร
      // (เลิกอ่าน cookie oxlet_employee — เดิมปลอม role admin ฝั่ง client ได้ · PDPA/security)
      return { id:'', user_id:'', display_name:'', nickname:'', position:'seller' };
    }
    const employee = getEmployee();
    const isAdmin = employee.position === 'admin';
    // ผู้บริหาร — เห็นทุกอย่างเหมือน admin ปัจจุบัน + impersonate ได้ แต่ไม่มีเครื่องมือ admin-only (LINE, schedule ฯลฯ)
    const isExecutive = ['executive','ผู้บริหาร','manager','exec'].includes((employee.position||'').toLowerCase()) || employee.position === 'ผู้บริหาร';
    const canViewAll = isAdmin || isExecutive;

    // ── State ──
    let tab = new URLSearchParams(location.search).get('tab') || 'o';
    let curS = new URLSearchParams(location.search).get('seller') || '';
    let showCase = new URLSearchParams(location.search).get('case') || null;
    // ${ic('lucide:calendar',16)} กรองวันที่รับเคส (ช่วงวัน จาก-ถึง · ข้ามเดือนได้) — แทน month/today filter เดิม
    let dfMonth = 0;  // vestige (โค้ดเก่าบางจุดอ้าง — ตั้ง 0 = ไม่ใช้ month filter)
    const _ymd = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    let dfTo = _ymd(new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0));  // default = สิ้นเดือนปัจจุบัน (กรองทั้งเดือน)
    let dfFrom = _ymd(new Date(new Date().getFullYear(), new Date().getMonth(), 1));  // default = ต้นเดือนปัจจุบัน
    let curF = 'all';
    let curSo = 'urgent';
    let curMode = 'month';
    let lfPage = 1;
    let msort = 'lead';
    let hsel = 'all';
    let liveMonth = 0;
    let liveTeam = 'all';
    let followFilter = 'urgent';
    let bkSel = 'all';
    let bkStatus = 'all';
    let dilSort = 'score';  // 'score' | 'cnt' | 'avg' | 'high' | 'tot' — sort การ์ดติดตามมาก (default = Diligence Score)
    let leadPerDay = null;  // lead ต่อวัน (null = auto คำนวณจากสถิติ · เลข = ผู้ใช้ตั้งเอง)
    let searchQ = '';
    // Lead-by-car + Released-cars state (admin/exec only)
    let leadCarHideUnknown = true;
    let leadCarQuery = '';
    let leadCarPage = 1;
    const LEAD_CAR_PAGE_SIZE = 20;
    let releasedSort = 'date';  // 'date' | 'price' | 'seller' | 'age'
    let releasedSeller = 'all';
    let releasedStatus = 'ปล่อย';  // 'ปล่อย' | 'all' | 'จอง' | 'รอเซ็นต์' | 'รอผล' | 'รอปล่อย' | 'รีเจ็ก'
    let releasedPage = 1;
    const RELEASED_PAGE_SIZE = 50;
    let impersonate = canViewAll ? localStorage.getItem('oxlet_impersonate') : null;

    // Validate impersonate
    if (impersonate) {
      const validNames = (D.sellers || []).map(s => s.name);
      if (!validNames.includes(impersonate)) impersonate = null;
    }

    // ── Filtered data ──
    function getFilteredData() {
      const filterTo = !canViewAll ? employee.nickname : impersonate;
      if (!filterTo) return D;
      return {
        ...D,
        sellers: (D.sellers||[]).filter(s => s.name === filterTo),
        followCases: (D.followCases||[]).filter(c => c.seller === filterTo),
        bookingCases: (D.bookingCases||[]).filter(b => b.seller === filterTo),
      };
    }
    let FD = getFilteredData();

    // ── Helpers ──
    const h = (s) => s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
    // ชื่อที่แสดงของเซลล์: กลุ่มเทเลเซลล์ key ภายใน = 'ADMIN' (ตรงกับชีต) แต่โชว์ให้ผู้ใช้เป็น 'เทเลเซลล์' (กันสับสนกับบทบาทแอดมิน)
    const sname = (n) => n === 'ADMIN' ? 'เทเลเซลล์' : (n || '');
    // ไอคอน Iconify (Lucide) — ใช้แทนอิโมจิ. คืนเป็น HTML string ใส่ใน innerHTML ได้เลย (inherit currentColor)
    const LUCIDE={'alarm-clock':'<g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M5 3L2 6m20 0l-3-3M6.38 18.7L4 21m13.64-2.33L20 21"/></g>','arrow-up-right':'<path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h10v10M7 17L17 7"/>','bar-chart-3':'<path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3v18h18m-3-4V9m-5 8V5M8 17v-3"/>','bell':'<path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.268 21a2 2 0 0 0 3.464 0m-10.47-5.674A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>','bookmark':'<path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/>','bot':'<g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2m16 0h2m-7-1v2m-6-2v2"/></g>','brain':'<g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 18V5m3 8a4.17 4.17 0 0 1-3-4a4.17 4.17 0 0 1-3 4m8.598-6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"/><path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"/><path d="M18 18a4 4 0 0 0 2-7.464"/><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"/><path d="M6 18a4 4 0 0 1-2-7.464"/><path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"/></g>','briefcase':'<g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></g>','brush':'<g fill="none" stroke="cur     // ── Diligence map ──
    // Diligence Score — รวมคะแนนความขยัน + ผลลัพธ์ที่ได้
    //   โทรครั้งที่ 1: +10  (Coverage)

    const SCORE_JONG = 50;

    // ── เป้าสูตรคะแนนใหม่ (100 คะแนน) ──

    const VEL_STAGES = [['date','signDate',3], ['signDate','resultDate',3], ['resultDate','releaseDate',1]];

    function diligenceScore(updateCount, isRJ) {

    function _ensureDilEntry(m, name) {

    // ── Helpers สำหรับ Velocity ──
    // parse "d/m/yy" → Date object (รองรับ พ.ศ. → ค.ศ.)
    function _parseDmy(ds) {
      if (!ds || ds === '-') return null;
      // Excel serial
      if (/^\d{4,5}$/.test(ds)) {
        const serial = parseInt(ds, 10);
        if (serial > 40000 && serial < 50000) {   // ช่วงสมเหตุสมผล ~2009-2036 (กันเลขมั่ว)
          // Excel epoch = 1899-12-30
          return new Date(Date.UTC(1899, 11, 30) + serial * 86400000);
        }
        return null;
      }
      const p = ds.split('/');
      if (p.length < 3) return null;
      let d = parseInt(p[0], 10), mo = parseInt(p[1], 10), y = parseInt(p[2], 10);
      if (isNaN(d) || isNaN(mo) || isNaN(y)) return null;
      if (y < 100) y += (y > 50 ? 2500 : 2000);  // >50 = พ.ศ. 2 หลัก (69→2569), ≤50 = ค.ศ. (26)
      if (y > 2500) y -= 543;       // 2569 → 2026
      return new Date(y, mo - 1, d);
    }
    // คืนจำนวนวันระหว่าง 2 dates (a → b) ; null ถ้า parse ไม่ได้
    function _daysBetween(a, b) {
      const da = _parseDmy(a), db = _parseDmy(b);
      if (!da || !db) return null;
      return Math.round((db - da) / 86400000);
    }

    function _dateOnly(s) {

    // คะแนนความเร็ว 1 ช่วง: ทันกำหนด=1, เกินลดเชิงเส้นถึง 0 ที่ 3× กำหนด, วันว่าง/parse ไม่ได้=0
    function _stageScore(dFrom, dTo, deadline) {
      const days = _daysBetween(dFrom, dTo);
      if (days === null) return 0;
      if (days <= deadline) return 1;
      return Math.max(0, 1 - (days - deadline) / (2 * deadline));
    }

    function buildDilMap() {
      const m = {};
      // ส่วนที่ 1: คะแนนจากการอัพเดท (follow cases) — RJ ได้ครึ่งของ Normal
      // filter ตามเดือนที่เลือก (dfMonth) ผ่าน ir(l.dateIn)
      (FD.followCases||[]).forEach(l => {
        if (!ir(l.dateIn)) return;
        const e = _ensureDilEntry(m, l.seller);
        const isRJ = RJ_TYPES_SET.has(l.leadType);
        e.tot += l.updateCount;
        e.capUpd += Math.min(l.updateCount || 0, 4);   // ติดตาม: cap 4/เคส
        if (isRJ) { e.cntRJ++; e.totRJ += l.updateCount; }
        else      { e.cntNormal++; e.totNormal += l.updateCount; }
        e.cnt++;
        if(l.updateCount>=3) e.high++;
        const sc = diligenceScore(l.updateCount, isRJ);
        if (isRJ) e.scoreCallRJ += sc;
        else      e.scoreCallNormal += sc;
        e.scoreCall += sc;
        e.score += sc;
        // เก็บ distribution ตามจำนวนครั้งที่โทร (สำหรับ breakdown ใน modal)
        const uc = l.updateCount || 0;
        if (!e.callBuckets[uc]) e.callBuckets[uc] = {nNormal:0, nRJ:0, score:0};
        const bk = e.callBuckets[uc];
        if (isRJ) bk.nRJ++; else bk.nNormal++;
        bk.score += sc;
      });
      // ส่วนที่ 2: คะแนนจากการจอง + ปล่อย
      // ใช้ ms.sellers[name].booking + .done จาก backend monthlySummary
      // เพื่อให้ตัวเลขตรงกับ "สรุปรายเซลล์" ตาราง (single source of truth)
      const monthlySrc = buildRangeMs();   // ${ic('lucide:calendar',16)} คะแนนตามช่วงวันที่ที่เลือก
      const sellersList = FD.sellers || D.sellers || [];
      sellersList.forEach(s => {
        const sd = (monthlySrc.sellers && monthlySrc.sellers[s.name]) || {};
        const jongs = sd.booking || 0;
        const dones = sd.done || 0;
        const leads = sd.lead || 0;
        const leadsNormal = sd.leadNormal || 0;   // Lead ปกติ (ไม่รวม RJ) — ใช้คิด Conv
        const bans  = sd.bans || 0;
        // สร้าง entry ให้ "ทุกเซลล์" — คะแนนแบนเริ่ม 10 เสมอ (ไม่งั้นเซลล์ที่ไม่มี activity total=0 ขัดกับแบน=10)
        const e = _ensureDilEntry(m, s.name);
        e.jongs = jongs; e.dones = dones; e.leads = leads; e.leadsNormal = leadsNormal; e.bans = bans;
        e.scoreJong = jongs * SCORE_JONG;   // เก็บไว้ใช้ใน velocity/breakdown เดิม
        e.scoreDone = dones * SCORE_DONE;
      });
      // ส่วนที่ 3: Pipeline Velocity — แยก 2 phase
      //   Phase 1: รับหลีด (leadDate) → จอง (date)
      //   Phase 2: จอง (date) → ปล่อย (releaseDate, status=ปล่อย เท่านั้น)
      //   ตัด walk-in (จองหน้าร้าน) — ไม่มี lead flow จริง → inflate velocity
      (FD.bookingCases || []).forEach(b => {
        if (_isWalkIn(b.channel)) return;  // ข้าม walk-in
        // Phase 1: leadDate → date (วันจอง)
        if (b.leadDate && b.date && b.leadDate !== '-' && b.date !== '-') {
          if (ir(b.date)) {
            const d1 = _daysBetween(b.leadDate, b.date);
            if (d1 !== null && d1 >= 0 && d1 <= 365) {
              const e1 = _ensureDilEntry(m, b.seller);
              e1.velP1Sum += d1;
              e1.velP1Count++;
            }
          }
        }
        // Phase 2: date (จอง) → releaseDate (ปล่อย) — เฉพาะ status=ปล่อย
        if (b.status === 'ปล่อย') {
          const startDate = b.date;
          const endDate = b.releaseDate && b.releaseDate !== '-' ? b.releaseDate : null;
          if (startDate && endDate && ir(endDate)) {
            const d2 = _daysBetween(startDate, endDate);
            if (d2 !== null && d2 >= 0 && d2 <= 365) {
              const e2 = _ensureDilEntry(m, b.seller);
              e2.velP2Sum += d2;
              e2.velP2Count++;
            }
          }
        }
      });
      // ส่วนที่ 4: ความเร็ว 3 ช่วง (เต็ม 10) — เคสปล่อยในช่วงที่เลือก (รวม walk-in)
      //   จอง→เซ็น ≤3วัน · เซ็น→ผล ≤3วัน · ผล→ปล่อย ≤1วัน · เฉลี่ย 3 ช่วง → [0,1]
      //   วันที่ช่วงไหนว่าง/ไม่กรอก = 0 ช่วงนั้น (จูงใจให้กรอกวันเซ็น/วันผล)
      (FD.bookingCases || []).forEach(b => {
        if (b.status !== 'ปล่อย') return;
        const endDate = b.releaseDate && b.releaseDate !== '-' ? b.releaseDate : b.date;
        if (!endDate || !ir(endDate)) return;
        const frac = (_stageScore(b.date, b.signDate, 3)
                    + _stageScore(b.signDate, b.resultDate, 3)
                    + _stageScore(b.resultDate, b.releaseDate, 1)) / 3;
        const e = _ensureDilEntry(m, b.seller);
        e.velSum += frac;
        e.velCnt++;
      });
      // ── สูตรคะแนนใหม่ (100 คะแนน) — แทนสูตรเดิม ──
      //   จบ30 (ปล่อย/15) · จอง10 (จอง/30) · Conv20 (ปล่อย÷lead vs 5%) · ความเร็ว10 · ติดตาม20 · โดนแบน10
      Object.values(m).forEach(e => {
        const sDone = Math.min((e.dones || 0) / DONE_TGT, 1) * 30;
        const sJong = Math.min((e.jongs || 0) / JONG_TGT, 1) * 10;
        const _ln = e.leadsNormal || 0; const conv = _ln > 0 ? (e.dones || 0) / _ln * 100 : 0;   // Conv = ปล่อย ÷ Lead ปกติ (ไม่รวม RJ)
        const sConv = Math.min(conv / CONV_TGT, 1) * 20;
        const vel = (e.velCnt || 0) > 0 ? (e.velSum / e.velCnt) : 0;
        const sVel = vel * 10;
        const completion = (e.cnt || 0) > 0 ? (e.capUpd || 0) / (4 * e.cnt) : 0;
        const sFollow = completion * 20;
        const sBan = Math.max(0, 10 - (e.bans || 0));
        e.conv = Math.round(conv * 10) / 10;
        e.completion = Math.round(completion * 100);
        e.velPct = Math.round(vel * 100);
        e.sDone = Math.round(sDone * 10) / 10;
        e.sJong = Math.round(sJong * 10) / 10;
        e.sConv = Math.round(sConv * 10) / 10;
        e.sVel = Math.round(sVel * 10) / 10;
        e.sFollow = Math.round(sFollow * 10) / 10;
        e.sBan = sBan;
        e.score = Math.round((sDone + sJong + sConv + sVel + sFollow + sBan) * 10) / 10;  // 0-100
      });
      return m;
    }

    // ── Walk-in detector: จองหน้าร้าน / walk-in / WI ──
    function _isWalkIn(channel) {
      if (!channel) return false;
      const c = String(channel).toLowerCase();
      return c.includes('หน้าร้าน') || c.includes('walk') || c === 'wi';
    }

    // ── หาเคสที่ contribute ใน velocity (สำหรับ modal) ──
    function _getVelocityCases(sellerName, phase) {
      const out = [];
      (FD.bookingCases || []).forEach(b => {
        if (b.seller !== sellerName) return;
        if (_isWalkIn(b.channel)) return;
        if (phase === 1) {
          if (!b.leadDate || !b.date || b.leadDate === '-' || b.date === '-') return;
          if (!ir(b.date)) return;
          const days = _daysBetween(b.leadDate, b.date);
          if (days === null || days < 0 || days > 365) return;
          out.push({ ...b, _days: days, _start: b.leadDate, _end: b.date, _phase: 1 });
        } else {
          if (b.status !== 'ปล่อย') return;
          const endDate = b.releaseDate && b.releaseDate !== '-' ? b.releaseDate : null;
          if (!b.date || !endDate) return;
          if (!ir(endDate)) return;
          const days = _daysBetween(b.date, endDate);
          if (days === null || days < 0 || days > 365) return;
          out.push({ ...b, _days: days, _start: b.date, _end: endDate, _phase: 2 });
        }
      });
      out.sort((a, b) => b._days - a._days);   // ช้าสุดก่อน
      return out;
    }

    // ── Modal: แสดงวิธีคำนวณ Score ของเซลล์คนเดียว ──
    function showSellerScoreBreakdown(name) {
      const old = document.getElementById('seller-score-overlay');
      if (old) old.remove();
      const m = buildDilMap();  // ใช้ map ตัวเดียวกับตาราง — มี date filter อยู่แล้ว
      const d = m[name] || _ensureDilEntry({}, name);
      const fmtNum = (n) => Number(n||0).toLocaleString();
      // แสดงช่วงเวลาที่กรอง — ตามตัวกรองวันที่ (dfFrom/dfTo)
      const periodLabel = rangeLabelTH();
      const overlay = document.createElement('div');
      overlay.id = 'seller-score-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1100;display:flex;align-items:center;justify-content:center;padding:16px';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

      // Velocity 2 phases
      const v1Avg = d.velP1Count > 0 ? Math.round((d.velP1Sum/d.velP1Count)*10)/10 : null;
      const v2Avg = d.velP2Count > 0 ? Math.round((d.velP2Sum/d.velP2Count)*10)/10 : null;

      // ── Breakdown ตามจำนวนครั้งที่โทร — สร้างแถวเรียงจากน้อยไปมาก ──
      const _bk = d.callBuckets || {};
      const _bkKeys = Object.keys(_bk).map(Number).sort((a,b)=>a-b);
      const _callRows = _bkKeys.map(uc => {

      if (typeof render === 'function') render();  // refresh ไอคอนปุ่ม + สีกราฟ

    // ── ${ic('lucide:sparkles',16)} พยากรณ์ยอดขาย (linear regression จากยอดจริงรายเดือน) ──
    function monthForecast(vals12) {
      // vals12: index 0..11 = Jan..Dec — ใช้เฉพาะเดือนที่ผ่านมาจริง (1..เดือนปัจจุบัน) กันค่าหลงในอนาคตถ่วง
      const _cur = new Date().getMonth() + 1;
      const pts = [];
      for (let m=1;m<=Math.min(12,_cur);m++){ if (vals12[m-1] > 0) pts.push([m, vals12[m-1]]); }
      if (pts.length < 2) return null;
      const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]), n=xs.length;
      const sx=xs.reduce((a,b)=>a+b,0), sy=ys.reduce((a,b)=>a+b,0);
      const sxx=xs.reduce((a,b)=>a+b*b,0), sxy=xs.reduce((a,_,i)=>a+xs[i]*ys[i],0);
      const denom = n*sxx - sx*sx;
      const slope = denom ? (n*sxy - sx*sy)/denom : 0;
      const intercept = (sy - slope*sx)/n;
      const lastM = pts[pts.length-1][0];
      const arr = new Array(12).fill(null);
      arr[lastM-1] = vals12[lastM-1];  // จุดเชื่อมกับเส้นจริง
      for (let k=1;k<=3 && lastM+k<=12;k++) arr[lastM-1+k] = Math.max(0, Math.round(slope*(lastM+k)+intercept));
      return { arr, slope, lastM, next: Math.max(0, Math.round(slope*(lastM+1)+intercept)) };
    }
    function _monthlyVals(key) {
      const ms = D.monthlySummary || {}; const out = [];
      for (let m=1;m<=12;m++){ const x = ms[m]||ms[String(m)]||{}; out[m-1] = x[key]||0; }
      return out;
    }

      const dir = fd.slope > base*0.04 ? {t:'↗ กำลังขึ้น',c:'var(--green)'} : fd.slope < -base*0.04 ? {t:'↘ กำลังลง',c:'var(--red)'} : {t:'→ ทรงตัว',c:'var(--t3)'};
      return `

    // เส้นแนวโน้มจากยอดจริง (regression เฉพาะเดือนที่มีข้อมูล — ไม่ต่อไปอนาคต)
    function trendLineActual(vals12) {
      const _cur = new Date().getMonth() + 1;
      const pts=[]; for(let m=1;m<=Math.min(12,_cur);m++){ if(vals12[m-1]>0) pts.push([m,vals12[m-1]]); }
      if(pts.length<2) return null;
      const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),n=xs.length;
      const sx=xs.reduce((a,b)=>a+b,0),sy=ys.reduce((a,b)=>a+b,0);
      const sxx=xs.reduce((a,b)=>a+b*b,0),sxy=xs.reduce((a,_,i)=>a+xs[i]*ys[i],0);
      const d=n*sxx-sx*sx; const slope=d?(n*sxy-sx*sy)/d:0; const ic=(sy-slope*sx)/n;
      const arr=new Array(12).fill(null);
      for(let m=pts[0][0];m<=pts[pts.length-1][0];m++) arr[m-1]=Math.max(0, Math.round((slope*m+ic)*10)/10);
      return arr;
    }

      const summary = 'ยอดขายรายเดือนปีนี้:\n' + lines.join('\n');
      const btn=document.getElementById('forecast-ai-btn'), box=document.getElementById('forecast-ai-result');
      btn.disabled=true; btn.innerHTML='<span class="spin" style="width:13px;height:13px;border-width:2px;display:inline-block;vertical-align:middle"></span> AI กำลังวิเคราะห์...';
      fetch('/api/insights/forecast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({summary})})
        .then(r=>r.json()).then(j=>{

      // ── ตารางคะแนน 100 (สูตรใหม่: จบ30·จอง10·Conv20·ความเร็ว10·ติดตาม20·แบน10) ──
      // ใช้ค่าจาก dilMap (buildDilMap) → sync กับ modal คะแนน + Python export
      const scoreEntries = sellers

            dones: e.dones||0, jongs: e.jongs||0, leads: e.leads||0, bans: e.bans||0,

      scoreEntries.sort((a,b) => b.total - a.total);

      const _medals = ['🥇','🥈','🥉'];
      const _f1 = (n) => (Math.round(n*10)/10).toFixed(1);
      html += `<div class="card">

      scoreEntries.forEach((e, i) => {

      });
      // ── แถวรวมท้ายตาราง: ปล่อย/จอง = ผลรวมทุกเซลล์ · คอลัมน์คะแนน = ค่าเฉลี่ย ──
      const _scN = scoreEntries.length || 1;
      const _scSum = (k) => scoreEntries.reduce((a,e)=>a+(Number(e[k])||0),0);
      const _scAvg = (k) => _scSum(k)/_scN;
      const _tLead = _scSum('leads');

      html += `<div class="srow" style="grid-template-columns:.4fr 1.1fr .55fr .55fr .6fr .7fr .7fr .75fr .8fr .85fr .7fr .8fr;font-size:11.5px;background:var(--bg2);border-top:1.5px solid var(--bd2);font-weight:700;cursor:default">
        <span></span>

        <span style="text-align:right;font-size:13px">${_f1(_scAvg('total'))}</span>
      </div>`;
      html += `</div></div>`;
      html += `<div style="margin-top:8px;font-size:10px;color:var(--t3)">น้ำหนัก: จบ 30 · จอง 10 · Conv 20 · สถานะ 10 · ติดตาม 20 · โดนแบน 10 = 100 · ข้อมูลแบนจาก "รายงานแบน" · กดแถวดูรายละเอียด · <b>แถวรวม</b>: ปล่อย/จอง = ผลรวม · คอลัมน์คะแนน = ค่าเฉลี่ย</div>`;
      html += `</div>`;

      // ════════════════════════════════════════════════════════════════
      // ${ic('lucide:trending-up',16)} จัดสรร Lead ตามคะแนน — ใส่ lead/วัน → กระจายตามคะแนน 100 แต้ม
      // ════════════════════════════════════════════════════════════════
      // วิธี: แต่ละคนได้ = (คะแนนตัวเอง ÷ คะแนนรวมทีม) × lead/วัน
      //   • Floor 1 lead/วัน (ทุกคนได้อย่างน้อย 1 — ให้โอกาส)
      //   • ปัดเศษด้วย Largest Remainder → รวมได้ตรง lead/วัน เป๊ะ
      // ════════════════════════════════════════════════════════════════
      // จัดสรร lead เฉพาะเซลล์ที่มี activity จริง (ปล่อย/จอง/เคสติดตาม) — ไม่นับคนที่ได้แค่คะแนนแบนเริ่มต้น 10
      const allocPool = scoreEntries.filter(e => (e.dones + e.jongs + e.cnt) > 0);
      const _sumScore = allocPool.reduce((a, e) => a + e.total, 0) || 1;

      // ── คำนวณ lead/วัน อัตโนมัติจากสถิติ ──
      // ใช้ leadDist (lead แจกจ่ายได้ = ไม่ใช่ไลฟ์สด + ไม่ใช่ RJ) ÷ จำนวนวันที่ผ่าน
      // → เฉพาะการจัดสรรอนาคต ไม่กระทบ KPI/เคส/RJ ที่นับเต็ม
      const _totalLeadsMonth = scoreEntries.reduce((a, e) => a + (e.leadDist || 0), 0);
      // ${ic('lucide:calendar',16)} จำนวนวันในช่วงที่กรอง (leadDist ก็เป็น range แล้ว → pace ตรงกัน)
      const _daysElapsed = Math.max(1, rangeDays().length);
      const _avgRaw = _totalLeadsMonth / _daysElapsed;     // เช่น 59.65
      const _autoPerDay = Math.max(1, Math.round(_avgRaw)); // ตีเป็น 60
      // ค่าที่ใช้จริง: ถ้าผู้ใช้ตั้งเอง (leadPerDay != null) ใช้ค่านั้น, ไม่งั้น auto
      const effPerDay = leadPerDay !== null ? leadPerDay : _autoPerDay;
      const isAuto = leadPerDay === null;
      const _dailyEqual = allocPool.length > 0 ? (effPerDay / allocPool.length) : 0;

      // Largest Remainder allocation (floor 1)
      const _withRaw = allocPool.map(e => {
        const raw = (e.total / _sumScore) * effPerDay;
        return { ...e, raw, base: Math.max(1, Math.floor(raw)), frac: raw - Math.floor(raw) };
      });
      let _used = _withRaw.reduce((a, e) => a + e.base, 0);
      let _remain = effPerDay - _used;   // อาจติดลบถ้า floor 1 ดันยอดเกิน
      if (_remain > 0) {
        [..._withRaw].sort((a,b) => b.frac - a.frac).slice(0, _remain).forEach(e => e.base += 1);
      } else if (_remain < 0) {
        const _cut = [..._withRaw].filter(e => e.base > 1).sort((a,b) => a.total - b.total);
        for (let i = 0; i < _cut.length && _remain < 0; i++) { _cut[i].base -= 1; _remain++; }
      }
      const allocMap = {};
      _withRaw.forEach(e => { allocMap[e.n] = e.base; });
      const perfEntries = [...allocPool].sort((a,b) => b.total - a.total);

          </div>
        </div>

        <div class="shdr" style="grid-template-columns:.5fr 1.4fr .9fr .9fr 1.1fr;font-size:10.5px">
          <span>อันดับ</span>
          <span>เซลล์</span>
          <span style="text-align:right">คะแนน/100</span>
          <span style="text-align:right">สัดส่วน</span>
          <span style="text-align:right;color:var(--purple);font-weight:700">Lead/วัน</span>

      if (perfEntries.length === 0) {
        html += `<div style="padding:18px;text-align:center;color:var(--t3);font-size:12px">ยังไม่มีข้อมูลเซลล์ในช่วงที่เลือก</div>`;
      } else {
        const _medals2 = ['🥇','🥈','🥉'];
        perfEntries.forEach((p, i) => {

          // เทียบกับแบ่งเท่ากัน — มากกว่า=เขียว, น้อยกว่า=แดง
          const diffColor = alloc > _dailyEqual + 0.5 ? 'var(--green)' : alloc < _dailyEqual - 0.5 ? 'var(--red)' : 'var(--t2)';
          html += `<div class="srow" style="grid-template-columns:.5fr 1.4fr .9fr .9fr 1.1fr;font-size:12px" onclick="showSellerScoreBreakdown('${h(p.n)}')" title="กดดูรายละเอียด">
            <span style="${isTop3?'font-size:14px':'color:var(--t3)'}">${rank}</span>

        });
        html += `<div style="margin-top:10px;padding:9px 11px;background:var(--blue-bg);border-radius:8px;font-size:11px;color:var(--t2);line-height:1.55">
          <b style="color:var(--blue)">วิธีอ่าน:</b> lead/วัน คิดจากสถิติ (เฉลี่ยเดือนนี้) → จัดให้ตามคะแนน · <span style="color:var(--green)">สีเขียว</span> = ได้มากกว่าเฉลี่ย (เก่ง) · <span style="color:var(--red)">สีแดง</span> = ได้น้อยกว่า · ทุกคนได้ขั้นต่ำ 1 · รวมตรง ${effPerDay} เป๊ะ

      html += `</div>`;

      // Seller table — เพิ่มมูลค่าดีล (฿ ปล่อย)
      // _sval: ถ้าเลือกเดือน → ใช้ค่ารายเดือน (0 ถ้าเซลล์ไม่มีในเดือนนั้น)
      //         ถ้าเลือกทั้งปี → ใช้ค่ารายปี
      // ADMIN (เทเลเซลล์) + เซลล์นอก config ไม่อยู่ใน dailyBySeller → ค่าช่วงดึงจาก monthlySummary รวมเดือนในช่วง
      const _rMonths = [];
      if (dfFrom && dfTo) {
        let _dd = new Date(dfFrom); _dd = new Date(_dd.getFullYear(), _dd.getMonth(), 1);
        const _de = new Date(dfTo);
        while (_dd <= _de) { _rMonths.push(_dd.getMonth()+1); _dd.setMonth(_dd.getMonth()+1); }
      }
      const _msSum = (name, key) => { let t=0; _rMonths.forEach(m => { const sm=((D.monthlySummary&&D.monthlySummary[m]&&D.monthlySummary[m].sellers)||{})[name]; if(sm && sm[key]!=null) t+=Number(sm[key])||0; }); return t; };
      const _sval = (s, key) => {
        // ${ic('lucide:calendar',16)} ใช้ค่าตามช่วงวันที่ที่กรองเสมอ (ms = buildRangeMs()) — ตารางรายเซลล์เปลี่ยนตามวันที่
        // ⚠️ ADMIN/เซลล์นอก config ไม่มีใน dailyBySeller → buildRangeMs ใส่ entry เป็น 0 ทั้งหมด (ตามวน D.sellers ครบ)

    function computeAdminAlerts() {
      const BAD_MIN = 2020, BAD_MAX = 2035;
      const DASH_YR = (D.meta && D.meta.year) || new Date().getFullYear();
      const _yr = (s) => { const d = _parseDmy(s); return d ? d.getFullYear() : null; };

      const _inRangeStr = (ds) => {
        const d = _parseDmy(ds);
        if (!d) return false;
        const y = d.getFullYear();
        const t = (y >= BAD_MIN && y <= BAD_MAX) ? _ymd(d) : _ymd(new Date(DASH_YR, d.getMonth(), d.getDate()));
        return t >= dfFrom && t <= dfTo;
      };
      const fields = [['วันจอง','date'], ['วันเซ็น','signDate'], ['วันผลออก','resultDate'], ['วันปล่อย','releaseDate']];
      const blankRel = [], badYr = [];
      const _ALERT_START = new Date(2026, 4, 1).getTime();   // เริ่มแจ้งเตือน "ปล่อยไม่ลงวันปล่อย" ตั้งแต่ พ.ค.69 (เริ่มใช้ระบบ) — ก่อนหน้าเป็น backlog เก่า
      (D.bookingCases || []).forEach((b, idx) => {
        // เคสปล่อยไม่ลงวันปล่อย: เช็คช่องหลัก (releaseDatePrimary, fallback releaseDate ช่วง deploy)
        // ★ ไม่กรองช่วง (catch-all) — เป็น cleanup ต้องเห็นครบ · แต่เริ่มนับตั้งแต่ พ.ค.69 (_ALERT_START) ตัด backlog เก่าออก
        const _rel = ('releaseDatePrimary' in b) ? b.releaseDatePrimary : b.releaseDate;
        if (b.status === 'ปล่อย' && (!_rel || _rel === '' || _rel === '-')) {
          const _bd = _parseDmy(b.date);
          if (!_bd || _bd.getTime() >= _ALERT_START) blankRel.push({b, idx});
        }
        // วันที่ปีผิด: กรองตามวันจอง
        if (!_inRangeStr(b.date)) return;
        const errs = [];
        fields.forEach(([lbl, k]) => { const y = _yr(b[k]); if (y !== null && (y < BAD_MIN || y > BAD_MAX)) errs.push(lbl+'='+b[k]); });
        if (errs.length) badYr.push({b, idx, errs});
      });
      const _k = (s) => { const d = _parseDmy(s); return d ? _ymd(d) : '9999-99-99'; };
      blankRel.sort((a, b) => _k(a.b.date) < _k(b.b.date) ? -1 : 1);
      // เซลล์ใหม่/orphan ที่มีกิจกรรมในช่วงที่กรอง
      const _act = rangeActiveSellers();

      return {blankRel, badYr, newSellers};
    }

    function renderDataQualityPanel() {
      if (!canViewAll) return '';
      const BAD_MIN = 2020, BAD_MAX = 2035;
      const DASH_YR = (D.meta && D.meta.year) || new Date().getFullYear();
      const _yr = (s) => { const d = _parseDmy(s); return d ? d.getFullYear() : null; };
      const _bad = (y) => y !== null && (y < BAD_MIN || y > BAD_MAX);
      // กรองตามช่วงด้วยวัน/เดือนของวันจอง (ปีพัง → ใช้ปีของ dashboard)
      const _inRange = (b) => {
        const d = _parseDmy(b.date);
        if (!d) return false;
        const y = d.getFullYear();
        const t = (y >= BAD_MIN && y <= BAD_MAX) ? _ymd(d) : _ymd(new Date(DASH_YR, d.getMonth(), d.getDate()));
        return t >= dfFrom && t <= dfTo;
      };
      const allFields = [['วันจอง','date'], ['วันเซ็น','signDate'], ['วันผลออก','resultDate'], ['วันปล่อย','releaseDate']];
      const blankRel = [], badYr = [];
      (D.bookingCases || []).forEach((b, idx) => {
        if (!_inRange(b)) return;   // กรองตามวัน/เดือนของวันจอง
        const errs = [];
        allFields.forEach(([lbl, k]) => { if (_bad(_yr(b[k]))) errs.push(lbl+'='+b[k]); });
        if (errs.length) badYr.push({b, idx, errs});
        const _relP = ('releaseDatePrimary' in b) ? b.releaseDatePrimary : b.releaseDate;   // ช่องวันปล่อยจริง (คอลัมน์หลัก)
        if (b.status === 'ปล่อย' && (!_relP || _relP === '' || _relP === '-')) blankRel.push({b, idx});
      });
      const total = blankRel.length + badYr.length;
      const _k = (s) => { const d = _parseDmy(s); return d ? _ymd(d) : '9999-99-99'; };
      blankRel.sort((a,b) => _k(a.b.date) < _k(b.b.date) ? -1 : 1);

      const _list = (arr, cols, cellsFn, emptyMsg) => {
        if (!arr.length) return `<div style="font-size:11px;color:var(--green);padding:2px 0 4px">${ic('lucide:circle-check',16)} ${emptyMsg}</div>`;

        return s;
      };

      let body = '';

      body += `<div style="font-size:12px;font-weight:700;color:var(--amber);margin:2px 0 6px">${ic('lucide:calendar',16)} วันปล่อยว่าง · ${blankRel.length} เคส <span style="font-weight:400;color:var(--t3);font-size:10px">(สถานะ "ปล่อย" แต่ยังไม่กรอกวันปล่อย → เดาเดือนจากวันจอง · กระทบคะแนนสถานะ)</span></div>`;
      body += _list(blankRel, '.9fr 1.4fr .8fr 1.1fr',
        (o) => o === 'hdr'
          ? '<span>เซลล์</span><span>ลูกค้า</span><span>วันจอง</span><span>รถ</span>'
          : `<span style="font-weight:600">${h(o.b.seller||'-')}</span><span style="color:var(--t2)">${h((o.b.customer||'-').slice(0,22))}</span><span style="color:var(--amber);font-weight:600">${h(o.b.date||'-')}</span><span style="color:var(--t3);font-size:10px">${h((o.b.car||'-').slice(0,18))}</span>`,
        'ไม่มีในช่วงนี้');
      // กลุ่ม 2 — ปีผิด (กรองตามวัน/เดือนของวันจอง)
      body += `<div style="font-size:12px;font-weight:700;color:var(--red);margin:14px 0 6px">${ic('lucide:triangle-alert',16)} ปีผิด (1969/นอกช่วง 2020–2035) · ${badYr.length} เคส <span style="font-weight:400;color:var(--t3);font-size:10px">(กรองตามวัน/เดือนของวันจอง — ปีจองพิมพ์ผิดก็ดูจากวัน/เดือนแทน)</span></div>`;
      body += _list(badYr, '.9fr 1.3fr 1.8fr',
        (o) => o === 'hdr'
          ? '<span>เซลล์</span><span>ลูกค้า</span><span>ช่องที่ผิด</span>'
          : `<span style="font-weight:600">${h(o.b.seller||'-')}</span><span style="color:var(--t2)">${h((o.b.customer||'-').slice(0,20))}</span><span style="color:var(--red);font-size:10.5px">${h(o.errs.join(' · '))}</span>`,
        'ไม่มีในช่วงนี้');

      return `<details class="adv-section" ${total>0?'open':''}>
        <summary>${ic('lucide:brush',16)} ข้อมูลต้องเติม/แก้ ${total>0?`<span style="background:var(--red);color:#fff;font-size:10px;padding:1px 7px;border-radius:10px;margin-left:4px">${total}</span>`:'<span style="color:var(--green);font-size:11px;margin-left:4px">✅</span>'} <span style="font-size:11px;font-weight:400;color:var(--t3);margin-left:8px">— เคสข้อมูลวันที่ไม่ครบ/ผิด · กรองตามวัน/เดือนของวันจอง</span></summary>
        <div class="adv-body">${body}</div>

          html += `<span style="color:var(--t3);font-size:11px">${rank}</span>`;
          html += `<span style="font-weight:500;color:var(--blue)">${ic('lucide:car-front',16)} ${h(e.car).slice(0,60)}</span>`;
          html += `<span style="text-align:right;font-weight:600;color:var(--blue)">${e.cnt}</span>`;
          html += `<span style="text-align:right;color:var(--t3);font-size:11px">${pctVal}%</span>`;

    // ── Released Cars list (admin/executive only) ──
    function renderReleasedCarsTable() {
      // ใส่ index จาก D.bookingCases เพื่อใช้เปิด detail modal
      const indexed = (D.bookingCases || []).map((b, i) => ({...b, _idx: i}));
      // กรองตาม status (default = 'ปล่อย' / all = ทุกสถานะ)
      let base = releasedStatus === 'all' ? indexed : indexed.filter(b => b.status === releasedStatus);
      // ${ic('lucide:calendar',16)} กรองตามช่วงวันที่ (ใช้ releaseDate, fallback date)
      let cars = base.filter(b => ir(b.releaseDate || b.date || ''));
      // กรอง seller dropdown
      if (releasedSeller !== 'all') {
        cars = cars.filter(b => b.seller === releasedSeller);
      }
      // เรียง
      const parseDmy = (s) => {
        if (!s) return 0;
        const p = String(s).split('/');
        if (p.length < 3) return 0;
        let y = parseInt(p[2]);
        if (y < 100) y += (y > 50 ? 2500 : 2000);
        if (y > 2500) y -= 543;
        return y*10000 + (parseInt(p[1])||0)*100 + (parseInt(p[0])||0);
      };
      const ageDays = (dateStr) => {
        const p = String(dateStr||'').split('/');
        if (p.length < 3) return null;
        let y = parseInt(p[2]); if (y<100) y+=2000; if (y>2500) y-=543;
        const d = new Date(y, (parseInt(p[1])||1)-1, parseInt(p[0])||1);
        return isNaN(d) ? null : Math.floor((Date.now() - d.getTime())/86400000);
      };
      if (releasedSort === 'price') cars.sort((a,b) => (b.price||0) - (a.price||0));
      else if (releasedSort === 'seller') cars.sort((a,b) => (a.seller||'').localeCompare(b.seller||''));
      else if (releasedSort === 'age') cars.sort((a,b) => parseDmy(a.releaseDate||a.date) - parseDmy(b.releaseDate||b.date));
      else cars.sort((a,b) => parseDmy(b.releaseDate||b.date) - parseDmy(a.releaseDate||a.date));

      const totalPrice = cars.reduce((a,b)=>a+(b.price||0),0);
      const sellerNames = Array.from(new Set(base.map(b=>b.seller).filter(Boolean))).sort();
      const periodLbl = '📅 '+rangeLabelTH();
      const statusLbl = releasedStatus === 'all' ? 'ทุกสถานะ' : releasedStatus;
      const titleEmoji = releasedStatus === 'ปล่อย' ? '🏁' : releasedStatus === 'all' ? '📋' : '🟡';

      // Pagination
      const totalPages = Math.max(1, Math.ceil(cars.length / RELEASED_PAGE_SIZE));
      if (releasedPage > totalPages) releasedPage = totalPages;
      if (releasedPage < 1) releasedPage = 1;
      const startIdx = (releasedPage - 1) * RELEASED_PAGE_SIZE;
      const pageCars = cars.slice(startIdx, startIdx + RELEASED_PAGE_SIZE);

      let html = `<div class="card">`;
      html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px">`;
      html += `<div class="card-title" style="margin:0">${titleEmoji} เคสจอง · <span style="color:var(--blue)">${h(statusLbl)}</span> <span style="font-size:11px;font-weight:400;color:var(--t3)">(${periodLbl} · ${cars.length} คัน${releasedStatus==='ปล่อย'?` · ${fmtBaht(totalPrice)}`:''})</span></div>`;
      html += `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">`;
      // Status filter — ปล่อย default + ทุกสถานะ + แต่ละ status
      const statuses = ['ปล่อย','all','จอง','รอเซ็นต์','รอผล','รอปล่อย','รีเจ็ก'];
      html += `<select onchange="releasedStatus=this.value;releasedPage=1;render()" style="font-size:11px">`;
      statuses.forEach(st => {
        const lbl = st === 'all' ? 'ทุกสถานะ' : st;
        html += `<option value="${st}" ${releasedStatus===st?'selected':''}>${lbl}</option>`;
      });
      html += `</select>`;
      html += `<select onchange="releasedSeller=this.value;releasedPage=1;render()" style="font-size:11px"><option value="all" ${releasedSeller==='all'?'selected':''}>ทุกเซลล์</option>`;
      sellerNames.forEach(n => { html += `<option value="${h(n)}" ${releasedSeller===n?'selected':''}>${h(sname(n))}</option>`; });
      html += `</select>`;
      html += `<select onchange="releasedSort=this.value;render()" style="font-size:11px"><option value="date" ${releasedSort==='date'?'selected':''}>ล่าสุดก่อน</option><option value="age" ${releasedSort==='age'?'selected':''}>เก่าสุดก่อน</option><option value="price" ${releasedSort==='price'?'selected':''}>ราคามากสุด</option><option value="seller" ${releasedSort==='seller'?'selected':''}>เซลล์</option></select>`;
      html += `</div></div>`;

      if (cars.length === 0) {
        html += `<div style="text-align:center;color:var(--t3);padding:18px;font-size:12px">ไม่มีเคสในช่วงนี้</div>`;
      } else {
        html += `<div class="shdr" style="grid-template-columns:.85fr .7fr .8fr 2fr .85fr .9fr"><span>วันที่</span><span>เก่า</span><span>เซลล์</span><span>รถ</span><span>ทะเบียน</span><span style="text-align:right">ราคา</span></div>`;
        html += `<div>`;
        pageCars.forEach(b => {
          const carLbl = (b.car||'-') + (b.year ? ` (${b.year})` : '');
          const dispDate = b.releaseDate || b.date || '-';
          const ageN = ageDays(dispDate);
          const ageBadge = ageN == null ? '-' : (ageN > 90 ? `<span style="color:var(--red);font-weight:600">${ageN}d</span>` : ageN > 30 ? `<span style="color:var(--amber);font-weight:600">${ageN}d</span>` : `<span style="color:var(--green-mid);font-weight:600">${ageN}d</span>`);
          const teamCol = C.TEAM_COLORS[(D.sellers||[]).find(s=>s.name===b.seller)?.team]||'var(--t1)';
          const stColor = (C.STATUS_COLOR||{})[b.status] || '#888';
          html += `<div class="srow" style="grid-template-columns:.85fr .7fr .8fr 2fr .85fr .9fr;cursor:pointer" onclick="openBookingDetail(${b._idx})">`;
          html += `<span style="font-size:11px;color:var(--t2)">${h(dispDate)}${releasedStatus==='all'?`<br><span style='display:inline-block;padding:1px 5px;border-radius:6px;background:${stColor};color:#fff;font-size:9px;margin-top:2px'>${h(b.status)}</span>`:''}</span>`;
          html += `<span style="font-size:11px">${ageBadge}</span>`;
          html += `<span style="font-weight:600;color:${teamCol}">${h(b.seller||'-')}</span>`;
          html += `<span style="font-size:12px">${h(carLbl).slice(0,60)}</span>`;
          html += `<span style="font-size:11px;color:var(--t3)">${h(b.plate||'-')}</span>`;
          html += `<span style="text-align:right;font-weight:600;color:${b.status==='ปล่อย'?'var(--green-mid)':'var(--t2)'}">${fmtBaht(b.price||0)}</span>`;
          html += `</div>`;
        });
        html += `</div>`;
        // Pagination controls — ไป/กลับ
        if (totalPages > 1) {
          const prevDis = releasedPage <= 1;
          const nextDis = releasedPage >= totalPages;
          html += `<div style="display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 0 4px;border-top:.5px solid var(--bd);margin-top:6px">`;
          html += `<button onclick="releasedPage=Math.max(1,releasedPage-1);render()" ${prevDis?'disabled':''} style="padding:5px 14px;border-radius:8px;border:.5px solid var(--bd2);background:${prevDis?'var(--bg2)':'var(--bg)'};color:${prevDis?'var(--t3)':'var(--t1)'};font-size:12px;cursor:${prevDis?'not-allowed':'pointer'};font-weight:600">← กลับ</button>`;
          html += `<span style="font-size:12px;color:var(--t2);font-weight:600">หน้า ${releasedPage}/${totalPages} <span style="font-size:10px;color:var(--t3);font-weight:400">· แสดง ${startIdx+1}-${Math.min(startIdx+RELEASED_PAGE_SIZE, cars.length)} จาก ${cars.length}</span></span>`;
          html += `<button onclick="releasedPage=Math.min(${totalPages},releasedPage+1);render()" ${nextDis?'disabled':''} style="padding:5px 14px;border-radius:8px;border:.5px solid var(--bd2);background:${nextDis?'var(--bg2)':'var(--bg)'};color:${nextDis?'var(--t3)':'var(--t1)'};font-size:12px;cursor:${nextDis?'not-allowed':'pointer'};font-weight:600">ไป →</button>`;
          html += `</div>`;
        }
      }
      html += `</div>`;
      return html;
    }

    // ── KPI Detail Modal — กดที่ KPI card เพื่อดู trend 12 เดือน + breakdown ──
    function openMetricDetail(metricKey) {
      const cfg = {
        'totalLeads':     {label:'Lead',         emoji:ic('lucide:inbox',18),        color:'#374151', invert:false, fmt:fmtNum},
        'totalFollow':    {label:'ติดตามอยู่',    emoji:ic('lucide:phone',18),        color:'#3b82f6', invert:true,  fmt:fmtNum},
        'totalBookings':  {label:'จองแล้ว',       emoji:ic('lucide:clipboard-list',18),color:'#10b981', invert:false, fmt:fmtNum},
        'totalDone':      {label:'ปิดได้',        emoji:ic('lucide:flag',18),         color:'#059669', invert:false, fmt:fmtNum},
        'totalDealValue': {label:'ยอดปล่อย',     emoji:ic('lucide:wallet',18),       color:'#059669', invert:false, fmt:fmtBaht},
        'leadRJ':         {label:'RJ',           emoji:ic('lucide:ban',18),          color:'#ef4444', invert:true,  fmt:fmtNum},
      }[metricKey];
      if (!cfg) return;
      // Lead = หลีดธรรมดา (ไม่รวม RJ) · RJ แยกแสดงต่างหาก ต่อท้าย · conv ใช้เฉพาะธรรมดา
      const isLead = metricKey === 'totalLeads';
      const valKey = isLead ? 'leadNormal' : metricKey;
      const old = document.getElementById('metric-detail-overlay');
      if (old) old.remove();

      const ms = D.monthlySummary || {};
      // ดึง 12 เดือนทั้งปี
      const monthData = [];
      let maxVal = 0, rjYear = 0;
      const rjByMonth = [];
      for (let m = 1; m <= 12; m++) {
        const mm = ms[m] || ms[String(m)] || {};
        const v = Number(mm[valKey] || 0);
        monthData.push({m, v});
        if (v > maxVal) maxVal = v;
        const rj = isLead ? Number(mm.leadRJ || 0) : 0;
        rjByMonth.push(rj); rjYear += rj;
      }
      const totalYear = monthData.reduce((a,e)=>a+e.v,0);
      const curMonth = (D.meta && D.meta.month) || (new Date().getMonth()+1);
      // ${ic('lucide:calendar',16)} เดือน focus ตามช่วงวันที่ที่กรอง — เลือกเดือนล่าสุดในช่วง (cap ที่เดือนปัจจุบัน)
      const _rmList = [...new Set(rangeDays().map(x => x[0]))];
      const focusMonth = _rmList.length ? Math.min(_rmList[_rmList.length-1], curMonth) : curMonth;
      const focusVal = monthData[focusMonth-1].v;
      const prevVal  = focusMonth > 1 ? monthData[focusMonth-2].v : 0;
      const delta = focusVal - prevVal;
      const deltaPct = prevVal > 0 ? Math.round(delta/prevVal*1000)/10 : (focusVal>0 ? 999 : 0);
      const goodTrend = cfg.invert ? delta <= 0 : delta >= 0;
      const deltaCol = deltaPct === 0 ? 'var(--t3)' : goodTrend ? 'var(--green)' : 'var(--red)';

      // 📅 ค่าตามช่วงวันที่ที่กรองจริง (ไม่ใช่ทั้งเดือน) — ให้ตรงกับการ์ด KPI ที่กดเข้ามา
      const msRange = buildRangeMs();
      const _rangeField = {totalLeads:'leadNormal', totalFollow:'totalFollow', totalBookings:'totalBookings', totalDone:'totalDone', totalDealValue:'totalDealValue', leadRJ:'leadRJ'}[metricKey];
      const rangeVal = Number(msRange[_rangeField] || 0);
      const rangeRJ = isLead ? Number(msRange.leadRJ || 0) : 0;

      // Team breakdown (ตามช่วงที่กรอง)
      const teamData = msRange.teams || {};
      const teamRows = Object.entries(teamData)
        .filter(([tid]) => tid !== 'ADMIN')
        .map(([tid, t]) => {
          const teamKey = {
            'totalLeads':'leadNormal', 'totalFollow':'follow', 'totalBookings':'booking',
            'totalDone':'done', 'totalDealValue':'dealValue', 'leadRJ':null
          }[metricKey];
          const v = teamKey ? Number(t[teamKey] || 0) : 0;
          return {tid, v, rj: isLead ? Number(t.leadRJ || 0) : 0};
        })
        .filter(r => r.v > 0 || metricKey === 'leadRJ');

      // RJ ไม่มีใน team breakdown → ข้าม
      const showTeamSection = metricKey !== 'leadRJ' && teamRows.length > 0;
      const teamTotal = teamRows.reduce((a,r)=>a+r.v,0);

      const overlay = document.createElement('div');
      overlay.id = 'metric-detail-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1010;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

      let inner = `<div style="background:var(--bg);border-radius:16px;max-width:680px;width:100%;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.35)" onclick="event.stopPropagation()">`;
      // Header
      inner += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap">`;
      inner += `<div><div style="font-size:11px;color:var(--t3)">รายละเอียด · ${h(rangeLabelTH())}</div>`;
      inner += `<div style="font-size:18px;font-weight:800;color:${cfg.color}">${cfg.emoji} ${isLead ? 'Lead — ธรรมดา' : cfg.label}</div></div>`;
      inner += `<button onclick="document.getElementById('metric-detail-overlay').remove()" style="padding:6px 14px;border-radius:10px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);font-weight:600;font-size:12px;cursor:pointer">✕ ปิด</button>`;
      inner += `</div>`;

      // Big number + comparisons
      inner += `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">`;
      inner += `<div style="background:${cfg.color}1a;border-radius:10px;padding:12px;text-align:center"><div style="font-size:10px;color:var(--t3)">ช่วงที่เลือก</div><div style="font-size:22px;font-weight:800;color:${cfg.color}">${cfg.fmt(rangeVal)}</div></div>`;
      inner += `<div style="background:var(--bg2);border-radius:10px;padding:12px;text-align:center"><div style="font-size:10px;color:var(--t3)">${C.MONTHS_FULL[focusMonth-1]} (ทั้งเดือน)</div><div style="font-size:18px;font-weight:700;color:var(--t2)">${cfg.fmt(focusVal)}</div></div>`;
      if (deltaPct === 999) {
        inner += `<div style="background:var(--blue-bg);border-radius:10px;padding:12px;text-align:center"><div style="font-size:10px;color:var(--t3)">MoM</div><div style="font-size:18px;font-weight:800;color:var(--blue)">ใหม่</div></div>`;
      } else {
        const arrow = delta > 0 ? '↗' : delta < 0 ? '↘' : '→';
        const sign = delta > 0 ? '+' : '';
        inner += `<div style="background:${deltaCol}1a;border-radius:10px;padding:12px;text-align:center"><div style="font-size:10px;color:var(--t3)">MoM</div><div style="font-size:18px;font-weight:800;color:${deltaCol}">${arrow} ${sign}${deltaPct}%</div><div style="font-size:10px;color:var(--t3)">${sign}${cfg.fmt(Math.abs(delta))}</div></div>`;
      }
      inner += `</div>`;

      // RJ แยกต่างหาก (ต่อท้ายหลีดธรรมดา · ไม่นับใน Lead/Conv)
      if (isLead) {
        inner += `<div style="display:flex;align-items:center;gap:8px;background:var(--red-bg);border:.5px solid var(--red-mid);border-radius:10px;padding:9px 12px;margin-bottom:14px">`;
        inner += `<span style="font-size:11px;color:var(--t2)">${ic('lucide:triangle-alert',16)} RJ ในช่วงนี้ <span style="color:var(--t3)">(แยกต่างหาก — ไม่นับใน Lead/Conv)</span></span>`;
        inner += `<span style="margin-left:auto;font-size:17px;font-weight:800;color:var(--red)">${fmtNum(rangeRJ)}</span>`;
        inner += `<span style="font-size:10px;color:var(--t3)">ทั้งปี ${fmtNum(rjYear)}</span>`;
        inner += `</div>`;
      }

      // 12-month bar trend (หลีดธรรมดา)
      inner += `<div style="font-size:11px;color:var(--t3);font-weight:700;margin-bottom:6px">${ic('lucide:trending-up',16)} Trend ทั้งปี · ${isLead?'หลีดธรรมดา ':''}รวม ${cfg.fmt(totalYear)}</div>`;
      inner += `<div style="background:var(--bg2);border-radius:10px;padding:12px;margin-bottom:14px">`;
      inner += `<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:120px">`;
      monthData.forEach(({m, v}) => {
        const ratio = maxVal > 0 ? v/maxVal : 0;
        const h = Math.max(2, Math.round(ratio * 100));
        const isCur = m === focusMonth;
        const bg = isCur ? cfg.color : (cfg.color + '66');
        inner += `<div title="${C.MONTHS_FULL[m-1]}: ${cfg.fmt(v)}" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer" onclick="document.getElementById('metric-detail-overlay').remove();setDf(${m});render()">`;
        inner += `<div style="font-size:9px;color:var(--t3);margin-bottom:2px;${isCur?'font-weight:700;color:'+cfg.color:''}">${v>0?cfg.fmt(v).replace('฿',''):''}</div>`;
        inner += `<div style="width:100%;background:${bg};border-radius:3px 3px 0 0;height:${h}%"></div>`;
        inner += `</div>`;
      });
      inner += `</div>`;
      // Month labels
      inner += `<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:6px">`;
      monthData.forEach(({m}) => {
        const isCur = m === focusMonth;
        inner += `<div style="font-size:10px;text-align:center;color:${isCur?cfg.color:'var(--t3)'};font-weight:${isCur?700:400}">${C.MONTHS_SHORT[m-1]}</div>`;
      });
      inner += `</div>`;
      inner += `</div>`;

      // Team breakdown
      if (showTeamSection) {
        inner += `<div style="font-size:11px;color:var(--t3);font-weight:700;margin-bottom:6px">แยกตามทีม · ${C.MONTHS_FULL[focusMonth-1]}${isLead?' (หลีดธรรมดา)':''}</div>`;
        inner += `<div style="background:var(--bg2);border-radius:10px;padding:10px">`;
        teamRows.sort((a,b)=>b.v-a.v).forEach(r => {
          const ratio = teamTotal > 0 ? r.v/teamTotal : 0;
          const teamCol = C.TEAM_COLORS[r.tid] || 'var(--t3)';
          const teamName = C.TEAM_NAMES[r.tid] || r.tid;
          inner += `<div style="display:grid;grid-template-columns:80px 1fr 80px 50px;gap:8px;align-items:center;padding:5px 0">`;
          inner += `<span style="font-size:12px;font-weight:700;color:${teamCol}">${h(teamName)}</span>`;
          inner += `<div style="height:14px;background:var(--bg);border-radius:4px;overflow:hidden"><div style="height:100%;width:${ratio*100}%;background:${teamCol}"></div></div>`;
          inner += `<span style="font-size:12px;font-weight:600;text-align:right">${cfg.fmt(r.v)}${isLead && r.rj ? ` <span style="font-size:9px;color:var(--red);font-weight:500">+RJ${r.rj}</span>`:''}</span>`;
          inner += `<span style="font-size:11px;color:var(--t3);text-align:right">${Math.round(ratio*1000)/10}%</span>`;
          inner += `</div>`;
        });
        inner += `</div>`;
      }
      inner += `<div style="font-size:10px;color:var(--t3);margin-top:10px">หมายเหตุ:คลิกที่แท่งกราฟ trend → กรองไปเดือนนั้น</div>`;
      inner += `</div>`;
      overlay.innerHTML = inner;
      document.body.appendChild(overlay);
    }

    // ── Booking Detail Modal — กดที่แถวรถที่ปล่อย / รถจอง แล้วเปิด ──
    // แปลงวันที่: ชีต d/m/yyyy ↔ input type=date (YYYY-MM-DD)
    function _toISODate(s) {
      const p = String(s||'').trim().split('/');
      if (p.length < 2) return '';
      let d = parseInt(p[0]), m = parseInt(p[1]);
      let y = p.length >= 3 ? parseInt(p[2]) : (new Date()).getFullYear();
      if (!d || !m || !y) return '';
      if (y < 100) y += (y > 50 ? 2500 : 2000);   // 2 หลัก
      if (y > 2500) y -= 543;                       // พ.ศ. → ค.ศ.
      if (y < 2020 || y > 2035) return '';          // ปีพัง (1969) → ไม่ pre-fill
      return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }
    function _fromISODate(s) {
      const p = String(s||'').trim().split('-');
      if (p.length < 3) return '';
      const y = parseInt(p[0]), m = parseInt(p[1]), d = parseInt(p[2]);
      if (!y || !m || !d) return '';
      return `${d}/${m}/${y}`;   // ค.ศ. 4 หลัก ไม่มี 0 นำ (ตรงรูปแบบในชีต)
    }

    // แถวแก้วันที่ timeline (date picker + ปุ่มบันทึก) — col = คอลัมน์ในชีต (14=เซ็น · 19=ผล · releaseCol=ปล่อย)
    function _dateEditRow(label, curVal, col, idx, hint) {
      return `
            <div style="display:grid;grid-template-columns:130px 1fr;gap:10px;padding:7px 0;border-bottom:.5px solid var(--bd)">
              <div style="font-size:11px;color:var(--t3);font-weight:600;padding-top:6px">✏️ ${h(label)}</div>
              <div>
                <div style="display:flex;gap:6px;align-items:center">
                  <input type="date" id="td-${col}" value="${_toISODate(curVal||'')}" style="flex:1;min-width:0;padding:6px 9px;border:.5px solid var(--bd2);border-radius:8px;background:var(--bg2);color:var(--t1);font-size:12px">
                  <button onclick="saveTimelineDate(${idx},${col})" style="padding:6px 13px;border-radius:8px;border:none;background:var(--green);color:#fff;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap">บันทึก</button>
                </div>
                <div id="tdmsg-${col}" style="font-size:10px;color:var(--t3);padding:3px 0 0">${hint ? h(hint) : ''}</div>
              </div>
            </div>`;
    }

    function openBookingDetail(idx) {
      const b = (D.bookingCases || [])[idx];
      if (!b) return;
      const old = document.getElementById('book-detail-overlay');
      if (old) old.remove();

      const overlay = document.createElement('div');
      overlay.id = 'book-detail-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1010;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

      const row = (label, value, opts={}) => {
        if (value == null || value === '' || value === '-') return '';
        const mono = opts.mono ? 'font-family:monospace;' : '';
        const wrap = opts.wrap ? 'white-space:pre-wrap;word-break:break-word;' : '';
        const disp = (typeof value === 'number') ? value.toLocaleString() : h(value);
        return `<div style="display:grid;grid-template-columns:130px 1fr;gap:10px;padding:7px 0;border-bottom:.5px solid var(--bd)">
          <div style="font-size:11px;color:var(--t3);font-weight:600">${h(label)}</div>
          <div style="font-size:12px;color:var(--t1);${mono}${wrap}">${disp}</div>
        </div>`;
      };

      const statusColor = (C.STATUS_COLOR||{})[b.status] || '#888';
      const phoneClean = (b.phone||'').replace(/[^0-9+]/g, '');
      const callLink = phoneClean
        ? `<a href="tel:${phoneClean}" style="background:var(--green);color:#fff;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none">${ic('lucide:phone',16)} โทร ${h(b.phone)}</a>` : '';

      // คำนวณ "เก่ากี่วันแล้ว" — เทียบจากวันที่จอง/ปล่อย ใกล้สุดที่ parse ได้ กับวันนี้
      const parseDmy = (s) => {
        const p = String(s||'').split('/');
        if (p.length < 3) return null;
        let y = parseInt(p[2]);
        if (y < 100) y += (y > 50 ? 2500 : 2000);
        if (y > 2500) y -= 543;
        const d = new Date(y, (parseInt(p[1])||1)-1, parseInt(p[0])||1);
        return isNaN(d) ? null : d;
      };
      const ageDays = (dateStr) => {
        const d = parseDmy(dateStr);
        if (!d) return null;
        return Math.floor((Date.now() - d.getTime()) / 86400000);
      };
      const bookAge = ageDays(b.date);
      const releaseAge = ageDays(b.releaseDate);
      const ageBadge = (n, lbl) => {
        if (n == null) return '';
        const col = n > 90 ? 'var(--red)' : n > 30 ? 'var(--amber)' : 'var(--green-mid)';
        return `<span style="display:inline-block;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;font-size:10px;font-weight:600;margin-left:6px">${lbl} ${n} วันก่อน</span>`;
      };

      // inline edit วันที่ timeline — แอดมิน + รู้ตำแหน่งในชีต (เซ็น/ผล/ปล่อย)
      const _canEdit = (typeof isAdmin !== 'undefined' && isAdmin) && b.sheetTab && b.sheetRow;

    // บันทึกวันที่ timeline กลับชีต (เซ็น/ผล/ปล่อย — col=คอลัมน์) · แอดมิน
    async function saveTimelineDate(idx, col) {
      const b = (D.bookingCases || [])[idx];
      if (!b) return;
      const inp = document.getElementById('td-' + col);
      const msg = document.getElementById('tdmsg-' + col);
      if (!inp) return;
      const val = _fromISODate(inp.value);   // type=date → d/m/yyyy สำหรับชีต (ว่าง = ลบ)
      if (val && !/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(val)) {
        if (msg) { msg.textContent = '⚠ วันที่ไม่ถูกต้อง'; msg.style.color = 'var(--red)'; }
        return;
      }
      if (msg) { msg.textContent = 'กำลังบันทึก...'; msg.style.color = 'var(--t3)'; }
      try {
        const res = await fetch('/api/admin/update_release_date', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({tab: b.sheetTab, row: parseInt(b.sheetRow), col: col, value: val})
        });
        const d = await res.json();
        if (!res.ok || !d.ok) {
          if (msg) { msg.textContent = '⚠ ' + (d.error || 'บันทึกไม่สำเร็จ'); msg.style.color = 'var(--red)'; }
          return;
        }
        if (msg) { msg.textContent = '✓ บันทึกลงชีตแล้ว'; msg.style.color = 'var(--green-mid)'; }
        // optimistic — map col → field
        if (col === 14) b.signDate = val;
        else if (col === 18) b.docsDate = val;
        else if (col === 19) b.resultDate = val;
        else { b.releaseDatePrimary = val; if (val) b.releaseDate = val; }
      } catch (e) {
        if (msg) { msg.textContent = '⚠ error: ' + e; msg.style.color = 'var(--red)'; }
      }
    }

    // ── Car Detail Modal — กดที่รถใน Lead car table แล้วเปิด ──
    function openCarDetail(car) {
      // ปิด modal เก่า
      const old = document.getElementById('car-detail-overlay');
      if (old) old.remove();

      const periodLbl = '📅 '+rangeLabelTH();
      const carLower = String(car).toLowerCase();

      // ── Lead per seller (จาก leadCarSellerMonth — exact match key) ──
      const leadMap = (D.leadCarSellerMonth || {})[car] || {};

      // ── Booking + ปล่อย per seller (substring match จาก bookingCases) ──
      const bookSellerMap = {};  // seller → {booked, done, dealValue}
      (D.bookingCases || []).forEach(b => {
        if (!b.car || !b.seller) return;
        if (!b.car.toLowerCase().includes(carLower)) return;
        if (!ir(b.releaseDate || b.date || '')) return;   // ${ic('lucide:calendar',16)} กรองตามช่วงวันที่
        if (!bookSellerMap[b.seller]) bookSellerMap[b.seller] = {booked:0, done:0, dealValue:0};
        const ent = bookSellerMap[b.seller];
        if (['จอง','รอเซ็นต์','รอผล','รอปล่อย','ปล่อย'].includes(b.status)) {
          ent.booked++;
          if (b.status === 'ปล่อย') {
            ent.done++;
            ent.dealValue += b.price || 0;
          }
        }
      });

      // ── รวม seller จากทั้ง 2 แหล่ง ──
      const _rmMonths = [...new Set(rangeDays().map(x => x[0]))];   // ${ic('lucide:calendar',16)} เดือนในช่วง
      const allSellers = new Set([...Object.keys(leadMap), ...Object.keys(bookSellerMap)]);
      const rows = Array.from(allSellers).map(seller => {
        const lm = leadMap[seller] || {total:0, byMonth:[]};
        const leadCount = _rmMonths.reduce((a,m) => a + (lm.byMonth?.[m] || 0), 0);   // ${ic('lucide:calendar',16)} รวมเดือนในช่วง
        const bm = bookSellerMap[seller] || {booked:0, done:0, dealValue:0};
        const sellerObj = (D.sellers || []).find(s => s.name === seller);
        const team = sellerObj?.team || '?';
        const convPct = leadCount > 0 ? Math.round(bm.done/leadCount*1000)/10 : 0;   // Conv = ปล่อย ÷ lead (ไม่ใช่จอง)
        return {seller, team, lead:leadCount, booked:bm.booked, done:bm.done, dealValue:bm.dealValue, convPct};
      }).filter(r => r.lead > 0 || r.booked > 0).sort((a,b) => b.lead - a.lead || b.done - a.done);

      const sumLead = rows.reduce((a,r)=>a+r.lead,0);
      const sumBook = rows.reduce((a,r)=>a+r.booked,0);
      const sumDone = rows.reduce((a,r)=>a+r.done,0);
      const sumDeal = rows.reduce((a,r)=>a+r.dealValue,0);

      const overlay = document.createElement('div');

      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto';

      let inner = `<div style="background:var(--bg);border-radius:16px;max-width:780px;width:100%;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.35)" onclick="event.stopPropagation()">`;
      inner += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap">`;
      inner += `<div><div style="font-size:11px;color:var(--t3)">รายละเอียดรถ · ${h(periodLbl)}</div><div style="font-size:18px;font-weight:800;color:var(--blue)">${ic('lucide:car-front',16)} ${h(car)}</div></div>`;
      inner += `<button onclick="document.getElementById('car-detail-overlay').remove()" style="padding:6px 14px;border-radius:10px;border:.5px solid var(--bd2);background:var(--bg2);color:var(--t2);font-weight:600;font-size:12px;cursor:pointer">✕ ปิด</button>`;
      inner += `</div>`;

      // Summary stat cards
      inner += `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">`;
      inner += `<div style="background:var(--blue-bg);border-radius:10px;padding:10px;text-align:center"><div style="font-size:10px;color:var(--t3)">รับ Lead</div><div style="font-size:18px;font-weight:800;color:var(--blue)">${sumLead}</div></div>`;
      inner += `<div style="background:var(--amber-bg);border-radius:10px;padding:10px;text-align:center"><div style="font-size:10px;color:var(--t3)">จอง</div><div style="font-size:18px;font-weight:800;color:var(--amber)">${sumBook}</div></div>`;
      inner += `<div style="background:var(--green-bg);border-radius:10px;padding:10px;text-align:center"><div style="font-size:10px;color:var(--t3)">ปล่อย</div><div style="font-size:18px;font-weight:800;color:var(--green-mid)">${sumDone}</div></div>`;
      inner += `<div style="background:var(--green-bg);border-radius:10px;padding:10px;text-align:center"><div style="font-size:10px;color:var(--t3)">ยอดปล่อย</div><div style="font-size:15px;font-weight:800;color:var(--green-mid)">${fmtBaht(sumDeal)}</div></div>`;
      inner += `</div>`;

      if (rows.length === 0) {
        inner += `<div style="text-align:center;color:var(--t3);padding:24px;font-size:13px">ไม่มีข้อมูลในช่วงนี้</div>`;
      } else {
        inner += `<div style="font-size:11px;color:var(--t3);margin-bottom:6px">จำนวน Lead / จอง / ปล่อย / ยอดปล่อย แยกตามเซลล์</div>`;
        inner += `<div class="shdr" style="grid-template-columns:1.4fr .8fr .7fr .7fr 1fr 1fr"><span>เซลล์</span><span style="text-align:right">Lead</span><span style="text-align:right">จอง</span><span style="text-align:right">ปล่อย</span><span style="text-align:right">Conv%</span><span style="text-align:right">฿ ปล่อย</span></div>`;
        inner += `<div style="max-height:380px;overflow-y:auto">`;
        rows.forEach(r => {
          const tCol = C.TEAM_COLORS[r.team] || 'var(--t3)';
          inner += `<div class="srow" style="grid-template-columns:1.4fr .8fr .7fr .7fr 1fr 1fr;cursor:pointer" onclick="document.getElementById('car-detail-overlay').remove();switchToSeller('${h(r.seller)}')">`;
          inner += `<span style="font-weight:600">${h(r.seller)}<span style="font-size:9px;padding:1px 4px;border-radius:4px;background:${tCol};color:#fff;margin-left:4px">${r.team}</span></span>`;
          inner += `<span style="text-align:right;color:var(--blue);font-weight:600">${r.lead}</span>`;
          inner += `<span style="text-align:right;color:var(--amber)">${r.booked||'-'}</span>`;
          inner += `<span style="text-align:right;color:var(--green-mid);font-weight:600">${r.done||'-'}</span>`;
          inner += `<span style="text-align:right;color:var(--t3);font-size:11px">${r.lead>0?r.convPct+'%':'-'}</span>`;
          inner += `<span style="text-align:right;color:var(--green-mid)">${r.dealValue>0?fmtBaht(r.dealValue):'-'}</span>`;
          inner += `</div>`;
        });
        inner += `</div>`;
      }
      inner += `<div style="font-size:10px;color:var(--t3);margin-top:10px;line-height:1.5">หมายเหตุ:Lead นับจากชื่อรถใน lead sheet · จอง/ปล่อย นับจากรายการจองที่รุ่นรถมีคำว่า "${h(car)}" (case-insensitive)</div>`;
      inner += `</div>`;
      overlay.innerHTML = inner;
      document.body.appendChild(overlay);

    // ── Team Done Detail modal — แสดงรายชื่อเซลล์ในทีม + เคสปล่อยของแต่ละคน ──
    function openTeamDoneDetail(tid) {
      const old = document.getElementById('team-done-overlay');
      if (old) old.remove();

      const team = (D.teams || {})[tid];
      if (!team) return;
      const teamName = (C.TEAM_NAMES || {})[tid] || tid;
      const teamColor = (C.TEAM_COLORS || {})[tid] || 'var(--t3)';
      const periodLbl = '📅 '+rangeLabelTH();
      const ms = buildRangeMs();   // ${ic('lucide:calendar',16)} ตามช่วงวันที่

      // คำนวณ done + dealValue ต่อเซลล์ในทีมนี้
      const members = team.members || [];
      const sellerStats = members.map(name => {
        const msd = ms?.sellers?.[name];
        const sd = (D.sellers || []).find(x => x.name === name) || {};
        const done = msd ? (msd.done || 0) : (sd.done || 0);
        const dealValue = msd ? (msd.dealValue || 0) : (sd.dealValue || 0);
        const target = (sd.target || 0) * rangeMonthCount();   // ${ic('lucide:calendar',16)} เป้ารายเดือน × จำนวนเดือนในช่วง
        return { name, done, dealValue, target };
      }).sort((a,b) => b.done - a.done);

      const totalDone = sellerStats.reduce((a,s) => a + s.done, 0);
      const totalDealValue = sellerStats.reduce((a,s) => a + s.dealValue, 0);
      const totalTarget = (team.target || 0) * rangeMonthCount();

      // เคสปล่อยจริงของทีมนี้ — filter จาก bookingCases ตาม period + sellerในทีม
      const memberSet = new Set(members);
      const releasedCases = (D.bookingCases || []).filter(b => {

        if (!ir(b.releaseDate || b.date || '')) return false;
        return true;
