{% load static %}<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ — Oxlet Dashboard</title>
  <link rel="icon" type="image/png" href="{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}">
  <link rel="apple-touch-icon" href="{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}">
  <link rel="stylesheet" href="{% static 'dashboard/css/globals.css' %}?v=20260604b">
  <script>(function(){try{var t=localStorage.getItem('oxlet_theme');if(!t)t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px; }
    .login-box { background:var(--bg); border-radius:16px; padding:28px 26px; max-width:380px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,.25); }
    .login-hd { text-align:center; margin-bottom:20px; }
    .login-hd img { height:44px; margin-bottom:10px; }
    .login-hd h1 { font-size:18px; font-weight:800; color:var(--t1); margin:0 0 4px; }
    .login-hd .sub { font-size:12px; color:var(--t3); }
    .field { margin-bottom:14px; }
    .field label { display:block; font-size:11px; color:var(--t2); font-weight:600; margin-bottom:5px; }
    .field input { width:100%; padding:10px 12px; border:.5px solid var(--bd2); border-radius:10px; background:var(--bg2); color:var(--t1); font-size:13px; outline:none; box-sizing:border-box; }
    .field input:focus { border-color:var(--blue); }
    .divider { display:flex; align-items:center; gap:8px; margin:14px 0; color:var(--t3); font-size:11px; }
    .divider::before, .divider::after { content:''; flex:1; height:.5px; background:var(--bd); }
    .btn-primary { width:100%; padding:10px; border-radius:10px; border:none; background:var(--blue); color:#fff; font-weight:700; font-size:13px; cursor:pointer; }
    .btn-primary:hover { filter:brightness(1.05); }
    .err { background:var(--red-bg); color:var(--red); padding:8px 12px; border-radius:10px; font-size:12px; margin-bottom:14px; border:.5px solid var(--red-mid); }
    .foot { text-align:center; margin-top:16px; font-size:12px; color:var(--t3); }
    .foot a { color:var(--blue); font-weight:700; text-decoration:none; }
    details { margin-top:16px; }
    details summary { font-size:12px; color:var(--t3); cursor:pointer; list-style:none; text-align:center; }
    details summary::-webkit-details-marker { display:none; }
    .sub-box { margin-top:12px; padding:14px; background:var(--bg2); border-radius:10px; }
  </style>
</head>
<body>
<div class="login-box">
  <div class="login-hd">
    <img src="{% static 'dashboard/image/be5ed0ab0a42c5a16bb363accb14c1d8.png' %}" alt="Oxlet">
    <h1>เข้าสู่ระบบ</h1>
    <div class="sub">Oxlet Sales Dashboard</div>
  </div>

  {% if error %}<div class="err">{{ error }}</div>{% endif %}

  <!-- ทางหลัก: อีเมล + รหัสผ่าน (สมาชิกที่ผ่านการอนุมัติ) -->
  <form method="post" action="/login/">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next|default:'/dashboard/' }}">
    <div class="field">
      <label>อีเมล</label>
      <input type="email" name="email" autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>รหัสผ่าน</label>
      <input type="password" name="password" autocomplete="current-password" placeholder="รหัสผ่าน">
    </div>
    <button type="submit" class="btn-primary">เข้าสู่ระบบ</button>
  </form>

  <div class="foot">ยังไม่มีบัญชี? <a href="/register/">สมัครสมาชิก</a></div>

  <!-- ทางสำรอง: แอดมินระบบ (env) / LINE user_id -->
  <details>
    <summary>▸ เข้าสู่ระบบด้วยวิธีอื่น (แอดมินระบบ / LINE)</summary>
    <div class="sub-box">
      <form method="post" action="/login/">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next|default:'/dashboard/' }}">
        <div class="field">
          <label>ชื่อผู้ใช้แอดมินระบบ</label>
          <input type="text" name="username" autocomplete="off" placeholder="admin">
        </div>
        <div class="field">
          <label>รหัสผ่านแอดมินระบบ</label>
          <input type="password" name="password" autocomplete="off" placeholder="รหัสผ่านแอดมินระบบ">
        </div>
        <div class="divider">หรือ</div>
        <div class="field">
          <label>LINE user_id (ผู้บริหาร / เซลล์)</label>
          <input type="text" name="token" autocomplete="off" placeholder="U xxxxxxxxxxxxxxxx">
        </div>
        <button type="submit" class="btn-primary">เข้าสู่ระบบ (สำรอง)</button>
      </form>
    </div>
  </details>
</div>
</body>
</html>
